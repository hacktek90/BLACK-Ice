name: Auto Merge tikpages to main

on:
  push:
    branches:
      - codex/create-news-html-in-/blog-folder

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge tikpages into main
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout main
          git merge origin/tikpages --no-edit
          git push origin main
