<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Not Found</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600&display=swap" rel="stylesheet">

<script>
    tailwind.config = {
        theme: {
            extend: {
                fontFamily: {
                    sans: ['"Inter Tight"', 'sans-serif'],
                },
                colors: {
                    'swiss-red': '#FF3333',
                }
            }
        }
    }
</script>

<style>
    body {
        background-color: #F4F4F4;
        color: #111;
    }
    .grid-line {
        position: absolute;
        background-color: rgba(0,0,0,0.06);
        pointer-events: none;
        z-index: 0;
    }
</style>
</head>
<body class="min-h-screen w-screen overflow-hidden relative selection:bg-black selection:text-white flex flex-col">

    <!-- THE GRID SYSTEM (Visualized) -->
    <!-- Vertical Lines (Hidden on mobile to reduce noise) -->
    <div class="hidden md:block grid-line top-0 bottom-0 left-[25%] w-px"></div>
    <div class="hidden md:block grid-line top-0 bottom-0 left-[50%] w-px"></div>
    <div class="hidden md:block grid-line top-0 bottom-0 left-[75%] w-px"></div>
    <!-- Horizontal Lines -->
    <div class="grid-line left-0 right-0 top-[100px] h-px"></div>
    <div class="grid-line left-0 right-0 bottom-[100px] h-px hidden md:block"></div>

    <!-- MAIN CONTAINER -->
    <main class="relative z-10 flex-grow w-full max-w-[1600px] mx-auto flex flex-col md:grid md:grid-cols-4 md:grid-rows-[100px_1fr]">

        <!-- HEADER -->
        <header class="h-[100px] col-span-4 px-6 md:px-12 flex items-center justify-between shrink-0">
            <div class="text-sm font-medium tracking-tight flex items-center gap-2">
                <span class="w-2 h-2 bg-swiss-red rounded-full animate-pulse"></span>
                SYSTEM STATUS: 404
            </div>
            <!-- Hidden on mobile to save space -->
            <div class="text-xs uppercase tracking-widest text-gray-400 hidden md:block">
                Coordinates: Missing
            </div>
        </header>

        <!-- CONTENT AREA -->
        <!-- Stacked on mobile (flex-col), Side-by-side on desktop (grid) -->
        <div class="flex-grow flex flex-col md:flex-row col-span-4 h-full">

            <!-- Left: The "404" Type -->
            <div class="w-full md:w-1/2 px-6 md:px-12 flex flex-col justify-center py-10 md:py-0 border-r-0 md:border-r border-black/5">
                <!-- Responsive Text Size: 8rem on mobile, 18rem on desktop -->
                <h1 class="text-[8rem] sm:text-[12rem] md:text-[16rem] lg:text-[18rem] leading-[0.8] font-medium tracking-tighter -ml-1 md:-ml-4 text-center md:text-left select-none">
                    404
                </h1>
            </div>

            <!-- Right: The Explanation & Action -->
            <div class="w-full md:w-1/2 px-6 md:px-12 flex flex-col justify-center items-center md:items-start space-y-8 md:space-y-12 pb-12 md:pb-0">
                
                <div class="space-y-4 md:space-y-6 max-w-md text-center md:text-left">
                    <h2 class="text-2xl sm:text-3xl md:text-4xl font-normal leading-tight">
                        The requested object<br>
                        <span class="text-gray-400">could not be located.</span>
                    </h2>
                    
                    <div class="h-px w-12 bg-black mx-auto md:mx-0"></div>
                    
                    <p class="text-sm md:text-base text-gray-600 leading-relaxed px-4 md:px-0">
                        The URL you entered is either incorrect or the page has been moved. Please navigate back to the index.
                    </p>
                </div>

                <div class="flex flex-col items-center md:items-start gap-6 w-full md:w-auto">
                    <!-- Main Button -->
                    <a href="/" class="w-full md:w-auto text-center group flex items-center justify-center md:justify-start gap-4 text-lg font-medium hover:text-swiss-red transition-colors py-3 md:py-0">
                        <span class="hidden md:block w-8 h-px bg-black group-hover:bg-swiss-red transition-colors"></span>
                        Return Index
                    </a>
                    
                    <!-- Secondary Button -->
                    <button onclick="history.back()" class="w-full md:w-auto text-center group flex items-center justify-center md:justify-start gap-4 text-sm text-gray-500 hover:text-black transition-colors py-2 md:py-0">
                        <span class="hidden md:block w-8 h-px bg-gray-300 group-hover:bg-black transition-colors"></span>
                        Go Back
                    </button>
                </div>
            </div>
            
        </div>

    </main>

    <!-- Decorative Element (Hidden on small mobiles to prevent overlay issues) -->
    <div class="hidden sm:flex fixed bottom-8 right-8 md:bottom-12 md:right-12 w-24 h-24 md:w-32 md:h-32 border border-black/10 rounded-full items-center justify-center animate-[spin_10s_linear_infinite] pointer-events-none">
        <div class="w-full h-px bg-black/10"></div>
        <div class="absolute h-full w-px bg-black/10"></div>
    </div>

</body>
</html>
