



<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Home Screen</title>

<link rel="preconnect" href="https://black-ice-3dbk.onrender.com" crossorigin>
<link rel="dns-prefetch" href="//black-ice-3dbk.onrender.com">

<style>
  :root{
    --topbar: 56px;
    --bg: #f7f8fb;
    --surface: #ffffff;
    --surface-2: #fafbff;
    --text: #111827;
    --muted: #6b7280;
    --border: #e5e7eb;
    --hover: #f3f4f6;
    --accent: #2563eb;
    --ring: 0 0 0 4px rgba(37,99,235,.18);
    --shadow-sm: 0 1px 2px rgba(0,0,0,.06);
    --shadow-md: 0 10px 24px rgba(0,0,0,.12);
    --radius: 14px;
    --sidebar-w: 300px;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, "Helvetica Neue", Arial;
    line-height:1.45;
  }

  .topbar{
    height: var(--topbar);
    position: sticky; top:0; z-index: 100;
    display:flex; align-items:center; gap:12px;
    padding:10px 16px;
    background:var(--surface);
    border-bottom:1px solid var(--border);
    box-shadow: var(--shadow-sm);
  }
  .brand{ font-weight:650; letter-spacing:.2px; }

  #toggleSidebar{
    width:40px; height:40px;
    border-radius:10px;
    background:var(--surface);
    border:1px solid var(--border);
    color:var(--text);
    font-size:20px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; transition:.2s;
  }
  #toggleSidebar:hover{ background:var(--hover); }
  #toggleSidebar:focus-visible{ outline:none; box-shadow: var(--ring); }

  nav.sidebar{
    position: fixed;
    inset: var(--topbar) auto 0 0;
    width: var(--sidebar-w);
    z-index: 120;
    background:var(--surface);
    border-right:1px solid var(--border);
    padding:16px;
    overflow-y:auto;
    transform: translateX(-100%);
    transition: transform .3s ease;
    box-shadow: var(--shadow-md);
  }
  nav.sidebar.open{ transform: translateX(0); }

  .side-hd{ font-weight:650; margin-bottom:8px; }
  .side-search{ position:relative; margin-bottom:12px; }
  .side-search input{
    width:100%; height:38px; padding:0 12px 0 40px;
    border:1px solid var(--border); border-radius:10px;
    background:var(--surface-2); color:var(--text);
  }
  .side-search input:focus{ outline:none; border-color:var(--accent); box-shadow: var(--ring); }
  .side-search .icon{
    position:absolute; top:10px; left:12px; width:18px; height:18px; color:#6b7280;
    pointer-events:none;
  }

  .list{ list-style:none; padding:0; margin:0; }

  .item-row{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:8px;
  }

  .item button.project-btn{
    flex:1;
    display:flex; align-items:start; gap:10px;
    padding:10px 10px;
    border-radius:10px;
    background:transparent;
    color:var(--text);
    border:1px solid transparent;
    cursor:pointer; text-align:left;
    transition:.15s;
  }
  .item button.project-btn:hover{
    background:var(--hover); border-color:var(--border);
  }
  .item button.project-btn.active{
    background:var(--hover); border-color:var(--accent);
  }

  .copy-btn{
    font-size:.75rem;
    padding:4px 8px;
    border-radius:8px;
    border:1px solid var(--border);
    background:var(--surface-2);
    cursor:pointer;
    color:var(--muted);
    white-space:nowrap;
    margin-top:10px;
  }
  .copy-btn:hover{
    background:var(--hover);
    color:var(--text);
  }
  .copy-btn:focus-visible{
    outline:none;
    box-shadow:var(--ring);
  }

  .title{ font-weight:600; line-height:1.25; }
  .meta{ color:var(--muted); font-size:.85rem; }

  .frame-wrap{
    position:relative;
    height: calc(100vh - var(--topbar));
    background:#fff;
  }
  iframe.portal{
    position:absolute; inset:0;
    width:100%; height:100%;
    border:0; display:block; background:#fff;
  }
  /* Skeleton loader */
.skeleton {
  background: linear-gradient(90deg, #eeeeee 25%, #f5f5f5 37%, #eeeeee 63%);
  background-size: 400% 100%;
  animation: skeleton-loading 1.4s ease infinite;
}

@keyframes skeleton-loading {
  0% { background-position: 100% 0; }
  100% { background-position: -100% 0; }
}

.skel-item {
  height: 48px;
  border-radius: 10px;
  margin-bottom: 10px;
}
.skel-copy {
  height: 18px;
  width: 70px;
  border-radius: 8px;
  margin-top: -4px;
}
/* right-end toggle */
.icon-btn,
#hideNavbar{
  width:40px; height:40px;
  border-radius:10px;
  background:var(--surface);
  border:1px solid var(--border);
  color:var(--text);
  font-size:20px;
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; transition:.2s;
}
#hideNavbar:hover{ background:var(--hover); }
#hideNavbar:focus-visible{ outline:none; box-shadow: var(--ring); }

/* collapse top bar via CSS variable so dependent layout updates */
body.nav-hidden{ --topbar: 0px; }

/* remove bar visuals when collapsed */
body.nav-hidden .topbar{
  padding:0; border:0; box-shadow:none; overflow:hidden;
}

/* keep the toggle reachable while bar is hidden */
body.nav-hidden #hideNavbar{
  position: fixed;
  top: 8px; right: 16px;
  z-index: 130;
}

nav.sidebar {
  position: fixed;
  inset: var(--topbar) auto 0 0;
  width: var(--sidebar-w);
  z-index: 120;
  /* Make sidebar transparent */
  background: ;/* ← changed from var(--surface) */
  border-right: 1px solid var(--border);
  padding: 16px;
  overflow-y: auto;
  transform: translateX(-100%);
  transition: transform .3s ease;
  box-shadow: var(--shadow-md);
}

</style>
</head>

<body>

<header class="topbar">
  <button id="toggleSidebar" aria-label="Toggle project list" aria-expanded="false">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" 
         stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="3" y1="6" x2="21" y2="6"></line>
      <line x1="3" y1="12" x2="21" y2="12"></line>
      <line x1="3" y1="18" x2="21" y2="18"></line>
    </svg>
  </button>
 <div class="brand" id="goHome" style="cursor:pointer;">Home Screen</div><button id="hideNavbar" class="icon-btn" aria-pressed="false" title="Hide navbar" style="margin-left:auto;">
  <!-- chevron-up icon -->
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none"
       stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="18 15 12 9 6 15"></polyline>
  </svg>
</button>


</header>

<nav id="sidebar" class="sidebar" hidden>
  <div class="side-hd">Free Tool Projects</div>

  <div class="side-search">
    <svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" stroke="currentColor" fill="none"/><line x1="16.65" y1="16.65" x2="21" y2="21" stroke="currentColor"/></svg>
    <input id="searchInput" type="search" placeholder="Search projects..." autocomplete="off" />
  </div>

  <ul id="projectList" class="list">

  <!-- Skeleton template (shows before Firebase loads) -->
  <div id="skeletonLoader">
    <div class="skeleton skel-item"></div>
    <div class="skeleton skel-item"></div>
    <div class="skeleton skel-item"></div>
    <div class="skeleton skel-item"></div>
    <div class="skeleton skel-item"></div>
  </div>

</ul>

</nav>

<main>
  <div class="frame-wrap">
      <div id="offlineBox"
     style="display:none; text-align:center; padding:25px; font-size:18px; color:#b91c1c;
            background:#fee2e2; border:1px solid #fecaca;">
  ❌ No Internet Connection
</div>

    <iframe id="portalFrame" class="portal"
      src="https://black-ice-3dbk.onrender.com/"
      allow="fullscreen; clipboard-read; clipboard-write; geolocation; microphone; camera"></iframe>
  </div>
</main>

<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
  import { getDatabase, ref, onValue } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';

  const firebaseConfig = {
    apiKey: "AIzaSyAp9kCBsDLnQEmR7wWHXwt3FB2T1zDtiqU",
    authDomain: "h-90-8a7c5.firebaseapp.com",
    databaseURL: "https://h-90-8a7c5-default-rtdb.firebaseio.com",
    projectId: "h-90-8a7c5",
    storageBucket: "h-90-8a7c5.firebasestorage.app",
    messagingSenderId: "367196609301",
    appId: "1:367196609301:web:156e24c1b4532c26af671c"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  const sidebar = document.querySelector('#sidebar');
  const toggleBtn = document.querySelector('#toggleSidebar');
  const projectList = document.querySelector('#projectList');
  const searchInput = document.querySelector('#searchInput');
  const frame = document.querySelector('#portalFrame');

  const setSidebar = (open)=>{
    sidebar.classList.toggle('open', !!open);
    sidebar.hidden = !open;
    toggleBtn.setAttribute('aria-expanded', !!open);
  };
  setSidebar(false);
  toggleBtn.addEventListener('click', ()=> setSidebar(!sidebar.classList.contains('open')));

  const sanitizeHTML = (str)=>{
    const d = document.createElement('div');
    d.textContent = str ?? '';
    return d.innerHTML;
  };

  const timeAgo = (ts)=>{
    if (!ts) return '';
    const rtf = new Intl.RelativeTimeFormat(undefined,{numeric:'auto'});
    const diff = ts - Date.now();
    const steps = [
      ['year',   1000*60*60*24*365],
      ['month',  1000*60*60*24*30],
      ['week',   1000*60*60*24*7],
      ['day',    1000*60*60*24],
      ['hour',   1000*60*60],
      ['minute', 1000*60],
      ['second', 1000],
    ];
    for (const [unit, ms] of steps){
      const val = Math.round(diff/ms);
      if (Math.abs(val) >= 1) return rtf.format(val, unit);
    }
    return rtf.format(0,'second');
  };

  let allSites = [];
  let queryText = '';

  const renderList = ()=>{
    let list = allSites.slice();

    if (queryText){
      const q = queryText.toLowerCase();
      list = list.filter(s => 
        (s.title || '').toLowerCase().includes(q) || 
        (s.description || '').toLowerCase().includes(q)
      );
    }

    if (!list.length){
      projectList.innerHTML = `<li class="item"><div>No matches</div></li>`;
      return;
    }

    projectList.innerHTML = list.map(site => {
      const safeTitle = sanitizeHTML(site.title);
      const safeUrl = sanitizeHTML(site.url);
      const when = site.timestamp ? timeAgo(site.timestamp) : "";
      return `
        <li class="item item-row">
          <button type="button" class="project-btn" data-url="${safeUrl}">
            <div>
              <div class="title">${safeTitle}</div>
              ${when ? `<div class="meta">${sanitizeHTML(when)}</div>` : ""}
            </div>
          </button>
          <button class="copy-btn" data-copy="${safeUrl}">or Copylink</button>
        </li>
      `;
    }).join("");

    projectList.querySelectorAll('.project-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        frame.src = btn.dataset.url;
        projectList.querySelectorAll('.project-btn.active').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
        setSidebar(false);
      });
    });

    projectList.querySelectorAll('.copy-btn').forEach(btn=>{
      btn.addEventListener('click', (e)=>{
        e.stopPropagation();
        const url = btn.dataset.copy;
        navigator.clipboard.writeText(url).then(()=>{
          btn.textContent = "Copied!";
          setTimeout(()=> btn.textContent = "Copy", 900);
        });
      });
    });
  };

  searchInput.addEventListener('input', (e)=>{
    queryText = e.target.value.trim();
    renderList();
  });

  onValue(ref(db, 'sites'), snapshot=>{
    const sites = snapshot.val();
    if (!sites){
      projectList.innerHTML = `<li>No projects yet</li>`;
      return;
    }
    allSites = Object.entries(sites).map(([id, site])=>({
      id,
      title: site.title || "Untitled",
      url: site.url || "#",
      timestamp: site.timestamp || 0,
      description: site.description || ""
    }));
    allSites.sort((a,b)=> (b.timestamp || 0) - (a.timestamp || 0));
    renderList();
  });
  document.querySelector("#goHome").addEventListener("click", () => {
  frame.src = "https://black-ice-3dbk.onrender.com/";
});
/* -------------------------------
   OFFLINE + FIRST-TIME PAGE CACHE
-------------------------------- */
const offlineBox = document.getElementById("offlineBox");
const mainFrame = document.getElementById("portalFrame");

async function checkNetworkAndCache() {
  if (!navigator.onLine) {
    // OFFLINE MODE
    offlineBox.style.display = "block";
    mainFrame.style.display = "none";
    return;
  }

  // ONLINE MODE
  offlineBox.style.display = "none";
  mainFrame.style.display = "block";

  // Cache main homepage only once
  if (!localStorage.getItem("cachedHome")) {
    try {
      const res = await fetch("https://black-ice-3dbk.onrender.com/");
      const html = await res.text();
      localStorage.setItem("cachedHome", html);
      console.log("✅ Home cached for offline mode");
    } catch (err) {
      console.warn("❌ Cannot cache homepage:", err);
    }
  }
}

// Initial check
checkNetworkAndCache();

// Auto update on network changes
window.addEventListener("online", checkNetworkAndCache);
window.addEventListener("offline", checkNetworkAndCache);



const hideBtn = document.querySelector('#hideNavbar');

const setTopbarHidden = (hide) => {
  document.body.classList.toggle('nav-hidden', !!hide);
  hideBtn.setAttribute('aria-pressed', !!hide);
  hideBtn.title = hide ? 'Show navbar' : 'Hide navbar';
};

// initial state
setTopbarHidden(false);

// toggle on click
hideBtn.addEventListener('click', () => {
  setTopbarHidden(!document.body.classList.contains('nav-hidden'));
});
  
  
  
</script>
  


</body>
</html>
