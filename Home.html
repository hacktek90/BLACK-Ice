<meta name="title" content="BlackICE Portal Host">

  name="description"
  content="BlackICE Portal — a minimal, modern gateway to projects, tools, and experimental web utilities .">

<!-- Theme / UI -->
<meta name="theme-color" content="#09090b">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<!-- Open Graph (Facebook / Discord / LinkedIn) -->
<meta property="og:type" content="website">
<meta property="og:title" content="BlackICE Portal">

    <link
      href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;600&display=swap"
      rel="stylesheet"
    />

    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family:
          "Inter Tight",
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        background-color: #09090b;
        color: #ffffff;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .hero-card {
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(12px);
        padding: 40px;
        border-radius: 24px;
        text-align: center;
        max-width: 400px;
        width: 90%;
        position: relative;
        box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.5);
      }

      h1 {
        margin: 0 0 12px 0;
        font-size: 24px;
        font-weight: 600;
        background: linear-gradient(to right, #fff, #a1a1aa);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        cursor: pointer;
      }

      p {
        margin: 0;
        color: #a1a1aa;
        font-size: 14px;
        line-height: 1.6;
      }

      /* Visual Hint Container */
      .hint-wrap {
        margin-top: 32px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
      }

      /* The Visual "Fake Button" Icon - REMOVED GLOW & ANIMATION */
      .hint-icon {
        width: 48px;
        height: 48px;
        background: rgba(24, 24, 27, 0.5);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #3b82f6;
      }

      .hint-text {
        font-size: 12px;
        font-weight: 500;
        color: #71717a;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      .glow {
        position: absolute;
        width: 300px;
        height: 300px;
        background: radial-gradient(
          circle,
          rgba(59, 130, 246, 0.1) 0%,
          rgba(0, 0, 0, 0) 70%
        );
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        pointer-events: none;
        z-index: -1;
      }
    </style>
  </head>
  <body>
    <div class="glow"></div>

    <div class="hero-card">
      <h1
        onclick="window.open('https://blackice-ac.vercel.app/test/dev.html', '_blank')"
      >
        Welcome to BlackICE
      </h1>
      <p>Your portal is ready.</p>

      <div class="hint-wrap">
        <div class="hint-icon">
          <!-- Grid Icon matching the widget -->
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="3" y="3" width="7" height="7"></rect>
            <rect x="14" y="3" width="7" height="7"></rect>
            <rect x="14" y="14" width="7" height="7"></rect>
            <rect x="3" y="14" width="7" height="7"></rect>
          </svg>
        </div>
        <div class="hint-text">Click the button below to launch projects</div>
      </div>
    </div>

    <script src="/test/portal.js" defer></script>
    <script src="/test/redirect.js" defer></script>
    <script src="/test/darky.js" defer></script>
    <script
      src="https://cdn.lgrckt-in.com/LogRocket.min.js"
      crossorigin="anonymous"
    ></script>
    <script>
      window.LogRocket && window.LogRocket.init("r3bczh/blackice-portal");
    </script>

      (function (c, l, a, r, i, t, y) {
        c[a] =

            (c[a].q = c[a].q || []).push(arguments);
          };
        t = l.createElement(r);
        t.async = 1;

        y = l.getElementsByTagName(r)[0];
        y.parentNode.insertBefore(t, y);
      })(window, document, "clarity", "script", "ujy4ecml45");
    </script>
  </body>
</html>
