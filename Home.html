<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Home Screen</title>
<link rel="icon" href="https://black-ice-3dbk.onrender.com/output-onlinepngtools.png" type="image/png">
<link rel="preconnect" href="https://black-ice-3dbk.onrender.com/" crossorigin>
<link rel="dns-prefetch" href="https://black-ice-3dbk.onrender.com/">
<style>
:root{
  --topbar: 56px;
  --bg: #f7f8fb;
  --surface: #ffffff;
  --surface-2: #fafbff;
  --text: #111827;
  --muted: #6b7280;
  --border: #e5e7eb;
  --hover: #f3f4f6;
  --accent: #2563eb;
  --ring: 0 0 0 4px rgba(37,99,235,.18);
  --shadow-sm: 0 1px 2px rgba(0,0,0,.06);
  --shadow-md: 0 10px 24px rgba(0,0,0,.12);
  --radius: 14px;
  --sidebar-w: 300px;
  /* Animated RGB gradient for the brand border */
  --rgb-gradient: linear-gradient(90deg, #ff0040, #ffd500, #00ff85, #00c3ff, #7a00ff, #ff00c8, #ff0040);
}
/* Animate gradient position for a subtle shimmering border */
@keyframes shiftHue {
  0% { background-position: 0% 50%; }
  100% { background-position: 200% 50%; }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, "Helvetica Neue", Arial;
  line-height:1.45;
}
/* Top bar */
.topbar{
  height: var(--topbar);
  position: sticky; top:0; z-index: 100;
  display:flex; align-items:center; gap:12px;
  padding:10px 16px;
  background:var(--surface);
  border-bottom:1px solid var(--border);
  box-shadow: var(--shadow-sm);
}
/* Sidebar toggle */
#toggleSidebar{
  width:40px; height:40px;
  border-radius:10px;
  background:var(--surface);
  border:1px solid var(--border);
  color:var(--text);
  font-size:20px;
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; transition:.2s;
}
#toggleSidebar:hover{ background:var(--hover); }
#toggleSidebar:focus-visible{ outline:none; box-shadow: var(--ring); }
/* Brand: animated RGB gradient border around the "Home Screen" text */
.brand{
  position: relative;
  font-weight:650; letter-spacing:.2px;
  padding: 6px 12px;
  border-radius: 12px;
  /* Create a gradient border with rounded corners using two backgrounds */
  border: 2px solid transparent; /* required gap for border layer */
  background:
    linear-gradient(var(--surface), var(--surface)) padding-box, /* inner fill */
    var(--rgb-gradient) border-box; /* visible border */
  background-size: 100% 100%, 200% 200%; /* animate only the gradient layer */
  animation: shiftHue 6s linear infinite; /* subtle continuous shift */
  cursor: pointer; /* remains clickable */
}
/* Right-end button */
.icon-btn,
#hideNavbar{
  width:40px; height:40px;
  border-radius:10px;
  background:var(--surface);
  border:1px solid var(--border);
  color:var(--text);
  font-size:20px;
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; transition:.2s;
}
#hideNavbar:hover{ background:var(--hover); }
#hideNavbar:focus-visible{ outline:none; box-shadow: var(--ring); }
/* Collapse top bar */
body.nav-hidden{ --topbar: 0px; }
body.nav-hidden .topbar{
  padding:0; border:0; box-shadow:none; overflow:hidden;
}
body.nav-hidden #hideNavbar{
  position: fixed; top: 8px; right: 16px; z-index: 130;
}
/* Sidebar */
nav.sidebar.open{ transform: translateX(0); }
nav.sidebar {
  position: fixed;
  inset: var(--topbar) auto 0 0;
  width: var(--sidebar-w);
  z-index: 120;
  background:var(--surface);
  border-right: 1px solid var(--border);
  padding: 16px;
  overflow-y: auto;
  transform: translateX(-100%);
  transition: transform .3s ease;
  box-shadow: var(--shadow-md);
}
.side-hd{ font-weight:650; margin-bottom:8px; }

/* New: heading row + small add button */
.side-hd-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  margin-bottom:8px;
}
.side-add-btn{
  width:34px; height:34px;
  border-radius:10px;
  background:var(--surface-2);
  border:1px solid var(--border);
  color:var(--text);
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; transition:.2s;
}
.side-add-btn:hover{ background:var(--hover); }
.side-add-btn:focus-visible{ outline:none; box-shadow: var(--ring); }

.side-search{ position:relative; margin-bottom:12px; }
.side-search input{
  width:100%; height:38px; padding:0 12px 0 40px;
  border:1px solid var(--border); border-radius:10px;
  background:var(--surface-2); color:var(--text);
}
.side-search input:focus{ outline:none; border-color:var(--accent); box-shadow: var(--ring); }
.side-search .icon{
  position:absolute; top:10px; left:12px; width:18px; height:18px; color:#6b7280;
  pointer-events:none;
}

/* Favorite section */
.favorites-section {
  margin-bottom: 12px;
  border-bottom: 1px solid var(--border);
  padding-bottom: 12px;
}
.favorites-label {
  font-weight: 650;
  color: var(--muted);
  font-size: 0.85rem;
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.favorites-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.list{ list-style:none; padding:0; margin:0; }
.item-row{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:8px;
}
.item button.project-btn{
  flex:1;
  display:flex; align-items:start; gap:10px;
  padding:10px 10px;
  border-radius:10px;
  background:transparent;
  color:var(--text);
  border:1px solid transparent;
  cursor:pointer; text-align:left;
  transition:.15s;
}
.item button.project-btn:hover{
  background:var(--hover); border-color:var(--border);
}
.item button.project-btn.active{
  background:var(--hover); border-color:var(--accent);
}

.copy-btn{
  font-size:.75rem;
  padding:4px 8px;
  border-radius:8px;
  border:1px solid var(--border);
  background:var(--surface-2);
  cursor:pointer;
  color:var(--muted);
  white-space:nowrap;
  margin-top:10px;
}
.copy-btn:hover{
  background:var(--hover);
  color:var(--text);
}
.copy-btn:focus-visible{
  outline:none;
  box-shadow:var(--ring);
}

/* Favorite button */
.favorite-btn {
  width: 28px;
  height: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-left: auto;
  border-radius: 8px;
  border: none;
  background: transparent;
  color: #ddd;
  cursor: pointer;
  transition: all 0.2s ease;
}
.favorite-btn:hover {
  background: var(--surface-2);
  color: #ffa500;
}
.favorite-btn.favorited {
  color: #ffa500;
}
.favorite-btn.favorited:hover {
  background: var(--surface-2);
}

/* Screenshot preview styles */
.screenshot-preview {
  position: relative;
  display: inline-block;
}

.screenshot-thumb {
  width: 32px;
  height: 32px;
  border-radius: 6px;
  object-fit: cover;
  border: 1px solid var(--border);
  cursor: pointer;
  transition: all 0.2s ease;
}

.screenshot-thumb:hover {
  border-color: var(--accent);
  transform: scale(1.05);
}

.screenshot-large {
  position: absolute;
  top: 0;
  left: 100%;
  z-index: 1000;
  width: 200px;
  height: 150px;
  border-radius: 8px;
  border: 1px solid var(--border);
  box-shadow: var(--shadow-md);
  background: #fff;
  object-fit: cover;
  display: none;
  margin-left: 10px;
  margin-top: -20px;
}

.screenshot-preview:hover .screenshot-large {
  display: block;
}

.title{ font-weight:600; line-height:1.25; }
.meta{ color:var(--muted); font-size:.85rem; }
/* Frame area */
.frame-wrap{
  position:relative;
  height: calc(100vh - var(--topbar));
  background:#fff;
}
iframe.portal{
  position:absolute; inset:0;
  width:100%; height:100%;
  border:0; display:block; background:#fff;
}
/* Loader overlay over iframe */
.frame-loader {
  position: absolute;
  inset: 0;
  background: rgba(255,255,254,0.8);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 10;
}
.frame-loader::before {
  content: "";
  width: 40px;
  height: 40px;
  border: 4px solid #e5e7eb;
  border-top-color: #2563eb;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
/* Skeleton loader */
.skeleton {
  background: linear-gradient(90deg, #eeeeee 25%, #f5f5f5 37%, #eeeeee 63%);
  background-size: 400% 100%;
  animation: skeleton-loading 1.4s ease infinite;
}
@keyframes skeleton-loading {
  0% { background-position: 100% 0; }
  100% { background-position: -100% 0; }
}
.skel-item { height: 48px; border-radius: 10px; margin-bottom: 10px; }
.skel-copy { height: 18px; width: 70px; border-radius: 8px; margin-top: -4px; }
/* Restore-last pill */
#restoreLastBtn{
  position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
  z-index: 140; display: none; padding: 8px 12px;
  border-radius: 999px; background-color: #111827; border: 1px solid #0b1220;
  color: #ffffff; box-shadow: var(--shadow-md); cursor: pointer;
  transition: background-color .15s ease, opacity .15s ease;
}
#restoreLastBtn.show{ display: inline-flex; align-items: center; gap: 6px; }
#restoreLastBtn:hover{ background-color: #0b1220; }
#restoreLastBtn:focus-visible{ outline: none; box-shadow: var(--ring); }
/* Reduced motion: pause animated border */
@media (prefers-reduced-motion: reduce){
  .brand{ animation: none; background-position: 100% 50%, 100% 50%; }
}
</style>
</head>
<body>
<header class="topbar">
  <button id="toggleSidebar" aria-label="Toggle project list" aria-expanded="false">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none"
      stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <line x1="3" y1="6" x2="21" y2="6"></line>
      <line x1="3" y1="12" x2="21" y2="12"></line>
      <line x1="3" y1="18" x2="21" y2="18"></line>
    </svg>
  </button>
  <div class="brand" id="goHome" title="Go Home">Home Screen</div>
  <button id="hideNavbar" class="icon-btn" aria-pressed="false" title="Hide navbar" style="margin-left:auto;">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none"
      stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <polyline points="18 15 12 9 6 15"></polyline>
    </svg>
  </button>
</header>

<button id="restoreLastBtn" type="button" aria-live="polite" title="Reload last site">
  Reload last site
</button>

<nav id="sidebar" class="sidebar" hidden>
  <div class="side-hd-row">
    <div class="side-hd">Free Tool Projects</div>
    <button
      id="openStoreBtn"
      class="side-add-btn"
      type="button"
      aria-label="Open Elegant Store">
      <!-- Plus icon (Bootstrap Icons path) -->
      <svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true" focusable="false">
        <path d="M8 4a.5.5 0 0 1 .5.5v3h3a.5.5 0 0 1 0 1h-3v3a.5.5 0 0 1-1 0v-3h-3a.5.5 0 0 1 0-1h3v-3A.5.5 0 0 1 8 4"/>
      </svg>
    </button>
  </div>

  <!-- Favorites Section -->
  <div class="favorites-section">
    <div class="favorites-label">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
      </svg>
      Favorites
    </div>
    <ul id="favoritesList" class="favorites-list">
      <!-- Favorite items will be dynamically inserted here -->
      <li class="empty-favorites">No favorites yet</li>
    </ul>
  </div>

  <div class="side-search">
    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" stroke="currentColor" fill="none"/><line x1="16.65" y1="16.65" x2="21" y2="21" stroke="currentColor"/></svg>
    <input id="searchInput" type="search" placeholder="Search projects..." autocomplete="off" />
  </div>
  <ul id="projectList" class="list">
    <div id="skeletonLoader">
      <div class="skeleton skel-item"></div>
      <div class="skeleton skel-item"></div>
      <div class="skeleton skel-item"></div>
      <div class="skeleton skel-item"></div>
      <div class="skeleton skel-item"></div>
    </div>
  </ul>
</nav>

<main>
  <div class="frame-wrap">
    <div id="offlineBox"
      style="display:none; text-align:center; padding:25px; font-size:18px; color:#b91c1c;
      background:#fee2e2; border:1px solid #fecaca;">
      ❌ No Internet Connection
    </div>
    <div id="frameLoader" class="frame-loader" aria-live="polite" aria-busy="true"></div>
    <iframe id="portalFrame" class="portal"
      src="https://black-ice-3dbk.onrender.com/"
      allow="fullscreen; clipboard-read; clipboard-write; geolocation; microphone; camera"></iframe>
  </div>
</main>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
import { getDatabase, ref, onValue } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';

const firebaseConfig = {
  apiKey: "AIzaSyAp9kCBsDLnQEmR7wWHXwt3FB2T1zDtiqU",
  authDomain: "h-90-8a7c5.firebaseapp.com",
  databaseURL: "https://h-90-8a7c5-default-rtdb.firebaseio.com",
  projectId: "h-90-8a7c5",
  storageBucket: "h-90-8a7c5.firebasestorage.app",
  messagingSenderId: "367196609301",
  appId: "1:367196609301:web:156e24c1b4532c26af671c"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const sidebar = document.querySelector('#sidebar');
const toggleBtn = document.querySelector('#toggleSidebar');
const projectList = document.querySelector('#projectList');
const favoritesList = document.querySelector('#favoritesList');
const searchInput = document.querySelector('#searchInput');
const frame = document.querySelector('#portalFrame');
const frameLoader = document.querySelector('#frameLoader');

/* Sidebar open/close */
const setSidebar = (open)=>{
  sidebar.classList.toggle('open', !!open);
  sidebar.hidden = !open;
  toggleBtn.setAttribute('aria-expanded', !!open);
};
setSidebar(false);
toggleBtn.addEventListener('click', ()=> setSidebar(!sidebar.classList.contains('open')));

/* Utilities */
const sanitizeHTML = (str)=>{
  const d = document.createElement('div');
  d.textContent = str ?? '';
  return d.innerHTML;
};
const timeAgo = (ts)=>{
  if (!ts) return '';
  const rtf = new Intl.RelativeTimeFormat(undefined,{numeric:'auto'});
  const diff = ts - Date.now();
  const steps = [
    ['year', 1000*60*60*24*365],
    ['month', 1000*60*60*24*30],
    ['week', 1000*60*60*24*7],
    ['day', 1000*60*60*24],
    ['hour', 1000*60*60],
    ['minute', 1000*60],
    ['second', 1000],
  ];
  for (const [unit, ms] of steps){
    const val = Math.round(diff/ms);
    if (Math.abs(val) >= 1) return rtf.format(val, unit);
  }
  return rtf.format(0,'second');
};

/* ---------- Restore-last-site support ---------- */
const HOME_URL = "https://black-ice-3dbk.onrender.com/";
const LAST_KEY = "lastPortalUrl";
const restoreBtn = document.getElementById("restoreLastBtn");
const offlineBox = document.getElementById("offlineBox");

function showFrameLoader() {
  if (offlineBox.style.display === "block") return;
  frameLoader.style.display = 'flex';
}
function hideFrameLoader() {
  frameLoader.style.display = 'none';
}
function setFrameSrc(url, opts = { remember: true }) {
  showFrameLoader();
  frame.src = url;
  if (opts.remember && url && url !== HOME_URL) {
    localStorage.setItem(LAST_KEY, url);
  }
}
frame.addEventListener('load', hideFrameLoader);

function maybeShowRestore() {
  const last = localStorage.getItem(LAST_KEY);
  const current = frame.getAttribute("src");
  if (!last || current !== HOME_URL) return;
  restoreBtn.classList.add("show");
  const t = setTimeout(() => {
    restoreBtn.classList.remove("show");
  }, 7000);
  restoreBtn.onclick = () => {
    clearTimeout(t);
    setFrameSrc(last);
    restoreBtn.classList.remove("show");
  };
}

document.addEventListener("DOMContentLoaded", () => {
  showFrameLoader();
  maybeShowRestore();
});

/* ---------- Open Elegant Store (+) ---------- */
const STORE_URL = "https://black-ice-3dbk.onrender.com/elegant-store.html";
const openStoreBtn = document.getElementById('openStoreBtn');
if (openStoreBtn) {
  openStoreBtn.addEventListener('click', () => {
    setFrameSrc(STORE_URL);
    setSidebar(false);
  });
}

/* ---------- Favorites Management ---------- */
let allSites = [];
let favorites = JSON.parse(localStorage.getItem('favoriteProjects') || '[]');
let queryText = '';

// Update favorites in localStorage
function saveFavorites() {
  localStorage.setItem('favoriteProjects', JSON.stringify(favorites));
}

// Check if a site is favorited
function isFavorited(siteId) {
  return favorites.includes(siteId);
}

// Add to favorites
function addToFavorites(siteId) {
  if (!favorites.includes(siteId)) {
    favorites.push(siteId);
    saveFavorites();
    return true;
  }
  return false;
}

// Remove from favorites
function removeFromFavorites(siteId) {
  const index = favorites.indexOf(siteId);
  if (index > -1) {
    favorites.splice(index, 1);
    saveFavorites();
    return true;
  }
  return false;
}

// Toggle favorite status
function toggleFavorite(siteId, buttonEl) {
  if (isFavorited(siteId)) {
    removeFromFavorites(siteId);
    buttonEl.classList.remove('favorited');
  } else {
    addToFavorites(siteId);
    buttonEl.classList.add('favorited');
  }
  renderFavorites();
  renderList(); // Re-render main list to update favorite icons
}

// Render favorites list
function renderFavorites() {
  if (favorites.length === 0) {
    favoritesList.innerHTML = '<li class="empty-favorites">No favorites yet</li>';
    return;
  }

  // Filter favorited sites and sort by timestamp (newest first)
  const favoritedSites = allSites
    .filter(site => favorites.includes(site.id))
    .sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));

  favoritesList.innerHTML = favoritedSites.map(site => {
    const safeTitle = sanitizeHTML(site.title);
    const safeUrl = sanitizeHTML(site.url);
    const when = site.timestamp ? timeAgo(site.timestamp) : "";
    // Generate Microlink screenshot URL
    const screenshotUrl = `https://api.microlink.io/?url=${encodeURIComponent(site.url)}&screenshot=true&meta=false&embed=screenshot.url`;
    
    return `
      <li class="item item-row">
        <button type="button" class="project-btn" data-url="${safeUrl}">
          <div class="screenshot-preview">
            <img class="screenshot-thumb" src="${screenshotUrl}" alt="Preview of ${safeTitle}" loading="lazy" />
            <img class="screenshot-large" src="${screenshotUrl}" alt="Preview of ${safeTitle}" loading="lazy" />
          </div>
          <div>
            <div class="title">${safeTitle}</div>
            ${when ? `<div class="meta">${sanitizeHTML(when)}</div>` : ""}
          </div>
        </button>
      </li>
    `;
  }).join("");

  // Add event listeners to favorite items
  favoritesList.querySelectorAll('.project-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      setFrameSrc(btn.dataset.url);
      setSidebar(false);
    });
  });

  // Remove empty message if there are favorites
  const emptyMsg = favoritesList.querySelector('.empty-favorites');
  if (emptyMsg && favorites.length > 0) {
    emptyMsg.remove();
  }
}

/* ---------- Data + list rendering ---------- */
const renderList = ()=>{
  let list = allSites.slice();
  if (queryText){
    const q = queryText.toLowerCase();
    list = list.filter(s =>
      (s.title || '').toLowerCase().includes(q) ||
      (s.description || '').toLowerCase().includes(q)
    );
  }
  
  if (!list.length){
    projectList.innerHTML = `<li class="item"><div>No matches</div></li>`;
    return;
  }
  
  projectList.innerHTML = list.map(site => {
    const safeTitle = sanitizeHTML(site.title);
    const safeUrl = sanitizeHTML(site.url);
    const when = site.timestamp ? timeAgo(site.timestamp) : "";
    const isFav = isFavorited(site.id);
    // Generate Microlink screenshot URL
    const screenshotUrl = `https://api.microlink.io/?url=${encodeURIComponent(site.url)}&screenshot=true&meta=false&embed=screenshot.url`;
    
    return `
      <li class="item item-row">
        <button type="button" class="project-btn" data-url="${safeUrl}">
          <div class="screenshot-preview">
            <img class="screenshot-thumb" src="${screenshotUrl}" alt="Preview of ${safeTitle}" loading="lazy" />
            <img class="screenshot-large" src="${screenshotUrl}" alt="Preview of ${safeTitle}" loading="lazy" />
          </div>
          <div>
            <div class="title">${safeTitle}</div>
            ${when ? `<div class="meta">${sanitizeHTML(when)}</div>` : ""}
          </div>
        </button>
        <button class="copy-btn" data-copy="${safeUrl}">Copy</button>
        <button class="favorite-btn${isFav ? ' favorited' : ''}" 
                data-id="${site.id}"
                aria-label="${isFav ? 'Remove from favorites' : 'Add to favorites'}">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" stroke="none">
            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
          </svg>
        </button>
      </li>
    `;
  }).join("");
  
  projectList.querySelectorAll('.project-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      setFrameSrc(btn.dataset.url);
      projectList.querySelectorAll('.project-btn.active').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      setSidebar(false);
    });
  });
  
  projectList.querySelectorAll('.copy-btn').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      const url = btn.dataset.copy;
      navigator.clipboard.writeText(url).then(()=>{
        btn.textContent = "Copied!";
        setTimeout(()=> btn.textContent = "Copy", 900);
      });
    });
  });
  
  // Add event listeners to favorite buttons
  projectList.querySelectorAll('.favorite-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      e.preventDefault();
      toggleFavorite(btn.dataset.id, btn);
    });
  });
};

searchInput.addEventListener('input', (e)=>{
  queryText = e.target.value.trim();
  renderList();
});

onValue(ref(db, 'sites'), snapshot=>{
  const sites = snapshot.val();
  if (!sites){
    projectList.innerHTML = `<li>No projects yet</li>`;
    return;
  }
  allSites = Object.entries(sites).map(([id, site])=>({
    id,
    title: site.title || "Untitled",
    url: site.url || "#",
    timestamp: site.timestamp || 0,
    description: site.description || ""
  }));
  allSites.sort((a,b)=> (b.timestamp || 0) - (a.timestamp || 0));
  
  renderList();
  renderFavorites();
});

document.querySelector("#goHome").addEventListener("click", () => {
  setFrameSrc(HOME_URL, { remember: false });
  setTimeout(maybeShowRestore, 0);
});

/* -------------------------------
OFFLINE + FIRST-TIME PAGE CACHE
-------------------------------- */
const mainFrame = document.getElementById("portalFrame");
async function checkNetworkAndCache() {
  if (!navigator.onLine) {
    offlineBox.style.display = "block";
    mainFrame.style.display = "none";
    hideFrameLoader();
    return;
  }
  offlineBox.style.display = "none";
  mainFrame.style.display = "block";
  showFrameLoader();
  if (!localStorage.getItem("cachedHome")) {
    try {
      const res = await fetch("https://black-ice-3dbk.onrender.com/");
      const html = await res.text();
      localStorage.setItem("cachedHome", html);
    } catch (err) { /* ignore */ }
  }
}
checkNetworkAndCache();
window.addEventListener("online", checkNetworkAndCache);
window.addEventListener("offline", checkNetworkAndCache);

/* Navbar hide/show */
const hideBtn = document.querySelector('#hideNavbar');
const setTopbarHidden = (hide) => {
  document.body.classList.toggle('nav-hidden', !!hide);
  hideBtn.setAttribute('aria-pressed', !!hide);
  hideBtn.title = hide ? 'Show navbar' : 'Hide navbar';
};
setTopbarHidden(false);
hideBtn.addEventListener('click', () => {
  setTopbarHidden(!document.body.classList.contains('nav-hidden'));
});
