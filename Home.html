<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Home Screen</title>
<link rel="icon" href="https://black-ice-3dbk.onrender.com/output-onlinepngtools.png" type="image/png">
<link rel="preconnect" href="https://black-ice-3dbk.onrender.com/" crossorigin>
<link rel="dns-prefetch" href="https://black-ice-3dbk.onrender.com/">
<style>
:root{
--topbar: 56px;
--bg: #f7f8fb;
--surface: #ffffff;
--surface-2: #fafbff;
--text: #111827;
--muted: #6b7280;
--border: #e5e7eb;
--hover: #f3f4f6;
--accent: #2563eb;
--ring: 0 0 0 4px rgba(37,99,235,.18);
--shadow-sm: 0 1px 2px rgba(0,0,0,.06);
--shadow-md: 0 10px 24px rgba(0,0,0,.12);
--radius: 14px;
--sidebar-w: 300px;
--rgb-gradient: linear-gradient(90deg, #ff0040, #ffd500, #00ff85, #00c3ff, #7a00ff, #ff00c8, #ff0040);
}
@keyframes shiftHue {
0% { background-position: 0% 50%; }
100% { background-position: 200% 50%; }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body{
margin:0;
background:var(--bg);
color:var(--text);
font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, "Helvetica Neue", Arial;
line-height:1.45;
}
.topbar{
height: var(--topbar);
position: sticky; top:0; z-index: 100;
display:flex; align-items:center; gap:12px;
padding:10px 16px;
background:var(--surface);
border-bottom:1px solid var(--border);
box-shadow: var(--shadow-sm);
}
#toggleSidebar{
width:40px; height:40px;
border-radius:10px;
background:var(--surface);
border:1px solid var(--border);
color:var(--text);
font-size:20px;
display:flex; align-items:center; justify-content:center;
cursor:pointer; transition:.2s;
flex-shrink: 0;
}
#toggleSidebar:hover{ background:var(--hover); }
#toggleSidebar:focus-visible{ outline:none; box-shadow: var(--ring); }
.brand-container {
display: flex;
align-items: center;
gap: 8px;
flex: 1;
min-width: 0;
}
.brand{
position: relative;
font-weight:650;
letter-spacing:.2px;
padding: 6px 12px;
border-radius: 12px;
border: 2px solid transparent;
background:
linear-gradient(var(--surface), var(--surface)) padding-box,
var(--rgb-gradient) border-box;
background-size: 100% 100%, 200% 200%;
animation: shiftHue 6s linear infinite;
cursor: pointer;
flex-shrink: 0;
white-space: nowrap;
}
.project-name-display {
display: flex;
align-items: center;
gap: 8px;
padding: 6px 12px;
background: var(--surface-2);
border: 1px solid var(--border);
border-radius: 10px;
color: var(--text);
font-weight: 500;
font-size: 0.9rem;
max-width: 300px;
overflow: hidden;
transition: all 0.3s ease;
opacity: 0;
transform: translateX(-10px);
}
.project-name-display.visible {
opacity: 1;
transform: translateX(0);
}
.project-name-display .separator {
color: var(--muted);
font-weight: 400;
}
.project-name-display .name {
overflow: hidden;
text-overflow: ellipsis;
white-space: nowrap;
color: var(--accent);
}
.project-name-display .close-project {
width: 20px;
height: 20px;
display: flex;
align-items: center;
justify-content: center;
border-radius: 50%;
background: transparent;
border: none;
color: var(--muted);
cursor: pointer;
flex-shrink: 0;
transition: all 0.2s;
padding: 0;
margin-left: auto;
}
.project-name-display .close-project:hover {
background: var(--hover);
color: var(--text);
}
.icon-btn,
#hideNavbar,
#settingsBtn{
width:40px; height:40px;
border-radius:10px;
background:var(--surface);
border:1px solid var(--border);
color:var(--text);
font-size:20px;
display:flex; align-items:center; justify-content:center;
cursor:pointer; transition:.2s;
flex-shrink: 0;
}
#hideNavbar:hover, #settingsBtn:hover{ background:var(--hover); }
#hideNavbar:focus-visible, #settingsBtn:focus-visible{ outline:none; box-shadow: var(--ring); }
body.nav-hidden{ --topbar: 0px; }
body.nav-hidden .topbar{
padding:0; border:0; box-shadow:none; overflow:hidden;
}
body.nav-hidden #hideNavbar{
position: fixed; top: 8px; right: 16px; z-index: 130;
}
nav.sidebar.open{ transform: translateX(0); }
nav.sidebar {
position: fixed;
inset: var(--topbar) auto 0 0;
width: var(--sidebar-w);
z-index: 120;
background:var(--surface);
border-right: 1px solid var(--border);
padding: 16px;
overflow-y: auto;
transform: translateX(-100%);
transition: transform .3s ease;
box-shadow: var(--shadow-md);
}
.side-hd{ font-weight:650; margin-bottom:8px; }
.side-hd-row{
display:flex;
align-items:center;
justify-content:space-between;
gap:8px;
margin-bottom:8px;
}
.side-add-btn{
width:34px; height:34px;
border-radius:10px;
background:var(--surface-2);
border:1px solid var(--border);
color:var(--text);
display:flex; align-items:center; justify-content:center;
cursor:pointer; transition:.2s;
}
.side-add-btn:hover{ background:var(--hover); }
.side-add-btn:focus-visible{ outline:none; box-shadow: var(--ring); }
.side-search{ position:relative; margin-bottom:12px; }
.side-search input{
width:100%; height:38px; padding:0 12px 0 40px;
border:1px solid var(--border); border-radius:10px;
background:var(--surface-2); color:var(--text);
}
.side-search input:focus{ outline:none; border-color:var(--accent); box-shadow: var(--ring); }
.side-search .icon{
position:absolute; top:10px; left:12px; width:18px; height:18px; color:#6b7280;
pointer-events:none;
}
.favorites-section {
margin-bottom: 12px;
border-bottom: 1px solid var(--border);
padding-bottom: 12px;
}
.favorites-label {
font-weight: 650;
color: var(--muted);
font-size: 0.85rem;
margin-bottom: 8px;
display: flex;
align-items: center;
gap: 6px;
}
.favorites-list {
display: flex;
flex-direction: column;
gap: 6px;
}
.list{ list-style:none; padding:0; margin:0; }
.item-row{
display:flex;
align-items:flex-start;
justify-content:space-between;
gap:8px;
}
.item button.project-btn{
flex:1;
display:flex; align-items:start; gap:10px;
padding:10px 10px;
border-radius:10px;
background:transparent;
color:var(--text);
border:1px solid transparent;
cursor:pointer; text-align:left;
transition:.15s;
}
.item button.project-btn:hover{
background:var(--hover); border-color:var(--border);
}
.item button.project-btn.active{
background:var(--hover); border-color:var(--accent);
}
.copy-btn{
font-size:.75rem;
padding:4px 8px;
border-radius:8px;
border:1px solid var(--border);
background:var(--surface-2);
cursor:pointer;
color:var(--muted);
white-space:nowrap;
margin-top:10px;
}
.copy-btn:hover{
background:var(--hover);
color:var(--text);
}
.copy-btn:focus-visible{
outline:none;
box-shadow:var(--ring);
}
.favorite-btn {
width: 28px;
height: 28px;
display: flex;
align-items: center;
justify-content: center;
margin-left: auto;
border-radius: 8px;
border: none;
background: transparent;
color: #ddd;
cursor: pointer;
transition: all 0.2s ease;
}
.favorite-btn:hover {
background: var(--surface-2);
color: #ffa500;
}
.favorite-btn.favorited {
color: #ffa500;
}
.favorite-btn.favorited:hover {
background: var(--surface-2);
}
.screenshot-preview {
position: relative;
display: inline-block;
}
.screenshot-thumb {
width: 32px;
height: 32px;
border-radius: 6px;
object-fit: cover;
border: 1px solid var(--border);
cursor: pointer;
transition: all 0.2s ease;
}
.screenshot-thumb:hover {
border-color: var(--accent);
transform: scale(1.05);
}
.screenshot-large {
position: absolute;
top: 0;
left: 100%;
z-index: 1000;
width: 200px;
height: 150px;
border-radius: 8px;
border: 1px solid var(--border);
box-shadow: var(--shadow-md);
background: #fff;
object-fit: cover;
display: none;
margin-left: 10px;
margin-top: -20px;
}
.screenshot-preview:hover .screenshot-large {
display: block;
}
.title{ font-weight:600; line-height:1.25; }
.meta{ color:var(--muted); font-size:.85rem; }
.frame-wrap{
position:relative;
height: calc(100vh - var(--topbar));
background:#fff;
}
iframe.portal{
position:absolute; inset:0;
width:100%; height:100%;
border:0; display:block; background:#fff;
}
.frame-loader {
position: absolute;
inset: 0;
background: rgba(255,255,254,0.8);
display: none;
align-items: center;
justify-content: center;
z-index: 10;
}
.frame-loader::before {
content: "";
width: 40px;
height: 40px;
border: 4px solid #e5e7eb;
border-top-color: #2563eb;
border-radius: 50%;
animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.skeleton {
background: linear-gradient(90deg, #eeeeee 25%, #f5f5f5 37%, #eeeeee 63%);
background-size: 400% 100%;
animation: skeleton-loading 1.4s ease infinite;
}
@keyframes skeleton-loading {
0% { background-position: 100% 0; }
100% { background-position: -100% 0; }
}
.skel-item { height: 48px; border-radius: 10px; margin-bottom: 10px; }
.skel-copy { height: 18px; width: 70px; border-radius: 8px; margin-top: -4px; }
#restoreLastBtn{
position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
z-index: 140; display: none; padding: 8px 12px;
border-radius: 999px; background-color: #111827; border: 1px solid #0b1220;
color: #ffffff; box-shadow: var(--shadow-md); cursor: pointer;
transition: background-color .15s ease, opacity .15s ease;
}
#restoreLastBtn.show{ display: inline-flex; align-items: center; gap: 6px; }
#restoreLastBtn:hover{ background-color: #0b1220; }
#restoreLastBtn:focus-visible{ outline: none; box-shadow: var(--ring); }
.settings-dialog {
position: fixed;
top: 0;
left: 0;
width: 100%;
height: 100%;
background: rgba(0, 0, 0, 0.5);
display: flex;
align-items: center;
justify-content: center;
z-index: 1000;
opacity: 0;
visibility: hidden;
transition: all 0.3s ease;
}
.settings-dialog.open {
opacity: 1;
visibility: visible;
}
.settings-content {
background: var(--surface);
border-radius: var(--radius);
width: 90%;
max-width: 600px;
max-height: 85vh;
overflow-y: auto;
padding: 24px;
box-shadow: var(--shadow-md);
position: relative;
transform: translateY(20px);
transition: transform 0.3s ease;
}
.settings-dialog.open .settings-content {
transform: translateY(0);
}
.settings-header {
display: flex;
justify-content: space-between;
align-items: center;
margin-bottom: 20px;
}
.settings-title {
font-size: 1.25rem;
font-weight: 600;
margin: 0;
}
.close-btn {
background: none;
border: none;
font-size: 1.5rem;
cursor: pointer;
color: var(--muted);
padding: 4px;
border-radius: 6px;
transition: all 0.2s;
}
.close-btn:hover {
background: var(--hover);
color: var(--text);
}
.settings-tabs {
display: flex;
gap: 8px;
margin-bottom: 20px;
border-bottom: 2px solid var(--border);
padding-bottom: 0;
}
.tab-btn {
background: none;
border: none;
padding: 10px 16px;
cursor: pointer;
font-weight: 500;
color: var(--muted);
border-bottom: 2px solid transparent;
margin-bottom: -2px;
transition: all 0.2s;
}
.tab-btn:hover {
color: var(--text);
}
.tab-btn.active {
color: var(--accent);
border-bottom-color: var(--accent);
}
.tab-content {
display: none;
}
.tab-content.active {
display: block;
}

.dashboard-section h3 {
font-size: 1rem;
font-weight: 600;
margin: 0 0 12px 0;
color: var(--text);
display: flex;
align-items: center;
gap: 8px;
}


.stat-card:hover {
border-color: var(--accent);
transform: translateY(-2px);
box-shadow: var(--shadow-sm);
}




.activity-item:hover {
background: var(--hover);
border-color: var(--accent);
}
.activity-info {
flex: 1;
min-width: 0;
}
.activity-title {
font-weight: 600;
color: var(--text);
overflow: hidden;
text-overflow: ellipsis;
white-space: nowrap;
font-size: 0.9rem;
}
.activity-meta {
display: flex;
align-items: center;
gap: 8px;
font-size: 0.75rem;
color: var(--muted);
margin-top: 2px;
}
.activity-count {
background: var(--accent);
color: white;
padding: 4px 10px;
border-radius: 12px;
font-size: 0.75rem;
font-weight: 600;
white-space: nowrap;
}


.chart-bar:hover {
opacity: 0.8;
transform: scaleY(1.05);
}
.chart-label {
position: absolute;
bottom: -24px;
left: 50%;
transform: translateX(-50%);
font-size: 0.7rem;
color: var(--muted);
white-space: nowrap;
}
.chart-value {
position: absolute;
top: -20px;
left: 50%;
transform: translateX(-50%);
font-size: 0.75rem;
font-weight: 600;
color: var(--text);
}
.empty-state {
text-align: center;
padding: 24px;
color: var(--muted);
font-size: 0.9rem;
}
.clear-data-btn {
background: #ef4444;
color: white;
border: none;
padding: 10px 20px;
border-radius: 8px;
cursor: pointer;
font-weight: 500;
font-size: 0.9rem;
transition: background 0.2s;
width: 100%;
}
.clear-data-btn:hover {
background: #dc2626;
}
.settings-option {
margin-bottom: 20px;
}
.settings-option label {
display: block;
margin-bottom: 8px;
font-weight: 500;
}
.settings-option select {
width: 100%;
padding: 10px;
border-radius: 8px;
border: 1px solid var(--border);
background: var(--surface-2);
color: var(--text);
font-size: 1rem;
}
.save-btn {
background: var(--accent);
color: white;
border: none;
padding: 10px 20px;
border-radius: 8px;
cursor: pointer;
font-weight: 500;
width: 100%;
transition: background 0.2s;
}
.save-btn:hover {
background: #1d4ed8;
}
@media (prefers-reduced-motion: reduce){
.brand{ animation: none; background-position: 100% 50%, 100% 50%; }
}
@media (max-width: 768px) {
.project-name-display {
max-width: 150px;
}
.brand {
font-size: 0.9rem;
padding: 5px 10px;
}
.dashboard-grid {
grid-template-columns: repeat(2, 1fr);
}
.settings-content {
width: 95%;
max-width: 100%;
}
}

.os-link-section {
margin: 16px 0;
padding: 0 16px;
}
.os-link-btn {
display: flex;
align-items: center;
gap: 10px;
width: 100%;
padding: 12px 16px;
background: var(--surface);
border: 1px solid var(--border);
border-radius: 10px;
color: var(--text);
text-decoration: none;
font-weight: 500;
font-size: 0.95rem;
transition: all 0.2s;
cursor: pointer;
}
.os-link-btn:hover {
background: var(--hover);
border-color: var(--accent);
transform: translateY(-1px);
box-shadow: var(--shadow-sm);
}
.os-link-btn:active {
transform: translateY(0);
}
.os-link-btn svg:first-child {
flex-shrink: 0;
}
</style>
</head>

<main>
<div class="frame-wrap">

<script type="module">

import { getDatabase, ref, onValue } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';

const firebaseConfig = {
apiKey: "AIzaSyAp9kCBsDLnQEmR7wWHXwt3FB2T1zDtiqU",
authDomain: "h-90-8a7c5.firebaseapp.com",
databaseURL: "https://h-90-8a7c5-default-rtdb.firebaseio.com",
projectId: "h-90-8a7c5",
storageBucket: "h-90-8a7c5.firebasestorage.app",
messagingSenderId: "367196609301",
appId: "1:367196609301:web:156e24c1b4532c26af671c"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const sidebar = document.querySelector('#sidebar');
const toggleBtn = document.querySelector('#toggleSidebar');
const projectList = document.querySelector('#projectList');
const favoritesList = document.querySelector('#favoritesList');
const searchInput = document.querySelector('#searchInput');
const frame = document.querySelector('#portalFrame');
const frameLoader = document.querySelector('#frameLoader');
const projectNameDisplay = document.querySelector('#projectNameDisplay');
const currentProjectName = document.querySelector('#currentProjectName');
const closeProjectBtn = document.querySelector('#closeProject');

let currentProject = null;

// ==================== TRACKING SYSTEM ====================
const TRACKING_KEY = 'projectTracking';
const ACTIVITY_KEY = 'projectActivity';

function getTracking() {
return JSON.parse(localStorage.getItem(TRACKING_KEY) || '{}');
}

function saveTracking(data) {
localStorage.setItem(TRACKING_KEY, JSON.stringify(data));
}

function getActivity() {
return JSON.parse(localStorage.getItem(ACTIVITY_KEY) || '[]');
}

function saveActivity(data) {
localStorage.setItem(ACTIVITY_KEY, JSON.stringify(data));
}

function trackProjectVisit(projectId, projectTitle, projectUrl) {
const tracking = getTracking();
if (!tracking[projectId]) {
tracking[projectId] = {
id: projectId,
title: projectTitle,
url: projectUrl,
visits: 0,
firstVisit: Date.now(),
lastVisit: Date.now()
};
}
tracking[projectId].visits++;
tracking[projectId].lastVisit = Date.now();
saveTracking(tracking);
  
const activity = getActivity();
activity.unshift({
projectId,
title: projectTitle,
url: projectUrl,
timestamp: Date.now()
});
if (activity.length > 50) activity.pop();
saveActivity(activity);
  
// Dashboard removed
}

function getDayOfWeek(timestamp) {
const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
return days[new Date(timestamp).getDay()];
}

function getWeeklyActivity() {
const activity = getActivity();
const weekAgo = Date.now() - (7 * 24 * 60 * 60 * 1000);
const weeklyData = { Sun: 0, Mon: 0, Tue: 0, Wed: 0, Thu: 0, Fri: 0, Sat: 0 };
  
activity
.filter(a => a.timestamp > weekAgo)
.forEach(a => {
const day = getDayOfWeek(a.timestamp);
weeklyData[day]++;
});
  
return weeklyData;
}

function updateDashboard() {
const tracking = getTracking();
const activity = getActivity();
const trackingArray = Object.values(tracking);
  
document.getElementById('totalProjectsCount').textContent = allSites.length;
document.getElementById('favoritesCount').textContent = favorites.length;
document.getElementById('totalVisitsCount').textContent = 
trackingArray.reduce((sum, p) => sum + p.visits, 0);
  
const today = new Date().setHours(0, 0, 0, 0);
const activeToday = activity.filter(a => a.timestamp >= today).length;
document.getElementById('activeToday').textContent = activeToday;
  
const mostVisited = trackingArray
.sort((a, b) => b.visits - a.visits)
.slice(0, 5);
  
const mostVisitedList = document.getElementById('mostVisitedList');
if (mostVisited.length === 0) {
mostVisitedList.innerHTML = '<li class="empty-state">No visit data yet</li>';
} else {
mostVisitedList.innerHTML = mostVisited.map(p => `
<li class="activity-item">
<div class="activity-info">
<div class="activity-title">${sanitizeHTML(p.title)}</div>
<div class="activity-meta">
<span>Last: ${timeAgo(p.lastVisit)}</span>
</div>
</div>
<span class="activity-count">${p.visits} visits</span>
</li>
`).join('');
}
  
const recentActivity = activity.slice(0, 10);
const recentActivityList = document.getElementById('recentActivityList');
if (recentActivity.length === 0) {
recentActivityList.innerHTML = '<li class="empty-state">No recent activity</li>';
} else {
recentActivityList.innerHTML = recentActivity.map(a => `
<li class="activity-item">
<div class="activity-info">
<div class="activity-title">${sanitizeHTML(a.title)}</div>
<div class="activity-meta">
<span>${timeAgo(a.timestamp)}</span>
</div>
</div>
</li>
`).join('');
}
  
const weeklyData = getWeeklyActivity();
const maxVisits = Math.max(...Object.values(weeklyData), 1);
const weeklyChart = document.getElementById('weeklyChart');
weeklyChart.innerHTML = Object.entries(weeklyData).map(([day, count]) => {
const height = (count / maxVisits) * 100;
return `
<div class="chart-bar" style="height: ${height}%;" title="${day}: ${count} visits">
<span class="chart-value">${count}</span>
<span class="chart-label">${day}</span>
</div>
`;
}).join('');
}

function updateProjectNameDisplay(projectTitle) {
if (projectTitle && projectTitle !== "Home Screen") {
currentProjectName.textContent = projectTitle;
projectNameDisplay.classList.add('visible');
currentProject = projectTitle;
} else {
projectNameDisplay.classList.remove('visible');
currentProject = null;
}
}

closeProjectBtn.addEventListener('click', (e) => {
e.stopPropagation();
setFrameSrc(HOME_URL, { remember: false });
updateProjectNameDisplay(null);
projectList.querySelectorAll('.project-btn.active').forEach(b=>b.classList.remove('active'));
setTimeout(maybeShowRestore, 0);
});

const setSidebar = (open)=>{
sidebar.classList.toggle('open', !!open);
sidebar.hidden = !open;
toggleBtn.setAttribute('aria-expanded', !!open);
};
setSidebar(false);
toggleBtn.addEventListener('click', ()=> setSidebar(!sidebar.classList.contains('open')));

const sanitizeHTML = (str)=>{
const d = document.createElement('div');
d.textContent = str ?? '';
return d.innerHTML;
};

const timeAgo = (ts)=>{
if (!ts) return '';
const rtf = new Intl.RelativeTimeFormat(undefined,{numeric:'auto'});
const diff = ts - Date.now();
const steps = [
['year', 1000*60*60*24*365],
['month', 1000*60*60*24*30],
['week', 1000*60*60*24*7],
['day', 1000*60*60*24],
['hour', 1000*60*60],
['minute', 1000*60],
['second', 1000],
];
for (const [unit, ms] of steps){
const val = Math.round(diff/ms);
if (Math.abs(val) >= 1) return rtf.format(val, unit);
}
return rtf.format(0,'second');
};

const HOME_URL = "https://black-ice-3dbk.onrender.com/";
const LAST_KEY = "lastPortalUrl";
const restoreBtn = document.getElementById("restoreLastBtn");
const offlineBox = document.getElementById("offlineBox");

function showFrameLoader() {
if (offlineBox.style.display === "block") return;
frameLoader.style.display = 'flex';
}

function hideFrameLoader() {
frameLoader.style.display = 'none';
}

function setFrameSrc(url, opts = { remember: true, projectTitle: null }) {
showFrameLoader();
frame.src = url;
if (opts.remember && url && url !== HOME_URL) {
localStorage.setItem(LAST_KEY, url);
if (opts.projectTitle) {
localStorage.setItem('lastProjectTitle', opts.projectTitle);
// Track the visit
const project = allSites.find(s => s.url === url);
if (project) {
trackProjectVisit(project.id, opts.projectTitle, url);
}
}
}
updateProjectNameDisplay(opts.projectTitle);
}

frame.addEventListener('load', hideFrameLoader);

function maybeShowRestore() {
const last = localStorage.getItem(LAST_KEY);
const current = frame.getAttribute("src");
if (!last || current !== HOME_URL) return;
restoreBtn.classList.add("show");
const t = setTimeout(() => {
restoreBtn.classList.remove("show");
}, 7000);
restoreBtn.onclick = () => {
clearTimeout(t);
const lastTitle = localStorage.getItem('lastProjectTitle');
setFrameSrc(last, { projectTitle: lastTitle });
restoreBtn.classList.remove("show");
};
}

document.addEventListener("DOMContentLoaded", () => {
showFrameLoader();
maybeShowRestore();
});

const STORE_URL = "https://black-ice-3dbk.onrender.com/elegant-store.html";
const openStoreBtn = document.getElementById('openStoreBtn');
if (openStoreBtn) {
openStoreBtn.addEventListener('click', () => {
setFrameSrc(STORE_URL, { projectTitle: "Elegant Store" });
setSidebar(false);
});
}

let allSites = [];
let favorites = JSON.parse(localStorage.getItem('favoriteProjects') || '[]');
let queryText = '';

function saveFavorites() {
localStorage.setItem('favoriteProjects', JSON.stringify(favorites));
}

function isFavorited(siteId) {
return favorites.includes(siteId);
}

function addToFavorites(siteId) {
if (!favorites.includes(siteId)) {
favorites.push(siteId);
saveFavorites();
return true;
}
return false;
}

function removeFromFavorites(siteId) {
const index = favorites.indexOf(siteId);
if (index > -1) {
favorites.splice(index, 1);
saveFavorites();
return true;
}
return false;
}

function toggleFavorite(siteId, buttonEl) {
if (isFavorited(siteId)) {
removeFromFavorites(siteId);
buttonEl.classList.remove('favorited');
} else {
addToFavorites(siteId);
buttonEl.classList.add('favorited');
}
renderFavorites();
renderList();
}

function renderFavorites() {
if (favorites.length === 0) {
favoritesList.innerHTML = '<li class="empty-favorites">No favorites yet</li>';
return;
}

const favoritedSites = allSites
.filter(site => favorites.includes(site.id))
.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));

favoritesList.innerHTML = favoritedSites.map(site => {
const safeTitle = sanitizeHTML(site.title);
const safeUrl = sanitizeHTML(site.url);
const when = site.timestamp ? timeAgo(site.timestamp) : "";
const screenshotUrl = `https://api.microlink.io/?url=${encodeURIComponent(site.url)}&screenshot=true&meta=false&embed=screenshot.url`;

return `
<li class="item item-row">
<button type="button" class="project-btn" data-url="${safeUrl}" data-title="${safeTitle}">
<div class="screenshot-preview">
<img class="screenshot-thumb" src="${screenshotUrl}" alt="Preview of ${safeTitle}" loading="lazy" />
<img class="screenshot-large" src="${screenshotUrl}" alt="Preview of ${safeTitle}" loading="lazy" />
</div>
<div>
<div class="title">${safeTitle}</div>
${when ? `<div class="meta">${sanitizeHTML(when)}</div>` : ""}
</div>
</button>
</li>
`;
}).join("");

favoritesList.querySelectorAll('.project-btn').forEach(btn => {
btn.addEventListener('click', () => {
setFrameSrc(btn.dataset.url, { projectTitle: btn.dataset.title });
setSidebar(false);
});
});
}

const renderList = ()=>{
let list = allSites.slice();
if (queryText){
const q = queryText.toLowerCase();
list = list.filter(s =>
(s.title || '').toLowerCase().includes(q) ||
(s.description || '').toLowerCase().includes(q)
);
}
if (!list.length){
projectList.innerHTML = `<li class="item"><div>No matches</div></li>`;
return;
}
projectList.innerHTML = list.map(site => {
const safeTitle = sanitizeHTML(site.title);
const safeUrl = sanitizeHTML(site.url);
const when = site.timestamp ? timeAgo(site.timestamp) : "";
const isFav = isFavorited(site.id);
const screenshotUrl = `https://api.microlink.io/?url=${encodeURIComponent(site.url)}&screenshot=true&meta=false&embed=screenshot.url`;

return `
<li class="item item-row">
<button type="button" class="project-btn" data-url="${safeUrl}" data-title="${safeTitle}">
<div class="screenshot-preview">
<img class="screenshot-thumb" src="${screenshotUrl}" alt="Preview of ${safeTitle}" loading="lazy" />
<img class="screenshot-large" src="${screenshotUrl}" alt="Preview of ${safeTitle}" loading="lazy" />
</div>
<div>
<div class="title">${safeTitle}</div>
${when ? `<div class="meta">${sanitizeHTML(when)}</div>` : ""}
</div>
</button>
<button class="copy-btn" data-copy="${safeUrl}">Copy</button>
<button class="favorite-btn${isFav ? ' favorited' : ''}"
data-id="${site.id}"
aria-label="${isFav ? 'Remove from favorites' : 'Add to favorites'}">
<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" stroke="none">
<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
</svg>
</button>
</li>
`;
}).join("");

projectList.querySelectorAll('.project-btn').forEach(btn=>{
btn.addEventListener('click', ()=>{
setFrameSrc(btn.dataset.url, { projectTitle: btn.dataset.title });
projectList.querySelectorAll('.project-btn.active').forEach(b=>b.classList.remove('active'));
btn.classList.add('active');
setSidebar(false);
});
});

projectList.querySelectorAll('.copy-btn').forEach(btn=>{
btn.addEventListener('click', (e)=>{
e.stopPropagation();
const url = btn.dataset.copy;
navigator.clipboard.writeText(url).then(()=>{
btn.textContent = "Copied!";
setTimeout(()=> btn.textContent = "Copy", 900);
});
});
});

projectList.querySelectorAll('.favorite-btn').forEach(btn => {
btn.addEventListener('click', (e) => {
e.stopPropagation();
e.preventDefault();
toggleFavorite(btn.dataset.id, btn);
});
});
};

searchInput.addEventListener('input', (e)=>{
queryText = e.target.value.trim();
renderList();
});

onValue(ref(db, 'sites'), snapshot=>{
const sites = snapshot.val();
if (!sites){
projectList.innerHTML = `<li>No projects yet</li>`;
return;
}
allSites = Object.entries(sites).map(([id, site])=>({
id,
title: site.title || "Untitled",
url: site.url || "#",
timestamp: site.timestamp || 0,
description: site.description || ""
}));
allSites.sort((a,b)=> (b.timestamp || 0) - (a.timestamp || 0));
renderList();
renderFavorites();
});

document.querySelector("#goHome").addEventListener("click", () => {
setFrameSrc(HOME_URL, { remember: false, projectTitle: null });
projectList.querySelectorAll('.project-btn.active').forEach(b=>b.classList.remove('active'));
setTimeout(maybeShowRestore, 0);
});

const mainFrame = document.getElementById("portalFrame");
async function checkNetworkAndCache() {
if (!navigator.onLine) {
offlineBox.style.display = "block";
mainFrame.style.display = "none";
hideFrameLoader();
return;
}
offlineBox.style.display = "none";
mainFrame.style.display = "block";
showFrameLoader();
if (!localStorage.getItem("cachedHome")) {
try {
const res = await fetch("https://black-ice-3dbk.onrender.com/");
const html = await res.text();
localStorage.setItem("cachedHome", html);
} catch (err) { /* ignore */ }
}
}

checkNetworkAndCache();
window.addEventListener("online", checkNetworkAndCache);
window.addEventListener("offline", checkNetworkAndCache);

const hideBtn = document.querySelector('#hideNavbar');
const setTopbarHidden = (hide) => {
document.body.classList.toggle('nav-hidden', !!hide);
hideBtn.setAttribute('aria-pressed', !!hide);
hideBtn.title = hide ? 'Show navbar' : 'Hide navbar';
};
setTopbarHidden(false);
hideBtn.addEventListener('click', () => {
setTopbarHidden(!document.body.classList.contains('nav-hidden'));
});

const settingsBtn = document.getElementById('settingsBtn');
const settingsDialog = document.getElementById('settingsDialog');
const closeSettings = document.getElementById('closeSettings');
const saveSettings = document.getElementById('saveSettings');
const homeScreenSelect = document.getElementById('homeScreenSelect');

function populateHomeScreenOptions() {
homeScreenSelect.innerHTML = '<option value="">Default Home Screen</option>';
allSites.forEach(site => {
const option = document.createElement('option');
option.value = site.url;
option.textContent = site.title;
if (site.url === localStorage.getItem('customHomeScreen')) {
option.selected = true;
}
homeScreenSelect.appendChild(option);
});
}

settingsBtn.addEventListener('click', () => {
populateHomeScreenOptions();
settingsDialog.classList.add('open');
// Dashboard removed
});

closeSettings.addEventListener('click', () => {
settingsDialog.classList.remove('open');
});

saveSettings.addEventListener('click', () => {
const selectedUrl = homeScreenSelect.value;
if (selectedUrl) {
localStorage.setItem('customHomeScreen', selectedUrl);
} else {
localStorage.removeItem('customHomeScreen');
}
settingsDialog.classList.remove('open');
});

settingsDialog.addEventListener('click', (e) => {
if (e.target === settingsDialog) {
settingsDialog.classList.remove('open');
}
});

// Tab switching
document.querySelectorAll('.tab-btn').forEach(btn => {
btn.addEventListener('click', () => {
document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    
btn.classList.add('active');
const tabId = btn.dataset.tab + 'Tab';
document.getElementById(tabId).classList.add('active');
    
if (btn.dataset.tab === 'dashboard') {
// Dashboard removed
}
});
});

// Clear tracking data
document.getElementById('clearTrackingData').addEventListener('click', () => {
if (confirm('Are you sure you want to clear all tracking data? This cannot be undone.')) {
localStorage.removeItem(TRACKING_KEY);
localStorage.removeItem(ACTIVITY_KEY);
// Dashboard removed
}
});

window.addEventListener('DOMContentLoaded', () => {
const customHome = localStorage.getItem('customHomeScreen');
if (customHome) {
frame.src = customHome;
}
});
</script>
