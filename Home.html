<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Home Screen</title>

<link rel="preconnect" href="https://black-ice-3dbk.onrender.com" crossorigin>
<link rel="dns-prefetch" href="//black-ice-3dbk.onrender.com">

<style>
  :root{
    --topbar: 56px;
    --bg: #f7f8fb;
    --surface: #ffffff;
    --surface-2: #fafbff;
    --text: #111827;
    --muted: #6b7280;
    --border: #e5e7eb;    /* light grey */
    --hover: #f3f4f6;
    --accent: #2563eb;
    --ring: 0 0 0 4px rgba(37,99,235,.18);
    --shadow-sm: 0 1px 2px rgba(0,0,0,.06);
    --shadow-md: 0 10px 24px rgba(0,0,0,.12);
    --radius: 14px;
    --sidebar-w: 300px;

    /* Border color for the "Home Screen" badge (set to grey if you prefer) */
    --brand-border: #000000;    /* use var(--border) for grey */
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, "Helvetica Neue", Arial;
    line-height:1.45;
  }

  .topbar{
    height: var(--topbar);
    position: sticky; top:0; z-index: 100;
    display:flex; align-items:center; gap:12px;
    padding:10px 16px;
    background:var(--surface);
    border-bottom:1px solid var(--border);
    box-shadow: var(--shadow-sm);
  }

  /* Bordered "Home Screen" + breadcrumb badge */
  .brand{
    font-weight:650; letter-spacing:.2px;
    padding: 6px 10px;
    border: 1.5px solid var(--brand-border);  /* black or grey */
    border-radius: 8px;                       /* optional rounding */
    display: inline-flex;
    align-items: center;
    line-height: 1;
    cursor: pointer;
    user-select: none;
  }
  .brand .sep{
    color: var(--muted);
    padding: 0 6px;
  }

  #toggleSidebar{
    width:40px; height:40px;
    border-radius:10px;
    background:var(--surface);
    border:1px solid var(--border);
    color:var(--text);
    font-size:20px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; transition:.2s;
  }
  #toggleSidebar:hover{ background:var(--hover); }
  #toggleSidebar:focus-visible{ outline:none; box-shadow: var(--ring); }

  nav.sidebar{
    position: fixed;
    inset: var(--topbar) auto 0 0;
    width: var(--sidebar-w);
    z-index: 120;
    background:var(--surface);
    border-right:1px solid var(--border);
    padding:16px;
    overflow-y:auto;
    transform: translateX(-100%);
    transition: transform .3s ease;
    box-shadow: var(--shadow-md);
  }
  nav.sidebar.open{ transform: translateX(0); }

  .side-hd{ font-weight:650; margin-bottom:8px; }
  .side-search{ position:relative; margin-bottom:12px; }
  .side-search input{
    width:100%; height:38px; padding:0 12px 0 40px;
    border:1px solid var(--border); border-radius:10px;
    background:var(--surface-2); color:var(--text);
  }
  .side-search input:focus{ outline:none; border-color:var(--accent); box-shadow: var(--ring); }
  .side-search .icon{
    position:absolute; top:10px; left:12px; width:18px; height:18px; color:#6b7280;
    pointer-events:none;
  }

  .list{ list-style:none; padding:0; margin:0; }

  .item-row{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:8px;
  }

  .item button.project-btn{
    flex:1;
    display:flex; align-items:start; gap:10px;
    padding:10px 10px;
    border-radius:10px;
    background:transparent;
    color:var(--text);
    border:1px solid transparent;
    cursor:pointer; text-align:left;
    transition:.15s;
  }
  .item button.project-btn:hover{
    background:var(--hover); border-color:var(--border);
  }
  .item button.project-btn.active{
    background:var(--hover); border-color:var(--accent);
  }

  .copy-btn{
    font-size:.75rem;
    padding:4px 8px;
    border-radius:8px;
    border:1px solid var(--border);
    background:var(--surface-2);
    cursor:pointer;
    color:var(--muted);
    white-space:nowrap;
    margin-top:10px;
  }
  .copy-btn:hover{
    background:var(--hover);
    color:var(--text);
  }
  .copy-btn:focus-visible{
    outline:none;
    box-shadow:var(--ring);
  }

  .title{ font-weight:600; line-height:1.25; }
  .meta{ color:var(--muted); font-size:.85rem; }

  .frame-wrap{
    position:relative;
    height: calc(100vh - var(--topbar));
    background:#fff;
  }
  iframe.portal{
    position:absolute; inset:0;
    width:100%; height:100%;
    border:0; display:block; background:#fff;
  }
</style>
</head>

<body>

<header class="topbar">
  <button id="toggleSidebar" aria-label="Toggle project list" aria-expanded="false">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" 
         stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="3" y1="6" x2="21" y2="6"></line>
      <line x1="3" y1="12" x2="21" y2="12"></line>
      <line x1="3" y1="18" x2="21" y2="18"></line>
    </svg>
  </button>
  <!-- Clickable breadcrumb badge -->
  <div class="brand" id="breadcrumb" title="Go to Home">Home Screen</div>
</header>

<nav id="sidebar" class="sidebar" hidden>
  <div class="side-hd">Free Tool Projects</div>

  <div class="side-search">
    <svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" stroke="currentColor" fill="none"/><line x1="16.65" y1="16.65" x2="21" y2="21" stroke="currentColor"/></svg>
    <input id="searchInput" type="search" placeholder="Search projects..." autocomplete="off" />
  </div>

  <ul id="projectList" class="list"></ul>
</nav>

<main>
  <div class="frame-wrap">
    <iframe id="portalFrame" class="portal"
      src="https://black-ice-3dbk.onrender.com/"
      allow="fullscreen; clipboard-read; clipboard-write; geolocation; microphone; camera"></iframe>
  </div>
</main>

<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
  import { getDatabase, ref, onValue } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';

  const firebaseConfig = {
    apiKey: "AIzaSyAp9kCBsDLnQEmR7wWHXwt3FB2T1zDtiqU",
    authDomain: "h-90-8a7c5.firebaseapp.com",
    databaseURL: "https://h-90-8a7c5-default-rtdb.firebaseio.com",
    projectId: "h-90-8a7c5",
    storageBucket: "h-90-8a7c5.firebasestorage.app",
    messagingSenderId: "367196609301",
    appId: "1:367196609301:web:156e24c1b4532c26af671c"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  const sidebar = document.querySelector('#sidebar');
  const toggleBtn = document.querySelector('#toggleSidebar');
  const projectList = document.querySelector('#projectList');
  const searchInput = document.querySelector('#searchInput');
  const frame = document.querySelector('#portalFrame');
  const breadcrumbEl = document.querySelector('#breadcrumb');

  const HOME_URL = normalize('https://black-ice-3dbk.onrender.com/');

  const setSidebar = (open)=>{
    sidebar.classList.toggle('open', !!open);
    sidebar.hidden = !open;
    toggleBtn.setAttribute('aria-expanded', !!open);
  };
  setSidebar(false);
  toggleBtn.addEventListener('click', ()=> setSidebar(!sidebar.classList.contains('open')));

  function sanitizeHTML(str){
    const d = document.createElement('div');
    d.textContent = str ?? '';
    return d.innerHTML;
  }

  function normalize(u){
    try{
      const x = new URL(u, location.href);
      x.hash = '';
      return x.href.replace(/\/+$/,'/');
    }catch{ return u }
  }

  function timeAgo(ts){
    if (!ts) return '';
    const rtf = new Intl.RelativeTimeFormat(undefined,{numeric:'auto'});
    const diff = ts - Date.now();
    const steps = [
      ['year',   1000*60*60*24*365],
      ['month',  1000*60*60*24*30],
      ['week',   1000*60*60*24*7],
      ['day',    1000*60*60*24],
      ['hour',   1000*60*60],
      ['minute', 1000*60],
      ['second', 1000],
    ];
    for (const [unit, ms] of steps){
      const val = Math.round(diff/ms);
      if (Math.abs(val) >= 1) return rtf.format(val, unit);
    }
    return rtf.format(0,'second');
  }

  // Breadcrumb rendering
  function setBreadcrumbParts(parts){
    breadcrumbEl.innerHTML = parts
      .filter(Boolean)
      .map(sanitizeHTML)
      .join(' <span class="sep">&lt;</span> ');
  }
  function setBreadcrumbForUrl(url, title){
    const isHome = normalize(url) === HOME_URL;
    if (isHome){
      setBreadcrumbParts(['Home Screen']);
    }else{
      setBreadcrumbParts(['Home Screen', 'Projects', title && title.trim()]);
    }
  }

  // Click breadcrumb badge to go Home
  breadcrumbEl.addEventListener('click', ()=>{
    frame.src = HOME_URL;
    setBreadcrumbForUrl(HOME_URL, '');
  });

  // Update breadcrumb when iframe loads (same-origin read allowed, else fallback)
  frame.addEventListener('load', ()=>{
    let title = '';
    try{
      title = frame.contentDocument?.title || frame.contentWindow?.document?.title || '';
      if (title) {
        setBreadcrumbForUrl(frame.src, title);
        return;
      }
    }catch{
      // Cross-origin: cannot read title directly, fallback to hostname until message arrives
    }
    const host = (()=>{ try{ return new URL(frame.src).hostname }catch{ return '' }})();
    setBreadcrumbForUrl(frame.src, host);
  });

  // Cross-origin title updates via postMessage
  window.addEventListener('message', (e)=>{
    // Accept only from the currently loaded iframe origin and source
    let currentOrigin = '';
    try{ currentOrigin = new URL(frame.src).origin }catch{}
    if (e.origin !== currentOrigin) return;
    if (e.source !== frame.contentWindow) return;

    if (e.data && e.data.type === 'title'){
      const t = String(e.data.title || '').slice(0, 120);
      setBreadcrumbForUrl(frame.src, t || new URL(frame.src).hostname);
    }
  });

  let allSites = [];
  let queryText = '';

  function renderList(){
    let list = allSites.slice();

    if (queryText){
      const q = queryText.toLowerCase();
      list = list.filter(s => 
        (s.title || '').toLowerCase().includes(q) || 
        (s.description || '').toLowerCase().includes(q)
      );
    }

    if (!list.length){
      projectList.innerHTML = `<li class="item"><div>No matches</div></li>`;
      return;
    }

    projectList.innerHTML = list.map(site => {
      const safeTitle = sanitizeHTML(site.title);
      const safeUrl = sanitizeHTML(site.url);
      const when = site.timestamp ? timeAgo(site.timestamp) : "";
      return `
        <li class="item item-row">
          <button type="button" class="project-btn" data-url="${safeUrl}">
            <div>
              <div class="title">${safeTitle}</div>
              ${when ? `<div class="meta">${sanitizeHTML(when)}</div>` : ""}
            </div>
          </button>
          <button class="copy-btn" data-copy="${safeUrl}">or Copylink</button>
        </li>
      `;
    }).join("");

    projectList.querySelectorAll('.project-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const url = btn.dataset.url;
        frame.src = url;
        // Immediate breadcrumb feedback while loading
        setBreadcrumbParts(['Home Screen', 'Projects', 'Loading…']);
        projectList.querySelectorAll('.project-btn.active').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
        setSidebar(false);
      });
    });

    projectList.querySelectorAll('.copy-btn').forEach(btn=>{
      btn.addEventListener('click', (e)=>{
        e.stopPropagation();
        const url = btn.dataset.copy;
        navigator.clipboard.writeText(url).then(()=>{
          btn.textContent = "Copied!";
          setTimeout(()=> btn.textContent = "Copy", 900);
        });
      });
    });
  }

  searchInput.addEventListener('input', (e)=>{
    queryText = e.target.value.trim();
    renderList();
  });

  onValue(ref(db, 'sites'), snapshot=>{
    const sites = snapshot.val();
    if (!sites){
      projectList.innerHTML = `<li>No projects yet</li>`;
      return;
    }
    allSites = Object.entries(sites).map(([id, site])=>({
      id,
      title: site.title || "Untitled",
      url: site.url || "#",
      timestamp: site.timestamp || 0,
      description: site.description || ""
    }));
    allSites.sort((a,b)=> (b.timestamp || 0) - (a.timestamp || 0));
    renderList();
  });
</script>

</body>
</html>
