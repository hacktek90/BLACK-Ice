<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Home Screen</title>

<!-- Preload connections to speed up iframe navigation -->
<link rel="preconnect" href="https://black-ice-3dbk.onrender.com" crossorigin>
<link rel="dns-prefetch" href="//black-ice-3dbk.onrender.com">

<style>
  :root{
    --topbar: 56px;
    --bg: #f7f8fb;
    --surface: #ffffff;
    --surface-2: #fafbff;
    --text: #111827;
    --muted: #6b7280;
    --border: #e5e7eb;
    --hover: #f3f4f6;
    --accent: #2563eb;
    --ring: 0 0 0 4px rgba(37,99,235,.18);
    --shadow-sm: 0 1px 2px rgba(0,0,0,.06);
    --shadow-md: 0 10px 24px rgba(0,0,0,.12);
    --radius: 14px;
    --sidebar-w: 300px;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, "Helvetica Neue", Arial;
    line-height:1.45;
  }

  /* Top bar */
  .topbar{
    height: var(--topbar);
    position: sticky; top:0; z-index: 100;
    display:flex; align-items:center; gap:12px;
    padding:10px 16px;
    background:var(--surface);
    border-bottom:1px solid var(--border);
    box-shadow: var(--shadow-sm);
  }
  .brand{ font-weight:650; letter-spacing:.2px; }

  /* Toggle button */
  #toggleSidebar{
    width:40px; height:40px;
    border-radius:10px;
    background:var(--surface);
    border:1px solid var(--border);
    color:var(--text);
    font-size:20px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; transition:.2s;
  }
  #toggleSidebar:hover{ background:var(--hover); }
  #toggleSidebar:focus-visible{ outline:none; box-shadow: var(--ring); }

  /* Off-canvas sidebar (all devices) */
  nav.sidebar{
    position: fixed;
    inset: var(--topbar) auto 0 0;
    width: var(--sidebar-w);
    z-index: 120;
    background:var(--surface);
    border-right:1px solid var(--border);
    padding:16px;
    overflow-y:auto;
    transform: translateX(-100%);
    transition: transform .3s ease;
    box-shadow: var(--shadow-md);
  }
  nav.sidebar.open{ transform: translateX(0); }

  .side-hd{ font-weight:650; margin-bottom:8px; }
  .side-search{ position:relative; margin-bottom:12px; }
  .side-search input{
    width:100%; height:38px; padding:0 12px 0 40px;
    border:1px solid var(--border); border-radius:10px;
    background:var(--surface-2); color:var(--text);
  }
  .side-search input:focus{ outline:none; border-color:var(--accent); box-shadow: var(--ring); }
  .side-search .icon{
    position:absolute; top:10px; left:12px; width:18px; height:18px; color:#6b7280;
    pointer-events:none;
  }

  /* Projects list */
  .list{ list-style:none; padding:0; margin:0; }
  .item button{
    width:100%;
    display:flex; align-items:start; gap:10px;
    padding:10px 10px;
    border-radius:10px;
    background:transparent;
    color:var(--text);
    border:1px solid transparent;
    cursor:pointer;
    text-align:left;
    transition:.15s;
  }
  .item button:hover{ background:var(--hover); border-color:var(--border); }
  .item button:focus-visible{ outline:none; box-shadow: var(--ring); }
  .item .title{ font-weight:600; line-height:1.25; }
  .item .meta{ color:var(--muted); font-size:.85rem; }
  .item button.active{ background:var(--hover); border-color:var(--accent); }

  /* Sidebar skeleton */
  .skeleton{ padding:6px 0; }
  .sk-row{
    height:16px; border-radius:8px;
    background: linear-gradient(90deg,#e5e7eb 0%, #f3f4f6 50%, #e5e7eb 100%);
    background-size:200% 100%; animation: shimmer 1.1s infinite;
  }
  .sk-row.w70{ width:70%; } .sk-row.w50{ width:50%; }
  @keyframes shimmer { 0%{ background-position:200% 0; } 100%{ background-position:-200% 0; } }

  /* Main iframe area (full viewport under topbar) */
  main{ padding:0; }
  .frame-wrap{
    position:relative;
    height: calc(100dvh - var(--topbar));
    height: calc(100vh - var(--topbar));
    background:#fff;
  }
  iframe.portal{
    position:absolute; inset:0;
    width:100%; height:100%;
    border:0; display:block; background:#fff;
  }
</style>
</head>
<body>

<header class="topbar" role="banner">
  <button id="toggleSidebar" aria-label="Toggle project list" aria-expanded="false" aria-controls="sidebar">
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
       stroke-linecap="round" stroke-linejoin="round">
    <line x1="3" y1="6" x2="21" y2="6"></line>
    <line x1="3" y1="12" x2="21" y2="12"></line>
    <line x1="3" y1="18" x2="21" y2="18"></line>
  </svg>
</button>

  <div class="brand">Home Screen</div>
</header>

<!-- Sidebar with projects (off-canvas on all devices) -->
<nav id="sidebar" class="sidebar" aria-label="Projects" hidden>
  <div class="side-hd">Projects</div>
  <div class="side-search" role="search">
    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" stroke="currentColor" fill="none"/><line x1="16.65" y1="16.65" x2="21" y2="21" stroke="currentColor"/></svg>
    <input id="searchInput" type="search" placeholder="Search projects..." autocomplete="off" aria-label="Search projects" />
  </div>
  <ul id="projectList" class="list" aria-live="polite" aria-busy="true">
    <!-- Skeleton while loading -->
    <li class="skeleton"><div class="sk-row w70"></div></li>
    <li class="skeleton"><div class="sk-row w50"></div></li>
    <li class="skeleton"><div class="sk-row w70"></div></li>
    <li class="skeleton"><div class="sk-row w50"></div></li>
  </ul>
</nav>

<!-- Clean home screen with embedded portal -->
<main id="main">
  <div class="frame-wrap">
    <iframe
      id="portalFrame"
      class="portal"
      src="https://black-ice-3dbk.onrender.com/"
      title="BlackICE Academy — Ethical Hacking Learning Portal"
      referrerpolicy="no-referrer-when-downgrade"
      allow="fullscreen; clipboard-read; clipboard-write; geolocation; microphone; camera"
      loading="eager">
    </iframe>
  </div>
</main>

<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
  import { getDatabase, ref, onValue } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';

  const firebaseConfig = {
    apiKey: "AIzaSyAp9kCBsDLnQEmR7wWHXwt3FB2T1zDtiqU",
    authDomain: "h-90-8a7c5.firebaseapp.com",
    databaseURL: "https://h-90-8a7c5-default-rtdb.firebaseio.com",
    projectId: "h-90-8a7c5",
    storageBucket: "h-90-8a7c5.firebasestorage.app",
    messagingSenderId: "367196609301",
    appId: "1:367196609301:web:156e24c1b4532c26af671c"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  const $ = (s)=>document.querySelector(s);
  const sidebar = $('#sidebar');
  const projectList = $('#projectList');
  const searchInput = $('#searchInput');
  const toggleBtn = $('#toggleSidebar');
  const frame = document.getElementById('portalFrame');
  const portalURL = 'https://black-ice-3dbk.onrender.com/';

  // Sidebar toggle (all devices): update aria-expanded and visibility
  const setSidebar = (open)=>{
    sidebar.classList.toggle('open', !!open);
    toggleBtn.setAttribute('aria-expanded', !!open);
    sidebar.hidden = !open;
  };
  setSidebar(false);
  toggleBtn.addEventListener('click', ()=> setSidebar(!sidebar.classList.contains('open')));

  const sanitizeHTML = (str)=>{
    const t = document.createElement('div');
    t.textContent = str ?? '';
    return t.innerHTML;
  };

  const timeAgo = (ts)=>{
    if (!ts) return '';
    const rtf = new Intl.RelativeTimeFormat(undefined,{numeric:'auto'});
    const diff = ts - Date.now();
    const steps = [
      ['year',   1000*60*60*24*365],
      ['month',  1000*60*60*24*30],
      ['week',   1000*60*60*24*7],
      ['day',    1000*60*60*24],
      ['hour',   1000*60*60],
      ['minute', 1000*60],
      ['second', 1000],
    ];
    for (const [unit, ms] of steps){
      const val = Math.round(diff/ms);
      if (Math.abs(val) >= 1) return rtf.format(val, unit);
    }
    return rtf.format(0,'second');
  };

  // Sidebar list; clicking loads into the iframe
  let allSites = [];
  let queryText = '';

  const renderList = ()=>{
    projectList.setAttribute('aria-busy','false');
    let list = allSites.slice();

    if (queryText){
      const q = queryText.toLowerCase();
      list = list.filter(s=>{
        const title = (s.title||'').toLowerCase();
        const desc = (s.description||'').toLowerCase();
        return title.includes(q) || desc.includes(q);
      });
    }

    if (!list.length){
      projectList.innerHTML = `<li class="item"><button type="button" tabindex="-1"><div><div class="title">No matches</div><div class="meta">Try a different search</div></div></button></li>`;
      return;
    }

    projectList.innerHTML = list.map(site=>{
      const safeTitle = sanitizeHTML(site.title || 'Untitled');
      const when = site.timestamp ? timeAgo(site.timestamp) : '';
      const safeUrl = sanitizeHTML(site.url || '#');
      return `
        <li class="item">
          <button type="button" class="project-btn" data-url="${safeUrl}">
            <div>
              <div class="title">${safeTitle}</div>
              ${when ? `<div class="meta">${sanitizeHTML(when)}</div>` : ''}
            </div>
          </button>
        </li>
      `;
    }).join('');

    // Hook up click handlers
    projectList.querySelectorAll('.project-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const url = btn.dataset.url || portalURL;
        frame.src = url; // load into iframe
        projectList.querySelectorAll('.project-btn.active').forEach(b=> b.classList.remove('active'));
        btn.classList.add('active');
        setSidebar(false);
      });
    });
  };

  searchInput.addEventListener('input', (e)=>{
    queryText = e.target.value.trim();
    renderList();
  });

  onValue(ref(db, 'sites'), (snapshot)=>{
    const sites = snapshot.val();
    if (!sites){
      projectList.innerHTML = `<li class="item"><button type="button" tabindex="-1"><div><div class="title">No projects yet</div><div class="meta">Add some to get started</div></div></button></li>`;
      projectList.setAttribute('aria-busy','false');
      return;
    }
    const arr = Object.entries(sites).map(([id, site])=> ({
      id,
      title: site.title ?? 'Untitled',
      url: site.url ?? '#',
      timestamp: site.timestamp ?? 0,
      description: site.description ?? ''
    }));
    arr.sort((a,b)=> (b.timestamp||0) - (a.timestamp||0));
    allSites = arr;
    renderList();
  });
</script>

</body>
</html>
