<style>
    /* --- CSS VARIABLES & RESET --- */
    :root {
        --bg-body: #050505;
        --bg-app: #09090b;
        --bg-surface: #18181b;
        --bg-input: #09090b;
        
        --border-color: #27272a;
        --border-hover: #3f3f46;
        
        --primary: #3b82f6;
        --primary-hover: #2563eb;
        --primary-dim: rgba(59, 130, 246, 0.1);
        
        --text-main: #e4e4e7;
        --text-muted: #a1a1aa;
        
        --font-family: 'Satoshi', -apple-system, BlinkMacSystemFont, sans-serif;
        
        --sidebar-width: 240px;
        --sidebar-collapsed-width: 60px;
        --radius: 8px;
    }

    * { box-sizing: border-box; }

    body {
        margin: 0;
        background-color: var(--bg-body);
        color: var(--text-main);
        font-family: var(--font-family);
        overflow: hidden;
        width: 100vw;
        height: 100vh;
        /* Grid Background */
        background-image:
            linear-gradient(rgba(59,130,246,0.03) 1px, transparent 1px),
            linear-gradient(90deg, rgba(59,130,246,0.03) 1px, transparent 1px);
        background-size: 30px 30px;
    }

    /* --- UTILITIES --- */
    .hidden { display: none !important; }
    .flex { display: flex; }
    .flex-col { flex-direction: column; }
    .items-center { align-items: center; }
    .justify-between { justify-content: space-between; }
    .justify-center { justify-content: center; }
    .gap-1 { gap: 0.25rem; }
    .gap-1\.5 { gap: 0.375rem; }
    .gap-2 { gap: 0.5rem; }
    .w-full { width: 100%; }
    .h-full { height: 100%; }
    .relative { position: relative; }
    .absolute { position: absolute; }
    .text-primary { color: var(--primary); }
    .font-bold { font-weight: 700; }
    .text-sm { font-size: 0.875rem; }
    .text-xs { font-size: 0.75rem; }
    .pointer-events-none { pointer-events: none; }
    .pointer-events-auto { pointer-events: auto; }
    
    /* --- SCROLLBARS --- */
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #52525b; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* --- LAYOUT --- */
    .app-container {
        display: flex;
        width: 100vw;
        height: 100vh;
        background: transparent;
    }

    /* --- SIDEBAR --- */
    .sidebar {
        width: var(--sidebar-width);
        background-color: var(--bg-surface);
        border-right: 1px solid var(--border-color);
        display: flex;
        flex-direction: column;
        position: relative;
        z-index: 50;
        transition: width 0.3s cubic-bezier(.4,0,.2,1);
        overflow: hidden;
        flex-shrink: 0;
    }

    .sidebar-collapsed { width: var(--sidebar-collapsed-width) !important; }
    .sidebar-collapsed .hide-on-collapse { display: none !important; opacity: 0; pointer-events: none; }
    .sidebar-collapsed .center-on-collapse { justify-content: center; margin: 0; }

    .sidebar-header {
        padding: 12px;
        border-bottom: 1px solid var(--border-color);
        min-height: 57px;
    }

    .sidebar-content {
        flex: 1;
        overflow-y: auto;
        padding: 8px;
    }

    .sidebar-footer {
        padding: 10px;
        border-top: 1px solid var(--border-color);
        background-color: #121214;
        display: flex;
        align-items: center;
        justify-content: space-between;
    }

    /* --- COMPONENTS --- */
    
    /* Buttons */
    .btn-icon {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 4px;
        border-radius: 6px;
        color: var(--text-muted);
        background: transparent;
        border: none;
        cursor: pointer;
        transition: all 0.2s;
    }
    .btn-icon:hover { background-color: var(--border-color); color: white; }
    .btn-icon svg { width: 14px; height: 14px; }
    .btn-icon.small svg { width: 12px; height: 12px; }

    .btn-primary {
        background-color: var(--primary-dim);
        color: var(--primary);
        border: 1px solid rgba(59, 130, 246, 0.2);
        padding: 4px 6px;
        border-radius: 4px;
        font-size: 9px;
        font-weight: 700;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 4px;
        transition: background 0.2s;
    }
    .btn-primary:hover { background-color: rgba(59, 130, 246, 0.2); }

    /* Inputs */
    .input-wrapper { position: relative; width: 100%; }
    .input-field {
        width: 100%;
        background-color: var(--bg-input);
        border: 1px solid var(--border-color);
        border-radius: 8px;
        padding: 6px 8px 6px 32px;
        font-size: 12px;
        color: var(--text-main);
        outline: none;
        transition: border 0.2s;
    }
    .input-field:focus { border-color: var(--primary); }
    .input-icon {
        position: absolute;
        left: 10px;
        top: 50%;
        transform: translateY(-50%);
        width: 14px; height: 14px;
        color: var(--text-muted);
        pointer-events: none;
    }
    .input-kbd {
        position: absolute;
        right: 10px;
        top: 50%;
        transform: translateY(-50%);
        font-size: 9px;
        color: var(--text-muted);
        border: 1px solid var(--border-color);
        padding: 0 4px;
        border-radius: 4px;
        background: var(--border-color);
    }

    /* Project Cards */
    .project-card {
        width: 100%;
        text-align: left;
        padding: 6px;
        border-radius: 8px;
        margin-bottom: 4px;
        display: flex;
        align-items: center;
        gap: 8px;
        border: 1px solid transparent;
        cursor: pointer;
        position: relative;
        overflow: hidden;
        transition: background 0.2s ease, transform 0.1s;
    }
    
    /* Card Hover Glow Effect */
    .project-card::after {
        content: "";
        position: absolute;
        top: var(--y, 0);
        left: var(--x, 0);
        width: 250px; height: 250px;
        background: radial-gradient(circle, rgba(59,130,246,0.1), transparent 70%);
        transform: translate(-50%, -50%);
        opacity: 0;
        transition: opacity 0.3s;
        pointer-events: none;
        z-index: 1;
    }
    .project-card:hover::after { opacity: 1; }
    .project-card:hover { background-color: #27272a; }
    
    /* Active State */
    .project-card.active {
        background-color: rgba(59,130,246,0.08);
        border: 1px solid rgba(59,130,246,0.2);
    }
    .project-card.active::before {
        content: '';
        position: absolute;
        left: 0; top: 6px; bottom: 6px; width: 3px;
        background-color: var(--primary);
        border-radius: 0 4px 4px 0;
        box-shadow: 0 0 10px rgba(59,130,246,0.5);
        z-index: 3;
    }
    .project-card.active .title-text { color: #60a5fa; font-weight: 700; }

    .card-icon {
        width: 28px; height: 28px;
        border-radius: 6px;
        background: var(--bg-surface);
        border: 1px solid var(--border-color);
        overflow: hidden;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
    }
    .card-icon img { width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 0.3s; }
    .card-icon img.loaded { opacity: 1; }
    
    .card-info { flex: 1; min-width: 0; }
    .title-text { font-size: 12px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .subtitle-text { font-size: 9px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }

    .card-actions { display: flex; align-items: center; gap: 4px; }

    /* Action Buttons on Card */
    .copy-btn {
        opacity: 0;
        padding: 4px;
        border-radius: 4px;
        color: var(--text-muted);
        cursor: pointer;
        pointer-events: none;
        background: transparent;
        border: none;
        display: flex;
        align-items: center;
        transition: all 0.2s;
    }
    .copy-btn:hover { background-color: #3f3f46; color: white; }
    .project-card.active .copy-btn { opacity: 1; pointer-events: auto; }
    .copy-btn.copied { background-color: #10b981 !important; color: white !important; }

    .pin-toggle-btn {
        opacity: 0;
        padding: 4px;
        border-radius: 4px;
        color: var(--text-muted);
        cursor: pointer;
        pointer-events: none;
        background: transparent;
        border: none;
        display: flex;
        align-items: center;
        transition: all 0.2s;
    }
    .pin-toggle-btn:hover { background-color: #3f3f46; color: white; }
    .pin-toggle-btn.is-pinned { opacity: 1; color: var(--primary); pointer-events: auto; }
    .project-card.active .pin-toggle-btn { opacity: 1; pointer-events: auto; }

    /* --- MAIN AREA --- */
    .main-area {
        flex: 1;
        display: flex;
        flex-direction: column;
        position: relative;
        height: 100%;
        background: transparent;
        overflow: hidden;
    }

    .history-bar {
        height: 36px;
        background-color: var(--bg-app);
        border-bottom: 1px solid var(--border-color);
        display: flex;
        align-items: center;
        padding: 0 12px;
        gap: 8px;
        overflow: hidden;
        z-index: 10;
        flex-shrink: 0;
    }
    .history-chips { display: flex; gap: 8px; overflow-x: auto; }

    /* Split View */
    .split-container {
        flex: 1;
        position: relative;
        display: flex;
        width: 100%;
        height: 100%;
    }
    .split-pane {
        position: relative;
        overflow: hidden;
        height: 100%;
        transition: opacity 0.2s ease;
    }
    .split-pane iframe { width: 100%; height: 100%; border: none; background: white; }
    
    .split-pane.inactive { opacity: 0.45; }
    .split-pane.active { opacity: 1; }

    .pane-indicator {
        position: absolute;
        top: 10px; right: 10px;
        z-index: 30;
        background: rgba(9,9,11,0.75);
        border: 1px solid var(--border-color);
        color: var(--text-muted);
        padding: 4px 10px;
        border-radius: 8px;
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.08em;
        display: none;
        backdrop-filter: blur(4px);
        pointer-events: auto;
        cursor: pointer;
    }
    .split-view-active .pane-indicator { display: block; }
    .split-pane.active .pane-indicator {
        border-color: rgba(59,130,246,0.35);
        background: rgba(59,130,246,0.12);
        color: #60a5fa;
        pointer-events: none;
    }

    .split-resizer {
        width: 6px;
        background: var(--bg-surface);
        cursor: col-resize;
        flex: 0 0 auto;
        border-left: 1px solid var(--border-color);
        border-right: 1px solid var(--border-color);
        position: relative;
        z-index: 50;
        display: none; /* Hidden by default */
    }
    .split-view-active .split-resizer { display: block; }
    
    .split-resizer::after {
        content: '';
        position: absolute;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        width: 4px; height: 26px;
        background: #52525b;
        border-radius: 99px;
    }
    .split-resizer:hover, .split-resizer.dragging { background: var(--primary); border-color: var(--primary); }
    .split-resizer:hover::after, .split-resizer.dragging::after { background: white; }

    /* Empty State */
    .empty-state {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
        z-index: 10;
        pointer-events: none;
    }
    .empty-icon {
        width: 80px; height: 80px;
        background: var(--bg-surface);
        border-radius: 24px;
        border: 1px solid var(--border-color);
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 24px;
        box-shadow: 0 0 30px rgba(59,130,246,0.1);
    }

    /* Loader */
    .loader-overlay {
        position: absolute;
        inset: 0;
        z-index: 20;
        background: var(--bg-app);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
    }
    .loader-spinner {
        border: 4px solid var(--border-color);
        border-top: 4px solid var(--primary);
        border-radius: 50%;
        width: 48px; height: 48px;
        animation: spin 0.8s linear infinite;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    /* Command Palette */
    .cmd-palette {
        position: fixed;
        inset: 0;
        z-index: 100;
        background: rgba(9,9,11,0.8);
        backdrop-filter: blur(4px);
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding-top: 15vh;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s;
    }
    .cmd-palette.open { opacity: 1; pointer-events: auto; }
    
    .cmd-content {
        width: 100%;
        max-width: 512px;
        background: var(--bg-surface);
        border: 1px solid var(--border-color);
        border-radius: 12px;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        overflow: hidden;
        transform: scale(0.95);
        transition: transform 0.2s;
    }
    .cmd-palette.open .cmd-content { transform: scale(1); }

    .cmd-header { padding: 12px; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; gap: 8px; }
    .cmd-input {
        width: 100%;
        background: transparent;
        border: none;
        outline: none;
        color: white;
        font-family: monospace;
        font-size: 14px;
    }
    .cmd-input::placeholder { color: #6b7280; }
    
    .cmd-results { max-height: 300px; overflow-y: auto; padding: 8px; }
    .cmd-item {
        width: 100%;
        text-align: left;
        padding: 8px 12px;
        border-radius: 6px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        cursor: pointer;
        color: #d1d5db;
    }
    .cmd-item:hover { background: var(--border-color); color: white; }

    /* Audio Dropdown */
    .audio-dropdown {
        position: absolute;
        bottom: 100%;
        right: 0;
        margin-bottom: 8px;
        width: 192px;
        background: var(--bg-surface);
        border: 1px solid var(--border-color);
        border-radius: 8px;
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
        z-index: 50;
        overflow: hidden;
        animation: scaleIn 0.1s ease-out forwards;
    }
    @keyframes scaleIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    
    .track-option {
        width: 100%;
        text-align: left;
        padding: 6px 8px;
        font-size: 12px;
        color: #d1d5db;
        background: transparent;
        border: none;
        display: flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
    }
    .track-option:hover { background: var(--border-color); }
    .track-option.active { background: rgba(59,130,246,0.1); color: #60a5fa; }

    /* Section Headers */
    .section-header {
        padding: 0 8px;
        margin-bottom: 4px;
        font-size: 9px;
        text-transform: uppercase;
        font-weight: 700;
        color: var(--text-muted);
        letter-spacing: 0.05em;
        display: flex;
        align-items: center;
        gap: 4px;
    }
    .divider { height: 1px; background: var(--border-color); margin: 8px 8px; }

</style>

<!-- MAIN SCRIPT -->
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
import { getDatabase, ref, onValue } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';

const firebaseConfig = {
    apiKey: "AIzaSyAp9kCBsDLnQEmR7wWHXwt3FB2T1zDtiqU",
    authDomain: "h-90-8a7c5.firebaseapp.com",
    databaseURL: "https://h-90-8a7c5-default-rtdb.firebaseio.com",
    projectId: "h-90-8a7c5",
    storageBucket: "h-90-8a7c5.appspot.com",
    messagingSenderId: "367196609301",
    appId: "1:367196609301:web:156e24c1b4532c26af671c"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// Elements
const els = {
    list: document.getElementById('projectList'),
    pinnedList: document.getElementById('pinnedList'),
    pinnedSection: document.getElementById('pinnedSection'),
    frame: document.getElementById('portalFrame'),
    frame2: document.getElementById('portalFrame2'),
    loader: document.getElementById('frameLoader'),
    empty: document.getElementById('emptyState'),
    search: document.getElementById('searchInput'),
    cmdPalette: document.getElementById('cmdPalette'),
    cmdInput: document.getElementById('cmdInput'),
    cmdResults: document.getElementById('cmdResults'),
};

// Audio Click
const clickAudio = new Audio('/test/914-preview.mp3');
clickAudio.preload = 'auto';
function playClickSound() {
    clickAudio.currentTime = 0;
    clickAudio.play().catch(err => console.log('Audio play failed:', err));
}

if (window.autoAnimate && els.list) window.autoAnimate(els.list);
if (window.autoAnimate && els.pinnedList) window.autoAnimate(els.pinnedList);
lucide.createIcons();

// Status
function updateStatus() {
    const d = document.getElementById('statusDot');
    const t = document.getElementById('pingText');
    if (!d || !t) return;
    if (navigator.onLine) {
        d.style.background = '#22c55e';
        d.style.boxShadow = '0 0 6px rgba(34,197,94,0.6)';
        t.innerText = "ONLINE";
        t.className = "text-xs font-mono hide-on-collapse";
        t.style.color = "#22c55e";
    } else {
        d.style.background = '#ef4444';
        d.style.boxShadow = '0 0 6px rgba(239,68,68,0.6)';
        t.innerText = "OFFLINE";
        t.className = "text-xs font-mono hide-on-collapse";
        t.style.color = "#ef4444";
    }
}
window.addEventListener('online', updateStatus);
window.addEventListener('offline', updateStatus);
updateStatus();

// Mouse Effect
document.addEventListener('mousemove', (e) => {
    document.querySelectorAll('.project-card').forEach(card => {
        const rect = card.getBoundingClientRect();
        card.style.setProperty('--x', `${e.clientX - rect.left}px`);
        card.style.setProperty('--y', `${e.clientY - rect.top}px`);
    });
});

let allSites = [];
let pinnedIds = JSON.parse(localStorage.getItem('pinnedProjects') || '[]');

function convertToLocalHostUrl(url) {
    try {
        const u = new URL(url);
        if (window.location.protocol === 'file:') return u.pathname.startsWith('/') ? u.pathname.substring(1) : u.pathname;
        return window.location.origin + u.pathname;
    } catch { return url; }
}

window.loadProject = function(url, btnElement) {
    playClickSound();
    els.loader.classList.remove('hidden');
    els.empty.classList.add('hidden');
    
    document.querySelectorAll('.project-card').forEach(b => b.classList.remove('active'));
    if (btnElement) btnElement.classList.add('active');
    
    const targetFrame = (window.splitViewEnabled && window.currentActivePane === 'right') ? els.frame2 : els.frame;
    
    targetFrame.src = convertToLocalHostUrl(url);
    targetFrame.addEventListener('load', () => els.loader.classList.add('hidden'), { once: true });
    
    const site = allSites.find(s => convertToLocalHostUrl(s.url) === convertToLocalHostUrl(url) || s.url === url);
    if (site) {
        if (typeof window.addToHistory === 'function') {
            window.addToHistory(site.title, site.url);
        }
        const projectParam = encodeURIComponent(site.title || site.id || site.url);
        const newUrl = `${window.location.pathname}?project=${projectParam}`;
        window.history.pushState({}, '', newUrl);
    }
}

function createCard(site, isPinned) {
    const screenshot = `https://api.microlink.io/?url=${encodeURIComponent(site.url)}&screenshot=true&meta=false&embed=screenshot.url&viewport.width=800&viewport.height=600`;
    const btn = document.createElement('button');
    // Removed Tailwind classes, using standard CSS class 'project-card'
    btn.className = 'project-card';
    
    const projectParam = encodeURIComponent(site.title || site.id || site.url);
    const shareableLink = `${window.location.origin}${window.location.pathname}?project=${projectParam}`;
    
    btn.innerHTML = `
    <div class="card-icon">
    <img src="${screenshot}" loading="lazy"
    onload="this.classList.add('loaded')" onerror="this.style.display='none'">
    <div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: #18181b; z-index: -1;">
    <svg xmlns="http://www.w3.org/2000/svg" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-muted">
    <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4A2 2 0 0 0 14 22l7-4A2 2 0 0 0 21 16z"></path>
    </svg>
    </div>
    </div>
    <div class="card-info hide-on-collapse">
    <div class="title-text group-hover:text-white">${site.title || 'Untitled'}</div>
    <div class="subtitle-text group-hover:text-gray-300">Project</div>
    </div>
    <div class="card-actions hide-on-collapse">
    <button class="copy-btn" title="Copy shareable link">
    <i data-lucide="link" style="width: 12px;"></i>
    </button>
    <div class="pin-toggle-btn ${isPinned ? 'is-pinned' : ''}">
    <i data-lucide="pin" style="width: 12px;" class="${isPinned ? 'fill-current' : ''}"></i>
    </div>
    </div>
    `;
    
    // Re-attach event listeners specifically for the new buttons
    const copyBtn = btn.querySelector('.copy-btn');
    copyBtn.onclick = (e) => window.copyProjectLink(e, shareableLink, copyBtn);
    
    const pinBtn = btn.querySelector('.pin-toggle-btn');
    pinBtn.onclick = (e) => window.togglePin(site.id || site.url, e);

    btn.onclick = (e) => {
        if (!e.target.closest('.copy-btn') && !e.target.closest('.pin-toggle-btn')) {
            loadProject(site.url, btn);
        }
    };
    return btn;
}

function renderProjects() {
    els.list.innerHTML = '';
    els.pinnedList.innerHTML = '';
    const pinned = [];
    const others = [];
    allSites.forEach(site => {
        const id = site.id || site.url;
        if (pinnedIds.includes(id)) pinned.push(site);
        else others.push(site);
    });
    if (pinned.length > 0) {
        els.pinnedSection.classList.remove('hidden');
        pinned.forEach(site => els.pinnedList.appendChild(createCard(site, true)));
    } else {
        els.pinnedSection.classList.add('hidden');
    }
    others.forEach(site => els.list.appendChild(createCard(site, false)));
    lucide.createIcons();
}

function loadProjectFromURL() {
    const urlParams = new URLSearchParams(window.location.search);
    const projectParam = urlParams.get('project');
    if (projectParam && allSites.length > 0) {
        const decodedParam = decodeURIComponent(projectParam);
        const project = allSites.find(site =>
            site.title === decodedParam ||
            site.id === decodedParam ||
            site.url === decodedParam ||
            (site.title || '').toLowerCase() === decodedParam.toLowerCase()
        );
        if (project) {
            setTimeout(() => {
                const projectCard = Array.from(document.querySelectorAll('.project-card'))
                    .find(card => card.textContent.includes(project.title));
                loadProject(project.url, projectCard);
            }, 300);
        }
    }
}

onValue(ref(db, 'sites'), (snapshot) => {
    const data = snapshot.val();
    if (!data) {
        els.list.innerHTML = '<div style="padding: 12px; text-align: center; font-size: 10px; color: var(--text-muted);">No projects found</div>';
        return;
    }
    allSites = Object.entries(data)
        .map(([key, value]) => ({ ...value, id: key || value.url }))
        .sort((a,b) => (b.timestamp || 0) - (a.timestamp || 0));
    renderProjects();
    loadProjectFromURL();
});

els.search.oninput = (e) => {
    const q = e.target.value.toLowerCase();
    document.querySelectorAll('.project-card').forEach(btn => {
        const text = btn.innerText.toLowerCase();
        btn.style.display = text.includes(q) ? 'flex' : 'none';
    });
};

window.togglePin = function(id, e) {
    e.stopPropagation();
    if (pinnedIds.includes(id)) pinnedIds = pinnedIds.filter(pid => pid !== id);
    else pinnedIds.push(id);
    localStorage.setItem('pinnedProjects', JSON.stringify(pinnedIds));
    renderProjects();
}

window.copyProjectLink = function(event, link, buttonElement) {
    event.stopPropagation();
    navigator.clipboard.writeText(link).then(() => {
        const icon = buttonElement.querySelector('i');
        const originalIcon = icon.outerHTML;
        buttonElement.classList.add('copied');
        icon.outerHTML = '<i data-lucide="check" style="width: 12px;"></i>';
        lucide.createIcons();
        setTimeout(() => {
            buttonElement.classList.remove('copied');
            buttonElement.querySelector('i').outerHTML = originalIcon;
            lucide.createIcons();
        }, 2000);
    }).catch(err => {
        console.error('Failed to copy link:', err);
        alert('Link copied to clipboard');
    });
};

document.addEventListener('keydown', (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
        e.preventDefault();
        els.cmdPalette.classList.add('open');
        els.cmdInput.focus();
    }
    if (e.key === 'Escape') closeCmd();
});

function closeCmd() {
    els.cmdPalette.classList.remove('open');
}
els.cmdPalette.addEventListener('click', (e) => {
    if (e.target === els.cmdPalette) closeCmd();
});

els.cmdInput.addEventListener('input', (e) => {
    const q = e.target.value.toLowerCase();
    const results = allSites.filter(s => (s.title || '').toLowerCase().includes(q));
    els.cmdResults.innerHTML = results.slice(0, 5).map(site => `
    <button onclick="loadProjectFromCmd('${site.url}')" class="cmd-item">
    <span style="font-size: 14px;">${site.title}</span>
    <span style="font-size: 10px; color: #6b7280;">Jump to</span>
    </button>
    `).join('');
});
window.loadProjectFromCmd = (url) => { loadProject(url); closeCmd(); };

document.getElementById('osApkBtn').onclick = () => window.open(window.location.origin + '/scrapsites/osapk.html', '_blank');

document.getElementById('homeBtn').onclick = () => {
    els.loader.classList.remove('hidden');
    els.empty.classList.add('hidden');
    const targetFrame = (window.splitViewEnabled && window.currentActivePane === 'right') ? els.frame2 : els.frame;
    targetFrame.src = '/index.html';
    targetFrame.addEventListener('load', () => els.loader.classList.add('hidden'), { once: true });
    if (typeof window.addToHistory === 'function') window.addToHistory('Home', '/index.html');
    window.history.pushState({}, '', window.location.pathname);
};

document.getElementById('fullscreenBtn').onclick = () => {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
    else if (document.exitFullscreen) document.exitFullscreen();
};
</script>
