<style>
body{
background-color:#050505;
color:#e4e4e7;
overflow:hidden;

linear-gradient(rgba(59,130,246,0.03) 1px, transparent 1px),
linear-gradient(90deg, rgba(59,130,246,0.03) 1px, transparent 1px);
background-size:30px 30px;
}
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:#3f3f46;border-radius:10px;}
::-webkit-scrollbar-thumb:hover{background:#52525b;}
.solid-panel{background:#18181b;border-bottom:1px solid #27272a;}
#sidebar{transition:width .3s cubic-bezier(.4,0,.2,1), transform .3s cubic-bezier(.4,0,.2,1);}
.sidebar-collapsed .hide-on-collapse{display:none !important;opacity:0;pointer-events:none;}
.sidebar-collapsed{width:60px !important;}
.sidebar-collapsed .project-card{padding:8px;justify-content:center;}
.sidebar-collapsed .center-on-collapse{justify-content:center;margin:0;}
.project-card{
transition:background .2s ease, transform .1s;
position:relative;
overflow:hidden;
}
.project-card::after{
content:"";
position:absolute;
top:var(--y,0);
left:var(--x,0);
width:250px;height:250px;
background:radial-gradient(circle, rgba(59,130,246,0.1), transparent 70%);
transform:translate(-50%,-50%);
opacity:0;
transition:opacity .3s;
pointer-events:none;
z-index:1;
}
.project-card:hover::after{opacity:1;}
.project-card > *{position:relative;z-index:2;}
.project-card:hover{background:#27272a;}
.project-card.active{
background:rgba(59,130,246,0.08);
border:1px solid rgba(59,130,246,0.2);
}
.project-card.active::before{
content:'';
position:absolute;
left:0; top:6px; bottom:6px; width:3px;
background:#3b82f6;
border-radius:0 4px 4px 0;
box-shadow:0 0 10px rgba(59,130,246,0.5);
z-index:3;
}
.project-card.active .title-text{color:#60a5fa;font-weight:700;}
.screenshot-img{opacity:0;transition:opacity .3s;}
.screenshot-img.loaded{opacity:1;}
/* Simple Loader */
.loader-spinner {
border: 4px solid #27272a;
border-top: 4px solid #3b82f6;
border-radius: 50%;
width: 48px;
height: 48px;
animation: spin 0.8s linear infinite;
}
@keyframes spin {
0% { transform: rotate(0deg); }
100% { transform: rotate(360deg); }
}
/* Split view */
.split-pane{
position:relative;
overflow:hidden;
height:100%;
transition:opacity .2s ease;
}
.split-pane.inactive{opacity:0.45;}
.split-pane.active{opacity:1;}
.pane-indicator{
position:absolute;
top:10px; right:10px;
z-index:30;
background:rgba(9,9,11,0.75);
border:1px solid #27272a;
color:#a1a1aa;
padding:4px 10px;
border-radius:8px;
font-size:10px;
font-weight:800;
letter-spacing:0.08em;
display:none;
backdrop-filter:blur(4px);
pointer-events:auto;
cursor:pointer;
transition: all 0.2s ease;
}
.pane-indicator:hover {
background: rgba(39, 39, 42, 0.9);
color: white;
border-color: #52525b;
}
.split-view-active .pane-indicator{display:block;}
.split-pane.active .pane-indicator{
border-color:rgba(59,130,246,0.35);
background:rgba(59,130,246,0.12);
color:#60a5fa;
pointer-events: none;
}
.split-resizer{
width:6px;
background:#18181b;
cursor:col-resize;
flex:0 0 auto;
border-left:1px solid #27272a;
border-right:1px solid #27272a;
position:relative;
z-index:50;
}
.split-resizer:hover,.split-resizer.dragging{
background:#3b82f6;
border-color:#3b82f6;
}
.split-resizer::after{
content:'';
position:absolute;
top:50%; left:50%;
transform:translate(-50%,-50%);
width:4px; height:26px;
background:#52525b;
border-radius:999px;
}
.split-resizer:hover::after,.split-resizer.dragging::after{background:#fff;}
/* NEW: History styling in navbar */
.no-scrollbar::-webkit-scrollbar {
display: none;
}
.no-scrollbar {
-ms-overflow-style: none;
scrollbar-width: none;
}
/* === MODIFIED BUTTON STYLES === */
/* Copy Link Button */
.copy-btn {
opacity: 0;
transition: opacity 0.2s, background 0.2s;
pointer-events: none; /* Can't click when hidden */
}
/* Show buttons only when card is active/selected */
.project-card.active .copy-btn {
opacity: 1;
pointer-events: auto;
}
.copy-btn:hover {
background: #3f3f46 !important;
}
.copy-btn.copied {
background: #10b981 !important;
color: white !important;
}
/* Pin button visibility */
.pin-toggle-btn {
opacity: 0;
transition: opacity 0.2s, background 0.2s;
pointer-events: none;
}
/* Keep pinned items visible always */
.project-card .pin-toggle-btn.is-pinned {
opacity: 1;
pointer-events: auto;
}
/* Show pin button on active card */
.project-card.active .pin-toggle-btn {
opacity: 1;
pointer-events: auto;
}
/* AUDIO DROPDOWN STYLING */
#audioDropdown {
transform-origin: bottom right;
animation: scaleIn 0.1s ease-out forwards;
}
@keyframes scaleIn {
from { opacity: 0; transform: scale(0.95); }
to { opacity: 1; transform: scale(1); }
}
.track-option.active {
background: rgba(59,130,246,0.1);
color: #60a5fa;
}

/* === GESTURE CONTROL STYLES (ADDED) === */
#gestureOverlay {
    position: fixed; inset: 0; pointer-events: none; z-index: 9999;
}
#gestureCursor {
    position: absolute;
    width: 20px; height: 20px;
    border: 2px solid #3b82f6;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    transition: width 0.1s, height 0.1s, background-color 0.1s;
    box-shadow: 0 0 15px rgba(59, 130, 246, 0.5);
    opacity: 0;
    backdrop-filter: blur(1px);
    pointer-events: none;
}
#gestureCursor.active { opacity: 1; }
#gestureCursor.pinching {
    width: 12px; height: 12px;
    background-color: rgba(59, 130, 246, 0.5);
    border-color: #fff;
}
#gestureCursor.clicked {
    background-color: #fff;
    box-shadow: 0 0 20px #fff;
    transform: translate(-50%, -50%) scale(1.5);
}
/* Visual Ripple Proof */
.click-ripple {
    position: fixed;
    border: 2px solid #fff;
    border-radius: 50%;
    pointer-events: none;
    z-index: 9998;
    animation: expand-fade 0.5s ease-out forwards;
}
@keyframes expand-fade {
    0% { width: 0; height: 0; opacity: 1; border-width: 4px; }
    100% { width: 100px; height: 100px; opacity: 0; border-width: 0px; }
}
/* Physical Element Reaction */
.gesture-active-press {
    transform: scale(0.95) !important;
    filter: brightness(1.2);
    transition: transform 0.1s;
}
/* Toggle Button for Gestures */
#gestureToggle {
    position: fixed;
    bottom: 20px;
    right: 20px;
    z-index: 10000;
    background: rgba(24, 24, 27, 0.8);
    backdrop-filter: blur(8px);
    border: 1px solid #27272a;
    border-radius: 999px;
    padding: 8px 16px;
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    font-size: 11px;
    font-weight: 600;
    color: #a1a1aa;
    transition: all 0.2s;
}
#gestureToggle:hover { color: white; border-color: #52525b; }
#gestureToggle.active {
    background: rgba(59, 130, 246, 0.1);
    border-color: rgba(59, 130, 246, 0.4);
    color: #60a5fa;
}
.status-dot-gesture {
    width: 6px; height: 6px; border-radius: 50%; background: #52525b;
}
#gestureToggle.active .status-dot-gesture {
    background: #10b981;
    box-shadow: 0 0 6px #10b981;
}
#gestureVideo { display: none; }
</style>

// ONLINE/OFFLINE STATUS
function updateStatus() {
const d = document.getElementById('statusDot');

if (!d || !t) return;
if (navigator.onLine) {
d.className = "w-1.5 h-1.5 rounded-full bg-green-500 shadow-[0_0_6px_rgba(34,197,94,0.6)]";

// CARD HOVER EFFECT
document.addEventListener('mousemove', (e) => {
document.querySelectorAll('.project-card').forEach(card => {
const rect = card.getBoundingClientRect();
card.style.setProperty('--x', `${e.clientX - rect.left}px`);
card.style.setProperty('--y', `${e.clientY - rect.top}px`);
});
});
let allSites = [];

// Helper to convert URL
function convertToLocalHostUrl(url) {
try {
const u = new URL(url);
if (window.location.protocol === 'file:') return u.pathname.startsWith('/') ? u.pathname.substring(1) : u.pathname;
return window.location.origin + u.pathname;
} catch {
return url;
}
}
// MAIN LOAD FUNCTION
window.loadProject = function(url, btnElement) {
playClickSound();
els.loader.classList.remove('hidden');
els.empty.classList.add('hidden');
document.querySelectorAll('.project-card').forEach(b => b.classList.remove('active'));
if (btnElement) btnElement.classList.add('active');
// Check if Split View is active (variables set by app.js)
const targetFrame = (window.splitViewEnabled && window.currentActivePane === 'right') ? els.frame2 : els.frame;
targetFrame.src = convertToLocalHostUrl(url);
targetFrame.addEventListener('load', () => els.loader.classList.add('hidden'), { once: true });
const site = allSites.find(s => convertToLocalHostUrl(s.url) === convertToLocalHostUrl(url) || s.url === url);
if (site) {
// Call the history function from app.js
if (typeof window.addToHistory === 'function') {
window.addToHistory(site.title, site.url);
}
const projectParam = encodeURIComponent(site.title || site.id || site.url);
const newUrl = `${window.location.pathname}?project=${projectParam}`;
window.history.pushState({}, '', newUrl);
}
}
// CREATE CARD
function createCard(site, isPinned) {
const screenshot = `https://api.microlink.io/?url=${encodeURIComponent(site.url)}&screenshot=true&meta=false&embed=screenshot.url&viewport.width=800&viewport.height=600`;
const btn = document.createElement('button');
btn.className = 'project-card w-full text-left p-1.5 rounded-lg mb-1 flex items-center gap-2 border border-transparent select-none group';

const shareableLink = `${window.location.origin}${window.location.pathname}?project=${projectParam}`;
btn.innerHTML = `
<div class="w-7 h-7 rounded bg-[#18181b] border border-[#27272a] overflow-hidden shrink-0 relative">
<img src="${screenshot}" class="screenshot-img w-full h-full object-cover" loading="lazy"
onload="this.classList.add('loaded')" onerror="this.style.display='none'">

<svg xmlns="http://www.w3.org/2000/svg" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-[#a1a1aa]">
<path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4A2 2 0 0 0 14 22l7-4A2 2 0 0 0 21 16z"></path>
</svg>
</div>
</div>
<div class="min-w-0 flex-1 hide-on-collapse">
<div class="title-text text-xs font-medium truncate leading-tight group-hover:text-white transition-colors">${site.title || 'Untitled'}</div>
<div class="text-[9px] text-[#a1a1aa] truncate mt-0.5 group-hover:text-gray-300">Project</div>
</div>
<div class="flex items-center gap-1 hide-on-collapse">
<button onclick="copyProjectLink(event, '${shareableLink}', this)"

btn.onclick = (e) => {
if (!e.target.closest('.copy-btn') && !e.target.closest('[onclick*="togglePin"]')) {
loadProject(site.url, btn);
}
};
return btn;
}
// RENDER PROJECTS
function renderProjects() {
els.list.innerHTML = '';
els.pinnedList.innerHTML = '';
const pinned = [];
const others = [];
allSites.forEach(site => {
const id = site.id || site.url;
if (pinnedIds.includes(id)) pinned.push(site);
else others.push(site);
});
if (pinned.length > 0) {
els.pinnedSection.classList.remove('hidden');
pinned.forEach(site => els.pinnedList.appendChild(createCard(site, true)));
} else {
els.pinnedSection.classList.add('hidden');
}
others.forEach(site => els.list.appendChild(createCard(site, false)));
lucide.createIcons();
}
function loadProjectFromURL() {
const urlParams = new URLSearchParams(window.location.search);
const projectParam = urlParams.get('project');
if (projectParam && allSites.length > 0) {
const decodedParam = decodeURIComponent(projectParam);
const project = allSites.find(site =>
site.title === decodedParam ||
site.id === decodedParam ||
site.url === decodedParam ||
(site.title || '').toLowerCase() === decodedParam.toLowerCase()
);
if (project) {
setTimeout(() => {
const projectCard = Array.from(document.querySelectorAll('.project-card'))
.find(card => card.textContent.includes(project.title));
loadProject(project.url, projectCard);
}, 300);
}
}
}

onValue(ref(db, 'sites'), (snapshot) => {
const data = snapshot.val();
if (!data) {
els.list.innerHTML = '<div class="p-3 text-center text-[10px] text-[#a1a1aa]">No projects found</div>';
return;
}
allSites = Object.entries(data)
.map(([key, value]) => ({ ...value, id: key || value.url }))
.sort((a,b) => (b.timestamp || 0) - (a.timestamp || 0));

});

/* === GESTURE LOGIC (UPDATED FOR IFRAME SUPPORT) === */
const gestureState = {
    isEnabled: false,
    camera: null,
    cursorX: window.innerWidth / 2,
    cursorY: window.innerHeight / 2,
    isPinching: false,
    pinchStartTime: 0
};

const gestureEls = {
    toggle: document.getElementById('gestureToggle'),
    cursor: document.getElementById('gestureCursor'),
    video: document.getElementById('gestureVideo')
};

gestureEls.toggle.addEventListener('click', toggleGestures);

async function toggleGestures() {
    if (gestureState.isEnabled) {
        // Disable
        if (gestureState.camera) gestureState.camera.stop();
        gestureState.isEnabled = false;
        gestureEls.cursor.classList.remove('active');
        gestureEls.toggle.classList.remove('active');
        gestureEls.toggle.querySelector('span').innerText = "Hand Control";
    } else {
        // Enable
        if (!window.Hands) { alert("Loading gesture library... check internet connection."); return; }
        
        const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
        hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.7, minTrackingConfidence: 0.5 });
        hands.onResults(onGestureResults);
        
        gestureState.camera = new Camera(gestureEls.video, {
            onFrame: async () => { await hands.send({image: gestureEls.video}); },
            width: 640, height: 480
        });
        
        await gestureState.camera.start();
        
        gestureState.isEnabled = true;
        gestureEls.cursor.classList.add('active');
        gestureEls.toggle.classList.add('active');
        gestureEls.toggle.querySelector('span').innerText = "Gestures On";
    }
}

function onGestureResults(results) {
    if (!results.multiHandLandmarks || results.multiHandLandmarks.length === 0) return;
    
    const landmarks = results.multiHandLandmarks[0];
    const indexTip = landmarks[8];
    const thumbTip = landmarks[4];
    
    // Smooth Move
    // Mirror X (1 - x) so moving hand right moves cursor right
    const targetX = (1 - indexTip.x) * window.innerWidth;
    const targetY = indexTip.y * window.innerHeight;
    
    // Linear Interpolation (Lerp) for smoothness
    gestureState.cursorX += (targetX - gestureState.cursorX) * 0.3;
    gestureState.cursorY += (targetY - gestureState.cursorY) * 0.3;
    
    gestureEls.cursor.style.left = `${gestureState.cursorX}px`;
    gestureEls.cursor.style.top = `${gestureState.cursorY}px`;
    
    // Pinch Detection
    // Distance between Index Tip and Thumb Tip
    const dist = Math.hypot(indexTip.x - thumbTip.x, indexTip.y - thumbTip.y);
    
    if (dist < 0.05) { // Threshold for pinch
        if (!gestureState.isPinching) {
            gestureState.isPinching = true;
            gestureState.pinchStartTime = Date.now();
            gestureEls.cursor.classList.add('pinching');
        } else {
            // Check if held long enough to register a click
            if (Date.now() - gestureState.pinchStartTime > 200) {
                triggerGestureClick();
                gestureState.isPinching = false; 
                gestureState.pinchStartTime = Date.now() + 1000; // 1s Cooldown to prevent double clicks
            }
        }
    } else {
        gestureState.isPinching = false;
        gestureEls.cursor.classList.remove('pinching');
        gestureEls.cursor.classList.remove('clicked');
    }
}

function triggerGestureClick() {
    // 1. Visual Feedback
    gestureEls.cursor.classList.add('clicked');
    setTimeout(() => gestureEls.cursor.classList.remove('clicked'), 200);
    
    // Spawn Ripple
    const ripple = document.createElement('div');
    ripple.className = 'click-ripple';
    ripple.style.left = `${gestureState.cursorX}px`;
    ripple.style.top = `${gestureState.cursorY}px`;
    ripple.style.transform = 'translate(-50%, -50%)';
    document.body.appendChild(ripple);
    setTimeout(() => ripple.remove(), 500);
    
    // 2. Identify Element Under Cursor
    const el = document.elementFromPoint(gestureState.cursorX, gestureState.cursorY);
    
    if (el) {
        // A. Handle IFRAMES
        if (el.tagName === 'IFRAME') {
            try {
                const rect = el.getBoundingClientRect();
                // Calculate position relative to the iframe
                const insideX = gestureState.cursorX - rect.left;
                const insideY = gestureState.cursorY - rect.top;
                
                // Access internal document
                const innerDoc = el.contentDocument || el.contentWindow.document;
                const innerEl = innerDoc.elementFromPoint(insideX, insideY);
                
                if (innerEl) {
                    console.log("Clicking inside iframe:", innerEl);
                    // Try to find the nearest clickable parent or click the element itself
                    const clickable = innerEl.closest('button, a, input, [onclick], .clickable') || innerEl;
                    clickable.click();
                    
                    // Force focus for inputs
                    if(clickable.tagName === 'INPUT' || clickable.tagName === 'TEXTAREA') {
                        clickable.focus();
                    }
                }
            } catch (err) {
                console.warn("Cross-Origin Iframe blocked gesture click.", err);
            }
        } 
        // B. Handle Normal Elements
        else {
            const clickable = el.closest('button, .project-card, a, input');
            if (clickable) {
                clickable.classList.add('gesture-active-press'); // Visual press effect
                clickable.click();
                setTimeout(() => clickable.classList.remove('gesture-active-press'), 150);
            }
        }
    }
}
