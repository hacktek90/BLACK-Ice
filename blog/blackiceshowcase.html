<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Black Ice — Deployments Showcase</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600;700;800;900&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
  :root {
    --bg: #060609;
    --fg: #eaeaf2;
    --muted: #6a6a80;
    --accent: #00e5ff;
    --accent-alt: #007aff;
    --accent-dim: rgba(0,229,255,0.12);
    --accent-glow: rgba(0,229,255,0.35);
    --warm: #ff3d6e;
    --card: rgba(255,255,255,0.035);
    --border: rgba(255,255,255,0.08);
    --glass: rgba(8,8,16,0.72);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--fg);
    font-family: 'Space Grotesk', sans-serif;
    overflow: hidden;
    height: 100vh;
    width: 100vw;
  }

  /* ── Slider Shell ── */
  .slider-shell {
    position: relative;
    width: 100%;
    height: 100vh;
    overflow: hidden;
  }

  /* ── Iframe Layers ── */
  .frame-layer {
    position: absolute;
    inset: -12px;
    will-change: clip-path, opacity;
    z-index: 0;
  }

  .frame-layer iframe {
    width: calc(100% + 24px);
    height: calc(100% + 24px);
    border: none;
    pointer-events: none;
    filter: brightness(0.38) saturate(0.55) contrast(1.15) blur(0.5px);
    transition: filter 0.9s ease;
  }

  .frame-layer.active iframe {
    filter: brightness(0.5) saturate(0.75) contrast(1.08) blur(0px);
  }

  .frame-layer.entering {
    clip-path: inset(0 100% 0 0);
    animation: wipeEnter 1.1s cubic-bezier(0.65, 0, 0.35, 1) forwards;
  }

  .frame-layer.leaving {
    clip-path: inset(0 0 0 0);
    animation: wipeLeave 1.1s cubic-bezier(0.65, 0, 0.35, 1) forwards;
  }

  @keyframes wipeEnter {
    0%   { clip-path: inset(0 100% 0 0); }
    100% { clip-path: inset(0 0% 0 0); }
  }

  @keyframes wipeLeave {
    0%   { clip-path: inset(0 0 0 0); }
    100% { clip-path: inset(0 0 0 100%); }
  }

  /* ── Frame Loader ── */
  .frame-loader {
    position: absolute;
    inset: 0;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: var(--bg);
    transition: opacity 0.7s ease, visibility 0.7s ease;
  }

  .frame-loader.loaded {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }

  .loader-spinner {
    width: 36px;
    height: 36px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .loader-label {
    font-size: 0.65rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
  }

  /* ── Overlays ── */
  .grad-left {
    position: absolute;
    inset: 0;
    background: linear-gradient(to right, rgba(6,6,9,0.94) 0%, rgba(6,6,9,0.65) 30%, transparent 60%);
    z-index: 5;
    pointer-events: none;
  }

  .grad-bottom {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 220px;
    background: linear-gradient(to top, rgba(6,6,9,0.98) 0%, transparent 100%);
    z-index: 5;
    pointer-events: none;
  }

  .grad-top {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 110px;
    background: linear-gradient(to bottom, rgba(6,6,9,0.85) 0%, transparent 100%);
    z-index: 5;
    pointer-events: none;
  }

  .scan-lines {
    position: absolute;
    inset: 0;
    z-index: 6;
    pointer-events: none;
    opacity: 0.5;
    background: repeating-linear-gradient(
      to bottom,
      transparent 0px,
      transparent 3px,
      rgba(0,0,0,0.025) 3px,
      rgba(0,0,0,0.025) 6px
    );
  }

  /* ── Mouse Glow ── */
  .mouse-glow {
    position: absolute;
    width: 520px;
    height: 520px;
    border-radius: 50%;
    background: radial-gradient(circle, var(--accent-dim) 0%, transparent 60%);
    z-index: 4;
    pointer-events: none;
    opacity: 0;
    transform: translate(-50%, -50%);
    transition: opacity 0.6s;
  }

  .slider-shell:hover .mouse-glow { opacity: 1; }

  /* ── Top Navbar ── */
  .top-nav {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    z-index: 20;
    padding: 20px 0;
  }

  .brand-mark {
    width: 38px;
    height: 38px;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--accent), var(--accent-alt));
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-family: 'Outfit', sans-serif;
    font-weight: 900;
    font-size: 0.8rem;
    color: var(--bg);
    box-shadow: 0 0 22px var(--accent-glow);
    flex-shrink: 0;
  }

  .brand-text {
    font-family: 'Outfit', sans-serif;
    font-weight: 700;
    font-size: 1.2rem;
    letter-spacing: -0.02em;
    margin-left: 10px;
    text-decoration: none;
    color: var(--fg);
  }

  .brand-text span { color: var(--accent); }

  .live-badge {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 5px 14px;
    border-radius: 100px;
    background: rgba(0,255,136,0.08);
    border: 1px solid rgba(0,255,136,0.18);
    font-size: 0.65rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #00ff88;
    font-weight: 600;
  }

  .live-pulse {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #00ff88;
    box-shadow: 0 0 8px rgba(0,255,136,0.6);
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.35; transform: scale(0.85); }
  }

  /* ── Corner Accents ── */
  .corner { position: absolute; z-index: 10; pointer-events: none; }
  .corner svg { width: 28px; height: 28px; }
  .corner svg line { stroke: var(--accent); stroke-width: 1.5; opacity: 0.25; }
  .corner-tl { top: 14px; left: 14px; }
  .corner-tr { top: 14px; right: 14px; }
  .corner-bl { bottom: 14px; left: 14px; }
  .corner-br { bottom: 14px; right: 14px; }

  /* ── Content Panel ── */
  .content-panel {
    position: absolute;
    left: 0;
    top: 50%;
    transform: translateY(-50%);
    z-index: 15;
    width: 100%;
    padding: 0;
  }

  .slide-info {
    position: absolute;
    opacity: 0;
    pointer-events: none;
    width: 100%;
  }

  .slide-info.active {
    opacity: 1;
    pointer-events: auto;
  }

  /* Platform badge */
  .platform-chip {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 6px 16px;
    border-radius: 8px;
    font-size: 0.62rem;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    margin-bottom: 22px;
    opacity: 0;
    transform: translateX(-24px);
  }

  .slide-info.active .platform-chip {
    animation: enterLeft 0.55s 0.15s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }

  .chip-vercel { background: rgba(255,255,255,0.07); color: #fff; border: 1px solid rgba(255,255,255,0.1); }
  .chip-cf { background: rgba(248,151,29,0.1); color: #f8971d; border: 1px solid rgba(248,151,29,0.22); }
  .chip-render { background: rgba(130,80,255,0.1); color: #b794f6; border: 1px solid rgba(130,80,255,0.22); }
  .chip-google { background: rgba(66,133,244,0.1); color: #7baaf7; border: 1px solid rgba(66,133,244,0.22); }

  @keyframes enterLeft {
    to { opacity: 1; transform: translateX(0); }
  }

  /* Heading */
  .slide-info h1 {
    font-family: 'Outfit', sans-serif;
    font-weight: 900;
    font-size: clamp(2.2rem, 4.8vw, 3.6rem);
    line-height: 1.06;
    letter-spacing: -0.035em;
    margin-bottom: 16px;
    opacity: 0;
    transform: translateX(-32px);
  }

  .slide-info.active h1 {
    animation: enterLeft 0.65s 0.25s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }

  .gradient-text {
    background: linear-gradient(90deg, var(--accent), var(--accent-alt));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  /* URL Bar */
  .url-bar {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 7px 16px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 0.76rem;
    color: var(--muted);
    margin-bottom: 20px;
    font-family: 'Space Grotesk', monospace;
    opacity: 0;
    transform: translateX(-28px);
  }

  .slide-info.active .url-bar {
    animation: enterLeft 0.5s 0.38s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }

  .url-bar i { color: var(--accent); font-size: 0.65rem; }

  /* Description */
  .slide-info .desc-text {
    font-size: 0.92rem;
    line-height: 1.75;
    color: var(--muted);
    margin-bottom: 32px;
    max-width: 440px;
    opacity: 0;
    transform: translateX(-22px);
  }

  .slide-info.active .desc-text {
    animation: enterLeft 0.55s 0.48s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }

  /* Action Buttons */
  .action-row {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    opacity: 0;
    transform: translateX(-22px);
  }

  .slide-info.active .action-row {
    animation: enterLeft 0.5s 0.58s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }

  .btn-visit {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 13px 30px;
    background: var(--accent);
    color: var(--bg);
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 0.82rem;
    letter-spacing: 0.04em;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.35s cubic-bezier(0.22, 1, 0.36, 1);
    box-shadow: 0 4px 28px var(--accent-glow);
    text-decoration: none;
  }

  .btn-visit:hover {
    transform: translateY(-3px) scale(1.03);
    box-shadow: 0 10px 44px var(--accent-glow);
    filter: brightness(1.1);
    color: var(--bg);
  }

  .btn-visit .dot-live {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--bg);
    animation: pulse 1.5s ease-in-out infinite;
  }

  .btn-ghost {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 13px 28px;
    background: var(--glass);
    backdrop-filter: blur(14px);
    color: var(--fg);
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 500;
    font-size: 0.82rem;
    border: 1px solid var(--border);
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.35s ease;
    text-decoration: none;
  }

  .btn-ghost:hover {
    border-color: var(--accent);
    background: var(--accent-dim);
    transform: translateY(-3px);
    color: var(--fg);
  }

  /* ── Right Stats Panel ── */
  .stats-panel {
    position: absolute;
    right: 0;
    top: 50%;
    transform: translateY(-50%);
    z-index: 15;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .metric-card {
    padding: 16px 20px;
    background: var(--glass);
    backdrop-filter: blur(18px);
    border: 1px solid var(--border);
    border-radius: 14px;
    min-width: 140px;
    opacity: 0;
    transform: translateX(24px);
    transition: border-color 0.3s;
  }

  .metric-card:hover { border-color: rgba(0,229,255,0.2); }

  .stats-panel.reveal .metric-card {
    animation: enterRight 0.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }

  .stats-panel.reveal .metric-card:nth-child(1) { animation-delay: 0.3s; }
  .stats-panel.reveal .metric-card:nth-child(2) { animation-delay: 0.42s; }
  .stats-panel.reveal .metric-card:nth-child(3) { animation-delay: 0.54s; }

  @keyframes enterRight {
    to { opacity: 1; transform: translateX(0); }
  }

  .metric-label {
    font-size: 0.58rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 5px;
  }

  .metric-val {
    font-family: 'Outfit', sans-serif;
    font-weight: 800;
    font-size: 1.45rem;
    letter-spacing: -0.02em;
    line-height: 1;
  }

  .metric-val .u {
    font-size: 0.65rem;
    font-weight: 400;
    color: var(--muted);
    margin-left: 3px;
  }

  /* ── Arrow Nav ── */
  .arrow-btn {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    z-index: 20;
    width: 50px;
    height: 50px;
    border-radius: 14px;
    border: 1px solid var(--border);
    background: var(--glass);
    backdrop-filter: blur(16px);
    color: var(--fg);
    font-size: 0.85rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.4s cubic-bezier(0.22, 1, 0.36, 1);
  }

  .arrow-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--accent-dim);
    transform: translateY(-50%) scale(1.08);
    box-shadow: 0 0 28px var(--accent-dim);
  }

  .arrow-btn.arrow-prev { left: calc(50% - 380px); }
  .arrow-btn.arrow-next { right: calc(50% - 380px); }

  /* ── Bottom Bar ── */
  .bottom-strip {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 20;
    padding: 0 0 24px;
  }

  /* ── Platform Tabs ── */
  .platform-tabs {
    display: inline-flex;
    gap: 3px;
    background: var(--glass);
    backdrop-filter: blur(18px);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
  }

  .ptab {
    padding: 10px 20px;
    border: none;
    border-radius: 9px;
    background: transparent;
    color: var(--muted);
    font-family: 'Space Grotesk', sans-serif;
    font-size: 0.72rem;
    font-weight: 500;
    letter-spacing: 0.05em;
    cursor: pointer;
    transition: all 0.35s cubic-bezier(0.22, 1, 0.36, 1);
    white-space: nowrap;
    display: inline-flex;
    align-items: center;
    gap: 7px;
  }

  .ptab:hover { color: var(--fg); background: var(--card); }

  .ptab.ptab-active {
    background: var(--accent);
    color: var(--bg);
    font-weight: 700;
    box-shadow: 0 2px 18px var(--accent-glow);
  }

  .ptab .ptab-dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: currentColor;
    opacity: 0.5;
  }

  /* ── Progress ── */
  .progress-wrap {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .progress-bar-track {
    width: 110px;
    height: 3px;
    background: var(--border);
    border-radius: 6px;
    overflow: hidden;
  }

  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent-alt));
    border-radius: 6px;
    width: 0%;
    box-shadow: 0 0 8px var(--accent-glow);
    transition: width 0.1s linear;
  }

  .progress-seconds {
    font-size: 0.62rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    min-width: 40px;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }

  /* ── Counter ── */
  .slide-counter {
    font-family: 'Outfit', sans-serif;
    display: flex;
    align-items: baseline;
    gap: 2px;
  }

  .counter-cur {
    font-size: 2rem;
    font-weight: 900;
    color: var(--fg);
    line-height: 1;
    min-width: 28px;
  }

  .counter-sep {
    font-size: 0.85rem;
    color: var(--accent);
    margin: 0 4px;
    font-weight: 300;
  }

  .counter-tot {
    font-size: 0.85rem;
    color: var(--muted);
    font-weight: 400;
  }

  /* ── Pause Flash ── */
  .pause-indicator {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.7);
    z-index: 30;
    width: 58px;
    height: 58px;
    border-radius: 16px;
    background: var(--glass);
    backdrop-filter: blur(18px);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: all 0.25s ease;
    color: var(--fg);
    font-size: 0.95rem;
  }

  .pause-indicator.visible {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }

  /* ── Responsive ── */
  @media (max-width: 1200px) {
    .stats-panel { display: none !important; }
    .arrow-btn.arrow-prev { left: calc(50% - 280px); }
    .arrow-btn.arrow-next { right: calc(50% - 280px); }
  }

  @media (max-width: 992px) {
    .arrow-btn { display: none !important; }
  }

  @media (max-width: 768px) {
    .top-nav { padding: 14px 0; }
    .live-badge { display: none !important; }
    .corner { display: none !important; }
    .slide-info h1 { font-size: 1.7rem !important; }
    .slide-info .desc-text { font-size: 0.82rem; max-width: 100%; }
    .btn-visit, .btn-ghost { padding: 11px 20px; font-size: 0.76rem; }
    .ptab { padding: 8px 12px; font-size: 0.65rem; }
    .platform-tabs { flex-wrap: wrap; }
    .bottom-strip { padding: 0 0 16px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>

<div class="slider-shell" id="slider" role="region" aria-label="Site Showcase" aria-roledescription="carousel">

  <!-- Mouse Glow -->
  <div class="mouse-glow" id="mouseGlow"></div>

  <!-- Iframe Backgrounds -->
  <div id="frameLayer"></div>

  <!-- Overlays -->
  <div class="grad-left"></div>
  <div class="grad-top"></div>
  <div class="grad-bottom"></div>
  <div class="scan-lines"></div>

  <!-- Corner Accents -->
  <div class="corner corner-tl"><svg><line x1="0" y1="0" x2="28" y2="0"/><line x1="0" y1="0" x2="0" y2="28"/></svg></div>
  <div class="corner corner-tr"><svg><line x1="0" y1="0" x2="28" y2="0"/><line x1="28" y1="0" x2="28" y2="28"/></svg></div>
  <div class="corner corner-bl"><svg><line x1="0" y1="28" x2="28" y2="28"/><line x1="0" y1="0" x2="0" y2="28"/></svg></div>
  <div class="corner corner-br"><svg><line x1="0" y1="28" x2="28" y2="28"/><line x1="28" y1="0" x2="28" y2="28"/></svg></div>

  <!-- Top Navbar -->
  <nav class="top-nav">
    <div class="container-fluid px-4 px-lg-5">
      <div class="d-flex justify-content-between align-items-center">
        <a class="d-flex align-items-center text-decoration-none" href="#">
          <div class="brand-mark">BI</div>
          <span class="brand-text">Black<span>Ice</span></span>
        </a>
        <div class="live-badge">
          <div class="live-pulse"></div>
          All Systems Live
        </div>
      </div>
    </div>
  </nav>

  <!-- Main Content Row -->
  <div class="content-panel">
    <div class="container-fluid px-4 px-lg-5">
      <div class="row">
        <!-- Left: Slide Info -->
        <div class="col-lg-6 col-xl-5" id="infoCol"></div>
        <!-- Right: Stats -->
        <div class="col-lg-3 offset-lg-3 col-xl-3 offset-xl-4 d-none d-lg-block">
          <div class="stats-panel" id="statsPanel"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Arrow Buttons -->
  <button class="arrow-btn arrow-prev" id="prevBtn" aria-label="Previous"><i class="fas fa-chevron-left"></i></button>
  <button class="arrow-btn arrow-next" id="nextBtn" aria-label="Next"><i class="fas fa-chevron-right"></i></button>

  <!-- Pause Indicator -->
  <div class="pause-indicator" id="pauseInd"><i class="fas fa-pause"></i></div>

  <!-- Bottom Strip -->
  <div class="bottom-strip">
    <div class="container-fluid px-4 px-lg-5">
      <div class="d-flex justify-content-between align-items-end flex-wrap gap-3">
        <div class="platform-tabs" id="tabBar" role="tablist" aria-label="Platforms"></div>
        <div class="d-flex align-items-center gap-4">
          <div class="progress-wrap">
            <div class="progress-bar-track">
              <div class="progress-bar-fill" id="pFill"></div>
            </div>
            <span class="progress-seconds" id="pSec">0s</span>
          </div>
          <div class="slide-counter">
            <span class="counter-cur" id="cCur">01</span>
            <span class="counter-sep">/</span>
            <span class="counter-tot" id="cTot">04</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  // ── Site Data ──
  const sites = [
    {
      url: 'https://blackice-ac.vercel.app',
      platform: 'Vercel',
      chip: 'chip-vercel',
      chipIcon: 'fa-solid fa-bolt',
      title: 'Vercel <span class="gradient-text">Accelerated</span>',
      desc: 'Edge-optimized deployment on Vercel\'s global CDN with sub-millisecond cold starts, zero-config SSR, and automatic ISR revalidation.',
      stats: [
        { label: 'TTFB', value: '48', unit: 'ms' },
        { label: 'Region', value: 'Global', unit: 'Edge' },
        { label: 'Build', value: '12', unit: 's' }
      ]
    },
    {
      url: 'https://black-ice.pages.dev',
      platform: 'Cloudflare',
      chip: 'chip-cf',
      chipIcon: 'fa-solid fa-cloud',
      title: 'Cloudflare <span class="gradient-text">Pages</span>',
      desc: 'Served across 300+ cities on Cloudflare\'s edge network with direct Workers integration, instant rollbacks, and preview deploys.',
      stats: [
        { label: 'TTFB', value: '32', unit: 'ms' },
        { label: 'Nodes', value: '300+', unit: 'PoPs' },
        { label: 'Build', value: '8', unit: 's' }
      ]
    },
    {
      url: 'https://black-ice-3dbk.onrender.com',
      platform: 'Render',
      chip: 'chip-render',
      chipIcon: 'fa-solid fa-server',
      title: 'Render <span class="gradient-text">Backend</span>',
      desc: 'Full-stack hosting with persistent disk, auto-scaling instances, native WebSocket support, and integrated PostgreSQL databases.',
      stats: [
        { label: 'TTFB', value: '120', unit: 'ms' },
        { label: 'Scale', value: 'Auto', unit: '' },
        { label: 'Uptime', value: '99.9', unit: '%' }
      ]
    },
    {
      url: 'https://black-ice.page.gd',
      platform: 'Google Pages',
      chip: 'chip-google',
      chipIcon: 'fa-brands fa-google',
      title: 'Google <span class="gradient-text">Pages</span>',
      desc: 'Static hosting on Google Cloud Platform with Firebase CDN, integrated Auth, Firestore connectivity, and one-click deploys.',
      stats: [
        { label: 'TTFB', value: '65', unit: 'ms' },
        { label: 'CDN', value: 'Firebase', unit: '' },
        { label: 'SSL', value: 'Auto', unit: '' }
      ]
    }
  ];

  // ── State ──
  let current = 0;
  let isAnimating = false;
  let isPaused = false;
  let autoTimer = null;
  let progStart = 0;
  let progRAF = null;
  const DURATION = 7000;

  // ── DOM ──
  const frameLayer = document.getElementById('frameLayer');
  const infoCol = document.getElementById('infoCol');
  const statsPanel = document.getElementById('statsPanel');
  const tabBar = document.getElementById('tabBar');
  const pFill = document.getElementById('pFill');
  const pSec = document.getElementById('pSec');
  const cCur = document.getElementById('cCur');
  const cTot = document.getElementById('cTot');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const pauseInd = document.getElementById('pauseInd');
  const mouseGlow = document.getElementById('mouseGlow');
  const slider = document.getElementById('slider');

  cTot.textContent = String(sites.length).padStart(2, '0');

  // ── Build Everything ──
  function build() {
    sites.forEach((s, i) => {
      // Iframe
      const fl = document.createElement('div');
      fl.className = 'frame-layer' + (i === 0 ? ' active' : '');
      fl.style.zIndex = i === 0 ? 1 : 0;

      const loader = document.createElement('div');
      loader.className = 'frame-loader';
      loader.innerHTML = '<div class="loader-spinner"></div><span class="loader-label">Loading ' + s.platform + '...</span>';

      const ifr = document.createElement('iframe');
      ifr.src = s.url;
      ifr.loading = i < 2 ? 'eager' : 'lazy';
      ifr.title = s.platform + ' deployment preview';
      ifr.setAttribute('sandbox', 'allow-same-origin allow-scripts');
      ifr.addEventListener('load', () => loader.classList.add('loaded'));
      // Fallback timeout
      setTimeout(() => loader.classList.add('loaded'), 9000);

      fl.appendChild(loader);
      fl.appendChild(ifr);
      frameLayer.appendChild(fl);

      // Content Info
      const info = document.createElement('div');
      info.className = 'slide-info' + (i === 0 ? ' active' : '');
      info.setAttribute('role', 'tabpanel');
      info.setAttribute('aria-label', s.platform + ' deployment');
      info.innerHTML = `
        <div class="platform-chip ${s.chip}">
          <i class="${s.chipIcon}" style="font-size:0.6rem"></i>
          ${s.platform}
        </div>
        <h1>${s.title}</h1>
        <div class="url-bar">
          <i class="fas fa-link"></i>
          ${s.url.replace('https://', '')}
        </div>
        <p class="desc-text">${s.desc}</p>
        <div class="action-row">
          <a href="${s.url}" target="_blank" rel="noopener noreferrer" class="btn-visit">
            <span class="dot-live"></span> Visit Site
          </a>
          <a href="${s.url}" target="_blank" rel="noopener noreferrer" class="btn-ghost">
            <i class="fas fa-external-link-alt" style="font-size:0.7rem"></i> Open in Tab
          </a>
        </div>
      `;
      infoCol.appendChild(info);

      // Tab
      const tab = document.createElement('button');
      tab.className = 'ptab' + (i === 0 ? ' ptab-active' : '');
      tab.setAttribute('role', 'tab');
      tab.setAttribute('aria-selected', i === 0 ? 'true' : 'false');
      tab.innerHTML = '<span class="ptab-dot"></span>' + s.platform;
      tab.addEventListener('click', () => goTo(i));
      tabBar.appendChild(tab);
    });

    buildStats(0);
  }

  function buildStats(idx) {
    const s = sites[idx];
    statsPanel.innerHTML = '';
    statsPanel.classList.remove('reveal');
    void statsPanel.offsetWidth;

    s.stats.forEach(st => {
      const c = document.createElement('div');
      c.className = 'metric-card';
      c.innerHTML = `
        <div class="metric-label">${st.label}</div>
        <div class="metric-val">${st.value}<span class="u">${st.unit}</span></div>
      `;
      statsPanel.appendChild(c);
    });

    requestAnimationFrame(() => statsPanel.classList.add('reveal'));
  }

  // ── Navigation ──
  function goTo(idx) {
    if (isAnimating || idx === current) return;
    isAnimating = true;

    const frames = frameLayer.querySelectorAll('.frame-layer');
    const infos = infoCol.querySelectorAll('.slide-info');
    const tabs = tabBar.querySelectorAll('.ptab');

    const prev = current;
    current = idx;

    // Animate frames
    frames[prev].classList.remove('active');
    frames[prev].classList.add('leaving');
    frames[prev].style.zIndex = 1;

    frames[current].classList.add('entering');
    frames[current].style.zIndex = 2;

    // Content
    infos[prev].classList.remove('active');
    infos[current].classList.add('active');

    // Tabs
    tabs[prev].classList.remove('ptab-active');
    tabs[prev].setAttribute('aria-selected', 'false');
    tabs[current].classList.add('ptab-active');
    tabs[current].setAttribute('aria-selected', 'true');

    // Counter
    cCur.textContent = String(current + 1).padStart(2, '0');

    // Stats
    buildStats(current);

    // Cleanup after animation
    setTimeout(() => {
      frames[prev].classList.remove('leaving');
      frames[prev].style.clipPath = '';
      frames[prev].style.zIndex = 0;

      frames[current].classList.remove('entering');
      frames[current].classList.add('active');
      frames[current].style.clipPath = '';
      frames[current].style.zIndex = 1;

      isAnimating = false;
    }, 1150);

    resetAuto();
  }

  function goNext() { goTo((current + 1) % sites.length); }
  function goPrev() { goTo((current - 1 + sites.length) % sites.length); }

  // ── Autoplay ──
  function resetAuto() {
    clearTimeout(autoTimer);
    cancelAnimationFrame(progRAF);
    pFill.style.width = '0%';

    if (!isPaused) {
      progStart = performance.now();
      tickProg();
      autoTimer = setTimeout(goNext, DURATION);
    }
  }

  function tickProg() {
    const elapsed = performance.now() - progStart;
    const pct = Math.min((elapsed / DURATION) * 100, 100);
    pFill.style.width = pct + '%';
    pSec.textContent = Math.max(0, Math.ceil((DURATION - elapsed) / 1000)) + 's';
    if (pct < 100) progRAF = requestAnimationFrame(tickProg);
  }

  function togglePause() {
    isPaused = !isPaused;
    pauseInd.classList.add('visible');
    pauseInd.innerHTML = isPaused ? '<i class="fas fa-play"></i>' : '<i class="fas fa-pause"></i>';
    setTimeout(() => pauseInd.classList.remove('visible'), 500);

    if (isPaused) {
      clearTimeout(autoTimer);
      cancelAnimationFrame(progRAF);
      pSec.textContent = 'Paused';
    } else {
      resetAuto();
    }
  }

  // ── Events ──
  prevBtn.addEventListener('click', goPrev);
  nextBtn.addEventListener('click', goNext);

  slider.addEventListener('click', (e) => {
    if (e.target.closest('.btn-visit, .btn-ghost, .ptab, .arrow-btn, .brand-text')) return;
    if (e.target.closest('.grad-left, .grad-top, .grad-bottom, .scan-lines, .slider-shell')) {
      togglePause();
    }
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight') { e.preventDefault(); goNext(); }
    if (e.key === 'ArrowLeft') { e.preventDefault(); goPrev(); }
    if (e.key === ' ') { e.preventDefault(); togglePause(); }
  });

  let tx = 0;
  slider.addEventListener('touchstart', e => { tx = e.touches[0].clientX; }, { passive: true });
  slider.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - tx;
    if (Math.abs(dx) > 50) dx < 0 ? goNext() : goPrev();
  }, { passive: true });

  slider.addEventListener('mousemove', (e) => {
    const r = slider.getBoundingClientRect();
    mouseGlow.style.left = (e.clientX - r.left) + 'px';
    mouseGlow.style.top = (e.clientY - r.top) + 'px';
  });

  // ── Init ──
  build();
  resetAuto();
</script>
  <script src="/test/portal.js"></script>

</body>
</html>
