<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Site Store – Discover Free Tools, Apps, and Developer Resources</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">

  <style>
    :root {
      /* Deep Space Theme */
      --bg: #050507;
      --glass-panel: rgba(255, 255, 255, 0.03);
      --glass-border: rgba(255, 255, 255, 0.08);
      --glass-highlight: rgba(255, 255, 255, 0.15);
      
      --text-main: #ededed;
      --text-muted: #888899;
      
      --accent: #3b82f6;
      --accent-glow: rgba(59, 130, 246, 0.4);
      --danger: #ef4444;
      
      --radius: 16px;
      --font-family: 'Inter', sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: var(--font-family);
      background-color: var(--bg);
      color: var(--text-main);
      /* Ambient spotlight effect */
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(59, 130, 246, 0.15), transparent 60%),
        radial-gradient(circle at 80% 20%, rgba(139, 92, 246, 0.1), transparent 50%);
      background-attachment: fixed;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 24px;
    }

    /* Floating Navbar */
    header {
      position: sticky;
      top: 16px;
      z-index: 50;
      margin-bottom: 40px;
    }
    
    .nav-island {
      background: rgba(10, 10, 12, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 99px; /* Pill shape */
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
      max-width: 1100px;
      margin: 0 auto;
    }

    h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.03em;
      background: linear-gradient(to right, #fff, #a1a1aa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Modern Glass Buttons */
    .btn {
      appearance: none;
      border: 1px solid var(--glass-border);
      background: var(--glass-panel);
      color: var(--text-main);
      padding: 10px 20px;
      border-radius: 99px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn:hover {
      background: var(--glass-highlight);
      transform: translateY(-1px);
      border-color: rgba(255,255,255,0.2);
    }
    
    .btn.primary {
      background: var(--text-main);
      color: #000;
      border: none;
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
    }
    .btn.primary:hover {
      background: #fff;
      box-shadow: 0 0 25px rgba(255, 255, 255, 0.4);
    }

    /* Search Area */
    .controls {
      display: flex;
      gap: 16px;
      margin-bottom: 32px;
      flex-wrap: wrap;
    }

    .search-wrap {
      flex: 1;
      position: relative;
    }

    .search-input {
      width: 100%;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--glass-border);
      padding: 16px 20px;
      border-radius: 16px;
      color: #fff;
      font-size: 15px;
      outline: none;
      transition: all 0.2s;
    }
    .search-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.15);
      background: rgba(0,0,0,0.5);
    }

    /* Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 24px;
      padding-bottom: 60px;
    }

    /* Glass Cards */
    .card {
      background: var(--glass-panel);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), 
                  box-shadow 0.3s ease, 
                  border-color 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    /* Hover State: Subtle Lift + Glow */
    .card:hover {
      transform: translateY(-4px) scale(1.01);
      border-color: rgba(255,255,255,0.15);
      box-shadow: 0 20px 40px -10px rgba(0,0,0,0.5);
      background: rgba(255,255,255,0.04);
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .icon-box {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      background: linear-gradient(135deg, #1a1a20, #000);
      border: 1px solid var(--glass-border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 700;
      color: #fff;
      overflow: hidden;
      flex-shrink: 0;
    }
    
    .icon-img {
      width: 100%; height: 100%; object-fit: cover;
    }

    .meta h3 {
      margin: 0;
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: #fff;
    }
    .meta p {
      margin: 4px 0 0;
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .actions {
      margin-top: auto;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .visit-btn {
      flex: 1;
      text-align: center;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid transparent;
      padding: 12px;
      border-radius: 12px;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      transition: background 0.2s;
    }
    .visit-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255,255,255,0.1);
    }

    /* Admin Chips */
    .chip {
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.2s;
    }
    .delete-chip {
      background: rgba(239, 68, 68, 0.1);
      color: var(--danger);
      border-color: rgba(239, 68, 68, 0.2);
    }
    .delete-chip:hover { background: rgba(239, 68, 68, 0.2); }

    .edit-chip {
      background: rgba(59, 130, 246, 0.1);
      color: var(--accent);
      border-color: rgba(59, 130, 246, 0.2);
    }
    .edit-chip:hover { background: rgba(59, 130, 246, 0.2); }

    /* Modal / Drawer */
    .drawer {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(8px);
      z-index: 100;
      display: none;
      justify-content: center;
      align-items: center;
      padding: 20px;
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    .drawer.open {
      display: flex;
      opacity: 1;
    }

    .drawer-content {
      background: #0f0f11;
      border: 1px solid var(--glass-border);
      width: 100%;
      max-width: 420px;
      border-radius: 24px;
      padding: 32px;
      box-shadow: 0 40px 80px rgba(0,0,0,0.8);
      transform: scale(0.95);
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .drawer.open .drawer-content { transform: scale(1); }

    .form-stack { display: flex; flex-direction: column; gap: 16px; margin-top: 20px; }
    label { font-size: 12px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; display: block; }
    
    .input-field {
      width: 100%;
      background: #18181b;
      border: 1px solid #27272a;
      padding: 12px;
      border-radius: 10px;
      color: white;
      font-family: inherit;
      outline: none;
    }
    .input-field:focus { border-color: var(--accent); }

    @media (max-width: 600px) {
      header { top: 0; margin-bottom: 24px; }
      .nav-island { border-radius: 0; border-top: none; border-left: none; border-right: none; }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <header>
    <div class="nav-island">
      <h1>Site Store</h1>
      <div style="display:flex; gap:8px;">
        <button id="open-submit" class="btn primary">
          <span>+</span> Submit
        </button>
        <a href="https://black-ice-3dbk.onrender.com/projects.html" class="btn">Back</a>
      </div>
    </div>
  </header>

  <div class="container">
    
    <div class="controls">
      <div class="search-wrap">
        <input id="q" type="search" class="search-input" placeholder="Search for inspiration..." autocomplete="off">
      </div>
    </div>

    <main id="grid" class="grid" aria-live="polite">
      <!-- Loading Skeleton -->
      <article class="card">
        <div class="card-header">
          <div class="icon-box"></div>
          <div class="meta">
            <h3 style="background:var(--glass-border); color:transparent; border-radius:4px; width:120px">Loading</h3>
            <p style="background:var(--glass-border); color:transparent; border-radius:4px; margin-top:6px; width:180px">Loading description content.</p>
          </div>
        </div>
      </article>
    </main>
  </div>

  <!-- Submit Modal -->
  <div id="drawer" class="drawer">
    <div class="drawer-content">
      <h2 style="margin:0 0 8px; font-size:20px;">Submit Site</h2>
      <p style="margin:0; color:var(--text-muted); font-size:14px;">Share your creation with the world.</p>
      
      <div class="form-stack">
        <div>
          <label>Project Name</label>
          <input id="f-title" class="input-field" placeholder="e.g. Portfolio v2">
        </div>
        <div>
          <label>Live URL</label>
          <input id="f-url" type="url" class="input-field" placeholder="https://...">
        </div>
        <div>
          <label>Icon URL</label>
          <input id="f-img" type="url" class="input-field" placeholder="https://... (square png/jpg)">
        </div>
        <div>
          <label>Description</label>
          <textarea id="f-desc" class="input-field" rows="3" placeholder="Briefly describe functionality..."></textarea>
        </div>
        
        <!-- Hosting Hint -->
        <div style="font-size:12px; color:var(--text-muted); background:rgba(255,255,255,0.03); padding:10px; border-radius:8px;">
          No URL? <a href="https://black-ice-3dbk.onrender.com/Htmlsub.html" target="_blank" style="color:var(--accent); text-decoration:none;">Request hosting here</a>
        </div>

        <div style="display:flex; gap:10px; margin-top:8px;">
          <button id="do-submit" class="btn primary" style="flex:1; justify-content:center;">Publish</button>
          <button id="close-drawer" class="btn" style="flex:1; justify-content:center;">Cancel</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Edit Title Modal (Admin Only) -->
  <div id="edit-drawer" class="drawer">
    <div class="drawer-content">
      <h2 style="margin:0 0 8px; font-size:20px;">Edit Project Name</h2>
      <p style="margin:0; color:var(--text-muted); font-size:14px;">Update the title for this site.</p>
      
      <div class="form-stack">
        <input id="edit-id" type="hidden">
        <div>
          <label>Project Name</label>
          <input id="edit-title-input" class="input-field" placeholder="Enter new project name">
        </div>

        <div style="display:flex; gap:10px; margin-top:8px;">
          <button id="do-edit" class="btn primary" style="flex:1; justify-content:center;">Save Change</button>
          <button id="close-edit-drawer" class="btn" style="flex:1; justify-content:center;">Cancel</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
    // Added 'update' to imports
    import { getDatabase, ref, push, onValue, remove, update } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';

    const firebaseConfig = {
      apiKey: "AIzaSyAp9kCBsDLnQEmR7wWHXwt3FB2T1zDtiqU",
      authDomain: "h-90-8a7c5.firebaseapp.com",
      databaseURL: "https://h-90-8a7c5-default-rtdb.firebaseio.com",
      projectId: "h-90-8a7c5",
      storageBucket: "h-90-8a7c5.firebasestorage.app",
      messagingSenderId: "367196609301",
      appId: "1:367196609301:web:156e24c1b4532c26af671c"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const $ = id => document.getElementById(id);

    // Drawer Logic (Submit)
    const drawer = $('drawer');
    $('open-submit').onclick = () => drawer.classList.add('open');
    $('close-drawer').onclick = () => drawer.classList.remove('open');
    drawer.onclick = (e) => { if(e.target === drawer) drawer.classList.remove('open'); }

    // Submit Logic
    $('do-submit').onclick = async () => {
      const title = $('f-title').value.trim();
      const url = $('f-url').value.trim();
      const image = $('f-img').value.trim();
      const description = $('f-desc').value.trim();

      if(!title || !url || !description) return alert('Please fill in required fields.');

      try {
        await push(ref(db, 'sites'), { title, url, image, description, timestamp: Date.now() });
        drawer.classList.remove('open');
        ['f-title','f-url','f-img','f-desc'].forEach(id => $(id).value = '');
      } catch(e) {
        alert(e.message);
      }
    };

    // Edit Drawer Logic
    const editDrawer = $('edit-drawer');
    const editInput = $('edit-title-input');
    const editIdField = $('edit-id');

    // Expose to window so inline HTML can call it
    window.openEditModal = (id) => {
      const site = sitesCache.find(s => s.id === id);
      if(site) {
        editIdField.value = site.id;
        editInput.value = site.title || '';
        editDrawer.classList.add('open');
        setTimeout(() => editInput.focus(), 100); // Focus after transition
      }
    };

    $('close-edit-drawer').onclick = () => editDrawer.classList.remove('open');
    editDrawer.onclick = (e) => { if(e.target === editDrawer) editDrawer.classList.remove('open'); }

    // Save Edit Logic
    $('do-edit').onclick = async () => {
      const newTitle = editInput.value.trim();
      const id = editIdField.value;

      if(!newTitle) return alert('Title cannot be empty.');
      if(!id) return;

      try {
        await update(ref(db, `sites/${id}`), { title: newTitle });
        editDrawer.classList.remove('open');
      } catch(e) {
        alert(e.message);
      }
    };

    // Render Logic
    let sitesCache = [];
    const grid = $('grid');
    const params = new URLSearchParams(location.search);
    const isAdmin = params.get('admin') === 'elite';

    onValue(ref(db, 'sites'), (snap) => {
      const data = snap.val();
      if(!data) {
        grid.innerHTML = `<div style="grid-column:1/-1; text-align:center; padding:40px; color:var(--text-muted)">No sites found.</div>`;
        return;
      }
      sitesCache = Object.entries(data).map(([k,v]) => ({id:k, ...v})).sort((a,b) => b.timestamp - a.timestamp);
      render(sitesCache);
    });

    const esc = t => { const d = document.createElement('div'); d.textContent = t; return d.innerHTML; };

    function render(list) {
      const q = $('q').value.toLowerCase();
      const filtered = q ? list.filter(s => (s.title||'').toLowerCase().includes(q)) : list;
      
      grid.innerHTML = filtered.map(s => {
        const title = esc(s.title);
        const desc = esc(s.description);
        const url = esc(s.url);
        const img = esc(s.image);
        const letter = title.charAt(0).toUpperCase();

        const iconHTML = img 
          ? `<img src="${img}" class="icon-img" onerror="this.style.display='none';this.parentNode.innerText='${letter}'">`
          : letter;

        // Admin Buttons
        let adminHTML = '';
        if(isAdmin) {
          adminHTML = `
            <div style="margin-left:auto; display:flex; gap:8px; align-items:center;">
               <button class="chip edit-chip" onclick="openEditModal('${s.id}')">Edit Name</button>
               <button class="chip delete-chip" onclick="delSite('${s.id}')">Delete</button>
            </div>
          `;
        }

        return `
          <article class="card">
            <div class="card-header">
              <div class="icon-box">${iconHTML}</div>
              <div class="meta">
                <h3>${title}</h3>
                <p>${desc}</p>
              </div>
              ${adminHTML}
            </div>
            <div class="actions">
              <a href="${url}" target="_blank" class="visit-btn">Visit Site &rarr;</a>
            </div>
          </article>
        `;
      }).join('');
    }

    $('q').oninput = () => render(sitesCache);
    
    window.delSite = async (id) => {
      if(confirm('Delete this site permanently?')) await remove(ref(db, `sites/${id}`));
    }
  </script>
</body>
</html>
