nd motion blur, and use an aggressive camera angle.\",\"videoUrl\":\"https://filecdn.minimax.chat/public/17cde1c6-6079-4a55-b691-6e5a73efa14b.mp4\"},{\"prompt\":\"Let's create a cinematic, highly detailed scene. I need a close-up video of a stylish young woman standing in a rainy cyberpunk city street at night. Show neon signs reflecting in her eyes and on her wet skin as she slowly turns her head to look at the camera with a mysterious expression. Use a bokeh background.\",\"videoUrl\":\"https://filecdn.minimax.chat/public/05f2d525-2186-4818-a83a-939a92cda419.mp4\"},{\"prompt\":\"Can you generate a photorealistic, National Geographic style video of the Swiss Alps? Start with a wide shot showing snow-capped mountains mirrored in a crystal clear lake in the foreground, and then include a time-lapse element of clouds moving rapidly across the sky with sharp focus.\",\"videoUrl\":\"https://filecdn.minimax.chat/public/f44c6f76-502f-4fac-a77f-ca98dfcc6fd6.mp4\"},{\"prompt\":\"I'm looking for a gritty, high-energy video clip. Capture a dynamic tracking shot following a parkour athlete freerunning across concrete rooftops at sunset. Show them performing a massive precision jump over a gap, landing into a roll, and immediately vaulting over a wall. Add handheld camera shakiness for realism and show dust kicking up.\",\"videoUrl\":\"https://filecdn.minimax.chat/public/cf8de351-7bcd-4a3a-b488-42600161309e.mp4\"},{\"prompt\":\"Please create a wide-angle underwater video. Show a scuba diver gliding effortlessly over a vibrant, healthy coral reef teeming with tropical fish like clownfish. I want bright sunlight beams (God rays) piercing the clear shallow water and creating dancing light patterns on the sandy bottom, ending with the diver pointing at a sea turtle.\",\"videoUrl\":\"https://filecdn.minimax.chat/public/4b43406e-d5e4-43a0-b19b-6655bd7d9a05.mp4\"}],\"icon\":\"\u003csvg xmlns=\\\"http://www.w3.org/2000/svg\\\" width=\\\"20\\\" height=\\\"20\\\" viewBox=\\\"0 0 20 20\\\ ic_assets/ca17921f-41cb-4598-a4d1-d8df130fc5b5.png\",\"https://cdn.hailuoai.video/open-hailuo-video-web/public_assets/d0648e23-4046-4dc7-aa43-4671e8d78d9a.png\"],\"prompt\":\"I am a middle school physics teacher preparing to teach the law of conservation of momentum. Could you create a series of clear and accurate demonstration animations and organize them into a PowerPoint presentation?\"},{\"pptImages\":[\"https://cdn.hailuoai.video/open-hailuo-video-web/public_assets/740f5cff-cf64-4ae4-9483-dc700c482fb2.png\",\"https://cdn.hailuoai.video/open-hailuo-video-web/public_assets/5182ea6c-2b8c-4799-833b-1cc3a99d9c5f.png\",\"https://cdn.hailuoai.video/open-hailuo-video-web/public_assets/f8e76a3f-ca62-4dac-984c-a924cb08f6e2.png\"],\"prompt\":\"Convert this paper into presentation slides suitable for an academic conference. The presentation should be approximately 15 minutes long and must include all key points. https://arxiv.org/abs/2501.08313\"},{\"pptImages\":[\"https://cdn.hailuoai.video/open-hailuo-video-web/public_assets/4fc3d29d-6a28-4220-98ed-bd56d1c6e548.png\",\"https://cdn.hailuoai.video/open-hailuo-video-web/public_assets/b70ab630-3b69-4792-a82f-e1626008e0d6.png\",\"https://cdn.hailuoai.video/open-hailuo-video-web/public_assets/1d217f79-3b29-46a1-acfa-4293d1ea07af.png\"],\"prompt\":\"Create a FIRE model for someone earning $500k/year who wants to retire at 30 with $5M. Model extreme savings rates (80%+), tax optimization, investment strategies for efficient compounding, and lifestyle costs in Vancouver, Canada. Include scenarios for different withdrawal rates and show what sacrifices are required vs. traditional retirement planning. Then, create a downloadable presentation.\"},{\"pptImages\":[\"https://cdn.hailuoai.video/open-hailuo-video-web/public_assets/9731f9ec-dc95-4c29-8fc1-926fbaf858fc.png\",\"https://cdn.hailuoai.video/open-hailuo-video-web/public_assets/09de7970-40d0-48d0-bf4b-3d98e5286b00.png\",\"https://cdn.hailuoai.video/open-hailuo-video-web/public_ \":[{\"prompt\":\"Web design for an award-winning architecture firm. Rigorous Swiss International Style grid. Use of thick, solid borders to define sections. Large-scale monochromatic photography of concrete structures. Bold, heavy sans-serif type (Helvetica/Akzidenz-Grotesk) used as a structural element. Color palette: Raw concrete gray, white, and a single industrial orange accent. Minimalist, structured, and authoritative.\",\"src\":\"https://cdn.hailuoai.video/open-hailuo-video-web/public_assets/55d16985-598d-47f5-b05b-bc0be4613118.jpg\"},{\"prompt\":\"Web design of a creative personal portfolio for a photographer. Full-screen immersive hero section with a video background capability. Bold, oversized typography overlay. Asymmetrical layout grid. Interactive hover effects visible in design. The style is brutalist yet sophisticated. Monochromatic black and white color scheme with one bold accent color (red). Artstation aesthetics, ultra-modern.\",\"src\":\"https://cdn.hailuoai.video/open-hailuo-video-web/public_assets/26156fc7-6824-4fa5-a742-c803e194f23d.jpg\"},{\"prompt\":\"Web design for a techno music festival. Acid Graphics and Glitch aesthetic. Distorted imagery, kinetic typography that reacts to scroll speed. High-frequency visual elements and 'industrial' UI components like toggles and sliders. Color palette: Deep black, 'Toxic Green,' and 'Signal Red.' Aggressive, high-energy, and experimental.\",\"src\":\"https://cdn.hailuoai.video/open-hailuo-video-web/public_assets/b9e2b254-3572-407e-8b3f-506a9c5e6abf.jpg\"},{\"prompt\":\"Web design for an artisanal coffee roastery. Tactile and Craft aesthetic. Hero section uses a split-screen with macro shots of coffee beans and steaming cups. Use of 'paper texture' backgrounds and hand-drawn botanical illustrations. Typography is a mix of a vintage slab-serif and a modern clean Sans-serif. Color palette: 'Roasted Umber,' 'Creamy Latte,' and 'Forest Green.' Interactive flavor profile wheels for each product. Organic, warm, and sensory.\",\"src\":\"https://cdn.hailuoai.video/open-hailuo-video-web/public_assets/0f0ba761-25bb-4799-a540-657fe7beca86.jpg\"},{\"prompt\":\"Build a single-page React/Next.js application for a Christmas Scavenger Hunt. The page should feature a cozy living room background (SVG or styled CSS). Hide 5 interactive Christmas icons (Star, Stocking, Bell, Candy Cane, Present) across different sections of the page. When a user clicks an icon, play a chime sound and update a 'Found' counter. Once all 5 are found, trigger a full-screen confetti effect using canvas-confetti and reveal a hidden discount code: 'MERRY2025' inside a festive modal.\",\"src\":\"https://cdn.hailuoai.video/open-hailuo-video-web/public_assets/588cc13d-8c5e-4888-9ace-46d18473043d.jpg\"},{\"prompt\":\"Web design for a high-end sustainable seafood restaurant on a cliffside. 'Coastal Calm \u0026 Raw Materiality' aesthetic.  Hero Section: An immersive, wide-angle cinematic shot of gentle ocean waves crashing against rocks below the restaurant patio at dusk. The sound of the ocean is subtly integrated.  Layout \u0026 Structure: Fluid, horizontal-scrolling sections that mimic the horizon line. Image containers have softly eroded, wave-like edges instead of sharp corners.  UI Components: Navigation bar features a 'frosted sea glass' effect. Cursor interaction leaves a subtle trail like ripples in water. Menu cards have a tactile 'sand-blasted' texture.  Typography: An elegant, breezy high-contrast Serif for titles, resembling typography found on old nautical maps.  Color Palette: A muted, soothing marine scheme: Driftwood Grey, Pale Seafoam Teal, Sandy Beige, and Deep Ocean Navy for text.  Vibe: Serene, breezy, elegant, and natural.\",\"src\":\"https://cdn.hailuoai.video/open-hailuo-video-web/public_assets/dfa4a844-e6f7-40d4-83b7-78da9b245ebb.jpg\"}],\"description\":\"See how M2.1 understands your creative intent and generates elegant, ready-to-use code\",\"enable\":true,\"title\":\"Code that follow \":\"var(--yellow_400)\",\"name\":\"Schedules\",\"type\":\"schedule\"},{\"data\":[{\"imgUrl\":\"https://cdn.hailuoai.video/open-hailuo-video-web/public_assets/81d70929-71cb-40a4-af35-3007a3c9ab3f.png\",\"prompt\":\"Develop a premium e-commerce platform dedicated to selling custom crystal bracelets, featuring a Zen-inspired, minimalist UI/UX with a clean layout and calm colors to highlight high-quality product photography. The platform must include essential user features like authentication (Login/Signup), a product catalog, and a shopping cart, alongside admin capabilities for managing products and orders. Please pre-populate the site with 10 sample products using generated professional images and integrate Stripe to support real payment transactions.\"},{\"imgUrl\":\"https://cdn.hailuoai.video/open-hailuo-video-web/public_assets/7fd305c2-6a75-46c7-9b56-15c426475975.png\",\"prompt\":\"Help me create a personal profile page that can display a preview of my art portfolio and provide links to my social media platforms. Make the website more impressive and think outside the box.\"},{\"imgUrl\":\"https://cdn.hailuoai.video/open-hailuo-video-web/public_assets/7986df53-478f-4dd9-8528-3a990a2f2872.png\",\"prompt\":\"Create a web dashboard that visualizes a 360° analysis of Tesla (TSLA). The content must cover financial health, technical/market sentiment, competitor comparisons, and strategic valuation (SWOT/Intrinsic Value) to provide clear investment recommendations.\"},{\"imgUrl\":\"https://cdn.hailuoai.video/open-hailuo-video-web/public_assets/842cfd5d-834d-478b-8e3c-5541f2ac6c0a.png\",\"prompt\":\"Design the official website for an AI company, incorporating Earth-themed elements. Use black, white, and gray as the main colors to create a cool, sophisticated, and technological feel. I specifically need a stunning Earth animation that will 'wow' the users.\"},{\"imgUrl\":\"https://cdn.hailuoai.video/open-hailuo-video-web/public_assets/22938629-f425-4ee6-afda-6348c3170fd4.png\",\"prompt\":\"Create a virtual the Louvre tour where I can view major artworks, accompanied by audio explanations. The number of artworks is about 10. I would like the UI to match the atmosphere of a museum, being classical and exquisite.\"},{\"imgUrl\":\"https://cdn.hailuoai.video/open-hailuo-video-web/public_assets/3d238155-5f9a-461a-9901-f3fffef68cf9.png\",\"prompt\":\"Develop a casual, cartoon-style Gold Miner game from scratch featuring a swinging claw mechanic where players time their releases to grab items of varying weights and values, balancing risk and reward. Essential features include an inter-level shop for upgrades (winch speed, bombs, luck), a narrative-driven Story Mode with boss battles, and a local Co-op/Versus mode, all supported by dynamic audio and polished animations.\"}],\"icon\":\"$32\",\"iconColor\":\"var(--green_400)\",\"name\":\"Websites\",\"type\":\"website\"},{\"data\":[{\"prompt\":\"I currently have $100,000 and aim for a 10% annual return. Based on current macroeconomic data and future expectations, design a relatively robust asset allocation strategy aimed at locking in long-term yields.\"},{\"prompt\":\"Provide a comprehensive overview of the current open-source inference ecosystem. What are the mainstream preferred solutions in the industry for different application scenarios, and why?\"},{\"prompt\":\"Research Temu's path of expansion in overseas markets, summarize the key factors behind its success, and analyze whether these factors can be replicated for software growth.\"},{\"prompt\":\"Write a literature review on 'Analyzing the Relationship between Construction Economics and Real Estate Economics from the Perspective of Sustainable Development,' including links to all authentic references.\"},{\"prompt\":\"I plan to develop an AI 3D modeling tool tailored for beginners. Analyze the target user personas and their core pain points in key scenarios, derive corresponding potential feature requirements, and draft an MVP requirements document along with an initial operational growth path.\"}],\"icon\":\"$33\",\"iconColor\":\"#8B5CF6\",\"name\":\"Research\",\"type\":\"research\"},{\"data\":[{\"prompt\":\"I'd love a heartwarming video of a fluffy Golden Retriever puppy running towards the camera in a sunlit park. Use slow motion to capture its floppy ears bouncing and a happy expression. The lighting should be golden hour style, soft and dreamy, highlighting the golden fur.\",\"videoUrl\":\"https://filecdn.minimax.chat/public/c9c47c3c-d740-44b4-a5bf-72fed47c5839.mp4\"},{\"prompt\":\"I want an action movie style clip with high energy. Can you create a fast-paced tracking shot of a red sports car drifting around a race track corner? Make sure there's smoke from the tires, a lot of background motion blur, and use an aggressive camera angle.\",\"videoUrl\":\"https://filecdn.minimax.chat/public/17cde1c6-6079-4a55-b691-6e5a73efa14b.mp4\"},{\"prompt\":\"Let's create a cinematic, highly detailed scene. I need a close-up video of a stylish young woman standing in a rainy cyberpunk city street at night. Show neon signs reflecting in her eyes and on her wet skin as she slowly turns her head to look at the camera with a mysterious expression. Use a bokeh background.\",\"videoUrl\":\"https://filecdn.minimax.chat/public/05f2d525-2186-4818-a83a-939a92cda419.mp4\"},{\"prompt\":\"Can you generate a photorealistic, National Geographic style video of the Swiss Alps? Start with a wide shot showing snow-capped mountains mirrored in a crystal clear lake in the foreground, and then include a time-lapse element of clouds moving rapidly across the sky with sharp focus.\",\"videoUrl\":\"https://filecdn.minimax.chat/public/f44c6f76-502f-4fac-a77f-ca98dfcc6fd6.mp4\"},{\"prompt\":\"I'm looking for a gritty, high-energy video clip. Capture a dynamic tracking shot following a parkour athlete freerunning across concrete rooftops at sunset. Show them performing a massive precision jump over a gap, landing into a roll, and immediately vaulting over a wall. Add handheld camera shakiness for realism and show dust kicking up.\",\"videoUrl\":\"https://filecdn.minimax.chat/public/cf8de351-7bcd-4a3a-b488-42600161309e.mp4\"},{\"prompt\":\"Please create a wide-angle underwater video. Show a scuba diver gliding effortlessly over a vibrant, healthy coral reef teeming with tropical fish like clownfish. I want bright sunlight beams (God rays) piercing the clear shallow water and creating dancing light patterns on the sandy bottom, ending with the diver pointing at a sea turtle.\",\"videoUrl\":\"https://filecdn.minimax.chat/public/4b43406e-d5e4-43a0-b19b-6655bd7d9a05.mp4\"}],\"icon\":\"$34\",\"iconColor\":\"var(--red_400)\",\"name\":\"Videos\",\"type\":\"video\"},{\"data\":[{\"pptImages\":[\"https://cdn.hailuoai.video/open-hailuo-video-web/public_assets/07eb5216-42d0-48af-bdd6-bd7e1c54d32a.png\",\"https://cdn.hailuoai.video/open-hailuo-video-web/public_assets/016f921f-dab5-4548-a5a0-492a4e14d36d.png\",\"https://cdn.hailuoai.video/open-hailuo-video-web/public_assets/0fd3038c-82d7-4b54-821f-d5604d4a9206.png\"],\"prompt\":\"Create a PowerPoint presentation titled 'The Louvre Museum: A Journey Through History and Art', focusing on its historical evolution and key artistic masterpieces.\"},{\"pptImages\":[\"https://cdn.hailuoai.video/open-hailuo-video-web/public_assets/1d26ad87-cf1f-4ab9-bd70-ce72521e2e02.png\",\"https://cdn.hailuoai.video/open-hailuo-video-web/public_assets/ca17921f-41cb-4598-a4d1-d8df130fc5b5.png\",\"https://cdn.hailuoai.video/open-hailuo-video-web/public_assets/d0648e23-4046-4dc7-aa43-4671e8d78d9a.png\"],\"prompt\":\"I am a middle school physics teacher preparing to teach the law of conservation of momentum. Could you create a series of clear and accurate demonstration animations and organize them into a PowerPoint presentation?\"},{\"pptImages\":[\"https://cdn.hailuoai.video/open-hailuo-video-web/public_assets/740f5cff-cf64-4ae4-9483-dc700c482fb2.png\",\"https://cdn.hailuoai.video/open-hailuo-video-web/public_assets/5182ea6c-2b8c-4799-833b-1cc3a99d9c5f.png\",\"https://cdn.hailuoai.video/open-hailuo-video-web/public_assets/f8e76a3f-ca62-4dac-984c-a924cb08f6e2.png\"],\"prompt\":\"Convert this paper into presentation slides suitable for an academic conference. The presentation should be approximately 15 minutes long and must include all key points. https://arxiv.org/abs/2501.08313\"},{\"pptImages\":[\"https://cdn.hailuoai.video/open-hailuo-video-web/public_assets/4fc3d29d-6a28-4220-98ed-bd56d1c6e548.png\",\"https://cdn.hailuoai.video/open-hailuo-video-web/public_assets/b70ab630-3b69-4792-a82f-e1626008e0d6.png\",\"https://cdn.hailuoai.video/open-hailuo-video-web/public_assets/1d217f79-3b29-46a1-acfa-4293d1ea07af.png\"],\"prompt\":\"Create a FIRE model for someone earning $500k/year who wants to retire at 30 with $5M. Model extreme savings rates (80%+), tax optimization, investment strategies for efficient compounding, and lifestyle costs in Vancouver, Canada. Include scenarios for different withdrawal rates and show what sacrifices are required vs. traditional retirement planning. Then, create a downloadable presentation.\"},{\"pptImages\":[\"https://cdn.hailuoai.video/open-hailuo-video-web/public_assets/9731f9ec-dc95-4c29-8fc1-926fbaf858fc.png\",\"https://cdn.hailuoai.video/open-hailuo-video-web/public_assets/09de7970-40d0-48d0-bf4b-3d98e5286b00.png\",\"https://cdn.hailuoai.video/open-hailuo-video-web/public_assets/73a26f88-985a-4d3e-bcf3-30c1ff9b0c7d.png\"],\"prompt\":\"Can you help me put together a slide deck for a literary analysis of West with the Night? I want to really dig into Beryl Markham's life in Kenya and her flying adventures, covering themes like the solitude of flight and her writing style.\"},{\"pptImages\":[\"https://cdn.hailuoai.video/open-hailuo-video-web/public_assets/7c696eaa-c845-42e0-b196-56590c66703b.png\",\"https://cdn.hailuoai.video/open-hailuo-video-web/public_assets/904bfadb-e563-480f-bedd-dfe71531f6d3.png\",\"https://cdn.hailuoai.video/open-hailuo-video-web/public_assets/360eaccd-edb0-493f-948c-dfc8734e15f5.png\"],\"prompt\":\"You are an interior designer tasked with creating a PPT report on interior design for a new foreign financial firm. Please generate a batch of images suitable for the interior design of such a company.\"}],\"icon\":\"$35\",\"name\":\"AI PPT\",\"type\":\"ppt\"},{\"data\":[{\"imgUrl\":\"https://cdn.hailuoai.video/open-hailuo-video-web/public_assets/bc4b19e6-7e95-4d4d-8ba8-417219fd3241.png\",\"prompt\":\"An impressionist oil painting of a bustling Parisian street cafe in the rain. Loose, visible brushstrokes, blurry figures with umbrellas, gas lamps glowing warmly, and vibrant city lights reflecting on wet cobblestones. Soft, atmospheric perspective, focusing on light, movement, and mood rather than sharp edges. In the style of Claude Monet or Renoir. Rich textured canvas visible.\"},{\"imgUrl\":\"https://cdn.hailuoai.video/open-hailuo-video-web/public_assets/e09eb638-016c-443a-a52d-fec000bd7244.png\",\"prompt\":\"Generate an image of a high-fashion African-American female model, 25–30, wearing off-white satin blazer + wide-leg tailored trousers; hands-in-pockets stance, confident upright posture, full-body shot. Minimalist cream studio, tall arched window, strong directional sunlight, sharp geometric shadows, smooth walls. Clean editorial style, luxury campaign lighting, crisp satin highlights, high contrast. Premium studio photography: 35mm lens, f/2.8, ISO 100, 1/200s, soft natural shadows, ultra-sharp details.\"},{\"imgUrl\":\"https://cdn.hailuoai.video/open-hailuo-video-web/public_assets/4752037a-a3bd-4c65-8d69-b30c0c8f992e.png\",\"prompt\":\"An image of a cyberpunk neon street at night, rainy reflections on the ground, glowing billboards in pink and blue, dense atmosphere, people walking with transparent umbrellas, futuristic architecture, high-contrast lighting, dramatic depth, ultra-detailed digital art.\"},{\"imgUrl\":\"https://cdn.hailuoai.video/open-hailuo-video-web/public_assets/cf8da069-22ea-4572-89b5-62ce1cbd87fd.png\",\"prompt\":\"Painting of a young woman in pointillisme style, gazing into a mirror, but her reflection appears as a detailed humanoid robot. Medieval-style living room filled with ornate carved wood, embroidered tapestries, brass candleholders, and rich velvet drapery. Warm candlelit ambience, deep shadows, golden highlights on both the girl and the metallic reflection. Classical European composition, textured brushstrokes, layered glazes, dramatic chiaroscuro, subtle surrealism.\"},{\"imgUrl\":\"https://cdn.hailuoai.video/open-hailuo-video-web/public_assets/2d9463a9-afe5-4e3c-8220-b69bda89d196.png\",\"prompt\":\"A candid wildlife photograph of an arctic fox hunting in deep snow, mid-pounce, ears forward. Snowflakes caught in its thick white fur, intense focus in its eyes. Vast tundra landscape at golden hour, soft warm low-angle light, visible frozen breath. Shallow depth of field, incredible texture details on fur and snow. Shot on Nikon Z9, 600mm telephoto lens, natural documentary style, raw and gritty feel.\"},{\"imgUrl\":\"https://cdn.hailuoai.video/open-hailuo-video-web/public_assets/c3919f9c-6b47-4283-975b-e5cdb24af78b.png\",\"prompt\":\"A gritty black and white film noir photograph from the 1940s. A solitary detective figure in a trench coat and fedora stands under a single flickering streetlamp in a rain-slicked cobblestone alleyway. Deep shadows, stark contrast (chiaroscuro lighting), smoke curling dramatically from a cigarette. Heavy film grain, dramatic atmosphere, cinematic movie still aesthetic.\"}],\"icon\":\"$36\",\"name\":\"Image Generation\",\"type\":\"image\"},{\"data\":[{\"prompt\":\"Create a GRE vocabulary web app so I can memorize words on my phone daily. In addition to providing the vocabulary, please incorporate features that reflect how the GRE actually tests vocabulary knowledge, and integrate them into the app's design.\"},{\"prompt\":\"Create a 20-page storybook about a fox that teaches the concept of civic responsibility and community stewardship in a forest setting. The fox should demonstrate why taking care of their environment and helping neighbors makes the whole community stronger. The tone should be inspiring rather than preachy. Generate 20 accompanying illustrations in a warm style and present the final book as a webpage.\"},{\"prompt\":\"Please create a campus recruitment interview question bank website for Software Engineering majors, focusing primarily on Computer Operating Systems knowledge. Provide both the questions and detailed answers.\"},{\"prompt\":\"I am giving a 45-minute open class to students on Impressionism next week. Please help me list a PPT outline, approximately 20 pages long. Also, provide a verbatim speech script of about 200 words for each page that I can read directly.\"},{\"prompt\":\"I need to conduct training for new sales hires at my company on the topic of 'How to Conduct Effective Cold Calling.' Help me design a complete training lesson plan and PPT deck. You need to intersperse 3 specific role-play simulation exercises, clearly explaining the rules and grouping strategy for each session.\"}],\"icon\":\"$37\",\"name\":\"Education\",\"type\":\"education\"}],\"zh\":[{\"data\":[{\"prompt\":\"每天 10:00 为我提供过去 24 小时内科技和科学领域的重点新闻摘要。每条新闻提炼一个核心要点，并附带网络检索来源，确保清晰易读。\"},{\"prompt\":\"每天早上 9:00 连接我的 Gmail，帮我总结昨晚至今的未读工作邮件，并为标记为'紧急'的邮件起草回复草稿。\"},{\"prompt\":\"每周一下午 15:00 检索并分析 TikTok 上过去一周的热门视频趋势，总结流行话题和内容风向。\"},{\"prompt\":\"工作日的下午 14:50，整理 $TSLA 和 $NVDA 的最新情况，包括当前价格、走势解读和市场情绪判断，并输出对投资机会的分析。\"},{\"prompt\":\"每月 25 号下午 17:00 连接我 Notion 上的销售数据表，分析本月数据变化，生成一份业务增长分析报告。\"}],\"icon\":\"$38\",\"iconColor\":\"var(--yellow_400)\",\"name\":\"定时任务\",\"type\":\"schedule\"},{\"data\":[{\"imgUrl\":\"https://cdn.hailuoai.video/open-hailuo-video-web/public_assets/81d70929-71cb-40a4-af35-3007a3c9ab3f.png\",\"prompt\":\"请开发一个专门销售定制水晶手链的高端电商平台，采用禅意风格和极简主义美学的 UI/UX 设计，通过整洁的布局和冷静的色调来突显高质量的产品摄影。该平台需包含用户认证(登录/注册)、产品目录和购物车等核心功能，同时具备管理产品和订单的后台功能。请预先填充 10 个带有生成专业图片的示例产品，并集成 Stripe 以支持真实的支付交易。\"},{\"imgUrl\":\"https://cdn.hailuoai.video/open-hailuo-video-web/public_assets/7fd305c2-6a75-46c7-9b56-15c426475975.png\",\"prompt\":\"帮我创建一个个人主页，用于展示我的艺术作品集预览，并提供我的社交媒体平台链接。请让网站看起来更令人印象深刻，在设计上要打破常规、别出心裁。\"},{\"imgUrl\":\"https://cdn.hailuoai.video/open-hailuo-video-web/public_assets/7986df53-478f-4dd9-8528-3a990a2f2872.png\",\"prompt\":\"创建一个网页仪表盘，对特斯拉 (TSLA) 进行 360 度全方位的可视化分析。内容必须涵盖财务健康状况、技术面/市场情绪、竞争对手比较以及战略估值(SWOT/内在价值)，以提供明确的投资建议。\"},{\"imgUrl\":\"https://cdn.hailuoai.video/open-hailuo-video-web/public_assets/842cfd5d-834d-478b-8e3c-5541f2ac6c0a.png\",\"prompt\":\"为一家人工智能公司设计官方网站，融入地球主题元素。使用黑、白、灰作为主色调，营造出酷炫、精致且充满科技感的氛围。我特别需要一个能让用户感到震撼的精美地球动画。\"},{\"imgUrl\":\"https://cdn.hailuoai.video/open-hailuo-video-web/public_assets/22938629-f425-4ee6-afda-6348c3170fd4.png\",\"prompt\":\"创建一个卢浮宫虚拟导览，让我可以欣赏主要艺术品并配有语音讲解。艺术品数量约为 10 件。我希望UI能契合博物馆的氛围，呈现出古典且精致的风格。\"},{\"imgUrl\":\"https://cdn.hailuoai.video/open-hailuo-video-web/public_assets/3d238155-5f9a-461a-9901-f3fffef68cf9.png\",\"prompt\":\"请从头开发一款休闲卡通风格的'黄金矿工'游戏，核心机制是摆动的钩爪,玩家需要通过精准的时机预判来抓取不同重量和价值的物品，以此平衡风险与回报。核心功能包括用于购买升级(卷扬机速度、炸药、幸运值)的关卡间商店、带有 Boss 战的剧情模式，以及本地合作/对战模式，并辅以动态音效和精致的动画效果。\"}],\"icon\":\"$39\",\"iconColor\":\"var(--green_400)\",\"name\":\"制作网页\",\"type\":\"website\"},{\"data\":[{\"prompt\":\"我目前有 10 万美元的闲置现金，希望每年能有 10% 的收益。基于当前的宏观经济数据和未来的预期，为我设计一个旨在锁定长期收益率的相对稳健的配置方案。\"},{\"prompt\":\"全面梳理一下目前的开源推理生态。 对于不同的应用场景，目前业界的主流首选方案分别是什么？为什么？\"},{\"prompt\":\"研究Temu在海外市场的快速扩张路径，总结其成功的关键要素，并分析这些要素是否可以复制到软件增长方面。\"},{\"prompt\":\"写基于\\\"基于可持续发展视角分析建筑经济与房地产经济关系\\\"的文献综述，需要包含所有真实文献的链接。\"},{\"prompt\":\"我计划开发一款针对初学者的AI 3D建模工具。分析目标用户画像和用户在主要场景下的核心痛点，并推导出对应的潜在功能需求，写出mvp需求文档和初期运营增长路径。\"}],\"icon\":\"$3a\",\"iconColor\":\"#8B5CF6\",\"name\":\"调研报告\",\"type\":\"research\"},{\"data\":[{\"prompt\":\"我想要一个暖心的视频，画面是一只毛茸茸的金毛幼犬在阳光明媚的公园里向镜头跑来。请使用慢动作来捕捉它耷拉着的耳朵上下跳动和快乐的表情。光线应该是'黄金时刻'的风格，柔和而梦幻，突显出金色的毛发。\",\"videoUrl\":\"https://filecdn.minimax.chat/public/c9c47c3c-d740-44b4-a5bf-72fed47c5839.mp4\"},{\"prompt\":\"我想要一个高能量的动作电影风格片段。你能创作一个快节奏的跟拍视频吗？内容是一辆红色跑车在赛道上漂移过弯。要确保有轮胎冒出的烟雾，大量的背景动态模糊，并且使用富有冲击力的摄影机角度。\",\"videoUrl\":\"https://filecdn.minimax.chat/public/17cde1c6-6079-4a55-b691-6e5a73efa14b.mp4\"},{\"prompt\":\"我们来创作一个电影感十足、细节丰富的场景。我需要一个特写视频，主角是一位站在雨夜赛博朋克城市街道上的时尚年轻女性。展示霓虹灯在她眼中和湿润皮肤上的反射，她带着神秘的表情慢慢转头看向镜头。背景请使用焦外成像效果(散景)。\",\"videoUrl\":\"https://filecdn.minimax.chat/public/05f2d525-2186-4818-a83a-939a92cda419.mp4\"},{\"prompt\":\"你能生成一个照片般逼真、《国家地理》风格的瑞士阿尔卑斯山视频吗？从一个广角镜头开始，展示前景中清澈湖面里的雪山倒影，然后加入延时摄影元素，表现云朵在天空中快速移动，焦点要清晰。\",\"videoUrl\":\"https://filecdn.minimax.chat/public/f44c6f76-502f-4fac-a77f-ca98dfcc6fd6.mp4\"},{\"prompt\":\"我正在寻找一个质感粗犷、高能量的视频片段。请捕捉一个动态跟拍镜头，在日落时分跟随一名跑酷运动员穿梭在混凝土屋顶上。展示他们做一个巨大的精确跳跃跨过缺口，落地翻滚，然后立即翻过一堵墙。加入手持摄影机的晃动感以增加真实度，并展示踢起的灰尘。\",\"videoUrl\":\"https://filecdn.minimax.chat/public/cf8de351-7bcd-4a3a-b488-42600161309e.mp4\"},{\"prompt\":\"请创作一个广角的水下视频。展示一名水肺潜水员轻松地滑过一个充满热带鱼(如小丑鱼)、生机勃勃的健康珊瑚礁。我想要明亮的阳光束(丁达尔效应)穿透清澈的浅水，在沙质底部营造出舞动的光影图案，最后以潜水员指向一只海龟结束。\",\"videoUrl\":\"https://filecdn.minimax.chat/public/4b43406e-d5e4-43a0-b19b-6655bd7d9a05.mp4\"}],\"icon\":\"$3b\",\"iconColor\":\"var(--red_400)\",\"name\":\"视频生成\",\"type\":\"video\"},{\"data\":[{\"pptImages\":[\"https://cdn.hailuoai.video/open-hailuo-video-web/public_assets/07eb5216-42d0-48af-bdd6-bd7e1c54d32a.png\",\"https://cdn.hailuoai.video/open-hailuo-video-web/public_assets/016f921f-dab5-4548-a5a0-492a4e14d36d.png\",\"https://cdn.hailuoai.video/open-hailuo-video-web/public_assets/0fd3038c-82d7-4b54-821f-d5604d4a9206.png\"],\"prompt\":\"请创建一个标题为'卢浮宫：历史与艺术之旅'的 PowerPoint 演示文稿，重点介绍其历史演变和关键的艺术杰作。\"},{\"pptImages\":[\"https://cdn.hailuoai.video/open-hailuo-video-web/public_assets/1d26ad87-cf1f-4ab9-bd70-ce72521e2e02.png\",\"https://cdn.hailuoai.video/open-hailuo-video-web/public_assets/ca17921f-41cb-4598-a4d1-d8df130fc5b5.png\",\"https://cdn.hailuoai.video/open-hailuo-video-web/public_assets/d0648e23-4046-4dc7-aa43-4671e8d78d9a.png\"],\"prompt\":\"我是一名中学物理老师，正准备讲授动量守恒定律。你能否制作一系列 219fd3241.png\",\"prompt\":\"一幅印象派油画，描绘了雨中繁忙的巴黎街头咖啡馆。松散、可见的笔触，模糊的打伞人物，温暖发光的煤气灯，以及反射在湿润鹅卵石上的充满活力的城市灯光。柔和、大气的视角，侧重于光线、运动和情绪,而不是锋利的边缘。克劳德·莫奈或雷诺阿的风格。可见丰富的画布纹理。\"},{\"imgUrl\":\"https://cdn.hailuoai.video/open-hailuo-video-web/public_assets/e09eb638-016c-443a-a52d-fec000bd7244.png\",\"prompt\":\"生成一张照片。一位高级时尚的非裔美国女性模特，25-30岁，身穿米白色缎面西装外套搭配阔腿定制西裤；双手插兜站立，姿态自信挺拔，全身照。极简主义的奶油色摄影棚，高大的拱形窗户，强烈的定向阳光射入，产生清晰的几何阴影，光滑的墙壁。干净的杂志大片风格，奢华广告照明，清晰的缎面高光，高对比度。优质摄影棚摄影：35mm镜头，f/2.8光圈，ISO 100，1/200秒快门，柔和的自然阴影，超锐利细节。\"},{\"imgUrl\":\"https://cdn.hailuoai.video/open-hailuo-video-web/public_assets/4752037a-a3bd-4c65-8d69-b30c0c8f992e.png\",\"prompt\":\"一张夜晚赛博朋克霓虹灯街道的图像，地面有雨水反射，粉色和蓝色的发光广告牌，浓郁的氛围，人们打着透明雨伞行走，未来主义建筑，高对比度照明，极具戏剧性的景深感，超精细数字艺术。\"},{\"imgUrl\":\"https://cdn.hailuoai.video/open-hailuo-video-web/public_assets/cf8da069-22ea-4572-89b5-62ce1cbd87fd.png\",\"prompt\":\"一幅点彩派风格的画作，描绘了一位年轻女子凝视镜子，但她的倒影却是一个细节丰富的人形机器人。中世纪风格的客厅，充满了华丽的木雕、刺绣挂毯、黄铜烛台和华丽的天鹅绒帷幔。温暖的烛光氛围，深沉的阴影，女孩和金属倒影上都有金色的高光。古典欧洲构图，有质感的笔触，层次丰富的釉面感(油画技法)，戏剧性的明暗对照法，微妙的超现实主义。\"},{\"imgUrl\":\"https://cdn.hailuoai.video/open-hailuo-video-web/public_assets/2d9463a9-afe5-4e3c-8220-b69bda89d196.png\",\"prompt\":\"一张抓拍的野生动物照片：一只北极狐在深雪中捕猎，正处于扑跳动作中，耳朵向前倾。雪花挂在它厚厚的白毛上，眼神高度专注。广阔的苔原景观正值黄金时刻(日落时分)，柔和温暖的低角度光线，呼出的冷气清晰可见。浅景深，毛发和雪地的纹理细节令人难以置信。使用尼康 Z9 拍摄，600mm 长焦镜头，自然纪实风格，原始而粗犷的感觉。\"},{\"imgUrl\":\"https://cdn.hailuoai.video/open-hailuo-video-web/public_assets/c3919f9c-6b47-4283-975b-e5cdb24af78b.png\",\"prompt\":\"一张粗颗粒的1940年代黑白黑色电影风格照片。一个穿着风衣、戴着软呢帽的孤独侦探身影，站在一条雨水湿滑的鹅卵石小巷里，唯一的闪烁路灯下。深沉的阴影，强烈的对比(明暗对照法照明)，烟雾从香烟上戏剧性地缭绕升起。重度胶片颗粒，充满戏剧性的氛围，电影剧照美学。\"}],\"icon\":\"$3d\",\"name\":\"图片生成\",\"type\":\"image\"},{\"data\":[{\"prompt\":\"创建一个 GRE 词汇网页应用，方便我每天在手机上背单词。除了提供词汇外，请结合 GRE 实际考察词汇知识的方式加入相应功能，并将它们整合到应用设计中。\"},{\"prompt\":\"创作一本关于狐狸的 20 页故事书，在森林背景下教授公民责任和社区守护的理念。这只狐狸应该通过行动展示为什么爱护环境和帮助邻居能让整个社区变得更强大。故事的基调应该是鼓舞人心的，而不是说教式的。请生成 20 幅温馨风格的配套插图，并将最终的书籍以网页形式呈现。\"},{\"prompt\":\"请你产出一个软件工程专业的校招面试题库网站，主要围绕计算机操作系统知识展开，给出题目和详细答案。\"},{\"prompt\":\"下周我要给学生讲一堂关于印象派的公开课，时长 45 分钟。你帮我把 PPT
