<html lang="en" class=""><head><script>window.livecodes = window.livecodes || {};</script><title>Untitled Project</title><meta name="title" content="Untitled Project"><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="stylesheet" href="./style.css"><script src="https://cdn.jsdelivr.net/npm/es-module-shims@1.10.0/dist/es-module-shims.js" async=""></script><script type="importmap">{

<meta charset="UTF-8">
<title>TTS Dev Endpoint</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Allow iframe embedding -->
<meta http-equiv="Content-Security-Policy" content="frame-ancestors *;">

<script src="https://js.puter.com/v2/"></script>

<style>
body {
  margin: 0;
  background: transparent;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  font-family: system-ui, sans-serif;
}

.loading {
  text-align: center;
}

audio {
  width: 100%;
  max-width: 480px;
}
</style>



<div id="loading" class="loading">
  <p>Generating audio…</p>
</div>

<audio id="audio" controls=""></audio>

<script>
(async function () {
  const params = new URLSearchParams(location.search);

  // REQUIRED
  const text = params.get("text");
  if (!text) {
    document.body.innerHTML = "❌ Missing ?text=";
    return;
  }

  // OPTIONAL
  const voice = params.get("voice") || "Joanna";
  const lang = params.get("lang") || "en-US";
  const autoplay = params.get("autoplay") === "1";

  try {
    // Generate speech (NEURAL forced)
    const audioEl = await puter.ai.txt2speech(text, {
      voice,
      engine: "neural",
      language: lang
    });

    if (!audioEl?.src) {
      throw new Error("No audio source returned");
    }

    // IMPORTANT: Use REAL URL (NO BLOBS)
    const audio = document.getElementById("audio");
    audio.src = audioEl.src;

    document.getElementById("loading").remove();

    if (autoplay) {
      audio.play().catch(() => {});
    }

  } catch (err) {
    document.body.innerHTML = "❌ TTS failed: " + err.message;
  }
})();
</script>



<script src="./script.js"></script></body></html>
