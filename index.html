    <script>
    (function() {
    if (window.BlackICEWidget) return;
    
    /**
     * Taskbar Class - Manages the bottom taskbar for multi-tasking
     */
    class Taskbar {
        constructor(widget) {
            this.widget = widget;
            this.element = this.createDOM();
            this.activeWindowId = null;
            this.taskItems = new Map();
            this.init();
        }
        
        createDOM() {
            const bar = document.createElement('div');
            bar.id = 'bi-taskbar';
            bar.innerHTML = `
                <div class="bi-taskbar-items" id="bi-taskbar-items"></div>
                <div class="bi-taskbar-time" id="bi-taskbar-time"></div>
            `;
            document.body.appendChild(bar);
            return bar;
        }
        
        init() {
            this.updateTime();
            setInterval(() => this.updateTime(), 1000);
        }
        
        updateTime() {
            const timeEl = document.getElementById('bi-taskbar-time');
            if (timeEl) {
                const now = new Date();
                timeEl.textContent = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
            }
        }
        
        addWindow(windowId, title) {
            const itemsContainer = document.getElementById('bi-taskbar-items');
            const item = document.createElement('div');
            item.className = 'bi-taskbar-item';
            item.dataset.windowId = windowId;
            item.title = title;
            
            // Truncate title for display
            const displayTitle = title.length > 12 ? title.substring(0, 10) + '...' : title;
            
            item.innerHTML = `
                <span class="bi-taskbar-icon">📄</span>
                <span class="bi-taskbar-title">${displayTitle}</span>
            `;
            
            item.onclick = () => this.toggleWindow(windowId);
            
            itemsContainer.appendChild(item);
            this.taskItems.set(windowId, item);
            this.activateWindow(windowId);
        }
        
        removeWindow(windowId) {
            const item = this.taskItems.get(windowId);
            if (item) {
                item.remove();
                this.taskItems.delete(windowId);
            }
            
            // If this was the active window, activate another
            if (this.activeWindowId === windowId) {
                const remainingIds = Array.from(this.taskItems.keys());
                if (remainingIds.length > 0) {
                    this.activateWindow(remainingIds[remainingIds.length - 1]);
                } else {
                    this.activeWindowId = null;
                }
            }
        }
        
        activateWindow(windowId) {
            // Deactivate all items
            this.taskItems.forEach((item, id) => {
                item.classList.toggle('active', id === windowId);
            });
            this.activeWindowId = windowId;
            
            // Bring the corresponding window to front
            const win = this.widget.windows.get(windowId);
            if (win) {
                win.bringToFront();
            }
        }
        
        toggleWindow(windowId) {
            const win = this.widget.windows.get(windowId);
            if (win) {
                if (win.minimized) {
                    win.restoreFromMinimized();
                } else if (this.activeWindowId === windowId) {
                    win.minimize();
                } else {
                    this.activateWindow(windowId);
                }
            }
        }
        
        updateTitle(windowId, newTitle) {
            const item = this.taskItems.get(windowId);
            if (item) {
                const displayTitle = newTitle.length > 12 ? newTitle.substring(0, 10) + '...' : newTitle;
                item.querySelector('.bi-taskbar-title').textContent = displayTitle;
                item.title = newTitle;
            }
        }
    }
    
    /**
     * WindowManager - Handles window operations and management
     */
    class WindowManager {
        constructor(widget) {
            this.widget = widget;
            this.windows = new Map();
            this.windowCounter = 0;
        }
        
        generateWindowId() {
            return `bi-win-${++this.windowCounter}`;
        }
        
        addWindow(win) {
            const id = this.generateWindowId();
            this.windows.set(id, win);
            win.id = id;
            return id;
        }
        
        removeWindow(id) {
            this.windows.delete(id);
        }
        
        getWindow(id) {
            return this.windows.get(id);
        }
        
        getAllWindows() {
            return Array.from(this.windows.values());
        }
        
        getMinimizedWindows() {
            return this.getAllWindows().filter(win => win.minimized);
        }
        
        getActiveWindow() {
            const windows = this.getAllWindows();
            if (windows.length === 0) return null;
            
            // Find window with highest z-index
            let maxZ = -1;
            let activeWin = null;
            windows.forEach(win => {
                const z = parseInt(win.element.style.zIndex) || 0;
                if (z > maxZ && !win.minimized) {
                    maxZ = z;
                    activeWin = win;
                }
            });
            return activeWin;
        }
        
        minimizeAllExcept(exceptId) {
            this.getAllWindows().forEach(win => {
                if (win.id !== exceptId && !win.minimized) {
                    win.minimize();
                }
            });
        }
        
        closeAll() {
            const ids = Array.from(this.windows.keys());
            ids.forEach(id => {
                const win = this.windows.get(id);
                if (win) win.close();
            });
        }
    }
    
    /**
     * FloatingWindow Class - Enhanced multi-tasking window
     */
    class FloatingWindow {
        constructor(url, title, zIndexBase, widget) {
            this.url = url;
            this.title = title;
            this.widget = widget;
            this.id = null;
            this.minimized = false;
            this.maximized = false;
            this.prevStyles = { top: '', left: '', width: '', height: '' };
            this.maximizedStyles = { top: '', left: '', width: '', height: '' };
            
            // Window management
            window.BlackICEWidget.windowManager.addWindow(this);
            window.BlackICEWidget.incrementZIndex();
            this.zIndex = window.BlackICEWidget.getCurrentZIndex();
            
            this.element = this.createDOM();
            this.setupDrag();
            this.setupResize();
            this.setupControls();
            this.attachEvents();
            
            // Add to taskbar
            window.BlackICEWidget.taskbar.addWindow(this.id, this.title);
        }
        
        createDOM() {
            const win = document.createElement('div');
            win.className = 'bi-window';
            win.id = `bi-window-${this.id}`;
            win.style.zIndex = this.zIndex;
            win.style.width = '600px';
            win.style.height = '450px';
            
            // Initial Position - cascade effect
            const offset = window.BlackICEWidget.windowManager.getAllWindows().length * 30;
            const screenWidth = window.innerWidth;
            const screenHeight = window.innerHeight;
            const startX = Math.min(offset + 100, screenWidth - 650);
            const startY = Math.min(offset + 80, screenHeight - 500);
            
            win.style.top = `${startY}px`;
            win.style.left = `${startX}px`;
            
            win.innerHTML = `
                <!-- Overlay to capture mouse events during drag/resize -->
                <div class="bi-window-overlay"></div>
                
                <div class="bi-window-header">
                    <div class="bi-window-title">${this.title}</div>
                    <div class="bi-window-controls">
                        <button class="bi-win-btn bi-win-minimize" title="Minimize">_</button>
                        <button class="bi-win-btn bi-win-maximize" title="Maximize">□</button>
                        <button class="bi-win-btn bi-win-close" title="Close">×</button>
                    </div>
                </div>
                <div class="bi-window-body">
                    <iframe src="${this.url}" frameborder="0" allowfullscreen></iframe>
                </div>
                <!-- Resize Handle -->
                <div class="bi-resize-handle"></div>
                <!-- Window decorations -->
                <div class="bi-window-decoration bi-decoration-tl"></div>
                <div class="bi-window-decoration bi-decoration-tr"></div>
                <div class="bi-window-decoration bi-decoration-bl"></div>
                <div class="bi-window-decoration bi-decoration-br"></div>
            `;
            
            document.body.appendChild(win);
            return win;
        }
        
        setupDrag() {
            const header = this.element.querySelector('.bi-window-header');
            let isDragging = false;
            let startX, startY, initLeft, initTop;
            
            const onDown = (e) => {
                // Don't drag if clicking buttons
                if (e.target.closest('.bi-window-controls')) return;
                if (this.maximized) return;
                
                this.bringToFront();
                
                isDragging = true;
                this.element.querySelector('.bi-window-overlay').style.pointerEvents = 'auto';
                
                const evt = e.touches ? e.touches[0] : e;
                startX = evt.clientX;
                startY = evt.clientY;
                initLeft = this.element.offsetLeft;
                initTop = this.element.offsetTop;
                
                document.addEventListener('mousemove', onMove);
                document.addEventListener('touchmove', onMove, { passive: false });
                document.addEventListener('mouseup', onUp);
                document.addEventListener('touchend', onUp);
            };
            
            const onMove = (e) => {
                if (!isDragging) return;
                e.preventDefault();
                const evt = e.touches ? e.touches[0] : e;
                const dx = evt.clientX - startX;
                const dy = evt.clientY - startY;
                
                this.element.style.left = `${initLeft + dx}px`;
                this.element.style.top = `${initTop + dy}px`;
                this.element.style.right = 'auto';
                this.element.style.bottom = 'auto';
            };
            
            const onUp = () => {
                isDragging = false;
                this.element.querySelector('.bi-window-overlay').style.pointerEvents = 'none';
                document.removeEventListener('mousemove', onMove);
                document.removeEventListener('touchmove', onMove);
                document.removeEventListener('mouseup', onUp);
                document.removeEventListener('touchend', onUp);
            };
            
            header.addEventListener('mousedown', onDown);
            header.addEventListener('touchstart', onDown, { passive: false });
        }
        
        setupResize() {
            const handle = this.element.querySelector('.bi-resize-handle');
            let isResizing = false;
            let startX, startY, startW, startH;
            
            const onDown = (e) => {
                e.stopPropagation();
                e.preventDefault();
                
                if (this.maximized) return;
                
                isResizing = true;
                this.bringToFront();
                this.element.querySelector('.bi-window-overlay').style.pointerEvents = 'auto';
                
                const evt = e.touches ? e.touches[0] : e;
                startX = evt.clientX;
                startY = evt.clientY;
                startW = parseInt(document.defaultView.getComputedStyle(this.element).width, 10);
                startH = parseInt(document.defaultView.getComputedStyle(this.element).height, 10);
                
                document.addEventListener('mousemove', onMove);
                document.addEventListener('touchmove', onMove, { passive: false });
                document.addEventListener('mouseup', onUp);
                document.addEventListener('touchend', onUp);
            };
            
            const onMove = (e) => {
                if (!isResizing) return;
                e.preventDefault();
                const evt = e.touches ? e.touches[0] : e;
                const width = Math.max(300, startW + (evt.clientX - startX));
                const height = Math.max(200, startH + (evt.clientY - startY));
                
                this.element.style.width = `${width}px`;
                this.element.style.height = `${height}px`;
            };
            
            const onUp = () => {
                isResizing = false;
                this.element.querySelector('.bi-window-overlay').style.pointerEvents = 'none';
                document.removeEventListener('mousemove', onMove);
                document.removeEventListener('touchmove', onMove);
                document.removeEventListener('mouseup', onUp);
                document.removeEventListener('touchend', onUp);
            };
            
            handle.addEventListener('mousedown', onDown);
            handle.addEventListener('touchstart', onDown, { passive: false });
        }
        
        setupControls() {
            const minimizeBtn = this.element.querySelector('.bi-win-minimize');
            const maximizeBtn = this.element.querySelector('.bi-win-maximize');
            const closeBtn = this.element.querySelector('.bi-win-close');
            
            minimizeBtn.onclick = (e) => {
                e.stopPropagation();
                this.minimize();
            };
            
            maximizeBtn.onclick = (e) => {
                e.stopPropagation();
                this.toggleMaximize();
            };
            
            closeBtn.onclick = (e) => {
                e.stopPropagation();
                this.close();
            };
        }
        
        bringToFront() {
            window.BlackICEWidget.incrementZIndex();
            this.zIndex = window.BlackICEWidget.getCurrentZIndex();
            this.element.style.zIndex = this.zIndex;
            
            // Update taskbar
            window.BlackICEWidget.taskbar.activateWindow(this.id);
        }
        
        minimize() {
            if (this.minimized) return;
            
            this.minimized = true;
            
            // Save current state
            this.prevStyles = {
                top: this.element.style.top,
                left: this.element.style.left,
                width: this.element.style.width,
                height: this.element.style.height
            };
            
            // Apply minimized style
            this.element.classList.add('minimized');
            this.element.style.top = 'auto';
            this.element.style.left = 'auto';
            this.element.style.right = '20px';
            this.element.style.bottom = '60px';
            
            // Update minimize button
            const btn = this.element.querySelector('.bi-win-minimize');
            btn.innerHTML = '+';
            btn.title = 'Restore';
        }
        
        restoreFromMinimized() {
            if (!this.minimized) return;
            
            this.minimized = false;
            
            // Restore state
            this.element.classList.remove('minimized');
            this.element.style.top = this.prevStyles.top;
            this.element.style.left = this.prevStyles.left;
            this.element.style.width = this.prevStyles.width;
            this.element.style.height = this.prevStyles.height;
            this.element.style.right = 'auto';
            this.element.style.bottom = 'auto';
            
            // Update button
            const btn = this.element.querySelector('.bi-win-minimize');
            btn.innerHTML = '_';
            btn.title = 'Minimize';
            
            this.bringToFront();
        }
        
        toggleMaximize() {
            const btn = this.element.querySelector('.bi-win-maximize');
            
            if (this.maximized) {
                // Restore from maximized
                this.maximized = false;
                
                this.element.classList.remove('maximized');
                this.element.style.top = this.prevStyles.top;
                this.element.style.left = this.prevStyles.left;
                this.element.style.width = this.prevStyles.width;
                this.element.style.height = this.prevStyles.height;
                
                btn.innerHTML = '□';
                btn.title = 'Maximize';
            } else {
                // Save current state and maximize
                if (!this.minimized) {
                    this.prevStyles = {
                        top: this.element.style.top,
                        left: this.element.style.left,
                        width: this.element.style.width,
                        height: this.element.style.height
                    };
                }
                
                this.maximized = true;
                this.minimized = false;
                
                this.element.classList.add('maximized');
                this.element.classList.remove('minimized');
                this.element.style.top = '0px';
                this.element.style.left = '0px';
                this.element.style.width = '100%';
                this.element.style.height = 'calc(100% - 50px)';
                
                btn.innerHTML = '❐';
                btn.title = 'Restore';
                
                // Update minimize button
                const minBtn = this.element.querySelector('.bi-win-minimize');
                minBtn.innerHTML = '_';
                minBtn.title = 'Minimize';
            }
            
            this.bringToFront();
        }
        
        close() {
            // Remove from taskbar
            window.BlackICEWidget.taskbar.removeWindow(this.id);
            
            // Remove from window manager
            window.BlackICEWidget.windowManager.removeWindow(this.id);
            
            // Animate out
            this.element.style.transform = 'scale(0.9)';
            this.element.style.opacity = '0';
            
            setTimeout(() => {
                this.element.remove();
            }, 200);
        }
        
        attachEvents() {
            this.element.addEventListener('mousedown', () => this.bringToFront());
            
            // Double click on header to maximize
            this.element.querySelector('.bi-window-header').addEventListener('dblclick', (e) => {
                if (!e.target.closest('.bi-window-controls')) {
                    this.toggleMaximize();
                }
            });
        }
        
        updateTitle(newTitle) {
            this.title = newTitle;
            this.element.querySelector('.bi-window-title').textContent = newTitle;
            window.BlackICEWidget.taskbar.updateTitle(this.id, newTitle);
        }
    }
    
    /**
     * WindowListMenu - Dropdown menu showing all open windows
     */
    class WindowListMenu {
        constructor(widget) {
            this.widget = widget;
            this.element = this.createDOM();
            this.isOpen = false;
            this.init();
        }
        
        createDOM() {
            const menu = document.createElement('div');
            menu.id = 'bi-window-list';
            menu.className = 'bi-window-list';
            menu.innerHTML = `
                <div class="bi-window-list-header">
                    <span>Open Windows</span>
                    <button class="bi-window-list-close-all" title="Close All">✕ All</button>
                </div>
                <div class="bi-window-list-items" id="bi-window-list-items"></div>
            `;
            document.body.appendChild(menu);
            return menu;
        }
        
        init() {
            const closeAllBtn = this.element.querySelector('.bi-window-list-close-all');
            closeAllBtn.onclick = () => {
                window.BlackICEWidget.windowManager.closeAll();
                this.close();
            };
        }
        
        open() {
            this.isOpen = true;
            this.element.classList.add('open');
            this.refresh();
        }
        
        close() {
            this.isOpen = false;
            this.element.classList.remove('open');
        }
        
        toggle() {
            if (this.isOpen) {
                this.close();
            } else {
                this.open();
            }
        }
        
        refresh() {
            const itemsContainer = document.getElementById('bi-window-list-items');
            itemsContainer.innerHTML = '';
            
            const windows = window.BlackICEWidget.windowManager.getAllWindows();
            
            if (windows.length === 0) {
                itemsContainer.innerHTML = '<div class="bi-window-list-empty">No open windows</div>';
                return;
            }
            
            windows.forEach(win => {
                const item = document.createElement('div');
                item.className = 'bi-window-list-item';
                if (win.minimized) item.classList.add('minimized');
                if (win.maximized) item.classList.add('maximized');
                
                item.innerHTML = `
                    <span class="bi-window-list-icon">📄</span>
                    <span class="bi-window-list-title">${win.title}</span>
                    <span class="bi-window-list-status">${win.minimized ? '(Minimized)' : ''}</span>
                    <button class="bi-window-list-close" title="Close">✕</button>
                `;
                
                item.onclick = (e) => {
                    if (!e.target.closest('.bi-window-list-close')) {
                        if (win.minimized) {
                            win.restoreFromMinimized();
                        } else {
                            win.bringToFront();
                        }
                        this.close();
                    }
                };
                
                const closeBtn = item.querySelector('.bi-window-list-close');
                closeBtn.onclick = (e) => {
                    e.stopPropagation();
                    win.close();
                    this.refresh();
                };
                
                itemsContainer.appendChild(item);
            });
        }
    }
    
    /**

        injectStyles() {

                .bi-reset { all: initial; }
                .bi-root { font-family: ${this.theme.font}; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
                .bi-root * { box-sizing: border-box; }
                
                /* Widget Trigger */
                #bi-trigger {
                    position: fixed; bottom: 30px; right: 30px;
                    width: 56px; height: 56px;
                    background: #18181b;

                    box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(0,0,0,0.5);
                    transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s;

                }
                @keyframes bi-wiggle {
                    0%, 100% { transform: rotate(0deg); }
                    10% { transform: rotate(-10deg); }
                    20% { transform: rotate(10deg); }

            // Windows button - toggle window list
            document.getElementById('bi-windows-btn').onclick = () => {
                this.windowListMenu.toggle();
            };
            
            document.getElementById('bi-search').oninput = (e) => {
                const term = e.target.value.toLowerCase();
                const filtered = this.allProjects.filter(p => (p.title || '').toLowerCase().includes(term));
                this.renderProjects(filtered);
            };
            
            document.getElementById('bi-home-btn').onclick = () => {
                this.openProject(this.homeUrl, "BlackICE Home");
                window.history.pushState({}, '', window.location.pathname);
            };
            
            // Update window count display
            this.updateWindowCount();
        }
        
        updateWindowCount() {
            const countEl = document.getElementById('bi-open-windows-count');
            if (countEl) {
                const count = this.windowManager.getAllWindows().length;
                countEl.textContent = count;
            }
        }
        
        async fetchProjects() {
            try {
                const res = await fetch(this.dbUrl);
                const data = await res.json();
                if (data) {
                    this.allProjects = Object.entries(data).map(([key, val]) => ({ id: key, ...val }));
                    this.allProjects.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
                    this.renderProjects(this.allProjects);
                    this.checkSharedLink();
                }
            } catch (err) {
                document.getElementById('bi-list').innerHTML = `<div style="padding:20px; text-align:center; color:#71717a">Unable to load portal.</div>`;
            }
        }
        
        checkSharedLink() {
            const urlParams = new URLSearchParams(window.location.search);
            const projectParam = urlParams.get('project');
            if (projectParam && this.allProjects.length > 0) {
                const decodedParam = decodeURIComponent(projectParam);
                const project = this.allProjects.find(site =>
                    site.title === decodedParam ||
                    site.id === decodedParam ||
                    site.url === decodedParam ||
                    (site.title || '').toLowerCase() === decodedParam.toLowerCase()
                );
                if (project) {
                    let finalUrl = project.url;
                    try {
                        const u = new URL(project.url);
                        finalUrl = window.location.origin + u.pathname;
                    } catch(e) {}
                    this.openProject(finalUrl, project.title);
                }
            }
        }
        
        openInWindow(url, title) {
            new FloatingWindow(url, title, this.getCurrentZIndex() + 1, this);
            this.updateWindowCount();
        }
        
        renderProjects(projects) {
            const list = document.getElementById('bi-list');
            list.innerHTML = "";
            if (projects.length === 0) {
                list.innerHTML = `<div style="padding:20px; text-align:center; color:#52525b; font-size:12px;">No results found.</div>`;
                return;
            }
            
            const pinned = [];
            const others = [];
            
            projects.forEach(p => {
                if (this.pinnedIds.includes(p.id)) pinned.push(p);
                else others.push(p);
            });
            
            const createCard = (p, isPinned) => {
                const screenshot =
                    `https://api.microlink.io/?url=${encodeURIComponent(p.url)}&screenshot=true&meta=false&embed=screenshot.url&viewport.width=800&viewport.height=600`;
                
                let finalUrl = p.url;
                try {
                    const u = new URL(p.url);
                    finalUrl = window.location.origin + u.pathname;
                } catch(e) {}
                
                const el = document.createElement('div');
                el.className = `bi-card ${isPinned ? 'pinned' : ''}`;
                
                el.onclick = (e) => {
                    if (e.target.closest('.bi-card-btn')) return;
                    this.openProject(finalUrl, p.title);
                    const projectParam = encodeURIComponent(p.title || p.id || p.url);
                    const newUrl = `${window.location.pathname}?project=${projectParam}`;
                    window.history.pushState({}, '', newUrl);
                };
                
                el.innerHTML = `
                    <img src="${screenshot}" class="bi-card-img" loading="lazy" />
                    <div class="bi-card-info">
                        <div class="bi-card-title">${p.title || 'Untitled Project'}</div>
                        <div class="bi-card-desc">Click to launch app</div>
                    </div>
                    <div class="bi-card-actions">
                        <button class="bi-card-btn bi-copy-btn" title="Copy Shareable Link">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>
                        </button>
                        <button class="bi-card-btn bi-pin-btn ${isPinned ? 'active-pin' : ''}" title="${isPinned ? 'Unpin' : 'Pin'}">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="${isPinned ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="17" x2="12" y2="22"></line><path d="M5 17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6h1a2 2 0 0 0 0-4H8a2 2 0 0 0 0 4h1v4.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24Z"></path></svg>
                        </button>
                        <button class="bi-card-btn bi-window-btn" title="Open in Floating Window">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="9" y1="3" x2="9" y2="21"></line></svg>
                        </button>
                    </div>
                `;
                
                const copyBtn = el.querySelector('.bi-copy-btn');
                copyBtn.onclick = (e) => {
                    e.stopPropagation();
                    const projectParam = encodeURIComponent(p.title || p.id || p.url);
                    const shareableLink = `${window.location.origin}${window.location.pathname}?project=${projectParam}`;
                    navigator.clipboard.writeText(shareableLink);
                    copyBtn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>`;
                    setTimeout(() => {
                        copyBtn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>`;
                    }, 1500);
                };
                
                const pinBtn = el.querySelector('.bi-pin-btn');
                pinBtn.onclick = (e) => {
                    e.stopPropagation();
                    this.togglePin(p.id);
                };
                
                const windowBtn = el.querySelector('.bi-window-btn');
                windowBtn.onclick = (e) => {
                    e.stopPropagation();
                    this.openInWindow(finalUrl, p.title);
                };
                
                return el;
            };
            
            pinned.forEach(p => list.appendChild(createCard(p, true)));
            
            if (pinned.length > 0 && others.length > 0) {
                const hr = document.createElement('div');
                hr.style.cssText = "height:1px; background:rgba(255,255,255,0.1); margin:8px 4px;";
                list.appendChild(hr);
            }
            
            others.forEach(p => list.appendChild(createCard(p, false)));
        }
        
        togglePin(id) {
            if (this.pinnedIds.includes(id)) {
                this.pinnedIds = this.pinnedIds.filter(pid => pid !== id);
            } else {
                this.pinnedIds.push(id);
            }
            localStorage.setItem('bi_pinned', JSON.stringify(this.pinnedIds));
            const term = document.getElementById('bi-search').value.toLowerCase();
            const filtered = this.allProjects.filter(p => (p.title || '').toLowerCase().includes(term));
            this.renderProjects(filtered);
        }
        
        openProject(url, title) {
            const iframe = document.getElementById('bi-iframe');
            const container = document.getElementById('bi-iframe-container');
            iframe.src = url;
            container.classList.add('active');
            document.body.style.overflow = 'hidden';
            window.$crisp.push(["do", "chat:hide"]);
            if (this.isOpen) this.toggle();
        }
        
        closeProject() {
            const container = document.getElementById('bi-iframe-container');
            const iframe = document.getElementById('bi-iframe');
            
            container.classList.remove('active');
            document.body.style.overflow = '';
            setTimeout(() => { iframe.src = 'about:blank'; }, 300);
            if (!this.isOpen) this.toggle();
        }
        
        setupDraggable() {
            let isDragging = false;
            let startX, startY, initLeft, initTop;
            let totalMove = 0;
            
            const onDown = (e) => {
                const tip = document.getElementById('bi-drag-tip');
                if (tip) tip.style.opacity = '0';
                
                const evt = e.touches ? e.touches[0] : e;
                isDragging = true;
                totalMove = 0;
                startX = evt.clientX; startY = evt.clientY;
                const rect = this.btn.getBoundingClientRect();
                initLeft = rect.left; initTop = rect.top;
                e.preventDefault();
                document.addEventListener('mousemove', onMove);
                document.addEventListener('touchmove', onMove, { passive: false });
                document.addEventListener('mouseup', onUp);
                document.addEventListener('touchend', onUp);
            };
            
            const onMove = (e) => {
                if (!isDragging) return;
                const evt = e.touches ? e.touches[0] : e;
                const dx = evt.clientX - startX;
                const dy = evt.clientY - startY;
                totalMove += Math.abs(dx) + Math.abs(dy);
                this.btn.style.left = `${initLeft + dx}px`;
                this.btn.style.top = `${initTop + dy}px`;
                this.btn.style.right = 'auto'; this.btn.style.bottom = 'auto';
            };
            
            const onUp = () => {
                isDragging = false;
                document.removeEventListener('mousemove', onMove);
                document.removeEventListener('touchmove', onMove);
                document.removeEventListener('mouseup', onUp);
                document.removeEventListener('touchend', onUp);
                if (totalMove < 5) this.toggle();
            };
            
            this.btn.addEventListener('mousedown', onDown);
            this.btn.addEventListener('touchstart', onDown, { passive: false });
        }
        
        toggle() {
            this.isOpen = !this.isOpen;
            if (this.isOpen) {
                this.sidebar.classList.add('open');
                this.btn.classList.add('open');
                this.overlay.classList.add('visible');
            } else {
                this.sidebar.classList.remove('open');
                this.btn.classList.remove('open');
                this.overlay.classList.remove('visible');
            }
        }
    }
    
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', () => new BlackICEWidget());
    else new BlackICEWidget();
    })();
    </script>
