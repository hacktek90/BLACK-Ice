    <!-- WIDGET JAVASCRIPT LOGIC -->
    <script>
    (function() {
        // Prevent double initialization
        if (window.BlackICEWidget) return;

        class BlackICEWidget {
            constructor() {
                this.dbUrl = "https://h-90-8a7c5-default-rtdb.firebaseio.com/sites.json";
                this.osUrl = "https://black-ice-3dbk.onrender.com/scrapsites/osapk.html";
                this.devUrl = "https://blackice-ac.vercel.app/test/dev.html";
                this.homeUrl = "https://blackice-ac.vercel.app/"; 
                this.crispId = "53f77668-00a3-4f45-8b0e-dd4d7c27ecdf"; 
                
                this.theme = {
                    font: "'Inter Tight', -apple-system, BlinkMacSystemFont, sans-serif",
                    glassBg: "rgba(9, 9, 11, 0.95)", 
                    glassBorder: "rgba(255, 255, 255, 0.08)",
                    accent: "#3b82f6",
                    textMain: "#ffffff",
                    textMuted: "#a1a1aa"
                };
                
                this.isOpen = false;
                this.allProjects = [];
                this.pinnedIds = JSON.parse(localStorage.getItem('bi_pinned') || '[]');
                this.iframeTimeout = null; 
                
                this.init();
            }

            init() {
                this.loadCrisp();
                this.setupDraggable();
                this.setupActions();
                this.fetchProjects();
                
                setTimeout(() => {
                    const tooltip = document.getElementById('bi-drag-tip');
                    if(tooltip) tooltip.style.opacity = '0';
                }, 6000);
            }

            loadCrisp() {
                window.$crisp = [];
                window.CRISP_WEBSITE_ID = this.crispId;
                const d = document;
                const s = d.createElement("script");
                s.src = "https://client.crisp.chat/l.js";
                s.async = 1;
                d.getElementsByTagName("head")[0].appendChild(s);
                window.$crisp.push(["do", "chat:hide"]);
                window.$crisp.push(["on", "chat:closed", () => {
                    window.$crisp.push(["do", "chat:hide"]);
                }]);
            }

            async fetchProjects() {
                try {
                    const res = await fetch(this.dbUrl);
                    const data = await res.json();
                    if (data) {
                        this.allProjects = Object.entries(data).map(([key, val]) => ({ id: key, ...val }));
                        this.allProjects.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
                        this.renderProjects(this.allProjects);
                        
                        // Check for shared link on startup
                        this.checkSharedLink();
                    }
                } catch (err) {
                    const list = document.getElementById('bi-list');
                    list.innerHTML = `<div style="padding:20px; text-align:center; color:#71717a">Unable to load portal. <br> <small>${err.message}</small></div>`;
                }
            }

            checkSharedLink() {
                const urlParams = new URLSearchParams(window.location.search);
                const projectParam = urlParams.get('project');
                
                if (projectParam && this.allProjects.length > 0) {
                    const decodedParam = decodeURIComponent(projectParam);
                    const project = this.allProjects.find(site => 
                        site.title === decodedParam || 
                        site.id === decodedParam || 
                        site.url === decodedParam ||
                        (site.title || '').toLowerCase() === decodedParam.toLowerCase()
                    );

                    if (project) {
                        // Use the URL directly from Firebase now
                        this.openProject(project.url, project.title);
                    }
                }
            }

            renderProjects(projects) {
                const list = document.getElementById('bi-list');
                list.innerHTML = ""; 
                if(projects.length === 0) {
                    list.innerHTML = `<div style="padding:20px; text-align:center; color:#52525b; font-size:12px;">No results found.</div>`;
                    return;
                }

                const pinned = [];
                const others = [];

                projects.forEach(p => {
                    if(this.pinnedIds.includes(p.id)) pinned.push(p);
                    else others.push(p);
                });

                const createCard = (p, isPinned) => {
                    const el = document.createElement('div'); 
                    el.className = `bi-card ${isPinned ? 'pinned' : ''}`;
                    
                    el.onclick = (e) => {
                        if (e.target.closest('.bi-card-btn')) return;
                        // Use the direct URL from Firebase
                        this.openProject(p.url, p.title);
                        
                        const projectParam = encodeURIComponent(p.title || p.id || p.url);
                        const newUrl = `${window.location.pathname}?project=${projectParam}`;
                        window.history.pushState({}, '', newUrl);
                    };
                    
                    el.innerHTML = `
                        <!-- Generic Link Icon instead of Microlink Screenshot -->
                        <div class="bi-card-img">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>
                        </div>
                        <div class="bi-card-info">
                            <div class="bi-card-title">${p.title || 'Untitled Project'}</div>
                            <div class="bi-card-desc">${new URL(p.url).hostname}</div>
                        </div>
                        <div class="bi-card-actions">
                             <button class="bi-card-btn bi-copy-btn" title="Copy Shareable Link">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>
                            </button>
                            <button class="bi-card-btn bi-pin-btn ${isPinned ? 'active-pin' : ''}" title="${isPinned ? 'Unpin' : 'Pin'}">
                                <svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-4-8c.41-1.16 1.52-2 2.82-2h.36c1.3 0 2.41.84 2.82 2H8zm5.18 0H16c-.41-1.16-1.52-2-2.82-2h-.36c-1.3 0-2.41.84-2.82 2z"></path><path d="M10 18h4v-2h-4v2z"></path></svg>
                            </button>
                        </div>
                    `;
                    
                    const copyBtn = el.querySelector('.bi-copy-btn');
                    copyBtn.onclick = (e) => {
                        e.stopPropagation();
                        const projectParam = encodeURIComponent(p.title || p.id || p.url);
                        const shareableLink = `${window.location.origin}${window.location.pathname}?project=${projectParam}`;

                        navigator.clipboard.writeText(shareableLink);
                        
                        // Visual Feedback
                        const originalHTML = copyBtn.innerHTML;
                        copyBtn.innerHTML = `<svg viewBox="0 0 24 24" stroke="#10b981" fill="none"><polyline points="20 6 9 17 4 12"></polyline></svg>`;
                        setTimeout(() => {
                             copyBtn.innerHTML = originalHTML;
                        }, 1500);
                    };

                    const pinBtn = el.querySelector('.bi-pin-btn');
                    pinBtn.onclick = (e) => {
                        e.stopPropagation();
                        this.togglePin(p.id);
                    };

                    return el;
                };

                pinned.forEach(p => list.appendChild(createCard(p, true)));
                
                if(pinned.length > 0 && others.length > 0) {
                     const hr = document.createElement('div');
                     hr.style.cssText = "height:1px; background:rgba(255,255,255,0.1); margin:8px 4px;";
                     list.appendChild(hr);
                }

                others.forEach(p => list.appendChild(createCard(p, false)));
            }

            togglePin(id) {
                if(this.pinnedIds.includes(id)) {
                    this.pinnedIds = this.pinnedIds.filter(pid => pid !== id);
                } else {
                    this.pinnedIds.push(id);
                }
                localStorage.setItem('bi_pinned', JSON.stringify(this.pinnedIds));
                
                const term = document.getElementById('bi-search').value.toLowerCase();
                const filtered = this.allProjects.filter(p => (p.title || '').toLowerCase().includes(term));
                this.renderProjects(filtered);
            }
            
            openProject(url, title) {
                const iframe = document.getElementById('bi-iframe');
                const container = document.getElementById('bi-iframe-container');
                const titleEl = document.getElementById('bi-current-title');
                const linkEl = document.getElementById('bi-external-link');
                
                if(!url.startsWith('http')) {
                    console.warn("Blocked non-http URL");
                    return;
                }

                titleEl.textContent = title || "Loading App...";
                linkEl.href = url;
                
                if(this.iframeTimeout) clearTimeout(this.iframeTimeout);

                // Load URL directly into iframe
                iframe.src = url;
                container.classList.add('active');
                document.body.style.overflow = 'hidden'; 
                
                if(this.isOpen) this.toggle(); 
            }

            closeProject() {
                const container = document.getElementById('bi-iframe-container');
                const iframe = document.getElementById('bi-iframe');
                
                container.classList.remove('active');
                document.body.style.overflow = '';
                
                setTimeout(() => { iframe.src = 'about:blank'; }, 300);
            }

            setupDraggable() {
                let isDragging = false;
                let startX, startY, initLeft, initTop;
                let totalMove = 0;
                const btn = document.getElementById('bi-trigger');

                const onDown = (e) => {
                    const tip = document.getElementById('bi-drag-tip');
                    if(tip) tip.style.opacity = '0';
                    
                    const evt = e.touches ? e.touches[0] : e;
                    isDragging = true;
                    totalMove = 0;
                    startX = evt.clientX; startY = evt.clientY;
                    const rect = btn.getBoundingClientRect();
                    initLeft = rect.left; initTop = rect.top;
                    e.preventDefault();
                    document.addEventListener('mousemove', onMove);
                    document.addEventListener('touchmove', onMove, { passive: false });
                    document.addEventListener('mouseup', onUp);
                    document.addEventListener('touchend', onUp);
                };

                const onMove = (e) => {
                    if (!isDragging) return;
                    const evt = e.touches ? e.touches[0] : e;
                    const dx = evt.clientX - startX;
                    const dy = evt.clientY - startY;
                    totalMove += Math.abs(dx) + Math.abs(dy);
                    btn.style.left = `${initLeft + dx}px`;
                    btn.style.top = `${initTop + dy}px`;
                    btn.style.right = 'auto'; btn.style.bottom = 'auto';
                };

                const onUp = () => {
                    isDragging = false;
                    document.removeEventListener('mousemove', onMove);
                    document.removeEventListener('touchmove', onMove);
                    document.removeEventListener('mouseup', onUp);
                    document.removeEventListener('touchend', onUp);
                    if (totalMove < 5) this.toggle();
                };

                btn.addEventListener('mousedown', onDown);
                btn.addEventListener('touchstart', onDown, { passive: false });
            }

            toggle() {
                this.isOpen = !this.isOpen;
                const sidebar = document.getElementById('bi-sidebar');
                const btn = document.getElementById('bi-trigger');
                const overlay = document.getElementById('bi-overlay');

                if (this.isOpen) {
                    sidebar.classList.add('open');
                    btn.classList.add('open');
                    overlay.classList.add('visible');
                } else {
                    sidebar.classList.remove('open');
                    btn.classList.remove('open');
                    overlay.classList.remove('visible');
                }
            }

            setupActions() {
                // Dev Button
                const devBtn = document.getElementById('bi-dev-btn');
                if (devBtn) {
                    devBtn.onclick = () => {
                        this.openProject(this.devUrl, "Dev Mode");
                    };
                }

                // Home Button: Opens Home URL in iframe
                const homeBtn = document.getElementById('bi-home-btn');
                if (homeBtn) {
                    homeBtn.onclick = () => {
                        this.openProject(this.homeUrl, "Home");
                    };
                }

                document.getElementById('bi-os-btn').onclick = () => window.open(this.osUrl, '_blank');
                document.getElementById('bi-fs-btn').onclick = () => {
                    if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(e => console.log(e));
                    else document.exitFullscreen();
                };
                
                document.getElementById('bi-chat-btn').onclick = () => {
                    if(window.$crisp) {
                        window.$crisp.push(["do", "chat:open"]);
                        window.$crisp.push(["do", "chat:show"]);
                    }
                };

                document.getElementById('bi-search').oninput = (e) => {
                    const term = e.target.value.toLowerCase();
                    const filtered = this.allProjects.filter(p => (p.title || '').toLowerCase().includes(term));
                    this.renderProjects(filtered);
                };

                // Overlay click closes sidebar
                document.getElementById('bi-overlay').onclick = () => this.toggle();
            }
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', () => new BlackICEWidget());
        } else {
            new BlackICEWidget();
        }
    })();
    </script>
