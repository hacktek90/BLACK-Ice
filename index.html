    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MuPDF.js PDF Viewer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #0f0f0f;
            color: #e0e0e0;
            overflow: hidden;
            height: 100vh;
        }

        .app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* Toolbar */
        .toolbar {
            background: linear-gradient(180deg, #1a1a1a 0%, #141414 100%);
            border-bottom: 1px solid #2a2a2a;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            z-index: 100;
        }

        .toolbar-section {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 15px;
            border-right: 1px solid #2a2a2a;
        }

        .toolbar-section:last-child {
            border-right: none;
            margin-left: auto;
        }

        .btn {
            background: #252525;
            border: 1px solid #333;
            color: #e0e0e0;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        .btn:hover:not(:disabled) {
            background: #333;
            border-color: #444;
            transform: translateY(-1px);
        }

        .btn:active:not(:disabled) {
            transform: translateY(0);
        }

        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .btn.primary {
            background: #0066cc;
            border-color: #0066cc;
            color: white;
        }

        .btn.primary:hover:not(:disabled) {
            background: #0052a3;
            border-color: #0052a3;
        }

        .page-info {
            background: #1a1a1a;
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid #333;
            font-size: 13px;
            font-variant-numeric: tabular-nums;
            min-width: 100px;
            text-align: center;
        }

        .zoom-select {
            background: #1a1a1a;
            border: 1px solid #333;
            color: #e0e0e0;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            outline: none;
        }

        .zoom-select:focus {
            border-color: #0066cc;
        }

        /* Main Content */
        .main-content {
            flex: 1;
            display: flex;
            overflow: hidden;
            position: relative;
        }

        /* Sidebar */
        .sidebar {
            width: 200px;
            background: #141414;
            border-right: 1px solid #2a2a2a;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease;
        }

        .sidebar.hidden {
            transform: translateX(-100%);
            width: 0;
        }

        .sidebar-header {
            padding: 15px;
            border-bottom: 1px solid #2a2a2a;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #888;
            font-weight: 600;
        }

        .thumbnail-container {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .thumbnail {
            width: 100%;
            aspect-ratio: 0.707;
            background: #1a1a1a;
            border: 2px solid transparent;
            border-radius: 4px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: #666;
            position: relative;
            overflow: hidden;
        }

        .thumbnail:hover {
            border-color: #444;
        }

        .thumbnail.active {
            border-color: #0066cc;
        }

        .thumbnail canvas {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .thumbnail-number {
            position: absolute;
            bottom: 2px;
            right: 5px;
            background: rgba(0,0,0,0.7);
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 10px;
        }

        /* Viewer */
        .viewer-container {
            flex: 1;
            background: #0a0a0a;
            overflow: auto;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px;
        }

        .viewer-content {
            position: relative;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            background: white;
            margin: 0 auto;
        }

        #pdfCanvas {
            display: block;
            max-width: 100%;
            height: auto;
        }

        .text-layer {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
        }

        .text-layer span {
            position: absolute;
            color: transparent;
            pointer-events: auto;
            cursor: text;
        }

        /* Welcome Screen */
        .welcome-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: radial-gradient(ellipse at center, #1a1a1a 0%, #0a0a0a 100%);
            z-index: 50;
        }

        .welcome-content {
            text-align: center;
            max-width: 500px;
            padding: 40px;
        }

        .logo {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #0066cc 0%, #004499 100%);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 30px;
            font-size: 40px;
            box-shadow: 0 10px 30px rgba(0, 102, 204, 0.3);
        }

        .welcome-title {
            font-size: 28px;
            font-weight: 300;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }

        .welcome-subtitle {
            color: #666;
            font-size: 14px;
            margin-bottom: 40px;
            line-height: 1.6;
        }

        .drop-zone {
            border: 2px dashed #333;
            border-radius: 12px;
            padding: 60px 40px;
            transition: all 0.3s;
            cursor: pointer;
            background: rgba(255,255,255,0.02);
        }

        .drop-zone:hover, .drop-zone.dragover {
            border-color: #0066cc;
            background: rgba(0, 102, 204, 0.05);
        }

        .drop-zone-text {
            font-size: 16px;
            color: #888;
            margin-bottom: 10px;
        }

        .drop-zone-hint {
            font-size: 12px;
            color: #555;
        }

        /* Loading */
        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 15, 15, 0.9);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 200;
            backdrop-filter: blur(5px);
        }

        .loading-overlay.active {
            display: flex;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid #333;
            border-top-color: #0066cc;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            color: #888;
            font-size: 14px;
        }

        /* Error Message */
        .error-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #1a1a1a;
            padding: 30px;
            border-radius: 12px;
            border: 1px solid #ff4444;
            display: none;
            text-align: center;
            max-width: 400px;
            z-index: 300;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }

        .error-message.active {
            display: block;
        }

        .error-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        /* Status Bar */
        .status-bar {
            background: #141414;
            border-top: 1px solid #2a2a2a;
            padding: 8px 20px;
            font-size: 12px;
            color: #666;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status-section {
            display: flex;
            gap: 20px;
        }

        /* Search Box */
        .search-box {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 10px;
            display: none;
            flex-direction: column;
            gap: 8px;
            z-index: 150;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            min-width: 250px;
        }

        .search-box.active {
            display: flex;
        }

        .search-input-group {
            display: flex;
            gap: 8px;
        }

        .search-input {
            flex: 1;
            background: #0f0f0f;
            border: 1px solid #333;
            color: #e0e0e0;
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 13px;
            outline: none;
        }

        .search-input:focus {
            border-color: #0066cc;
        }

        .search-results {
            font-size: 12px;
            color: #888;
            padding: 5px 0;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .toolbar {
                padding: 10px;
            }
            
            .toolbar-section {
                padding: 0 8px;
            }
            
            .sidebar {
                position: absolute;
                z-index: 90;
                height: 100%;
            }
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #0f0f0f;
        }

        ::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #444;
        }
    </style>


    <div class="app-container">
        <!-- Toolbar -->
        <div class="toolbar">
            <div class="toolbar-section">
                <button class="btn primary" onclick="document.getElementById('fileInput').click()">
                    <span>📂</span> Open PDF
                </button>
                <input type="file" id="fileInput" accept=".pdf,application/pdf" style="display: none;" onchange="handleFileSelect(event)">
            </div>

            <div class="toolbar-section" id="navControls" style="opacity: 0.4; pointer-events: none;">
                <button class="btn" onclick="prevPage()" title="Previous Page">
                    <span>◀</span>
                </button>
                <div class="page-info">
                    <span id="currentPage">0</span> / <span id="totalPages">0</span>
                </div>
                <button class="btn" onclick="nextPage()" title="Next Page">
                    <span>▶</span>
                </button>
            </div>

            <div class="toolbar-section" id="zoomControls" style="opacity: 0.4; pointer-events: none;">

                <select class="zoom-select" id="zoomSelect" onchange="setZoom(this.value)">

        <!-- Main Content -->
        <div class="main-content">
            <!-- Sidebar -->

            <div class="viewer-container" id="dropZone">

                        <p class="welcome-subtitle">
                            High-performance PDF viewing using MuPDF WebAssembly engine.<br>
                            No PDF.js required - pure C compiled to WASM.

        <!-- Status Bar -->
        <div class="status-bar">
            <div class="status-section">
                <span id="fileName">No file loaded</span>

                <span id="renderStatus">Ready</span>

    <!-- MuPDF.js from CDN -->
    <script type="module">
        import * as mupdf from 'https://cdn.jsdelivr.net/npm/mupdf@0.3.0/dist/mupdf.module.js';
        
        // Global state
        let pdfDocument = null;
        let currentPageNum = 1;
        let totalPages = 0;
        let currentZoom = 1;
        let currentRotation = 0;
        let pdfBuffer = null;
        let fileName = '';
        
        // Make functions available globally for onclick handlers
        window.handleFileSelect = handleFileSelect;
        window.prevPage = prevPage;
        window.nextPage = nextPage;
        window.zoomIn = zoomIn;
        window.zoomOut = zoomOut;
        window.setZoom = setZoom;
        window.rotatePage = rotatePage;
        window.toggleSearch = toggleSearch;
        window.toggleSidebar = toggleSidebar;
        window.searchText = searchText;
        window.downloadPDF = downloadPDF;
        window.clearViewer = clearViewer;
        window.goToPage = goToPage;

        // Initialize MuPDF
        async function initMuPDF() {
            try {
                updateLoadingText('Initializing MuPDF engine...');
                showLoading();
                
                // MuPDF initialization happens automatically when imported
                // The wasm binary is loaded from the CDN
                
                hideLoading();
                console.log('MuPDF initialized successfully');
            } catch (error) {
                console.error('Failed to initialize MuPDF:', error);
                showError('Failed to initialize PDF engine. Please check your browser supports WebAssembly.');
            }
        }

        // File handling
        async function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            if (file.type !== 'application/pdf') {
                showError('Please select a valid PDF file.');
                return;
            }
            
            fileName = file.name;
            const fileSize = (file.size / 1024 / 1024).toFixed(2) + ' MB';
            
            updateLoadingText('Reading file...');
            showLoading();
            
            try {
                const arrayBuffer = await file.arrayBuffer();
                pdfBuffer = new Uint8Array(arrayBuffer);
                await loadPDF(pdfBuffer, fileName, fileSize);
            } catch (error) {
                console.error('Error reading file:', error);
                showError('Failed to read PDF file: ' + error.message);
            }
        }

        // Load PDF into MuPDF
        async function loadPDF(buffer, name, size) {
            try {
                updateLoadingText('Opening PDF document...');
                
                // Open document using MuPDF
                pdfDocument = mupdf.Document.openDocument(buffer, "application/pdf");
                totalPages = pdfDocument.countPages();
                currentPageNum = 1;
                currentRotation = 0;
                
                // Update UI
                document.getElementById('fileName').textContent = name;
                document.getElementById('fileSize').textContent = size;
                document.getElementById('totalPages').textContent = totalPages;
                document.getElementById('currentPage').textContent = currentPageNum;
                
                // Enable controls
                enableControls();
                
                // Hide welcome screen
                document.getElementById('welcomeScreen').style.display = 'none';
                document.getElementById('viewerContent').style.display = 'block';
                
                // Render first page
                await renderPage(currentPageNum);
                
                // Generate thumbnails
                await generateThumbnails();
                
                hideLoading();
                updateStatus('PDF loaded successfully');
            } catch (error) {
                console.error('Error loading PDF:', error);
                showError('Failed to load PDF: ' + error.message);
            }
        }

        // Render page using MuPDF
        async function renderPage(pageNum) {
            if (!pdfDocument || pageNum < 1 || pageNum > totalPages) return;
            
            try {
                updateLoadingText(`Rendering page ${pageNum}...`);
                
                const page = pdfDocument.loadPage(pageNum - 1); // MuPDF uses 0-based indexing
                
                // Calculate transform based on zoom and rotation
                let transform = mupdf.Matrix.identity;
                transform = mupdf.Matrix.concat(transform, mupdf.Matrix.scale(currentZoom, currentZoom));
                
                if (currentRotation !== 0) {
                    transform = mupdf.Matrix.concat(transform, mupdf.Matrix.rotate(currentRotation));
                }
                
                // Get page bounds
                const bounds = page.getBounds();
                
                // Render to pixmap
                const pixmap = page.toPixmap(transform, mupdf.ColorSpace.DeviceRGB, false);
                const imageData = pixmap.getPixels();
                const width = pixmap.getWidth();
                const height = pixmap.getHeight();
                
                // Draw to canvas
                const canvas = document.getElementById('pdfCanvas');
                const ctx = canvas.getContext('2d');
                
                canvas.width = width;
                canvas.height = height;
                
                // Create ImageData and put on canvas
                const imgData = new ImageData(new Uint8ClampedArray(imageData), width, height);
                ctx.putImageData(imgData, 0, 0);
                
                // Update page info
                document.getElementById('currentPage').textContent = pageNum;
                currentPageNum = pageNum;
                
                // Update thumbnail selection
                updateThumbnailSelection(pageNum);
                
                // Extract and render text layer
                await renderTextLayer(page);
                
                updateStatus(`Page ${pageNum} of ${totalPages}`);
                
                // Cleanup
                page.destroy();
                pixmap.destroy();
                
            } catch (error) {
                console.error('Error rendering page:', error);
                updateStatus('Error rendering page');
            }
        }

        // Render text layer for selection
        async function renderTextLayer(page) {
            const textLayer = document.getElementById('textLayer');
            textLayer.innerHTML = '';
            
            try {
                const textPage = page.toTextPage();
                const blocks = textPage.getBlocks();
                
                // This is a simplified text layer - in production you'd want to
                // create selectable text spans positioned correctly
                textPage.destroy();
            } catch (error) {
                console.log('Text extraction not available');
            }
        }

        // Generate thumbnails
        async function generateThumbnails() {
            const container = document.getElementById('thumbnailContainer');
            container.innerHTML = '';
            
            for (let i = 1; i <= totalPages; i++) {
                const thumbDiv = document.createElement('div');
                thumbDiv.className = 'thumbnail';
                thumbDiv.dataset.page = i;
                thumbDiv.onclick = () => goToPage(i);
                
                const pageNum = document.createElement('div');
                pageNum.className = 'thumbnail-number';
                pageNum.textContent = i;
                thumbDiv.appendChild(pageNum);
                
                container.appendChild(thumbDiv);
                
                // Render thumbnail
                try {
                    const page = pdfDocument.loadPage(i - 1);
                    const bounds = page.getBounds();
                    const scale = 150 / bounds[2]; // Fit to 150px width
                    const transform = mupdf.Matrix.scale(scale, scale);
                    const pixmap = page.toPixmap(transform, mupdf.ColorSpace.DeviceRGB, false);
                    
                    const thumbCanvas = document.createElement('canvas');
                    thumbCanvas.width = pixmap.getWidth();
                    thumbCanvas.height = pixmap.getHeight();
                    const ctx = thumbCanvas.getContext('2d');
                    
                    const imageData = pixmap.getPixels();
                    const imgData = new ImageData(new Uint8ClampedArray(imageData), pixmap.getWidth(), pixmap.getHeight());
                    ctx.putImageData(imgData, 0, 0);
                    
                    thumbDiv.innerHTML = '';
                    thumbDiv.appendChild(thumbCanvas);
                    thumbDiv.appendChild(pageNum);
                    
                    page.destroy();
                    pixmap.destroy();
                } catch (e) {
                    console.error('Error generating thumbnail:', e);
                }
            }
        }

        // Navigation
        function prevPage() {
            if (currentPageNum > 1) {
                renderPage(currentPageNum - 1);
            }
        }

        function nextPage() {
            if (currentPageNum < totalPages) {
                renderPage(currentPageNum + 1);
            }
        }

        function goToPage(num) {
            if (num >= 1 && num <= totalPages) {
                renderPage(num);
            }
        }

        // Zoom
        function zoomIn() {
            const zoomSelect = document.getElementById('zoomSelect');
            const currentIndex = zoomSelect.selectedIndex;
            if (currentIndex < zoomSelect.options.length - 1) {
                zoomSelect.selectedIndex = currentIndex + 1;
                setZoom(zoomSelect.value);
            }
        }

        function zoomOut() {
            const zoomSelect = document.getElementById('zoomSelect');
            const currentIndex = zoomSelect.selectedIndex;
            if (currentIndex > 0) {
                zoomSelect.selectedIndex = currentIndex - 1;
                setZoom(zoomSelect.value);
            }
        }

        function setZoom(value) {
            currentZoom = parseFloat(value);
            renderPage(currentPageNum);
        }

        // Rotation
        function rotatePage() {
            currentRotation = (currentRotation + 90) % 360;
            renderPage(currentPageNum);
        }

        // Search functionality
        function toggleSearch() {
            const searchBox = document.getElementById('searchBox');
            searchBox.classList.toggle('active');
            if (searchBox.classList.contains('active')) {
                document.getElementById('searchInput').focus();
            }
        }

        function searchText() {
            if (!pdfDocument) return;
            
            const query = document.getElementById('searchInput').value;
            if (!query) return;
            
            // MuPDF search implementation would go here
            // This requires iterating through pages and using text extraction
            document.getElementById('searchResults').textContent = 'Search: ' + query;
        }

        // Sidebar toggle
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('hidden');
        }

        // Download
        function downloadPDF() {
            if (!pdfBuffer) return;
            
            const blob = new Blob([pdfBuffer], { type: 'application/pdf' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = fileName || 'document.pdf';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // Clear/Reset
        function clearViewer() {
            pdfDocument = null;
            pdfBuffer = null;
            currentPageNum = 1;
            totalPages = 0;
            currentZoom = 1;
            currentRotation = 0;
            fileName = '';
            
            document.getElementById('pdfCanvas').getContext('2d').clearRect(0, 0, 
                document.getElementById('pdfCanvas').width, 
                document.getElementById('pdfCanvas').height
            );
            document.getElementById('viewerContent').style.display = 'none';
            document.getElementById('welcomeScreen').style.display = 'flex';
            document.getElementById('thumbnailContainer').innerHTML = '';
            document.getElementById('fileName').textContent = 'No file loaded';
            document.getElementById('fileSize').textContent = '';
            document.getElementById('currentPage').textContent = '0';
            document.getElementById('totalPages').textContent = '0';
            document.getElementById('searchBox').classList.remove('active');
            document.getElementById('textLayer').innerHTML = '';
            
            disableControls();
            hideError();
        }

        // UI Helpers
        function enableControls() {
            document.getElementById('navControls').style.opacity = '1';
            document.getElementById('navControls').style.pointerEvents = 'auto';
            document.getElementById('zoomControls').style.opacity = '1';
            document.getElementById('zoomControls').style.pointerEvents = 'auto';
            document.getElementById('actionControls').style.opacity = '1';
            document.getElementById('actionControls').style.pointerEvents = 'auto';
        }

        function disableControls() {
            document.getElementById('navControls').style.opacity = '0.4';
            document.getElementById('navControls').style.pointerEvents = 'none';
            document.getElementById('zoomControls').style.opacity = '0.4';
            document.getElementById('zoomControls').style.pointerEvents = 'none';
            document.getElementById('actionControls').style.opacity = '0.4';
            document.getElementById('actionControls').style.pointerEvents = 'none';
        }

        function showLoading() {
            document.getElementById('loadingOverlay').classList.add('active');
        }

        function hideLoading() {
            document.getElementById('loadingOverlay').classList.remove('active');
        }

        function updateLoadingText(text) {
            document.getElementById('loadingText').textContent = text;
        }

        function showError(text) {
            hideLoading();
            document.getElementById('errorText').textContent = text;
            document.getElementById('errorMessage').classList.add('active');
        }

        function hideError() {
            document.getElementById('errorMessage').classList.remove('active');
        }

        function updateStatus(text) {
            document.getElementById('renderStatus').textContent = text;
        }

        function updateThumbnailSelection(pageNum) {
            document.querySelectorAll('.thumbnail').forEach(thumb => {
                thumb.classList.toggle('active', parseInt(thumb.dataset.page) === pageNum);
            });
        }

        // Drag and drop
        const dropZone = document.getElementById('dropZone');
        
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            document.querySelector('.drop-zone').classList.add('dragover');
        });
        
        dropZone.addEventListener('dragleave', (e) => {
            e.preventDefault();
            document.querySelector('.drop-zone').classList.remove('dragover');
        });
        
        dropZone.addEventListener('drop', async (e) => {
            e.preventDefault();
            document.querySelector('.drop-zone').classList.remove('dragover');
            
            const files = e.dataTransfer.files;
            if (files.length > 0 && files[0].type === 'application/pdf') {
                const file = files[0];
                fileName = file.name;
                const fileSize = (file.size / 1024 / 1024).toFixed(2) + ' MB';
                
                try {
                    const arrayBuffer = await file.arrayBuffer();
                    pdfBuffer = new Uint8Array(arrayBuffer);
                    await loadPDF(pdfBuffer, fileName, fileSize);
                } catch (error) {
                    showError('Failed to load dropped file: ' + error.message);
                }
            } else {
                showError('Please drop a valid PDF file.');
            }
        });

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (!pdfDocument) return;
            
            switch(e.key) {
                case 'ArrowLeft':
                case 'PageUp':
                    if (e.ctrlKey) return;
                    e.preventDefault();
                    prevPage();
                    break;
                case 'ArrowRight':
                case 'PageDown':
                    if (e.ctrlKey) return;
                    e.preventDefault();
                    nextPage();
                    break;
                case 'Home':
                    e.preventDefault();
                    goToPage(1);
                    break;
                case 'End':
                    e.preventDefault();
                    goToPage(totalPages);
                    break;
                case 'f':
                    if (e.ctrlKey) {
                        e.preventDefault();
                        toggleSearch();
                    }
                    break;
                case 'Escape':
                    document.getElementById('searchBox').classList.remove('active');
                    break;
            }
        });

        // Initialize
        initMuPDF();
    </script>
