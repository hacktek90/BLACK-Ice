<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Project Portal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Tailwind + Fonts -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@500,700,900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Satoshi', 'sans-serif'] },
          colors: {
            background: '#09090b', /* Very dark background like BicoChat */
            surface: '#18181b',    /* Slightly lighter for cards */
            border: '#27272a',     /* Dark border */
            primary: '#3b82f6',    /* Blue accent */
            text: '#e4e4e7',       /* Light gray text */
            muted: '#a1a1aa'       /* Muted text */
          },
          boxShadow: {
            'glow': '0 0 20px rgba(59, 130, 246, 0.15)'
          }
        }
      }
    }
  </script>

  <style>
    body { background: #09090b; color: #e4e4e7; overflow: hidden; }

    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #52525b; }

    /* Glass Effect for Mobile Menu */
    .glass {
      background: rgba(24, 24, 27, 0.8);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid #27272a;
    }

    /* Card Hover Effect */
    .project-card {
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .project-card:hover {
      background: #27272a;
      transform: translateY(-1px);
    }
    .project-card.active {
      background: #2563eb;
      border-color: #2563eb;
      color: white;
    }

    /* Screenshot Fade In */
    .screenshot-img { opacity: 0; transition: opacity 0.3s; }
    .screenshot-img.loaded { opacity: 1; }
  </style>
</head>

<body class="h-screen w-screen flex flex-col md:flex-row">

<!-- Mobile Header (Visible only on mobile) -->
<div class="md:hidden h-14 glass flex items-center justify-between px-4 z-50 shrink-0">
  <span class="font-bold text-lg tracking-tight">Project Portal</span>
  <button id="menuBtn" class="w-8 h-8 flex items-center justify-center text-muted hover:text-white transition-colors">
    <i class="fa-solid fa-bars text-xl"></i>
  </button>
</div>

<!-- Sidebar Overlay (Mobile) -->
<div id="mobileOverlay" class="fixed inset-0 bg-black/60 z-40 hidden md:hidden backdrop-blur-sm transition-opacity opacity-0"></div>

<!-- Sidebar -->
<aside id="sidebar" class="fixed md:relative top-0 left-0 h-full w-[260px] bg-background border-r border-border flex flex-col z-50 transform -translate-x-full md:translate-x-0 transition-transform duration-300 shadow-2xl md:shadow-none">

  <!-- Header -->
  <div class="p-4 border-b border-border/50">
    <h1 class="text-lg font-bold tracking-tight mb-4 hidden md:block">Project Portal</h1>

    <!-- Search Input -->
    <div class="relative">
      <i class="fa-solid fa-search absolute left-3 top-1/2 -translate-y-1/2 text-muted text-xs"></i>
      <input id="searchInput" 
             placeholder="Search projects..." 
             class="w-full bg-surface border border-border rounded-lg pl-8 pr-3 py-2 text-sm outline-none focus:border-primary focus:ring-1 focus:ring-primary/50 transition-all placeholder:text-muted/60">
    </div>
  </div>

  <!-- Project List -->
  <div id="projectList" class="flex-1 overflow-y-auto p-2 space-y-1">
    <!-- Loading Skeleton -->
    <div class="animate-pulse space-y-2 p-1">
      <div class="h-10 bg-surface rounded-lg w-full"></div>
      <div class="h-10 bg-surface rounded-lg w-full"></div>
      <div class="h-10 bg-surface rounded-lg w-full"></div>
    </div>
  </div>
</aside>

<!-- Main Content -->
<main class="flex-1 flex flex-col relative h-full bg-surface overflow-hidden">

  <!-- Loader -->
  <div id="frameLoader" class="hidden absolute inset-0 z-20 bg-background flex flex-col items-center justify-center">
    <div class="w-8 h-8 border-2 border-primary border-t-transparent rounded-full animate-spin mb-4"></div>
    <span class="text-sm text-muted animate-pulse">Loading application...</span>
  </div>

  <!-- Iframe -->
  <iframe id="portalFrame" class="w-full h-full border-none bg-white" src="about:blank"></iframe>

  <!-- Empty State (Initial) -->
  <div id="emptyState" class="absolute inset-0 bg-background flex flex-col items-center justify-center text-center p-6 z-10">
    <div class="w-16 h-16 bg-surface rounded-2xl border border-border flex items-center justify-center mb-6 shadow-glow">
      <i class="fa-solid fa-layer-group text-2xl text-primary"></i>
    </div>
    <h2 class="text-2xl font-bold mb-2">Welcome Back</h2>
    <p class="text-muted max-w-sm">Select a project from the sidebar to launch your workspace instantly.</p>
  </div>

  <!-- Close Button (Floating) -->
  <button id="closeProject" class="hidden absolute top-4 right-4 md:right-6 bg-surface/90 backdrop-blur border border-border text-muted hover:text-white px-3 py-1.5 rounded-lg text-xs font-medium shadow-lg transition-all z-30 flex items-center gap-2 hover:border-red-500/50 hover:bg-red-500/10">
    <span>Close</span>
    <i class="fa-solid fa-xmark"></i>
  </button>

</main>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
import { getDatabase, ref, onValue } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';

const firebaseConfig = {
  apiKey: "AIzaSyAp9kCBsDLnQEmR7wWHXwt3FB2T1zDtiqU",
  authDomain: "h-90-8a7c5.firebaseapp.com",
  databaseURL: "https://h-90-8a7c5-default-rtdb.firebaseio.com",
  projectId: "h-90-8a7c5",
  storageBucket: "h-90-8a7c5.firebasestorage.app",
  messagingSenderId: "367196609301",
  appId: "1:367196609301:web:156e24c1b4532c26af671c"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// DOM Elements
const sidebar = document.getElementById('sidebar');
const menuBtn = document.getElementById('menuBtn');
const mobileOverlay = document.getElementById('mobileOverlay');
const projectList = document.getElementById('projectList');
const frame = document.getElementById('portalFrame');
const loader = document.getElementById('frameLoader');
const emptyState = document.getElementById('emptyState');
const closeBtn = document.getElementById('closeProject');
const searchInput = document.getElementById('searchInput');

// Mobile Menu Logic
function toggleSidebar(show) {
  if(show) {
    sidebar.classList.remove('-translate-x-full');
    mobileOverlay.classList.remove('hidden');
    // small delay to allow display:block to apply before opacity transition
    setTimeout(() => mobileOverlay.classList.remove('opacity-0'), 10);
  } else {
    sidebar.classList.add('-translate-x-full');
    mobileOverlay.classList.add('opacity-0');
    setTimeout(() => mobileOverlay.classList.add('hidden'), 300);
  }
}

menuBtn.onclick = () => toggleSidebar(true);
mobileOverlay.onclick = () => toggleSidebar(false);

// Frame Logic
function showLoader() {
  loader.classList.remove('hidden');
  emptyState.classList.add('hidden');
  closeBtn.classList.remove('hidden');
}

function hideLoader() {
  loader.classList.add('hidden');
}

function convertToLocalHostUrl(url) {
  try {
    const u = new URL(url);
    if (window.location.protocol === 'file:') {
      return u.pathname.startsWith('/') ? u.pathname.substring(1) : u.pathname;
    }
    return window.location.origin + u.pathname;
  } catch { return url; }
}

function loadProject(url, btnElement) {
  showLoader();

  // Active State
  document.querySelectorAll('.project-card').forEach(b => b.classList.remove('active'));
  if(btnElement) btnElement.classList.add('active');

  frame.src = convertToLocalHostUrl(url);

  // Close sidebar on mobile after selection
  if(window.innerWidth < 768) toggleSidebar(false);
}

frame.onload = hideLoader;

closeBtn.onclick = () => {
  frame.src = 'about:blank';
  emptyState.classList.remove('hidden');
  closeBtn.classList.add('hidden');
  document.querySelectorAll('.project-card').forEach(b => b.classList.remove('active'));
};

// Data Loading
onValue(ref(db, 'sites'), (snapshot) => {
  const data = snapshot.val();
  projectList.innerHTML = '';

  if(!data) {
    projectList.innerHTML = '<div class="p-4 text-center text-xs text-muted">No projects found</div>';
    return;
  }

  const sites = Object.values(data).sort((a,b) => (b.timestamp || 0) - (a.timestamp || 0));

  sites.forEach(site => {
    const btn = document.createElement('button');
    const title = site.title || 'Untitled';
    const screenshot = `https://api.microlink.io/?url=${encodeURIComponent(site.url)}&screenshot=true&meta=false&embed=screenshot.url&viewport.width=800&viewport.height=600`;

    btn.className = `project-card w-full text-left p-2 rounded-lg mb-1 flex items-center gap-3 border border-transparent select-none group`;

    btn.innerHTML = `
      <div class="w-8 h-8 rounded bg-surface border border-border overflow-hidden shrink-0 relative">
        <img src="${screenshot}" 
             class="screenshot-img w-full h-full object-cover" 
             loading="lazy" 
             onload="this.classList.add('loaded')"
             onerror="this.style.display='none'">
        <div class="absolute inset-0 flex items-center justify-center bg-surface -z-10">
          <i class="fa-solid fa-cube text-[10px] text-muted"></i>
        </div>
      </div>
      <div class="min-w-0 flex-1">
        <div class="text-sm font-medium truncate leading-tight group-hover:text-white">${title}</div>
        <div class="text-[10px] text-muted truncate mt-0.5 group-hover:text-gray-300">Project</div>
      </div>
    `;

    btn.onclick = () => loadProject(site.url, btn);
    projectList.appendChild(btn);
  });
});

// Search
searchInput.oninput = (e) => {
  const q = e.target.value.toLowerCase();
  projectList.querySelectorAll('button').forEach(btn => {
    btn.style.display = btn.innerText.toLowerCase().includes(q) ? 'flex' : 'none';
  });
};
</script>

</body>
</html>
