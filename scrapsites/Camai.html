<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Camera Text Scanner</title>
<style>
  :root {
    --bg: #050509;
    --card-bg: #101118;
    --card-elevated: #151623;
    --accent: #4f9cff;
    --accent-soft: rgba(79, 156, 255, 0.14);
    --border-subtle: rgba(255, 255, 255, 0.06);
    --text-main: #f9fafb;
    --text-muted: #9ca3af;
    --radius-lg: 16px;
    --radius-md: 10px;
    --shadow-soft: 0 18px 45px rgba(0, 0, 0, 0.7);
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(circle at top, #171821 0, #050509 55%, #020308 100%);
    color: var(--text-main);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 1rem 0.75rem 2rem;
  }

  h1 {
    margin: 0.35rem 0 0.25rem;
    font-size: 1.25rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    text-align: center;
  }

  .subtitle {
    margin: 0 0 1.1rem;
    font-size: 0.9rem;
    color: var(--text-muted);
    text-align: center;
  }

  #app {
    width: 100%;
    max-width: 480px;
    background: linear-gradient(145deg, var(--card-bg), var(--card-elevated));
    border-radius: var(--radius-lg);
    border: 1px solid var(--border-subtle);
    box-shadow: var(--shadow-soft);
    padding: 0.9rem 0.9rem 1rem;
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
  }

  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.5rem;
    font-size: 0.78rem;
    color: var(--text-muted);
  }

  .pill {
    padding: 0.08rem 0.5rem;
    border-radius: 999px;
    background: var(--accent-soft);
    color: var(--accent);
    font-weight: 500;
    font-size: 0.74rem;
  }

  .status {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
  }

  .status-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #22c55e;
  }

  #video {
    width: 100%;
    border-radius: var(--radius-md);
    border: 1px solid var(--border-subtle);
    background: #020308;
    aspect-ratio: 4 / 3;
    object-fit: cover;
  }

  .controls {
    display: flex;
    gap: 0.6rem;
    flex-wrap: wrap;
  }

  .btn {
    flex: 1 1 auto;
    min-width: 0;
    border-radius: 999px;
    font-size: 0.95rem;
    padding: 0.7rem 1rem;
    cursor: pointer;
    border: 1px solid transparent;
    transition: background 0.18s ease, color 0.18s ease, border-color 0.18s ease, transform 0.12s ease;
    font-weight: 500;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.45rem;
    touch-action: manipulation;
  }

  .btn-primary {
    background: var(--accent);
    color: #020617;
  }

  .btn-primary:hover {
    background: #3b82f6;
    transform: translateY(-1px);
  }

  .btn-primary:active {
    transform: translateY(0);
  }

  .btn-ghost {
    background: transparent;
    border-color: var(--border-subtle);
    color: var(--text-main);
  }

  .btn-ghost:hover {
    background: rgba(255, 255, 255, 0.02);
  }

  .btn:disabled {
    opacity: 0.6;
    cursor: default;
    transform: none;
  }

  .btn-icon {
    font-size: 1rem;
    line-height: 1;
  }

  #captured-container {
    display: none;
    border-radius: var(--radius-md);
    border: 1px solid var(--border-subtle);
    padding: 0.45rem;
    background: #050712;
  }

  #captured {
    width: 100%;
    border-radius: calc(var(--radius-md) - 4px);
    display: block;
  }

  .result-panel {
    margin-top: 0.1rem;
    border-radius: var(--radius-md);
    background: #050712;
    border: 1px solid var(--border-subtle);
    padding: 0.7rem 0.75rem;
  }

  .result-label {
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-muted);
    margin-bottom: 0.25rem;
  }

  #ocr-result {
    margin: 0;
    font-size: 0.9rem;
    line-height: 1.4;
    white-space: pre-wrap;
    max-height: 200px;
    overflow-y: auto;
  }

  .placeholder {
    color: var(--text-muted);
    font-style: italic;
  }

  #loader {
    display: none;
    margin-top: 0.35rem;
    font-size: 0.85rem;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .spinner {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    border: 2px solid rgba(148, 163, 184, 0.3);
    border-top-color: var(--accent);
    animation: spin 0.6s linear infinite;
  }

  @keyframes spin {
    to {
      transform: rotate(360deg);
    }
  }

  /* Slightly enhance layout on larger screens */
  @media (min-width: 640px) {
    body {
      padding-top: 2rem;
    }
    h1 {
      font-size: 1.45rem;
    }
    #app {
      padding: 1.1rem 1.2rem 1.2rem;
      gap: 0.9rem;
    }
  }
</style>
</head>
<body>

<h1>Camera Text Scanner</h1>
<p class="subtitle">Point your camera, capture a frame, and turn it into selectable text.</p>

<div id="app">
  <div class="section-header">
    <span class="pill">Live camera</span>
    <span class="status">
      <span class="status-dot"></span>
      <span>Ready</span>
    </span>
  </div>

  <video id="video" autoplay playsinline></video>

  <div class="controls">
    <button id="captureBtn" class="btn btn-primary">
      <span class="btn-icon">●</span>
      <span>Capture</span>
    </button>

    <button id="ocrBtn" class="btn btn-ghost" style="display:none;">
      <span class="btn-icon">⇢</span>
      <span>Extract text</span>
    </button>
  </div>

  <div id="captured-container">
    <img id="captured" alt="Captured frame preview" />
  </div>

  <div class="result-panel">
    <div class="result-label">Recognized text</div>
    <pre id="ocr-result" class="placeholder">No text extracted yet.</pre>
  </div>

  <div id="loader">
    <div class="spinner"></div>
    <span>click capture…</span>
  </div>
</div>

<script src="https://js.puter.com/v2/"></script>

<script>
  const video = document.getElementById('video');
  const captureBtn = document.getElementById('captureBtn');
  const capturedContainer = document.getElementById('captured-container');
  const capturedImg = document.getElementById('captured');
  const ocrBtn = document.getElementById('ocrBtn');
  const ocrResult = document.getElementById('ocr-result');
  const loader = document.getElementById('loader');

  async function startCamera() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'environment' }
      });
      video.srcObject = stream;
    } catch (err) {
      alert("Camera error: " + err.message);
    }
  }

  function capturePhoto() {
    const canvas = document.createElement('canvas');
    canvas.width = video.videoWidth || 640;
    canvas.height = video.videoHeight || 480;

    const ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

    const dataURL = canvas.toDataURL('image/png');
    capturedImg.src = dataURL;

    capturedContainer.style.display = 'block';
    ocrBtn.style.display = 'inline-flex';
    ocrResult.textContent = 'Click extract text.';
    ocrResult.classList.remove('placeholder');
  }

  async function extractText() {
    if (!capturedImg.src) return;

    loader.style.display = 'flex';
    ocrResult.textContent = '';
    ocrBtn.disabled = true;

    try {
      const text = await puter.ai.img2txt(capturedImg.src);
      ocrResult.textContent = text || '(No text found)';
      ocrResult.classList.remove('placeholder');
    } catch (err) {
      ocrResult.textContent = 'Error: ' + err.message;
      ocrResult.classList.remove('placeholder');
    }

    loader.style.display = 'none';
    ocrBtn.disabled = false;
  }

  captureBtn.addEventListener('click', capturePhoto);
  ocrBtn.addEventListener('click', extractText);

  startCamera();
</script>

</body>
</html>
