<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CollabSlides // Swiss Pro</title>
<!-- Inter Tight Font -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;600;800&display=swap" rel="stylesheet">

<style>
/* 
    SWISS MINIMALISM THEME
*/
:root {
    --bg-color: #ffffff;
    --text-color: #000000;
    --border-color: #000000;
    --accent-color: #ff3300; /* International Orange */
    --grid-line: 2px solid var(--border-color);
    --thin-line: 1px solid var(--border-color);
    --font-main: 'Inter Tight', sans-serif;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

body {
    margin: 0;
    background: var(--bg-color);
    color: var(--text-color);
    font-family: var(--font-main);
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
}

/* --- HEADER --- */
header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: var(--grid-line);
    background: var(--bg-color);
    flex-shrink: 0;
    z-index: 10;
}

.brand-section {
    padding: 16px 20px;
    border-right: var(--grid-line);
    font-weight: 800;
    font-size: 14px;
    letter-spacing: 0.05em;
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 180px;
}

.status-indicator {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    font-weight: 600;
    color: #666;
}

.status-dot { width: 8px; height: 8px; background: red; border-radius: 50%; }
.status-dot.connected { background: #00cc00; }

.controls-section {
    display: flex;
    overflow-x: auto;
    scrollbar-width: none;
}

header button {
    border: none;
    background: transparent;
    color: var(--text-color);
    padding: 16px 20px;
    cursor: pointer;
    font-family: var(--font-main);
    font-weight: 600;
    font-size: 12px;
    text-transform: uppercase;
    border-left: var(--thin-line);
    white-space: nowrap;
}

header button:hover { background: var(--text-color); color: var(--bg-color); }

/* --- TOOLBAR --- */
#toolbar {
    display: flex;
    background: var(--bg-color);
    border-bottom: var(--grid-line);
    overflow-x: auto;
    flex-shrink: 0;
}

#toolbar button, #toolbar select {
    border: none;
    border-right: var(--thin-line);
    background: transparent;
    padding: 12px 16px;
    font-family: var(--font-main);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    height: 44px;
    border-radius: 0;
}

/* --- EDITOR --- */
#editor {
    flex: 1;
    padding: 40px;
    overflow-y: auto;
    outline: none;
    font-size: 18px;
    line-height: 1.6;
    max-width: 900px;
    margin: 0 auto;
    width: 100%;
}

/* --- SIDE PANES --- */
.side-pane {
    position: fixed;
    top: 0; right: -100%;
    width: 320px;
    height: 100%;
    background: var(--bg-color);
    border-left: 2px solid black;
    transition: right 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    z-index: 100;
    display: flex;
    flex-direction: column;
    box-shadow: -10px 0 30px rgba(0,0,0,0.1);
}

.side-pane.active { right: 0; }

.pane-header {
    padding: 20px;
    border-bottom: var(--grid-line);
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--accent-color);
    color: white;
}

.pane-content { padding: 20px; overflow-y: auto; flex: 1; }

video {
    width: 100%;
    aspect-ratio: 16/9;
    background: #000;
    border: var(--thin-line);
    margin-bottom: 10px;
    object-fit: cover;
}

.call-controls { display: flex; gap: 10px; margin-top: 20px; }
.call-controls button {
    flex: 1; padding: 15px; border: 1px solid black; background: white;
    font-weight: 800; text-transform: uppercase; cursor: pointer;
}
.call-controls button:hover { background: black; color: white; }
#hangBtn { color: red; border-color: red; }
#hangBtn:hover { background: red; color: white; }

/* --- INCOMING CALL NOTIFICATION --- */
#callNotification {
    position: fixed;
    top: 20px; left: 50%; transform: translateX(-50%);
    background: black; color: white;
    padding: 15px 25px;
    border-radius: 0;
    z-index: 2000;
    display: none;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    text-align: center;
    width: 90%;
    max-width: 400px;
}
#callNotification.show { display: block; }
.notify-btns { display: flex; gap: 10px; margin-top: 10px; }
.notify-btns button {
    flex: 1; padding: 10px; border: 1px solid white; background: transparent; color: white;
    font-weight: 700; cursor: pointer; text-transform: uppercase;
}
.notify-btns button.accept { background: var(--accent-color); border-color: var(--accent-color); }

/* --- RESPONSIVE --- */
@media (max-width: 768px) {
    .brand-section { width: 100%; border-right: none; border-bottom: var(--thin-line); }
    .controls-section { width: 100%; overflow-x: auto; }
    header { flex-wrap: wrap; }
    .side-pane { width: 100%; border-left: none; }
}
</style>
</head>
<body>

<header>
    <div class="brand-section">
        <span>COLLAB // SWISS</span>
        <div class="status-indicator">
            <span id="statusDot" class="status-dot"></span>
            <span id="statusText">OFFLINE</span>
        </div>
    </div>
    <div class="controls-section">
        <button id="createRoom">Create</button>
        <button id="joinRoom">Join</button>
        <button id="copyRoomId">Copy ID</button>
        <button id="toggleCallPane" style="background:black; color:white;">Video Call</button>
    </div>
</header>

<div id="toolbar">
    <button onclick="document.execCommand('bold')">B</button>
    <button onclick="document.execCommand('italic')">I</button>
    <button onclick="document.execCommand('underline')">U</button>
    <button onclick="document.execCommand('insertUnorderedList')">List</button>
    <button id="insertTable">Table</button>
    <button id="insertLink">Link</button>
    <button onclick="document.execCommand('hiliteColor',false,'#ffee00')">Highlighter</button>
</div>

<div id="editor" contenteditable="true" spellcheck="false">
    <p><b>Swiss Design. Minimalist Collaboration.</b></p>
    <p>1. Create a Room.<br>2. Share the ID.<br>3. Edit together or start a Video Call.</p>
</div>

<!-- Video Call Overlay -->
<div id="callPane" class="side-pane">
    <div class="pane-header">
        <h3>Video Conference</h3>
        <button onclick="document.getElementById('callPane').classList.remove('active')" style="background:none;border:none;color:white;font-size:20px;">×</button>
    </div>
    <div class="pane-content">
        <label style="font-size:11px; font-weight:800; text-transform:uppercase; display:block; margin-bottom:5px;">Self</label>
        <video id="myVideo" autoplay muted playsinline></video>
        
        <label style="font-size:11px; font-weight:800; text-transform:uppercase; display:block; margin-bottom:5px; margin-top:15px;">Remote</label>
        <video id="peerVideo" autoplay playsinline></video>
        
        <div class="call-controls">
            <button id="callBtn">Call Partner</button>
            <button id="hangBtn">Hang Up</button>
        </div>
        <div id="callStatus" style="font-size:12px; margin-top:10px; color:#666; text-align:center;">Ready to connect</div>
    </div>
</div>

<!-- Incoming Call Notification -->
<div id="callNotification">
    <div style="font-weight:800; text-transform:uppercase; margin-bottom:5px;">Incoming Call</div>
    <div style="font-size:13px; margin-bottom:10px;">A partner is requesting video...</div>
    <div class="notify-btns">
        <button class="accept" id="acceptCallBtn">Accept</button>
        <button id="declineCallBtn">Decline</button>
    </div>
</div>

<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

<script>
// --- UTILS ---
const randomCode = () => `SWISS-${Math.floor(Math.random()*9000+1000)}`;

// --- ELEMENTS ---
const editor = document.getElementById("editor");
const statusText = document.getElementById("statusText");
const statusDot = document.getElementById("statusDot");
const callPane = document.getElementById("callPane");
const callStatus = document.getElementById("callStatus");
const notification = document.getElementById("callNotification");

// --- STATE ---
let peer, conn;
let myStream, callObj;
let remotePeerId = null; // Store the ID of the connected partner

function updateStatus(connected, msg) {
    statusText.textContent = msg || (connected ? "CONNECTED" : "OFFLINE");
    statusDot.className = "status-dot " + (connected ? "connected" : "");
}

// --- PEERJS LOGIC ---
function initPeerListeners() {
    if (!peer) return;

    // 1. DATA CONNECTION (Text Sync)
    peer.on("connection", c => {
        conn = c;
        // IF I am the host, I save the Joiner's ID here
        remotePeerId = c.peer; 
        updateStatus(true, "PARTNER JOINED");
        
        conn.on("data", d => {
            if(document.activeElement !== editor) editor.innerHTML = d;
        });
        conn.on("close", () => {
            updateStatus(false, "PARTNER LEFT");
            remotePeerId = null;
        });
        conn.on("error", () => updateStatus(false, "ERROR"));
    });

    // 2. INCOMING CALL HANDLING
    peer.on("call", incoming => {
        // Show custom notification
        notification.classList.add("show");
        
        // Handle Accept
        document.getElementById("acceptCallBtn").onclick = () => {
            notification.classList.remove("show");
            callPane.classList.add("active"); // Open pane
            
            initCamera().then(() => {
                incoming.answer(myStream); // Answer with my stream
                callObj = incoming;
                setupCallEvents(callObj);
            }).catch(e => alert("Camera permission is required to answer."));
        };
        
        // Handle Decline
        document.getElementById("declineCallBtn").onclick = () => {
            notification.classList.remove("show");
            incoming.close();
            callStatus.textContent = "Call declined";
        };
    });
}

function setupCallEvents(call) {
    call.on("stream", s => {
        document.getElementById("peerVideo").srcObject = s;
        callStatus.textContent = "Video Connected";
    });
    call.on("close", () => {
        document.getElementById("peerVideo").srcObject = null;
        callStatus.textContent = "Call Ended";
    });
    call.on("error", e => {
        callStatus.textContent = "Call Error";
        console.error(e);
    });
}

// --- ROOM LOGIC ---
document.getElementById("createRoom").onclick = () => {
    const code = randomCode();
    peer = new Peer(code);
    peer.on("open", id => {
        alert(`ROOM CREATED: ${id}\n\nCopy this ID and send it to your partner.`);
        updateStatus(true, `HOST: ${id}`);
        initPeerListeners();
    });
    peer.on("error", e => alert("Error: " + e.type));
};

document.getElementById("joinRoom").onclick = () => {
    const code = prompt("Enter Host Room ID:");
    if(!code) return;
    
    // Joiner needs a random ID
    peer = new Peer(); 
    peer.on("open", () => {
        conn = peer.connect(code);
        
        conn.on("open", () => {
            remotePeerId = code; // IF I am Joiner, I save Host ID
            updateStatus(true, "CONNECTED TO HOST");
            alert("Connected! You can now edit and call.");
        });
        
        conn.on("data", d => {
            if(document.activeElement !== editor) editor.innerHTML = d;
        });
        
        initPeerListeners(); // Prepare to receive data/calls back
    });
};

document.getElementById("copyRoomId").onclick = () => {
    const txt = statusText.textContent.replace("HOST: ", "").replace("CONNECTED TO: ", "");
    if(navigator.clipboard) {
        navigator.clipboard.writeText(txt).then(() => alert("Copied ID: " + txt));
    }
};

// --- SYNC ---
editor.addEventListener("input", () => {
    if (conn && conn.open) conn.send(editor.innerHTML);
});

// --- CAMERA & CALLING ---
async function initCamera(){
    if(myStream) return;
    try {
        myStream = await navigator.mediaDevices.getUserMedia({video: true, audio: true});
        document.getElementById("myVideo").srcObject = myStream;
        document.getElementById("myVideo").muted = true; // Mute self
    } catch(e) {
        alert("Could not access camera/mic. Please check permissions.");
        throw e;
    }
}

function stopCamera(){
    if(myStream){
        myStream.getTracks().forEach(t => t.stop());
        myStream = null;
        document.getElementById("myVideo").srcObject = null;
    }
}

// --- UI BUTTONS ---
document.getElementById("toggleCallPane").onclick = () => {
    callPane.classList.toggle("active");
    if(callPane.classList.contains("active")) initCamera();
};

document.getElementById("callBtn").onclick = () => {
    if(!peer || !remotePeerId) {
        return alert("You are not connected to a partner yet. Create or Join a room first.");
    }
    
    // Ensure camera is on before calling
    initCamera().then(() => {
        callStatus.textContent = "Calling partner...";
        callObj = peer.call(remotePeerId, myStream);
        setupCallEvents(callObj);
    });
};

document.getElementById("hangBtn").onclick = () => {
    if(callObj) {
        callObj.close();
        callObj = null;
    }
    document.getElementById("peerVideo").srcObject = null;
    callStatus.textContent = "Call Ended";
};

// --- TOOLBAR ---
document.getElementById("insertTable").onclick = () => {
    const html = `<table style="width:100%;border-collapse:collapse;border:1px solid #000;margin:10px 0;">
        <tr><td style="border:1px solid #000;padding:8px;">Header</td><td style="border:1px solid #000;padding:8px;">Header</td></tr>
        <tr><td style="border:1px solid #000;padding:8px;">Data</td><td style="border:1px solid #000;padding:8px;">Data</td></tr>
    </table>`;
    document.execCommand("insertHTML", false, html);
};
document.getElementById("insertLink").onclick = () => {
    const url = prompt("URL:");
    if(url) document.execCommand("createLink", false, url);
};

</script>
</body>
</html>
