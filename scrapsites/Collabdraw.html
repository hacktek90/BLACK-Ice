<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>CollabBoard Pro Ultra</title>
<script src="https://unpkg.com/@phosphor-icons/web"></script>
<style>
    :root {
        --bg: #f8f9fa;
        --surface: #ffffff;
        --border: #e2e8f0;
        --primary: #3b82f6;
        --primary-soft: #eff6ff;
        --text: #1e293b;
        --shadow: 0 4px 12px rgba(0,0,0,0.08);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
    
    body { 
        margin: 0; height: 100vh; overflow: hidden; 
        font-family: 'Inter', system-ui, sans-serif;
        background: var(--bg); color: var(--text);
        display: flex; flex-direction: column;
    }

    /* --- Overlay --- */
    .overlay {
        position: fixed; inset: 0; z-index: 100; background: rgba(255,255,255,0.9);
        backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center;
    }
    .card {
        background: var(--surface); padding: 2rem; border-radius: 16px;
        box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); width: 340px; text-align: center;
        border: 1px solid var(--border);
    }
    .card h1 { margin: 0 0 0.5rem 0; font-size: 1.5rem; letter-spacing: -0.02em; }
    .card input {
        width: 100%; padding: 0.8rem; border: 1px solid var(--border); border-radius: 8px;
        margin-bottom: 1rem; font-size: 1rem; transition: 0.2s;
    }
    .card input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
    .btn {
        width: 100%; padding: 0.8rem; border: none; border-radius: 8px; font-weight: 600;
        cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 0.5rem;
        margin-bottom: 0.5rem;
    }
    .btn-primary { background: var(--primary); color: white; }

    /* --- Main UI --- */
    #app { flex: 1; position: relative; display: none; }
    #app.active { display: flex; }

    #canvasWrap { flex: 1; position: relative; cursor: crosshair; overflow: hidden; background: var(--bg); }
    #canvasWrap::before {
        content: ''; position: absolute; inset: 0; pointer-events: none; opacity: 0.4;
        background-image: radial-gradient(#cbd5e1 1.5px, transparent 1.5px);
        background-size: 24px 24px;
    }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }

    /* Room Info Badge */
    .room-badge {
        position: absolute; top: 1rem; left: 1rem; z-index: 20;
        background: var(--surface); padding: 0.5rem 0.8rem; border-radius: 8px;
        box-shadow: var(--shadow); border: 1px solid var(--border);
        font-size: 0.85rem; font-weight: 600; color: var(--text);
        display: flex; align-items: center; gap: 0.5rem; cursor: pointer;
        transition: transform 0.2s;
    }
    .room-badge:active { transform: scale(0.96); }

    /* Top Toolbar */
    .toolbar-island {
        position: absolute; top: 1rem; left: 50%; transform: translateX(-50%);
        background: var(--surface); padding: 0.4rem; border-radius: 14px;
        box-shadow: var(--shadow); border: 1px solid var(--border);
        display: flex; align-items: center; gap: 0.25rem; z-index: 10;
    }
    .t-btn {
        width: 38px; height: 38px; border: none; background: transparent;
        border-radius: 8px; color: #64748b; font-size: 1.3rem;
        display: grid; place-items: center; cursor: pointer;
    }
    .t-btn:hover { background: #f1f5f9; color: var(--text); }
    .t-btn.active { background: var(--primary-soft); color: var(--primary); }
    .sep { width: 1px; height: 20px; background: var(--border); margin: 0 0.2rem; }

    /* Properties Bar */
    .props-bar {
        position: absolute; left: 1rem; top: 50%; transform: translateY(-50%);
        background: var(--surface); padding: 0.8rem 0.5rem; border-radius: 12px;
        box-shadow: var(--shadow); border: 1px solid var(--border);
        display: flex; flex-direction: column; gap: 1rem; z-index: 10; align-items: center;
    }
    .color-swatch {
        width: 28px; height: 28px; border-radius: 50%; border: 2px solid transparent;
        cursor: pointer; transition: transform 0.2s;
    }
    .color-swatch:hover { transform: scale(1.1); }
    .color-swatch.active { border-color: var(--text); }
    
    .fill-toggle {
        font-size: 1.2rem; color: #cbd5e1; cursor: pointer; transition: 0.2s;
        width: 32px; height: 32px; display: grid; place-items: center; border-radius: 6px;
    }
    .fill-toggle.active { color: var(--primary); background: var(--primary-soft); }

    input[type=range] {
        writing-mode: bt-lr; -webkit-appearance: slider-vertical; width: 8px; height: 80px;
        accent-color: var(--primary);
    }

    /* Actions */
    .actions {
        position: absolute; bottom: 1.5rem; left: 1.5rem; display: flex; gap: 0.5rem; z-index: 10;
    }
    .action-btn {
        width: 42px; height: 42px; border-radius: 50%; background: var(--surface);
        border: 1px solid var(--border); box-shadow: var(--shadow);
        display: grid; place-items: center; font-size: 1.2rem; cursor: pointer; transition: 0.2s;
    }
    .action-btn:hover { transform: translateY(-2px); }

    /* Sidebar */
    #sidebar {
        width: 320px; background: var(--surface); border-left: 1px solid var(--border);
        display: flex; flex-direction: column; z-index: 30; /* Increased Z-Index */
        position: absolute; right: 0; top: 0; bottom: 0;
        transform: translateX(100%); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow: -4px 0 20px rgba(0,0,0,0.1);
    }
    #sidebar.open { transform: translateX(0); }
    .chat-head { padding: 1rem; border-bottom: 1px solid var(--border); font-weight: 600; display: flex; justify-content: space-between; }
    #chatMsgs { flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: 0.6rem; }
    .msg { font-size: 0.9rem; padding: 0.5rem 0.8rem; background: #f1f5f9; border-radius: 0 12px 12px 12px; align-self: flex-start; max-width: 85%; word-break: break-word;}
    .msg.self { background: var(--primary); color: white; border-radius: 12px 0 12px 12px; align-self: flex-end; }
    .msg-meta { font-size: 0.7rem; margin-bottom: 2px; opacity: 0.7; font-weight: 600; }

    /* Cursors */
    .cursor { position: absolute; pointer-events: none; z-index: 5; transition: transform 0.1s linear; }
    
    @media (max-width: 768px) {
        .props-bar { bottom: 1rem; left: 50%; top: auto; transform: translateX(-50%); flex-direction: row; width: max-content; height: auto; }
        input[type=range] { -webkit-appearance: slider-horizontal; width: 80px; height: 8px; }
        .actions { bottom: 5rem; }
        .toolbar-island { width: 95%; overflow-x: auto; justify-content: flex-start; }
        #sidebar { width: 100%; }
        .room-badge { top: 4.5rem; }
    }
</style>
</head>
<body>

    <!-- Login -->
    <div id="login" class="overlay">
        <div class="card">
            <h1>CollabBoard</h1>
            <p style="color:#64748b; margin-bottom:1.5rem">Enter Room ID to Join/Host</p>
            <input id="uName" placeholder="Your Name" />
            <input id="rName" placeholder="Room ID (e.g. team-1)" />
            <button id="btnGo" class="btn btn-primary"><i class="ph ph-arrow-right"></i> Enter Room</button>
        </div>
    </div>

    <!-- App -->
    <div id="app">
        <div id="roomInfo" class="room-badge" title="Click to Copy Code">
            <i class="ph ph-hash"></i> <span id="roomCodeTxt">...</span>
        </div>

        <div id="canvasWrap">
            <!-- Toolbar -->
            <div class="toolbar-island">
                <button class="t-btn" data-tool="select" title="Select / Move (V)"><i class="ph ph-cursor"></i></button>
                <div class="sep"></div>
                <button class="t-btn active" data-tool="pen" title="Pen (P)"><i class="ph ph-pencil-simple"></i></button>
                <button class="t-btn" data-tool="highlight" title="Highlighter"><i class="ph ph-highlighter"></i></button>
                <button class="t-btn" data-tool="eraser" title="Eraser"><i class="ph ph-eraser"></i></button>
                <div class="sep"></div>
                <button class="t-btn" data-tool="arrow" title="Arrow"><i class="ph ph-arrow-up-right"></i></button>
                <button class="t-btn" data-tool="rect" title="Rectangle"><i class="ph ph-square"></i></button>
                <button class="t-btn" data-tool="ellipse" title="Circle"><i class="ph ph-circle"></i></button>
                <button class="t-btn" data-tool="text" title="Text"><i class="ph ph-text-t"></i></button>
                <button class="t-btn" id="btnImg" title="Upload Image"><i class="ph ph-image"></i></button>
                <input type="file" id="fileInput" accept="image/*" hidden />
            </div>

            <!-- Properties -->
            <div class="props-bar">
                <div class="color-swatch active" style="background:#1e293b" data-col="#1e293b"></div>
                <div class="color-swatch" style="background:#ef4444" data-col="#ef4444"></div>
                <div class="color-swatch" style="background:#3b82f6" data-col="#3b82f6"></div>
                <div class="color-swatch" style="background:#10b981" data-col="#10b981"></div>
                <div style="height:1px; width:100%; background:var(--border)"></div>
                <button id="btnFill" class="fill-toggle" title="Fill Shape"><i class="ph ph-paint-bucket"></i></button>
                <div style="height:1px; width:100%; background:var(--border)"></div>
                <input type="range" id="sizeSlider" min="1" max="50" value="3" title="Stroke Size">
            </div>

            <!-- Actions -->
            <div class="actions">
                <button class="action-btn" id="undo" title="Undo"><i class="ph ph-arrow-u-up-left"></i></button>
                <button class="action-btn" id="redo" title="Redo"><i class="ph ph-arrow-u-up-right"></i></button>
                <button class="action-btn" id="chatToggle" title="Chat"><i class="ph ph-chat-circle"></i></button>
                <button class="action-btn" id="save" title="Save PNG"><i class="ph ph-camera"></i></button>
            </div>

            <canvas id="c"></canvas>
        </div>

        <!-- Sidebar -->
        <aside id="sidebar">
            <div class="chat-head">
                <span>Team Chat</span>
                <button class="t-btn" id="closeSide" style="width:24px; height:24px"><i class="ph ph-x"></i></button>
            </div>
            <div id="chatMsgs"></div>
            <form id="chatForm">
                <input id="chatIn" placeholder="Message..." style="flex:1; padding:0.5rem; border-radius:6px; border:1px solid var(--border)">
                <button class="btn-primary" style="padding:0 0.8rem; border-radius:6px; border:none"><i class="ph ph-paper-plane-right"></i></button>
            </form>
        </aside>
    </div>

<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<script>
(() => {
    // --- Config & Utils ---
    const el = id => document.getElementById(id);
    const uid = () => Math.random().toString(36).slice(2);
    const state = {
        user: { name: 'Guest' },
        room: '',
        tool: 'pen',
        color: '#1e293b',
        size: 3,
        fill: false,
        ops: [], undone: [],
        selection: null,
        view: { x:0, y:0, z:1 },
        peers: new Map()
    };

    // --- Canvas ---
    const canvas = el('c');
    const ctx = canvas.getContext('2d');

    function resize() {
        const r = el('canvasWrap').getBoundingClientRect();
        canvas.width = r.width * window.devicePixelRatio;
        canvas.height = r.height * window.devicePixelRatio;
        requestAnimationFrame(render);
    }
    window.addEventListener('resize', resize);

    function render() {
        ctx.setTransform(1,0,0,1,0,0);
        ctx.clearRect(0,0,canvas.width,canvas.height);
        ctx.setTransform(window.devicePixelRatio, 0, 0, window.devicePixelRatio, 0, 0);
        ctx.translate(state.view.x, state.view.y);
        ctx.scale(state.view.z, state.view.z);

        [...state.ops, activeOp].forEach(op => {
            if(!op) return;
            ctx.save();
            ctx.lineCap = 'round'; ctx.lineJoin = 'round';
            
            const isFilled = op.filled;
            if (op.tool === 'highlight') {
                ctx.globalAlpha = 0.4; ctx.strokeStyle = op.color; ctx.lineWidth = op.size * 2;
            } else {
                ctx.strokeStyle = op.color; ctx.lineWidth = op.size; ctx.fillStyle = op.color;
            }
            if (op.tool === 'eraser') {
                ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = op.size * 2;
            }

            if (op.type === 'stroke') {
                ctx.beginPath();
                op.pts.forEach((p, i) => i===0 ? ctx.moveTo(p.x,p.y) : ctx.lineTo(p.x,p.y));
                ctx.stroke();
            } else if (op.type === 'shape') {
                ctx.beginPath();
                const {x,y,w,h} = op;
                if (op.tool === 'rect') {
                    ctx.rect(x, y, w, h);
                    if(isFilled) { ctx.globalAlpha=0.2; ctx.fill(); ctx.globalAlpha=1.0; }
                    ctx.stroke();
                } else if (op.tool === 'ellipse') {
                    ctx.ellipse(x+w/2, y+h/2, Math.abs(w/2), Math.abs(h/2), 0, 0, Math.PI*2);
                    if(isFilled) { ctx.globalAlpha=0.2; ctx.fill(); ctx.globalAlpha=1.0; }
                    ctx.stroke();
                } else if (op.tool === 'line') {
                    ctx.moveTo(x,y); ctx.lineTo(x+w,y+h); ctx.stroke();
                } else if (op.tool === 'arrow') drawArrow(ctx, x, y, x+w, y+h);
            } else if (op.type === 'text') {
                ctx.font = `${op.size * 5}px sans-serif`; ctx.fillText(op.text, op.x, op.y);
            } else if (op.type === 'image' && imgCache[op.src]) {
                ctx.drawImage(imgCache[op.src], op.x, op.y, op.w, op.h);
            }
            ctx.restore();
        });
        
        if (state.selection) {
            const op = state.ops.find(o => o.id === state.selection);
            if(op) drawBounds(op);
        }
    }

    function drawArrow(c, x1, y1, x2, y2) {
        const a = Math.atan2(y2-y1, x2-x1), h=15;
        c.moveTo(x1, y1); c.lineTo(x2, y2); c.stroke();
        c.beginPath();
        c.moveTo(x2, y2);
        c.lineTo(x2-h*Math.cos(a-0.5), y2-h*Math.sin(a-0.5));
        c.lineTo(x2-h*Math.cos(a+0.5), y2-h*Math.sin(a+0.5));
        c.fill();
    }

    function drawBounds(op) {
        ctx.save(); ctx.strokeStyle = '#3b82f6'; ctx.setLineDash([5,5]); ctx.lineWidth = 1/state.view.z;
        const b = getBounds(op);
        ctx.strokeRect(b.x-5, b.y-5, b.w+10, b.h+10);
        ctx.restore();
    }

    function getBounds(op) {
        if (op.type === 'shape' || op.type === 'image') return { x:op.w<0?op.x+op.w:op.x, y:op.h<0?op.y+op.h:op.y, w:Math.abs(op.w), h:Math.abs(op.h) };
        if (op.type === 'stroke') {
            const xs = op.pts.map(p=>p.x), ys = op.pts.map(p=>p.y);
            return { x:Math.min(...xs), y:Math.min(...ys), w:Math.max(...xs)-Math.min(...xs), h:Math.max(...ys)-Math.min(...ys) };
        }
        return { x:op.x, y:op.y-20, w:100, h:25 };
    }

    // --- Interaction ---
    let activeOp = null, drag = null, mode = 'idle', imgCache = {};
    const toWorld = (x,y) => ({ x:(x-state.view.x)/state.view.z, y:(y-state.view.y)/state.view.z });

    canvas.addEventListener('pointerdown', e => {
        const pt = toWorld(e.offsetX, e.offsetY);
        drag = { x:e.offsetX, y:e.offsetY, wx:pt.x, wy:pt.y };

        if (e.button === 1 || keys['Space']) { mode = 'pan'; return; }
        if (state.tool === 'select') {
            const op = state.ops.findLast(o => { const b=getBounds(o); return pt.x>=b.x && pt.x<=b.x+b.w && pt.y>=b.y && pt.y<=b.y+b.h; });
            state.selection = op ? op.id : null;
            mode = op ? 'move' : 'idle';
            render(); return;
        }

        mode = 'draw';
        const id = uid();
        const base = { id, color:state.color, size:state.size, tool:state.tool, filled:state.fill };
        
        if (['pen','eraser','highlight'].includes(state.tool)) activeOp = { ...base, type:'stroke', pts:[pt] };
        else if (state.tool === 'text') {
            const t = prompt('Text:'); if(t) pushOp({ ...base, type:'text', x:pt.x, y:pt.y, text:t });
        } else if (state.tool !== 'image') activeOp = { ...base, type:'shape', x:pt.x, y:pt.y, w:0, h:0 };
    });

    canvas.addEventListener('pointermove', e => {
        const pt = toWorld(e.offsetX, e.offsetY);
        if (mode === 'pan') {
            state.view.x += e.offsetX - drag.x; state.view.y += e.offsetY - drag.y;
            drag = { x:e.offsetX, y:e.offsetY }; render();
        } else if (mode === 'move' && state.selection) {
            const op = state.ops.find(o => o.id === state.selection);
            const dx = pt.x - drag.wx, dy = pt.y - drag.wy;
            if (op.type === 'stroke') op.pts.forEach(p => { p.x+=dx; p.y+=dy; });
            else { op.x+=dx; op.y+=dy; }
            drag.wx = pt.x; drag.wy = pt.y;
            broadcast({ kind:'upd', op }); render();
        } else if (mode === 'draw' && activeOp) {
            if (activeOp.type === 'stroke') activeOp.pts.push(pt);
            else { 
                activeOp.w = pt.x - activeOp.x; activeOp.h = pt.y - activeOp.y; 
                if (e.shiftKey && activeOp.type === 'shape') {
                   const d = Math.max(Math.abs(activeOp.w), Math.abs(activeOp.h));
                   activeOp.w = Math.sign(activeOp.w||1)*d; activeOp.h = Math.sign(activeOp.h||1)*d;
                }
            }
            render();
        }
        if (Math.random()<0.1) broadcast({ kind:'cur', x:pt.x, y:pt.y });
    });

    window.addEventListener('pointerup', () => {
        if (activeOp) { pushOp(activeOp); activeOp = null; }
        mode = 'idle';
    });

    canvas.addEventListener('wheel', e => {
        e.preventDefault();
        const s = Math.exp(e.deltaY * -0.001);
        const pt = toWorld(e.offsetX, e.offsetY);
        state.view.z *= s;
        state.view.x = e.offsetX - pt.x * state.view.z;
        state.view.y = e.offsetY - pt.y * state.view.z;
        render();
    }, { passive:false });

    // --- UI Interactions ---
    document.querySelectorAll('.t-btn[data-tool]').forEach(b => b.onclick = () => {
        document.querySelector('.t-btn.active').classList.remove('active');
        b.classList.add('active'); state.tool = b.dataset.tool;
    });
    document.querySelectorAll('.color-swatch').forEach(b => b.onclick = () => {
        document.querySelector('.color-swatch.active').classList.remove('active');
        b.classList.add('active'); state.color = b.dataset.col;
    });
    
    el('btnFill').onclick = () => { state.fill = !state.fill; el('btnFill').classList.toggle('active', state.fill); };
    el('sizeSlider').oninput = e => state.size = +e.target.value;
    el('undo').onclick = () => { if(state.ops.length) { state.undone.push(state.ops.pop()); broadcast({kind:'undo'}); render(); }};
    el('redo').onclick = () => { if(state.undone.length) { state.ops.push(state.undone.pop()); broadcast({kind:'op', op:state.ops.at(-1)}); render(); }};
    el('btnImg').onclick = () => el('fileInput').click();
    
    // --- CHAT Logic (Fixed) ---
    const toggleChat = () => el('sidebar').classList.toggle('open');
    el('chatToggle').onclick = toggleChat;
    el('closeSide').onclick = toggleChat;

    el('chatForm').onsubmit = e => {
        e.preventDefault();
        const txt = el('chatIn').value.trim();
        if(!txt) return;
        addMsg(state.user.name, txt, true);
        broadcast({ kind:'chat', name:state.user.name, txt });
        el('chatIn').value = '';
    };

    function addMsg(name, txt, self) {
        const d = document.createElement('div');
        d.className = `msg ${self ? 'self' : ''}`;
        d.innerHTML = `<div class="msg-meta">${name}</div>${txt}`;
        el('chatMsgs').appendChild(d);
        el('chatMsgs').scrollTop = el('chatMsgs').scrollHeight;
    }

    el('fileInput').onchange = e => {
        const f = e.target.files[0]; if(!f) return;
        const r = new FileReader();
        r.onload = v => {
            const img = new Image(); img.src = v.target.result;
            img.onload = () => {
                const id = uid(); imgCache[id] = img;
                pushOp({ id, type:'image', src:id, x:-state.view.x+50, y:-state.view.y+50, w:200, h:200*img.height/img.width, data:v.target.result });
            }
        }; r.readAsDataURL(f);
    };
    
    el('save').onclick = () => { const a=document.createElement('a'); a.download='board.png'; a.href=canvas.toDataURL(); a.click(); };
    el('roomInfo').onclick = () => { navigator.clipboard.writeText(state.room); alert('Room Code Copied!'); };
    
    const keys={}; window.onkeydown=e=>keys[e.code]=true; window.onkeyup=e=>keys[e.code]=false;

    // --- Network ---
    let peer;
    el('btnGo').onclick = () => {
        const r = el('rName').value || uid();
        state.room = r; state.user.name = el('uName').value || 'Guest';
        el('roomCodeTxt').textContent = r;
        el('login').style.display = 'none'; el('app').classList.add('active'); resize();
        
        peer = new Peer();
        peer.on('open', () => {
            const conn = peer.connect(r); 
            setupConn(conn);
            // Fallback if room doesn't exist (simple p2p mesh simulation)
            peer.on('connection', c => { setupConn(c); c.on('open', ()=>c.send({kind:'sync', ops:state.ops})); });
        });
        // Re-init with specific ID to try and "claim" room name as Host ID
        peer.destroy();
        peer = new Peer(r); 
        peer.on('error', () => { peer = new Peer(); peer.on('open', () => setupConn(peer.connect(r))); });
        peer.on('connection', c => { setupConn(c); c.on('open', ()=>c.send({kind:'sync', ops:state.ops})); });
    };

    function setupConn(c) {
        c.on('open', () => { state.peers.set(c.peer, c); });
        c.on('data', d => {
            if(d.kind==='op') pushOp(d.op, true);
            if(d.kind==='undo') { state.ops.pop(); render(); }
            if(d.kind==='upd') { const i = state.ops.findIndex(o=>o.id===d.op.id); if(i>=0) state.ops[i]=d.op; render(); }
            if(d.kind==='sync') { state.ops = d.ops; d.ops.forEach(o=>{ if(o.type==='image' && !imgCache[o.src]){ const i=new Image(); i.src=o.data; imgCache[o.src]=i; i.onload=render; } }); render(); }
            if(d.kind==='cur') drawCur(c.peer, d.x, d.y);
            if(d.kind==='chat') { addMsg(d.name, d.txt, false); if(!el('sidebar').classList.contains('open')) toggleChat(); }
        });
        c.on('close', () => { state.peers.delete(c.peer); el(`cur-${c.peer}`)?.remove(); });
    }

    function pushOp(op, remote=false) {
        state.ops.push(op);
        if(!remote) { broadcast({kind:'op', op}); state.undone=[]; }
        render();
    }
    function broadcast(msg) { for(let c of state.peers.values()) if(c.open) c.send(msg); }

    function drawCur(id, x, y) {
        let c = el(`cur-${id}`);
        if(!c) { c=document.createElement('div'); c.id=`cur-${id}`; c.className='cursor'; c.innerHTML=`<i class="ph-fill ph-cursor-click" style="color:#ef4444"></i>`; el('canvasWrap').appendChild(c); }
        const s = { x:x*state.view.z+state.view.x, y:y*state.view.z+state.view.y };
        c.style.transform = `translate(${s.x}px, ${s.y}px)`;
    }
})();
</script>
</body>
</html>
