<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Identity Scanner // Swiss Minimal</title>
    <meta name="theme-color" content="#F4F4F4">

    <!-- FONTS: Inter Tight for that Neo-Grotesque Swiss look -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Inter Tight"', 'sans-serif'],
                    },
                    colors: {
                        'swiss-red': '#FF3333', /* International Style Red */
                        'swiss-bg': '#F4F4F4',
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: var(--swiss-bg);
            color: #111;
        }
        
        /* Grid Guidelines (The soul of Swiss Design) */
        .grid-line {
            position: absolute;
            background-color: rgba(0,0,0,0.06);
            pointer-events: none;
            z-index: 0;
        }

        /* Interactive Elements */
        .action-link {
            position: relative;
            padding-bottom: 2px;
        }
        .action-link::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0%;
            height: 1px;
            background-color: #FF3333;
            transition: width 0.3s ease;
        }
        .action-link:hover::after {
            width: 100%;
        }

        .metric-value {
            font-variant-numeric: tabular-nums;
            letter-spacing: -0.02em;
        }
    </style>
</head>
<body class="min-h-screen w-screen overflow-x-hidden relative selection:bg-black selection:text-white flex flex-col">

    <!-- THE GRID (Visualized) -->
    <div class="hidden md:block grid-line top-0 bottom-0 left-[25%] w-px"></div>
    <div class="hidden md:block grid-line top-0 bottom-0 left-[50%] w-px"></div>
    <div class="hidden md:block grid-line top-0 bottom-0 left-[75%] w-px"></div>
    <div class="grid-line left-0 right-0 top-[120px] h-px"></div>
    <div class="grid-line left-0 right-0 bottom-[80px] h-px"></div>

    <!-- MAIN CONTENT -->
    <main class="relative z-10 w-full max-w-[1600px] mx-auto flex-grow flex flex-col md:grid md:grid-cols-4 md:grid-rows-[120px_1fr]">

        <!-- HEADER -->
        <header class="col-span-4 h-[120px] px-6 md:px-12 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <span class="w-3 h-3 bg-swiss-red rounded-full animate-pulse"></span>
                <h1 class="text-sm font-medium tracking-tight uppercase">Identity Scanner v2.0</h1>
            </div>
            <div class="hidden md:block text-[10px] uppercase tracking-widest text-gray-400 font-mono">
                System Ready // Awaiting Input
            </div>
        </header>

        <!-- COL 1: SPEED TEST -->
        <section class="col-span-4 md:col-span-2 px-6 md:px-12 py-12 md:py-16 border-b md:border-b-0 md:border-r border-black/5 flex flex-col justify-between">
            <div>
                <h2 class="text-xs font-semibold uppercase tracking-widest text-gray-400 mb-8">01 / Connection Speed</h2>
                
                <div class="flex items-baseline gap-1">
                    <span id="speed-value" class="metric-value text-[6rem] md:text-[8rem] leading-[0.9] font-medium -ml-1">0.0</span>
                    <span class="text-xl text-gray-400 font-normal">Mbps</span>
                </div>
                
                <!-- Progress Line -->
                <div class="w-full h-px bg-gray-200 mt-8 relative overflow-hidden">
                    <div id="gauge-fill" class="absolute top-0 left-0 h-full bg-swiss-red w-0 transition-all duration-300"></div>
                </div>
                
                <div id="net-type" class="mt-4 text-sm text-gray-500 font-mono">Net Type: Detecting...</div>
            </div>

            <button onclick="runSpeedTest()" id="speed-btn-text" class="group flex items-center gap-4 text-lg font-medium hover:text-swiss-red transition-colors mt-12 md:mt-0">
                <span class="w-8 h-px bg-black group-hover:bg-swiss-red transition-colors"></span>
                Run Speed Test
            </button>
        </section>

        <!-- COL 2: NETWORK & SYSTEM -->
        <section class="col-span-4 md:col-span-2 flex flex-col">
            
            <!-- ROW 1: NETWORK ID -->
            <div class="flex-grow px-6 md:px-12 py-12 border-b border-black/5">
                <h2 class="text-xs font-semibold uppercase tracking-widest text-gray-400 mb-6">02 / Network Identity</h2>
                
                <div class="space-y-2">
                    <div id="ip-text" class="metric-value text-4xl md:text-5xl font-medium tracking-tight break-all">?.?.?.?</div>
                    <div id="isp-text" class="text-sm text-gray-500">Provider: Unknown</div>
                </div>

                <div class="mt-8">
                    <button onclick="fullScan()" class="action-link text-sm font-medium">Initialize Full System Scan</button>
                </div>
            </div>

            <!-- ROW 2: DATA GRID -->
            <div class="flex-grow grid grid-cols-2">
                
                <!-- GPS -->
                <div class="p-6 md:p-12 border-r border-black/5">
                    <h2 class="text-xs font-semibold uppercase tracking-widest text-gray-400 mb-4">03 / Location</h2>
                    <div class="space-y-4">
                        <div>
                            <span class="block text-[10px] text-gray-400 uppercase">Latitude</span>
                            <span id="lat-text" class="text-xl font-medium">0.00</span>
                        </div>
                        <div>
                            <span class="block text-[10px] text-gray-400 uppercase">Longitude</span>
                            <span id="long-text" class="text-xl font-medium">0.00</span>
                        </div>
                        <a id="map-link" href="#" target="_blank" class="hidden text-xs text-swiss-red hover:underline mt-2">View Map &rarr;</a>
                    </div>
                </div>

                <!-- SPECS -->
                <div class="p-6 md:p-12">
                    <h2 class="text-xs font-semibold uppercase tracking-widest text-gray-400 mb-4">04 / Device</h2>
                    <div class="space-y-4">
                        <div>
                            <span class="block text-[10px] text-gray-400 uppercase">OS</span>
                            <span id="os-text" class="text-lg font-medium">-</span>
                        </div>
                        <div>
                            <span class="block text-[10px] text-gray-400 uppercase">Browser</span>
                            <span id="browser-text" class="text-lg font-medium">-</span>
                        </div>
                        <div>
                            <span class="block text-[10px] text-gray-400 uppercase">Display</span>
                            <span id="screen-text" class="text-lg font-medium">-</span>
                        </div>
                    </div>
                </div>

            </div>
        </section>

    </main>

    <!-- FOOTER -->
    <footer class="relative z-10 h-[80px] w-full max-w-[1600px] mx-auto px-6 md:px-12 flex items-center justify-between text-xs text-gray-400 border-t border-black/5">
        <div>&copy; 2025 Swiss Series</div>
        <div class="hidden md:block font-mono uppercase">Secure Connection</div>
    </footer>

<script>
    // --- 1. SPEED TEST LOGIC ---
    async function runSpeedTest() {
        const speedVal = document.getElementById('speed-value');
        const gauge = document.getElementById('gauge-fill');
        const btn = document.getElementById('speed-btn-text');
        const netType = document.getElementById('net-type');

        btn.disabled = true;
        btn.innerHTML = '<span class="w-8 h-px bg-gray-400"></span> Testing...';
        speedVal.innerText = "0.0";
        gauge.style.width = "0%";

        if (navigator.connection) {
            const type = navigator.connection.effectiveType || 'Unknown';
            const downlink = navigator.connection.downlink || '?';
            netType.innerText = `Net Type: ${type.toUpperCase()} (~${downlink} Mbps)`;
        }

        const startTime = new Date().getTime();
        const testUrl = "https://upload.wikimedia.org/wikipedia/commons/3/3d/LARGE_elevation.jpg?t=" + startTime;
        
        try {
            const response = await fetch(testUrl);
            const reader = response.body.getReader();
            const contentLength = +response.headers.get('Content-Length');
            let receivedLength = 0;

            while(true) {
                const {done, value} = await reader.read();
                if (done) break;
                receivedLength += value.length;
                if(contentLength) {
                    const pct = (receivedLength / contentLength) * 100;
                    gauge.style.width = pct + "%";
                }
            }

            const endTime = new Date().getTime();
            const duration = (endTime - startTime) / 1000;
            const bitsLoaded = receivedLength * 8;
            const speedBps = bitsLoaded / duration;
            const speedMbps = (speedBps / 1024 / 1024).toFixed(1); // One decimal for cleaner look
            
            speedVal.innerText = speedMbps;
            gauge.style.width = "100%";
            btn.innerHTML = '<span class="w-8 h-px bg-black group-hover:bg-swiss-red"></span> Test Again';
            btn.disabled = false;
        } catch (e) {
            speedVal.innerText = "Err";
            btn.innerHTML = 'Retry';
            btn.disabled = false;
        }
    }

    // --- 2. FULL SCAN LOGIC ---
    async function fullScan() {
        // IP & ISP
        try {
            const res = await fetch('https://ipapi.co/json/');
            const data = await res.json();
            document.getElementById('ip-text').innerText = data.ip || 'Unavailable';
            document.getElementById('isp-text').innerText = `Provider: ${data.org || 'Unknown'}`;
        } catch(e) {
            document.getElementById('ip-text').innerText = "Error";
        }

        // Device Info
        document.getElementById('os-text').innerText = getOS();
        document.getElementById('browser-text').innerText = getBrowser();
        document.getElementById('screen-text').innerText = `${window.screen.width} × ${window.screen.height}`;

        // GPS
        if("geolocation" in navigator) {
            navigator.geolocation.getCurrentPosition(pos => {
                const lat = pos.coords.latitude.toFixed(4);
                const long = pos.coords.longitude.toFixed(4);
                
                document.getElementById('lat-text').innerText = lat;
                document.getElementById('long-text').innerText = long;
                
                const map = document.getElementById('map-link');
                map.style.display = "inline-block";
                map.href = `https://www.google.com/maps?q=${lat},${long}`;
            }, err => {
                document.getElementById('lat-text').innerText = "Denied";
                document.getElementById('long-text').innerText = "Denied";
            });
        } else {
            document.getElementById('lat-text').innerText = "N/A";
        }
    }

    // Helpers
    function getOS() {
        if (navigator.userAgent.indexOf("Win")!=-1) return "Windows";
        if (navigator.userAgent.indexOf("Mac")!=-1) return "macOS";
        if (navigator.userAgent.indexOf("Linux")!=-1) return "Linux";
        if (navigator.userAgent.indexOf("Android")!=-1) return "Android";
        if (navigator.userAgent.indexOf("like Mac")!=-1) return "iOS";
        return "Unknown";
    }
    function getBrowser() {
        if (navigator.userAgent.indexOf("Chrome")!=-1) return "Chrome";
        if (navigator.userAgent.indexOf("Firefox")!=-1) return "Firefox";
        if (navigator.userAgent.indexOf("Safari")!=-1) return "Safari";
        return "Unknown";
    }
</script>

</body>
</html>
