<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Maps</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', sans-serif;
      height: 100vh;
      overflow: hidden;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }

    #map {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
    }

    /* Search Container */
    .search-container {
      position: absolute;
      top: max(env(safe-area-inset-top, 20px), 20px);
      left: 20px;
      right: 20px;
      z-index: 1000;
      display: flex;
      gap: 12px;
    }

    .search-bar {
      flex: 1;
      background: rgba(255, 255, 255, 0.25);
      backdrop-filter: saturate(200%) blur(30px);
      -webkit-backdrop-filter: saturate(200%) blur(30px);
      border: 1.5px solid rgba(255, 255, 255, 0.4);
      border-radius: 16px;
      padding: 14px 20px;
      font-size: 17px;
      outline: none;
      color: #000;
      box-shadow: 
        0 8px 32px rgba(31, 38, 135, 0.2),
        inset 0 1px 0 rgba(255, 255, 255, 0.6),
        inset 0 -1px 0 rgba(0, 0, 0, 0.05);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .search-bar:focus {
      background: rgba(255, 255, 255, 0.35);
      border-color: rgba(255, 255, 255, 0.6);
      box-shadow: 
        0 12px 40px rgba(31, 38, 135, 0.25),
        inset 0 1px 0 rgba(255, 255, 255, 0.7),
        0 0 0 4px rgba(255, 255, 255, 0.15);
    }

    .search-bar::placeholder {
      color: rgba(0, 0, 0, 0.5);
    }

    .glass-btn {
      width: 48px;
      height: 48px;
      background: rgba(255, 255, 255, 0.25);
      backdrop-filter: saturate(200%) blur(30px);
      -webkit-backdrop-filter: saturate(200%) blur(30px);
      border: 1.5px solid rgba(255, 255, 255, 0.4);
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 
        0 8px 32px rgba(31, 38, 135, 0.2),
        inset 0 1px 0 rgba(255, 255, 255, 0.6);
    }

    .glass-btn:active {
      transform: scale(0.95);
      background: rgba(255, 255, 255, 0.35);
    }

    .glass-btn svg {
      color: rgba(0, 0, 0, 0.8);
    }

    /* Tool Panel */
    .tool-panel {
      position: absolute;
      top: calc(max(env(safe-area-inset-top, 20px), 20px) + 68px);
      right: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 999;
    }

    .tool-btn {
      width: 48px;
      height: 48px;
      background: rgba(255, 255, 255, 0.25);
      backdrop-filter: saturate(200%) blur(30px);
      -webkit-backdrop-filter: saturate(200%) blur(30px);
      border: 1.5px solid rgba(255, 255, 255, 0.4);
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 
        0 8px 32px rgba(31, 38, 135, 0.2),
        inset 0 1px 0 rgba(255, 255, 255, 0.6);
      position: relative;
      overflow: hidden;
    }

    .tool-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
      transition: left 0.5s;
    }

    .tool-btn:hover::before {
      left: 100%;
    }

    .tool-btn:active {
      transform: scale(0.92);
    }

    .tool-btn.active {
      background: rgba(0, 122, 255, 0.5);
      border-color: rgba(0, 122, 255, 0.7);
      box-shadow: 
        0 8px 32px rgba(0, 122, 255, 0.4),
        inset 0 1px 0 rgba(255, 255, 255, 0.5),
        0 0 20px rgba(0, 122, 255, 0.3);
    }

    .tool-btn.active svg {
      color: white;
    }

    .tool-btn svg {
      color: rgba(0, 0, 0, 0.8);
      transition: color 0.3s;
    }

    /* Bottom Sheet */
    .bottom-sheet {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: saturate(200%) blur(40px);
      -webkit-backdrop-filter: saturate(200%) blur(40px);
      border: 1.5px solid rgba(255, 255, 255, 0.3);
      border-bottom: none;
      border-radius: 28px 28px 0 0;
      box-shadow: 
        0 -8px 40px rgba(31, 38, 135, 0.25),
        inset 0 1px 0 rgba(255, 255, 255, 0.6);
      z-index: 998;
      transform: translateY(calc(100% - 160px));
      transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      max-height: 70vh;
      padding-bottom: max(env(safe-area-inset-bottom, 20px), 20px);
    }

    .bottom-sheet.expanded {
      transform: translateY(0);
    }

    .sheet-handle-area {
      padding: 12px 0;
      cursor: grab;
      display: flex;
      justify-content: center;
    }

    .sheet-handle {
      width: 40px;
      height: 5px;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 3px;
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.1);
    }

    .sheet-content {
      padding: 0 24px 24px;
      overflow-y: auto;
      max-height: calc(70vh - 100px);
    }

    .sheet-title {
      font-size: 32px;
      font-weight: 700;
      color: rgba(0, 0, 0, 0.9);
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }

    .sheet-subtitle {
      font-size: 16px;
      color: rgba(0, 0, 0, 0.6);
      margin-bottom: 28px;
    }

    /* Card Grid */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 16px;
      margin-bottom: 28px;
    }

    .feature-card {
      background: rgba(255, 255, 255, 0.3);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      border: 1.5px solid rgba(255, 255, 255, 0.5);
      border-radius: 20px;
      padding: 20px;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 
        0 4px 16px rgba(31, 38, 135, 0.15),
        inset 0 1px 0 rgba(255, 255, 255, 0.7);
      position: relative;
      overflow: hidden;
    }

    .feature-card::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.3) 0%, transparent 70%);
      opacity: 0;
      transition: opacity 0.3s;
    }

    .feature-card:hover::before {
      opacity: 1;
    }

    .feature-card:active {
      transform: scale(0.97);
      background: rgba(255, 255, 255, 0.4);
    }

    .feature-card.active {
      background: rgba(0, 122, 255, 0.3);
      border-color: rgba(0, 122, 255, 0.6);
      box-shadow: 
        0 8px 24px rgba(0, 122, 255, 0.3),
        inset 0 1px 0 rgba(255, 255, 255, 0.5);
    }

    .card-icon {
      width: 48px;
      height: 48px;
      background: rgba(0, 122, 255, 0.2);
      backdrop-filter: blur(10px);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
      box-shadow: 
        0 4px 12px rgba(0, 122, 255, 0.2),
        inset 0 1px 0 rgba(255, 255, 255, 0.4);
    }

    .feature-card.active .card-icon {
      background: rgba(255, 255, 255, 0.3);
    }

    .card-icon svg {
      color: rgba(0, 122, 255, 1);
    }

    .feature-card.active .card-icon svg {
      color: white;
    }

    .card-label {
      font-size: 15px;
      font-weight: 600;
      color: rgba(0, 0, 0, 0.85);
    }

    .feature-card.active .card-label {
      color: rgba(255, 255, 255, 0.95);
    }

    /* Layer Selector */
    .layer-selector {
      background: rgba(255, 255, 255, 0.25);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      border: 1.5px solid rgba(255, 255, 255, 0.4);
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 20px;
      box-shadow: 
        0 4px 16px rgba(31, 38, 135, 0.15),
        inset 0 1px 0 rgba(255, 255, 255, 0.6);
    }

    .layer-option {
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 14px;
      cursor: pointer;
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
      transition: all 0.2s;
    }

    .layer-option:last-child {
      border-bottom: none;
    }

    .layer-option:active {
      background: rgba(255, 255, 255, 0.2);
    }

    .layer-icon {
      width: 36px;
      height: 36px;
      background: rgba(0, 122, 255, 0.15);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .layer-icon svg {
      color: rgba(0, 122, 255, 1);
    }

    .layer-label {
      flex: 1;
      font-size: 17px;
      font-weight: 500;
      color: rgba(0, 0, 0, 0.85);
    }

    .layer-check {
      color: rgba(0, 122, 255, 1);
      opacity: 0;
      transition: opacity 0.2s;
    }

    .layer-option.active .layer-check {
      opacity: 1;
    }

    /* Action Buttons */
    .action-btn {
      width: 100%;
      padding: 16px;
      background: rgba(0, 122, 255, 0.4);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      border: 1.5px solid rgba(0, 122, 255, 0.6);
      border-radius: 14px;
      font-size: 17px;
      font-weight: 600;
      color: white;
      cursor: pointer;
      margin-bottom: 12px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 
        0 6px 20px rgba(0, 122, 255, 0.3),
        inset 0 1px 0 rgba(255, 255, 255, 0.4);
    }

    .action-btn:active {
      transform: scale(0.98);
      background: rgba(0, 122, 255, 0.5);
    }

    .action-btn.secondary {
      background: rgba(255, 255, 255, 0.25);
      border-color: rgba(255, 255, 255, 0.4);
      color: rgba(0, 0, 0, 0.85);
      box-shadow: 
        0 4px 16px rgba(31, 38, 135, 0.15),
        inset 0 1px 0 rgba(255, 255, 255, 0.6);
    }

    .action-btn.secondary:active {
      background: rgba(255, 255, 255, 0.35);
    }

    /* Coordinate Display */
    .floating-card {
      position: absolute;
      bottom: calc(max(env(safe-area-inset-bottom, 20px), 20px) + 170px);
      left: 20px;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: saturate(200%) blur(30px);
      -webkit-backdrop-filter: saturate(200%) blur(30px);
      border: 1.5px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      padding: 10px 16px;
      font-size: 14px;
      color: white;
      font-family: 'SF Mono', 'Monaco', monospace;
      z-index: 997;
      box-shadow: 
        0 8px 32px rgba(0, 0, 0, 0.4),
        inset 0 1px 0 rgba(255, 255, 255, 0.2);
      transition: bottom 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .bottom-sheet.expanded ~ .floating-card {
      bottom: calc(70vh + 20px);
    }

    /* FAB */
    .fab {
      position: absolute;
      bottom: calc(max(env(safe-area-inset-bottom, 20px), 20px) + 180px);
      right: 20px;
      width: 64px;
      height: 64px;
      background: rgba(0, 122, 255, 0.5);
      backdrop-filter: saturate(200%) blur(30px);
      -webkit-backdrop-filter: saturate(200%) blur(30px);
      border: 1.5px solid rgba(0, 122, 255, 0.7);
      border-radius: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 997;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 
        0 12px 40px rgba(0, 122, 255, 0.5),
        inset 0 1px 0 rgba(255, 255, 255, 0.4),
        0 0 30px rgba(0, 122, 255, 0.3);
      transform: scale(0);
    }

    .fab.visible {
      transform: scale(1);
    }

    .bottom-sheet.expanded ~ .fab {
      bottom: calc(70vh + 20px);
    }

    .fab:active {
      transform: scale(0.9);
    }

    .fab svg {
      color: white;
    }

    /* Toast */
    .toast {
      position: fixed;
      top: calc(max(env(safe-area-inset-top, 20px), 20px) + 80px);
      left: 20px;
      right: 20px;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: saturate(180%) blur(30px);
      -webkit-backdrop-filter: saturate(180%) blur(30px);
      border: 1.5px solid rgba(255, 255, 255, 0.15);
      color: white;
      padding: 16px 20px;
      border-radius: 16px;
      font-size: 15px;
      font-weight: 500;
      z-index: 10000;
      display: none;
      box-shadow: 
        0 12px 40px rgba(0, 0, 0, 0.5),
        inset 0 1px 0 rgba(255, 255, 255, 0.2);
      animation: toastIn 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    @keyframes toastIn {
      from {
        opacity: 0;
        transform: translateY(-30px) scale(0.95);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* Leaflet Overrides */
    .leaflet-control-container {
      display: none;
    }

    .leaflet-popup-content-wrapper {
      background: rgba(255, 255, 255, 0.25);
      backdrop-filter: saturate(200%) blur(40px);
      -webkit-backdrop-filter: saturate(200%) blur(40px);
      border: 1.5px solid rgba(255, 255, 255, 0.4);
      border-radius: 18px;
      box-shadow: 
        0 12px 40px rgba(31, 38, 135, 0.3),
        inset 0 1px 0 rgba(255, 255, 255, 0.6);
    }

    .leaflet-popup-tip {
      background: rgba(255, 255, 255, 0.25);
      backdrop-filter: saturate(200%) blur(40px);
      -webkit-backdrop-filter: saturate(200%) blur(40px);
      border: 1.5px solid rgba(255, 255, 255, 0.4);
    }

    .leaflet-popup-content {
      margin: 18px;
      font-size: 15px;
      line-height: 1.6;
      color: rgba(0, 0, 0, 0.9);
    }

    .popup-delete {
      width: 100%;
      padding: 12px;
      background: rgba(255, 59, 48, 0.5);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1.5px solid rgba(255, 59, 48, 0.7);
      color: white;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      margin-top: 12px;
      cursor: pointer;
      box-shadow: 
        0 4px 16px rgba(255, 59, 48, 0.3),
        inset 0 1px 0 rgba(255, 255, 255, 0.3);
    }

    /* Mobile */
    @media (max-width: 768px) {
      .search-container {
        top: max(env(safe-area-inset-top, 12px), 12px);
      }

      .tool-panel {
        top: calc(max(env(safe-area-inset-top, 12px), 12px) + 68px);
      }

      .card-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .bottom-sheet {
        transform: translateY(calc(100% - 140px));
      }

      .floating-card {
        bottom: calc(max(env(safe-area-inset-bottom, 20px), 20px) + 150px);
      }

      .fab {
        bottom: calc(max(env(safe-area-inset-bottom, 20px), 20px) + 160px);
      }
    }
  </style>
</head>
<body>
  <!-- Search -->
  <div class="search-container">
    <input type="text" class="search-bar" id="search" placeholder="Search places..." />
    <button class="glass-btn" id="btn-menu">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <line x1="3" y1="12" x2="21" y2="12"/>
        <line x1="3" y1="6" x2="21" y2="6"/>
        <line x1="3" y1="18" x2="21" y2="18"/>
      </svg>
    </button>
  </div>

  <!-- Tools -->
  <div class="tool-panel">
    <button class="tool-btn" id="btn-location" title="My Location">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm8.94 3c-.46-4.17-3.77-7.48-7.94-7.94V1h-2v2.06C6.83 3.52 3.52 6.83 3.06 11H1v2h2.06c.46 4.17 3.77 7.48 7.94 7.94V23h2v-2.06c4.17-.46 7.48-3.77 7.94-7.94H23v-2h-2.06zM12 19c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z"/>
      </svg>
    </button>

    <button class="tool-btn" id="btn-measure" title="Measure">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
        <path d="M21 6H3c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm0 10H3V8h2v4h2V8h2v4h2V8h2v4h2V8h2v4h2V8h2v8z"/>
      </svg>
    </button>

    <button class="tool-btn" id="btn-grid" title="Grid">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
        <path d="M20 2H4c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM8 20H4v-4h4v4zm0-6H4v-4h4v4zm0-6H4V4h4v4zm6 12h-4v-4h4v4zm0-6h-4v-4h4v4zm0-6h-4V4h4v4zm6 12h-4v-4h4v4zm0-6h-4v-4h4v4zm0-6h-4V4h4v4z"/>
      </svg>
    </button>

    <button class="tool-btn" id="btn-layers" title="Layers">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
        <path d="M11.99 18.54l-7.37-5.73L3 14.07l9 7 9-7-1.63-1.27-7.38 5.74zM12 16l7.36-5.73L21 9l-9-7-9 7 1.63 1.27L12 16z"/>
      </svg>
    </button>
  </div>

  <!-- Bottom Sheet -->
  <div class="bottom-sheet" id="sheet">
    <div class="sheet-handle-area" id="handle">
      <div class="sheet-handle"></div>
    </div>

    <div class="sheet-content">
      <h1 class="sheet-title">Map Tools</h1>
      <p class="sheet-subtitle">Select tools to draw and explore</p>

      <div class="card-grid">
        <button class="feature-card" data-tool="marker">
          <div class="card-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
            </svg>
          </div>
          <div class="card-label">Marker</div>
        </button>

        <button class="feature-card" data-tool="circle">
          <div class="card-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 2C6.47 2 2 6.47 2 12s4.47 10 10 10 10-4.47 10-10S17.53 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/>
            </svg>
          </div>
          <div class="card-label">Circle</div>
        </button>

        <button class="feature-card" data-tool="polygon">
          <div class="card-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
              <path d="M17 15h2V7c0-1.1-.9-2-2-2H9v2h8v8z"/>
            </svg>
          </div>
          <div class="card-label">Polygon</div>
        </button>

        <button class="feature-card" data-tool="line">
          <div class="card-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
              <path d="M3.5 18.49l6-6.01 4 4L22 6.92l-1.41-1.41-7.09 7.97-4-4L2 16.99z"/>
            </svg>
          </div>
          <div class="card-label">Line</div>
        </button>
      </div>

      <div class="layer-selector">
        <div class="layer-option active" data-layer="standard">
          <div class="layer-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
              <path d="M15 3l2.3 2.3-2.89 2.87 1.42 1.42L18.7 6.7 21 9V3z"/>
            </svg>
          </div>
          <div class="layer-label">Standard</div>
          <div class="layer-check">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
              <path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4L9 16.2z"/>
            </svg>
          </div>
        </div>

        <div class="layer-option" data-layer="satellite">
          <div class="layer-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
              <circle cx="12" cy="12" r="8"/>
            </svg>
          </div>
          <div class="layer-label">Satellite</div>
          <div class="layer-check">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
              <path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4L9 16.2z"/>
            </svg>
          </div>
        </div>

        <div class="layer-option" data-layer="terrain">
          <div class="layer-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
              <path d="M14 6l-3.75 5 2.85 3.8-1.6 1.2C9.81 13.75 7 10 7 10l-6 8h22L14 6z"/>
            </svg>
          </div>
          <div class="layer-label">Terrain</div>
          <div class="layer-check">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
              <path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4L9 16.2z"/>
            </svg>
          </div>
        </div>

        <div class="layer-option" data-layer="dark">
          <div class="layer-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
              <path d="M9 2c-1.05 0-2.05.16-3 .46 4.06 1.27 7 5.06 7 9.54 0 4.48-2.94 8.27-7 9.54.95.3 1.95.46 3 .46 5.52 0 10-4.48 10-10S14.52 2 9 2z"/>
            </svg>
          </div>
          <div class="layer-label">Dark Mode</div>
          <div class="layer-check">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
              <path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4L9 16.2z"/>
            </svg>
          </div>
        </div>
      </div>

      <button class="action-btn" id="btn-export">Export Map Data</button>
      <button class="action-btn secondary" id="btn-clear">Clear All Features</button>
    </div>
  </div>

  <!-- Coordinates -->
  <div class="floating-card" id="coords">0.00000°, 0.00000°</div>

  <!-- FAB -->
  <button class="fab" id="fab">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor">
      <path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4L9 16.2z"/>
    </svg>
  </button>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <!-- Map -->
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    const map = L.map('map', { zoomControl: false, attributionControl: false }).setView([26.1025, 87.9558], 13);

    const layers = {
      standard: L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }),
      satellite: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19 }),
      terrain: L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', { maxZoom: 17 }),
      dark: L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { maxZoom: 19 })
    };

    layers.standard.addTo(map);

    const drawnItems = L.featureGroup().addTo(map);
    const gridLines = L.layerGroup();
    const measureGroup = L.layerGroup().addTo(map);

    let currentTool = null;
    let measureMode = false;
    let gridEnabled = false;
    let drawingPoints = [];
    let tempLine = null;
    let measurePoints = [];

    function toast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.style.display = 'block';
      setTimeout(() => t.style.display = 'none', 2500);
    }

    function resetDrawing() {
      drawingPoints = [];
      if (tempLine) {
        map.removeLayer(tempLine);
        tempLine = null;
      }
      document.getElementById('fab').classList.remove('visible');
    }

    function resetMeasure() {
      measureGroup.clearLayers();
      measurePoints = [];
    }

    function createGrid() {
      gridLines.clearLayers();
      const bounds = map.getBounds();
      const step = map.getZoom() > 14 ? 0.01 : map.getZoom() > 11 ? 0.05 : 0.1;

      for (let lat = Math.floor(bounds.getSouth() / step) * step; lat <= bounds.getNorth(); lat += step) {
        L.polyline([[lat, bounds.getWest()], [lat, bounds.getEast()]], {
          color: '#007AFF',
          weight: 1,
          opacity: 0.3,
          interactive: false
        }).addTo(gridLines);
      }

      for (let lng = Math.floor(bounds.getWest() / step) * step; lng <= bounds.getEast(); lng += step) {
        L.polyline([[bounds.getSouth(), lng], [bounds.getNorth(), lng]], {
          color: '#007AFF',
          weight: 1,
          opacity: 0.3,
          interactive: false
        }).addTo(gridLines);
      }
    }

    const sheet = document.getElementById('sheet');
    const handle = document.getElementById('handle');
    let sheetExpanded = false;

    handle.addEventListener('click', () => {
      sheet.classList.toggle('expanded');
      sheetExpanded = !sheetExpanded;
    });

    document.getElementById('btn-menu').addEventListener('click', () => {
      sheet.classList.toggle('expanded');
      sheetExpanded = !sheetExpanded;
    });

    document.getElementById('btn-location').addEventListener('click', function() {
      if ('geolocation' in navigator) {
        this.classList.add('active');
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            map.setView([pos.coords.latitude, pos.coords.longitude], 15);
            const marker = L.marker([pos.coords.latitude, pos.coords.longitude], { draggable: true }).addTo(drawnItems);
            marker.bindPopup(`<strong>Your Location</strong><br>±${Math.round(pos.coords.accuracy)}m`).openPopup();
            toast('Location found');
            this.classList.remove('active');
          },
          () => {
            toast('Location access denied');
            this.classList.remove('active');
          }
        );
      }
    });

    document.getElementById('btn-measure').addEventListener('click', function() {
      measureMode = !measureMode;
      this.classList.toggle('active');

      if (measureMode) {
        currentTool = null;
        document.querySelectorAll('[data-tool]').forEach(b => b.classList.remove('active'));
        resetDrawing();
        toast('Measure mode enabled');
      } else {
        resetMeasure();
        toast('Measure mode disabled');
      }
    });

    document.getElementById('btn-grid').addEventListener('click', function() {
      gridEnabled = !gridEnabled;
      this.classList.toggle('active');

      if (gridEnabled) {
        createGrid();
        gridLines.addTo(map);
        toast('Grid enabled');
      } else {
        gridLines.remove();
        toast('Grid disabled');
      }
    });

    map.on('moveend', () => {
      if (gridEnabled) createGrid();
    });

    document.getElementById('btn-layers').addEventListener('click', () => {
      sheet.classList.add('expanded');
      sheetExpanded = true;
    });

    document.querySelectorAll('[data-layer]').forEach(btn => {
      btn.addEventListener('click', function() {
        const layer = this.getAttribute('data-layer');
        document.querySelectorAll('[data-layer]').forEach(b => b.classList.remove('active'));
        this.classList.add('active');

        Object.values(layers).forEach(l => map.removeLayer(l));
        layers[layer].addTo(map);
        toast(`Switched to ${layer} view`);
      });
    });

    document.querySelectorAll('[data-tool]').forEach(btn => {
      btn.addEventListener('click', function() {
        const tool = this.getAttribute('data-tool');
        document.querySelectorAll('[data-tool]').forEach(b => b.classList.remove('active'));

        if (currentTool === tool) {
          currentTool = null;
          resetDrawing();
        } else {
          currentTool = tool;
          this.classList.add('active');
          measureMode = false;
          document.getElementById('btn-measure').classList.remove('active');
          resetMeasure();
          resetDrawing();
          toast(`${tool.charAt(0).toUpperCase() + tool.slice(1)} tool selected`);
        }

        sheet.classList.remove('expanded');
        sheetExpanded = false;
      });
    });

    document.getElementById('btn-export').addEventListener('click', () => {
      const features = [];
      drawnItems.eachLayer(layer => {
        if (layer.toGeoJSON) features.push(layer.toGeoJSON());
      });

      const geojson = { type: 'FeatureCollection', features };
      const blob = new Blob([JSON.stringify(geojson, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'map-export.geojson';
      a.click();

      toast(`Exported ${features.length} features`);
    });

    document.getElementById('btn-clear').addEventListener('click', () => {
      if (confirm('Clear all features?')) {
        drawnItems.clearLayers();
        resetDrawing();
        resetMeasure();
        toast('All features cleared');
      }
    });

    map.on('click', (e) => {
      const lat = e.latlng.lat;
      const lng = e.latlng.lng;

      if (measureMode) {
        measurePoints.push(e.latlng);
        L.circleMarker(e.latlng, {
          radius: 6,
          fillColor: '#007AFF',
          color: '#fff',
          weight: 3,
          fillOpacity: 1
        }).addTo(measureGroup);

        if (measurePoints.length > 1) {
          L.polyline(measurePoints, {
            color: '#007AFF',
            weight: 3,
            dashArray: '8, 8'
          }).addTo(measureGroup);

          let totalDist = 0;
          for (let i = 0; i < measurePoints.length - 1; i++) {
            totalDist += measurePoints[i].distanceTo(measurePoints[i + 1]);
          }

          toast(`Distance: ${(totalDist / 1000).toFixed(2)} km`);
        }
        return;
      }

      if (!currentTool) return;

      if (currentTool === 'marker') {
        const marker = L.marker(e.latlng, { draggable: true }).addTo(drawnItems);
        marker.bindPopup(`<strong>Marker</strong><br>${lat.toFixed(5)}°, ${lng.toFixed(5)}°<br><button class="popup-delete" onclick="window.deleteFeature(${drawnItems.getLayerId(marker)})">Delete</button>`).openPopup();
      }

      if (currentTool === 'circle') {
        const circle = L.circle(e.latlng, {
          radius: 500,
          color: '#007AFF',
          fillColor: '#007AFF',
          fillOpacity: 0.15,
          weight: 2
        }).addTo(drawnItems);
        circle.editing.enable();
        circle.bindPopup(`<strong>Circle</strong><br>Radius: 500m<br><button class="popup-delete" onclick="window.deleteFeature(${drawnItems.getLayerId(circle)})">Delete</button>`).openPopup();
      }

      if (currentTool === 'polygon' || currentTool === 'line') {
        drawingPoints.push(e.latlng);

        if (tempLine) map.removeLayer(tempLine);

        if (currentTool === 'polygon' && drawingPoints.length > 2) {
          tempLine = L.polygon(drawingPoints, {
            color: '#007AFF',
            fillColor: '#007AFF',
            fillOpacity: 0.15,
            weight: 2,
            dashArray: '8, 8'
          }).addTo(map);
        } else if (currentTool === 'line' && drawingPoints.length > 1) {
          tempLine = L.polyline(drawingPoints, {
            color: '#007AFF',
            weight: 3,
            dashArray: '8, 8'
          }).addTo(map);
        }

        document.getElementById('fab').classList.add('visible');
      }
    });

    document.getElementById('fab').addEventListener('click', () => {
      if ((currentTool === 'polygon' || currentTool === 'line') && drawingPoints.length > 1) {
        if (tempLine) map.removeLayer(tempLine);

        let feature;
        if (currentTool === 'polygon' && drawingPoints.length > 2) {
          feature = L.polygon(drawingPoints, {
            color: '#007AFF',
            fillColor: '#007AFF',
            fillOpacity: 0.15,
            weight: 2
          }).addTo(drawnItems);
          feature.editing.enable();
          feature.bindPopup(`<strong>Polygon</strong><br>${drawingPoints.length} vertices<br><button class="popup-delete" onclick="window.deleteFeature(${drawnItems.getLayerId(feature)})">Delete</button>`);
        } else if (currentTool === 'line') {
          feature = L.polyline(drawingPoints, {
            color: '#007AFF',
            weight: 3
          }).addTo(drawnItems);

          let length = 0;
          for (let i = 0; i < drawingPoints.length - 1; i++) {
            length += drawingPoints[i].distanceTo(drawingPoints[i + 1]);
          }

          feature.editing.enable();
          feature.bindPopup(`<strong>Line</strong><br>${(length / 1000).toFixed(2)} km<br><button class="popup-delete" onclick="window.deleteFeature(${drawnItems.getLayerId(feature)})">Delete</button>`);
        }

        resetDrawing();
        toast('Feature added');
      }
    });

    window.deleteFeature = function(id) {
      drawnItems.eachLayer(layer => {
        if (drawnItems.getLayerId(layer) === id) {
          drawnItems.removeLayer(layer);
          map.closePopup();
          toast('Feature deleted');
        }
      });
    };

    map.on('mousemove', (e) => {
      document.getElementById('coords').textContent = `${e.latlng.lat.toFixed(5)}°, ${e.latlng.lng.toFixed(5)}°`;
    });

    document.getElementById('search').addEventListener('keypress', (e) => {
      if (e.key === 'Enter' && e.target.value) {
        fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(e.target.value)}`)
          .then(r => r.json())
          .then(data => {
            if (data && data.length > 0) {
              const result = data[0];
              map.setView([parseFloat(result.lat), parseFloat(result.lon)], 15);
              const marker = L.marker([parseFloat(result.lat), parseFloat(result.lon)], { draggable: true }).addTo(drawnItems);
              marker.bindPopup(`<strong>${result.display_name}</strong>`).openPopup();
              toast('Location found');
            } else {
              toast('No results found');
            }
          })
          .catch(() => toast('Search failed'));
      }
    });
  </script>
</body>
</html>
