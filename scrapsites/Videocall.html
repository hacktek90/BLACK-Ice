<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Call // Swiss Minimal</title>
    <meta name="theme-color" content="#F4F4F4">
    
    <!-- FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Inter Tight"', 'sans-serif'],
                    },
                    colors: {
                        'swiss-red': '#FF3333',
                        'swiss-bg': '#F4F4F4',
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: var(--swiss-bg); color: #111; }
        
        .grid-line {
            position: absolute;
            background-color: rgba(0,0,0,0.06);
            pointer-events: none;
            z-index: 0;
        }

        /* Video Containers */
        .video-box {
            background: #000;
            position: relative;
            overflow: hidden;
            border-radius: 0; /* Swiss style prefers sharp edges, but minimal radius is ok */
        }
        
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Input Styling */
        .minimal-input {
            background: transparent;
            border: none;
            border-bottom: 1px solid rgba(0,0,0,0.2);
            border-radius: 0;
            padding: 12px 0;
            outline: none;
            font-family: 'Inter Tight', sans-serif;
            transition: border-color 0.3s;
        }
        .minimal-input:focus { border-bottom-color: #000; }
        
        /* Button Hover Line */
        .btn-line {
            position: relative;
        }
        .btn-line::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0%;
            height: 1px;
            background-color: currentColor;
            transition: width 0.3s;
        }
        .btn-line:hover::after { width: 100%; }

        /* Fullscreen Button */
        .fs-btn {
            position: absolute;
            bottom: 16px; right: 16px;
            color: white;
            background: rgba(0,0,0,0.5);
            width: 32px; height: 32px;
            display: flex; alignItems: center; justifyContent: center;
            opacity: 0; transition: opacity 0.3s;
            cursor: pointer;
            font-size: 14px;
        }
        .video-box:hover .fs-btn { opacity: 1; }
    </style>
</head>
<body class="min-h-screen w-screen overflow-x-hidden relative flex flex-col">

    <!-- GRID LINES -->
    <div class="hidden md:block grid-line top-0 bottom-0 left-[25%] w-px"></div>
    <div class="hidden md:block grid-line top-0 bottom-0 left-[50%] w-px"></div>
    <div class="hidden md:block grid-line top-0 bottom-0 left-[75%] w-px"></div>
    <div class="grid-line left-0 right-0 top-[100px] h-px"></div>

    <!-- MAIN WRAPPER -->
    <main class="relative z-10 w-full max-w-[1600px] mx-auto flex-grow flex flex-col md:grid md:grid-cols-4 md:grid-rows-[100px_1fr]">

        <!-- HEADER -->
        <header class="col-span-4 h-[100px] px-6 md:px-12 flex items-center justify-between border-b border-black/5 bg-swiss-bg">
            <div class="flex items-center gap-3">
                <span class="w-3 h-3 bg-swiss-red rounded-full animate-pulse" id="live-dot"></span>
                <h1 class="text-sm font-medium tracking-tight uppercase">Video Bridge v1.0</h1>
            </div>
            
            <!-- ID DISPLAY -->
            <div class="flex items-center gap-4 text-sm font-mono">
                <span class="text-gray-400 uppercase hidden sm:inline">My Identity:</span>
                <span id="my-id" class="font-medium bg-black/5 px-2 py-1">Connecting...</span>
                <button id="copyIdBtn" class="text-xs uppercase hover:text-swiss-red transition-colors">Copy</button>
                <span id="copyFeedback" class="text-xs text-swiss-red min-w-[50px]"></span>
            </div>
        </header>

        <!-- LEFT COLUMN: CONTROLS (Mobile: Top, Desktop: Side) -->
        <section class="col-span-4 md:col-span-1 px-6 md:px-12 py-8 md:py-12 border-b md:border-b-0 md:border-r border-black/5 flex flex-col gap-8 bg-swiss-bg">
            
            <!-- Connection Box -->
            <div>
                <h2 class="text-xs font-semibold uppercase tracking-widest text-gray-400 mb-6">01 / Connect</h2>
                <div class="flex flex-col gap-4">
                    <input id="remoteId" class="minimal-input text-lg w-full placeholder-gray-300" placeholder="Enter Remote ID..." autocomplete="off" />
                    
                    <button id="callBtn" class="group flex items-center gap-3 text-sm font-medium hover:text-black transition-colors py-2">
                        <span class="w-6 h-px bg-black group-hover:bg-swiss-red transition-colors"></span>
                        Initiate Call
                    </button>
                    
                    <button id="hangupBtn" class="group flex items-center gap-3 text-sm font-medium text-gray-400 hover:text-swiss-red transition-colors py-2" disabled>
                        <span class="w-6 h-px bg-gray-300 group-hover:bg-swiss-red transition-colors"></span>
                        Terminate
                    </button>
                </div>
            </div>

            <!-- Status -->
            <div>
                <h2 class="text-xs font-semibold uppercase tracking-widest text-gray-400 mb-4">02 / Status</h2>
                <div id="status" class="text-sm font-medium">System Ready</div>
            </div>

            <!-- Actions -->
            <div class="flex flex-col gap-3 mt-auto">
                <button id="toggleAudio" class="text-left text-xs uppercase tracking-wider hover:text-swiss-red py-2 border-b border-black/5">Mute Microphone</button>
                <button id="toggleVideo" class="text-left text-xs uppercase tracking-wider hover:text-swiss-red py-2 border-b border-black/5">Disable Camera</button>
                <button id="shareScreen" class="text-left text-xs uppercase tracking-wider hover:text-swiss-red py-2 border-b border-black/5">Share Screen</button>
                <button id="stopScreen" class="text-left text-xs uppercase tracking-wider text-gray-400 py-2 border-b border-black/5" disabled>Stop Sharing</button>
                <a href="https://github.com/hacktek90/BLACK-Ice/releases/download/apk/app-release.apk" class="text-left text-xs uppercase tracking-wider text-blue-600 hover:text-blue-800 py-4 mt-4">Download .APK →</a>
            </div>

        </section>

        <!-- RIGHT COLUMN: VIDEO GRID -->
        <section class="col-span-4 md:col-span-3 bg-white relative">
            
            <!-- Remote Video (Main) -->
            <div class="absolute inset-0 z-0">
                <div class="video-box w-full h-full bg-gray-100 flex items-center justify-center">
                    <video id="remote" autoplay playsinline class="bg-[#111]"></video>
                    <div class="fs-btn" data-video="remote">⛶</div>
                    
                    <!-- Placeholder Text -->
                    <div id="remote-placeholder" class="absolute text-gray-300 uppercase tracking-widest text-sm pointer-events-none">
                        Remote Feed Inactive
                    </div>
                </div>
            </div>

            <!-- Local Video (PIP) -->
            <div class="absolute bottom-6 right-6 z-10 w-32 md:w-64 aspect-[4/3] shadow-lg border border-white/10">
                <div class="video-box w-full h-full">
                    <video id="local" autoplay muted playsinline class="bg-[#222]"></video>
                    <div class="fs-btn" data-video="local">⛶</div>
                </div>
                <div class="absolute top-2 left-2 text-[10px] text-white/50 uppercase tracking-widest mix-blend-difference">Local</div>
            </div>

        </section>

    </main>

<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<script>
    // === 1. ID GENERATOR ===
    const words1 = ["alpha","beta","gamma","delta","neon","cyber","flux","zero","core","nova"];
    const words2 = ["link","node","grid","mesh","wave","pulse","sync","data","flow","base"];
    function generateId() {
        const w1 = words1[Math.floor(Math.random() * words1.length)];
        const w2 = words2[Math.floor(Math.random() * words2.length)];
        const num = Math.floor(Math.random() * 999);
        return `${w1}-${w2}-${num}`;
    }
    const customPeerId = generateId();

    // === 2. DOM ELEMENTS ===
    const myIdSpan = document.getElementById('my-id');
    const copyIdBtn = document.getElementById('copyIdBtn');
    const copyFeedback = document.getElementById('copyFeedback');
    const remoteIdInput = document.getElementById('remoteId');
    const callBtn = document.getElementById('callBtn');
    const hangupBtn = document.getElementById('hangupBtn');
    const localVideo = document.getElementById('local');
    const remoteVideo = document.getElementById('remote');
    const statusDiv = document.getElementById('status');
    const liveDot = document.getElementById('live-dot');
    
    // Controls
    const toggleAudioBtn = document.getElementById('toggleAudio');
    const toggleVideoBtn = document.getElementById('toggleVideo');
    const shareScreenBtn = document.getElementById('shareScreen');
    const stopScreenBtn = document.getElementById('stopScreen');

    myIdSpan.textContent = customPeerId;

    // === 3. COPY FUNCTION ===
    copyIdBtn.addEventListener('click', async () => {
        try {
            await navigator.clipboard.writeText(customPeerId);
            copyFeedback.textContent = 'Copied';
            setTimeout(() => copyFeedback.textContent = '', 2000);
        } catch (err) {
            copyFeedback.textContent = 'Err';
        }
    });

    // === 4. FULLSCREEN ===
    document.querySelectorAll('.fs-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
            const v = document.getElementById(e.target.dataset.video);
            if (!v) return;
            if (document.fullscreenElement) document.exitFullscreen();
            else v.requestFullscreen();
        });
    });

    // === 5. PEERJS LOGIC ===
    let peer, currentCall, localStream, isAudioEnabled = true, isVideoEnabled = true, isScreenSharing = false;

    peer = new Peer(customPeerId);

    peer.on('open', (id) => {
        console.log('ID:', id);
        updateStatus('Ready to Connect');
        liveDot.classList.remove('bg-swiss-red');
        liveDot.classList.add('bg-green-500');
    });

    peer.on('error', (err) => {
        updateStatus('Connection Error', true);
    });

    // Incoming Call
    peer.on('call', async (call) => {
        if (currentCall) return call.close(); // Busy
        try {
            localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            localVideo.srcObject = localStream;
            call.answer(localStream);
            setupCall(call);
        } catch (e) {
            updateStatus('Perms Denied', true);
        }
    });

    // Outgoing Call
    callBtn.onclick = async () => {
        const remoteId = remoteIdInput.value.trim();
        if (!remoteId) return;
        
        try {
            updateStatus('Requesting Media...');
            localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            localVideo.srcObject = localStream;
            
            updateStatus(`Dialing ${remoteId}...`);
            currentCall = peer.call(remoteId, localStream);
            setupCall(currentCall);
            
            callBtn.disabled = true;
            hangupBtn.disabled = false;
        } catch (e) {
            updateStatus('Call Failed', true);
        }
    };

    // Hangup
    hangupBtn.onclick = endCall;

    function setupCall(call) {
        currentCall = call;
        call.on('stream', (remoteStream) => {
            remoteVideo.srcObject = remoteStream;
            document.getElementById('remote-placeholder').style.display = 'none';
            updateStatus('Signal Established');
            hangupBtn.disabled = false;
            callBtn.disabled = true;
        });
        call.on('close', endCall);
        call.on('error', () => { endCall(); updateStatus('Call Error', true); });
    }

    function endCall() {
        if (currentCall) currentCall.close();
        if (localStream) localStream.getTracks().forEach(t => t.stop());
        
        localVideo.srcObject = null;
        remoteVideo.srcObject = null;
        currentCall = null;
        localStream = null;
        
        document.getElementById('remote-placeholder').style.display = 'block';
        updateStatus('Call Terminated');
        
        callBtn.disabled = false;
        hangupBtn.disabled = true;
        
        // Reset buttons
        isScreenSharing = false;
        isAudioEnabled = true;
        isVideoEnabled = true;
        toggleAudioBtn.innerText = 'Mute Microphone';
        toggleVideoBtn.innerText = 'Disable Camera';
        toggleVideoBtn.disabled = false;
        stopScreenBtn.disabled = true;
    }

    function updateStatus(msg, err=false) {
        statusDiv.textContent = msg;
        statusDiv.className = err ? "text-sm font-medium text-swiss-red" : "text-sm font-medium text-black";
    }

    // === 6. MEDIA CONTROLS ===
    toggleAudioBtn.onclick = () => {
        if (!localStream) return;
        isAudioEnabled = !isAudioEnabled;
        localStream.getAudioTracks().forEach(t => t.enabled = isAudioEnabled);
        toggleAudioBtn.innerText = isAudioEnabled ? 'Mute Microphone' : 'Unmute Microphone';
        toggleAudioBtn.style.color = isAudioEnabled ? 'black' : '#FF3333';
    };

    toggleVideoBtn.onclick = () => {
        if (!localStream || isScreenSharing) return;
        isVideoEnabled = !isVideoEnabled;
        localStream.getVideoTracks().forEach(t => t.enabled = isVideoEnabled);
        toggleVideoBtn.innerText = isVideoEnabled ? 'Disable Camera' : 'Enable Camera';
        toggleVideoBtn.style.color = isVideoEnabled ? 'black' : '#FF3333';
    };

    shareScreenBtn.onclick = async () => {
        if (isScreenSharing || !currentCall) return;
        try {
            const stream = await navigator.mediaDevices.getDisplayMedia({ video: true });
            isScreenSharing = true;
            
            // Replace video track
            const videoTrack = stream.getVideoTracks()[0];
            const sender = currentCall.peerConnection.getSenders().find(s => s.track.kind === 'video');
            sender.replaceTrack(videoTrack);
            
            // Local preview
            localVideo.srcObject = stream;
            
            // Track clean up when user clicks "Stop Sharing" on browser UI
            videoTrack.onended = () => stopScreenBtn.click();
            
            toggleVideoBtn.disabled = true;
            stopScreenBtn.disabled = false;
            updateStatus('Sharing Screen');
        } catch (e) {
            updateStatus('Screen Share Cancelled');
        }
    };

    stopScreenBtn.onclick = async () => {
        if (!isScreenSharing) return;
        try {
            // Revert to camera
            const camStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            const videoTrack = camStream.getVideoTracks()[0];
            
            const sender = currentCall.peerConnection.getSenders().find(s => s.track.kind === 'video');
            sender.replaceTrack(videoTrack);
            
            localVideo.srcObject = camStream;
            localStream = camStream; // Update reference
            
            isScreenSharing = false;
            toggleVideoBtn.disabled = false;
            stopScreenBtn.disabled = true;
            updateStatus('Camera Restored');
        } catch (e) {
            updateStatus('Error Restoring Camera', true);
        }
    };

</script>
</body>
</html>
