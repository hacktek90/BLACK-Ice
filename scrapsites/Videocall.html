<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Video Call // Swiss Minimal</title>
    <meta name="theme-color" content="#F4F4F4">
    
    <!-- FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Inter Tight"', 'sans-serif'],
                    },
                    colors: {
                        'swiss-red': '#FF3333',
                        'swiss-bg': '#F4F4F4',
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: var(--swiss-bg); color: #111; }
        
        .grid-line {
            position: absolute;
            background-color: rgba(0,0,0,0.06);
            pointer-events: none;
            z-index: 0;
        }

        /* Video Containers */
        .video-box {
            background: #000;
            position: relative;
            overflow: hidden;
            border-radius: 0;
        }
        
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Input Styling */
        .minimal-input {
            background: transparent;
            border: none;
            border-bottom: 1px solid rgba(0,0,0,0.2);
            border-radius: 0;
            padding: 12px 0;
            outline: none;
            font-family: 'Inter Tight', sans-serif;
            transition: border-color 0.3s;
        }
        .minimal-input:focus { border-bottom-color: #000; }
        
        /* Fullscreen Button */
        .fs-btn {
            position: absolute;
            bottom: 16px; right: 16px;
            color: white;
            background: rgba(0,0,0,0.5);
            width: 32px; height: 32px;
            display: flex; alignItems: center; justifyContent: center;
            opacity: 0; transition: opacity 0.3s;
            cursor: pointer;
            font-size: 14px;
        }
        .video-box:hover .fs-btn { opacity: 1; }
    </style>
</head>
<body class="min-h-screen w-screen overflow-x-hidden relative flex flex-col">

    <!-- GRID LINES -->
    <div class="hidden md:block grid-line top-0 bottom-0 left-[25%] w-px"></div>
    <div class="hidden md:block grid-line top-0 bottom-0 left-[50%] w-px"></div>
    <div class="hidden md:block grid-line top-0 bottom-0 left-[75%] w-px"></div>
    <div class="grid-line left-0 right-0 top-[80px] md:top-[100px] h-px"></div>

    <!-- MAIN WRAPPER -->
    <main class="relative z-10 w-full max-w-[1600px] mx-auto flex-grow flex flex-col md:grid md:grid-cols-4 md:grid-rows-[100px_1fr]">

        <!-- HEADER -->
        <header class="col-span-4 h-[80px] md:h-[100px] px-6 md:px-12 flex items-center justify-between border-b border-black/5 bg-swiss-bg sticky top-0 z-20">
            <div class="flex items-center gap-3">
                <span class="w-2 md:w-3 h-2 md:h-3 bg-swiss-red rounded-full animate-pulse" id="live-dot"></span>
                <h1 class="text-xs md:text-sm font-medium tracking-tight uppercase">Video Bridge v1.0</h1>
            </div>
            
            <!-- ID DISPLAY -->
            <div class="flex items-center gap-3 text-xs md:text-sm font-mono">
                <span class="text-gray-400 uppercase hidden md:inline">My Identity:</span>
                <span id="my-id" class="font-medium bg-black/5 px-2 py-1 max-w-[120px] truncate">Connecting...</span>
                <button id="copyIdBtn" class="uppercase hover:text-swiss-red transition-colors p-2 md:p-0">Copy</button>
                <span id="copyFeedback" class="text-swiss-red min-w-[30px]"></span>
            </div>
        </header>

        <!-- LEFT COLUMN: CONTROLS -->
        <section class="col-span-4 md:col-span-1 px-6 md:px-12 py-8 md:py-12 border-b md:border-b-0 md:border-r border-black/5 flex flex-col gap-8 bg-swiss-bg">
            
            <!-- Connection Box -->
            <div>
                <h2 class="text-[10px] md:text-xs font-semibold uppercase tracking-widest text-gray-400 mb-4 md:mb-6">01 / Connect</h2>
                <div class="flex flex-col gap-4">
                    <input id="remoteId" class="minimal-input text-base md:text-lg w-full placeholder-gray-300" placeholder="Enter Remote ID..." autocomplete="off" />
                    
                    <div class="flex md:flex-col gap-3">
                        <button id="callBtn" class="flex-1 group flex items-center justify-center md:justify-start gap-3 text-sm font-medium bg-black text-white md:bg-transparent md:text-black hover:text-black transition-colors py-3 md:py-2">
                            <span class="hidden md:block w-6 h-px bg-black group-hover:bg-swiss-red transition-colors"></span>
                            Initiate Call
                        </button>
                        
                        <button id="hangupBtn" class="flex-1 group flex items-center justify-center md:justify-start gap-3 text-sm font-medium bg-gray-200 text-gray-400 md:bg-transparent md:text-gray-400 hover:text-swiss-red transition-colors py-3 md:py-2" disabled>
                            <span class="hidden md:block w-6 h-px bg-gray-300 group-hover:bg-swiss-red transition-colors"></span>
                            Terminate
                        </button>
                    </div>
                </div>
            </div>

            <!-- Status -->
            <div class="hidden md:block">
                <h2 class="text-xs font-semibold uppercase tracking-widest text-gray-400 mb-4">02 / Status</h2>
                <div id="status" class="text-sm font-medium">System Ready</div>
            </div>
            <!-- Mobile Status -->
            <div id="mobile-status" class="md:hidden text-center text-xs font-mono uppercase tracking-widest text-gray-500 py-2 bg-gray-50 border border-black/5">
                Status: System Ready
            </div>

            <!-- Actions -->
            <div class="flex flex-row md:flex-col gap-2 md:gap-3 mt-auto overflow-x-auto md:overflow-visible pb-2 md:pb-0">
                <button id="toggleAudio" class="whitespace-nowrap px-4 py-2 md:px-0 text-left text-xs uppercase tracking-wider bg-white md:bg-transparent border md:border-0 border-black/10 hover:text-swiss-red md:border-b md:border-black/5">Mute Mic</button>
                <button id="toggleVideo" class="whitespace-nowrap px-4 py-2 md:px-0 text-left text-xs uppercase tracking-wider bg-white md:bg-transparent border md:border-0 border-black/10 hover:text-swiss-red md:border-b md:border-black/5">Disable Cam</button>
                <button id="shareScreen" class="whitespace-nowrap px-4 py-2 md:px-0 text-left text-xs uppercase tracking-wider bg-white md:bg-transparent border md:border-0 border-black/10 hover:text-swiss-red md:border-b md:border-black/5">Share Screen</button>
                <a href="https://github.com/hacktek90/BLACK-Ice/releases/download/apk/app-release.apk" class="whitespace-nowrap px-4 py-2 md:px-0 text-left text-xs uppercase tracking-wider text-blue-600 bg-white md:bg-transparent border md:border-0 border-blue-100 md:mt-4">Get App</a>
                <button id="stopScreen" class="hidden" disabled></button>
            </div>

        </section>

        <!-- RIGHT COLUMN: REMOTE VIDEO ONLY -->
        <section class="col-span-4 md:col-span-3 bg-white relative h-[50vh] md:h-auto min-h-[300px]">
            
            <div class="absolute inset-0 z-0">
                <div class="video-box w-full h-full bg-gray-100 flex items-center justify-center">
                    <video id="remote" autoplay playsinline class="bg-[#111]"></video>
                    <div class="fs-btn" data-video="remote">⛶</div>
                    
                    <!-- Placeholder Text -->
                    <div id="remote-placeholder" class="absolute text-gray-300 uppercase tracking-widest text-xs md:text-sm pointer-events-none">
                        Remote Feed Inactive
                    </div>
                </div>
            </div>

            <!-- Local Video Element (Hidden in DOM but required for logic) -->
            <video id="local" autoplay muted playsinline class="hidden"></video>

        </section>

    </main>

<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<script>
    // === 1. ID GENERATOR ===
    const words1 = ["alpha","beta","gamma","delta","neon","cyber","flux","zero","core","nova"];
    const words2 = ["link","node","grid","mesh","wave","pulse","sync","data","flow","base"];
    function generateId() {
        const w1 = words1[Math.floor(Math.random() * words1.length)];
        const w2 = words2[Math.floor(Math.random() * words2.length)];
        const num = Math.floor(Math.random() * 999);
        return `${w1}-${w2}-${num}`;
    }
    const customPeerId = generateId();

    // === 2. DOM ELEMENTS ===
    const myIdSpan = document.getElementById('my-id');
    const copyIdBtn = document.getElementById('copyIdBtn');
    const copyFeedback = document.getElementById('copyFeedback');
    const remoteIdInput = document.getElementById('remoteId');
    const callBtn = document.getElementById('callBtn');
    const hangupBtn = document.getElementById('hangupBtn');
    // NOTE: localVideo still exists in JS but is hidden in HTML
    const localVideo = document.getElementById('local'); 
    const remoteVideo = document.getElementById('remote');
    const statusDiv = document.getElementById('status');
    const mobileStatusDiv = document.getElementById('mobile-status');
    const liveDot = document.getElementById('live-dot');
    
    // Controls
    const toggleAudioBtn = document.getElementById('toggleAudio');
    const toggleVideoBtn = document.getElementById('toggleVideo');
    const shareScreenBtn = document.getElementById('shareScreen');
    const stopScreenBtn = document.getElementById('stopScreen');

    myIdSpan.textContent = customPeerId;

    // === 3. COPY FUNCTION ===
    copyIdBtn.addEventListener('click', async () => {
        try {
            await navigator.clipboard.writeText(customPeerId);
            copyFeedback.textContent = 'OK';
            setTimeout(() => copyFeedback.textContent = '', 2000);
        } catch (err) {
            copyFeedback.textContent = 'Err';
        }
    });

    // === 4. FULLSCREEN ===
    document.querySelectorAll('.fs-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
            const v = document.getElementById(e.target.dataset.video);
            if (!v) return;
            if (document.fullscreenElement) document.exitFullscreen();
            else v.requestFullscreen();
        });
    });

    // === 5. PEERJS LOGIC ===
    let peer, currentCall, localStream, isAudioEnabled = true, isVideoEnabled = true, isScreenSharing = false;

    peer = new Peer(customPeerId);

    peer.on('open', (id) => {
        console.log('ID:', id);
        updateStatus('Ready to Connect');
        liveDot.classList.remove('bg-swiss-red');
        liveDot.classList.add('bg-green-500');
    });

    peer.on('error', (err) => {
        updateStatus('Connection Error', true);
    });

    // Incoming Call
    peer.on('call', async (call) => {
        if (currentCall) return call.close(); // Busy
        try {
            localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            localVideo.srcObject = localStream; // Logic requires this, but user won't see it
            call.answer(localStream);
            setupCall(call);
        } catch (e) {
            updateStatus('Perms Denied', true);
        }
    });

    // Outgoing Call
    callBtn.onclick = async () => {
        const remoteId = remoteIdInput.value.trim();
        if (!remoteId) return;
        
        try {
            updateStatus('Requesting Media...');
            localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            localVideo.srcObject = localStream;
            
            updateStatus(`Dialing ${remoteId}...`);
            currentCall = peer.call(remoteId, localStream);
            setupCall(currentCall);
            
            callBtn.disabled = true;
            hangupBtn.disabled = false;
        } catch (e) {
            updateStatus('Call Failed', true);
        }
    };

    // Hangup
    hangupBtn.onclick = endCall;

    function setupCall(call) {
        currentCall = call;
        call.on('stream', (remoteStream) => {
            remoteVideo.srcObject = remoteStream;
            document.getElementById('remote-placeholder').style.display = 'none';
            updateStatus('Signal Established');
            hangupBtn.disabled = false;
            callBtn.disabled = true;
        });
        call.on('close', endCall);
        call.on('error', () => { endCall(); updateStatus('Call Error', true); });
    }

    function endCall() {
        if (currentCall) currentCall.close();
        if (localStream) localStream.getTracks().forEach(t => t.stop());
        
        localVideo.srcObject = null;
        remoteVideo.srcObject = null;
        currentCall = null;
        localStream = null;
        
        document.getElementById('remote-placeholder').style.display = 'block';
        updateStatus('Call Terminated');
        
        callBtn.disabled = false;
        hangupBtn.disabled = true;
        
        // Reset buttons
        isScreenSharing = false;
        isAudioEnabled = true;
        isVideoEnabled = true;
        toggleAudioBtn.innerText = 'Mute Mic';
        toggleVideoBtn.innerText = 'Disable Cam';
        toggleVideoBtn.disabled = false;
        stopScreenBtn.disabled = true;
    }

    function updateStatus(msg, err=false) {
        statusDiv.textContent = msg;
        statusDiv.className = err ? "text-sm font-medium text-swiss-red" : "text-sm font-medium text-black";
        mobileStatusDiv.textContent = `Status: ${msg}`;
        mobileStatusDiv.style.color = err ? '#FF3333' : '#666';
    }

    // === 6. MEDIA CONTROLS ===
    toggleAudioBtn.onclick = () => {
        if (!localStream) return;
        isAudioEnabled = !isAudioEnabled;
        localStream.getAudioTracks().forEach(t => t.enabled = isAudioEnabled);
        toggleAudioBtn.innerText = isAudioEnabled ? 'Mute Mic' : 'Unmute Mic';
        toggleAudioBtn.style.color = isAudioEnabled ? 'inherit' : '#FF3333';
    };

    toggleVideoBtn.onclick = () => {
        if (!localStream || isScreenSharing) return;
        isVideoEnabled = !isVideoEnabled;
        localStream.getVideoTracks().forEach(t => t.enabled = isVideoEnabled);
        toggleVideoBtn.innerText = isVideoEnabled ? 'Disable Cam' : 'Enable Cam';
        toggleVideoBtn.style.color = isVideoEnabled ? 'inherit' : '#FF3333';
    };

    shareScreenBtn.onclick = async () => {
        if (isScreenSharing || !currentCall) return;
        try {
            const stream = await navigator.mediaDevices.getDisplayMedia({ video: true });
            isScreenSharing = true;
            const videoTrack = stream.getVideoTracks()[0];
            const sender = currentCall.peerConnection.getSenders().find(s => s.track.kind === 'video');
            sender.replaceTrack(videoTrack);
            localVideo.srcObject = stream;
            videoTrack.onended = () => stopScreenBtn.click();
            toggleVideoBtn.disabled = true;
            stopScreenBtn.disabled = false;
            updateStatus('Sharing Screen');
        } catch (e) {
            updateStatus('Share Cancelled');
        }
    };

    stopScreenBtn.onclick = async () => {
        if (!isScreenSharing) return;
        try {
            const camStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            const videoTrack = camStream.getVideoTracks()[0];
            const sender = currentCall.peerConnection.getSenders().find(s => s.track.kind === 'video');
            sender.replaceTrack(videoTrack);
            localVideo.srcObject = camStream;
            localStream = camStream; 
            isScreenSharing = false;
            toggleVideoBtn.disabled = false;
            stopScreenBtn.disabled = true;
            updateStatus('Camera Restored');
        } catch (e) {
            updateStatus('Restore Error', true);
        }
    };
</script>
</body>
</html>
