<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Embedded Site with Right-Click Block</title>

  <style>
    /* Make iframe full screen */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
    }
    iframe {
      border: none;
      width: 100%;
      height: 100%;
    }
  </style>

  <script>
    // Block right-click
    document.addEventListener("contextmenu", function (e) {
      e.preventDefault();
    });
  </script>
</head>
<body>

  <iframe src="https://f1608kpwc730-d.space.z.ai/" allowfullscreen></iframe>

</body>
</html>
