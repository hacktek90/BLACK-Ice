<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bento Player (No Scripts)</title>
    
    <style>
        :root {
            --bg: #0f1115;
            --card-bg: #1c1f26;
            --text-main: #ffffff;
            --text-muted: #8b9bb4;
            --accent: #6366f1;
            --border: 1px solid rgba(255, 255, 255, 0.08);
            --radius: 20px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 20px;
            min-height: 100vh;
        }

        .bento-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            max-width: 1000px;
            margin: 0 auto;
        }

        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 20px;
            border: var(--border);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        /* SVG Icon styling */
        .icon {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        /* PLAYER AREA */
        .area-player {
            grid-column: span 3;
            grid-row: span 2;
            min-height: 300px;
        }

        .track-meta h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 4px; }
        .track-meta p { color: var(--text-muted); font-size: 0.9rem; }

        #waveform {
            width: 100%;
            height: 100px;
            margin: 10px 0 20px 0;
            border-radius: 8px;
            opacity: 0.9;
        }

        /* CONTROLS - FIXED */
        .transport-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 24px;
            margin-top: auto;
            width: 100%;
            padding-bottom: 5px;
            z-index: 10;
        }

        .btn-circle {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.1);
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
        }
        
        .btn-circle:active { transform: scale(0.95); }

        .btn-play {
            width: 72px;
            height: 72px;
            background: var(--accent);
            border: none;
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.4);
        }
        
        .btn-play .icon { width: 32px; height: 32px; }

        /* OTHER AREAS */
        .area-playlist { grid-column: span 1; grid-row: span 3; background: #15171c; max-height: 600px; }
        .area-eq { grid-column: span 1; }
        .area-tools { grid-column: span 1; }
        .area-upload { grid-column: span 1; }

        .upload-container { display: flex; flex-direction: column; gap: 10px; height: 100%; }

        .file-drop {
            border: 2px dashed rgba(255,255,255,0.15);
            border-radius: 12px;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-size: 0.8rem;
            cursor: pointer;
            padding: 10px;
            background: rgba(255,255,255,0.02);
        }

        .url-input-group {
            display: flex;
            gap: 8px;
            background: rgba(0,0,0,0.2);
            padding: 4px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .url-input {
            flex: 1;
            background: transparent;
            border: none;
            color: white;
            padding: 8px;
            font-size: 0.85rem;
            outline: none;
            min-width: 0;
        }

        .btn-url {
            background: rgba(255,255,255,0.1);
            border: none;
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Sliders */
        .control-group { margin-bottom: 12px; }
        .control-label { display: flex; justify-content: space-between; font-size: 0.7rem; color: var(--text-muted); margin-bottom: 5px; }
        input[type="range"] { width: 100%; height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; appearance: none; }
        input[type="range"]::-webkit-slider-thumb { appearance: none; width: 12px; height: 12px; border-radius: 50%; background: var(--accent); cursor: pointer; }

        /* Playlist */
        .playlist-list { list-style: none; overflow-y: auto; flex: 1; }
        .playlist-item { padding: 10px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 10px; margin-bottom: 5px; transition: background 0.2s; }
        .playlist-item:hover { background: rgba(255,255,255,0.05); }
        .playlist-item.active { background: rgba(99, 102, 241, 0.15); border: 1px solid rgba(99, 102, 241, 0.3); }

        @media (max-width: 768px) {
            .bento-container { display: flex; flex-direction: column; gap: 12px; }
            .area-player { order: 1; min-height: auto; position: sticky; top: 0; z-index: 100; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
            .area-playlist { order: 2; max-height: 250px; }
            .area-eq, .area-tools, .area-upload { order: 3; }
        }
    </style>
</head>
<body>

    <div class="bento-container">
        <!-- PLAYER -->
        <div class="card area-player">
            <div class="card-header">
                <svg class="icon" viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
                Now Playing
            </div>
            
            <div class="track-meta">
                <h1 id="mainTitle">Select a Track</h1>
                <p id="mainArtist">Library Empty</p>
            </div>

            <div id="waveform"></div>

            <div class="transport-controls">
                <!-- PREV SVG -->
                <button class="btn-circle" id="prevBtn" title="Previous">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
                </button>
                
                <!-- PLAY SVG -->
                <button class="btn-circle btn-play" id="playBtn" title="Play">
                    <!-- Default Play Icon -->
                    <svg class="icon" id="iconPlay" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                    <!-- Pause Icon (Hidden by default) -->
                    <svg class="icon" id="iconPause" viewBox="0 0 24 24" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                </button>

                <!-- NEXT SVG -->
                <button class="btn-circle" id="nextBtn" title="Next">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                </button>
            </div>
        </div>

        <!-- PLAYLIST -->
        <div class="card area-playlist">
            <div class="card-header">
                <svg class="icon" viewBox="0 0 24 24"><path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/></svg>
                Queue
            </div>
            <ul class="playlist-list" id="playlistContainer"></ul>
        </div>

        <!-- EQ -->
        <div class="card area-eq">
            <div class="card-header">
                <svg class="icon" viewBox="0 0 24 24"><path d="M3 17v2h6v-2H3zM3 5v2h10V5H3zm10 16v-2h8v-2h-8v-2h-2v6h2zM7 9v2H3v2h4v2h2V9H7zm14 4v-2H11v2h10zm-6-4h2V7h4V5h-4V3h-2v6z"/></svg>
                EQ
            </div>
            <div class="control-group">
                <div class="control-label"><span>Bass</span> <span>Boost</span></div>
                <input type="range" id="bassSlider" min="0" max="20" value="0">
            </div>
             <div class="control-group">
                <div class="control-label"><span>Treble</span> <span>High</span></div>
                <input type="range" id="trebleSlider" min="0" max="20" value="0">
            </div>
        </div>

        <!-- TOOLS -->
        <div class="card area-tools">
            <div class="card-header">
                <svg class="icon" viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L3.16 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
                Tools
            </div>
            <div class="control-group">
                <div class="control-label"><span>Speed</span> <span id="speedVal">1.0x</span></div>
                <input type="range" id="speedSlider" min="0.5" max="2" step="0.1" value="1">
            </div>
        </div>

        <!-- UPLOAD -->
        <div class="card area-upload">
            <div class="card-header">
                <svg class="icon" viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
                Add Music
            </div>
            <div class="upload-container">
                <label class="file-drop">
                    <svg class="icon" viewBox="0 0 24 24" style="width:24px; height:24px; margin-bottom:5px;"><path d="M9 16h6v-6h4l-7-7-7 7h4zm-4 2h14v2H5z"/></svg>
                    <span>Upload File</span>
                    <input type="file" id="fileInput" accept="audio/*" hidden>
                </label>
                <div class="url-input-group">
                    <input type="text" class="url-input" id="urlInput" placeholder="Paste Audio URL...">
                    <button class="btn-url" id="loadUrlBtn">
                        <svg class="icon" viewBox="0 0 24 24"><path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/></svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- SCRIPT -->
    <script type="module">
        import WaveSurfer from 'https://unpkg.com/wavesurfer.js@7/dist/wavesurfer.esm.js';

        // Same Playlist Logic
        let playlist = [
            { title: "Demo Track", artist: "WaveSurfer", url: "https://wavesurfer.xyz/wavesurfer-code/examples/audio/demo.wav" },
            { title: "Stereo Test", artist: "System", url: "https://wavesurfer.xyz/wavesurfer-code/examples/audio/stereo.mp3" }
        ];
        let currentTrackIndex = 0;

        const wavesurfer = WaveSurfer.create({
            container: '#waveform',
            waveColor: '#6b7280',
            progressColor: '#6366f1',
            cursorColor: '#ffffff',
            barWidth: 2, barGap: 3, barRadius: 2, height: 100,
            normalize: true,
            backend: 'WebAudio',
        });

        // Filters
        let audioContext, bassFilter, trebleFilter;
        wavesurfer.on('ready', () => {
             if (!wavesurfer.backend) return;
             audioContext = wavesurfer.backend.ac;
             bassFilter = audioContext.createBiquadFilter();
             bassFilter.type = 'lowshelf'; bassFilter.frequency.value = 200;
             trebleFilter = audioContext.createBiquadFilter();
             trebleFilter.type = 'highshelf'; trebleFilter.frequency.value = 2000;
             wavesurfer.backend.disconnectFilters();
             wavesurfer.setFilters([bassFilter, trebleFilter]);
        });

        // Toggle SVG Icons on Play/Pause
        const iconPlay = document.getElementById('iconPlay');
        const iconPause = document.getElementById('iconPause');

        wavesurfer.on('play', () => {
            iconPlay.style.display = 'none';
            iconPause.style.display = 'block';
        });
        wavesurfer.on('pause', () => {
            iconPlay.style.display = 'block';
            iconPause.style.display = 'none';
        });

        document.getElementById('playBtn').onclick = () => wavesurfer.playPause();

        const loadTrack = (idx) => {
            if(idx < 0 || idx >= playlist.length) return;
            currentTrackIndex = idx;
            document.getElementById('mainTitle').textContent = playlist[idx].title;
            document.getElementById('mainArtist').textContent = playlist[idx].artist;
            renderPlaylist();
            wavesurfer.load(playlist[idx].url);
        };

        const renderPlaylist = () => {
            const list = document.getElementById('playlistContainer');
            list.innerHTML = '';
            playlist.forEach((track, i) => {
                const li = document.createElement('li');
                li.className = `playlist-item ${i === currentTrackIndex ? 'active' : ''}`;
                li.innerHTML = `<span>${i+1}</span> <span style="flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${track.title}</span>`;
                li.onclick = () => { loadTrack(i); wavesurfer.once('ready', () => wavesurfer.play()); };
                list.appendChild(li);
            });
        };

        document.getElementById('nextBtn').onclick = () => {
            let next = currentTrackIndex + 1;
            if (next < playlist.length) { loadTrack(next); wavesurfer.once('ready', () => wavesurfer.play()); }
        };
        document.getElementById('prevBtn').onclick = () => {
            if (currentTrackIndex > 0) { loadTrack(currentTrackIndex - 1); wavesurfer.once('ready', () => wavesurfer.play()); }
        };

        // Inputs
        document.getElementById('bassSlider').oninput = (e) => { if(bassFilter) bassFilter.gain.value = e.target.value; };
        document.getElementById('trebleSlider').oninput = (e) => { if(trebleFilter) trebleFilter.gain.value = e.target.value; };
        document.getElementById('speedSlider').oninput = (e) => { 
            wavesurfer.setPlaybackRate(parseFloat(e.target.value));
            document.getElementById('speedVal').textContent = e.target.value + 'x';
        };

        document.getElementById('fileInput').onchange = function() {
            if(this.files[0]) {
                const url = URL.createObjectURL(this.files[0]);
                playlist.push({ title: this.files[0].name, artist: "Local File", url: url });
                renderPlaylist();
                loadTrack(playlist.length - 1);
                wavesurfer.once('ready', () => wavesurfer.play());
            }
        };

        const loadFromUrl = () => {
            const url = document.getElementById('urlInput').value.trim();
            if(url) {
                playlist.push({ title: "Stream URL", artist: "Network", url: url });
                renderPlaylist();
                loadTrack(playlist.length - 1);
                wavesurfer.once('ready', () => wavesurfer.play());
                document.getElementById('urlInput').value = '';
            }
        };
        document.getElementById('loadUrlBtn').onclick = loadFromUrl;
        document.getElementById('urlInput').onkeydown = (e) => { if(e.key === 'Enter') loadFromUrl(); };

        loadTrack(0);
    </script>
</body>
</html>
