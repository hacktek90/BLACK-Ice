<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Swiss Minimal Player</title>
    
    <style>
        :root {
            /* Swiss Minimal Palette */
            --bg: #ffffff;
            --card-bg: #ffffff;
            --text-main: #111111;
            --text-muted: #666666;
            
            /* Light Green Accents */
            --accent-light: #e8f5e9; /* Background green */
            --accent-main: #81c784;  /* Medium green */
            --accent-dark: #2e7d32;  /* Darker green for interaction */
            
            --border: 1px solid #e0e0e0;
            --radius: 0px; /* Sharp corners for Swiss style */
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            padding: 40px 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        .bento-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0; /* Closed grid for seamless lines */
            border: 1px solid #e0e0e0;
            max-width: 1000px;
            width: 100%;
            background: #fff;
        }

        .card {
            background: var(--card-bg);
            padding: 32px;
            border-right: var(--border);
            border-bottom: var(--border);
            position: relative;
            display: flex;
            flex-direction: column;
            transition: background 0.2s ease;
        }

        /* Remove border for last elements to keep grid clean */
        .card:nth-child(3n) { border-right: none; }
        .card:nth-last-child(-n+3) { border-bottom: none; }

        /* TYPOGRAPHY */
        .card-header {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 24px;
            border-bottom: 2px solid #000;
            padding-bottom: 8px;
            width: fit-content;
        }

        /* SVG Icon styling */
        .icon {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: square;
            stroke-linejoin: miter;
        }

        /* PLAYER AREA */
        .area-player {
            grid-column: span 2;
            grid-row: span 1;
            min-height: 320px;
            justify-content: space-between;
        }

        .track-meta { margin-bottom: 10px; }
        .track-meta h1 { 
            font-size: 2.5rem; 
            font-weight: 400; 
            margin-bottom: 4px; 
            letter-spacing: -1px;
            line-height: 1;
        }
        .track-meta p { 
            color: var(--text-muted); 
            font-size: 1rem; 
            font-weight: 300;
        }

        #waveform {
            width: 100%;
            height: 80px;
            margin: 20px 0;
        }

        /* CONTROLS */
        .transport-controls {
            display: flex;
            align-items: center;
            gap: 32px;
            margin-top: auto;
        }

        .btn-circle {
            width: 48px;
            height: 48px;
            border-radius: 50%; /* Circle for functional affordance */
            background: #fff;
            border: 1px solid #111;
            color: #111;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        
        .btn-circle:hover { background: #f0f0f0; }
        .btn-circle:active { transform: scale(0.95); }

        .btn-play {
            width: 64px;
            height: 64px;
            background: #111;
            border-color: #111;
            color: #fff;
        }
        
        .btn-play:hover { background: #333; }
        .btn-play .icon { stroke: #fff; fill: #fff; stroke-width: 0; } /* Fill icons for play button */

        /* OTHER AREAS */
        .area-playlist { grid-column: span 1; grid-row: span 2; max-height: 700px; overflow: hidden; }
        
        /* SCROLLBAR STYLING FOR PLAYLIST */
        .playlist-list { list-style: none; overflow-y: auto; flex: 1; padding-right: 5px; }
        .playlist-list::-webkit-scrollbar { width: 4px; }
        .playlist-list::-webkit-scrollbar-thumb { background: #ccc; }
        
        .playlist-item { 
            padding: 12px 0; 
            border-bottom: 1px solid #eee; 
            cursor: pointer; 
            display: flex; 
            align-items: baseline; 
            gap: 12px; 
            transition: color 0.2s; 
            font-size: 0.9rem;
        }
        .playlist-item:last-child { border-bottom: none; }
        .playlist-item:hover { color: var(--accent-dark); }
        .playlist-item.active { 
            color: var(--accent-dark); 
            font-weight: 700; 
            background-color: transparent; 
        }
        .playlist-item .track-num {
            font-variant-numeric: tabular-nums;
            color: #ccc;
            font-size: 0.8rem;
        }
        .playlist-item.active .track-num { color: var(--accent-dark); }

        .area-eq { grid-column: span 1; }
        .area-tools { grid-column: span 1; }
        .area-upload { grid-column: span 1; }

        /* UPLOAD & INPUTS */
        .upload-container { display: flex; flex-direction: column; gap: 20px; height: 100%; justify-content: center; }

        .file-drop {
            border: 1px dashed #ccc;
            padding: 30px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            background: #fafafa;
        }
        .file-drop:hover { border-color: var(--accent-dark); color: var(--accent-dark); background: var(--accent-light); }

        .url-input-group {
            display: flex;
            border-bottom: 1px solid #111;
            padding-bottom: 4px;
        }

        .url-input {
            flex: 1;
            background: transparent;
            border: none;
            color: #111;
            padding: 8px 0;
            font-size: 0.9rem;
            outline: none;
            font-family: inherit;
        }

        .btn-url {
            background: transparent;
            border: none;
            color: #111;
            cursor: pointer;
            padding: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-url:hover { color: var(--accent-dark); }

        /* SLIDERS */
        .control-group { margin-bottom: 24px; }
        .control-label { 
            display: flex; 
            justify-content: space-between; 
            font-size: 0.75rem; 
            font-weight: 700; 
            text-transform: uppercase; 
            margin-bottom: 12px; 
            letter-spacing: 0.5px;
        }
        
        input[type="range"] { 
            width: 100%; 
            height: 2px; 
            background: #eee; 
            border-radius: 0; 
            appearance: none; 
            cursor: pointer;
        }
        
        /* Custom Slider Thumb (Square/Minimal) */
        input[type="range"]::-webkit-slider-thumb { 
            appearance: none; 
            width: 12px; 
            height: 12px; 
            background: #111; 
            cursor: pointer; 
            transform: rotate(45deg); /* Diamond shape */
            border: 1px solid #fff;
            box-shadow: 0 0 0 1px #111;
        }

        @media (max-width: 768px) {
            body { padding: 0; }
            .bento-container { 
                display: flex; 
                flex-direction: column; 
                border: none;
            }
            .card { 
                border-right: none; 
                border-bottom: 1px solid #e0e0e0; 
                padding: 24px;
            }
            .area-player { min-height: auto; padding-bottom: 32px; }
            .area-playlist { max-height: 300px; border-right: none; }
            .track-meta h1 { font-size: 1.8rem; }
        }
    </style>
</head>
<body>

    <div class="bento-container">
        <!-- PLAYER -->
        <div class="card area-player">
            <div class="card-header">
                <svg class="icon" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>
                Now Playing
            </div>
            
            <div class="track-meta">
                <h1 id="mainTitle">Select a Track</h1>
                <p id="mainArtist">Library Empty</p>
            </div>

            <div id="waveform"></div>

            <div class="transport-controls">
                <!-- PREV SVG -->
                <button class="btn-circle" id="prevBtn" title="Previous">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
                </button>
                
                <!-- PLAY SVG -->
                <button class="btn-circle btn-play" id="playBtn" title="Play">
                    <!-- Default Play Icon -->
                    <svg class="icon" id="iconPlay" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                    <!-- Pause Icon (Hidden by default) -->
                    <svg class="icon" id="iconPause" viewBox="0 0 24 24" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                </button>

                <!-- NEXT SVG -->
                <button class="btn-circle" id="nextBtn" title="Next">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                </button>
            </div>
        </div>

        <!-- EQ -->
        <div class="card area-eq">
            <div class="card-header">
                <svg class="icon" viewBox="0 0 24 24"><path d="M3 17v2h6v-2H3zM3 5v2h10V5H3zm10 16v-2h8v-2h-8v-2h-2v6h2zM7 9v2H3v2h4v2h2V9H7zm14 4v-2H11v2h10zm-6-4h2V7h4V5h-4V3h-2v6z"/></svg>
                Equalizer
            </div>
            <div class="control-group">
                <div class="control-label"><span>Bass</span> <span>Boost</span></div>
                <input type="range" id="bassSlider" min="0" max="20" value="0">
            </div>
             <div class="control-group">
                <div class="control-label"><span>Treble</span> <span>High</span></div>
                <input type="range" id="trebleSlider" min="0" max="20" value="0">
            </div>
        </div>

        <!-- TOOLS -->
        <div class="card area-tools">
            <div class="card-header">
                <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                Tools
            </div>
            <div class="control-group">
                <div class="control-label"><span>Speed</span> <span id="speedVal">1.0x</span></div>
                <input type="range" id="speedSlider" min="0.5" max="2" step="0.1" value="1">
            </div>
        </div>

        <!-- UPLOAD -->
        <div class="card area-upload">
            <div class="card-header">
                <svg class="icon" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                Add Music
            </div>
            <div class="upload-container">
                <label class="file-drop">
                    <span style="font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; font-weight: 700;">Upload File</span>
                    <input type="file" id="fileInput" accept="audio/*" hidden>
                </label>
                <div class="url-input-group">
                    <input type="text" class="url-input" id="urlInput" placeholder="Paste Audio URL...">
                    <button class="btn-url" id="loadUrlBtn">
                        <svg class="icon" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                    </button>
                </div>
            </div>
        </div>

        <!-- PLAYLIST -->
        <div class="card area-playlist">
            <div class="card-header">
                <svg class="icon" viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
                Queue
            </div>
            <ul class="playlist-list" id="playlistContainer"></ul>
        </div>

    </div>

    <!-- SCRIPT -->
    <script type="module">
        import WaveSurfer from 'https://unpkg.com/wavesurfer.js@7/dist/wavesurfer.esm.js';

        let playlist = [
            { title: "Demo Track", artist: "WaveSurfer", url: "https://wavesurfer.xyz/wavesurfer-code/examples/audio/demo.wav" },
            { title: "Stereo Test", artist: "System", url: "https://wavesurfer.xyz/wavesurfer-code/examples/audio/stereo.mp3" }
        ];
        let currentTrackIndex = 0;

        const wavesurfer = WaveSurfer.create({
            container: '#waveform',
            // Swiss Colors
            waveColor: '#e8f5e9', // Very light green background wave
            progressColor: '#81c784', // Medium green progress
            cursorColor: '#333333', // Dark cursor
            barWidth: 3, 
            barGap: 3, 
            barRadius: 0, // Sharp bars
            height: 80,
            normalize: true,
            backend: 'WebAudio',
        });

        // Filters
        let audioContext, bassFilter, trebleFilter;
        wavesurfer.on('ready', () => {
             if (!wavesurfer.backend) return;
             audioContext = wavesurfer.backend.ac;
             bassFilter = audioContext.createBiquadFilter();
             bassFilter.type = 'lowshelf'; bassFilter.frequency.value = 200;
             trebleFilter = audioContext.createBiquadFilter();
             trebleFilter.type = 'highshelf'; trebleFilter.frequency.value = 2000;
             wavesurfer.backend.disconnectFilters();
             wavesurfer.setFilters([bassFilter, trebleFilter]);
        });

        const iconPlay = document.getElementById('iconPlay');
        const iconPause = document.getElementById('iconPause');

        wavesurfer.on('play', () => {
            iconPlay.style.display = 'none';
            iconPause.style.display = 'block';
        });
        wavesurfer.on('pause', () => {
            iconPlay.style.display = 'block';
            iconPause.style.display = 'none';
        });

        document.getElementById('playBtn').onclick = () => wavesurfer.playPause();

        const loadTrack = (idx) => {
            if(idx < 0 || idx >= playlist.length) return;
            currentTrackIndex = idx;
            document.getElementById('mainTitle').textContent = playlist[idx].title;
            document.getElementById('mainArtist').textContent = playlist[idx].artist;
            renderPlaylist();
            wavesurfer.load(playlist[idx].url);
        };

        const renderPlaylist = () => {
            const list = document.getElementById('playlistContainer');
            list.innerHTML = '';
            playlist.forEach((track, i) => {
                const li = document.createElement('li');
                li.className = `playlist-item ${i === currentTrackIndex ? 'active' : ''}`;
                
                // Minimalist list item formatting
                const num = i + 1 < 10 ? '0' + (i+1) : i+1;
                
                li.innerHTML = `
                    <span class="track-num">${num}</span> 
                    <span style="flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${track.title}</span>
                `;
                li.onclick = () => { loadTrack(i); wavesurfer.once('ready', () => wavesurfer.play()); };
                list.appendChild(li);
            });
        };

        document.getElementById('nextBtn').onclick = () => {
            let next = currentTrackIndex + 1;
            if (next < playlist.length) { loadTrack(next); wavesurfer.once('ready', () => wavesurfer.play()); }
        };
        document.getElementById('prevBtn').onclick = () => {
            if (currentTrackIndex > 0) { loadTrack(currentTrackIndex - 1); wavesurfer.once('ready', () => wavesurfer.play()); }
        };

        // Inputs
        document.getElementById('bassSlider').oninput = (e) => { if(bassFilter) bassFilter.gain.value = e.target.value; };
        document.getElementById('trebleSlider').oninput = (e) => { if(trebleFilter) trebleFilter.gain.value = e.target.value; };
        document.getElementById('speedSlider').oninput = (e) => { 
            wavesurfer.setPlaybackRate(parseFloat(e.target.value));
            document.getElementById('speedVal').textContent = e.target.value + 'x';
        };

        document.getElementById('fileInput').onchange = function() {
            if(this.files[0]) {
                const url = URL.createObjectURL(this.files[0]);
                playlist.push({ title: this.files[0].name, artist: "Local File", url: url });
                renderPlaylist();
                loadTrack(playlist.length - 1);
                wavesurfer.once('ready', () => wavesurfer.play());
            }
        };

        const loadFromUrl = () => {
            const url = document.getElementById('urlInput').value.trim();
            if(url) {
                playlist.push({ title: "Stream URL", artist: "Network", url: url });
                renderPlaylist();
                loadTrack(playlist.length - 1);
                wavesurfer.once('ready', () => wavesurfer.play());
                document.getElementById('urlInput').value = '';
            }
        };
        document.getElementById('loadUrlBtn').onclick = loadFromUrl;
        document.getElementById('urlInput').onkeydown = (e) => { if(e.key === 'Enter') loadFromUrl(); };

        loadTrack(0);
    </script>
</body>
</html>
