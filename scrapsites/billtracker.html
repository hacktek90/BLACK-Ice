<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BillTracker Pro – Bill Tracker, Expense Manager, and Payment Reminder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">

<style>
    :root {
        /* Swiss International Palette */
        --c-white: #ffffff;
        --c-black: #000000;
        --c-bg: #f2f2f2;
        --c-grid: #e0e0e0;
        
        /* Functional Colors */
        --c-accent: #0055FF;   /* Royal Blue */
        --c-success: #008844;  /* Fiscal Green */
        --c-warning: #FFCC00;  /* Alert Yellow */
        --c-error: #D00000;    /* Swiss Red */

        /* Spacing */
        --sp-xs: 0.5rem;
        --sp-sm: 1rem;
        --sp-md: 1.5rem;
        
        /* Typography */
        --font-main: "Inter Tight", sans-serif;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
        margin: 0;
        background-color: var(--c-bg);
        font-family: var(--font-main);
        color: var(--c-black);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    /* --- SWISS GRID LAYOUT --- */
    .app-wrapper {
        width: 100%;
        max-width: 1400px;
        display: grid;
        grid-template-columns: 1fr;
        background: var(--c-black); /* Grid Lines */
        gap: 1px;
        border-bottom: 1px solid var(--c-black);
    }

    @media (min-width: 900px) {
        .app-wrapper {
            grid-template-columns: 320px 1fr;
            min-height: 100vh;
            border-right: 1px solid var(--c-black);
            border-left: 1px solid var(--c-black);
        }
    }

    /* --- COMPONENTS --- */
    .panel {
        background: var(--c-white);
        padding: var(--sp-md);
        display: flex;
        flex-direction: column;
    }

    /* Typography */
    h1 { font-size: 1.25rem; font-weight: 800; letter-spacing: -0.02em; margin: 0 0 var(--sp-sm) 0; }
    h2 { font-size: 1rem; font-weight: 700; margin: 0 0 var(--sp-sm) 0; }
    .label { font-size: 0.7rem; text-transform: uppercase; font-weight: 700; color: #666; letter-spacing: 0.05em; margin-bottom: 0.4rem; display: block; }
    
    /* Stats */
    .stat-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: var(--sp-sm);
        margin-bottom: var(--sp-md);
    }
    .stat-item { border-left: 3px solid var(--c-black); padding-left: var(--sp-sm); }
    .stat-val { font-size: 1.5rem; font-weight: 700; line-height: 1.1; letter-spacing: -0.03em; }
    .stat-item.due { border-color: var(--c-accent); }
    .stat-item.overdue { border-color: var(--c-error); }

    /* Progress Bar */
    .progress-container {
        width: 100%;
        height: 8px;
        background: var(--c-bg);
        margin-bottom: var(--sp-md);
        position: relative;
    }
    .progress-fill {
        height: 100%;
        background: var(--c-success);
        width: 0%;
        transition: width 0.5s ease;
    }

    /* Buttons */
    .btn {
        background: var(--c-black);
        color: var(--c-white);
        border: none;
        padding: 14px;
        font-family: var(--font-main);
        font-weight: 600;
        font-size: 0.9rem;
        cursor: pointer;
        width: 100%;
        text-align: center;
        transition: transform 0.1s;
    }
    .btn:active { transform: scale(0.98); }
    .btn-outline { background: transparent; border: 1px solid var(--c-black); color: var(--c-black); }
    .btn-sm { padding: 8px 12px; font-size: 0.8rem; width: auto; }
    
    /* Toolbar */
    .toolbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: var(--sp-sm);
        padding-bottom: var(--sp-sm);
        border-bottom: 1px solid var(--c-bg);
    }

    /* Bill List */
    .bill-list { display: flex; flex-direction: column; }
    .bill-item {
        display: grid;
        grid-template-columns: auto 1fr auto;
        gap: var(--sp-sm);
        padding: var(--sp-sm) 0;
        border-bottom: 1px solid var(--c-grid);
        align-items: center;
    }
    @media (min-width: 600px) {
        .bill-item { grid-template-columns: 3.5rem 2fr 1fr 1fr 1fr auto; }
    }

    /* Date Square */
    .date-sq {
        width: 3.5rem; height: 3.5rem;
        background: var(--c-black); color: var(--c-white);
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        font-weight: 700; line-height: 1;
    }
    .date-sq span:first-child { font-size: 0.7rem; opacity: 0.7; text-transform: uppercase; }
    .date-sq span:last-child { font-size: 1.5rem; }
    .bill-item.paid .date-sq { background: var(--c-grid); color: #888; }
    .bill-item.paid { opacity: 0.6; }

    /* Badges */
    .badge { padding: 4px 8px; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; display: inline-block; background: #eee;}
    .badge.overdue { background: var(--c-error); color: white; }
    .badge.paid { background: var(--c-success); color: white; }
    .badge.due { background: var(--c-accent); color: white; }

    /* Inputs */
    .input-group { margin-bottom: var(--sp-sm); position: relative; }
    input, select {
        width: 100%; padding: 12px;
        border: 1px solid #ccc; border-radius: 0;
        font-family: var(--font-main); font-size: 1rem;
        background: white; appearance: none;
    }
    input:focus { outline: 2px solid var(--c-accent); border-color: transparent; }

    /* Actions */
    .action-icons { display: flex; gap: 10px; }
    .icon-btn {
        background: none; border: none; cursor: pointer; padding: 5px;
        color: #888; transition: color 0.2s;
    }
    .icon-btn:hover { color: var(--c-black); }
    .icon-btn.delete:hover { color: var(--c-error); }
    
    /* MODAL & CALCULATOR */
    .modal-overlay {
        position: fixed; top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(0,0,0,0.6); z-index: 100;
        display: none; align-items: center; justify-content: center;
        backdrop-filter: blur(2px);
    }
    .modal-overlay.active { display: flex; }
    
    .modal-box {
        background: white; width: 90%; max-width: 450px;
        padding: var(--sp-md); box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        animation: slideUp 0.3s ease;
    }

    /* Calculator Specifics */
    .calc-grid {
        display: grid; grid-template-columns: repeat(4, 1fr);
        gap: 1px; background: #ddd; border: 1px solid #ddd;
        margin-top: 10px;
    }
    .calc-btn {
        background: white; border: none; padding: 15px;
        font-size: 1.2rem; font-weight: 600; cursor: pointer;
    }
    .calc-btn:active { background: #eee; }
    .calc-btn.op { background: var(--c-bg); color: var(--c-accent); }
    .calc-btn.eq { background: var(--c-accent); color: white; grid-column: span 1; }
    .calc-screen {
        width: 100%; background: #222; color: #0f0;
        font-family: monospace; font-size: 1.5rem;
        padding: 15px; text-align: right; border: none;
    }

    @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .hidden-mobile { display: none; }
    @media(min-width:600px){ .hidden-mobile { display: block; } }

</style>
</head>
<body>

<div class="app-wrapper">
    
    <!-- Sidebar -->
    <aside class="panel">
        <h1>BILLTRACKER</h1>
        
        <div class="label">Financial Health</div>
        <div class="progress-container">
            <div class="progress-fill" id="progressBar"></div>
        </div>

        <div class="stat-row">
            <div class="stat-item due">
                <div class="label">To Pay</div>
                <div class="stat-val" id="valUnpaid">$0</div>
            </div>
            <div class="stat-item overdue">
                <div class="label">Overdue</div>
                <div class="stat-val" style="color:var(--c-error)" id="valOverdue">$0</div>
            </div>
        </div>

        <button class="btn" onclick="openModal()" style="margin-bottom: var(--sp-sm)">+ Add New Bill</button>
        <button class="btn btn-outline" onclick="exportCSV()">Download CSV</button>
        
        <div style="margin-top: auto; padding-top: var(--sp-md); font-size: 0.8rem; color: #888;">
            <p>Data stored locally in browser.</p>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="panel" style="overflow-y: auto;">
        <div class="toolbar">
            <h2>Your Bills</h2>
            <select id="filterSelect" onchange="renderBills()" style="width: auto; padding: 8px;">
                <option value="all">Show All</option>
                <option value="unpaid" selected>Unpaid</option>
                <option value="paid">Paid History</option>
            </select>
        </div>

        <div class="bill-list" id="billList">
            <!-- JS Injection -->
        </div>
    </main>

</div>

<!-- ADD/EDIT MODAL -->
<div class="modal-overlay" id="billModal">
    <div class="modal-box">
        <h2 id="modalTitle">New Bill</h2>
        <form id="billForm" onsubmit="saveBill(event)">
            <input type="hidden" id="billId">
            
            <div class="input-group">
                <label class="label">Bill Name</label>
                <input type="text" id="billName" required placeholder="e.g. Electricity">
            </div>

            <div class="input-group">
                <label class="label">Amount</label>
                <div style="display: flex; gap: 5px;">
                    <input type="number" step="0.01" id="billAmount" required placeholder="0.00">
                    <button type="button" class="btn-sm btn-outline" onclick="toggleCalculator()">
                        Calc
                    </button>
                </div>
            </div>

            <div class="input-group">
                <label class="label">Due Date</label>
                <input type="date" id="billDate" required>
            </div>

            <div class="input-group">
                <label class="label">Details</label>
                <div style="display: flex; gap: 10px; align-items: center;">
                    <select id="billCategory" style="flex:1">
                        <option value="Housing">Housing</option>
                        <option value="Utilities">Utilities</option>
                        <option value="Debt">Debt</option>
                        <option value="Sub">Subscription</option>
                    </select>
                    <label style="font-size: 0.8rem; display: flex; align-items: center; gap: 5px;">
                        <input type="checkbox" id="billRecurring" style="width: auto;"> Monthly
                    </label>
                </div>
            </div>

            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button type="button" class="btn btn-outline" onclick="closeModal()">Cancel</button>
                <button type="submit" class="btn" style="background: var(--c-accent);">Save Bill</button>
            </div>
        </form>
    </div>
</div>

<!-- CALCULATOR MODAL -->
<div class="modal-overlay" id="calcModal">
    <div class="modal-box" style="max-width: 300px;">
        <div style="display:flex; justify-content:space-between; margin-bottom: 10px;">
            <span class="label">Quick Calculator</span>
            <button onclick="closeCalc()" style="border:none; background:none; font-size:1.2rem;">&times;</button>
        </div>
        <div class="calc-screen" id="calcScreen">0</div>
        <div class="calc-grid">
            <button class="calc-btn" onclick="calcInput('7')">7</button>
            <button class="calc-btn" onclick="calcInput('8')">8</button>
            <button class="calc-btn" onclick="calcInput('9')">9</button>
            <button class="calc-btn op" onclick="calcOp('/')">÷</button>
            
            <button class="calc-btn" onclick="calcInput('4')">4</button>
            <button class="calc-btn" onclick="calcInput('5')">5</button>
            <button class="calc-btn" onclick="calcInput('6')">6</button>
            <button class="calc-btn op" onclick="calcOp('*')">&times;</button>
            
            <button class="calc-btn" onclick="calcInput('1')">1</button>
            <button class="calc-btn" onclick="calcInput('2')">2</button>
            <button class="calc-btn" onclick="calcInput('3')">3</button>
            <button class="calc-btn op" onclick="calcOp('-')">-</button>
            
            <button class="calc-btn" onclick="calcInput('0')">0</button>
            <button class="calc-btn" onclick="calcInput('.')">.</button>
            <button class="calc-btn" onclick="calcClear()">C</button>
            <button class="calc-btn op" onclick="calcOp('+')">+</button>
        </div>
        <button class="btn" style="margin-top: 10px; background: var(--c-success);" onclick="useCalcResult()">Use Result</button>
    </div>
</div>

<script>
    // --- STATE ---
    let bills = JSON.parse(localStorage.getItem('bills_v2')) || [];
    let currentCalc = '0';
    let editModeId = null;

    // --- DOM ---
    const listEl = document.getElementById('billList');
    const modal = document.getElementById('billModal');
    const calcModal = document.getElementById('calcModal');
    const form = document.getElementById('billForm');

    // --- INIT ---
    window.onload = () => { renderBills(); updateStats(); };

    // --- CRUD ---
    function openModal(id = null) {
        modal.classList.add('active');
        if (id) {
            // Edit Mode
            const b = bills.find(x => x.id === id);
            editModeId = id;
            document.getElementById('modalTitle').innerText = 'Edit Bill';
            document.getElementById('billName').value = b.name;
            document.getElementById('billAmount').value = b.amount;
            document.getElementById('billDate').value = b.date;
            document.getElementById('billCategory').value = b.category;
            document.getElementById('billRecurring').checked = b.recurring || false;
        } else {
            // Add Mode
            editModeId = null;
            document.getElementById('modalTitle').innerText = 'New Bill';
            form.reset();
            document.getElementById('billDate').valueAsDate = new Date();
        }
    }

    function closeModal() {
        modal.classList.remove('active');
    }

    function saveBill(e) {
        e.preventDefault();
        const data = {
            id: editModeId || Date.now(),
            name: document.getElementById('billName').value,
            amount: parseFloat(document.getElementById('billAmount').value),
            date: document.getElementById('billDate').value,
            category: document.getElementById('billCategory').value,
            recurring: document.getElementById('billRecurring').checked,
            paid: editModeId ? bills.find(x => x.id === editModeId).paid : false
        };

        if (editModeId) {
            bills = bills.map(b => b.id === editModeId ? data : b);
        } else {
            bills.push(data);
        }

        localStorage.setItem('bills_v2', JSON.stringify(bills));
        closeModal();
        renderBills();
        updateStats();
    }

    function deleteBill(id) {
        if(confirm('Delete this bill forever?')) {
            bills = bills.filter(b => b.id !== id);
            localStorage.setItem('bills_v2', JSON.stringify(bills));
            renderBills();
            updateStats();
        }
    }

    function togglePaid(id) {
        const b = bills.find(x => x.id === id);
        b.paid = !b.paid;
        localStorage.setItem('bills_v2', JSON.stringify(bills));
        renderBills();
        updateStats();
    }

    // --- RENDER ---
    function renderBills() {
        const filter = document.getElementById('filterSelect').value;
        listEl.innerHTML = '';
        
        let sorted = [...bills].sort((a,b) => new Date(a.date) - new Date(b.date));
        
        if (filter === 'unpaid') sorted = sorted.filter(b => !b.paid);
        if (filter === 'paid') sorted = sorted.filter(b => b.paid);

        if (sorted.length === 0) {
            listEl.innerHTML = '<div style="padding:20px; text-align:center; color:#999;">No bills found.</div>';
            return;
        }

        sorted.forEach(b => {
            const d = new Date(b.date + 'T00:00:00');
            const day = d.getDate();
            const month = d.toLocaleString('default', {month:'short'});
            
            // Status Logic
            const today = new Date(); today.setHours(0,0,0,0);
            const isOverdue = !b.paid && d < today;
            const isDueToday = !b.paid && d.getTime() === today.getTime();
            
            let statusBadge = '';
            if(b.paid) statusBadge = '<span class="badge paid">PAID</span>';
            else if(isOverdue) statusBadge = '<span class="badge overdue">OVERDUE</span>';
            else if(isDueToday) statusBadge = '<span class="badge due">TODAY</span>';

            const html = `
                <div class="bill-item ${b.paid ? 'paid' : ''}">
                    <div class="date-sq">
                        <span>${month}</span>
                        <span>${day}</span>
                    </div>
                    
                    <div style="padding: 0 10px;">
                        <div style="font-weight:700;">${b.name}</div>
                        <div style="font-size:0.8rem; color:#666;">
                            ${b.category} ${b.recurring ? '• ↻ Monthly' : ''}
                        </div>
                        <div class="hidden-mobile" style="margin-top:4px;">${statusBadge}</div>
                    </div>

                    <div style="font-weight:700; text-align:right;">
                        $${b.amount.toFixed(2)}
                    </div>

                    <div class="action-icons" style="justify-content: flex-end; padding-left: 10px;">
                        <button class="icon-btn" onclick="togglePaid(${b.id})">
                            ${b.paid ? '↩' : '✓'}
                        </button>
                        <button class="icon-btn" onclick="openModal(${b.id})">✎</button>
                        <button class="icon-btn delete" onclick="deleteBill(${b.id})">&times;</button>
                    </div>
                </div>
            `;
            listEl.insertAdjacentHTML('beforeend', html);
        });
    }

    function updateStats() {
        const total = bills.reduce((acc, b) => acc + b.amount, 0);
        const paid = bills.filter(b => b.paid).reduce((acc, b) => acc + b.amount, 0);
        const unpaid = total - paid;
        
        const today = new Date(); today.setHours(0,0,0,0);
        const overdue = bills
            .filter(b => !b.paid && new Date(b.date+'T00:00:00') < today)
            .reduce((acc, b) => acc + b.amount, 0);

        document.getElementById('valUnpaid').innerText = '$' + unpaid.toFixed(0);
        document.getElementById('valOverdue').innerText = '$' + overdue.toFixed(0);
        
        // Progress Bar
        const pct = total === 0 ? 0 : (paid / total) * 100;
        document.getElementById('progressBar').style.width = pct + '%';
    }

    function exportCSV() {
        let csv = "Name,Amount,Date,Category,Status\n";
        bills.forEach(b => {
            csv += `${b.name},${b.amount},${b.date},${b.category},${b.paid ? 'Paid' : 'Unpaid'}\n`;
        });
        const blob = new Blob([csv], { type: 'text/csv' });
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'bills_backup.csv';
        a.click();
    }

    // --- CALCULATOR LOGIC ---
    function toggleCalculator() { calcModal.classList.add('active'); }
    function closeCalc() { calcModal.classList.remove('active'); calcClear(); }
    
    function calcInput(val) {
        if(currentCalc === '0') currentCalc = val;
        else currentCalc += val;
        updateCalcScreen();
    }
    
    function calcOp(op) {
        if ("+-*/".includes(currentCalc.slice(-1))) return; 
        currentCalc += op;
        updateCalcScreen();
    }
    
    function calcClear() { currentCalc = '0'; updateCalcScreen(); }
    
    function updateCalcScreen() {
        document.getElementById('calcScreen').innerText = currentCalc;
    }

    function useCalcResult() {
        try {
            // Safer eval alternative for simple math
            const result = Function('"use strict";return (' + currentCalc + ')')();
            document.getElementById('billAmount').value = parseFloat(result).toFixed(2);
            closeCalc();
        } catch (e) {
            document.getElementById('calcScreen').innerText = "Err";
            setTimeout(calcClear, 1000);
        }
    }
</script>
</body>
</html>
