<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon | Brand Name</title>
    <style>
        /* --- CSS Reset & Base Styles --- */
        :root {
            --bg-color: #fcfcfc;
            --text-main: #1a1a1a;
            --text-muted: #666666;
            --accent: #2d2d2d;
            --radius: 8px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            line-height: 1.5;
        }

        .container {
            max-width: 580px;
            width: 100%;
            text-align: center;
            animation: fadeIn 1s ease-out;
        }

        /* --- Typography --- */
        h1 {
            font-size: 3.5rem;
            font-weight: 800;
            letter-spacing: -0.04em;
            margin-bottom: 1rem;
            line-height: 1.1;
        }

        p.subtitle {
            font-size: 1.125rem;
            color: var(--text-muted);
            margin-bottom: 2.5rem;
            font-weight: 400;
            max-width: 480px;
            margin-left: auto;
            margin-right: auto;
        }

        /* --- Input Form --- */
        .newsletter-form {
            display: flex;
            gap: 12px;
            margin-bottom: 2.5rem; /* Increased margin to separate from home button */
            flex-wrap: wrap;
            justify-content: center;
        }

        input[type="email"] {
            flex: 1;
            min-width: 260px;
            padding: 14px 18px;
            font-size: 1rem;
            border: 1px solid #e0e0e0;
            border-radius: var(--radius);
            background: #fff;
            outline: none;
            transition: all 0.2s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }

        input[type="email"]:focus {
            border-color: var(--text-main);
            box-shadow: 0 0 0 3px rgba(0,0,0,0.05);
        }

        button.primary-btn {
            padding: 14px 28px;
            font-size: 1rem;
            font-weight: 600;
            color: #fff;
            background-color: var(--accent);
            border: none;
            border-radius: var(--radius);
            cursor: pointer;
            transition: transform 0.1s ease, opacity 0.2s;
        }

        button.primary-btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        /* --- New Home Action Section --- */
        .home-action {
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid #eaeaea; /* Subtle separator line */
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .home-msg {
            font-size: 0.9rem;
            color: #999;
            margin: 0;
        }

        .btn-home {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: var(--text-main);
            font-weight: 500;
            font-size: 0.95rem;
            padding: 10px 20px;
            border: 1px solid #e0e0e0;
            border-radius: 50px; /* Pill shape for distinction */
            background-color: transparent;
            transition: all 0.2s ease;
        }

        .btn-home:hover {
            background-color: #f5f5f5;
            border-color: #d0d0d0;
        }

        /* --- Footer --- */
        footer {
            margin-top: 3rem;
            font-size: 0.85rem;
            color: #ccc;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 600px) {
            h1 { font-size: 2.5rem; }
            button.primary-btn { width: 100%; }
        }
    </style>
</head>
<body>

    <div class="container">
        
        <h1>We’re nearly there.</h1>
        
        <p class="subtitle">
            We are building a new digital experience. Join the waitlist to get early access and updates before anyone else.
        </p>

        <form class="newsletter-form" onsubmit="event.preventDefault(); alert('Thanks for subscribing!');">
            <input type="email" placeholder="email@example.com" required aria-label="Email Address">
            <button type="submit" class="primary-btn">Notify Me</button>
        </form>

        <!-- New Secondary Action -->
        <div class="home-action">
            <p class="home-msg">For now, tap the Home Button</p>
           
        </div>

    </div>

   

</body>
</html>
