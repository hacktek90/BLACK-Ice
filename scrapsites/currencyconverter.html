<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- SEO & Social Media Meta Tags -->
    <title>Pro Currency Converter - Live Rates & Trends</title>
    <meta name="description" content="A professional, free currency converter with real-time rates for 200+ currencies. Includes historical trend charts, crypto support.">
    <meta name="keywords" content="currency converter, exchange rates, forex, crypto converter, USD to EUR, live rates">
    
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.4);
            --secondary: #ec4899;
            --bg-dark: #0f172a;
            --glass-bg: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success: #10b981;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Animated Background Blobs */
        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: -1;
            animation: float 10s infinite ease-in-out;
            opacity: 0.6;
        }
        .blob-1 { top: -10%; left: -10%; width: 500px; height: 500px; background: var(--primary); animation-delay: 0s; }
        .blob-2 { bottom: -10%; right: -10%; width: 400px; height: 400px; background: var(--secondary); animation-delay: 2s; }
        .blob-3 { top: 40%; left: 40%; width: 300px; height: 300px; background: #8b5cf6; animation-delay: 4s; }

        @keyframes float {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(30px, -30px); }
        }

        /* Main Glassmorphism Card */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 2.5rem;
            width: 100%;
            max-width: 900px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        header { text-align: center; margin-bottom: 2rem; }
        header h1 { font-size: 2rem; font-weight: 700; background: linear-gradient(to right, #fff, #cbd5e1); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 0.5rem; }
        header p { color: var(--text-muted); font-size: 0.95rem; }

        /* Grid Layout */
        .converter-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
            margin-bottom: 2rem;
        }

        @media (min-width: 768px) {
            .converter-grid { grid-template-columns: 1fr auto 1fr; align-items: end; }
        }

        /* Input Groups */
        .group { display: flex; flex-direction: column; gap: 0.5rem; }
        .label { font-size: 0.85rem; color: var(--text-muted); font-weight: 500; text-transform: uppercase; letter-spacing: 1px; }

        .input-box {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 1rem;
            transition: all 0.3s ease;
            position: relative;
        }
        .input-box:focus-within { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2); }

        .amount-input {
            width: 100%;
            background: transparent;
            border: none;
            color: white;
            font-size: 2rem;
            font-weight: 600;
            outline: none;
            font-family: 'Outfit', sans-serif;
            margin-bottom: 0.5rem;
        }
        .amount-input::placeholder { color: rgba(255,255,255,0.2); }

        /* --- IMPROVED DROPDOWN BUTTON STYLING --- */
        .select-wrapper {
            position: relative;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 0.5rem 0.5rem 0.5rem 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .select-wrapper:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .select-wrapper:focus-within {
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2);
        }

        .currency-select {
            width: 100%;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            outline: none;
            appearance: none; /* Hide default arrow */
            padding-right: 25px; /* Space for icon */
            font-family: 'Outfit', sans-serif;
        }
        
        /* Option styling (works in some browsers) */
        .currency-select option {
            background-color: #1e293b;
            color: white;
            padding: 10px;
        }

        .select-icon {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            pointer-events: none;
            font-size: 1.2rem;
            transition: transform 0.2s;
        }

        .select-wrapper:hover .select-icon {
            color: white;
            transform: translateY(-50%) scale(1.1);
        }

        /* Swap Button */
        .swap-wrapper { display: flex; justify-content: center; align-items: center; padding-bottom: 10px; }
        .swap-btn {
            background: linear-gradient(135deg, var(--primary), #4f46e5);
            border: none;
            width: 50px; height: 50px;
            border-radius: 50%;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            box-shadow: 0 10px 15px -3px rgba(99, 102, 241, 0.4);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: flex; align-items: center; justify-content: center;
        }
        .swap-btn:hover { transform: rotate(180deg) scale(1.1); }
        .swap-btn:active { transform: rotate(180deg) scale(0.95); }

        /* Result Section */
        .result-section {
            background: linear-gradient(135deg, rgba(255,255,255,0.05), rgba(255,255,255,0.01));
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 2rem;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        
        .result-label { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 0.5rem; }
        
        .result-display {
            font-size: 3.5rem;
            font-weight: 700;
            color: white;
            text-shadow: 0 0 20px var(--primary-glow);
            margin-bottom: 0.5rem;
            line-height: 1.1;
            font-feature-settings: "tnum";
            font-variant-numeric: tabular-nums;
        }

        .result-actions {
            display: flex; justify-content: center; gap: 1rem; margin-top: 1rem;
        }

        .tool-btn {
            background: rgba(255,255,255,0.1);
            border: 1px solid var(--glass-border);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
            display: flex; align-items: center; gap: 5px;
        }
        .tool-btn:hover { background: rgba(255,255,255,0.2); }

        /* Quick Chips */
        .quick-chips {
            display: flex; gap: 0.5rem; justify-content: center; margin-top: 1.5rem; flex-wrap: wrap;
        }
        .chip {
            background: rgba(99, 102, 241, 0.1);
            border: 1px solid rgba(99, 102, 241, 0.3);
            color: var(--primary);
            padding: 0.4rem 1rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .chip:hover { background: var(--primary); color: white; transform: translateY(-2px); }

        /* Chart Section */
        .chart-container {
            margin-top: 2rem;
            background: rgba(15, 23, 42, 0.4);
            border-radius: 16px;
            padding: 1rem;
            height: 250px;
            position: relative;
        }

        /* Loader */
        .loader-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.8);
            display: flex; justify-content: center; align-items: center;
            border-radius: 24px;
            z-index: 10;
            opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        .loader-overlay.active { opacity: 1; pointer-events: all; }
        .spinner {
            width: 40px; height: 40px; border: 4px solid rgba(255,255,255,0.1);
            border-top-color: var(--primary); border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Responsive Tweaks */
        @media (max-width: 600px) {
            .result-display { font-size: 2.5rem; }
            .glass-card { padding: 1.5rem; }
            .swap-btn { width: 40px; height: 40px; font-size: 1.2rem; }
        }
    </style>
</head>
<body>

    <!-- Background Effects -->
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>

    <!-- Main Application -->
    <main class="glass-card">
        
        <header>
            <h1>Global Exchange</h1>
            <p>Real-time market data & trend analysis</p>
        </header>

        <!-- Loader Overlay -->
        <div class="loader-overlay" id="loader">
            <div class="spinner"></div>
        </div>

        <!-- Converter Grid -->
        <div class="converter-grid">
            
            <!-- From Column -->
            <div class="group">
                <div class="label">You Send</div>
                <div class="input-box">
                    <input type="number" id="amount" class="amount-input" value="1" min="0" step="any">
                    
                    <!-- IMPROVED DROPDOWN BUTTON STRUCTURE -->
                    <div class="select-wrapper">
                        <select id="fromCurrency" class="currency-select">
                            <option value="usd">USD - US Dollar</option>
                        </select>
                        <i class="ri-arrow-down-s-line select-icon"></i>
                    </div>
                </div>
            </div>

            <!-- Swap Column -->
            <div class="swap-wrapper">
                <button class="swap-btn" id="swapBtn" title="Swap Currencies">
                    <i class="ri-arrow-left-right-line"></i>
                </button>
            </div>

            <!-- To Column -->
            <div class="group">
                <div class="label">They Get</div>
                <div class="input-box">
                    <div id="resultDisplay" class="result-display" style="font-size: 1.5rem; margin:0; min-height: 3rem;">...</div>
                    
                    <!-- IMPROVED DROPDOWN BUTTON STRUCTURE -->
                    <div class="select-wrapper">
                        <select id="toCurrency" class="currency-select">
                            <option value="eur">EUR - Euro</option>
                        </select>
                        <i class="ri-arrow-down-s-line select-icon"></i>
                    </div>
                </div>
            </div>

        </div>

        <!-- Quick Actions -->
        <div class="quick-chips">
            <button class="chip" onclick="setAmount(10)">$10</button>
            <button class="chip" onclick="setAmount(50)">$50</button>
            <button class="chip" onclick="setAmount(100)">$100</button>
            <button class="chip" onclick="setAmount(1000)">$1k</button>
            <button class="chip" onclick="setAmount(5000)">$5k</button>
        </div>

        <!-- Detailed Result & Tools -->
        <div class="result-section" style="margin-top: 2rem;">
            <div class="result-label">Total Conversion</div>
            <div class="result-display" id="mainResult">0.00</div>
            <div style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1rem;" id="rateInfo">1 USD = 0.92 EUR</div>
            
            <div class="result-actions">
                <button class="tool-btn" onclick="copyResult()">
                    <i class="ri-file-copy-line"></i> Copy
                </button>
                <button class="tool-btn" onclick="invertRate()">
                    <i class="ri-refresh-line"></i> Invert
                </button>
            </div>
        </div>

        <!-- Unique Tool: 7-Day Trend Chart -->
        <div class="chart-container">
            <canvas id="trendChart"></canvas>
        </div>

    </main>

    <script>
        // --- Configuration ---
        const BASE_URL = "https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1";
        const FALLBACK_URL = "https://latest.currency-api.pages.dev/v1";
        
        // --- DOM Elements ---
        const amountInput = document.getElementById('amount');
        const fromSelect = document.getElementById('fromCurrency');
        const toSelect = document.getElementById('toCurrency');
        const swapBtn = document.getElementById('swapBtn');
        const resultDisplay = document.getElementById('resultDisplay');
        const mainResult = document.getElementById('mainResult');
        const rateInfo = document.getElementById('rateInfo');
        const loader = document.getElementById('loader');
        
        // --- State ---
        let currentRate = 0;
        let chartInstance = null;
        let cachedRates = {}; 
        const COMMON = ['usd', 'eur', 'gbp', 'jpy', 'aud', 'cad', 'chf', 'cny', 'inr', 'btc', 'eth'];

        // --- Initialization ---
        async function init() {
            showLoader(true);
            try {
                const currencies = await fetchWithFallback('/currencies.json');
                populateSelects(currencies);
                fromSelect.value = 'usd';
                toSelect.value = 'eur';
                await updateConverter();
            } catch (e) {
                console.error(e);
                alert("Failed to load currencies. Please check internet.");
            } finally {
                showLoader(false);
            }
        }

        // --- API Helper with Fallback ---
        async function fetchWithFallback(path) {
            try {
                const res = await fetch(`${BASE_URL}${path}`);
                if (!res.ok) throw new Error('Primary failed');
                return await res.json();
            } catch (e) {
                console.warn("Fawaz API Primary failed, trying Cloudflare fallback...");
                const res = await fetch(`${FALLBACK_URL}${path}`);
                if (!res.ok) throw new Error('Fallback failed');
                return await res.json();
            }
        }

        // --- Core Logic ---
        async function updateConverter() {
            const from = fromSelect.value;
            const to = toSelect.value;
            const amount = parseFloat(amountInput.value) || 0;

            if (from === to) {
                currentRate = 1;
                renderResult(amount, amount, "1");
                updateChart([], []);
                return;
            }

            try {
                const data = await fetchWithFallback(`/currencies/${from}.json`);
                const rates = data[from];
                currentRate = rates[to];
                const date = data.date;

                renderResult(amount, amount * currentRate, currentRate);
                rateInfo.textContent = `1 ${from.toUpperCase()} = ${currentRate.toFixed(5)} ${to.toUpperCase()} • ${date}`;
                
                fetchHistory(from, to, date);

            } catch (e) {
                console.error(e);
                mainResult.textContent = "Error";
            }
        }

        function renderResult(input, output, rate) {
            animateValue(mainResult, parseFloat(mainResult.innerText.replace(/,/g, '')) || 0, output, 800);
            resultDisplay.textContent = formatCurrency(output, toSelect.value);
        }

        function formatCurrency(num, code) {
            return new Intl.NumberFormat('en-US', {
                style: 'currency',
                currency: code.toUpperCase(),
                maximumFractionDigits: 2
            }).format(num);
        }

        // --- Chart Tool ---
        async function fetchHistory(from, to, currentDateStr) {
            const dates = [];
            const rates = [];
            let currentDate = new Date(currentDateStr);
            
            for (let i = 0; i < 5; i++) {
                const dateStr = currentDate.toISOString().split('T')[0];
                try {
                    let url = i === 0 ? `/currencies/${from}.json` : `/${dateStr}/v1/currencies/${from}.json`;
                    const data = await fetchWithFallback(url);
                    if(data[from] && data[from][to]) {
                        dates.push(dateStr);
                        rates.push(data[from][to]);
                    }
                } catch(e) { }
                currentDate.setDate(currentDate.getDate() - 1);
            }
            renderChart(dates.reverse(), rates.reverse());
        }

        function renderChart(labels, dataPoints) {
            const ctx = document.getElementById('trendChart').getContext('2d');
            if (chartInstance) chartInstance.destroy();
            const gradient = ctx.createLinearGradient(0, 0, 0, 400);
            gradient.addColorStop(0, 'rgba(99, 102, 241, 0.5)');
            gradient.addColorStop(1, 'rgba(99, 102, 241, 0.0)');

            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: `${fromSelect.value.toUpperCase()} to ${toSelect.value.toUpperCase()}`,
                        data: dataPoints,
                        borderColor: '#6366f1',
                        backgroundColor: gradient,
                        borderWidth: 2,
                        fill: true,
                        tension: 0.4,
                        pointBackgroundColor: '#fff',
                        pointRadius: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            mode: 'index', intersect: false,
                            backgroundColor: 'rgba(15, 23, 42, 0.9)',
                            titleColor: '#fff', bodyColor: '#cbd5e1',
                            borderColor: 'rgba(255,255,255,0.1)', borderWidth: 1
                        }
                    },
                    scales: {
                        x: { display: true, grid: { display: false }, ticks: { color: '#64748b' } },
                        y: { display: true, grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#64748b' } }
                    }
                }
            });
        }

        // --- Interactions ---
        function populateSelects(map) {
            const createOpt = (code, name) => `<option value="${code}">${code.toUpperCase()} - ${name}</option>`;
            const entries = Object.entries(map).sort((a, b) => {
                const aCommon = COMMON.includes(a[0]);
                const bCommon = COMMON.includes(b[0]);
                if (aCommon && !bCommon) return -1;
                if (!aCommon && bCommon) return 1;
                return a[1].localeCompare(b[1]);
            });
            const html = entries.map(e => createOpt(e[0], e[1])).join('');
            fromSelect.innerHTML = html;
            toSelect.innerHTML = html;
        }

        function setAmount(val) {
            amountInput.value = val;
            const amount = parseFloat(val);
            renderResult(amount, amount * currentRate, currentRate);
        }

        function swapCurrencies() {
            swapBtn.style.transform = "rotate(180deg)";
            setTimeout(() => swapBtn.style.transform = "rotate(0deg)", 300);
            const temp = fromSelect.value;
            fromSelect.value = toSelect.value;
            toSelect.value = temp;
            updateConverter();
        }

        function invertRate() {
            const temp = fromSelect.value;
            fromSelect.value = toSelect.value;
            toSelect.value = temp;
            if(currentRate > 0) {
                amountInput.value = (parseFloat(amountInput.value) / (currentRate * currentRate)).toFixed(2);
            }
            updateConverter();
        }

        function copyResult() {
            const text = mainResult.innerText;
            navigator.clipboard.writeText(text).then(() => {
                const btn = document.querySelector('.tool-btn i.ri-file-copy-line').parentNode;
                const originalText = btn.innerHTML;
                btn.innerHTML = '<i class="ri-check-line"></i> Copied!';
                setTimeout(() => btn.innerHTML = originalText, 2000);
            });
        }

        function animateValue(obj, start, end, duration) {
            let startTimestamp = null;
            const step = (timestamp) => {
                if (!startTimestamp) startTimestamp = timestamp;
                const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                const value = progress * (end - start) + start;
                obj.innerHTML = formatCurrency(value, toSelect.value);
                if (progress < 1) {
                    window.requestAnimationFrame(step);
                }
            };
            window.requestAnimationFrame(step);
        }

        function showLoader(show) {
            if(show) loader.classList.add('active');
            else loader.classList.remove('active');
        }

        // --- Event Listeners ---
        amountInput.addEventListener('input', () => {
            const amount = parseFloat(amountInput.value) || 0;
            renderResult(amount, amount * currentRate, currentRate);
        });
        fromSelect.addEventListener('change', updateConverter);
        toSelect.addEventListener('change', updateConverter);
        swapBtn.addEventListener('click', swapCurrencies);

        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
