<!DOCTYPE html>
<html>
<head>
  <title>Web Scraper (Frontend Only)</title>
  <style>
    body { font-family: Arial; padding: 20px; }
    pre { background: #f0f0f0; padding: 15px; border-radius: 6px; }
  </style>
</head>
<body>

<h2>Scraper Output</h2>
<button onclick="scrape()">Scrape Now</button>

<pre id="output">Click "Scrape Now"...</pre>

<script>
async function scrape() {
  const url = "https://black-ice-3dbk.onrender.com/Home.html";

  try {
    const res = await fetch(url);
    const html = await res.text();

    // Parse HTML
    const doc = new DOMParser().parseFromString(html, "text/html");

    // Select product cards
    const cards = [...doc.querySelectorAll(".card, .item, .product, .box")];

    const data = cards.map(card => ({
      title: card.querySelector("h1, h2, h3, .title, .card-title")?.textContent?.trim() || "",
      description: card.querySelector("p, .desc, .description")?.textContent?.trim() || "",
      price: card.querySelector(".price, .cost")?.textContent?.trim() || "",
      image: card.querySelector("img")?.src || ""
    }));

    document.getElementById("output").textContent =
      JSON.stringify(data, null, 2);

  } catch (e) {
    document.getElementById("output").textContent = "Error: " + e.message;
  }
}
</script>

</body>
</html>
