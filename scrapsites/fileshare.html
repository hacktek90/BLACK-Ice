<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>File Share</title>

<style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap');

    body {
        margin: 0;
        padding: 0;
        background: #000;
        font-family: 'Poppins', sans-serif;
        height: 100vh;
        overflow: hidden;
    }

    .wrapper {
        position: relative;
        width: 100%;
        height: 100%;
    }

    iframe {
        width: 100%;
        height: 100%;
        border: none;
    }

    /* Bottom bar */
    .overlay {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        padding: 20px 10px;
        background: #ffffff;
        color: #333;
        font-size: 18px;
        font-weight: 600;
        text-align: center;
        z-index: 10;
        border-top: 2px solid #eee;

        display: flex;
        justify-content: center;
        align-items: center;
        gap: 15px;
        flex-wrap: wrap;
    }

    button {
        padding: 10px 16px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 15px;
        font-weight: 600;
    }

    #scanBtn {
        background: #0078ff;
        color: white;
    }

    #openBtn {
        background: #18a300;
        color: white;
        display: none;
    }

    /* QR scanner popup */
    #scannerPopup {
        position: absolute;
        inset: 0;
        background: rgba(0,0,0,0.85);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 20;
        flex-direction: column;
    }

    #qr-reader {
        width: 320px;
        border-radius: 10px;
    }

    #closeScanner {
        margin-top: 15px;
        padding: 8px 14px;
        background: #ff4444;
        color: white;
        border-radius: 6px;
        cursor: pointer;
    }
</style>
</head>
<body>

<!-- Scanner Popup -->
<div id="scannerPopup">
    <div id="qr-reader"></div>
    <button id="closeScanner">Close</button>
</div>

<div class="wrapper">
    <iframe src="https://file.pizza"></iframe>

    <div class="overlay">
        This site is hosted by <b>BlackIce</b>
        — Subframe powered by <b>FilePizza</b>

        <button id="scanBtn">Scan QR</button>
        <button id="openBtn">Open Link</button>
    </div>
</div>

<!-- QR Scanner Library -->
<script src="https://unpkg.com/html5-qrcode"></script>

<script>
    let scannedLink = "";

    const scanBtn = document.getElementById("scanBtn");
    const openBtn = document.getElementById("openBtn");
    const scannerPopup = document.getElementById("scannerPopup");
    const closeScanner = document.getElementById("closeScanner");

    scanBtn.onclick = () => {
        scannerPopup.style.display = "flex";

        const qrReader = new Html5Qrcode("qr-reader");

        qrReader.start(
            { facingMode: "environment" },
            { fps: 10, qrbox: 250 },
            (decodedText) => {
                scannedLink = decodedText;
                openBtn.style.display = "inline-block";
                qrReader.stop();
                scannerPopup.style.display = "none";
            }
        );
    };

    openBtn.onclick = () => {
        if (scannedLink) {
            window.open(scannedLink, "_blank");
        }
    };

    closeScanner.onclick = () => {
        scannerPopup.style.display = "none";
        Html5Qrcode.getCameras().then(cams => {}).catch(err => {});
    };
</script>

</body>
</html>
