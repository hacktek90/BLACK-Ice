<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rating System</title>
<!-- Importing Inter Font for that clean Swiss look -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap" rel="stylesheet">

<style>
  :root {
    --bg-color: #f0f0f0;
    --card-bg: #ffffff;
    --text-main: #111111;
    --text-muted: #666666;
    --accent: #ff3b30; /* Swiss Red accent */
    --star-inactive: #e0e0e0;
    --star-active: #111111;
    --radius: 0px; /* Swiss style often prefers sharp corners, slight rounding for inputs */
    --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background-color: var(--bg-color);
    color: var(--text-main);
    font-family: 'Inter', sans-serif;
    line-height: 1.6;
    padding: 40px 20px;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
  }

  /* Layout Container */
  .container {
    width: 100%;
    max-width: 600px;
    background: var(--card-bg);
    padding: 60px 40px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.05);
    animation: slideUp 0.8s ease-out;
  }

  /* Typography - Swiss Style Headers */
  h1, h2 {
    font-weight: 900;
    letter-spacing: -0.03em;
    text-transform: uppercase;
    margin-bottom: 1.5rem;
  }

  h1 {
    font-size: 2.5rem;
    line-height: 1.1;
    margin-bottom: 2rem;
  }

  h2 {
    font-size: 1.25rem;
    border-top: 2px solid var(--text-main);
    padding-top: 20px;
    margin-top: 40px;
  }

  label {
    display: block;
    font-size: 0.75rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-muted);
    margin-bottom: 8px;
    margin-top: 20px;
  }

  /* Form Elements */
  input, textarea {
    width: 100%;
    padding: 15px;
    font-family: 'Inter', sans-serif;
    font-size: 1rem;
    background: #fafafa;
    border: 2px solid transparent;
    border-bottom: 2px solid #ddd;
    border-radius: 4px 4px 0 0;
    transition: var(--transition);
    color: var(--text-main);
  }

  input:focus, textarea:focus {
    outline: none;
    background: #fff;
    border-bottom-color: var(--text-main);
  }

  textarea {
    resize: vertical;
    min-height: 100px;
  }

  /* Custom Star Rating */
  .stars-container {
    display: flex;
    gap: 10px;
    margin-top: 25px;
  }

  .star-icon {
    width: 40px;
    height: 40px;
    fill: var(--star-inactive);
    cursor: pointer;
    transition: transform 0.2s ease, fill 0.2s ease;
  }

  .star-icon:hover {
    transform: scale(1.2);
  }

  .star-icon.active, .star-icon.hover {
    fill: var(--star-active);
  }

  /* Button */
  button {
    width: 100%;
    padding: 18px;
    margin-top: 30px;
    background: var(--text-main);
    color: #fff;
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    border: none;
    cursor: pointer;
    transition: var(--transition);
    position: relative;
    overflow: hidden;
  }

  button:hover {
    background: var(--accent);
    transform: translateY(-2px);
    box-shadow: 0 10px 20px rgba(255, 59, 48, 0.2);
  }

  button:active {
    transform: translateY(0);
  }

  /* Reviews List */
  #reviews {
    display: flex;
    flex-direction: column;
    gap: 20px;
    margin-top: 20px;
  }

  .review-card {
    background: #fff;
    border-left: 4px solid var(--text-main);
    padding: 20px;
    animation: fadeIn 0.5s ease forwards;
    opacity: 0;
    transform: translateY(10px);
  }

  .review-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 8px;
  }

  .review-user {
    font-weight: 700;
    font-size: 1.1rem;
  }

  .review-time {
    font-size: 0.75rem;
    color: var(--text-muted);
    font-weight: 500;
  }

  .review-stars {
    color: var(--text-main);
    font-size: 1.2rem;
    letter-spacing: 2px;
    margin-bottom: 10px;
  }

  .review-text {
    color: #444;
    font-size: 0.95rem;
    white-space: pre-wrap;
  }

  .empty-state {
    text-align: center;
    color: var(--text-muted);
    font-style: italic;
    padding: 20px;
    font-size: 0.9rem;
  }

  /* Toast Notification System */
  #toast-container {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 1000;
    display: flex;
    flex-direction: column;
    gap: 10px;
    pointer-events: none;
  }

  .toast {
    background: #111;
    color: #fff;
    padding: 12px 24px;
    border-radius: 50px;
    font-size: 0.9rem;
    font-weight: 500;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    opacity: 0;
    transform: translateY(20px);
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .toast.visible {
    opacity: 1;
    transform: translateY(0);
  }

  .toast.error {
    background: var(--accent);
  }

  /* Animations */
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(40px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeIn {
    to { opacity: 1; transform: translateY(0); }
  }

  /* Mobile Responsive */
  @media (max-width: 480px) {
    .container {
      padding: 40px 20px;
    }
    h1 {
      font-size: 2rem;
    }
  }
</style>
</head>

<body>

<div class="container">
  <header>
    <h1>Rate Us</h1>
    <p style="color: var(--text-muted); margin-bottom: 30px;">Your feedback shapes our future.</p>
  </header>

  <main>
    <!-- Username Input -->
    <div class="form-group">
      <label for="username">Username</label>
      <input type="text" id="username" placeholder="Enter your name" autocomplete="off" />
    </div>

    <!-- Star Rating -->
    <div class="form-group">
      <label>Rating</label>
      <div class="stars-container" id="stars">
        <!-- SVG Stars for sharpness -->
        <svg class="star-icon" data-value="1" viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
        <svg class="star-icon" data-value="2" viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
        <svg class="star-icon" data-value="3" viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
        <svg class="star-icon" data-value="4" viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
        <svg class="star-icon" data-value="5" viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
      </div>
    </div>

    <!-- Suggestion Textarea -->
    <div class="form-group">
      <label for="suggestion">Suggestion <span style="font-weight: 400; text-transform: none;">(Optional)</span></label>
      <textarea id="suggestion" placeholder="Share your thoughts..."></textarea>
    </div>

    <button id="submit">Submit Feedback</button>
  </main>

  <section>
    <h2>Recent Reviews</h2>
    <div id="reviews">
      <div class="empty-state">Loading reviews...</div>
    </div>
  </section>
</div>

<!-- Toast Container -->
<div id="toast-container"></div>

<!-- Firebase Logic -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getDatabase,
  ref,
  push,
  onValue
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

// 🔥 Config
const firebaseConfig = {
  apiKey: "AIzaSyAp9kCBsDLnQEmR7wWHXwt3FB2T1zDtiqU",
  authDomain: "h-90-8a7c5.firebaseapp.com",
  databaseURL: "https://h-90-8a7c5-default-rtdb.firebaseio.com",
  projectId: "h-90-8a7c5",
  storageBucket: "h-90-8a7c5.firebasestorage.app",
  messagingSenderId: "367196609301",
  appId: "1:367196609301:web:156e24c1b4532c26af671c"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// State
let rating = 0;
const starsContainer = document.getElementById("stars");
const stars = document.querySelectorAll(".star-icon");

// --- UI Interactions ---

// Star Hover Logic
stars.forEach(star => {
  // Hover preview
  star.addEventListener("mouseenter", () => {
    const value = parseInt(star.getAttribute("data-value"));
    updateStarsVisual(value, "hover");
  });

  // Click to set
  star.addEventListener("click", () => {
    rating = parseInt(star.getAttribute("data-value"));
    updateStarsVisual(rating, "active");
    
    // Small animation feedback
    star.style.transform = "scale(1.4)";
    setTimeout(() => star.style.transform = "", 200);
  });
});

// Reset on mouse leave (unless selected)
starsContainer.addEventListener("mouseleave", () => {
  updateStarsVisual(rating, "active");
});

function updateStarsVisual(value, className) {
  stars.forEach(s => {
    const sVal = parseInt(s.getAttribute("data-value"));
    if (sVal <= value) {
      s.classList.add(className);
    } else {
      s.classList.remove(className);
    }
  });
}

// Toast Notification System
function showToast(message, type = "success") {
  const container = document.getElementById("toast-container");
  const toast = document.createElement("div");
  toast.className = `toast ${type}`;
  
  // Icon based on type
  const icon = type === "error" ? "✕" : "✓";
  
  toast.innerHTML = `<span>${icon}</span> ${message}`;
  container.appendChild(toast);

  // Trigger animation
  requestAnimationFrame(() => {
    toast.classList.add("visible");
  });

  // Remove after 3 seconds
  setTimeout(() => {
    toast.classList.remove("visible");
    setTimeout(() => toast.remove(), 400);
  }, 3000);
}

// --- Firebase Logic ---

document.getElementById("submit").onclick = () => {
  const usernameInput = document.getElementById("username");
  const suggestionInput = document.getElementById("suggestion");
  const username = usernameInput.value.trim();
  const suggestion = suggestionInput.value.trim();

  // Validation
  if (!username) {
    showToast("Username is required", "error");
    usernameInput.focus();
    return;
  }
  if (rating === 0) {
    showToast("Please select a star rating", "error");
    return;
  }

  // Cooldown check (24 hours)
  const last = localStorage.getItem("lastSubmit");
  const now = Date.now();

  if (last && now - last < 86400000) {
    const hoursLeft = Math.ceil((86400000 - (now - last)) / (1000 * 60 * 60));
    showToast(`Please wait ${hoursLeft}h before submitting again`, "error");
    return;
  }

  // Disable button while submitting
  const btn = document.getElementById("submit");
  const originalText = btn.innerText;
  btn.innerText = "SENDING...";
  btn.style.opacity = "0.7";
  btn.disabled = true;

  const review = {
    username,
    rating: Number(rating),
    suggestion,
    time: Date.now() // Store timestamp for sorting
  };

  push(ref(db, "reviews"), review)
    .then(() => {
      localStorage.setItem("lastSubmit", now);
      showToast("Feedback submitted successfully!");
      
      // Reset Form
      usernameInput.value = "";
      suggestionInput.value = "";
      rating = 0;
      updateStarsVisual(0, "active");
    })
    .catch((err) => {
      console.error(err);
      showToast("Error submitting. Try again.", "error");
    })
    .finally(() => {
      btn.innerText = originalText;
      btn.style.opacity = "1";
      btn.disabled = false;
    });
};

// Load Reviews (Live)
const reviewsDiv = document.getElementById("reviews");

onValue(ref(db, "reviews"), snapshot => {
  const data = [];
  snapshot.forEach(child => {
    data.push(child.val());
  });

  // Sort by time (newest first)
  data.sort((a, b) => b.time - a.time);

  reviewsDiv.innerHTML = "";

  if (data.length === 0) {
    reviewsDiv.innerHTML = `<div class="empty-state">No reviews yet. Be the first!</div>`;
    return;
  }

  data.forEach(d => {
    const dateStr = new Date(d.time).toLocaleDateString(undefined, {
      month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
    });

    const div = document.createElement("div");
    div.className = "review-card";
    
    // Generate star string
    const starDisplay = "★".repeat(d.rating) + "☆".repeat(5 - d.rating);

    div.innerHTML = `
      <div class="review-header">
        <span class="review-user">${d.username}</span>
        <span class="review-time">${dateStr}</span>
      </div>
      <div class="review-stars">${starDisplay}</div>
      ${d.suggestion ? `<div class="review-text">${escapeHtml(d.suggestion)}</div>` : ""}
    `;
    
    reviewsDiv.appendChild(div);
  });
});

// Helper to prevent XSS
function escapeHtml(text) {
  if (!text) return text;
  return text
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
}
</script>
<script>
  // Disable right-click
  document.addEventListener("contextmenu", function (e) {
    e.preventDefault();
  });
</script>

</body>
</html>
