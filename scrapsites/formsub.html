<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rating System</title>
<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap" rel="stylesheet">

<!-- External Libraries CSS -->
<!-- Select2 CSS -->
<link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
<!-- Flatpickr CSS -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">

<style>
  :root {
    --bg-color: #f0f0f0;
    --card-bg: #ffffff;
    --text-main: #111111;
    --text-muted: #666666;
    --accent: #ff3b30; /* Swiss Red accent */
    --star-inactive: #e0e0e0;
    --star-active: #111111;
    --radius: 0px;
    --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background-color: var(--bg-color);
    color: var(--text-main);
    font-family: 'Inter', sans-serif;
    line-height: 1.6;
    padding: 40px 20px;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
  }

  /* Layout Container */
  .container {
    width: 100%;
    max-width: 700px; /* Slightly wider to accommodate filters */
    background: var(--card-bg);
    padding: 60px 40px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.05);
    animation: slideUp 0.8s ease-out;
  }

  /* Typography */
  h1, h2 {
    font-weight: 900;
    letter-spacing: -0.03em;
    text-transform: uppercase;
    margin-bottom: 1.5rem;
  }

  h1 {
    font-size: 2.5rem;
    line-height: 1.1;
    margin-bottom: 2rem;
  }

  h2 {
    font-size: 1.25rem;
    border-top: 2px solid var(--text-main);
    padding-top: 20px;
    margin-top: 40px;
  }

  label {
    display: block;
    font-size: 0.75rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-muted);
    margin-bottom: 8px;
    margin-top: 20px;
  }

  /* Form Elements */
  input, textarea {
    width: 100%;
    padding: 15px;
    font-family: 'Inter', sans-serif;
    font-size: 1rem;
    background: #fafafa;
    border: 2px solid transparent;
    border-bottom: 2px solid #ddd;
    border-radius: 4px 4px 0 0;
    transition: var(--transition);
    color: var(--text-main);
  }

  input:focus, textarea:focus {
    outline: none;
    background: #fff;
    border-bottom-color: var(--text-main);
  }

  /* --- Select2 Customization (Swiss Style) --- */
  .select2-container {
    width: 100% !important;
  }
  
  .select2-container .select2-selection--single {
    height: auto;
    padding: 10px 15px; /* Match input padding */
    border: 1px solid #ddd;
    border-radius: 20px; /* Pill shape */
    background: #fff;
    display: flex;
    align-items: center;
  }

  .select2-container--default .select2-selection--single .select2-selection__rendered {
    padding: 0;
    color: var(--text-main);
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 0.8rem;
    text-transform: uppercase;
  }

  .select2-container--default .select2-selection--single .select2-selection__arrow {
    height: 100%;
    right: 10px;
  }

  .select2-dropdown {
    border: 1px solid #ddd;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    font-family: 'Inter', sans-serif;
  }
  
  .select2-results__option {
    padding: 10px 15px;
  }
  
  .select2-container--default .select2-results__option--highlighted.select2-results__option--selectable {
    background-color: var(--text-main);
    color: #fff;
  }

  /* --- Flatpickr Customization --- */
  .flatpickr-input {
    font-size: 0.9rem;
    color: var(--text-muted);
  }
  .flatpickr-calendar {
    font-family: 'Inter', sans-serif;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    border: none;
  }
  .flatpickr-day.selected, .flatpickr-day.startRange, .flatpickr-day.endRange, .flatpickr-day.selected.inRange, .flatpickr-day.startRange.inRange, .flatpickr-day.endRange.inRange, .flatpickr-day.selected:focus, .flatpickr-day.startRange:focus, .flatpickr-day.endRange:focus, .flatpickr-day.selected:hover, .flatpickr-day.startRange:hover, .flatpickr-day.endRange:hover, .flatpickr-day.selected.prevMonthDay, .flatpickr-day.startRange.prevMonthDay, .flatpickr-day.endRange.prevMonthDay, .flatpickr-day.selected.nextMonthDay, .flatpickr-day.startRange.nextMonthDay, .flatpickr-day.endRange.nextMonthDay {
    background: var(--text-main);
    border-color: var(--text-main);
  }

  /* Star Rating */
  .stars-container {
    display: flex;
    gap: 10px;
    margin-top: 25px;
  }

  .star-icon {
    width: 40px;
    height: 40px;
    fill: var(--star-inactive);
    cursor: pointer;
    transition: transform 0.2s ease, fill 0.2s ease;
  }

  .star-icon:hover { transform: scale(1.2); }
  .star-icon.active, .star-icon.hover { fill: var(--star-active); }

  /* Submit Button */
  button#submit {
    width: 100%;
    padding: 18px;
    margin-top: 30px;
    background: var(--text-main);
    color: #fff;
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    border: none;
    cursor: pointer;
    transition: var(--transition);
    position: relative;
    overflow: hidden;
  }
  button#submit:hover {
    background: var(--accent);
    transform: translateY(-2px);
    box-shadow: 0 10px 20px rgba(255, 59, 48, 0.2);
  }

  /* --- FILTERS SECTION --- */
  .controls-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-bottom: 25px;
    padding: 20px;
    background: #f9f9f9;
    border-radius: 12px;
    border: 1px solid #eee;
  }

  .control-item {
    display: flex;
    flex-direction: column;
  }

  .filter-group {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 10px;
  }

  .filter-btn {
    background: transparent;
    border: 1px solid #ddd;
    padding: 6px 12px;
    font-size: 0.75rem;
    font-weight: 700;
    text-transform: uppercase;
    color: var(--text-muted);
    cursor: pointer;
    border-radius: 20px;
    transition: all 0.2s ease;
    width: auto;
    margin: 0;
    box-shadow: none;
  }
  .filter-btn:hover {
    border-color: var(--text-main);
    color: var(--text-main);
    background: transparent;
    transform: none;
  }
  .filter-btn.active {
    background: var(--text-main);
    color: #fff;
    border-color: var(--text-main);
  }

  /* Reviews List */
  #reviews {
    display: flex;
    flex-direction: column;
    gap: 20px;
    margin-top: 20px;
  }

  .review-card {
    background: #fff;
    border-left: 4px solid var(--text-main);
    padding: 20px;
    animation: fadeIn 0.5s ease forwards;
    opacity: 0;
    transform: translateY(10px);
  }

  .review-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 8px;
  }
  .review-user { font-weight: 700; font-size: 1.1rem; }
  .review-time { font-size: 0.75rem; color: var(--text-muted); font-weight: 500; }
  .review-stars { color: var(--text-main); font-size: 1.2rem; letter-spacing: 2px; margin-bottom: 10px; }
  .review-text { color: #444; font-size: 0.95rem; white-space: pre-wrap; }
  .empty-state { text-align: center; color: var(--text-muted); font-style: italic; padding: 20px; font-size: 0.9rem; }

  /* Toast */
  #toast-container {
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
    z-index: 1000; display: flex; flex-direction: column; gap: 10px; pointer-events: none;
  }
  .toast {
    background: #111; color: #fff; padding: 12px 24px; border-radius: 50px;
    font-size: 0.9rem; font-weight: 500; box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    opacity: 0; transform: translateY(20px); transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    display: flex; align-items: center; gap: 10px;
  }
  .toast.visible { opacity: 1; transform: translateY(0); }
  .toast.error { background: var(--accent); }

  @keyframes slideUp { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes fadeIn { to { opacity: 1; transform: translateY(0); } }

  /* Mobile Responsive */
  @media (max-width: 600px) {
    .container { padding: 40px 20px; }
    .controls-grid { grid-template-columns: 1fr; }
    h1 { font-size: 2rem; }
  }
</style>
</head>

<body>

<div class="container">
  <header>
    <h1>Rate Us</h1>
    <p style="color: var(--text-muted); margin-bottom: 30px;">Your feedback shapes our future.</p>
  </header>

  <main>
    <div class="form-group">
      <label for="username">Username</label>
      <input type="text" id="username" placeholder="Enter your name" autocomplete="off" />
    </div>

    <div class="form-group">
      <label>Rating</label>
      <div class="stars-container" id="stars">
        <svg class="star-icon" data-value="1" viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
        <svg class="star-icon" data-value="2" viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
        <svg class="star-icon" data-value="3" viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
        <svg class="star-icon" data-value="4" viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
        <svg class="star-icon" data-value="5" viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
      </div>
    </div>

    <div class="form-group">
      <label for="suggestion">Suggestion <span style="font-weight: 400; text-transform: none;">(Optional)</span></label>
      <textarea id="suggestion" placeholder="Share your thoughts..."></textarea>
    </div>

    <button id="submit">Submit Feedback</button>
  </main>

  <section>
    <h2>Recent Reviews</h2>
    
    <!-- Advanced Controls -->
    <div class="controls-grid">
      <!-- Column 1: Sorting (Select2) -->
      <div class="control-item">
        <label style="margin-top:0; margin-bottom: 5px;">Sort By</label>
        <select id="sort-select">
          <option value="desc">Newest First</option>
          <option value="asc">Oldest First</option>
          <option value="username_asc">Username (A-Z)</option>
          <option value="username_desc">Username (Z-A)</option>
          <option value="rating_desc">Rating (High-Low)</option>
          <option value="rating_asc">Rating (Low-High)</option>
        </select>
      </div>

      <!-- Column 2: Date Filter (Flatpickr) -->
      <div class="control-item">
        <label style="margin-top:0; margin-bottom: 5px;">Date Range</label>
        <input type="text" id="date-range" placeholder="Filter by dates..." readonly>
      </div>
    </div>

    <!-- Rating Buttons -->
    <div class="filter-group" id="rating-filters">
      <button class="filter-btn active" data-rating="all">All</button>
      <button class="filter-btn" data-rating="5">5★</button>
      <button class="filter-btn" data-rating="4">4★</button>
      <button class="filter-btn" data-rating="3">3★</button>
      <button class="filter-btn" data-rating="2">2★</button>
      <button class="filter-btn" data-rating="1">1★</button>
    </div>

    <div id="reviews">
      <div class="empty-state">Loading reviews...</div>
    </div>
  </section>
</div>

<!-- Toast Container -->
<div id="toast-container"></div>

<!-- Dependencies (jQuery is required for Select2) -->
<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<!-- Select2 JS -->
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
<!-- Flatpickr JS -->
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

<!-- Firebase Logic -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getDatabase,
  ref,
  push,
  onValue
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

// 🔥 Config
const firebaseConfig = {
  apiKey: "AIzaSyAp9kCBsDLnQEmR7wWHXwt3FB2T1zDtiqU",
  authDomain: "h-90-8a7c5.firebaseapp.com",
  databaseURL: "https://h-90-8a7c5-default-rtdb.firebaseio.com",
  projectId: "h-90-8a7c5",
  storageBucket: "h-90-8a7c5.firebasestorage.app",
  messagingSenderId: "367196609301",
  appId: "1:367196609301:web:156e24c1b4532c26af671c"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// --- State ---
let rating = 0;
let allReviews = [];
let activeFilter = 'all';
let activeSort = 'desc';
let dateRange = { start: null, end: null };

// --- UI Elements ---
const starsContainer = document.getElementById("stars");
const stars = document.querySelectorAll(".star-icon");

// --- Star Logic ---
stars.forEach(star => {
  star.addEventListener("mouseenter", () => {
    const value = parseInt(star.getAttribute("data-value"));
    updateStarsVisual(value, "hover");
  });
  star.addEventListener("click", () => {
    rating = parseInt(star.getAttribute("data-value"));
    updateStarsVisual(rating, "active");
    star.style.transform = "scale(1.4)";
    setTimeout(() => star.style.transform = "", 200);
  });
});

starsContainer.addEventListener("mouseleave", () => {
  updateStarsVisual(rating, "active");
});

function updateStarsVisual(value, className) {
  stars.forEach(s => {
    const sVal = parseInt(s.getAttribute("data-value"));
    if (sVal <= value) s.classList.add(className);
    else s.classList.remove(className);
  });
}

// --- Library Initialization ---

// 1. Initialize Select2 (Wait for DOM/Modules)
 $(document).ready(function() {
  $('#sort-select').select2({
    minimumResultsForSearch: -1, // Hide search box
    width: '100%',
    dropdownCssClass: 'swiss-dropdown'
  });

  $('#sort-select').on('change', function() {
    activeSort = $(this).val();
    renderReviews();
  });
});

// 2. Initialize Flatpickr
flatpickr("#date-range", {
  mode: "range",
  dateFormat: "Y-m-d",
  onChange: function(selectedDates, dateStr, instance) {
    if (selectedDates.length === 2) {
      dateRange.start = selectedDates[0].getTime();
      // Set end date to end of that day
      const endDate = new Date(selectedDates[1]);
      endDate.setHours(23, 59, 59, 999);
      dateRange.end = endDate.getTime();
      renderReviews();
    } else if (selectedDates.length === 0) {
      dateRange.start = null;
      dateRange.end = null;
      renderReviews();
    }
  }
});

// --- Filtering Logic ---

const filterBtns = document.querySelectorAll('.filter-btn');
filterBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    filterBtns.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeFilter = btn.getAttribute('data-rating');
    renderReviews();
  });
});

// --- Rendering Logic ---
function renderReviews() {
  const reviewsDiv = document.getElementById("reviews");
  
  // 1. Filter by Rating
  let displayData = allReviews.filter(item => {
    if (activeFilter === 'all') return true;
    return item.rating == activeFilter;
  });

  // 2. Filter by Date Range
  if (dateRange.start && dateRange.end) {
    displayData = displayData.filter(item => {
      return item.time >= dateRange.start && item.time <= dateRange.end;
    });
  }

  // 3. Sort
  displayData.sort((a, b) => {
    if (activeSort === 'desc') return b.time - a.time; // Newest
    if (activeSort === 'asc') return a.time - b.time; // Oldest
    if (activeSort === 'username_asc') return a.username.localeCompare(b.username);
    if (activeSort === 'username_desc') return b.username.localeCompare(a.username);
    if (activeSort === 'rating_desc') return b.rating - a.rating;
    if (activeSort === 'rating_asc') return a.rating - b.rating;
    return 0;
  });

  // 4. HTML Generation
  reviewsDiv.innerHTML = "";

  if (displayData.length === 0) {
    reviewsDiv.innerHTML = `<div class="empty-state">No reviews match your filters.</div>`;
    return;
  }

  displayData.forEach(d => {
    const dateStr = new Date(d.time).toLocaleDateString(undefined, {
      month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
    });

    const div = document.createElement("div");
    div.className = "review-card";
    const starDisplay = "★".repeat(d.rating) + "☆".repeat(5 - d.rating);

    div.innerHTML = `
      <div class="review-header">
        <span class="review-user">${d.username}</span>
        <span class="review-time">${dateStr}</span>
      </div>
      <div class="review-stars">${starDisplay}</div>
      ${d.suggestion ? `<div class="review-text">${escapeHtml(d.suggestion)}</div>` : ""}
    `;
    
    reviewsDiv.appendChild(div);
  });
}

// --- Firebase & Form Logic ---

function showToast(message, type = "success") {
  const container = document.getElementById("toast-container");
  const toast = document.createElement("div");
  toast.className = `toast ${type}`;
  const icon = type === "error" ? "✕" : "✓";
  toast.innerHTML = `<span>${icon}</span> ${message}`;
  container.appendChild(toast);
  
  requestAnimationFrame(() => toast.classList.add("visible"));
  
  setTimeout(() => {
    toast.classList.remove("visible");
    setTimeout(() => toast.remove(), 400);
  }, 3000);
}

document.getElementById("submit").onclick = () => {
  const usernameInput = document.getElementById("username");
  const suggestionInput = document.getElementById("suggestion");
  const username = usernameInput.value.trim();
  const suggestion = suggestionInput.value.trim();

  if (!username) { showToast("Username is required", "error"); return; }
  if (rating === 0) { showToast("Please select a star rating", "error"); return; }

  const last = localStorage.getItem("lastSubmit");
  const now = Date.now();
  if (last && now - last < 86400000) {
    const hoursLeft = Math.ceil((86400000 - (now - last)) / (1000 * 60 * 60));
    showToast(`Please wait ${hoursLeft}h before submitting again`, "error");
    return;
  }

  const btn = document.getElementById("submit");
  const originalText = btn.innerText;
  btn.innerText = "SENDING...";
  btn.style.opacity = "0.7";
  btn.disabled = true;

  const review = { username, rating: Number(rating), suggestion, time: Date.now() };

  push(ref(db, "reviews"), review)
    .then(() => {
      localStorage.setItem("lastSubmit", now);
      showToast("Feedback submitted successfully!");
      usernameInput.value = "";
      suggestionInput.value = "";
      rating = 0;
      updateStarsVisual(0, "active");
    })
    .catch((err) => {
      console.error(err);
      showToast("Error submitting. Try again.", "error");
    })
    .finally(() => {
      btn.innerText = originalText;
      btn.style.opacity = "1";
      btn.disabled = false;
    });
};

onValue(ref(db, "reviews"), snapshot => {
  allReviews = [];
  snapshot.forEach(child => allReviews.push(child.val()));
  renderReviews();
});

function escapeHtml(text) {
  if (!text) return text;
  return text
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
}
</script>
<script>
  document.addEventListener("contextmenu", function (e) { e.preventDefault(); });
</script>

</body>
</html>
