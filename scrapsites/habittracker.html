<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orbit Analytics Pro</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { 
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                        display: ['Outfit', 'sans-serif']
                    },
                    colors: {
                        orbit: { 
                            50: '#f0fdfa', 100: '#ccfbf1', 200: '#99f6e4', 
                            300: '#5eead4', 400: '#2dd4bf', 500: '#14b8a6', 
                            600: '#0d9488', 800: '#115e59', 900: '#134e4a' 
                        },
                        cosmic: {
                            bg: '#0B0C15',
                            card: '#151621',
                            accent: '#6366f1'
                        }
                    },
                    animation: {
                        'blob': 'blob 7s infinite',
                        'float': 'float 6s ease-in-out infinite',
                    },
                    keyframes: {
                        blob: {
                            '0%': { transform: 'translate(0px, 0px) scale(1)' },
                            '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
                            '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
                            '100%': { transform: 'translate(0px, 0px) scale(1)' },
                        },
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-10px)' },
                        }
                    }
                }
            }
        }
    </script>

    <!-- Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- Day.js -->
    <script src="https://cdn.jsdelivr.net/npm/dayjs/dayjs.min.js"></script>
    <!-- ApexCharts -->
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <!-- Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        body { 
            background-color: #f3f4f6;
            transition: background-color 0.5s;
        }
        .dark body {
            background-color: #050507;
        }

        /* Ambient Mesh Background */
        .mesh-gradient {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: -1;
            overflow: hidden;
            pointer-events: none;
        }
        .mesh-blob {
            position: absolute;
            filter: blur(80px);
            opacity: 0.4;
            animation: blob 10s infinite cubic-bezier(0.4, 0, 0.2, 1);
        }
        .dark .mesh-blob { opacity: 0.2; }

        /* Advanced Glassmorphism */
        .glass-panel {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.05);
        }
        .dark .glass-panel {
            background: rgba(20, 20, 30, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.4);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        .dark ::-webkit-scrollbar-thumb { background: #334155; }

        /* Animations */
        .slide-up { animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; transform: translateY(20px); }
        @keyframes slideUp { to { opacity: 1; transform: translateY(0); } }
        
        .check-btn:active { transform: scale(0.9); }
        
        /* Heatmap Grid */
        .heatmap-grid {
            display: grid;
            grid-template-rows: repeat(7, 1fr);
            grid-auto-flow: column;
            gap: 3px;
        }
        
        /* Level Progress Bar */
        .progress-bar-shine {
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            animation: shine 2s infinite;
        }
        @keyframes shine { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
    </style>
</head>
<body class="text-slate-800 dark:text-slate-200 antialiased selection:bg-orbit-500 selection:text-white">

    <!-- Ambient Background -->
    <div class="mesh-gradient">
        <div class="mesh-blob bg-purple-400 w-96 h-96 rounded-full top-0 left-0 mix-blend-multiply dark:mix-blend-screen"></div>
        <div class="mesh-blob bg-orbit-400 w-96 h-96 rounded-full top-0 right-0 animation-delay-2000 mix-blend-multiply dark:mix-blend-screen"></div>
        <div class="mesh-blob bg-blue-400 w-96 h-96 rounded-full -bottom-32 left-20 animation-delay-4000 mix-blend-multiply dark:mix-blend-screen"></div>
    </div>

    <!-- Navigation -->
    <nav class="fixed top-0 w-full z-50 glass-panel border-b-0">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-18 py-3">
                <div class="flex items-center gap-3">
                    <div class="relative group cursor-pointer" onclick="triggerConfetti()">
                        <div class="absolute inset-0 bg-orbit-500 blur-lg opacity-20 group-hover:opacity-40 transition-opacity"></div>
                        <div class="relative w-10 h-10 bg-gradient-to-br from-orbit-400 to-blue-600 rounded-xl flex items-center justify-center text-white shadow-lg">
                            <i class="ph-bold ph-planet text-2xl animate-float"></i>
                        </div>
                    </div>
                    <div>
                        <h1 class="font-display font-bold text-xl tracking-tight leading-none">Orbit<span class="text-orbit-600 dark:text-orbit-400">Pro</span></h1>
                        <p class="text-[10px] font-mono text-slate-500 uppercase tracking-widest" id="dateDisplay">LOADING...</p>
                    </div>
                </div>

                <!-- XP Bar (Desktop) -->
                <div class="hidden md:flex flex-col w-48 mx-4">
                    <div class="flex justify-between text-xs font-bold mb-1">
                        <span class="text-orbit-600 dark:text-orbit-400">Level <span id="userLevel">1</span></span>
                        <span class="text-slate-400"><span id="currentXP">0</span> / <span id="nextLevelXP">100</span> XP</span>
                    </div>
                    <div class="h-2 bg-slate-200 dark:bg-slate-700 rounded-full overflow-hidden relative">
                        <div id="xpBar" class="h-full bg-gradient-to-r from-orbit-500 to-blue-500 w-0 transition-all duration-1000 relative">
                            <div class="absolute inset-0 progress-bar-shine"></div>
                        </div>
                    </div>
                </div>

                <div class="flex items-center gap-3">
                    <!-- Data Menu -->
                    <div class="relative group">
                        <button class="p-2 rounded-xl hover:bg-slate-200/50 dark:hover:bg-slate-800/50 transition-colors">
                            <i class="ph-bold ph-gear"></i>
                        </button>
                        <div class="absolute right-0 mt-2 w-48 glass-panel rounded-xl shadow-xl opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all transform origin-top-right p-1">
                            <button onclick="exportData()" class="w-full text-left px-3 py-2 text-sm rounded-lg hover:bg-orbit-50 dark:hover:bg-orbit-900/20 flex items-center gap-2">
                                <i class="ph-bold ph-download-simple"></i> Export JSON
                            </button>
                            <label class="w-full text-left px-3 py-2 text-sm rounded-lg hover:bg-orbit-50 dark:hover:bg-orbit-900/20 flex items-center gap-2 cursor-pointer">
                                <i class="ph-bold ph-upload-simple"></i> Import JSON
                                <input type="file" id="importFile" class="hidden" onchange="importData(this)">
                            </label>
                            <div class="h-px bg-slate-200 dark:bg-slate-700 my-1"></div>
                            <button id="themeToggle" class="w-full text-left px-3 py-2 text-sm rounded-lg hover:bg-orbit-50 dark:hover:bg-orbit-900/20 flex items-center gap-2">
                                <i class="ph-bold ph-moon-stars"></i> Toggle Theme
                            </button>
                        </div>
                    </div>

                    <div class="h-8 w-px bg-slate-300 dark:bg-slate-700/50 mx-1"></div>
                    
                    <button onclick="openModal()" class="group relative flex items-center gap-2 bg-slate-900 dark:bg-white text-white dark:text-slate-900 px-5 py-2.5 rounded-xl font-bold text-sm transition-all hover:shadow-[0_0_20px_-5px_rgba(0,0,0,0.3)] dark:hover:shadow-[0_0_20px_-5px_rgba(255,255,255,0.3)] overflow-hidden">
                        <div class="absolute inset-0 bg-gradient-to-r from-transparent via-white/20 to-transparent translate-x-[-200%] group-hover:translate-x-[200%] transition-transform duration-700"></div>
                        <i class="ph-bold ph-plus"></i> <span>Create</span>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="pt-28 pb-12 px-4 sm:px-6">
        <div class="max-w-7xl mx-auto space-y-6">
            
            <!-- Mobile XP Bar -->
            <div class="md:hidden glass-panel p-4 rounded-2xl mb-4 slide-up">
                <div class="flex justify-between text-xs font-bold mb-2">
                    <span class="text-orbit-600 dark:text-orbit-400">Lvl <span id="mobileLevel">1</span></span>
                    <span class="text-slate-400"><span id="mobileXP">0</span> XP</span>
                </div>
                <div class="h-2 bg-slate-200 dark:bg-slate-700 rounded-full overflow-hidden">
                    <div id="mobileXPBar" class="h-full bg-gradient-to-r from-orbit-500 to-blue-500 w-0 transition-all duration-1000"></div>
                </div>
            </div>

            <!-- Dashboard Grid -->
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                
                <!-- Left Column: Stats & Heatmap -->
                <div class="lg:col-span-2 space-y-6">
                    
                    <!-- KPI Cards -->
                    <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 slide-up">
                        <div class="glass-panel p-5 rounded-2xl">
                            <div class="text-slate-400 text-xs font-bold uppercase tracking-wider mb-1">Today</div>
                            <div class="flex items-end gap-2">
                                <span class="text-3xl font-display font-bold" id="stat-completion">0%</span>
                            </div>
                        </div>
                        <div class="glass-panel p-5 rounded-2xl">
                            <div class="text-slate-400 text-xs font-bold uppercase tracking-wider mb-1">Streak</div>
                            <div class="flex items-end gap-2">
                                <span class="text-3xl font-display font-bold text-orange-500" id="stat-streak">0</span>
                                <i class="ph-fill ph-fire text-orange-500 mb-1"></i>
                            </div>
                        </div>
                        <div class="glass-panel p-5 rounded-2xl">
                            <div class="text-slate-400 text-xs font-bold uppercase tracking-wider mb-1">Total XP</div>
                            <div class="flex items-end gap-2">
                                <span class="text-3xl font-display font-bold text-purple-500" id="stat-xp">0</span>
                            </div>
                        </div>
                        <div class="glass-panel p-5 rounded-2xl">
                            <div class="text-slate-400 text-xs font-bold uppercase tracking-wider mb-1">Active</div>
                            <div class="flex items-end gap-2">
                                <span class="text-3xl font-display font-bold" id="stat-total">0</span>
                            </div>
                        </div>
                    </div>

                    <!-- Contribution Heatmap -->
                    <div class="glass-panel p-6 rounded-2xl slide-up" style="animation-delay: 0.1s;">
                        <div class="flex justify-between items-center mb-4">
                            <h3 class="font-display font-bold text-lg">Consistency Map</h3>
                            <div class="flex items-center gap-2 text-xs text-slate-400">
                                <span>Less</span>
                                <div class="w-3 h-3 rounded-sm bg-slate-200 dark:bg-slate-800"></div>
                                <div class="w-3 h-3 rounded-sm bg-orbit-200/50"></div>
                                <div class="w-3 h-3 rounded-sm bg-orbit-400"></div>
                                <div class="w-3 h-3 rounded-sm bg-orbit-600"></div>
                                <span>More</span>
                            </div>
                        </div>
                        <div class="overflow-x-auto pb-2 custom-scrollbar">
                            <div id="heatmap" class="heatmap-grid h-[100px] min-w-[600px]"></div>
                        </div>
                    </div>

                    <!-- Habits List -->
                    <div class="space-y-4 slide-up" style="animation-delay: 0.2s;">
                        <div class="flex justify-between items-center">
                            <h2 class="font-display font-bold text-2xl">Today's Focus</h2>
                            <div class="flex bg-gray-200/50 dark:bg-black/20 p-1 rounded-xl">
                                <button onclick="filterHabits('all')" class="filter-btn active px-4 py-1 rounded-lg text-xs font-bold transition-all" data-cat="all">All</button>
                                <button onclick="filterHabits('Health')" class="filter-btn px-4 py-1 rounded-lg text-xs font-bold transition-all text-slate-500" data-cat="Health">Health</button>
                                <button onclick="filterHabits('Work')" class="filter-btn px-4 py-1 rounded-lg text-xs font-bold transition-all text-slate-500" data-cat="Work">Work</button>
                            </div>
                        </div>

                        <div id="habitsContainer" class="grid grid-cols-1 gap-3">
                            <!-- Habits Injected Here -->
                        </div>
                        
                        <div id="emptyState" class="hidden py-12 text-center border-2 border-dashed border-slate-300 dark:border-slate-700 rounded-2xl">
                            <div class="w-16 h-16 bg-slate-100 dark:bg-slate-800 rounded-full flex items-center justify-center mx-auto mb-3 text-2xl">🌱</div>
                            <h3 class="font-bold text-lg">Start your journey</h3>
                            <button onclick="openModal()" class="text-orbit-500 font-bold text-sm mt-2 hover:underline">Create your first habit</button>
                        </div>
                    </div>
                </div>

                <!-- Right Column: Analytics -->
                <div class="space-y-6 slide-up" style="animation-delay: 0.3s;">
                    <!-- Weekly Chart -->
                    <div class="glass-panel p-6 rounded-2xl relative overflow-hidden">
                        <div class="absolute top-0 right-0 w-32 h-32 bg-orbit-500/10 rounded-full blur-2xl -mr-10 -mt-10 pointer-events-none"></div>
                        <h3 class="font-display font-bold text-lg mb-4">Weekly Flow</h3>
                        <div id="weeklyChart" class="w-full -ml-2"></div>
                    </div>

                    <!-- Categories Radar -->
                    <div class="glass-panel p-6 rounded-2xl">
                        <h3 class="font-display font-bold text-lg mb-2">Life Balance</h3>
                        <div id="radarChart" class="w-full flex justify-center"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal -->
    <div id="habitModal" class="fixed inset-0 z-[100] hidden">
        <div class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm transition-opacity" onclick="closeModal()"></div>
        <div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-full max-w-md p-4">
            <div class="glass-panel bg-white/90 dark:bg-cosmic-card/90 rounded-2xl shadow-2xl overflow-hidden border border-white/20 slide-up">
                <div class="px-6 py-5 border-b border-slate-100 dark:border-white/5 flex justify-between items-center bg-white/50 dark:bg-white/5">
                    <h3 class="text-lg font-bold font-display" id="modalTitle">New Protocol</h3>
                    <button onclick="closeModal()" class="w-8 h-8 rounded-full hover:bg-slate-100 dark:hover:bg-white/10 flex items-center justify-center transition-colors"><i class="ph-bold ph-x"></i></button>
                </div>
                <form id="habitForm" class="p-6 space-y-5">
                    <input type="hidden" id="habitId">
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1.5">Habit Name</label>
                        <input type="text" id="habitTitle" required placeholder="e.g. Deep Work 2h" class="w-full px-4 py-3 rounded-xl bg-slate-50 dark:bg-black/40 border-none ring-1 ring-slate-200 dark:ring-white/10 focus:ring-2 focus:ring-orbit-500 outline-none transition-all placeholder-slate-400">
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1.5">Category</label>
                            <div class="relative">
                                <select id="habitCategory" class="w-full px-4 py-3 rounded-xl bg-slate-50 dark:bg-black/40 border-none ring-1 ring-slate-200 dark:ring-white/10 focus:ring-2 focus:ring-orbit-500 outline-none appearance-none">
                                    <option value="Health">Health</option>
                                    <option value="Work">Work</option>
                                    <option value="Learning">Learning</option>
                                    <option value="Creativity">Creativity</option>
                                    <option value="Mindset">Mindset</option>
                                </select>
                                <i class="ph-bold ph-caret-down absolute right-4 top-3.5 text-slate-400 pointer-events-none"></i>
                            </div>
                        </div>
                        <div>
                            <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1.5">Goal</label>
                             <div class="relative">
                                <select id="habitFrequency" class="w-full px-4 py-3 rounded-xl bg-slate-50 dark:bg-black/40 border-none ring-1 ring-slate-200 dark:ring-white/10 focus:ring-2 focus:ring-orbit-500 outline-none appearance-none">
                                    <option value="daily">Daily</option>
                                    <option value="weekly">Weekly</option>
                                </select>
                                <i class="ph-bold ph-caret-down absolute right-4 top-3.5 text-slate-400 pointer-events-none"></i>
                            </div>
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1.5">Identity Icon</label>
                        <div class="flex gap-2 overflow-x-auto pb-2 no-scrollbar" id="iconPicker"></div>
                    </div>
                    <button type="submit" class="w-full bg-gradient-to-r from-orbit-600 to-blue-600 hover:from-orbit-500 hover:to-blue-500 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-orbit-500/25 transition-all hover:scale-[1.02] active:scale-[0.98]">
                        Initialize Habit
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- MAIN JAVASCRIPT -->
    <script>
        // --- CONFIG ---
        let habits = JSON.parse(localStorage.getItem('orbitHabits')) || [];
        let userXP = parseInt(localStorage.getItem('orbitXP')) || 0;
        let currentFilter = 'all';
        let charts = {};
        
        const icons = [
            'ph-rocket', 'ph-barbell', 'ph-book-open', 'ph-brain', 'ph-code', 
            'ph-drop', 'ph-leaf', 'ph-moon-stars', 'ph-paint-brush', 'ph-coffee', 
            'ph-money', 'ph-heart-beat', 'ph-lightning'
        ];

        // --- INIT ---
        document.addEventListener('DOMContentLoaded', () => {
            window.dayjs = dayjs;
            document.getElementById('dateDisplay').innerText = dayjs().format('dddd, MMM D');
            
            renderIcons();
            renderHabits();
            updateStats();
            renderHeatmap();
            renderCharts();
            updateXPUI();
            
            // Auto Theme
            if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            }
        });

        // --- CORE FUNCTIONS ---
        function getTodayString() { return dayjs().format('YYYY-MM-DD'); }

        function renderIcons() {
            const picker = document.getElementById('iconPicker');
            picker.innerHTML = icons.map(icon => `
                <div onclick="selectIcon('${icon}')" class="icon-option shrink-0 w-10 h-10 rounded-lg bg-slate-100 dark:bg-white/5 cursor-pointer flex items-center justify-center hover:bg-orbit-100 dark:hover:bg-orbit-900/30 transition-all border border-transparent" data-icon="${icon}">
                    <i class="ph-bold ${icon} text-lg"></i>
                </div>
            `).join('');
            selectIcon(icons[0]);
        }

        function selectIcon(iconName) {
            document.querySelectorAll('.icon-option').forEach(e => {
                e.classList.remove('ring-2', 'ring-orbit-500', 'bg-orbit-50', 'text-orbit-600');
                if(e.dataset.icon === iconName) {
                    e.classList.add('ring-2', 'ring-orbit-500', 'bg-orbit-50', 'text-orbit-600');
                    e.dataset.selected = "true";
                } else {
                    delete e.dataset.selected;
                }
            });
        }

        function renderHabits() {
            const container = document.getElementById('habitsContainer');
            container.innerHTML = '';
            
            const filtered = currentFilter === 'all' ? habits : habits.filter(h => h.category === currentFilter);
            
            if (filtered.length === 0) {
                document.getElementById('emptyState').classList.remove('hidden');
                container.classList.add('hidden');
            } else {
                document.getElementById('emptyState').classList.add('hidden');
                container.classList.remove('hidden');
            }

            filtered.forEach(habit => {
                const isDone = habit.completedDates.includes(getTodayString());
                const streak = calculateStreak(habit);
                
                const div = document.createElement('div');
                div.className = `glass-panel p-4 rounded-xl flex items-center justify-between group transition-all duration-300 hover:scale-[1.01] ${isDone ? 'border-l-4 border-l-orbit-500' : 'border-l-4 border-l-transparent'}`;
                
                div.innerHTML = `
                    <div class="flex items-center gap-4">
                        <div class="w-12 h-12 rounded-xl bg-gradient-to-br ${getCategoryGradient(habit.category)} flex items-center justify-center text-white shadow-md">
                            <i class="ph-bold ${habit.icon} text-xl"></i>
                        </div>
                        <div>
                            <h4 class="font-bold text-slate-800 dark:text-white ${isDone ? 'line-through opacity-50' : ''}">${habit.title}</h4>
                            <div class="flex items-center gap-3 mt-1">
                                <span class="text-xs font-mono text-slate-500 bg-slate-100 dark:bg-white/10 px-1.5 py-0.5 rounded">${habit.category}</span>
                                <span class="text-xs font-bold text-orange-500 flex items-center gap-1"><i class="ph-fill ph-fire"></i> ${streak}</span>
                            </div>
                        </div>
                    </div>
                    
                    <div class="flex items-center gap-3">
                        <div class="flex gap-1 opacity-0 group-hover:opacity-100 transition-opacity absolute right-16 sm:static sm:mr-0 mr-4">
                             <button onclick="editHabit('${habit.id}')" class="p-2 text-slate-400 hover:text-orbit-500"><i class="ph-bold ph-pencil-simple"></i></button>
                             <button onclick="deleteHabit('${habit.id}')" class="p-2 text-slate-400 hover:text-red-500"><i class="ph-bold ph-trash"></i></button>
                        </div>
                        <button onclick="toggleHabit('${habit.id}')" class="check-btn w-12 h-12 rounded-xl border-2 flex items-center justify-center transition-all ${isDone ? 'bg-orbit-500 border-orbit-500 text-white shadow-lg shadow-orbit-500/40' : 'border-slate-200 dark:border-white/10 hover:border-orbit-400 dark:hover:border-orbit-400 text-transparent'}">
                            <i class="ph-bold ph-check text-xl"></i>
                        </button>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        // --- GAMIFICATION & LOGIC ---
        function toggleHabit(id) {
            const habit = habits.find(h => h.id === id);
            const today = getTodayString();
            
            if (habit.completedDates.includes(today)) {
                habit.completedDates = habit.completedDates.filter(d => d !== today);
                addXP(-20); // Penalty for undoing
            } else {
                habit.completedDates.push(today);
                triggerConfetti();
                addXP(20); // Reward
            }
            
            saveData();
            refreshUI();
        }

        function addXP(amount) {
            userXP = Math.max(0, userXP + amount);
            localStorage.setItem('orbitXP', userXP);
            updateXPUI();
        }

        function updateXPUI() {
            const level = Math.floor(userXP / 100) + 1;
            const currentLevelXP = userXP % 100;
            const percent = currentLevelXP; // Since max is 100 per level

            document.getElementById('userLevel').innerText = level;
            document.getElementById('mobileLevel').innerText = level;
            document.getElementById('currentXP').innerText = currentLevelXP;
            document.getElementById('mobileXP').innerText = userXP; // Show total on mobile for simplicity
            document.getElementById('stat-xp').innerText = userXP;

            document.getElementById('xpBar').style.width = `${percent}%`;
            document.getElementById('mobileXPBar').style.width = `${percent}%`;
        }

        function renderHeatmap() {
            const el = document.getElementById('heatmap');
            el.innerHTML = '';
            
            // Last 150 days (approx 5 months)
            const today = dayjs();
            for (let i = 150; i >= 0; i--) {
                const date = today.subtract(i, 'day');
                const dateStr = date.format('YYYY-MM-DD');
                
                // Count completions on this day
                const count = habits.reduce((acc, h) => acc + (h.completedDates.includes(dateStr) ? 1 : 0), 0);
                
                // Determine color intensity
                let colorClass = 'bg-slate-200 dark:bg-white/5';
                if (count > 0) colorClass = 'bg-orbit-200/50';
                if (count > 1) colorClass = 'bg-orbit-300';
                if (count > 3) colorClass = 'bg-orbit-500';
                if (count > 5) colorClass = 'bg-orbit-700';

                const cell = document.createElement('div');
                cell.className = `w-3 h-3 rounded-[3px] ${colorClass} hover:ring-2 hover:ring-white/50 transition-all`;
                cell.title = `${date.format('MMM D')}: ${count} completed`;
                el.appendChild(cell);
            }
        }

        function calculateStreak(habit) {
            let streak = 0;
            let checkDate = dayjs();
            
            // Check today then go back
            if (!habit.completedDates.includes(checkDate.format('YYYY-MM-DD'))) {
                checkDate = checkDate.subtract(1, 'day');
                if (!habit.completedDates.includes(checkDate.format('YYYY-MM-DD'))) return 0;
            }

            while (habit.completedDates.includes(checkDate.format('YYYY-MM-DD'))) {
                streak++;
                checkDate = checkDate.subtract(1, 'day');
            }
            return streak;
        }

        function updateStats() {
            const total = habits.length;
            if (total === 0) return;

            const today = getTodayString();
            const doneToday = habits.filter(h => h.completedDates.includes(today)).length;
            const rate = Math.round((doneToday / total) * 100);
            
            let maxStreak = 0;
            habits.forEach(h => {
                const s = calculateStreak(h);
                if(s > maxStreak) maxStreak = s;
            });

            document.getElementById('stat-completion').innerText = `${rate}%`;
            document.getElementById('stat-streak').innerText = maxStreak;
            document.getElementById('stat-total').innerText = total;
        }

        // --- CHARTS (Apex) ---
        function renderCharts() {
            const isDark = document.documentElement.classList.contains('dark');
            const colorText = isDark ? '#94a3b8' : '#475569';
            
            // Weekly Data
            const weekDays = [];
            const weekCounts = [];
            for(let i=6; i>=0; i--) {
                const d = dayjs().subtract(i, 'day');
                weekDays.push(d.format('dd'));
                const dateStr = d.format('YYYY-MM-DD');
                weekCounts.push(habits.reduce((acc, h) => acc + (h.completedDates.includes(dateStr) ? 1 : 0), 0));
            }

            // Radar Data (Categories)
            const categories = ['Health', 'Work', 'Learning', 'Creativity', 'Mindset'];
            const catCounts = categories.map(cat => habits.filter(h => h.category === cat).length);

            // Chart 1: Area
            const weeklyOptions = {
                series: [{ name: 'Completions', data: weekCounts }],
                chart: { type: 'area', height: 180, toolbar: { show: false }, background: 'transparent', fontFamily: 'Plus Jakarta Sans' },
                stroke: { curve: 'smooth', width: 3 },
                fill: { type: 'gradient', gradient: { shadeIntensity: 1, opacityFrom: 0.7, opacityTo: 0.1, stops: [0, 90, 100] } },
                dataLabels: { enabled: false },
                xaxis: { categories: weekDays, labels: { style: { colors: colorText } }, axisBorder: { show: false }, axisTicks: { show: false } },
                yaxis: { show: false },
                grid: { show: false },
                colors: ['#2dd4bf'],
                tooltip: { theme: isDark ? 'dark' : 'light' }
            };

            // Chart 2: Radar
            const radarOptions = {
                series: [{ name: 'Habits', data: catCounts }],
                chart: { type: 'radar', height: 250, toolbar: { show: false }, background: 'transparent', fontFamily: 'Plus Jakarta Sans' },
                stroke: { width: 2, colors: ['#6366f1'] },
                fill: { opacity: 0.2, colors: ['#6366f1'] },
                markers: { size: 3, colors: ['#fff'], strokeColors: '#6366f1', strokeWidth: 2 },
                xaxis: { categories: categories, labels: { style: { colors: colorText, fontSize: '11px', fontFamily: 'Outfit' } } },
                yaxis: { show: false },
                plotOptions: { radar: { polygons: { strokeColors: isDark ? '#334155' : '#e2e8f0', connectorColors: isDark ? '#334155' : '#e2e8f0' } } },
                tooltip: { theme: isDark ? 'dark' : 'light' }
            };

            if (charts.weekly) charts.weekly.destroy();
            charts.weekly = new ApexCharts(document.querySelector("#weeklyChart"), weeklyOptions);
            charts.weekly.render();

            if (charts.radar) charts.radar.destroy();
            charts.radar = new ApexCharts(document.querySelector("#radarChart"), radarOptions);
            charts.radar.render();
        }

        // --- DATA MANAGEMENT ---
        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({ habits, xp: userXP }));
            const downloadAnchorNode = document.createElement('a');
            downloadAnchorNode.setAttribute("href", dataStr);
            downloadAnchorNode.setAttribute("download", "orbit_data_" + dayjs().format('YYYY-MM-DD') + ".json");
            document.body.appendChild(downloadAnchorNode);
            downloadAnchorNode.click();
            downloadAnchorNode.remove();
        }

        function importData(input) {
            const file = input.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    if(data.habits) habits = data.habits;
                    if(data.xp) userXP = data.xp;
                    saveData();
                    refreshUI();
                    alert("Data imported successfully!");
                } catch(err) {
                    alert("Invalid JSON file");
                }
            };
            reader.readAsText(file);
        }

        // --- UTILS & FORM ---
        function getCategoryGradient(cat) {
            const map = {
                'Health': 'from-green-400 to-emerald-600',
                'Work': 'from-blue-400 to-indigo-600',
                'Learning': 'from-purple-400 to-fuchsia-600',
                'Creativity': 'from-pink-400 to-rose-600',
                'Mindset': 'from-amber-400 to-orange-600'
            };
            return map[cat] || 'from-slate-400 to-slate-600';
        }

        function filterHabits(cat) {
            currentFilter = cat;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.className = 'filter-btn px-4 py-1 rounded-lg text-xs font-bold transition-all text-slate-500 hover:bg-white/50 dark:hover:bg-white/10';
                if(btn.dataset.cat === cat) {
                    btn.className = 'filter-btn active px-4 py-1 rounded-lg text-xs font-bold transition-all bg-white dark:bg-slate-700 shadow-sm text-orbit-600 dark:text-orbit-400';
                }
            });
            renderHabits();
        }

        function refreshUI() {
            renderHabits();
            updateStats();
            renderHeatmap();
            renderCharts();
        }

        function saveData() {
            localStorage.setItem('orbitHabits', JSON.stringify(habits));
            localStorage.setItem('orbitXP', userXP);
        }

        // Form Handling
        const form = document.getElementById('habitForm');
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const id = document.getElementById('habitId').value;
            const title = document.getElementById('habitTitle').value;
            const category = document.getElementById('habitCategory').value;
            const frequency = document.getElementById('habitFrequency').value;
            const iconEl = document.querySelector('.icon-option[data-selected="true"]');
            const icon = iconEl ? iconEl.dataset.icon : 'ph-star';

            if (id) {
                const idx = habits.findIndex(h => h.id === id);
                if (idx > -1) habits[idx] = { ...habits[idx], title, category, frequency, icon };
            } else {
                habits.push({ id: Date.now().toString(), title, category, frequency, icon, completedDates: [] });
                addXP(50); // Creation bonus
            }
            saveData();
            refreshUI();
            closeModal();
            triggerConfetti();
        });

        function editHabit(id) {
            const h = habits.find(h => h.id === id);
            document.getElementById('habitId').value = h.id;
            document.getElementById('habitTitle').value = h.title;
            document.getElementById('habitCategory').value = h.category;
            selectIcon(h.icon);
            document.getElementById('modalTitle').innerText = "Edit Protocol";
            openModal();
        }

        function deleteHabit(id) {
            if(confirm("Terminate this protocol?")) {
                habits = habits.filter(h => h.id !== id);
                saveData();
                refreshUI();
            }
        }

        // Modal Controls
        const modal = document.getElementById('habitModal');
        function openModal() { modal.classList.remove('hidden'); }
        function closeModal() { 
            modal.classList.add('hidden'); 
            document.getElementById('habitForm').reset();
            document.getElementById('habitId').value = '';
            document.getElementById('modalTitle').innerText = "New Protocol";
            selectIcon(icons[0]);
        }

        // Visual Effects
        function triggerConfetti() {
            confetti({
                particleCount: 150, spread: 80, origin: { y: 0.6 },
                colors: ['#2dd4bf', '#818cf8', '#c084fc', '#f472b6']
            });
        }

        document.getElementById('themeToggle').addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
            renderCharts();
        });
    </script>
</body>
</html>
