            editor.session.setMode('ace/mode/html');
            editor.setOptions({
                fontSize: 14,
                showPrintMargin: false,
                enableLiveAutocompletion: true,
                enableBasicAutocompletion: true
            });
            editor.session.setUseWrapMode(true);

            // Load saved or sample
            const saved = localStorage.getItem('html_code');
            editor.setValue(saved || SAMPLE_HTML, -1);

            // Auto-update preview
            editor.session.on('change', () => {
                clearTimeout(debounceTimer);
                debounceTimer = setTimeout(updatePreview, 300);
            });

            updatePreview();

            // Auto-save
            setInterval(() => {
                localStorage.setItem('html_code', editor.getValue());
            }, 2000);
        }

        // Update Preview
        function updatePreview() {
            const iframe = document.getElementById('preview');
            iframe.srcdoc = editor.getValue();
        }

        // Format Code
        function formatCode() {
            if (typeof html_beautify === 'undefined') return;
            const code = editor.getValue();
            if (!code.trim()) return;

            try {
                const formatted = html_beautify(code, {
                    indent_size: 2,
                    preserve_newlines: true,
                    max_preserve_newlines: 2
                });
                const pos = editor.getCursorPosition();
                editor.setValue(formatted, -1);
                editor.moveCursorToPosition(pos);
            } catch (e) {
                console.error('Format error:', e);
            }
        }

        // Toggle Theme
        function toggleTheme() {
            const isLight = document.body.classList.toggle('light');
            localStorage.setItem('theme', isLight ? 'light' : 'dark');
            editor.setTheme(isLight ? 'ace/theme/chrome' : 'ace/theme/monokai');
        }

        // Import File
        function importFile() {
            document.getElementById('file-input').click();
        }

        // Export File
        function exportFile() {
            const blob = new Blob([editor.getValue()], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'index.html';
            a.click();
            URL.revokeObjectURL(url);
        }

        // Resize Handler
        let isResizing = false;
        let startX = 0;
        let startWidth = 0;

        function startResize(e) {
            isResizing = true;
            startX = e.clientX;
            startWidth = document.getElementById('editor-pane').offsetWidth;
            document.body.classList.add('resizing');
        }

        function resize(e) {
            if (!isResizing) return;
            const delta = e.clientX - startX;
            const newWidth = Math.max(300, Math.min(startWidth + delta, window.innerWidth - 300));
            document.getElementById('editor-pane').style.flex = `0 0 ${newWidth}px`;
            editor.resize();
        }

        function stopResize() {
            if (!isResizing) return;
            isResizing = false;
            document.body.classList.remove('resizing');
        }

        // Mobile Tabs
        function handleMobileTabs() {
            const tabs = document.querySelectorAll('.mobile-nav button');
            tabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    tabs.forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');

                    const target = tab.dataset.tab;
                    if (target === 'editor') {
                        document.getElementById('editor-pane').classList.add('active');
                        document.getElementById('preview-pane').classList.remove('active');
                        editor.resize();
                    } else if (target === 'preview') {
                        document.getElementById('preview-pane').classList.add('active');
                        document.getElementById('editor-pane').classList.remove('active');
                    } else if (target === 'menu') {
                        document.querySelector('.sidebar').style.display = 'flex';
                    }
                });
            });
        }

        // Event Listeners
        document.addEventListener('DOMContentLoaded', () => {
            initEditor();

            // Load theme
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'light') {
                document.body.classList.add('light');
                editor.setTheme('ace/theme/chrome');
            }

            // Buttons
            document.getElementById('format-btn').addEventListener('click', formatCode);
            document.getElementById('sample-btn').addEventListener('click', () => {
                editor.setValue(SAMPLE_HTML, -1);
            });
            document.getElementById('clear-btn').addEventListener('click', () => {
                if (confirm('Clear all code?')) editor.setValue('', -1);
            });
            document.getElementById('import-btn').addEventListener('click', importFile);
            document.getElementById('export-btn').addEventListener('click', exportFile);
            document.getElementById('theme-btn').addEventListener('click', toggleTheme);
            document.getElementById('copy-btn').addEventListener('click', () => {
                navigator.clipboard.writeText(editor.getValue());
            });
            document.getElementById('find-btn').addEventListener('click', () => {
                editor.execCommand('find');
            });

            // Preview buttons
            document.getElementById('desktop-btn').addEventListener('click', () => {
                document.getElementById('preview-wrapper').classList.remove('mobile');
            });
            document.getElementById('mobile-btn').addEventListener('click', () => {
                document.getElementById('preview-wrapper').classList.add('mobile');
            });

            // File input
            document.getElementById('file-input').addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (evt) => {
                    editor.setValue(evt.target.result, -1);
                };
                reader.readAsText(file);
                e.target.value = '';
            });

            // Resizer
            document.getElementById('resizer').addEventListener('mousedown', startResize);
            document.addEventListener('mousemove', resize);
            document.addEventListener('mouseup', stopResize);

            // Mobile tabs
            handleMobileTabs();
        });
    </script>
</body>
</html>
