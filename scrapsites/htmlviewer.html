<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Editor Studio</title>

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<!-- Icons -->
<script src="https://unpkg.com/@phosphor-icons/web"></script>

<style>
/* --- RESET & VARIABLES --- */
* { margin: 0; padding: 0; box-sizing: border-box; outline: none; }

:root {
    /* Dark Theme */
    --bg-app: #09090b;
    --bg-sidebar: #18181b;
    --bg-panel: #18181b;
    --border: #27272a;
    --border-subtle: #3f3f46;
    
    --text-main: #f4f4f5;
    --text-muted: #a1a1aa;
    
    --primary: #3b82f6;
    --primary-hover: #2563eb;
    --primary-text: #ffffff;
    
    --hover-bg: #27272a;
    
    --font-ui: 'Inter', sans-serif;
    --font-code: 'JetBrains Mono', 'Menlo', monospace;
}

body.light {
    --bg-app: #ffffff;
    --bg-sidebar: #f4f4f5;
    --bg-panel: #ffffff;
    --border: #e4e4e7;
    --border-subtle: #d4d4d8;
    
    --text-main: #18181b;
    --text-muted: #71717a;
    
    --primary: #2563eb;
    --hover-bg: #e4e4e7;
}

html, body { height: 100%; overflow: hidden; }

body {
    background: var(--bg-app);
    color: var(--text-main);
    font-family: var(--font-ui);
    font-size: 13px;
    display: flex;
}

/* --- SIDEBAR --- */
.sidebar {
    width: 64px;
    background: var(--bg-sidebar);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    align-items: center;
    flex-shrink: 0;
    padding: 16px 0;
    transition: width 0.3s ease;
}

.brand { margin-bottom: 24px; display: flex; justify-content: center; }

.brand-icon {
    width: 36px; height: 36px;
    background: linear-gradient(135deg, var(--primary), #60a5fa);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    color: white; font-size: 20px;
}

.menu {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 8px; width: 100%;
}

.nav-btn {
    width: 40px; height: 40px;
    display: flex; align-items: center; justify-content: center;
    background: transparent; border: none; border-radius: 8px;
    color: var(--text-muted); font-size: 20px;
    cursor: pointer; transition: all 0.2s; position: relative;
    text-decoration: none;
}

.nav-btn:hover { background: var(--hover-bg); color: var(--text-main); }
.nav-btn.primary-action { background: rgba(59, 130, 246, 0.15); color: var(--primary); }
.nav-btn.primary-action:hover { background: var(--primary); color: white; }

.nav-btn::after {
    content: attr(title); position: absolute; left: 48px;
    background: var(--bg-app); border: 1px solid var(--border);
    color: var(--text-main); padding: 4px 8px; border-radius: 4px;
    font-size: 11px; white-space: nowrap; opacity: 0; pointer-events: none;
    transition: opacity 0.2s; z-index: 100;
}
.nav-btn:hover::after { opacity: 1; }

.sidebar-footer { padding-top: 12px; width: 100%; display: flex; justify-content: center; }
.theme-toggle {
    width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
    background: transparent; border: none; border-radius: 8px;
    cursor: pointer; color: var(--text-muted); font-size: 20px;
}
.theme-toggle:hover { background: var(--hover-bg); color: var(--text-main); }

/* --- MAIN LAYOUT --- */
.main-area { flex: 1; display: flex; min-width: 0; background: var(--bg-app); }
.pane { flex: 1; display: flex; flex-direction: column; min-width: 0; position: relative; }

.pane-header {
    height: 40px; padding: 0 12px;
    display: flex; align-items: center; justify-content: space-between;
    background: var(--bg-panel); border-bottom: 1px solid var(--border);
}

.pane-title {
    font-size: 11px; font-weight: 600; color: var(--text-muted);
    text-transform: uppercase; letter-spacing: 0.05em;
    display: flex; align-items: center; gap: 8px;
}

/* Device Selector Styling */
.pane-actions { display: flex; gap: 8px; align-items: center; }

.device-select {
    appearance: none;
    background: var(--bg-app);
    border: 1px solid var(--border);
    color: var(--text-muted);
    font-family: var(--font-ui);
    font-size: 11px;
    padding: 4px 8px;
    border-radius: 6px;
    cursor: pointer;
    outline: none;
    height: 28px;
    display: none; /* Hidden by default */
}
.device-select:hover { border-color: var(--text-muted); color: var(--text-main); }
.device-select.visible { display: block; }

.icon-btn {
    width: 28px; height: 28px;
    display: flex; align-items: center; justify-content: center;
    background: transparent; border: none; border-radius: 4px;
    color: var(--text-muted); cursor: pointer; transition: all 0.2s;
}
.icon-btn:hover { background: var(--hover-bg); color: var(--text-main); }
.icon-btn.active { color: var(--primary); background: rgba(59, 130, 246, 0.1); }

/* --- EDITOR --- */
.pane-content { flex: 1; position: relative; background: var(--bg-app); }
#editor { position: absolute; inset: 0; }
.ace_editor { font-family: var(--font-code) !important; font-size: 13px !important; line-height: 1.6 !important; }
.ace_gutter { background: var(--bg-app) !important; color: var(--text-muted) !important; border-right: 1px solid var(--border); }

/* --- PREVIEW --- */
.preview-container {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    background: #000; padding: 0; transition: all 0.3s; overflow: hidden;
}
body.light .preview-container { background: #f1f5f9; }

iframe#preview {
    width: 100%; height: 100%; border: none; background: white;
    transition: width 0.3s ease, height 0.3s ease, border-radius 0.3s ease;
}

/* Mobile Simulation */
.preview-container.mobile-mode {
    padding: 40px;
    background-image: radial-gradient(var(--border) 1px, transparent 0);
    background-size: 20px 20px;
}

.preview-container.mobile-mode iframe#preview {
    /* Dimensions handled by JS */
    border-radius: 32px;
    box-shadow: 0 0 0 10px #2d2d30, 0 20px 40px rgba(0,0,0,0.6);
}
body.light .preview-container.mobile-mode iframe#preview {
    box-shadow: 0 0 0 10px #e2e8f0, 0 20px 40px rgba(0,0,0,0.2);
}

/* --- RESIZER --- */
.resizer { width: 1px; background: var(--border); cursor: col-resize; position: relative; z-index: 10; }
.resizer::after { content: ''; position: absolute; left: -4px; right: -4px; top: 0; bottom: 0; cursor: col-resize; }
.resizer:hover, body.resizing .resizer { background: var(--primary); width: 2px; }
body.resizing { cursor: col-resize; user-select: none; }
body.resizing iframe { pointer-events: none; }

/* --- MOBILE UI --- */
.mobile-nav { display: none; }
@media (max-width: 768px) {
    body { flex-direction: column; }
    .sidebar, .resizer { display: none; }
    .main-area { flex-direction: column; }
    .pane { display: none; height: 100%; }
    .pane.active { display: flex; }
    .mobile-nav {
        height: 50px; background: var(--bg-panel); border-top: 1px solid var(--border);
        display: flex; justify-content: space-around; align-items: center; flex-shrink: 0;
    }
    .mobile-tab {
        background: none; border: none; color: var(--text-muted);
        display: flex; flex-direction: column; align-items: center;
        font-size: 10px; gap: 2px; cursor: pointer; padding: 6px;
    }
    .mobile-tab.active { color: var(--primary); }
    .device-select { display: none !important; } /* Hide dropdown on actual mobile */
}
</style>
</head>
<body>

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="brand">
            <div class="brand-icon"><i class="ph ph-code"></i></div>
        </div>
        <nav class="menu">
            <button class="nav-btn primary-action" id="format-btn" title="Format Code"><i class="ph ph-magic-wand"></i></button>
            <button class="nav-btn" id="sample-btn" title="Load Sample"><i class="ph ph-file-code"></i></button>
            <button class="nav-btn" id="clear-btn" title="Clear Code"><i class="ph ph-trash"></i></button>
            <div style="height: 1px; width: 24px; background: var(--border); margin: 4px 0;"></div>
            <button class="nav-btn" id="import-btn" title="Import HTML"><i class="ph ph-upload-simple"></i></button>
            <button class="nav-btn" id="export-btn" title="Export HTML"><i class="ph ph-download-simple"></i></button>
            <a href="https://black-ice-3dbk.onrender.com/scrapsites/intsitebuild.html" class="nav-btn" target="_blank" title="Site Builder"><i class="ph ph-hammer"></i></a>
        </nav>
        <div class="sidebar-footer">
            <button class="theme-toggle" id="theme-btn" title="Toggle Theme"><i class="ph ph-moon"></i></button>
        </div>
    </aside>

    <!-- MAIN AREA -->
    <main class="main-area">
        <section class="pane active" id="editor-pane">
            <header class="pane-header">
                <div class="pane-title"><i class="ph ph-pencil-simple"></i> Editor</div>
                <div class="pane-actions">
                    <button class="icon-btn" id="find-btn" title="Search"><i class="ph ph-magnifying-glass"></i></button>
                    <button class="icon-btn" id="copy-btn" title="Copy"><i class="ph ph-copy"></i></button>
                </div>
            </header>
            <div class="pane-content"><div id="editor"></div></div>
        </section>

        <div class="resizer" id="resizer"></div>

        <section class="pane active" id="preview-pane">
            <header class="pane-header">
                <div class="pane-title"><i class="ph ph-eye"></i> Preview</div>
                <div class="pane-actions">
                    <!-- Device Selector Dropdown -->
                    <select id="device-select" class="device-select">
                        <option value="375x667">iPhone SE (375x667)</option>
                        <option value="390x844" selected>iPhone 14 (390x844)</option>
                        <option value="430x932">iPhone 14 Pro Max (430x932)</option>
                        <option value="412x915">Pixel 7 (412x915)</option>
                        <option value="360x800">Samsung S22 (360x800)</option>
                        <option value="768x1024">iPad Mini (768x1024)</option>
                    </select>

                    <button class="icon-btn active" id="desktop-btn" title="Desktop View"><i class="ph ph-monitor"></i></button>
                    <button class="icon-btn" id="mobile-btn" title="Mobile View"><i class="ph ph-device-mobile"></i></button>
                </div>
            </header>
            <div class="pane-content">
                <div class="preview-container" id="preview-wrapper">
                    <iframe id="preview" title="Output"></iframe>
                </div>
            </div>
        </section>
    </main>

    <nav class="mobile-nav">
        <button class="mobile-tab active" data-tab="editor"><i class="ph ph-code" style="font-size: 20px;"></i></button>
        <button class="mobile-tab" data-tab="preview"><i class="ph ph-eye" style="font-size: 20px;"></i></button>
        <button class="mobile-tab" id="mobile-theme-btn"><i class="ph ph-moon" style="font-size: 20px;"></i></button>
    </nav>

    <input type="file" id="file-input" accept=".html" hidden>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.37.1/ace.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-beautify/1.15.1/beautify-html.min.js"></script>
    
    <script>
        // --- LOGIC ---
        let editor;
        let debounceTimer;

        const SAMPLE_HTML = `<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Modern Starter</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
    :root { --bg: #f9fafb; --text: #1f2937; --accent: #3b82f6; }
    body { font-family: sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; align-items: center; justify-content: center; height: 100vh; text-align: center; }
    .card { background: white; padding: 2rem; border-radius: 1rem; box-shadow: 0 10px 25px rgba(0,0,0,0.05); max-width: 400px; }
    h1 { margin-bottom: 0.5rem; letter-spacing: -0.025em; }
    p { color: #6b7280; line-height: 1.5; margin-bottom: 1.5rem; }
    button { background: var(--accent); color: white; border: none; padding: 0.75rem 1.5rem; border-radius: 99px; font-weight: 600; cursor: pointer; transition: 0.2s; }
    button:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(59, 130, 246, 0.4); }
</style>
</head>
<body>
    <div class="card">
        <h1>Hello World</h1>
        <p>This is a live preview of your code. Edit the HTML on the left and see changes instantly.</p>
        <button>Get Started</button>
    </div>
</body>
</html>`;

        function initEditor() {
            editor = ace.edit('editor');
            editor.setTheme('ace/theme/tomorrow_night'); 
            editor.session.setMode('ace/mode/html');
            editor.setOptions({
                fontSize: 14, fontFamily: "'JetBrains Mono', 'Menlo', monospace",
                showPrintMargin: false, enableLiveAutocompletion: true,
                showGutter: true, highlightActiveLine: true, wrap: true
            });

            const saved = localStorage.getItem('html_code');
            editor.setValue(saved || SAMPLE_HTML, -1);

            editor.session.on('change', () => {
                clearTimeout(debounceTimer);
                debounceTimer = setTimeout(updatePreview, 300);
            });
            updatePreview();

            setInterval(() => localStorage.setItem('html_code', editor.getValue()), 2000);
        }

        function updatePreview() {
            const iframe = document.getElementById('preview');
            iframe.srcdoc = editor.getValue();
        }

        function formatCode() {
            if (typeof html_beautify === 'undefined') return;
            try {
                const formatted = html_beautify(editor.getValue(), { indent_size: 2, preserve_newlines: true });
                editor.setValue(formatted, -1);
            } catch (e) { console.error(e); }
        }

        function toggleTheme() {
            const isLight = document.body.classList.toggle('light');
            const icon = document.querySelector('#theme-btn i');
            const mobileIcon = document.querySelector('#mobile-theme-btn i');
            
            localStorage.setItem('theme', isLight ? 'light' : 'dark');
            editor.setTheme(isLight ? 'ace/theme/chrome' : 'ace/theme/tomorrow_night');
            
            if(icon) icon.className = isLight ? 'ph ph-sun' : 'ph ph-moon';
            if(mobileIcon) mobileIcon.className = isLight ? 'ph ph-sun' : 'ph ph-moon';
        }

        // View Mode Logic
        function initViewModes() {
            const wrapper = document.getElementById('preview-wrapper');
            const iframe = document.getElementById('preview');
            const desktopBtn = document.getElementById('desktop-btn');
            const mobileBtn = document.getElementById('mobile-btn');
            const deviceSelect = document.getElementById('device-select');

            function setDesktop() {
                wrapper.classList.remove('mobile-mode');
                iframe.style.width = '100%';
                iframe.style.height = '100%';
                desktopBtn.classList.add('active');
                mobileBtn.classList.remove('active');
                deviceSelect.classList.remove('visible');
            }

            function setMobile() {
                wrapper.classList.add('mobile-mode');
                applyDimensions(); // Apply currently selected size
                mobileBtn.classList.add('active');
                desktopBtn.classList.remove('active');
                deviceSelect.classList.add('visible');
            }

            function applyDimensions() {
                const [w, h] = deviceSelect.value.split('x');
                iframe.style.width = w + 'px';
                iframe.style.height = h + 'px';
            }

            desktopBtn.addEventListener('click', setDesktop);
            mobileBtn.addEventListener('click', setMobile);
            deviceSelect.addEventListener('change', applyDimensions);
        }

        function initResizer() {
            const resizer = document.getElementById('resizer');
            const leftPane = document.getElementById('editor-pane');
            let isResizing = false;
            let startX, startWidth;

            resizer.addEventListener('mousedown', (e) => {
                isResizing = true; startX = e.clientX; startWidth = leftPane.offsetWidth;
                document.body.classList.add('resizing');
            });
            document.addEventListener('mousemove', (e) => {
                if (!isResizing) return;
                const delta = e.clientX - startX;
                const newWidth = Math.max(200, Math.min(startWidth + delta, window.innerWidth - 200));
                leftPane.style.flex = `0 0 ${newWidth}px`;
                editor.resize();
            });
            document.addEventListener('mouseup', () => {
                isResizing = false; document.body.classList.remove('resizing');
            });
        }

        function initMobileTabs() {
            const tabs = document.querySelectorAll('.mobile-tab');
            const editorPane = document.getElementById('editor-pane');
            const previewPane = document.getElementById('preview-pane');

            tabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    if(tab.id === 'mobile-theme-btn') { toggleTheme(); return; }
                    tabs.forEach(t => { if(t.id !== 'mobile-theme-btn') t.classList.remove('active'); });
                    tab.classList.add('active');
                    const target = tab.dataset.tab;
                    if (target === 'editor') {
                        editorPane.classList.add('active'); previewPane.classList.remove('active'); editor.resize();
                    } else if (target === 'preview') {
                        previewPane.classList.add('active'); editorPane.classList.remove('active');
                    }
                });
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            initEditor();
            initResizer();
            initMobileTabs();
            initViewModes();

            if (localStorage.getItem('theme') === 'light') toggleTheme();

            document.getElementById('format-btn').addEventListener('click', formatCode);
            document.getElementById('sample-btn').addEventListener('click', () => editor.setValue(SAMPLE_HTML, -1));
            document.getElementById('clear-btn').addEventListener('click', () => editor.setValue('', -1));
            document.getElementById('theme-btn').addEventListener('click', toggleTheme);
            document.getElementById('copy-btn').addEventListener('click', () => navigator.clipboard.writeText(editor.getValue()));
            document.getElementById('find-btn').addEventListener('click', () => editor.execCommand('find'));

            document.getElementById('import-btn').addEventListener('click', () => document.getElementById('file-input').click());
            document.getElementById('file-input').addEventListener('change', (e) => {
                const f = e.target.files[0];
                if(f) { const r = new FileReader(); r.onload = (evt) => editor.setValue(evt.target.result, -1); r.readAsText(f); }
                e.target.value = '';
            });
            document.getElementById('export-btn').addEventListener('click', () => {
                const a = document.createElement('a');
                a.href = URL.createObjectURL(new Blob([editor.getValue()], {type:'text/html'}));
                a.download = 'index.html'; a.click();
            });
        });
    </script>
</body>
</html>
