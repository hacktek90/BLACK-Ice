<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <title> Editor Studio + URL Fetcher</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <!-- Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    

    <script src="https://js.puter.com/v2/"></script>

    <style>
        /* --- RESET & VARIABLES --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            outline: none;
        }

        :root {
            /* Dark Theme */
            --bg-app: #09090b;
            --bg-sidebar: #18181b;
            --bg-panel: #18181b;
            --border: #27272a;
            --border-subtle: #3f3f46;
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --primary-text: #ffffff;
            --hover-bg: #27272a;
            --font-ui: 'Inter', sans-serif;
            --font-code: 'JetBrains Mono', 'Menlo', monospace;
            --modal-bg: #18181b;
        }

        body.light {
            --bg-app: #ffffff;
            --bg-sidebar: #f4f4f5;
            --bg-panel: #ffffff;
            --border: #e4e4e7;
            --border-subtle: #d4d4d8;
            --text-main: #18181b;
            --text-muted: #71717a;
            --primary: #2563eb;
            --hover-bg: #e4e4e7;
            --modal-bg: #ffffff;
        }

        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
        }

        body {
            background: var(--bg-app);
            color: var(--text-main);
            font-family: var(--font-ui);
            font-size: 13px;
            display: flex;
        }

        /* --- SIDEBAR --- */
        .sidebar {
            width: 60px;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-shrink: 0;
            padding: 16px 0;
            transition: width 0.3s ease;
            z-index: 20;
        }

        .brand {
            margin-bottom: 24px;
            display: flex;
            justify-content: center;
        }

        .brand-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, var(--primary), #60a5fa);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 18px;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }

        .menu {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            width: 100%;
            overflow-y: auto;
        }

        .nav-btn {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: none;
            border-radius: 6px;
            color: var(--text-muted);
            font-size: 18px;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
            text-decoration: none;
        }

        .nav-btn:hover {
            background: var(--hover-bg);
            color: var(--text-main);
        }

        .nav-btn.primary-action {
            background: rgba(59, 130, 246, 0.15);
            color: var(--primary);
        }

        .nav-btn.primary-action:hover {
            background: var(--primary);
            color: white;
        }

        /* Tooltip */
        .nav-btn::after {
            content: attr(title);
            position: absolute;
            left: 44px;
            background: var(--bg-app);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
            z-index: 100;
            font-weight: 500;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
        }

        .nav-btn:hover::after {
            opacity: 1;
        }

        .sidebar-footer {
            padding-top: 12px;
            width: 100%;
            display: flex;
            justify-content: center;
        }

        .theme-toggle {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            color: var(--text-muted);
            font-size: 18px;
        }

        .theme-toggle:hover {
            background: var(--hover-bg);
            color: var(--text-main);
        }

        /* --- MAIN LAYOUT --- */
        .main-area {
            flex: 1;
            display: flex;
            min-width: 0;
            background: var(--bg-app);
            overflow: hidden;
        }

        .pane {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            position: relative;
            min-height: 0;
        }

        .pane-header {
            height: 36px;
            padding: 0 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-panel);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }

        .pane-title {
            font-size: 10px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .pane-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .device-select {
            appearance: none;
            background: var(--bg-app);
            border: 1px solid var(--border);
            color: var(--text-muted);
            font-family: var(--font-ui);
            font-size: 10px;
            padding: 4px 8px;
            border-radius: 6px;
            cursor: pointer;
            outline: none;
            height: 24px;
            display: none;
        }

        .device-select:hover {
            border-color: var(--text-muted);
            color: var(--text-main);
        }

        .device-select.visible {
            display: block;
        }

        .icon-btn {
            width: 26px;
            height: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: none;
            border-radius: 4px;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s;
        }

        .icon-btn:hover {
            background: var(--hover-bg);
            color: var(--text-main);
        }

        .icon-btn.active {
            color: var(--primary);
            background: rgba(59, 130, 246, 0.1);
        }

        /* --- EDITOR (MONACO) --- */
        .pane-content {
            flex: 1;
            position: relative;
            background: var(--bg-app);
            overflow: hidden;
            min-height: 0;
        }

        #editor-container {
            width: 100%;
            height: 100%;
            font-family: var(--font-code);
        }

        /* --- PREVIEW --- */
        .preview-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            padding: 0;
            transition: all 0.3s;
            overflow: hidden;
        }

        body.light .preview-container {
            background: #f1f5f9;
        }

        iframe#preview {
            width: 100%;
            height: 100%;
            border: none;
            background: white;
            transition: width 0.3s ease, height 0.3s ease, border-radius 0.3s ease;
        }

        /* Mobile Simulation */
        .preview-container.mobile-mode {
            padding: 20px;
            background-image: radial-gradient(var(--border) 1px, transparent 0);
            background-size: 20px 20px;
        }

        .preview-container.mobile-mode iframe#preview {
            border-radius: 24px;
            box-shadow: 0 0 0 8px #2d2d30, 0 20px 40px rgba(0, 0, 0, 0.6);
            max-width: 100%;
            max-height: 100%;
        }

        body.light .preview-container.mobile-mode iframe#preview {
            box-shadow: 0 0 0 8px #e2e8f0, 0 20px 40px rgba(0, 0, 0, 0.2);
        }

        /* --- RESIZER --- */
        .resizer {
            width: 4px;
            background: transparent;
            cursor: col-resize;
            position: relative;
            z-index: 10;
            flex-shrink: 0;
        }

        .resizer:hover,
        body.resizing .resizer {
            background: var(--primary);
            width: 4px;
        }

        .resizer::after {
            content: '';
            position: absolute;
            left: -4px;
            right: -4px;
            top: 0;
            bottom: 0;
        }

        body.resizing {
            cursor: col-resize;
            user-select: none;
        }

        body.resizing iframe {
            pointer-events: none;
        }

        /* --- MODAL STYLES --- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(2px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal {
            background: var(--modal-bg);
            border: 1px solid var(--border);
            width: 90%;
            max-width: 400px;
            border-radius: 12px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            padding: 20px;
            transform: translateY(10px);
            transition: transform 0.2s ease;
        }

        .modal-overlay.active .modal {
            transform: translateY(0);
        }

        .modal h3 {
            margin-bottom: 16px;
            font-size: 16px;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .modal-input {
            width: 100%;
            background: var(--bg-app);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 16px;
            font-family: var(--font-code);
            font-size: 13px;
        }

        .modal-input:focus {
            border-color: var(--primary);
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }

        .btn {
            padding: 8px 16px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            transition: all 0.2s;
        }

        .btn-secondary {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: var(--hover-bg);
            color: var(--text-main);
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-hover);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* --- TOAST NOTIFICATIONS --- */
        #toast-container {
            position: fixed;
            bottom: 24px;
            right: 24px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 2000;
        }

        .toast {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 12px 16px;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 10px;
            animation: slideIn 0.3s ease forwards;
            min-width: 250px;
        }

        .toast.error {
            border-left: 4px solid #ef4444;
        }

        .toast.success {
            border-left: 4px solid #22c55e;
        }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        @keyframes fadeOut {
            to { opacity: 0; transform: translateX(10px); }
        }

        /* --- MOBILE UI --- */
        .mobile-nav {
            display: none;
        }

        @media (max-width: 768px) {
            body {
                flex-direction: column;
            }

            .sidebar, .resizer {
                display: none;
            }

            .main-area {
                flex-direction: column;
            }

            .pane {
                display: none;
                height: 100%;
                min-height: 0;
            }

            .pane.active {
                display: flex;
            }

            .mobile-nav {
                height: 50px;
                background: var(--bg-panel);
                border-top: 1px solid var(--border);
                display: flex;
                justify-content: space-around;
                align-items: center;
                flex-shrink: 0;
            }

            .mobile-tab {
                background: none;
                border: none;
                color: var(--text-muted);
                display: flex;
                flex-direction: column;
                align-items: center;
                font-size: 10px;
                gap: 2px;
                cursor: pointer;
                padding: 6px;
            }

            .mobile-tab.active {
                color: var(--primary);
            }

            .device-select {
                display: none !important;
            }
        }
    </style>
    <!-- Monaco Editor Loader -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/require.js/2.3.6/require.min.js"></script>
</head>

<body>
    <!-- SIDEBAR -->
    <aside class="sidebar">

    <!-- MAIN AREA -->
    <main class="main-area">
        <section class="pane active" id="editor-pane">

            </header>
            <div class="pane-content">
                <div class="preview-container" id="preview-wrapper">
                    <iframe id="preview" title="Output"></iframe>
                </div>
            </div>
        </section>
    </main>

    <nav class="mobile-nav">
        <button class="mobile-tab active" data-tab="editor"><i class="ph ph-code" style="font-size: 20px;"></i></button>
        <button class="mobile-tab" data-tab="preview"><i class="ph ph-eye" style="font-size: 20px;"></i></button>
        <button class="mobile-tab" id="mobile-clear-btn"><i class="ph ph-trash" style="font-size: 20px;"></i></button>
        <button class="mobile-tab" id="mobile-theme-btn"><i class="ph ph-moon" style="font-size: 20px;"></i></button>
    </nav>

    <input type="file" id="file-input" accept=".html" hidden>

    <!-- FETCH URL MODAL -->
    <div class="modal-overlay" id="fetch-modal">
        <div class="modal">
            <h3><i class="ph ph-globe"></i> Fetch from URL</h3>

                <button class="btn btn-secondary" id="cancel-fetch">Cancel</button>

            </div>
        </div>
    </div>

    <!-- TOAST CONTAINER -->
    <div id="toast-container"></div>

    <script>

const SAMPLE_HTML = `<!DOCTYPE html>

// --- GLOBALS ---
let editor;
let debounceTimer;

// --- MONACO CONFIGURATION ---
require.config({ paths: { 'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs' }});

require(['vs/editor/editor.main'], function() {
    
    // 1. Create the Editor
    editor = monaco.editor.create(document.getElementById('editor-container'), {
        value: localStorage.getItem('html_code') || SAMPLE_HTML,
        language: 'html',
        theme: document.body.classList.contains('light') ? 'vs' : 'vs-dark',
        automaticLayout: true,
        fontSize: 13,
        fontFamily: "'JetBrains Mono', 'Menlo', monospace",
        fontLigatures: true,
        minimap: { enabled: true },
        scrollBeyondLastLine: false,
        wordWrap: 'on',
        lineNumbers: 'on',
        renderWhitespace: 'selection',
        suggest: { showKeywords: true, showSnippets: true },
        quickSuggestions: { other: true, comments: false, strings: false },
        parameterHints: { enabled: true },
        folding: true,
        foldingStrategy: 'auto',
        foldingHighlight: true,
        formatOnPaste: true,
        formatOnType: true,
        colorDecorators: true,
        renderLineHighlight: 'all',
        cursorBlinking: 'smooth',
        cursorSmoothCaretAnimation: 'on',
        smoothScrolling: true,
        contextmenu: true,
        mouseWheelZoom: true
    });

    // 2. Event Listeners
    editor.onDidChangeModelContent(() => {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(updatePreview, 300);
    });

    // Init Preview
    updatePreview();

    // Auto-save
    setInterval(() => {
        if (editor) localStorage.setItem('html_code', editor.getValue());
    }, 2000);
});

function updatePreview() {
    if (!editor) return;
    const iframe = document.getElementById('preview');
    iframe.srcdoc = editor.getValue();
}

function formatCode() {
    if (!editor) return;
    editor.getAction('editor.action.formatDocument').run();
}

// --- TOAST NOTIFICATION SYSTEM ---
function showToast(message, type = 'success') {
    const container = document.getElementById('toast-container');
    const toast = document.createElement('div');
    toast.className = `toast ${type}`;
    
    let icon = type === 'success' ? '<i class="ph ph-check-circle" style="font-size:16px"></i>' : '<i class="ph ph-warning-circle" style="font-size:16px"></i>';
    
    toast.innerHTML = `${icon}<span>${message}</span>`;
    
    container.appendChild(toast);

    // Remove after 3 seconds
    setTimeout(() => {
        toast.style.animation = 'fadeOut 0.3s ease forwards';
        toast.addEventListener('animationend', () => {
            toast.remove();
        });
    }, 3000);
}

// --- FETCH URL MODAL LOGIC ---
function initFetchModal() {
    const modal = document.getElementById('fetch-modal');
    const input = document.getElementById('url-input');
    const openBtn = document.getElementById('fetch-modal-btn');
    const cancelBtn = document.getElementById('cancel-fetch');
    const fetchBtn = document.getElementById('do-fetch');

    function openModal() {
        modal.classList.add('active');
        input.value = '';
        input.focus();
    }

    function closeModal() {
        modal.classList.remove('active');
    }

    openBtn.addEventListener('click', openModal);
    cancelBtn.addEventListener('click', closeModal);

    // Close on outside click
    modal.addEventListener('click', (e) => {
        if (e.target === modal) closeModal();
    });

    // Handle Fetch
    fetchBtn.addEventListener('click', async () => {
        const url = input.value.trim();
        
        if (!url) {
            showToast('Please enter a valid URL', 'error');
            return;
        }

        if (!url.startsWith('http://') && !url.startsWith('https://')) {
            showToast('URL must start with http:// or https://', 'error');
            return;
        }

        // Loading state
        fetchBtn.disabled = true;
        fetchBtn.textContent = 'Fetching...';
        input.disabled = true;

        try {
            // Use Puter.js to fetch
            if (typeof puter === 'undefined') {
                throw new Error('Puter.js library not loaded. Check your internet connection.');
            }

            showToast('Fetching code...', 'success');
            
            const request = await puter.net.fetch(url);
            
            if (!request.ok) {
                throw new Error(`Server responded with ${request.status}`);
            }

            const body = await request.text();

            // Update Editor
            if (editor) {
                editor.setValue(body);
                updatePreview();
                showToast(`Successfully loaded code from ${new URL(url).hostname}`, 'success');
            }
            
            closeModal();

        } catch (err) {
            console.error(err);
            showToast(`Failed to fetch: ${err.message}`, 'error');
        } finally {
            // Reset state
            fetchBtn.disabled = false;
            fetchBtn.textContent = 'Fetch Code';
            input.disabled = false;
        }
    });

    // Allow "Enter" key to submit
    input.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            fetchBtn.click();
        }
    });
}

// --- THEME HANDLING ---
function toggleTheme() {
    const isLight = document.body.classList.toggle('light');
    const icon = document.querySelector('#theme-btn i');
    const mobileIcon = document.querySelector('#mobile-theme-btn i');
    
    localStorage.setItem('theme', isLight ? 'light' : 'dark');

    if (editor) {
        monaco.editor.setTheme(isLight ? 'vs' : 'vs-dark');
    }

    if(icon) icon.className = isLight ? 'ph ph-sun' : 'ph ph-moon';
    if(mobileIcon) mobileIcon.className = isLight ? 'ph ph-sun' : 'ph ph-moon';
}

// --- VIEW MODES ---
function initViewModes() {
    const wrapper = document.getElementById('preview-wrapper');
    const iframe = document.getElementById('preview');
    const desktopBtn = document.getElementById('desktop-btn');
    const mobileBtn = document.getElementById('mobile-btn');
    const deviceSelect = document.getElementById('device-select');

    function setDesktop() {
        wrapper.classList.remove('mobile-mode');
        iframe.style.width = '100%';
        iframe.style.height = '100%';
        desktopBtn.classList.add('active');
        mobileBtn.classList.remove('active');
        deviceSelect.classList.remove('visible');
    }

    function setMobile() {
        wrapper.classList.add('mobile-mode');
        applyDimensions();
        mobileBtn.classList.add('active');
        desktopBtn.classList.remove('active');
        deviceSelect.classList.add('visible');
    }

    function applyDimensions() {
        const [w, h] = deviceSelect.value.split('x');
        iframe.style.width = w + 'px';
        iframe.style.height = h + 'px';
    }

    desktopBtn.addEventListener('click', setDesktop);
    mobileBtn.addEventListener('click', setMobile);
    deviceSelect.addEventListener('change', applyDimensions);
}

// --- RESIZER LOGIC ---
function initResizer() {
    const resizer = document.getElementById('resizer');
    const leftPane = document.getElementById('editor-pane');
    let isResizing = false;
    let startX, startWidth;

    resizer.addEventListener('mousedown', (e) => {
        isResizing = true;
        startX = e.clientX;
        startWidth = leftPane.offsetWidth;
        document.body.classList.add('resizing');
    });

    document.addEventListener('mousemove', (e) => {
        if (!isResizing) return;
        const delta = e.clientX - startX;
        const newWidth = Math.max(200, Math.min(startWidth + delta, window.innerWidth - 200));
        
        leftPane.style.flex = `0 0 ${newWidth}px`;
    });

    document.addEventListener('mouseup', () => {
        isResizing = false;
        document.body.classList.remove('resizing');
    });
}

// --- MOBILE TABS ---
function initMobileTabs() {
    const tabs = document.querySelectorAll('.mobile-tab');
    const editorPane = document.getElementById('editor-pane');
    const previewPane = document.getElementById('preview-pane');

    tabs.forEach(tab => {
        tab.addEventListener('click', () => {
            if(tab.id === 'mobile-theme-btn' || tab.id === 'mobile-clear-btn') { return; }
            
            tabs.forEach(t => { 
                if(t.id !== 'mobile-theme-btn' && t.id !== 'mobile-clear-btn') t.classList.remove('active'); 
            });
            tab.classList.add('active');

            const target = tab.dataset.tab;
            if (target === 'editor') {
                editorPane.classList.add('active'); 
                previewPane.classList.remove('active'); 
                setTimeout(() => { if (editor) editor.layout(); }, 10);
            } else if (target === 'preview') {
                previewPane.classList.add('active'); 
                editorPane.classList.remove('active');
            }
        });
    });
}

// --- MAIN INIT ---
document.addEventListener('DOMContentLoaded', () => {
    initResizer();
    initMobileTabs();
    initViewModes();
    initFetchModal(); // Initialize Fetch Feature

    // Initial Theme Check
    if (localStorage.getItem('theme') === 'light') toggleTheme();

    // Button Bindings
    document.getElementById('format-btn').addEventListener('click', formatCode);
    
    document.getElementById('sample-btn').addEventListener('click', () => {
        if(editor) editor.setValue(SAMPLE_HTML, -1);
    });

    document.getElementById('clear-btn').addEventListener('click', () => {
        if(editor) editor.setValue('', -1);
    });

    document.getElementById('theme-btn').addEventListener('click', toggleTheme);

    document.getElementById('mobile-clear-btn').addEventListener('click', () => {
        if(confirm('Are you sure you want to clear all code?')) {
            if(editor) editor.setValue('', -1);
        }
    });

    document.getElementById('mobile-theme-btn').addEventListener('click', toggleTheme);

    document.getElementById('copy-btn').addEventListener('click', () => {
        if(editor) navigator.clipboard.writeText(editor.getValue());
    });

    document.getElementById('find-btn').addEventListener('click', () => {
        if(editor) {
            editor.focus();
            editor.trigger('keyboard', 'actions.find', {});
        }
    });

    document.getElementById('import-btn').addEventListener('click', () => document.getElementById('file-input').click());

    document.getElementById('file-input').addEventListener('change', (e) => {
        const f = e.target.files[0];
        if(f) { 
            const r = new FileReader(); 
            r.onload = (evt) => { 
                if(editor) editor.setValue(evt.target.result, -1); 
            }; 
            r.readAsText(f); 
        }
        e.target.value = '';
    });

    document.getElementById('export-btn').addEventListener('click', () => {
        if(!editor) return;
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([editor.getValue()], {type:'text/html'}));
        a.download = 'index.html'; 
        a.click();
    });

    document.getElementById('newtab-btn').addEventListener('click', () => {
        if(!editor) return;
        const code = editor.getValue();
        const blob = new Blob([code], { type: 'text/html' });
        const url = URL.createObjectURL(blob);
        window.open(url, '_blank');
    });
});
