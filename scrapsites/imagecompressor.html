<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Compressor // Swiss</title>
<meta name="description" content="Swiss Minimalist Image Compressor. Private, Fast, Client-side.">

<!-- Fonts & Icons -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<!-- JSZip for Batch Download -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<style>
/* 
    SWISS MINIMALISM THEME
    Strict Grid | Monochrome + Orange | Inter Tight 
*/
:root {
    --bg-color: #ffffff;
    --text-color: #000000;
    --border-color: #000000;
    --accent-color: #ff3300; /* International Orange */
    --grid-line: 2px solid var(--border-color);
    --thin-line: 1px solid var(--border-color);
    --font-main: 'Inter Tight', sans-serif;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

body {
    margin: 0;
    font-family: var(--font-main);
    background: var(--bg-color);
    color: var(--text-color);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
}

/* --- HEADER --- */
header {
    border-bottom: var(--grid-line);
    padding: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky; top: 0; z-index: 50; background: var(--bg-color);
}
.brand {
    font-weight: 800; text-transform: uppercase; letter-spacing: -0.02em; font-size: 18px;
    display: flex; align-items: center; gap: 8px;
}
.accent-dot { width: 12px; height: 12px; background: var(--accent-color); display: inline-block; }

/* --- LAYOUT --- */
main {
    display: grid;
    grid-template-columns: 320px 1fr;
    flex: 1;
    height: calc(100vh - 70px); /* Adjust based on header */
}

/* --- SIDEBAR (Controls) --- */
.controls-panel {
    border-right: var(--grid-line);
    padding: 0;
    overflow-y: auto;
    background: #f8f8f8;
    display: flex; flex-direction: column;
}

.control-group {
    padding: 24px;
    border-bottom: var(--thin-line);
}

h2 {
    font-size: 11px; font-weight: 800; text-transform: uppercase; color: var(--text-color);
    margin: 0 0 12px 0; letter-spacing: 0.05em; display: flex; align-items: center; gap: 6px;
}

label {
    display: block; font-size: 11px; font-weight: 600; text-transform: uppercase;
    margin-bottom: 6px; color: #666;
}

/* Inputs */
input[type="number"], select {
    width: 100%;
    border: 1px solid #000;
    background: white;
    color: black;
    padding: 10px;
    font-family: var(--font-main);
    font-size: 14px;
    border-radius: 0;
    appearance: none;
    font-weight: 600;
}
input[type="number"]:focus, select:focus {
    outline: 2px solid var(--accent-color); border-color: transparent;
}

/* Range Slider */
.range-wrapper {
    display: flex; align-items: center; gap: 10px;
}
input[type="range"] {
    flex: 1; -webkit-appearance: none; height: 2px; background: #000; outline: none;
}
input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 16px; height: 16px; background: var(--accent-color);
    border: 2px solid #000; cursor: pointer; border-radius: 0;
}

/* Drop Zone */
.drop-zone {
    border: 2px dashed #ccc;
    background: white;
    padding: 30px 20px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
}
.drop-zone:hover, .drop-zone.dragover {
    border-color: var(--accent-color); background: #fff0eb; color: var(--accent-color);
}
.drop-zone p { margin: 10px 0 0; font-weight: 600; font-size: 13px; }

/* Buttons */
.btn {
    width: 100%;
    padding: 16px;
    border: none;
    border-bottom: var(--thin-line);
    background: white;
    color: black;
    font-family: var(--font-main);
    font-weight: 800;
    text-transform: uppercase;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex; justify-content: center; align-items: center; gap: 8px;
}
.btn:hover { background: black; color: white; }
.btn-primary {
    background: var(--accent-color); color: white; border: none; border-top: var(--grid-line);
    font-size: 14px; height: 60px;
}
.btn-primary:hover { background: black; color: white; }
.btn-secondary { background: white; border: 1px solid black; margin-top: 10px; padding: 12px; }

/* --- RESULTS AREA --- */
.results-panel {
    background: white;
    display: flex; flex-direction: column;
    overflow: hidden;
}

.stats-bar {
    padding: 16px 24px;
    border-bottom: var(--grid-line);
    display: flex; gap: 20px;
    font-size: 12px; font-weight: 600; font-family: monospace;
    background: #fff;
}
.stat-pill {
    padding: 4px 8px; background: #f0f0f0; border: 1px solid #ddd;
}
.stat-pill.highlight { background: var(--accent-color); color: white; border-color: var(--accent-color); }

.grid-list {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 20px;
    align-content: start;
}

/* Card */
.card {
    border: 1px solid black;
    background: white;
    display: flex; flex-direction: column;
    transition: transform 0.2s;
}
.card:hover { transform: translateY(-4px); box-shadow: 4px 4px 0 rgba(0,0,0,1); }

.card-img {
    height: 180px;
    background: #f0f0f0;
    border-bottom: 1px solid black;
    display: flex; justify-content: center; align-items: center;
    overflow: hidden;
    position: relative;
    background-image:
        linear-gradient(45deg, #e5e5e5 25%, transparent 25%), 
        linear-gradient(-45deg, #e5e5e5 25%, transparent 25%), 
        linear-gradient(45deg, transparent 75%, #e5e5e5 75%), 
        linear-gradient(-45deg, transparent 75%, #e5e5e5 75%);
    background-size: 10px 10px;
    background-position: 0 0, 0 5px, 5px -5px, -5px 0px;
}
.card-img canvas { max-width: 100%; max-height: 100%; display: block; }
.card-img .badge {
    position: absolute; top: 8px; right: 8px; background: black; color: white;
    font-size: 9px; font-weight: 800; padding: 2px 6px; text-transform: uppercase;
}

.card-meta {
    padding: 12px;
    font-size: 11px;
}
.filename { font-weight: 700; truncate: true; margin-bottom: 4px; display: block; }
.filesize { font-family: monospace; color: #666; display: flex; justify-content: space-between; }
.savings { color: var(--accent-color); font-weight: 800; }

.card-actions {
    display: flex; border-top: 1px solid black;
}
.card-btn {
    flex: 1; border: none; background: white; padding: 10px; cursor: pointer;
    font-size: 10px; font-weight: 800; text-transform: uppercase;
    transition: background 0.2s;
}
.card-btn:hover { background: black; color: white; }
.card-btn:first-child { border-right: 1px solid black; }

/* Empty State */
.empty-state {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 100%; color: #ccc;
}

/* Mobile */
@media (max-width: 900px) {
    main { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    .controls-panel { height: auto; max-height: 40vh; border-right: none; border-bottom: var(--grid-line); }
    .btn-primary { position: sticky; bottom: 0; }
}
</style>
</head>
<body>

<header>
    <div class="brand">
        <span class="accent-dot"></span>
        IMG // COMPRESSOR
    </div>
    <div style="font-size:11px; font-weight:600;"> v2.0</div>
</header>

<main>
    <!-- CONTROLS SIDEBAR -->
    <aside class="controls-panel">
        
        <div class="control-group">
            <div id="drop" class="drop-zone" role="button" tabindex="0">
                <i data-lucide="upload-cloud" style="width:24px; height:24px; margin:0 auto; display:block;"></i>
                <p>DROP IMAGES</p>
                <input id="file" type="file" accept="image/*" multiple hidden />
            </div>
            <button id="clearBtn" class="btn-secondary" style="width:100%; font-size:10px;">RESET QUEUE</button>
        </div>

        <div class="control-group">
            <h2><i data-lucide="settings-2" width="14"></i> OUTPUT SETTINGS</h2>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
                <div>
                    <label>Format</label>
                    <select id="fmt">
                        <option value="image/webp">WEBP</option>
                        <option value="image/jpeg">JPEG</option>
                        <option value="image/png">PNG</option>
                    </select>
                </div>
                <div>
                    <label>Quality: <span id="qLabel" style="color:var(--accent-color)">0.85</span></label>
                    <div class="range-wrapper">
                        <input id="quality" type="range" min="0.1" max="1" step="0.05" value="0.85" />
                    </div>
                </div>
            </div>
        </div>

        <div class="control-group">
            <h2><i data-lucide="maximize" width="14"></i> RESIZE (OPTIONAL)</h2>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
                <div>
                    <label>Max W</label>
                    <input id="mw" type="number" placeholder="Original">
                </div>
                <div>
                    <label>Max H</label>
                    <input id="mh" type="number" placeholder="Original">
                </div>
            </div>
        </div>

        <div style="margin-top:auto;">
            <button id="compressAll" class="btn btn-primary">
                <i data-lucide="zap" width="16"></i> COMPRESS BATCH
            </button>
        </div>
    </aside>

    <!-- RESULTS AREA -->
    <section class="results-panel">
        <div class="stats-bar">
            <span id="countPill" class="stat-pill">0 FILES</span>
            <span id="savedPill" class="stat-pill">0 KB SAVED</span>
            <button id="downloadZip" class="stat-pill highlight" style="display:none; cursor:pointer; border:none; margin-left:auto;">
                DOWNLOAD ZIP
            </button>
        </div>
        
        <div id="out" class="grid-list">
            <div class="empty-state">
                <i data-lucide="image" width="48" style="opacity:0.2;"></i>
                <p style="margin-top:10px; font-weight:600; font-size:12px;">NO IMAGES LOADED</p>
            </div>
        </div>
    </section>
</main>

<script>
// --- UTILS ---
const $ = (s) => document.querySelector(s);
const human = (n) => { if(n<1024) return n+' B'; if(n<1024*1024) return (n/1024).toFixed(1)+' KB'; return (n/1024/1024).toFixed(2)+' MB'; };
lucide.createIcons();

// --- STATE ---
let files = [];
let processedFiles = []; // Store blobs for ZIP

// --- ELEMENTS ---
const els = {
    drop: $('#drop'), file: $('#file'),
    fmt: $('#fmt'), q: $('#quality'), qLabel: $('#qLabel'),
    mw: $('#mw'), mh: $('#mh'),
    compressAll: $('#compressAll'), clear: $('#clearBtn'),
    out: $('#out'),
    countPill: $('#countPill'), savedPill: $('#savedPill'), zipBtn: $('#downloadZip')
};

// --- EVENTS ---
els.drop.onclick = () => els.file.click();
els.drop.ondragover = (e) => { e.preventDefault(); els.drop.classList.add('dragover'); };
els.drop.ondragleave = () => els.drop.classList.remove('dragover');
els.drop.ondrop = (e) => { e.preventDefault(); els.drop.classList.remove('dragover'); handleFiles(e.dataTransfer.files); };
els.file.onchange = (e) => handleFiles(e.target.files);
els.q.oninput = () => els.qLabel.innerText = els.q.value;
els.clear.onclick = reset;
els.zipBtn.onclick = downloadAllZip;

// --- CORE LOGIC ---
function handleFiles(fileList) {
    for (const f of fileList) {
        if (f.type.startsWith('image/')) files.push(f);
    }
    updateUI();
    renderQueue();
}

function reset() {
    files = [];
    processedFiles = [];
    els.out.innerHTML = `
        <div class="empty-state">
            <i data-lucide="image" width="48" style="opacity:0.2;"></i>
            <p style="margin-top:10px; font-weight:600; font-size:12px;">NO IMAGES LOADED</p>
        </div>
    `;
    updateUI();
    lucide.createIcons();
    els.file.value = '';
}

function updateUI() {
    els.countPill.innerText = `${files.length} FILES`;
    els.savedPill.innerText = `0 KB SAVED`;
    els.zipBtn.style.display = 'none';
}

function renderQueue() {
    els.out.innerHTML = '';
    files.forEach((f, i) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
            <div class="card-img" id="preview-${i}">
                <span class="badge">QUEUED</span>
            </div>
            <div class="card-meta">
                <span class="filename" title="${f.name}">${f.name}</span>
                <div class="filesize">
                    <span>${human(f.size)}</span>
                    <span>...</span>
                </div>
            </div>
        `;
        els.out.appendChild(card);
        
        // Quick thumbnail
        const reader = new FileReader();
        reader.onload = (e) => {
            const img = new Image();
            img.src = e.target.result;
            img.style.height = "100%";
            img.style.objectFit = "contain";
            document.getElementById(`preview-${i}`).appendChild(img);
        };
        reader.readAsDataURL(f);
    });
}

// --- COMPRESSION ENGINE ---
els.compressAll.onclick = async () => {
    if (!files.length) return alert("Please select images first.");
    
    const settings = {
        mime: els.fmt.value,
        quality: parseFloat(els.q.value),
        maxWidth: parseInt(els.mw.value) || 0,
        maxHeight: parseInt(els.mh.value) || 0
    };

    els.compressAll.innerText = "PROCESSING...";
    els.compressAll.disabled = true;
    processedFiles = []; // Reset zip queue
    
    let totalSaved = 0;
    els.out.innerHTML = ''; // Clear queue view for results

    // Process sequentially to allow UI updates
    for (let i = 0; i < files.length; i++) {
        const file = files[i];
        try {
            const result = await processImage(file, settings);
            const saved = Math.max(0, file.size - result.blob.size);
            totalSaved += saved;
            processedFiles.push(result);
            renderResultCard(result, file.size, saved);
        } catch (err) {
            console.error(err);
        }
        // Small delay to let UI breathe
        await new Promise(r => setTimeout(r, 10));
    }

    els.savedPill.innerText = `${human(totalSaved)} SAVED`;
    els.zipBtn.style.display = 'block';
    els.compressAll.innerHTML = '<i data-lucide="zap" width="16"></i> COMPRESS BATCH';
    els.compressAll.disabled = false;
    lucide.createIcons();
};

async function processImage(file, s) {
    const bitmap = await createImageBitmap(file);
    
    // Calc dimensions
    let { width, height } = bitmap;
    const ratio = width / height;
    if (s.maxWidth && width > s.maxWidth) { width = s.maxWidth; height = width / ratio; }
    if (s.maxHeight && height > s.maxHeight) { height = s.maxHeight; width = height * ratio; }

    const canvas = document.createElement('canvas');
    canvas.width = width;
    canvas.height = height;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(bitmap, 0, 0, width, height);
    
    const blob = await new Promise(r => canvas.toBlob(r, s.mime, s.quality));
    
    // Rename
    const ext = s.mime === 'image/jpeg' ? 'jpg' : s.mime === 'image/png' ? 'png' : 'webp';
    const newName = file.name.replace(/\.[^/.]+$/, "") + `_min.${ext}`;
    
    return { blob, name: newName, canvas };
}

function renderResultCard(res, originalSize, savedBytes) {
    const card = document.createElement('div');
    card.className = 'card';
    const url = URL.createObjectURL(res.blob);
    
    card.innerHTML = `
        <div class="card-img">
            <span class="badge" style="background:var(--accent-color)">DONE</span>
        </div>
        <div class="card-meta">
            <span class="filename" title="${res.name}">${res.name}</span>
            <div class="filesize">
                <span style="text-decoration:line-through; opacity:0.5">${human(originalSize)}</span>
                <span>${human(res.blob.size)}</span>
            </div>
            <div class="savings">-${human(savedBytes)}</div>
        </div>
        <div class="card-actions">
            <button class="card-btn" onclick="previewImage('${url}')">VIEW</button>
            <a href="${url}" download="${res.name}" class="card-btn" style="text-align:center; text-decoration:none; color:black;">DOWNLOAD</a>
        </div>
    `;
    
    // Insert thumb
    const thumb = document.createElement('canvas');
    const scale = Math.min(1, 300 / res.canvas.width);
    thumb.width = res.canvas.width * scale;
    thumb.height = res.canvas.height * scale;
    thumb.getContext('2d').drawImage(res.canvas, 0, 0, thumb.width, thumb.height);
    card.querySelector('.card-img').appendChild(thumb);
    
    els.out.appendChild(card);
}

// --- FEATURES ---
window.previewImage = (url) => {
    const w = window.open("");
    w.document.write(`<img src="${url}" style="max-width:100%">`);
};

async function downloadAllZip() {
    if(!processedFiles.length) return;
    const zip = new JSZip();
    processedFiles.forEach(f => zip.file(f.name, f.blob));
    
    els.zipBtn.innerText = "ZIPPING...";
    const content = await zip.generateAsync({type:"blob"});
    const link = document.createElement('a');
    link.href = URL.createObjectURL(content);
    link.download = "compressed_images_swiss.zip";
    link.click();
    els.zipBtn.innerText = "DOWNLOAD ZIP";
}
</script>
</body>
</html>
