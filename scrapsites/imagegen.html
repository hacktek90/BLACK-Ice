<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nebula AI | Modern Image Generator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%);
            --glass-bg: rgba(15, 23, 42, 0.6);
            --glass-border: rgba(255, 255, 255, 0.1);
            --glass-highlight: rgba(255, 255, 255, 0.05);
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --radius-lg: 24px;
            --radius-md: 16px;
            --warning-gold: #fbbf24;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: #000;
            min-height: 100vh;
            color: var(--text-main);
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            padding: 2rem;
        }

        /* Animated Background */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 15% 50%, rgba(76, 29, 149, 0.4), transparent 25%),
                        radial-gradient(circle at 85% 30%, rgba(236, 72, 153, 0.25), transparent 25%);
            z-index: -1;
            pointer-events: none;
        }

        .app-container {
            width: 100%;
            max-width: 1000px;
            display: flex;
            flex-direction: column;
            gap: 2rem;
            animation: fadeIn 0.8s ease-out;
        }

        header {
            text-align: center;
            margin-bottom: 0.5rem;
        }

        h1 {
            font-size: 3rem;
            font-weight: 700;
            letter-spacing: -1px;
            margin-bottom: 0.5rem;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 20px rgba(168, 85, 247, 0.3));
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
            font-weight: 300;
        }

        /* Credit Note Box */
        .credit-note {
            background: rgba(251, 191, 36, 0.05);
            border: 1px solid rgba(251, 191, 36, 0.2);
            border-radius: var(--radius-md);
            padding: 1rem 1.25rem;
            display: flex;
            gap: 1rem;
            align-items: flex-start;
            color: #e2e8f0;
            font-size: 0.95rem;
            line-height: 1.5;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .note-icon {
            color: var(--warning-gold);
            flex-shrink: 0;
            margin-top: 2px;
        }

        .note-content strong {
            color: var(--warning-gold);
            font-weight: 600;
        }

        /* Input Section */
        .input-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            padding: 2rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .input-wrapper { position: relative; }

        textarea {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-md);
            padding: 1.25rem;
            color: white;
            font-family: inherit;
            font-size: 1.1rem;
            resize: none;
            height: 120px;
            transition: all 0.3s ease;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
        }

        textarea:focus {
            outline: none;
            border-color: #a855f7;
            box-shadow: 0 0 0 4px rgba(168, 85, 247, 0.15);
            background: rgba(0, 0, 0, 0.5);
        }

        /* Controls & Timer */
        .controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .btn-generate {
            background: var(--primary-gradient);
            border: none;
            color: white;
            padding: 1rem 2.5rem;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            box-shadow: 0 4px 15px rgba(168, 85, 247, 0.4);
        }

        .btn-generate:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(168, 85, 247, 0.5);
        }

        .btn-generate:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            filter: grayscale(0.8);
        }

        .timer-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            min-width: 200px;
        }

        .timer-text {
            font-size: 0.85rem;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
        }

        .progress-track {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: var(--primary-gradient);
            border-radius: 10px;
            transition: width 1s linear;
        }

        /* Gallery Grid */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 2rem;
            padding-bottom: 2rem;
        }

        /* Image Card */
        .image-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-md);
            overflow: hidden;
            position: relative;
            aspect-ratio: 1 / 1;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            cursor: zoom-in;
        }

        .image-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.4);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .image-container {
            width: 100%;
            height: 100%;
            position: relative;
            background: #0f172a;
        }

        .image-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            opacity: 0;
            transition: opacity 0.8s ease;
            pointer-events: none;
        }

        .image-card.loaded img {
            opacity: 1;
        }

        /* Skeleton Loader */
        .image-card.loading .image-container::after {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(110deg, #1e293b 8%, #334155 18%, #1e293b 33%);
            background-size: 200% 100%;
            animation: shimmer 1.5s linear infinite;
        }

        .loading-text {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2;
            color: var(--text-muted);
            font-size: 0.9rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-weight: 600;
            display: none;
        }

        .image-card.loading .loading-text { display: block; }

        /* Card Overlay */
        .card-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 1.5rem;
            background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
            opacity: 0;
            transition: opacity 0.3s ease;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            pointer-events: none;
        }

        .image-card:hover .card-overlay {
            opacity: 1;
            pointer-events: auto;
        }

        .prompt-overlay {
            color: white;
            font-size: 0.9rem;
            max-width: 70%;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        .download-btn {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            z-index: 10;
        }

        .download-btn:hover {
            background: white;
            color: #000;
            transform: scale(1.1);
        }

        @keyframes shimmer { to { background-position-x: -200%; } }

        /* --- MODAL / LIGHTBOX STYLES --- */
        .modal {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        #modalImage {
            max-width: 90vw;
            max-height: 90vh;
            object-fit: contain;
            transition: transform 0.2s ease-out;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
            transform-origin: center center;
            cursor: grab;
        }
        
        #modalImage:active {
            cursor: grabbing;
        }

        .modal-close {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            font-size: 24px;
            cursor: pointer;
            z-index: 1010;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .modal-close:hover {
            background: rgba(255,255,255,0.3);
            transform: rotate(90deg);
        }

        .zoom-controls {
            position: absolute;
            bottom: 30px;
            right: 30px;
            display: flex;
            gap: 10px;
            z-index: 1010;
        }

        .zoom-btn {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            width: 44px;
            height: 44px;
            border-radius: 12px;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
            backdrop-filter: blur(4px);
        }

        .zoom-btn:hover {
            background: rgba(255,255,255,0.25);
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid var(--glass-border);
            color: white;
            padding: 0.8rem 1.5rem;
            border-radius: 50px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            opacity: 0;
            pointer-events: none;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 2000;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 500;
        }

        .toast.visible { opacity: 1; transform: translateX(-50%) translateY(0); }
        .toast.error { border-color: #ef4444; color: #fca5a5; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        @media (max-width: 600px) {
            h1 { font-size: 2rem; }
            .controls { flex-direction: column; align-items: stretch; }
            .btn-generate { width: 100%; justify-content: center; }
            .zoom-controls { bottom: 20px; right: 20px; }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <header>
            <h1>Nebula AI</h1>
            <p class="subtitle">Transform text into visual masterpieces</p>
        </header>

        <main>
            <!-- Credit Note Box -->
            <div class="credit-note">
                <div class="note-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 18h6"/>
                        <path d="M10 22h4"/>
                        <path d="M12 2v1"/>
                        <path d="M12 7a5 5 0 0 1 5 5c0 1.46-.6 2.77-1.56 3.78a5 5 0 0 0-1.44 3.22V17H9v-3c0-1.18-.5-2.26-1.44-3.22A5 5 0 0 1 7 12a5 5 0 0 1 5-5z"/>
                    </svg>
                </div>
                <div class="note-content">
                    <strong>Tip:</strong> To keep this site free for everyone, we operate on limited daily credits. Please craft your prompt carefully on the <strong>first try</strong> to get the best result and save credits!
                </div>
            </div>

            <div class="input-panel">
                <div class="input-wrapper">
                    <textarea id="promptInput" placeholder="A cyberpunk city with neon lights in the rain, cinematic lighting, 8k..."></textarea>
                </div>
                
                <div class="controls">
                    <div class="timer-container">
                        <div class="timer-text">
                            <span id="timerLabel">Ready</span>
                            <span id="timerValue">0s</span>
                        </div>
                        <div class="progress-track">
                            <div id="progressBar" class="progress-fill"></div>
                        </div>
                    </div>

                    <button id="generateBtn" class="btn-generate">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
                        </svg>
                        Generate
                    </button>
                </div>
            </div>

            <div id="gallery" class="gallery">
                <!-- Images appear here -->
            </div>
        </main>
    </div>

    <!-- Lightbox Modal -->
    <div id="imageModal" class="modal">
        <div class="modal-content-wrapper">
            <button class="modal-close" id="closeModal">&times;</button>
            <img id="modalImage" src="" alt="Full view">
            <div class="zoom-controls">
                <button class="zoom-btn" id="zoomOut" title="Zoom Out">-</button>
                <button class="zoom-btn" id="zoomIn" title="Zoom In">+</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast">
        <span id="toastIcon">✨</span>
        <span id="toastMessage">Ready</span>
    </div>

    <script src="https://js.puter.com/v2/"></script>
    <script>
        const state = {
            isGenerating: false,
            cooldownTotal: 45,
            timerInterval: null,
            zoomLevel: 1,
            zoomMin: 0.5,
            zoomMax: 4
        };

        const el = {
            prompt: document.getElementById('promptInput'),
            btn: document.getElementById('generateBtn'),
            gallery: document.getElementById('gallery'),
            timerLabel: document.getElementById('timerLabel'),
            timerValue: document.getElementById('timerValue'),
            progressBar: document.getElementById('progressBar'),
            toast: document.getElementById('toast'),
            toastMsg: document.getElementById('toastMessage'),
            toastIcon: document.getElementById('toastIcon'),
            modal: document.getElementById('imageModal'),
            modalImg: document.getElementById('modalImage'),
            closeModal: document.getElementById('closeModal'),
            zoomIn: document.getElementById('zoomIn'),
            zoomOut: document.getElementById('zoomOut')
        };

        // --- Toast System ---
        function showToast(msg, type = 'success') {
            el.toastMsg.textContent = msg;
            el.toastIcon.textContent = type === 'error' ? '⚠️' : '✨';
            el.toast.className = `toast visible ${type}`;
            setTimeout(() => el.toast.classList.remove('visible'), 3000);
        }

        // --- Timer System ---
        function updateTimerUI(seconds, total) {
            if (seconds <= 0) {
                el.timerLabel.textContent = "System Ready";
                el.timerValue.textContent = "";
                el.progressBar.style.width = "0%";
                el.progressBar.style.opacity = "0";
                el.btn.disabled = false;
                el.btn.innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg> Generate`;
            } else {
                el.timerLabel.textContent = "Cooldown Active";
                el.timerValue.textContent = `${seconds}s`;
                el.progressBar.style.opacity = "1";
                el.progressBar.style.width = `${(seconds / total) * 100}%`;
            }
        }

        function startCooldown() {
            let left = state.cooldownTotal;
            el.btn.disabled = true;
            el.btn.innerHTML = `⏳ Generating...`;
            updateTimerUI(left, state.cooldownTotal);

            state.timerInterval = setInterval(() => {
                left--;
                updateTimerUI(left, state.cooldownTotal);
                if (left <= 0) {
                    clearInterval(state.timerInterval);
                    el.btn.disabled = false;
                    el.btn.innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg> Generate`;
                }
            }, 1000);
        }

        // --- Modal & Zoom System ---
        function openModal(src) {
            el.modalImg.src = src;
            state.zoomLevel = 1;
            applyZoom();
            el.modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            el.modal.classList.remove('active');
            document.body.style.overflow = '';
            setTimeout(() => { el.modalImg.src = ''; }, 300);
        }

        function applyZoom() {
            el.modalImg.style.transform = `scale(${state.zoomLevel})`;
        }

        function changeZoom(delta) {
            state.zoomLevel += delta;
            if (state.zoomLevel < state.zoomMin) state.zoomLevel = state.zoomMin;
            if (state.zoomLevel > state.zoomMax) state.zoomLevel = state.zoomMax;
            applyZoom();
        }

        el.closeModal.addEventListener('click', closeModal);
        el.zoomIn.addEventListener('click', () => changeZoom(0.5));
        el.zoomOut.addEventListener('click', () => changeZoom(-0.5));
        
        el.modal.addEventListener('click', (e) => {
            if (e.target === el.modal || e.target.closest('.modal-content-wrapper') === el.modal.querySelector('.modal-content-wrapper')) {
                if(e.target === el.modal.querySelector('.modal-content-wrapper')) closeModal();
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && el.modal.classList.contains('active')) closeModal();
        });

        el.modalImg.addEventListener('wheel', (e) => {
            e.preventDefault();
            const delta = e.deltaY > 0 ? -0.2 : 0.2;
            changeZoom(delta);
        });

        // --- Gallery & Generation ---
        function createCard(prompt) {
            const card = document.createElement('div');
            card.className = 'image-card loading';
            
            card.innerHTML = `
                <div class="image-container">
                    <div class="loading-text">Dreaming...</div>
                    <img src="" alt="${prompt}" />
                </div>
                <div class="card-overlay">
                    <div class="prompt-overlay">${prompt}</div>
                    <button class="download-btn" title="Download">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="7 10 12 15 17 10"></polyline>
                            <line x1="12" y1="15" x2="12" y2="3"></line>
                        </svg>
                    </button>
                </div>
            `;

            card.addEventListener('click', () => {
                if(card.classList.contains('loaded')) {
                    const img = card.querySelector('img');
                    openModal(img.src);
                }
            });

            el.gallery.prepend(card);
            return card;
        }

        async function handleGenerate() {
            if (state.isGenerating) return;
            
            const prompt = el.prompt.value.trim();
            if (!prompt) {
                showToast("Please describe your image", "error");
                el.prompt.focus();
                return;
            }

            state.isGenerating = true;
            startCooldown();
            showToast("Generation started...");

            const card = createCard(prompt);
            const imgEl = card.querySelector('img');
            const dlBtn = card.querySelector('.download-btn');

            dlBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                const link = document.createElement('a');
                link.href = imgEl.src;
                link.download = `nebula-ai-${Date.now()}.png`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            });

            try {
                const imageEl = await puter.ai.txt2img(prompt);
                let src = "";
                if (typeof imageEl === 'string') src = imageEl;
                else if (imageEl instanceof HTMLImageElement) src = imageEl.src;
                else if (imageEl.url) src = imageEl.url;
                
                if (!src) throw new Error("No image source found");

                imgEl.src = src;
                
                imgEl.onload = () => {
                    card.classList.remove('loading');
                    card.classList.add('loaded');
                };

            } catch (err) {
                console.error(err);
                card.classList.remove('loading');
                card.querySelector('.image-container').innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#ef4444;padding:1rem;text-align:center;">Generation Failed</div>`;
                showToast("Failed to generate image", "error");
                clearInterval(state.timerInterval);
                el.btn.disabled = false;
                el.btn.innerHTML = "Try Again";
                el.timerLabel.textContent = "Error occurred";
            } finally {
                state.isGenerating = false;
            }
        }

        el.btn.addEventListener('click', handleGenerate);
        el.prompt.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) handleGenerate();
        });

    </script>
</body>
</html>
