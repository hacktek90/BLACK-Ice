<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Search with Autocomplete</title>
    <style>
        body {
            font-family: "Inter Tight", system-ui, sans-serif;
            background: #fff;
            color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .box {
            width: 650px;
            max-width: 90%;
        }

        .autocomplete-wrapper {
            position: relative;
            width: 100%;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #ddd;
            font-size: 16px;
            box-sizing: border-box;
        }

        button {
            margin-top: 12px;
            padding: 12px 18px;
            border: none;
            background: #000;
            color: #fff;
            cursor: pointer;
        }

        button:hover {
            background: #333;
        }

        .result {
            margin-top: 25px;
            line-height: 1.6;
        }

        a {
            color: #000;
            text-decoration: underline;
        }

        /* Autocomplete dropdown */
        .autocomplete-items {
            position: absolute;
            border: 1px solid #d4d4d4;
            border-top: none;
            z-index: 99;
            top: 100%;
            left: 0;
            right: 0;
            max-height: 300px;
            overflow-y: auto;
            background-color: #fff;
        }

        .autocomplete-items div {
            padding: 10px;
            cursor: pointer;
            border-bottom: 1px solid #eaeaea;
            font-size: 15px;
        }

        .autocomplete-items div:hover {
            background-color: #f7f7f7;
        }

        .autocomplete-active {
            background-color: #000 !important;
            color: #fff;
        }
    </style>
</head>

<body>
    <div class="box">
        <h2>Instant Search</h2>

        <div class="autocomplete-wrapper">
            <input id="query" placeholder="Search anything..." autocomplete="off" />
            <div id="suggestions" class="autocomplete-items"></div>
        </div>

        <button onclick="search()">Search</button>
        <div id="result" class="result"></div>
    </div>

    <script>
        let currentFocus = -1;
const inputField = document.getElementById("query");
const suggestionsBox = document.getElementById("suggestions");
let debounceTimer;

inputField.addEventListener("input", function(e) {
  clearTimeout(debounceTimer);
  const val = this.value;

  if (!val) {
    closeAllLists();
    return;
  }

  debounceTimer = setTimeout(() => {
    fetchSuggestions(val);
  }, 300);
});

inputField.addEventListener("keydown", function(e) {
  let items = suggestionsBox.getElementsByTagName("div");
  if (e.keyCode === 40) { // DOWN
    currentFocus++;
    addActive(items);
  } else if (e.keyCode === 38) { // UP
    currentFocus--;
    addActive(items);
  } else if (e.keyCode === 13) { // ENTER
    e.preventDefault();
    if (currentFocus > -1 && items[currentFocus]) {
      items[currentFocus].click();
    } else {
      search();
    }
  }
});

// --- WIKIPEDIA SUGGESTIONS (CORS, works from browser) ---
async function fetchSuggestions(query) {
  closeAllLists();
  currentFocus = -1;

  // Wikipedia Opensearch API (CORS enabled)
  const url = `https://en.wikipedia.org/w/api.php?action=opensearch&search=${encodeURIComponent(query)}&limit=8&namespace=0&format=json&origin=*`;

  try {
    const res = await fetch(url);
    const data = await res.json();

    // data = [ query, [titles...], [descriptions...], [urls...] ]
    const titles = data[1] || [];

    titles.forEach(title => {
      const div = document.createElement("div");
      div.textContent = title;
      div.addEventListener("click", function() {
        inputField.value = this.textContent;
        closeAllLists();
        search(); // trigger search when suggestion chosen
      });
      suggestionsBox.appendChild(div);
    });
  } catch (err) {
    console.error("Wikipedia suggest error:", err);
  }
}

function addActive(items) {
  if (!items) return false;
  removeActive(items);
  if (currentFocus >= items.length) currentFocus = 0;
  if (currentFocus < 0) currentFocus = items.length - 1;
  items[currentFocus].classList.add("autocomplete-active");
}

function removeActive(items) {
  for (let item of items) {
    item.classList.remove("autocomplete-active");
  }
}

function closeAllLists() {
  suggestionsBox.innerHTML = "";
}

document.addEventListener("click", function(e) {
  if (e.target !== inputField) {
    closeAllLists();
  }
});

// --- MAIN SEARCH (unchanged, uses DuckDuckGo Instant Answer API) ---
async function search() {
  closeAllLists();
  const q = document.getElementById("query").value.trim();
  if (!q) return;

  const url = `https://api.duckduckgo.com/?q=${encodeURIComponent(q)}&format=json&no_redirect=1&no_html=1`;
  const res = await fetch(url);
  const data = await res.json();

  const resultDiv = document.getElementById("result");

  // Case 1: Instant Answer
  if (data.AbstractText) {
    resultDiv.innerHTML = `
      <h3>${data.Heading}</h3>
      <p>${data.AbstractText}</p>
      <a href="${data.AbstractURL}" target="_blank">Read more</a>
    `;
    return;
  }

  // Case 2: Related Topics
  if (data.RelatedTopics && data.RelatedTopics.length > 0) {
    let topics = data.RelatedTopics
      .filter(t => t.Text)
      .slice(0, 5)
      .map(t => `<li><a href="${t.FirstURL}" target="_blank">${t.Text}</a></li>`)
      .join("");

    resultDiv.innerHTML = `
      <h3>Related Topics</h3>
      <ul>${topics}</ul>
    `;
    return;
  }

  // Case 3: Fallback link
  resultDiv.innerHTML = `
    <p>No instant answer. Try full search:</p>
    <a target="_blank" href="https://duckduckgo.com/?q=${encodeURIComponent(q)}">
      Search "${q}" on DuckDuckGo
    </a>
  `;
}
    </script>
</body>

</html>
