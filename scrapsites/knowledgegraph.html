<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Knowledge Graph 2025</title>
    
    <!-- UIKIT CSS & JS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/uikit@3.18.0/dist/css/uikit.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/uikit@3.18.0/dist/js/uikit.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/uikit@3.18.0/dist/js/uikit-icons.min.js"></script>
    
    <!-- FONTS: Inter Tight -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,400;0,600;0,900;1,400&display=swap" rel="stylesheet">

    <style>
        :root {
            --color-black: #111111;
            --color-accent: #FF4F00;
            --color-white: #FFFFFF;
            --color-grid: #E5E5E5;
            --color-muted: #999999;
        }

        * {
            font-family: 'Inter Tight', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        html, body {
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: var(--color-white);
            color: var(--color-black);
        }

        /* SWISS SCROLLBAR */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: white; border-left: 2px solid var(--color-black); }
        ::-webkit-scrollbar-thumb { background: var(--color-black); border-radius: 0; }
        ::-webkit-scrollbar-thumb:hover { background: var(--color-accent); }

        /* TEXT SELECTION */
        ::selection {
            background: var(--color-accent);
            color: var(--color-white);
        }

        /* FOCUS STATES */
        *:focus { outline: none; }
        [contenteditable="true"]:focus, input:focus, select:focus, textarea:focus {
            background-color: #FFF0EB !important;
            color: var(--color-black);
        }

        /* LAYOUT */
        .app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        @media (min-width: 1024px) {
            .app-container {
                display: grid;
                grid-template-columns: repeat(12, 1fr);
                grid-template-rows: auto 1fr;
            }
        }

        /* HEADER */
        .app-header {
            grid-column: span 12;
            height: 64px;
            border-bottom: 2px solid var(--color-black);
            display: flex;
            align-items: stretch;
            justify-content: space-between;
            background: var(--color-white);
            z-index: 20;
        }

        @media (min-width: 1024px) {
            .app-header { height: 96px; }
        }

        .brand {
            padding: 0 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
        }

        @media (min-width: 1024px) {
            .brand {
                width: auto;
                padding: 0 2rem;
                border-right: 2px solid var(--color-black);
                justify-content: flex-start;
            }
        }

        .brand h1 {
            font-weight: 900;
            font-size: 1.5rem;
            letter-spacing: -0.05em;
            text-transform: uppercase;
            line-height: 1;
            margin: 0;
        }

        @media (min-width: 1024px) {
            .brand h1 { font-size: 2.25rem; }
        }

        .brand h1 span { color: var(--color-accent); }

        .search-container {
            flex-grow: 1;
            display: none;
            align-items: center;
            padding: 0 2rem;
        }

        @media (min-width: 1024px) {
            .search-container { display: flex; }
        }

        .search-container input {
            width: 100%;
            font-size: 2.25rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -0.025em;
            border: none;
            background: transparent;
            color: var(--color-black);
        }

        .search-container input::placeholder {
            color: #DDD;
        }

        .header-actions {
            display: none;
            align-items: stretch;
            border-left: 2px solid var(--color-black);
        }

        @media (min-width: 1024px) {
            .header-actions { display: flex; }
        }

        .btn-create {
            padding: 0 2.5rem;
            background: var(--color-accent);
            color: var(--color-white);
            font-weight: 900;
            font-size: 1.125rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: background 0.2s;
        }

        .btn-create:hover {
            background: var(--color-black);
            color: var(--color-white);
        }

        .mobile-menu-btn {
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--color-black);
            background: transparent;
            cursor: pointer;
        }

        @media (min-width: 1024px) {
            .mobile-menu-btn { display: none; }
        }

        /* LEFT SIDEBAR */
        .sidebar-left {
            display: none;
            grid-column: span 3;
            border-right: 2px solid var(--color-black);
            flex-direction: column;
            height: 100%;
            overflow: hidden;
            background: var(--color-white);
        }

        @media (min-width: 1024px) {
            .sidebar-left { display: flex; }
        }

        .categories-section {
            padding: 1.5rem;
            border-bottom: 2px solid var(--color-black);
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 1rem;
        }

        .section-title {
            font-weight: 700;
            font-size: 0.625rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: var(--color-muted);
            margin: 0;
        }

        .btn-add {
            color: var(--color-accent);
            font-weight: 700;
            font-size: 0.625rem;
            text-transform: uppercase;
            background: none;
            border: none;
            cursor: pointer;
            padding: 0.125rem;
        }

        .btn-add:hover {
            background: var(--color-black);
            color: var(--color-white);
        }

        .categories-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .category-btn {
            padding: 0.25rem 0.75rem;
            border: 1px solid var(--color-black);
            font-weight: 700;
            font-size: 0.625rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            background: transparent;
            cursor: pointer;
            transition: all 0.2s;
        }

        .category-btn:hover {
            background: var(--color-black);
            color: var(--color-white);
        }

        .nodes-list {
            flex-grow: 1;
            overflow-y: auto;
        }

        .node-item {
            padding: 1.5rem;
            cursor: pointer;
            border-bottom: 1px solid rgba(0,0,0,0.1);
            transition: background 0.2s;
        }

        .node-item:hover {
            background: #F5F5F5;
        }

        .node-item.active {
            background: var(--color-black);
            color: var(--color-white);
        }

        .node-meta {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.25rem;
        }

        .node-type {
            font-size: 0.625rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--color-muted);
        }

        .node-item.active .node-type {
            color: var(--color-accent);
        }

        .node-category {
            font-size: 0.625rem;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--color-muted);
        }

        .node-title {
            font-weight: 700;
            font-size: 1.125rem;
            line-height: 1.3;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        .node-item.active .node-title {
            color: var(--color-white);
        }

        .stats-footer {
            padding: 1.5rem;
            border-top: 2px solid var(--color-black);
            background: #FAFAFA;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .stat-value {
            font-size: 2.25rem;
            font-weight: 900;
            line-height: 1;
        }

        .stat-value.accent {
            color: var(--color-accent);
        }

        .stat-label {
            font-size: 0.625rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--color-muted);
        }

        /* MAIN CONTENT */
        .main-content {
            flex-grow: 1;
            grid-column: span 6;
            height: 100%;
            overflow-y: auto;
            position: relative;
            background: var(--color-white);
            display: flex;
            flex-direction: column;
        }

        .empty-state {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .empty-state h1 {
            font-size: 12vw;
            font-weight: 900;
            letter-spacing: -0.05em;
            line-height: 1;
            color: #F0F0F0;
            user-select: none;
            margin: 0;
        }

        @media (min-width: 1024px) {
            .empty-state h1 { font-size: 8rem; }
        }

        .empty-state p {
            margin-top: 1rem;
            font-weight: 700;
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--color-black);
        }

        /* EDITOR */
        .node-editor {
            display: none;
            flex-direction: column;
            height: 100%;
            z-index: 10;
            background: var(--color-white);
        }

        .node-editor.active {
            display: flex;
        }

        .editor-toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            border-bottom: 2px solid var(--color-black);
        }

        .editor-toolbar select {
            height: 48px;
            padding: 0 1.5rem;
            background: var(--color-black);
            color: var(--color-white);
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            border: none;
            border-radius: 0;
            cursor: pointer;
            appearance: none;
        }

        .editor-toolbar select:hover {
            background: var(--color-accent);
        }

        .editor-toolbar input {
            height: 48px;
            padding: 0 1.5rem;
            border: none;
            border-left: 2px solid var(--color-black);
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            flex-grow: 1;
            background: transparent;
        }

        .editor-toolbar input::placeholder {
            color: var(--color-muted);
        }

        .btn-delete {
            height: 48px;
            padding: 0 1.5rem;
            border: none;
            border-left: 2px solid var(--color-black);
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #DC2626;
            background: transparent;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-delete:hover {
            background: #DC2626;
            color: var(--color-white);
        }

        .editor-content {
            padding: 2rem;
            max-width: 56rem;
            margin: 0 auto;
            width: 100%;
        }

        @media (min-width: 1024px) {
            .editor-content { padding: 4rem; }
        }

        .editor-title {
            font-size: 3rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -0.05em;
            line-height: 0.9;
            margin-bottom: 2rem;
        }

        .editor-title:empty::before {
            content: 'UNTITLED';
            color: #DDD;
        }

        @media (min-width: 1024px) {
            .editor-title { font-size: 4.5rem; }
        }

        .editor-body {
            font-size: 1.25rem;
            font-weight: 500;
            line-height: 1.7;
            min-height: 30vh;
        }

        .editor-body:empty::before {
            content: 'Start typing...';
            color: #CCC;
        }

        @media (min-width: 1024px) {
            .editor-body { font-size: 1.5rem; }
        }

        /* CONNECTIONS */
        .connections-section {
            margin-top: 6rem;
            padding-top: 2rem;
            border-top: 2px solid var(--color-black);
        }

        .connections-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 1.5rem;
        }

        .connections-header h3 {
            font-size: 1.5rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -0.025em;
            margin: 0;
        }

        .btn-link {
            font-size: 0.875rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--color-accent);
            background: none;
            border: none;
            cursor: pointer;
        }

        .btn-link:hover {
            text-decoration: underline;
        }

        .connections-list {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1rem;
        }

        @media (min-width: 768px) {
            .connections-list {
                grid-template-columns: 1fr 1fr;
            }
        }

        .connection-item {
            border: 2px solid var(--color-black);
            padding: 1rem;
            cursor: pointer;
            position: relative;
            transition: all 0.2s;
        }

        .connection-item:hover {
            background: var(--color-black);
            color: var(--color-white);
        }

        .connection-type {
            font-size: 0.625rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--color-accent);
            margin-bottom: 0.25rem;
        }

        .connection-title {
            font-weight: 700;
            font-size: 1.125rem;
            line-height: 1.2;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .connection-remove {
            position: absolute;
            top: 0.5rem;
            right: 0.5rem;
            color: var(--color-accent);
            font-weight: 700;
            opacity: 0;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.25rem;
        }

        .connection-item:hover .connection-remove {
            opacity: 1;
            color: var(--color-white);
        }

        .no-connections {
            color: var(--color-muted);
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.1em;
            grid-column: span 2;
        }

        /* RIGHT SIDEBAR */
        .sidebar-right {
            display: none;
            grid-column: span 3;
            border-left: 2px solid var(--color-black);
            flex-direction: column;
            height: 100%;
            background: #FAFAFA;
            position: relative;
            overflow: hidden;
        }

        @media (min-width: 1024px) {
            .sidebar-right { display: flex; }
        }

        .graph-label {
            position: absolute;
            top: 0;
            left: 0;
            padding: 1rem;
            z-index: 10;
            pointer-events: none;
        }

        .graph-label h3 {
            font-size: 2.25rem;
            font-weight: 900;
            color: rgba(0,0,0,0.1);
            text-transform: uppercase;
            letter-spacing: -0.025em;
            margin: 0;
        }

        .graph-container {
            flex-grow: 1;
            width: 100%;
            height: 100%;
        }

        .graph-container canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .graph-actions {
            border-top: 2px solid var(--color-black);
            padding: 1rem;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.5rem;
        }

        .btn-export, .btn-import {
            padding: 0.75rem;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            border: 2px solid var(--color-black);
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-export {
            background: transparent;
            color: var(--color-black);
        }

        .btn-export:hover {
            background: var(--color-black);
            color: var(--color-white);
        }

        .btn-import {
            background: var(--color-black);
            color: var(--color-white);
        }

        .btn-import:hover {
            background: var(--color-accent);
        }

        /* MOBILE MENU */
        .mobile-menu {
            position: fixed;
            inset: 0;
            background: var(--color-white);
            z-index: 50;
            transform: translateX(100%);
            transition: transform 0.3s;
            display: flex;
            flex-direction: column;
        }

        @media (min-width: 1024px) {
            .mobile-menu { display: none; }
        }

        .mobile-menu.open {
            transform: translateX(0);
        }

        .mobile-menu-header {
            height: 64px;
            border-bottom: 2px solid var(--color-black);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1.5rem;
        }

        .mobile-menu-header span {
            font-weight: 900;
            font-size: 1.5rem;
            letter-spacing: -0.025em;
        }

        .mobile-menu-close {
            color: var(--color-accent);
            font-weight: 900;
            font-size: 2.5rem;
            line-height: 1;
            background: none;
            border: none;
            cursor: pointer;
        }

        .mobile-menu-close:hover {
            color: var(--color-black);
        }

        .mobile-menu-content {
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .mobile-btn {
            width: 100%;
            padding: 1.5rem;
            border: 2px solid var(--color-black);
            font-weight: 900;
            font-size: 1.25rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            text-align: left;
            background: transparent;
            cursor: pointer;
            transition: all 0.2s;
        }

        .mobile-btn:hover {
            background: var(--color-accent);
            color: var(--color-white);
        }

        .mobile-btn.alt:hover {
            background: var(--color-black);
            color: var(--color-white);
        }

        .mobile-nav-section {
            margin-top: 2rem;
        }

        .mobile-nav-section h3 {
            font-weight: 700;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--color-muted);
            margin-bottom: 1rem;
        }

        .mobile-categories {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .mobile-category-btn {
            text-align: left;
            padding: 0.5rem 0;
            border: none;
            border-bottom: 1px solid #EEE;
            font-size: 0.875rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            background: transparent;
            cursor: pointer;
        }

        /* MOBILE GRAPH OVERLAY */
        .mobile-graph-overlay {
            position: fixed;
            inset: 0;
            background: var(--color-white);
            z-index: 60;
            display: none;
            flex-direction: column;
        }

        .mobile-graph-overlay.open {
            display: flex;
        }

        .mobile-graph-header {
            height: 64px;
            border-bottom: 2px solid var(--color-black);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1.5rem;
            background: var(--color-black);
            color: var(--color-white);
        }

        .mobile-graph-header span {
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .mobile-graph-close {
            color: var(--color-accent);
            font-weight: 900;
            font-size: 1.5rem;
            background: none;
            border: none;
            cursor: pointer;
        }

        .mobile-graph-container {
            flex-grow: 1;
            position: relative;
            background: #FAFAFA;
        }

        .mobile-graph-container canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* MODAL */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(4px);
            z-index: 70;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .modal-overlay.open {
            display: flex;
        }

        .modal-box {
            background: var(--color-white);
            border: 2px solid var(--color-black);
            width: 100%;
            max-width: 32rem;
            box-shadow: 8px 8px 0px 0px rgba(0,0,0,1);
        }

        .modal-content {
            padding: 2rem;
        }

        .modal-content h2 {
            font-size: 2.25rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -0.025em;
            margin: 0 0 2rem 0;
        }

        .modal-select {
            width: 100%;
            height: 56px;
            padding: 0 1rem;
            border: 2px solid var(--color-black);
            font-weight: 700;
            font-size: 1.125rem;
            border-radius: 0;
            background: var(--color-white);
            margin-bottom: 1.5rem;
        }

        .modal-select:focus {
            border-color: var(--color-accent);
        }

        .modal-actions {
            display: flex;
            gap: 1rem;
        }

        .modal-btn {
            flex: 1;
            height: 56px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            border: 2px solid var(--color-black);
            cursor: pointer;
            transition: all 0.2s;
        }

        .modal-btn.primary {
            background: var(--color-accent);
            color: var(--color-white);
            border-color: var(--color-accent);
        }

        .modal-btn.primary:hover {
            background: var(--color-black);
            border-color: var(--color-black);
        }

        .modal-btn.secondary {
            background: transparent;
            color: var(--color-black);
        }

        .modal-btn.secondary:hover {
            background: var(--color-black);
            color: var(--color-white);
        }
    </style>
</head>
<body>
    <div class="app-container">
        
        <!-- === HEADER === -->
        <header class="app-header">
            <div class="brand">
                <h1>KG<span>/</span>25</h1>
                <button class="mobile-menu-btn" onclick="toggleMobileMenu()">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                        <path d="M4 6h16M4 12h16M4 18h16"/>
                    </svg>
                </button>
            </div>

            <div class="search-container">
                <input type="text" id="searchInput" placeholder="SEARCH DATABASE...">
            </div>

            <div class="header-actions">
                <button class="btn-create" onclick="createNewNode()">
                    <span>+ Create</span>
                </button>
            </div>
        </header>

        <!-- === MOBILE MENU === -->
        <div id="mobileMenu" class="mobile-menu">
            <div class="mobile-menu-header">
                <span>MENU</span>
                <button class="mobile-menu-close" onclick="toggleMobileMenu()">&times;</button>
            </div>
            <div class="mobile-menu-content">
                <button class="mobile-btn" onclick="createNewNode(); toggleMobileMenu()">
                    + Create New Note
                </button>
                <button class="mobile-btn alt" onclick="toggleMobileGraph(); toggleMobileMenu()">
                    View Graph
                </button>
                <div class="mobile-nav-section">
                    <h3>Navigation</h3>
                    <div id="mobileCategories" class="mobile-categories">
                        <!-- Categories injected here -->
                    </div>
                </div>
            </div>
        </div>

        <!-- === LEFT SIDEBAR === -->
        <aside class="sidebar-left">
            <div class="categories-section">
                <div class="section-header">
                    <h2 class="section-title">Index / Categories</h2>
                    <button class="btn-add" onclick="addCategory()">Add +</button>
                </div>
                <div id="categoriesList" class="categories-list">
                    <!-- Categories loaded here -->
                </div>
            </div>
            
            <div class="nodes-list">
                <div id="nodesList">
                    <!-- Nodes loaded here -->
                </div>
            </div>
            
            <div class="stats-footer">
                <div>
                    <div class="stat-value" id="totalNotes">0</div>
                    <div class="stat-label">Notes</div>
                </div>
                <div>
                    <div class="stat-value accent" id="totalConnections">0</div>
                    <div class="stat-label">Links</div>
                </div>
            </div>
        </aside>

        <!-- === MAIN CONTENT === -->
        <main class="main-content">
            
            <!-- EMPTY STATE -->
            <div id="emptyState" class="empty-state">
                <h1>START</h1>
                <p>Select a note or create new</p>
            </div>

            <!-- EDITOR -->
            <div id="nodeEditor" class="node-editor">
                
                <div class="editor-toolbar">
                    <select id="nodeType" onchange="saveCurrentNode()">
                        <option value="Note">Note</option>
                        <option value="Concept">Concept</option>
                        <option value="Person">Person</option>
                        <option value="Project">Project</option>
                    </select>
                    <input type="text" id="nodeCategory" placeholder="UNCATEGORIZED" onchange="saveCurrentNode()">
                    <button class="btn-delete" onclick="deleteCurrentNode()">Delete</button>
                </div>

                <div class="editor-content">
                    <h1 id="nodeTitle" contenteditable="true" onblur="saveCurrentNode()" class="editor-title">
                        Untitled
                    </h1>

                    <div id="nodeContent" contenteditable="true" onblur="saveCurrentNode()" class="editor-body">
                    </div>

                    <div class="connections-section">
                        <div class="connections-header">
                            <h3>Connections</h3>
                            <button class="btn-link" onclick="showLinkModal()">+ Link Node</button>
                        </div>
                        <div id="connectionsList" class="connections-list">
                            <!-- Connections injected -->
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <!-- === RIGHT SIDEBAR === -->
        <aside class="sidebar-right">
            <div class="graph-label">
                <h3>Graph View</h3>
            </div>
            <div class="graph-container" id="graph-container">
                <canvas id="knowledgeGraph"></canvas>
            </div>
            <div class="graph-actions">
                <button class="btn-export" onclick="exportData()">Export</button>
                <button class="btn-import" onclick="importData()">Import</button>
            </div>
        </aside>

        <!-- === MOBILE GRAPH OVERLAY === -->
        <div id="mobileGraphOverlay" class="mobile-graph-overlay">
            <div class="mobile-graph-header">
                <span>Visualizer</span>
                <button class="mobile-graph-close" onclick="toggleMobileGraph()">&times;</button>
            </div>
            <div class="mobile-graph-container">
                <canvas id="knowledgeGraphMobile"></canvas>
            </div>
        </div>

        <!-- === LINK MODAL === -->
        <div id="linkModal" class="modal-overlay">
            <div class="modal-box">
                <div class="modal-content">
                    <h2>Connect Node</h2>
                    <select id="linkTargetSelect" class="modal-select">
                        <!-- Options loaded dynamically -->
                    </select>
                    <div class="modal-actions">
                        <button class="modal-btn primary" onclick="createLink()">Link</button>
                        <button class="modal-btn secondary" onclick="closeLinkModal()">Cancel</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- === JAVASCRIPT === -->
    <script>
        // CORE DATA
        let nodes = [];
        let connections = [];
        let categories = new Set(['WORK', 'PERSONAL', 'IDEAS']);
        let currentNodeId = null;

        // --- APP INIT ---
        function init() {
            loadData();
            renderNodesList();
            renderCategoriesList();
            updateStats();
            drawGraph();
            
            const searchInput = document.getElementById('searchInput');
            if(searchInput) searchInput.addEventListener('input', handleSearch);
        }

        // --- STORAGE ---
        function saveData() {
            localStorage.setItem('pkg_nodes_v2', JSON.stringify(nodes));
            localStorage.setItem('pkg_connections_v2', JSON.stringify(connections));
            localStorage.setItem('pkg_categories_v2', JSON.stringify([...categories]));
        }

        function loadData() {
            const savedNodes = localStorage.getItem('pkg_nodes_v2');
            const savedConnections = localStorage.getItem('pkg_connections_v2');
            const savedCategories = localStorage.getItem('pkg_categories_v2');
            if (savedNodes) nodes = JSON.parse(savedNodes);
            if (savedConnections) connections = JSON.parse(savedConnections);
            if (savedCategories) categories = new Set(JSON.parse(savedCategories));
        }

        // --- NODES LOGIC ---
        function createNewNode() {
            const newNode = {
                id: 'node_' + Date.now(),
                title: '',
                type: 'Note',
                category: '',
                content: '',
                createdAt: new Date().toISOString()
            };
            nodes.unshift(newNode);
            saveData();
            openNode(newNode.id);
            renderNodesList();
            updateStats();
            drawGraph();
        }

        function openNode(nodeId) {
            currentNodeId = nodeId;
            const node = nodes.find(n => n.id === nodeId);
            if (!node) return;

            document.getElementById('emptyState').style.display = 'none';
            const editor = document.getElementById('nodeEditor');
            editor.classList.add('active');

            document.getElementById('nodeTitle').innerText = node.title;
            document.getElementById('nodeType').value = node.type;
            document.getElementById('nodeCategory').value = node.category || '';
            document.getElementById('nodeContent').innerHTML = node.content;
            
            renderConnections();
            renderNodesList();
            drawGraph();
        }

        function saveCurrentNode() {
            if (!currentNodeId) return;
            const node = nodes.find(n => n.id === currentNodeId);
            if (!node) return;

            node.title = document.getElementById('nodeTitle').innerText.trim();
            node.type = document.getElementById('nodeType').value;
            node.category = document.getElementById('nodeCategory').value.trim().toUpperCase();
            node.content = document.getElementById('nodeContent').innerHTML;
            
            if (node.category) categories.add(node.category);
            
            saveData();
            renderNodesList();
            renderCategoriesList();
            updateStats();
            drawGraph();
        }

        function deleteCurrentNode() {
            if (!currentNodeId || !confirm('IRREVERSIBLE ACTION. CONFIRM DELETE?')) return;
            nodes = nodes.filter(n => n.id !== currentNodeId);
            connections = connections.filter(c => c.source !== currentNodeId && c.target !== currentNodeId);
            currentNodeId = null;
            
            document.getElementById('emptyState').style.display = 'flex';
            document.getElementById('nodeEditor').classList.remove('active');
            
            saveData();
            renderNodesList();
            updateStats();
            drawGraph();
        }

        // --- CONNECTIONS LOGIC ---
        function showLinkModal() {
            const select = document.getElementById('linkTargetSelect');
            select.innerHTML = '<option value="">SELECT TARGET NODE</option>';
            nodes.filter(n => n.id !== currentNodeId).forEach(node => {
                const option = document.createElement('option');
                option.value = node.id;
                option.textContent = (node.title || "UNTITLED") + ` [${node.type}]`;
                select.appendChild(option);
            });
            document.getElementById('linkModal').classList.add('open');
        }

        function closeLinkModal() {
            document.getElementById('linkModal').classList.remove('open');
        }

        function createLink() {
            const targetId = document.getElementById('linkTargetSelect').value;
            if (!targetId || !currentNodeId) return;
            
            const exists = connections.some(c => 
                (c.source === currentNodeId && c.target === targetId) || 
                (c.source === targetId && c.target === currentNodeId)
            );

            if (!exists) {
                connections.push({ source: currentNodeId, target: targetId });
                saveData();
                renderConnections();
                updateStats();
                drawGraph();
            }
            closeLinkModal();
        }

        function removeConnection(targetId) {
            connections = connections.filter(c => 
                !(c.source === currentNodeId && c.target === targetId) && 
                !(c.source === targetId && c.target === currentNodeId)
            );
            saveData();
            renderConnections();
            updateStats();
            drawGraph();
        }

        function renderConnections() {
            const container = document.getElementById('connectionsList');
            const linkedNodes = connections
                .filter(c => c.source === currentNodeId || c.target === currentNodeId)
                .map(c => c.source === currentNodeId ? c.target : c.source)
                .map(id => nodes.find(n => n.id === id))
                .filter(n => n);

            if (linkedNodes.length === 0) {
                container.innerHTML = '<p class="no-connections">No active connections</p>';
                return;
            }

            container.innerHTML = linkedNodes.map(node => `
                <div onclick="openNode('${node.id}')" class="connection-item">
                    <div class="connection-type">${node.type}</div>
                    <div class="connection-title">${node.title || 'UNTITLED'}</div>
                    <button onclick="event.stopPropagation(); removeConnection('${node.id}')" class="connection-remove">&times;</button>
                </div>
            `).join('');
        }

        // --- RENDER LISTS ---
        function renderNodesList(filterFn = null) {
            const container = document.getElementById('nodesList');
            let displayNodes = filterFn ? nodes.filter(filterFn) : nodes;

            if (displayNodes.length === 0) {
                container.innerHTML = '<div class="node-item"><span class="node-type">Database Empty</span></div>';
                return;
            }

            container.innerHTML = displayNodes.map(node => `
                <div onclick="openNode('${node.id}')" class="node-item ${node.id === currentNodeId ? 'active' : ''}">
                    <div class="node-meta">
                        <span class="node-type">${node.type}</span>
                        <span class="node-category">${node.category || ''}</span>
                    </div>
                    <h3 class="node-title">${node.title || 'UNTITLED'}</h3>
                </div>
            `).join('');
        }

        function renderCategoriesList() {
            const container = document.getElementById('categoriesList');
            const mobileContainer = document.getElementById('mobileCategories');
            
            const html = ['ALL', ...categories].map(cat => `
                <button onclick="filterByCategory('${cat}')" class="category-btn">
                    ${cat}
                </button>
            `).join('');
            
            if(container) container.innerHTML = html;
            
            if(mobileContainer) {
                mobileContainer.innerHTML = ['ALL', ...categories].map(cat => `
                    <button onclick="filterByCategory('${cat}'); toggleMobileMenu()" class="mobile-category-btn">
                        ${cat}
                    </button>
                `).join('');
            }
        }

        function addCategory() {
            const name = prompt('Enter category name:');
            if (name && name.trim()) {
                categories.add(name.trim().toUpperCase());
                saveData();
                renderCategoriesList();
            }
        }

        function filterByCategory(cat) {
            if (cat === 'ALL') {
                renderNodesList();
            } else {
                renderNodesList(n => n.category === cat);
            }
        }

        function handleSearch(e) {
            const q = e.target.value.toLowerCase();
            if (!q) {
                renderNodesList();
                return;
            }
            renderNodesList(n => 
                (n.title && n.title.toLowerCase().includes(q)) || 
                (n.content && n.content.toLowerCase().includes(q))
            );
        }

        function updateStats() {
            document.getElementById('totalNotes').innerText = nodes.length;
            document.getElementById('totalConnections').innerText = connections.length;
        }

        // --- MOBILE MENU ---
        function toggleMobileMenu() {
            document.getElementById('mobileMenu').classList.toggle('open');
        }

        function toggleMobileGraph() {
            const overlay = document.getElementById('mobileGraphOverlay');
            overlay.classList.toggle('open');
            if (overlay.classList.contains('open')) {
                setTimeout(drawMobileGraph, 100);
            }
        }

        // --- VISUALIZATION (CANVAS) ---
        function drawGraph() {
            const canvas = document.getElementById('knowledgeGraph');
            if (canvas && canvas.offsetParent !== null) {
                renderGraphOnCanvas(canvas);
            }
        }

        function drawMobileGraph() {
            const canvas = document.getElementById('knowledgeGraphMobile');
            renderGraphOnCanvas(canvas);
        }

        function renderGraphOnCanvas(canvas) {
            const ctx = canvas.getContext('2d');
            const width = canvas.parentElement.offsetWidth;
            const height = canvas.parentElement.offsetHeight;
            
            canvas.width = width;
            canvas.height = height;
            
            ctx.clearRect(0, 0, width, height);

            if (nodes.length === 0) return;

            const nodePositions = nodes.map((n, i) => {
                const r = 40 * Math.sqrt(i + 1);
                const theta = i * 2.4;
                const cx = width / 2;
                const cy = height / 2;

                return {
                    id: n.id,
                    x: cx + r * Math.cos(theta),
                    y: cy + r * Math.sin(theta),
                    active: n.id === currentNodeId
                };
            });

            // DRAW EDGES
            ctx.strokeStyle = '#E5E5E5';
            ctx.lineWidth = 1;
            
            connections.forEach(conn => {
                const start = nodePositions.find(np => np.id === conn.source);
                const end = nodePositions.find(np => np.id === conn.target);
                if (start && end) {
                    ctx.beginPath();
                    ctx.moveTo(start.x, start.y);
                    ctx.lineTo(end.x, end.y);
                    ctx.stroke();
                }
            });

            // DRAW NODES
            nodePositions.forEach(np => {
                ctx.fillStyle = np.active ? '#FF4F00' : '#111111';
                
                if (np.active) {
                    ctx.beginPath();
                    ctx.arc(np.x, np.y, 8, 0, Math.PI * 2);
                    ctx.fill();
                    
                    ctx.strokeStyle = '#FF4F00';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.arc(np.x, np.y, 14, 0, Math.PI * 2);
                    ctx.stroke();
                } else {
                    ctx.beginPath();
                    ctx.arc(np.x, np.y, 4, 0, Math.PI * 2);
                    ctx.fill();
                }
            });
        }

        // --- IMPORT / EXPORT ---
        function exportData() {
            const data = { nodes, connections, categories: [...categories] };
            const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'pkg_swiss_data.json';
            a.click();
        }

        function importData() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            input.onchange = e => {
                const file = e.target.files[0];
                const reader = new FileReader();
                reader.onload = ev => {
                    try {
                        const d = JSON.parse(ev.target.result);
                        nodes = d.nodes || [];
                        connections = d.connections || [];
                        if (d.categories) categories = new Set(d.categories);
                        saveData();
                        location.reload();
                    } catch(err) { alert('Invalid JSON'); }
                }
                reader.readAsText(file);
            }
            input.click();
        }

        // Boot
        window.addEventListener('load', init);
        window.addEventListener('resize', () => { drawGraph(); });
    </script>
</body>
</html>
