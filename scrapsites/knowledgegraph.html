<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Knowledge Graph</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;600;900&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { 'sans': ['Inter Tight', 'sans-serif'] },
                    colors: {
                        'navy': '#001F3F',
                        'orange': '#FF4F00',
                        'white': '#FFFFFF',
                        'fog': '#F5F5F5',
                    }
                }
            }
        }
    </script>

    <style>
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #001F3F; border-radius: 0; }
        ::-webkit-scrollbar-thumb:hover { background: #FF4F00; }
        
        [contenteditable="true"]:focus {
            outline: 2px solid #FF4F00;
            outline-offset: 2px;
        }

        /* Mobile Menu Animations */
        .mobile-menu-enter {
            transform: translateX(-100%);
            transition: transform 0.3s ease-out;
        }
        .mobile-menu-enter-active {
            transform: translateX(0);
        }
        
        /* Prevent body scroll when menu is open */
        body.menu-open {
            overflow: hidden;
        }
    </style>
</head>
<body class="bg-white text-navy font-sans h-screen overflow-hidden flex flex-col">

    <!-- MOBILE HEADER -->
    <header class="h-14 sm:h-16 border-b-2 border-navy flex shrink-0">
        <!-- Mobile Menu Button (visible on mobile only) -->
        <button onclick="toggleMobileMenu()" class="lg:hidden w-14 border-r border-navy flex items-center justify-center hover:bg-navy hover:text-white transition-colors">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
            </svg>
        </button>

        <!-- Logo (Desktop) / Brand (Mobile) -->
        <div class="hidden lg:flex w-64 border-r-2 border-navy items-center justify-between px-6 bg-navy text-white">
            <span class="font-black tracking-widest text-lg">KNOWLEDGE<span class="text-orange">/</span>GRAPH</span>
            <div class="w-3 h-3 bg-orange"></div>
        </div>
        
        <!-- Mobile Logo -->
        <div class="lg:hidden flex items-center px-4 font-black text-sm tracking-widest">
            KG<span class="text-orange">/</span>
        </div>
        
        <!-- Search Area -->
        <div class="flex-grow flex items-center px-3 sm:px-6">
            <input type="text" id="searchInput" placeholder="Search notes..." 
                   class="w-full bg-transparent border-none outline-none font-semibold text-sm sm:text-lg placeholder-navy/30 text-navy">
        </div>

        <!-- New Note Button -->
        <div class="flex items-center justify-center">
            <button onclick="createNewNode()" class="bg-orange text-white px-3 sm:px-4 py-2 h-full text-xs font-bold uppercase tracking-widest hover:bg-navy transition-colors whitespace-nowrap">
                <span class="hidden sm:inline">+ New</span>
                <span class="sm:hidden">+</span>
            </button>
        </div>

        <!-- Mobile Graph Toggle -->
        <button onclick="toggleMobileGraph()" class="lg:hidden w-14 border-l border-navy flex items-center justify-center hover:bg-navy hover:text-white transition-colors">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path>
            </svg>
        </button>
    </header>

    <!-- MAIN WORKSPACE -->
    <main class="flex-grow flex overflow-hidden relative">
        
        <!-- MOBILE MENU OVERLAY -->
        <div id="mobileOverlay" class="hidden fixed inset-0 bg-navy/60 z-40 lg:hidden" onclick="toggleMobileMenu()"></div>
        
        <!-- LEFT SIDEBAR -->
        <aside id="leftSidebar" class="fixed lg:relative inset-y-0 left-0 z-50 w-64 lg:w-64 border-r border-navy flex flex-col shrink-0 bg-white lg:bg-fog/30 transform -translate-x-full lg:translate-x-0 transition-transform duration-300">
            <!-- Mobile Close Button -->
            <div class="lg:hidden flex justify-between items-center p-4 border-b border-navy">
                <span class="font-black text-lg">MENU</span>
                <button onclick="toggleMobileMenu()" class="text-orange font-bold text-xl">&times;</button>
            </div>

            <div class="p-4 border-b border-navy">
                <h3 class="font-bold text-xs uppercase tracking-widest text-orange mb-3">Categories</h3>
                <div id="categoriesList" class="space-y-2 text-sm font-semibold">
                    <!-- Categories dynamically loaded -->
                </div>
                <button onclick="addCategory()" class="mt-3 text-xs font-bold text-orange hover:underline">+ Add Category</button>
            </div>
            
            <div class="flex-grow p-4 overflow-y-auto">
                <h3 class="font-bold text-xs uppercase tracking-widest text-orange mb-3">All Notes</h3>
                <div id="nodesList" class="space-y-3">
                    <!-- Nodes dynamically loaded -->
                </div>
            </div>
        </aside>

        <!-- CENTER: Active Node Content -->
        <section class="flex-grow flex flex-col overflow-y-auto bg-white relative w-full">
            <div id="emptyState" class="flex items-center justify-center h-full flex-col space-y-4 p-4">
                <div class="text-4xl sm:text-6xl font-black text-navy/10">📝</div>
                <p class="text-lg sm:text-xl font-bold text-navy/40 text-center">Create your first note to get started</p>
                <button onclick="createNewNode()" class="bg-orange text-white px-6 py-3 font-bold uppercase tracking-widest text-sm">
                    Create Note
                </button>
            </div>

            <div id="nodeEditor" class="hidden flex-col h-full">
                <!-- Breadcrumbs -->
                <div class="h-10 sm:h-12 border-b border-navy flex items-center px-4 sm:px-8 text-xs sm:text-sm font-medium text-navy/60 overflow-x-auto whitespace-nowrap">
                    <span id="breadcrumbs">Home</span>
                </div>

                <div class="flex-grow overflow-y-auto p-4 sm:p-8 lg:p-12">
                    <!-- Node Header -->
                    <header class="mb-6 sm:mb-8">
                        <div class="flex items-center gap-2 sm:gap-4 mb-4 flex-wrap">
                            <select id="nodeType" onchange="saveCurrentNode()" class="px-2 sm:px-3 py-1 bg-navy text-white text-xs font-bold uppercase tracking-widest border-none">
                                <option value="Note">Note</option>
                                <option value="Concept">Concept</option>
                                <option value="Person">Person</option>
                                <option value="Project">Project</option>
                                <option value="Resource">Resource</option>
                            </select>
                            
                            <input type="text" id="nodeCategory" placeholder="Category" 
                                   onchange="saveCurrentNode()"
                                   class="px-2 sm:px-3 py-1 border border-navy text-navy text-xs font-bold uppercase tracking-widest outline-none focus:border-orange flex-shrink-0">
                            
                            <input type="text" id="nodeTags" placeholder="#tags" 
                                   onchange="saveCurrentNode()"
                                   class="flex-grow min-w-0 px-2 sm:px-3 py-1 border border-navy text-navy text-xs uppercase tracking-widest outline-none focus:border-orange">
                        </div>
                        
                        <h1 id="nodeTitle" contenteditable="true" 
                            class="text-3xl sm:text-4xl lg:text-5xl font-black uppercase leading-none tracking-tight mb-4 sm:mb-6 focus:text-orange transition-colors break-words"
                            onblur="saveCurrentNode()">
                            Untitled Note
                        </h1>
                    </header>

                    <!-- Rich Text Content Editor -->
                    <div class="mb-8 sm:mb-12">
                        <div class="flex gap-1 sm:gap-2 mb-4 flex-wrap border-b border-navy/20 pb-3 overflow-x-auto">
                            <button onclick="formatText('bold')" class="px-2 sm:px-3 py-1 border border-navy hover:bg-navy hover:text-white text-xs font-bold flex-shrink-0">B</button>
                            <button onclick="formatText('italic')" class="px-2 sm:px-3 py-1 border border-navy hover:bg-navy hover:text-white text-xs italic flex-shrink-0">I</button>
                            <button onclick="formatText('underline')" class="px-2 sm:px-3 py-1 border border-navy hover:bg-navy hover:text-white text-xs underline flex-shrink-0">U</button>
                            <button onclick="formatText('insertUnorderedList')" class="px-2 sm:px-3 py-1 border border-navy hover:bg-navy hover:text-white text-xs flex-shrink-0">• List</button>
                            <button onclick="formatText('insertOrderedList')" class="px-2 sm:px-3 py-1 border border-navy hover:bg-navy hover:text-white text-xs flex-shrink-0">1. List</button>
                            <button onclick="formatText('formatBlock', 'h2')" class="px-2 sm:px-3 py-1 border border-navy hover:bg-navy hover:text-white text-xs font-bold flex-shrink-0">H2</button>
                            <button onclick="formatText('formatBlock', 'h3')" class="px-2 sm:px-3 py-1 border border-navy hover:bg-navy hover:text-white text-xs font-bold flex-shrink-0">H3</button>
                        </div>
                        
                        <div id="nodeContent" contenteditable="true" 
                             class="min-h-[200px] sm:min-h-[300px] p-4 sm:p-6 border border-navy/20 leading-relaxed text-base sm:text-lg prose prose-sm sm:prose-lg max-w-none focus:border-orange"
                             onblur="saveCurrentNode()">
                            Start writing your note here...
                        </div>
                    </div>

                    <!-- Connections Section -->
                    <div class="border-t-2 border-navy pt-6 sm:pt-8">
                        <div class="flex justify-between items-center mb-4 sm:mb-6">
                            <h3 class="font-black text-xl sm:text-2xl uppercase flex items-center">
                                <span class="w-3 h-3 sm:w-4 sm:h-4 bg-orange mr-2 sm:mr-3"></span>
                                Links
                            </h3>
                            <button onclick="showLinkModal()" class="text-xs sm:text-sm font-bold text-orange hover:underline whitespace-nowrap">+ Add Link</button>
                        </div>
                        
                        <div id="connectionsList" class="grid grid-cols-1 gap-3 sm:gap-4">
                            <!-- Connections dynamically loaded -->
                        </div>
                    </div>

                    <!-- Delete Button -->
                    <div class="mt-8 sm:mt-12 pt-6 sm:pt-8 border-t border-navy/20">
                        <button onclick="deleteCurrentNode()" class="text-sm font-bold text-red-600 hover:underline">
                            🗑️ Delete This Note
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <!-- RIGHT SIDEBAR: Graph (Hidden on mobile by default, shows as overlay) -->
        <aside id="rightSidebar" class="hidden lg:flex w-80 border-l border-navy flex-col shrink-0 bg-white">
            <div class="p-3 border-b border-navy flex justify-between items-center bg-navy text-white">
                <span class="font-bold text-xs uppercase tracking-widest">Knowledge Graph</span>
                <span class="w-2 h-2 rounded-full bg-orange animate-pulse"></span>
            </div>
            
            <div class="flex-grow relative bg-fog/20 overflow-hidden" id="graph-container">
                <canvas id="knowledgeGraph" class="w-full h-full block"></canvas>
            </div>

            <div class="border-t border-navy p-4 overflow-y-auto bg-white">
                <h3 class="font-bold text-xs uppercase tracking-widest text-orange mb-3">Statistics</h3>
                <div class="space-y-2 text-sm">
                    <div class="flex justify-between">
                        <span class="text-navy/60">Total Notes:</span>
                        <span id="totalNotes" class="font-bold">0</span>
                    </div>
                    <div class="flex justify-between">
                        <span class="text-navy/60">Connections:</span>
                        <span id="totalConnections" class="font-bold">0</span>
                    </div>
                    <div class="flex justify-between">
                        <span class="text-navy/60">Categories:</span>
                        <span id="totalCategories" class="font-bold">0</span>
                    </div>
                </div>
                
                <button onclick="exportData()" class="mt-4 w-full bg-navy text-white py-2 text-xs font-bold uppercase hover:bg-orange transition-colors">
                    Export Data
                </button>
                <button onclick="importData()" class="mt-2 w-full border border-navy py-2 text-xs font-bold uppercase hover:bg-navy hover:text-white transition-colors">
                    Import Data
                </button>
            </div>
        </aside>

        <!-- MOBILE GRAPH OVERLAY -->
        <div id="mobileGraphOverlay" class="hidden fixed inset-0 bg-white z-50 lg:hidden flex flex-col">
            <div class="h-14 border-b-2 border-navy flex items-center justify-between px-4 bg-navy text-white">
                <span class="font-bold uppercase tracking-widest">Graph View</span>
                <button onclick="toggleMobileGraph()" class="text-orange font-bold text-2xl">&times;</button>
            </div>
            <div class="flex-grow relative bg-fog/20">
                <canvas id="knowledgeGraphMobile" class="w-full h-full block"></canvas>
            </div>
            <div class="border-t-2 border-navy p-4 bg-white">
                <div class="grid grid-cols-3 gap-4 text-center mb-4">
                    <div>
                        <div class="text-2xl font-black text-navy" id="totalNotesMobile">0</div>
                        <div class="text-xs text-navy/60">Notes</div>
                    </div>
                    <div>
                        <div class="text-2xl font-black text-orange" id="totalConnectionsMobile">0</div>
                        <div class="text-xs text-navy/60">Links</div>
                    </div>
                    <div>
                        <div class="text-2xl font-black text-navy" id="totalCategoriesMobile">0</div>
                        <div class="text-xs text-navy/60">Categories</div>
                    </div>
                </div>
                <div class="flex gap-2">
                    <button onclick="exportData()" class="flex-1 bg-navy text-white py-3 text-xs font-bold uppercase">Export</button>
                    <button onclick="importData()" class="flex-1 border-2 border-navy py-3 text-xs font-bold uppercase">Import</button>
                </div>
            </div>
        </div>
    </main>

    <!-- MODAL: Link Two Nodes -->
    <div id="linkModal" class="hidden fixed inset-0 bg-navy/80 flex items-center justify-center z-50 p-4">
        <div class="bg-white p-6 sm:p-8 max-w-md w-full border-2 border-navy">
            <h2 class="text-xl sm:text-2xl font-black uppercase mb-4 sm:mb-6">Link to Note</h2>
            <select id="linkTargetSelect" class="w-full p-3 border-2 border-navy text-navy font-bold mb-4 sm:mb-6 text-sm sm:text-base">
                <!-- Options loaded dynamically -->
            </select>
            <div class="flex flex-col sm:flex-row gap-3 sm:gap-4">
                <button onclick="createLink()" class="flex-grow bg-orange text-white py-3 font-bold uppercase text-sm">Link</button>
                <button onclick="closeLinkModal()" class="px-6 border-2 border-navy py-3 font-bold uppercase hover:bg-navy hover:text-white text-sm">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        // ===== DATA STRUCTURE =====
        let nodes = [];
        let connections = [];
        let categories = new Set(['Personal', 'Work', 'Learning']);
        let currentNodeId = null;

        // ===== MOBILE MENU =====
        function toggleMobileMenu() {
            const sidebar = document.getElementById('leftSidebar');
            const overlay = document.getElementById('mobileOverlay');
            const isOpen = !sidebar.classList.contains('-translate-x-full');
            
            if (isOpen) {
                sidebar.classList.add('-translate-x-full');
                overlay.classList.add('hidden');
                document.body.classList.remove('menu-open');
            } else {
                sidebar.classList.remove('-translate-x-full');
                overlay.classList.remove('hidden');
                document.body.classList.add('menu-open');
            }
        }

        function toggleMobileGraph() {
            const overlay = document.getElementById('mobileGraphOverlay');
            const isHidden = overlay.classList.contains('hidden');
            
            if (isHidden) {
                overlay.classList.remove('hidden');
                drawMobileGraph();
            } else {
                overlay.classList.add('hidden');
            }
        }

        // ===== INITIALIZATION =====
        function init() {
            loadData();
            renderNodesList();
            renderCategoriesList();
            updateStats();
            drawGraph();
            
            document.getElementById('searchInput').addEventListener('input', handleSearch);
        }

        // ===== LOCAL STORAGE =====
        function saveData() {
            localStorage.setItem('pkg_nodes', JSON.stringify(nodes));
            localStorage.setItem('pkg_connections', JSON.stringify(connections));
            localStorage.setItem('pkg_categories', JSON.stringify([...categories]));
        }

        function loadData() {
            const savedNodes = localStorage.getItem('pkg_nodes');
            const savedConnections = localStorage.getItem('pkg_connections');
            const savedCategories = localStorage.getItem('pkg_categories');
            
            if (savedNodes) nodes = JSON.parse(savedNodes);
            if (savedConnections) connections = JSON.parse(savedConnections);
            if (savedCategories) categories = new Set(JSON.parse(savedCategories));
        }

        // ===== NODE MANAGEMENT =====
        function createNewNode() {
            const newNode = {
                id: 'node_' + Date.now(),
                title: 'Untitled Note',
                type: 'Note',
                category: '',
                tags: [],
                content: 'Start writing...',
                createdAt: new Date().toISOString(),
                updatedAt: new Date().toISOString()
            };
            
            nodes.push(newNode);
            saveData();
            openNode(newNode.id);
            renderNodesList();
            updateStats();
            drawGraph();
            
            // Close mobile menu if open
            if (window.innerWidth < 1024) {
                toggleMobileMenu();
            }
        }

        function openNode(nodeId) {
            currentNodeId = nodeId;
            const node = nodes.find(n => n.id === nodeId);
            if (!node) return;
            
            document.getElementById('emptyState').classList.add('hidden');
            document.getElementById('nodeEditor').classList.remove('hidden');
            document.getElementById('nodeEditor').classList.add('flex');
            
            document.getElementById('nodeTitle').textContent = node.title;
            document.getElementById('nodeType').value = node.type;
            document.getElementById('nodeCategory').value = node.category || '';
            document.getElementById('nodeTags').value = node.tags.join(', ');
            document.getElementById('nodeContent').innerHTML = node.content;
            
            renderConnections();
            drawGraph();
            
            // Close mobile menu after opening note
            if (window.innerWidth < 1024) {
                const sidebar = document.getElementById('leftSidebar');
                if (!sidebar.classList.contains('-translate-x-full')) {
                    toggleMobileMenu();
                }
            }
        }

        function saveCurrentNode() {
            if (!currentNodeId) return;
            
            const node = nodes.find(n => n.id === currentNodeId);
            if (!node) return;
            
            node.title = document.getElementById('nodeTitle').textContent.trim() || 'Untitled';
            node.type = document.getElementById('nodeType').value;
            node.category = document.getElementById('nodeCategory').value.trim();
            node.tags = document.getElementById('nodeTags').value.split(',').map(t => t.trim()).filter(t => t);
            node.content = document.getElementById('nodeContent').innerHTML;
            node.updatedAt = new Date().toISOString();
            
            if (node.category) categories.add(node.category);
            
            saveData();
            renderNodesList();
            renderCategoriesList();
            updateStats();
            drawGraph();
        }

        function deleteCurrentNode() {
            if (!currentNodeId || !confirm('Delete this note permanently?')) return;
            
            nodes = nodes.filter(n => n.id !== currentNodeId);
            connections = connections.filter(c => c.source !== currentNodeId && c.target !== currentNodeId);
            
            currentNodeId = null;
            document.getElementById('emptyState').classList.remove('hidden');
            document.getElementById('nodeEditor').classList.add('hidden');
            
            saveData();
            renderNodesList();
            updateStats();
            drawGraph();
        }

        // ===== CONNECTIONS =====
        function showLinkModal() {
            const select = document.getElementById('linkTargetSelect');
            select.innerHTML = '<option value="">-- Select a note --</option>';
            
            nodes.filter(n => n.id !== currentNodeId).forEach(node => {
                const option = document.createElement('option');
                option.value = node.id;
                option.textContent = node.title;
                select.appendChild(option);
            });
            
            document.getElementById('linkModal').classList.remove('hidden');
        }

        function closeLinkModal() {
            document.getElementById('linkModal').classList.add('hidden');
        }

        function createLink() {
            const targetId = document.getElementById('linkTargetSelect').value;
            if (!targetId || !currentNodeId) return;
            
            const exists = connections.some(c => 
                (c.source === currentNodeId && c.target === targetId) ||
                (c.source === targetId && c.target === currentNodeId)
            );
            
            if (!exists) {
                connections.push({ source: currentNodeId, target: targetId });
                saveData();
                renderConnections();
                updateStats();
                drawGraph();
            }
            
            closeLinkModal();
        }

        function removeConnection(targetId) {
            connections = connections.filter(c => 
                !(c.source === currentNodeId && c.target === targetId) &&
                !(c.source === targetId && c.target === currentNodeId)
            );
            saveData();
            renderConnections();
            updateStats();
            drawGraph();
        }

        function renderConnections() {
            const container = document.getElementById('connectionsList');
            const linkedNodes = connections
                .filter(c => c.source === currentNodeId || c.target === currentNodeId)
                .map(c => c.source === currentNodeId ? c.target : c.source)
                .map(id => nodes.find(n => n.id === id))
                .filter(n => n);
            
            if (linkedNodes.length === 0) {
                container.innerHTML = '<p class="text-navy/40 text-sm">No connections yet</p>';
                return;
            }
            
            container.innerHTML = linkedNodes.map(node => `
                <div class="p-4 border border-navy hover:bg-fog transition-colors cursor-pointer group relative">
                    <div class="text-xs font-bold text-orange mb-2">${node.type.toUpperCase()}</div>
                    <div class="font-bold text-base sm:text-lg pr-8" onclick="openNode('${node.id}')">${node.title}</div>
                    <button onclick="event.stopPropagation(); removeConnection('${node.id}')" 
                            class="absolute top-2 right-2 text-red-600 opacity-0 group-hover:opacity-100 text-xs font-bold">
                        ✕
                    </button>
                </div>
            `).join('');
        }

        // ===== UI RENDERING =====
        function renderNodesList() {
            const container = document.getElementById('nodesList');
            if (nodes.length === 0) {
                container.innerHTML = '<p class="text-navy/40 text-xs">No notes yet</p>';
                return;
            }
            
            container.innerHTML = nodes.map(node => `
                <div class="border border-navy p-3 hover:bg-white hover:shadow-[4px_4px_0px_0px_#001F3F] transition-all cursor-pointer group ${node.id === currentNodeId ? 'bg-white shadow-[4px_4px_0px_0px_#001F3F]' : ''}"
                     onclick="openNode('${node.id}')">
                    <div class="text-xs ${node.id === currentNodeId ? 'text-orange' : 'text-navy/50'} font-bold mb-1">${node.type.toUpperCase()}</div>
                    <div class="font-bold leading-tight group-hover:text-orange line-clamp-2 text-sm">${node.title}</div>
                </div>
            `).join('');
        }

        function renderCategoriesList() {
            const container = document.getElementById('categoriesList');
            container.innerHTML = [...categories].map(cat => `
                <div class="flex items-center group cursor-pointer" onclick="filterByCategory('${cat}')">
                    <span class="w-2 h-2 border border-navy mr-2 group-hover:bg-orange transition-colors"></span>
                    ${cat}
                </div>
            `).join('');
        }

        function addCategory() {
            const name = prompt('Enter new category name:');
            if (name && name.trim()) {
                categories.add(name.trim());
                saveData();
                renderCategoriesList();
            }
        }

        function filterByCategory(category) {
            alert(`Filtering by: ${category}\n(This feature shows all notes in category "${category}")`);
        }

        function handleSearch(e) {
            const query = e.target.value.toLowerCase();
            if (!query) {
                renderNodesList();
                return;
            }
            
            const filtered = nodes.filter(n => 
                n.title.toLowerCase().includes(query) ||
                n.content.toLowerCase().includes(query) ||
                n.tags.some(t => t.toLowerCase().includes(query))
            );
            
            const container = document.getElementById('nodesList');
            if (filtered.length === 0) {
                container.innerHTML = '<p class="text-navy/40 text-xs">No results found</p>';
                return;
            }
            
            container.innerHTML = filtered.map(node => `
                <div class="border border-navy p-3 hover:bg-white hover:shadow-[4px_4px_0px_0px_#001F3F] transition-all cursor-pointer group"
                     onclick="openNode('${node.id}')">
                    <div class="text-xs text-navy/50 font-bold mb-1">${node.type.toUpperCase()}</div>
                    <div class="font-bold leading-tight group-hover:text-orange text-sm">${node.title}</div>
                </div>
            `).join('');
        }

        function updateStats() {
            const stats = {
                notes: nodes.length,
                connections: connections.length,
                categories: categories.size
            };
            
            document.getElementById('totalNotes').textContent = stats.notes;
            document.getElementById('totalConnections').textContent = stats.connections;
            document.getElementById('totalCategories').textContent = stats.categories;
            
            // Update mobile stats
            if (document.getElementById('totalNotesMobile')) {
                document.getElementById('totalNotesMobile').textContent = stats.notes;
                document.getElementById('totalConnectionsMobile').textContent = stats.connections;
                document.getElementById('totalCategoriesMobile').textContent = stats.categories;
            }
        }

        // ===== TEXT FORMATTING =====
        function formatText(command, value = null) {
            document.execCommand(command, false, value);
            document.getElementById('nodeContent').focus();
        }

        // ===== GRAPH VISUALIZATION =====
        function drawGraph() {
            const canvas = document.getElementById('knowledgeGraph');
            if (!canvas) return;
            
            const ctx = canvas.getContext('2d');
            canvas.width = canvas.parentElement.offsetWidth;
            canvas.height = canvas.parentElement.offsetHeight;
            
            drawGraphOnCanvas(ctx, canvas.width, canvas.height);
        }

        function drawMobileGraph() {
            const canvas = document.getElementById('knowledgeGraphMobile');
            if (!canvas) return;
            
            const ctx = canvas.getContext('2d');
            canvas.width = canvas.parentElement.offsetWidth;
            canvas.height = canvas.parentElement.offsetHeight;
            
            drawGraphOnCanvas(ctx, canvas.width, canvas.height);
        }

        function drawGraphOnCanvas(ctx, width, height) {
            ctx.clearRect(0, 0, width, height);
            
            if (nodes.length === 0) {
                ctx.fillStyle = '#001F3F20';
                ctx.font = 'bold 14px Inter Tight';
                ctx.textAlign = 'center';
                ctx.fillText('No nodes yet', width / 2, height / 2);
                return;
            }
            
            // Simple layout
            const graphNodes = nodes.map((n, i) => {
                const cols = Math.ceil(Math.sqrt(nodes.length));
                const row = Math.floor(i / cols);
                const col = i % cols;
                return {
                    id: n.id,
                    x: 50 + col * (Math.min(width, 300) / cols),
                    y: 50 + row * (Math.min(height, 300) / Math.ceil(nodes.length / cols)),
                    r: n.id === currentNodeId ? 15 : 8,
                    color: n.id === currentNodeId ? '#FF4F00' : '#001F3F'
                };
            });
            
            // Draw connections
            ctx.strokeStyle = '#001F3F';
            ctx.lineWidth = 1;
            connections.forEach(conn => {
                const source = graphNodes.find(n => n.id === conn.source);
                const target = graphNodes.find(n => n.id === conn.target);
                if (source && target) {
                    ctx.beginPath();
                    ctx.moveTo(source.x, source.y);
                    ctx.lineTo(target.x, target.y);
                    ctx.stroke();
                }
            });
            
            // Draw nodes
            graphNodes.forEach(node => {
                ctx.beginPath();
                ctx.arc(node.x, node.y, node.r, 0, Math.PI * 2);
                ctx.fillStyle = node.color;
                ctx.fill();
                ctx.strokeStyle = '#001F3F';
                ctx.lineWidth = 2;
                ctx.stroke();
            });
        }

        // ===== IMPORT/EXPORT =====
        function exportData() {
            const data = {
                nodes: nodes,
                connections: connections,
                categories: [...categories],
                exportedAt: new Date().toISOString()
            };
            
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `knowledge-graph-${Date.now()}.json`;
            a.click();
        }

        function importData() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            input.onchange = (e) => {
                const file = e.target.files[0];
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const data = JSON.parse(event.target.result);
                        nodes = data.nodes || [];
                        connections = data.connections || [];
                        categories = new Set(data.categories || []);
                        saveData();
                        renderNodesList();
                        renderCategoriesList();
                        updateStats();
                        drawGraph();
                        alert('Data imported successfully!');
                    } catch (err) {
                        alert('Error importing file. Please check the format.');
                    }
                };
                reader.readAsText(file);
            };
            input.click();
        }

        // Start the app
        window.addEventListener('load', init);
        window.addEventListener('resize', () => {
            drawGraph();
            if (!document.getElementById('mobileGraphOverlay').classList.contains('hidden')) {
                drawMobileGraph();
            }
        });
    </script>

</body>
</html>
