<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Knowledge Graph 2025</title>
    
    <!-- TAILWIND CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FONTS: Inter Tight -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,400;0,600;0,900;1,400&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { 
                        'sans': ['Inter Tight', 'sans-serif'],
                        'mono': ['monospace'] 
                    },
                    colors: {
                        'black': '#111111',
                        'accent': '#FF4F00', /* International Orange */
                        'white': '#FFFFFF',
                        'grid': '#E5E5E5',
                    },
                    spacing: {
                        '18': '4.5rem',
                        '22': '5.5rem',
                    },
                    letterSpacing: {
                        'tightest': '-.075em',
                        'tighter': '-.05em',
                    }
                }
            }
        }
    </script>

    <style>
        /* SWISS SCROLLBAR */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: white; border-left: 2px solid #111; }
        ::-webkit-scrollbar-thumb { background: #111; border-radius: 0; }
        ::-webkit-scrollbar-thumb:hover { background: #FF4F00; }

        /* FOCUS STATES */
        *:focus {
            outline: none;
        }
        [contenteditable="true"]:focus, input:focus, select:focus, textarea:focus {
            background-color: #FFF0EB; /* Very light tint of accent */
            color: #111;
        }

        /* UTILITIES */
        .border-r-3 { border-right-width: 3px; }
        .border-b-3 { border-bottom-width: 3px; }
        
        /* HIDE ON MOBILE (Utility) */
        .mobile-hide { display: none; }
        @media(min-width: 1024px) { .mobile-hide { display: block; } }
    </style>
</head>
<body class="bg-white text-black font-sans h-screen overflow-hidden flex flex-col lg:grid lg:grid-cols-12 lg:grid-rows-[auto_1fr] selection:bg-accent selection:text-white">

    <!-- === HEADER (Col Span 12) === -->
    <header class="col-span-12 h-16 lg:h-24 border-b-2 border-black flex items-stretch justify-between bg-white z-20">
        
        <!-- BRAND -->
        <div class="w-full lg:w-auto px-6 lg:px-8 border-r-0 lg:border-r-2 border-black flex items-center justify-between lg:justify-start bg-white lg:col-span-2">
            <h1 class="font-black text-2xl lg:text-4xl tracking-tighter uppercase leading-none">
                KG<span class="text-accent">/</span>25
            </h1>
            <!-- Mobile Menu Toggle -->
            <button onclick="toggleMobileMenu()" class="lg:hidden w-12 h-12 flex items-center justify-center border-2 border-black active:bg-black active:text-white">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="square" stroke-linejoin="miter" stroke-width="3" d="M4 6h16M4 12h16M4 18h16"></path></svg>
            </button>
        </div>

        <!-- SEARCH (Desktop) -->
        <div class="hidden lg:flex flex-grow items-center px-8">
            <input type="text" id="searchInput" placeholder="SEARCH DATABASE..." 
                class="w-full text-4xl font-black uppercase tracking-tight placeholder-gray-300 text-black border-none bg-transparent">
        </div>

        <!-- ACTIONS -->
        <div class="hidden lg:flex items-stretch border-l-2 border-black">
            <button onclick="toggleMobileGraph()" class="px-8 font-bold text-sm uppercase tracking-widest hover:bg-black hover:text-white transition-colors border-r-2 border-black lg:hidden">
                Graph
            </button>
            <button onclick="createNewNode()" class="px-10 bg-accent text-white font-black text-lg uppercase tracking-widest hover:bg-black hover:text-white transition-colors flex items-center gap-2">
                <span>+ Create</span>
            </button>
        </div>
    </header>

    <!-- === MOBILE OVERLAY MENU === -->
    <div id="mobileMenu" class="fixed inset-0 bg-white z-50 transform translate-x-full transition-transform duration-300 lg:hidden flex flex-col">
        <div class="h-16 border-b-2 border-black flex items-center justify-between px-6">
            <span class="font-black text-2xl tracking-tighter">MENU</span>
            <button onclick="toggleMobileMenu()" class="text-accent font-black text-4xl leading-none hover:text-black">&times;</button>
        </div>
        <div class="p-6 flex flex-col gap-6">
            <button onclick="createNewNode(); toggleMobileMenu()" class="w-full py-6 border-2 border-black font-black text-xl uppercase tracking-widest hover:bg-accent hover:text-white text-left px-6">
                + Create New Note
            </button>
            <button onclick="toggleMobileGraph(); toggleMobileMenu()" class="w-full py-6 border-2 border-black font-black text-xl uppercase tracking-widest hover:bg-black hover:text-white text-left px-6">
                View Graph
            </button>
            <div class="mt-8">
                <h3 class="font-bold text-xs uppercase tracking-widest text-gray-400 mb-4">Navigation</h3>
                <div id="mobileCategories" class="flex flex-col gap-2">
                    <!-- Categories injected here -->
                </div>
            </div>
        </div>
    </div>

    <!-- === LEFT SIDEBAR: LISTS (Col Span 3) === -->
    <aside class="hidden lg:flex lg:col-span-3 border-r-2 border-black flex-col h-full overflow-hidden bg-white">
        <!-- Categories Filters -->
        <div class="p-6 border-b-2 border-black">
            <div class="flex justify-between items-end mb-4">
                <h2 class="font-bold text-xs uppercase tracking-[0.2em] text-gray-500">Index / Categories</h2>
                <button onclick="addCategory()" class="text-accent font-bold text-xs uppercase hover:bg-black hover:text-white px-1">Add +</button>
            </div>
            <div id="categoriesList" class="flex flex-wrap gap-2">
                <!-- Categories loaded here -->
            </div>
        </div>
        
        <!-- Notes List -->
        <div class="flex-grow overflow-y-auto">
            <div id="nodesList" class="divide-y-2 divide-black/10">
                <!-- Nodes loaded here -->
            </div>
        </div>
        
        <!-- Stats Footer -->
        <div class="p-6 border-t-2 border-black bg-gray-50">
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <div class="text-4xl font-black leading-none" id="totalNotes">0</div>
                    <div class="text-xs font-bold uppercase tracking-widest text-gray-400">Notes</div>
                </div>
                <div>
                    <div class="text-4xl font-black leading-none text-accent" id="totalConnections">0</div>
                    <div class="text-xs font-bold uppercase tracking-widest text-gray-400">Links</div>
                </div>
            </div>
        </div>
    </aside>

    <!-- === MAIN CONTENT: EDITOR (Col Span 6) === -->
    <main class="flex-grow lg:col-span-6 h-full overflow-y-auto relative bg-white flex flex-col">
        
        <!-- EMPTY STATE -->
        <div id="emptyState" class="absolute inset-0 flex flex-col items-center justify-center p-8 z-0">
            <h1 class="text-[12vw] lg:text-[8rem] font-black tracking-tighter leading-none text-gray-100 select-none">
                START
            </h1>
            <p class="mt-4 font-bold text-sm uppercase tracking-widest text-black">Select a note or create new</p>
        </div>

        <!-- EDITOR -->
        <div id="nodeEditor" class="hidden flex-col h-full z-10 bg-white">
            
            <!-- Metadata Bar -->
            <div class="flex flex-wrap items-center border-b-2 border-black">
                <select id="nodeType" onchange="saveCurrentNode()" class="h-12 px-6 bg-black text-white text-xs font-bold uppercase tracking-widest border-none rounded-none outline-none appearance-none hover:bg-accent cursor-pointer">
                    <option value="Note">Note</option>
                    <option value="Concept">Concept</option>
                    <option value="Person">Person</option>
                    <option value="Project">Project</option>
                </select>
                <input type="text" id="nodeCategory" placeholder="UNCATEGORIZED" onchange="saveCurrentNode()"
                    class="h-12 px-6 border-l-2 border-black text-xs font-bold uppercase tracking-widest outline-none placeholder-gray-400 flex-grow">
                
                <button onclick="deleteCurrentNode()" class="h-12 px-6 border-l-2 border-black text-xs font-bold uppercase tracking-widest text-red-600 hover:bg-red-600 hover:text-white transition-colors">
                    Delete
                </button>
            </div>

            <div class="p-8 lg:p-16 max-w-4xl mx-auto w-full">
                <!-- Title -->
                <h1 id="nodeTitle" contenteditable="true" onblur="saveCurrentNode()"
                    class="text-5xl lg:text-7xl font-black uppercase tracking-tighter leading-[0.9] mb-8 outline-none empty:before:content-['UNTITLED'] empty:before:text-gray-200">
                    Untitled
                </h1>

                <!-- Content -->
                <div id="nodeContent" contenteditable="true" onblur="saveCurrentNode()"
                    class="text-xl lg:text-2xl font-medium leading-relaxed outline-none min-h-[30vh] empty:before:content-['Start_typing...'] empty:before:text-gray-300">
                </div>

                <!-- Connections Block -->
                <div class="mt-24 pt-8 border-t-2 border-black">
                    <div class="flex justify-between items-baseline mb-6">
                        <h3 class="font-black text-2xl uppercase tracking-tighter">Connections</h3>
                        <button onclick="showLinkModal()" class="text-sm font-bold uppercase tracking-widest text-accent hover:underline">+ Link Node</button>
                    </div>
                    <div id="connectionsList" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <!-- Connections injected -->
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- === RIGHT SIDEBAR: GRAPH (Col Span 3) === -->
    <aside class="hidden lg:flex lg:col-span-3 border-l-2 border-black flex-col h-full bg-gray-50 relative overflow-hidden">
        <div class="absolute top-0 left-0 p-4 z-10 pointer-events-none">
            <h3 class="font-black text-4xl text-black/10 uppercase tracking-tighter">Graph View</h3>
        </div>
        <div class="flex-grow w-full h-full" id="graph-container">
            <canvas id="knowledgeGraph" class="block w-full h-full"></canvas>
        </div>
        <div class="border-t-2 border-black p-4 grid grid-cols-2">
            <button onclick="exportData()" class="py-3 text-xs font-bold uppercase tracking-widest border-2 border-black hover:bg-black hover:text-white mr-2">Export</button>
            <button onclick="importData()" class="py-3 text-xs font-bold uppercase tracking-widest bg-black text-white hover:bg-accent border-2 border-black">Import</button>
        </div>
    </aside>

    <!-- === MOBILE GRAPH OVERLAY === -->
    <div id="mobileGraphOverlay" class="fixed inset-0 bg-white z-[60] hidden flex flex-col">
        <div class="h-16 border-b-2 border-black flex items-center justify-between px-6 bg-black text-white">
            <span class="font-bold uppercase tracking-widest">Visualizer</span>
            <button onclick="toggleMobileGraph()" class="text-accent font-black text-2xl">&times;</button>
        </div>
        <div class="flex-grow relative bg-gray-50">
            <canvas id="knowledgeGraphMobile" class="w-full h-full block"></canvas>
        </div>
    </div>

    <!-- === MODAL: LINK NODES === -->
    <div id="linkModal" class="hidden fixed inset-0 bg-white/90 backdrop-blur-sm z-[70] flex items-center justify-center p-4">
        <div class="bg-white border-2 border-black w-full max-w-lg shadow-[8px_8px_0px_0px_rgba(0,0,0,1)]">
            <div class="p-8">
                <h2 class="text-4xl font-black uppercase tracking-tighter mb-8">Connect Node</h2>
                <select id="linkTargetSelect" class="w-full h-14 px-4 border-2 border-black font-bold text-lg rounded-none bg-white mb-6 focus:border-accent">
                    <!-- Options loaded dynamically -->
                </select>
                <div class="flex gap-4">
                    <button onclick="createLink()" class="flex-1 h-14 bg-accent text-white font-black uppercase tracking-widest hover:bg-black transition-colors">
                        Link
                    </button>
                    <button onclick="closeLinkModal()" class="flex-1 h-14 border-2 border-black font-bold uppercase tracking-widest hover:bg-black hover:text-white">
                        Cancel
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- === JAVASCRIPT === -->
    <script>
        // CORE DATA
        let nodes = [];
        let connections = [];
        let categories = new Set(['WORK', 'PERSONAL', 'IDEAS']);
        let currentNodeId = null;

        // --- APP INIT ---
        function init() {
            loadData();
            renderNodesList();
            renderCategoriesList();
            updateStats();
            drawGraph();
            
            // Search Listener
            const searchInput = document.getElementById('searchInput');
            if(searchInput) searchInput.addEventListener('input', handleSearch);
        }

        // --- STORAGE ---
        function saveData() {
            localStorage.setItem('pkg_nodes_v2', JSON.stringify(nodes));
            localStorage.setItem('pkg_connections_v2', JSON.stringify(connections));
            localStorage.setItem('pkg_categories_v2', JSON.stringify([...categories]));
        }

        function loadData() {
            const savedNodes = localStorage.getItem('pkg_nodes_v2');
            const savedConnections = localStorage.getItem('pkg_connections_v2');
            const savedCategories = localStorage.getItem('pkg_categories_v2');
            if (savedNodes) nodes = JSON.parse(savedNodes);
            if (savedConnections) connections = JSON.parse(savedConnections);
            if (savedCategories) categories = new Set(JSON.parse(savedCategories));
        }

        // --- NODES LOGIC ---
        function createNewNode() {
            const newNode = {
                id: 'node_' + Date.now(),
                title: '',
                type: 'Note',
                category: '',
                content: '',
                createdAt: new Date().toISOString()
            };
            nodes.unshift(newNode); // Add to top
            saveData();
            openNode(newNode.id);
            renderNodesList();
            updateStats();
            drawGraph();
        }

        function openNode(nodeId) {
            currentNodeId = nodeId;
            const node = nodes.find(n => n.id === nodeId);
            if (!node) return;

            document.getElementById('emptyState').classList.add('hidden');
            const editor = document.getElementById('nodeEditor');
            editor.classList.remove('hidden');
            editor.classList.add('flex');

            document.getElementById('nodeTitle').innerText = node.title;
            document.getElementById('nodeType').value = node.type;
            document.getElementById('nodeCategory').value = node.category || '';
            document.getElementById('nodeContent').innerHTML = node.content;
            
            renderConnections();
            renderNodesList(); // Re-render to highlight active
            drawGraph();
        }

        function saveCurrentNode() {
            if (!currentNodeId) return;
            const node = nodes.find(n => n.id === currentNodeId);
            if (!node) return;

            node.title = document.getElementById('nodeTitle').innerText.trim();
            node.type = document.getElementById('nodeType').value;
            node.category = document.getElementById('nodeCategory').value.trim().toUpperCase();
            node.content = document.getElementById('nodeContent').innerHTML;
            
            if (node.category) categories.add(node.category);
            
            saveData();
            renderNodesList();
            renderCategoriesList();
            updateStats();
            drawGraph();
        }

        function deleteCurrentNode() {
            if (!currentNodeId || !confirm('IRREVERSIBLE ACTION. CONFIRM DELETE?')) return;
            nodes = nodes.filter(n => n.id !== currentNodeId);
            connections = connections.filter(c => c.source !== currentNodeId && c.target !== currentNodeId);
            currentNodeId = null;
            
            document.getElementById('emptyState').classList.remove('hidden');
            document.getElementById('nodeEditor').classList.remove('flex');
            document.getElementById('nodeEditor').classList.add('hidden');
            
            saveData();
            renderNodesList();
            updateStats();
            drawGraph();
        }

        // --- CONNECTIONS LOGIC ---
        function showLinkModal() {
            const select = document.getElementById('linkTargetSelect');
            select.innerHTML = '<option value="">SELECT TARGET NODE</option>';
            nodes.filter(n => n.id !== currentNodeId).forEach(node => {
                const option = document.createElement('option');
                option.value = node.id;
                option.textContent = (node.title || "UNTITLED") + ` [${node.type}]`;
                select.appendChild(option);
            });
            document.getElementById('linkModal').classList.remove('hidden');
        }

        function closeLinkModal() {
            document.getElementById('linkModal').classList.add('hidden');
        }

        function createLink() {
            const targetId = document.getElementById('linkTargetSelect').value;
            if (!targetId || !currentNodeId) return;
            
            const exists = connections.some(c => 
                (c.source === currentNodeId && c.target === targetId) || 
                (c.source === targetId && c.target === currentNodeId)
            );

            if (!exists) {
                connections.push({ source: currentNodeId, target: targetId });
                saveData();
                renderConnections();
                updateStats();
                drawGraph();
            }
            closeLinkModal();
        }

        function removeConnection(targetId) {
            connections = connections.filter(c => 
                !(c.source === currentNodeId && c.target === targetId) && 
                !(c.source === targetId && c.target === currentNodeId)
            );
            saveData();
            renderConnections();
            updateStats();
            drawGraph();
        }

        function renderConnections() {
            const container = document.getElementById('connectionsList');
            const linkedNodes = connections
                .filter(c => c.source === currentNodeId || c.target === currentNodeId)
                .map(c => c.source === currentNodeId ? c.target : c.source)
                .map(id => nodes.find(n => n.id === id))
                .filter(n => n);

            if (linkedNodes.length === 0) {
                container.innerHTML = '<p class="text-gray-400 font-bold uppercase text-xs tracking-widest col-span-2">No active connections</p>';
                return;
            }

            container.innerHTML = linkedNodes.map(node => `
                <div onclick="openNode('${node.id}')" class="group border-2 border-black p-4 cursor-pointer hover:bg-black hover:text-white transition-all relative">
                    <div class="text-[10px] font-black uppercase tracking-widest text-accent mb-1">${node.type}</div>
                    <div class="font-bold text-lg leading-none truncate">${node.title || 'UNTITLED'}</div>
                    <button onclick="event.stopPropagation(); removeConnection('${node.id}')" 
                        class="absolute top-2 right-2 text-accent opacity-0 group-hover:opacity-100 font-bold hover:text-white">&times;</button>
                </div>
            `).join('');
        }

        // --- RENDER LISTS ---
        function renderNodesList(filterFn = null) {
            const container = document.getElementById('nodesList');
            let displayNodes = filterFn ? nodes.filter(filterFn) : nodes;

            if (displayNodes.length === 0) {
                container.innerHTML = '<div class="p-6 text-xs font-bold uppercase tracking-widest text-gray-400">Database Empty</div>';
                return;
            }

            container.innerHTML = displayNodes.map(node => `
                <div onclick="openNode('${node.id}')" 
                    class="p-6 cursor-pointer group transition-colors ${node.id === currentNodeId ? 'bg-black text-white' : 'hover:bg-gray-100'}">
                    <div class="flex justify-between mb-1">
                        <span class="text-[10px] font-black uppercase tracking-widest ${node.id === currentNodeId ? 'text-accent' : 'text-gray-400 group-hover:text-black'}">${node.type}</span>
                        <span class="text-[10px] font-bold uppercase text-gray-400">${node.category || ''}</span>
                    </div>
                    <h3 class="font-bold text-lg leading-tight line-clamp-2 ${node.id === currentNodeId ? 'text-white' : 'text-black'}">
                        ${node.title || 'UNTITLED'}
                    </h3>
                </div>
            `).join('');
        }

        function renderCategoriesList() {
            const container = document.getElementById('categoriesList');
            const mobileContainer = document.getElementById('mobileCategories');
            
            const html = ['ALL', ...categories].map(cat => `
                <button onclick="filterByCategory('${cat}')" 
                    class="px-3 py-1 border border-black text-[10px] font-bold uppercase tracking-widest hover:bg-black hover:text-white transition-colors">
                    ${cat}
                </button>
            `).join('');
            
            if(container) container.innerHTML = html;
            
            // Mobile version
            if(mobileContainer) {
                mobileContainer.innerHTML = ['ALL', ...categories].map(cat => `
                    <button onclick="filterByCategory('${cat}'); toggleMobileMenu()" 
                        class="text-left py-2 border-b border-gray-200 text-sm font-bold uppercase tracking-widest">
                        ${cat}
                    </button>
                `).join('');
            }
        }

        function filterByCategory(cat) {
            if (cat === 'ALL') {
                renderNodesList();
            } else {
                renderNodesList(n => n.category === cat);
            }
        }

        function handleSearch(e) {
            const q = e.target.value.toLowerCase();
            if (!q) {
                renderNodesList();
                return;
            }
            renderNodesList(n => 
                (n.title && n.title.toLowerCase().includes(q)) || 
                (n.content && n.content.toLowerCase().includes(q))
            );
        }

        function updateStats() {
            document.getElementById('totalNotes').innerText = nodes.length;
            document.getElementById('totalConnections').innerText = connections.length;
        }

        // --- MOBILE MENU ---
        function toggleMobileMenu() {
            const menu = document.getElementById('mobileMenu');
            menu.classList.toggle('translate-x-full');
        }

        function toggleMobileGraph() {
            const overlay = document.getElementById('mobileGraphOverlay');
            overlay.classList.toggle('hidden');
            if (!overlay.classList.contains('hidden')) {
                setTimeout(drawMobileGraph, 100);
            }
        }

        // --- VISUALIZATION (CANVAS) ---
        function drawGraph() {
            const canvas = document.getElementById('knowledgeGraph');
            if (canvas && canvas.offsetParent !== null) {
                renderGraphOnCanvas(canvas);
            }
        }

        function drawMobileGraph() {
            const canvas = document.getElementById('knowledgeGraphMobile');
            renderGraphOnCanvas(canvas);
        }

        function renderGraphOnCanvas(canvas) {
            const ctx = canvas.getContext('2d');
            const width = canvas.parentElement.offsetWidth;
            const height = canvas.parentElement.offsetHeight;
            
            canvas.width = width;
            canvas.height = height;
            
            ctx.clearRect(0, 0, width, height);

            if (nodes.length === 0) return;

            // Swiss Style Nodes Calculation (Grid-like positioning but organic)
            const nodePositions = nodes.map((n, i) => {
                // Pseudo-random deterministic position based on index
                const seed = i * 137.508; // Golden angle
                const r = 40 * Math.sqrt(i + 1);
                const theta = i * 2.4; // Golden angle approx
                
                // Center offset
                const cx = width / 2;
                const cy = height / 2;

                return {
                    id: n.id,
                    x: cx + r * Math.cos(theta),
                    y: cy + r * Math.sin(theta),
                    active: n.id === currentNodeId
                };
            });

            // DRAW EDGES (Rigid lines)
            ctx.strokeStyle = '#E5E5E5'; // Light gray grid lines
            ctx.lineWidth = 1;
            
            connections.forEach(conn => {
                const start = nodePositions.find(np => np.id === conn.source);
                const end = nodePositions.find(np => np.id === conn.target);
                if (start && end) {
                    ctx.beginPath();
                    ctx.moveTo(start.x, start.y);
                    ctx.lineTo(end.x, end.y);
                    ctx.stroke();
                }
            });

            // DRAW NODES (Square or circle? Swiss = Geometric)
            // Let's use solid circles for nodes
            nodePositions.forEach(np => {
                ctx.fillStyle = np.active ? '#FF4F00' : '#111111';
                
                // Draw line to active node if connected
                if (np.active) {
                    ctx.beginPath();
                    ctx.arc(np.x, np.y, 8, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // Ring
                    ctx.strokeStyle = '#FF4F00';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.arc(np.x, np.y, 14, 0, Math.PI * 2);
                    ctx.stroke();
                } else {
                    ctx.beginPath();
                    ctx.arc(np.x, np.y, 4, 0, Math.PI * 2);
                    ctx.fill();
                }
            });
        }

        // --- IMPORT / EXPORT ---
        function exportData() {
            const data = { nodes, connections, categories: [...categories] };
            const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'pkg_swiss_data.json';
            a.click();
        }

        function importData() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            input.onchange = e => {
                const file = e.target.files[0];
                const reader = new FileReader();
                reader.onload = ev => {
                    try {
                        const d = JSON.parse(ev.target.result);
                        nodes = d.nodes || [];
                        connections = d.connections || [];
                        if (d.categories) categories = new Set(d.categories);
                        saveData();
                        location.reload();
                    } catch(err) { alert('Invalid JSON'); }
                }
                reader.readAsText(file);
            }
            input.click();
        }

        // Boot
        window.addEventListener('load', init);
        window.addEventListener('resize', () => { drawGraph(); });
    </script>
</body>
</html>
