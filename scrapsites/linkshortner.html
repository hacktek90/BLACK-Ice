<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link Manager</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --acrylic-bg: rgba(243, 243, 243, 0.7);
            --acrylic-border: rgba(255, 255, 255, 0.6);
            --card-shadow: 0 8px 32px rgba(0, 0, 0, 0.06);
            --accent-color: #0078d4;
            --accent-hover: #106ebe;
            --text-primary: #323130;
            --text-secondary: #605e5c;
            --radius: 8px;
            --spacing: 16px;
        }

        @keyframes revealEffect {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes accentReveal {
            from {
                transform: scale(0);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 0.12;
            }
        }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            background: linear-gradient(135deg, #e3f2fd 0%, #f3e5f5 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('data:image/svg+xml,<svg width="60" height="60" xmlns="http://www.w3.org/2000/svg"><rect width="1" height="1" fill="%230078d4" opacity="0.03"/></svg>') repeat;
            pointer-events: none;
        }

        .container {
            max-width: 1000px;
            width: 100%;
            animation: revealEffect 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .header {
            margin-bottom: 32px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: var(--accent-color);
            border-radius: var(--radius);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        h1 {
            font-size: 32px;
            font-weight: 600;
            color: var(--text-primary);
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 400;
        }

        .nav-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
            background: var(--acrylic-bg);
            backdrop-filter: blur(40px) saturate(150%);
            -webkit-backdrop-filter: blur(40px) saturate(150%);
            padding: 6px;
            border-radius: var(--radius);
            border: 1px solid var(--acrylic-border);
            box-shadow: var(--card-shadow);
        }

        .nav-tab {
            flex: 1;
            padding: 10px 20px;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
        }

        .nav-tab::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100%;
            height: 100%;
            background: var(--accent-color);
            border-radius: 6px;
            transform: translate(-50%, -50%) scale(0);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: -1;
        }

        .nav-tab:hover {
            color: var(--accent-color);
        }

        .nav-tab.active {
            background: white;
            color: var(--accent-color);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
            animation: revealEffect 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Bento Grid Layout */
        .bento-container {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: var(--spacing);
            margin-bottom: 24px;
        }

        .bento-card {
            background: var(--acrylic-bg);
            backdrop-filter: blur(40px) saturate(150%);
            -webkit-backdrop-filter: blur(40px) saturate(150%);
            border-radius: var(--radius);
            padding: 20px;
            border: 1px solid var(--acrylic-border);
            box-shadow: var(--card-shadow);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
        }

        .bento-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--accent-color), transparent);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .bento-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.12);
            border-color: rgba(0, 120, 212, 0.3);
        }

        .bento-card:hover::before {
            opacity: 1;
        }

        .bento-large {
            grid-column: span 4;
        }

        .bento-medium {
            grid-column: span 3;
        }

        .bento-small {
            grid-column: span 2;
        }

        .bento-full {
            grid-column: span 6;
        }

        .card-label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input[type="text"], input[type="url"] {
            width: 100%;
            padding: 10px 12px;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 0, 0, 0.08);
            border-radius: 4px;
            font-size: 14px;
            color: var(--text-primary);
            transition: all 0.2s;
            font-family: inherit;
        }

        input[type="text"]::placeholder, input[type="url"]::placeholder {
            color: var(--text-secondary);
        }

        input[type="text"]:focus, input[type="url"]:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(0, 120, 212, 0.12);
            background: white;
        }

        .button-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .fluent-btn {
            padding: 10px 20px;
            background: var(--acrylic-bg);
            backdrop-filter: blur(40px);
            color: var(--text-primary);
            border: 1px solid rgba(0, 0, 0, 0.08);
            border-radius: 4px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
            font-family: inherit;
        }

        .fluent-btn::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: var(--accent-color);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.4s, height 0.4s;
            opacity: 0.12;
            z-index: 0;
        }

        .fluent-btn:hover::after {
            width: 300px;
            height: 300px;
        }

        .fluent-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
            border-color: rgba(0, 120, 212, 0.3);
        }

        .fluent-btn:active {
            transform: scale(0.98);
        }

        .fluent-btn-primary {
            background: var(--accent-color);
            color: white;
            border-color: var(--accent-color);
        }

        .fluent-btn-primary:hover {
            background: var(--accent-hover);
            border-color: var(--accent-hover);
        }

        .result-panel {
            background: var(--acrylic-bg);
            backdrop-filter: blur(40px) saturate(150%);
            padding: 24px;
            border-radius: var(--radius);
            border: 1px solid var(--acrylic-border);
            box-shadow: var(--card-shadow);
            margin-top: 24px;
            display: none;
        }

        .result-panel.show {
            display: block;
            animation: revealEffect 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .result-label {
            display: block;
            margin-bottom: 12px;
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .result-text {
            background: rgba(0, 120, 212, 0.05);
            padding: 16px;
            border-radius: 4px;
            border: 1px solid rgba(0, 120, 212, 0.2);
            color: var(--accent-color);
            font-size: 13px;
            font-family: 'Consolas', 'Courier New', monospace;
            word-break: break-all;
            margin-bottom: 16px;
            line-height: 1.6;
        }

        .alert-success {
            background: rgba(16, 124, 16, 0.1);
            border: 1px solid rgba(16, 124, 16, 0.3);
            color: #107c10;
            padding: 12px 16px;
            border-radius: 4px;
            font-size: 13px;
            font-weight: 500;
            margin-top: 12px;
            display: none;
        }

        .alert-success.show {
            display: block;
            animation: revealEffect 0.3s ease;
        }

        .links-section {
            margin-top: 32px;
        }

        .section-header {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .link-card {
            background: var(--acrylic-bg);
            backdrop-filter: blur(40px) saturate(150%);
            padding: 20px;
            border-radius: var(--radius);
            border: 1px solid var(--acrylic-border);
            box-shadow: var(--card-shadow);
            margin-bottom: 12px;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
        }

        .link-card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 3px;
            background: var(--accent-color);
            border-radius: 4px 0 0 4px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .link-card:hover {
            transform: translateX(4px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.12);
        }

        .link-card:hover::before {
            opacity: 1;
        }

        .link-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .link-code {
            font-size: 18px;
            font-weight: 700;
            color: var(--accent-color);
            font-family: 'Consolas', monospace;
        }

        .link-info {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 6px;
            line-height: 1.6;
        }

        .link-info strong {
            color: var(--text-primary);
            font-weight: 600;
        }

        .link-date {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 12px;
        }

        .fluent-btn-small {
            padding: 6px 14px;
            font-size: 12px;
        }

        .fluent-btn-danger {
            color: #d13438;
            border-color: rgba(209, 52, 56, 0.3);
        }

        .fluent-btn-danger:hover {
            background: rgba(209, 52, 56, 0.1);
            border-color: rgba(209, 52, 56, 0.5);
        }

        .empty-state {
            text-align: center;
            padding: 64px 32px;
            color: var(--text-secondary);
            font-size: 14px;
        }

        .empty-icon {
            font-size: 64px;
            margin-bottom: 16px;
            opacity: 0.3;
        }

        .redirect-panel {
            background: var(--acrylic-bg);
            backdrop-filter: blur(40px) saturate(150%);
            padding: 48px;
            border-radius: var(--radius);
            border: 1px solid var(--acrylic-border);
            box-shadow: var(--card-shadow);
            text-align: center;
        }

        .redirect-panel h3 {
            font-size: 24px;
            color: var(--text-primary);
            margin-bottom: 16px;
            font-weight: 600;
        }

        .redirect-panel p {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 12px;
        }

        .redirect-url {
            color: var(--accent-color);
            font-weight: 600;
            word-break: break-all;
        }

        @media (max-width: 768px) {
            .container {
                padding: 0;
            }

            .bento-container {
                grid-template-columns: 1fr;
            }

            .bento-large,
            .bento-medium,
            .bento-small,
            .bento-full {
                grid-column: span 1;
            }

            h1 {
                font-size: 24px;
            }

            .button-group {
                flex-direction: column;
            }

            .fluent-btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">
                <div class="logo-icon">🔗</div>
                <div>
                    <h1>Link Manager</h1>
                    <p class="subtitle">Minimal • Fast • Efficient</p>
                </div>
            </div>
        </div>

        <div id="mainInterface">
            <div class="nav-tabs">
                <button class="nav-tab active" onclick="switchTab('changer')">Link Changer</button>
                <button class="nav-tab" onclick="switchTab('shortener')">Link Shortener</button>
            </div>

            <!-- Link Changer Tab -->
            <div id="changer-tab" class="tab-content active">
                <div class="bento-container">
                    <div class="bento-card bento-large">
                        <label class="card-label">Original URL</label>
                        <input type="url" id="originalUrl" placeholder="https://example.com/your-long-url">
                    </div>

                    <div class="bento-card bento-medium">
                        <label class="card-label">Custom Parameter</label>
                        <input type="text" id="customParam" placeholder="utm_source=email">
                    </div>

                    <div class="bento-card bento-medium">
                        <label class="card-label">Redirect Delay (sec)</label>
                        <input type="text" id="redirectDelay" placeholder="0" value="0">
                    </div>
                </div>

                <div class="button-group">
                    <button class="fluent-btn fluent-btn-primary" onclick="generateShareableLink()">Generate Link</button>
                    <button class="fluent-btn" onclick="clearChangerForm()">Clear</button>
                </div>

                <div class="result-panel" id="resultPanel">
                    <span class="result-label">Shareable Link Generated</span>
                    <div class="result-text" id="resultUrl"></div>
                    <div class="button-group">
                        <button class="fluent-btn fluent-btn-primary" onclick="copyToClipboard('resultUrl', 'alert1')">Copy to Clipboard</button>
                        <button class="fluent-btn" onclick="openLink('resultUrl')">Open Link</button>
                    </div>
                    <div class="alert-success" id="alert1">✓ Link copied successfully</div>
                </div>
            </div>

            <!-- Link Shortener Tab -->
            <div id="shortener-tab" class="tab-content">
                <div class="bento-card bento-full">
                    <label class="card-label">URL to Shorten</label>
                    <input type="url" id="urlToShorten" placeholder="https://example.com/very/long/url/with/many/parameters">
                </div>

                <div class="button-group" style="margin-top: 16px;">
                    <button class="fluent-btn fluent-btn-primary" onclick="shortenUrl()">Shorten URL</button>
                    <button class="fluent-btn" onclick="clearShortenerForm()">Clear</button>
                </div>

                <div class="result-panel" id="shortenPanel">
                    <span class="result-label">Shortened Link Generated</span>
                    <div class="result-text" id="shortenedUrl"></div>
                    <div class="button-group">
                        <button class="fluent-btn fluent-btn-primary" onclick="copyToClipboard('shortenedUrl', 'alert2')">Copy to Clipboard</button>
                        <button class="fluent-btn" onclick="openLink('shortenedUrl')">Open Link</button>
                    </div>
                    <div class="alert-success" id="alert2">✓ Link copied successfully</div>
                </div>

                <div class="links-section">
                    <h2 class="section-header">📚 Saved Links</h2>
                    <div id="linksContainer">
                        <div class="empty-state">
                            <div class="empty-icon">🔗</div>
                            <div>No shortened links yet. Create your first one above.</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="redirect-panel" id="redirectPanel" style="display: none;">
            <h3>Redirecting</h3>
            <p>You will be redirected to:</p>
            <p class="redirect-url" id="redirectTarget"></p>
            <p id="countdown"></p>
        </div>
    </div>

    <script>
        const BASE62 = '0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ';

        function encodeBase62(num) {
            if (num === 0) return BASE62[0];
            let encoded = '';
            while (num > 0) {
                encoded = BASE62[num % 62] + encoded;
                num = Math.floor(num / 62);
            }
            return encoded;
        }

        function generateShortCode() {
            const savedLinks = JSON.parse(localStorage.getItem('shortLinks') || '[]');
            const nextId = savedLinks.length + 1;
            return encodeBase62(nextId + Date.now() % 10000);
        }

        function switchTab(tabName) {
            document.querySelectorAll('.nav-tab').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

            event.target.classList.add('active');
            document.getElementById(tabName + '-tab').classList.add('active');
        }

        window.addEventListener('DOMContentLoaded', function() {
            const urlParams = new URLSearchParams(window.location.search);
            const encodedUrl = urlParams.get('url');
            const shortCode = urlParams.get('s');
            const delay = urlParams.get('delay') || 0;
            const customParam = urlParams.get('param') || '';

            if (shortCode) {
                const savedLinks = JSON.parse(localStorage.getItem('shortLinks') || '[]');
                const linkData = savedLinks.find(link => link.code === shortCode);

                if (linkData) {
                    document.getElementById('mainInterface').style.display = 'none';
                    document.getElementById('redirectPanel').style.display = 'block';
                    document.getElementById('redirectTarget').textContent = linkData.url;

                    setTimeout(() => {
                        window.location.href = linkData.url;
                    }, 500);
                    return;
                } else {
                    alert('Short link not found');
                    window.location.href = window.location.href.split('?')[0];
                    return;
                }
            }

            if (encodedUrl) {
                let targetUrl = decodeURIComponent(encodedUrl);

                if (customParam) {
                    const separator = targetUrl.includes('?') ? '&' : '?';
                    targetUrl += separator + customParam;
                }

                document.getElementById('mainInterface').style.display = 'none';
                document.getElementById('redirectPanel').style.display = 'block';
                document.getElementById('redirectTarget').textContent = targetUrl;

                const delaySeconds = parseInt(delay);
                if (delaySeconds > 0) {
                    let countdown = delaySeconds;
                    const countdownElement = document.getElementById('countdown');
                    countdownElement.textContent = `Redirecting in ${countdown} seconds...`;

                    const timer = setInterval(function() {
                        countdown--;
                        if (countdown > 0) {
                            countdownElement.textContent = `Redirecting in ${countdown} seconds...`;
                        } else {
                            clearInterval(timer);
                            window.location.href = targetUrl;
                        }
                    }, 1000);
                } else {
                    window.location.href = targetUrl;
                }
            }

            displaySavedLinks();
        });

        function generateShareableLink() {
            const originalUrl = document.getElementById('originalUrl').value.trim();
            const customParam = document.getElementById('customParam').value.trim();
            const redirectDelay = document.getElementById('redirectDelay').value.trim() || '0';

            if (!originalUrl) {
                alert('Please enter a valid URL');
                return;
            }

            try {
                new URL(originalUrl);
            } catch (e) {
                alert('Please enter a valid URL (e.g., https://example.com)');
                return;
            }

            const baseUrl = window.location.href.split('?')[0];
            const encodedUrl = encodeURIComponent(originalUrl);
            let shareableLink = `${baseUrl}?url=${encodedUrl}`;

            if (customParam) {
                shareableLink += `&param=${encodeURIComponent(customParam)}`;
            }

            if (redirectDelay !== '0') {
                shareableLink += `&delay=${redirectDelay}`;
            }

            document.getElementById('resultUrl').textContent = shareableLink;
            document.getElementById('resultPanel').classList.add('show');
        }

        function shortenUrl() {
            const urlToShorten = document.getElementById('urlToShorten').value.trim();

            if (!urlToShorten) {
                alert('Please enter a URL to shorten');
                return;
            }

            try {
                new URL(urlToShorten);
            } catch (e) {
                alert('Please enter a valid URL (e.g., https://example.com)');
                return;
            }

            const shortCode = generateShortCode();
            const baseUrl = window.location.href.split('?')[0];
            const shortUrl = `${baseUrl}?s=${shortCode}`;

            const savedLinks = JSON.parse(localStorage.getItem('shortLinks') || '[]');
            savedLinks.push({
                code: shortCode,
                url: urlToShorten,
                shortUrl: shortUrl,
                date: new Date().toLocaleString()
            });
            localStorage.setItem('shortLinks', JSON.stringify(savedLinks));

            document.getElementById('shortenedUrl').textContent = shortUrl;
            document.getElementById('shortenPanel').classList.add('show');

            displaySavedLinks();
        }

        function displaySavedLinks() {
            const savedLinks = JSON.parse(localStorage.getItem('shortLinks') || '[]');
            const container = document.getElementById('linksContainer');

            if (savedLinks.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">🔗</div>
                        <div>No shortened links yet. Create your first one above.</div>
                    </div>
                `;
                return;
            }

            container.innerHTML = savedLinks.reverse().map(link => `
                <div class="link-card">
                    <div class="link-header">
                        <span class="link-code">${link.code}</span>
                    </div>
                    <div class="link-info"><strong>Short:</strong> ${link.shortUrl}</div>
                    <div class="link-info"><strong>Original:</strong> ${link.url}</div>
                    <div class="link-date">Created: ${link.date}</div>
                    <div class="button-group">
                        <button class="fluent-btn fluent-btn-small fluent-btn-primary" onclick="copyText('${link.shortUrl}')">Copy</button>
                        <button class="fluent-btn fluent-btn-small" onclick="window.open('${link.shortUrl}', '_blank')">Open</button>
                        <button class="fluent-btn fluent-btn-small fluent-btn-danger" onclick="deleteLink('${link.code}')">Delete</button>
                    </div>
                </div>
            `).join('');
        }

        function deleteLink(code) {
            if (!confirm('Delete this shortened link?')) return;

            let savedLinks = JSON.parse(localStorage.getItem('shortLinks') || '[]');
            savedLinks = savedLinks.filter(link => link.code !== code);
            localStorage.setItem('shortLinks', JSON.stringify(savedLinks));
            displaySavedLinks();
        }

        function copyToClipboard(elementId, alertId) {
            const text = document.getElementById(elementId).textContent;

            navigator.clipboard.writeText(text).then(function() {
                const alert = document.getElementById(alertId);
                alert.classList.add('show');
                setTimeout(function() {
                    alert.classList.remove('show');
                }, 2000);
            }).catch(function(err) {
                alert('Failed to copy: ' + err);
            });
        }

        function copyText(text) {
            navigator.clipboard.writeText(text).then(function() {
                alert('Link copied to clipboard!');
            }).catch(function(err) {
                alert('Failed to copy: ' + err);
            });
        }

        function openLink(elementId) {
            const url = document.getElementById(elementId).textContent;
            window.open(url, '_blank');
        }

        function clearChangerForm() {
            document.getElementById('originalUrl').value = '';
            document.getElementById('customParam').value = '';
            document.getElementById('redirectDelay').value = '0';
            document.getElementById('resultPanel').classList.remove('show');
        }

        function clearShortenerForm() {
            document.getElementById('urlToShorten').value = '';
            document.getElementById('shortenPanel').classList.remove('show');
        }
    </script>
</body>
</html>
