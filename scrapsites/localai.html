<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Local AI Search</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    
    <style>
        :root {
            --bg-color: #202124;
            --surface-color: #303134;
            --text-main: #e8eaed;
            --text-muted: #9aa0a6;
            --accent-color: #8ab4f8;
            --border-color: #5f6368;
            --font-family: 'Google Sans', Roboto, Arial, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #landing-page {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            transition: opacity 0.3s ease, visibility 0.3s;
            padding: 20px;
        }

        .logo-large {
            font-size: 3.5rem;
            font-weight: 500;
            margin-bottom: 30px;
            letter-spacing: -1px;
            text-align: center;
        }
        .logo-large span { color: var(--accent-color); }

        .search-container-landing {
            width: 100%;
            max-width: 700px;
            position: relative;
        }

        .google-pill {
            display: flex;
            align-items: center;
            background-color: var(--surface-color);
            border: 1px solid transparent;
            border-radius: 24px;
            padding: 10px 15px;
            box-shadow: 0 1px 6px rgba(32,33,36,0.28);
            transition: box-shadow 0.2s, background-color 0.2s;
        }

        .google-pill:hover, .google-pill:focus-within {
            background-color: var(--surface-color);
            box-shadow: 0 1px 12px rgba(32,33,36,0.5);
            border-color: var(--border-color);
        }

        .model-select-mini {
            border: none;
            background: transparent;
            color: var(--text-main);
            font-size: 0.95rem;
            margin-right: 15px;
            cursor: pointer;
            outline: none;
            font-weight: 500;
            max-width: 180px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .input-landing {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
            font-family: inherit;
            padding: 5px 0;
            min-width: 0;
        }

        .btn-send-landing {
            background-color: var(--accent-color);
            color: #202124;
            border: none;
            padding: 8px 16px;
            border-radius: 16px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            margin-left: 10px;
            white-space: nowrap;
        }
        .btn-send-landing:hover { background-color: #9ebcf9; }

        .landing-actions {
            margin-top: 30px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn-text {
            background-color: var(--surface-color);
            border: 1px solid transparent;
            color: var(--text-main);
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
            touch-action: manipulation;
        }
        .btn-text:hover { border-color: var(--border-color); }

        #app-interface {
            display: none;
            flex: 1;
            flex-direction: row;
            height: 100%;
            opacity: 0;
            transition: opacity 0.5s ease;
            position: relative;
        }

        .sidebar {
            width: 260px;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            padding: 20px;
            border-right: 1px solid #3c4043;
            z-index: 50;
            transition: transform 0.3s ease;
        }
        
        .new-chat-btn {
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 12px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            background: transparent;
            margin-bottom: 20px;
            touch-action: manipulation;
        }
        .new-chat-btn:hover { background-color: #303134; }

        .settings-area { margin-top: auto; }
        .setting-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            font-size: 0.9rem;
            color: var(--text-muted);
            cursor: pointer;
        }
        .setting-row:hover { color: var(--text-main); }

        .sidebar-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 45;
            display: none;
            backdrop-filter: blur(2px);
        }

        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            width: 100%;
        }

        .mobile-top-bar {
            display: none;
            padding: 15px;
            border-bottom: 1px solid #3c4043;
            align-items: center;
        }

        .hamburger {
            background: none;
            border: none;
            color: var(--text-main);
            font-size: 1.5rem;
            cursor: pointer;
            padding: 5px;
        }

        .chat-stream {
            flex: 1;
            overflow-y: auto;
            padding: 20px 0;
            scroll-behavior: smooth;
        }

        .message-row {
            display: flex;
            justify-content: center;
            padding: 20px 0;
        }
        .message-row:hover { background-color: rgba(255,255,255,0.02); }

        .message-bubble {
            width: 100%;
            max-width: 800px;
            padding: 0 20px;
            display: flex;
            gap: 20px;
        }

        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            flex-shrink: 0;
            background-size: cover;
        }

        .text-content {
            flex: 1;
            font-size: 1rem;
            line-height: 1.6;
            padding-top: 4px;
            word-wrap: break-word;
            color: var(--text-main);
        }

        /* Markdown Styles */
        .text-content h1 { 
            font-size: 1.8em; 
            border-bottom: 1px solid var(--border-color); 
            padding-bottom: 0.3em; 
            margin: 0.8em 0; 
            font-weight: 600; 
        }
        .text-content h2 { 
            font-size: 1.5em; 
            border-bottom: 1px solid var(--border-color); 
            padding-bottom: 0.3em; 
            margin: 0.8em 0; 
            font-weight: 600; 
        }
        .text-content h3 { 
            font-size: 1.25em; 
            margin: 0.8em 0; 
            font-weight: 600; 
        }
        .text-content p { 
            margin-bottom: 1em; 
        }
        .text-content code { 
            background-color: rgba(255,255,255,0.1); 
            padding: 0.2em 0.4em; 
            border-radius: 3px; 
            font-family: 'SF Mono', Monaco, monospace; 
            font-size: 0.9em;
            color: var(--accent-color);
        }
        .text-content pre { 
            background-color: #1e1e1e; 
            padding: 16px; 
            border-radius: 8px; 
            overflow-x: auto; 
            margin: 1em 0; 
            border: 1px solid var(--border-color);
            position: relative;
        }
        .text-content pre code { 
            background: none; 
            padding: 0; 
            font-size: 0.9em;
            color: var(--text-main);
        }
        .text-content blockquote { 
            border-left: 4px solid var(--accent-color); 
            padding-left: 16px; 
            margin: 1em 0; 
            color: var(--text-muted); 
            background-color: rgba(138, 180, 248, 0.1);
            padding: 12px 12px 12px 16px; 
            border-radius: 0 8px 8px 0;
        }
        .text-content ul, .text-content ol { 
            margin-bottom: 1em; 
            padding-left: 2em; 
        }
        .text-content li { 
            margin-bottom: 0.4em; 
        }
        .text-content table { 
            border-collapse: collapse; 
            width: 100%; 
            margin: 1em 0; 
            font-size: 0.9em;
            display: block;
            overflow-x: auto;
            border: 1px solid var(--border-color);
            border-radius: 8px;
        }
        .text-content th, .text-content td { 
            border: 1px solid var(--border-color); 
            padding: 8px 12px; 
            text-align: left; 
        }
        .text-content th { 
            background-color: var(--surface-color); 
            font-weight: 600;
            color: var(--accent-color);
        }
        .text-content tr:nth-child(even) {
            background-color: rgba(255,255,255,0.02);
        }
        .text-content img { 
            max-width: 100%; 
            height: auto; 
            border-radius: 8px; 
            margin: 1em 0;
        }
        .text-content a { 
            color: var(--accent-color); 
            text-decoration: none; 
            word-break: break-all;
        }
        .text-content a:hover { 
            text-decoration: underline; 
        }
        .text-content hr { 
            border: none; 
            border-top: 1px solid var(--border-color); 
            margin: 1.5em 0; 
        }
        
        /* Math Styles */
        .katex { 
            font-size: 1.1em; 
            color: var(--text-main);
        }
        .katex-display { 
            margin: 1.5em 0; 
            overflow-x: auto; 
            overflow-y: hidden;
            color: var(--text-main);
        }
        .katex-display .katex {
            white-space: normal;
        }
        
        .mermaid {
            background-color: var(--surface-color);
            padding: 16px;
            border-radius: 8px;
            margin: 1em 0;
            text-align: center;
            border: 1px solid var(--border-color);
        }

        .copy-code-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(255,255,255,0.1);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .text-content pre:hover .copy-code-btn {
            opacity: 1;
        }
        .copy-code-btn:hover {
            background: rgba(255,255,255,0.2);
            color: var(--text-main);
        }

        .bottom-bar-container {
            padding: 20px;
            background: linear-gradient(to top, var(--bg-color) 80%, transparent);
        }

        .bottom-input-wrapper {
            max-width: 800px;
            margin: 0 auto;
            position: relative;
        }

        .google-pill-app {
            display: flex;
            align-items: flex-end;
            background-color: var(--surface-color);
            border-radius: 24px;
            padding: 12px 15px;
            border: 1px solid transparent;
        }
        .google-pill-app:focus-within { border-color: var(--text-muted); }

        .chat-textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
            font-family: inherit;
            resize: none;
            max-height: 200px;
            min-height: 24px;
            padding: 4px 0;
        }

        .send-icon {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background-color: var(--accent-color);
            color: #202124;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            margin-left: 10px;
            opacity: 0.5;
            pointer-events: none;
            transition: opacity 0.2s;
            flex-shrink: 0;
        }
        .send-icon.active { opacity: 1; pointer-events: auto; }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 200;
            backdrop-filter: blur(2px);
        }
        .modal {
            background-color: var(--surface-color);
            padding: 25px;
            border-radius: 12px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            max-height: 90vh;
            overflow-y: auto;
        }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 0.9rem; color: var(--text-muted); }
        .form-control {
            width: 100%;
            padding: 10px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-main);
        }
        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #323232;
            color: white;
            padding: 12px 24px;
            border-radius: 4px;
            font-size: 0.9rem;
            z-index: 300;
            display: none;
            white-space: nowrap;
        }

        @media (max-width: 768px) {
            .sidebar {
                position: absolute;
                height: 100%;
                left: 0;
                transform: translateX(-100%);
                box-shadow: 5px 0 15px rgba(0,0,0,0.5);
            }
            .sidebar.open { transform: translateX(0); }
            
            .sidebar-overlay.active { display: block; }

            .mobile-top-bar { display: flex; }

            .logo-large { font-size: 2.5rem; margin-bottom: 20px; }
            
            .google-pill { flex-wrap: wrap; padding: 10px; gap: 5px; }
            .model-select-mini { 
                max-width: 100%; 
                margin-bottom: 5px; 
                margin-right: 0; 
                text-align: center; 
                border-bottom: 1px solid #444;
                padding-bottom: 5px;
                width: 100%;
            }
            .input-landing { width: 100%; text-align: center; margin-bottom: 5px; }

            .landing-actions { flex-direction: column; width: 100%; }
            .btn-text { width: 100%; }

            .message-bubble { max-width: 90%; padding: 0 15px; }
            .text-content { font-size: 0.95rem; }
            
            .bottom-bar-container { padding: 10px; }
            
            .text-content pre { padding: 12px; font-size: 0.85em; }
            .copy-code-btn { opacity: 1; }
        }

        @media (max-width: 480px) {
            .btn-send-landing { padding: 6px 12px; font-size: 0.8rem; }
            .logo-large { font-size: 2rem; }
            .google-pill-app { padding: 8px 10px; }
            .avatar { width: 28px; height: 28px; }
            
            .text-content h1 { font-size: 1.5em; }
            .text-content h2 { font-size: 1.3em; }
            .katex-display { font-size: 0.9em; }
        }
    </style>
</head>
<body>

    <div id="toast" class="toast">Notification</div>

    <div id="landing-page">
        <div class="logo-large">Local<span>AI</span></div>
        
        <div class="search-container-landing">
            <div class="google-pill">
                <select id="landingModelSelect" class="model-select-mini" onclick="if(this.value=='fetch') fetchModels()">
                    <option value="fetch">Loading Models...</option>
                </select>
                <input type="text" id="landingInput" class="input-landing" placeholder="Ask anything..." onkeydown="handleLandingEnter(event)">
                <button class="btn-send-landing" onclick="startChatFromLanding()">Send</button>
            </div>
        </div>

        <div class="landing-actions">
            <button class="btn-text" onclick="openSettings()">Server Settings</button>
            <button class="btn-text" onclick="fetchModels()">Refresh Models</button>
        </div>
    </div>

    <div id="app-interface">
        <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar(false)"></div>

        <div class="sidebar" id="sidebar">
            <button class="new-chat-btn" onclick="resetChat(); toggleSidebar(false);">
                <span>+</span> New Chat
            </button>
            
            <div class="settings-area">
                <div class="setting-row" onclick="openSettings(); toggleSidebar(false);">
                    <span id="sidebarModelName">Model: ?</span>
                    <span>⚙️</span>
                </div>
                <div style="font-size: 0.8rem; color: #666; margin-top:10px;">
                    Local AI Interface
                </div>
            </div>
        </div>

        <div class="chat-area">
            <div class="mobile-top-bar">
                <button class="hamburger" onclick="toggleSidebar(true)">☰</button>
            </div>

            <div class="chat-stream" id="chatStream"></div>

            <div class="bottom-bar-container">
                <div class="bottom-input-wrapper">
                    <div class="google-pill-app">
                        <textarea id="chatInput" class="chat-textarea" rows="1" placeholder="Message LocalAI..." oninput="resizeChatInput(this)" onkeydown="handleChatEnter(event)"></textarea>
                        <div id="chatSendBtn" class="send-icon">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="settingsModal">
        <div class="modal">
            <h3>Connection Settings</h3>
            <div class="form-group">
                <label>Provider</label>
                <select id="settingProvider" class="form-control" onchange="updateSettingsDefaults()">
                    <option value="ollama">Ollama (localhost:11434)</option>
                    <option value="lmstudio">LM Studio (localhost:1234)</option>
                    <option value="custom">Custom URL</option>
                </select>
            </div>
            <div class="form-group">
                <label>Base URL</label>
                <input type="text" id="settingUrl" class="form-control" placeholder="http://localhost:11434">
            </div>
            <div class="form-group" id="keyGroup" style="display:none;">
                <label>API Key (Optional)</label>
                <input type="password" id="settingKey" class="form-control" placeholder="sk-...">
            </div>
            <div class="form-group">
                <label>System Prompt</label>
                <textarea id="settingSysPrompt" class="form-control" rows="3">You are a helpful, efficient AI assistant running locally.</textarea>
            </div>
            <div class="modal-actions">
                <button class="btn-text" onclick="closeSettings()">Cancel</button>
                <button class="btn-text" style="background-color: var(--accent-color); color: #202124;" onclick="saveSettings()">Save & Refresh</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

    <script>
        const state = {
            config: {
                provider: 'ollama',
                baseUrl: 'http://localhost:11434',
                apiKey: '',
                modelsPath: '/v1/models',
                model: '',
                systemPrompt: 'You are a helpful, efficient AI assistant running locally.'
            },
            messages: [],
            controller: null
        };

        const els = {
            landingPage: document.getElementById('landing-page'),
            appInterface: document.getElementById('app-interface'),
            landingInput: document.getElementById('landingInput'),
            chatInput: document.getElementById('chatInput'),
            chatStream: document.getElementById('chatStream'),
            modelSelect: document.getElementById('landingModelSelect'),
            chatSendBtn: document.getElementById('chatSendBtn'),
            sidebarModel: document.getElementById('sidebarModelName'),
            sidebar: document.getElementById('sidebar'),
            sidebarOverlay: document.getElementById('sidebarOverlay'),
            settings: {
                modal: document.getElementById('settingsModal'),
                provider: document.getElementById('settingProvider'),
                url: document.getElementById('settingUrl'),
                key: document.getElementById('settingKey'),
                sysPrompt: document.getElementById('settingSysPrompt'),
                keyGroup: document.getElementById('keyGroup')
            }
        };

        // Unicode to LaTeX conversion map
        const unicodeToLatex = {
            '∫': '\\int',
            '∑': '\\sum',
            '∏': '\\prod',
            '√': '\\sqrt',
            '∞': '\\infty',
            'α': '\\alpha',
            'β': '\\beta',
            'γ': '\\gamma',
            'δ': '\\delta',
            'π': '\\pi',
            'θ': '\\theta',
            'λ': '\\lambda',
            'μ': '\\mu',
            'σ': '\\sigma',
            'φ': '\\phi',
            'ω': '\\omega',
            'Δ': '\\Delta',
            'Σ': '\\Sigma',
            'Ω': '\\Omega',
            '≠': '\\neq',
            '≤': '\\leq',
            '≥': '\\geq',
            '≈': '\\approx',
            '±': '\\pm',
            '÷': '\\div',
            '×': '\\times',
            '→': '\\rightarrow',
            '←': '\\leftarrow',
            '↔': '\\leftrightarrow',
            '⇒': '\\Rightarrow'
        };

        function preProcessMath(text) {
            // Convert Unicode symbols to LaTeX commands
            let processed = text;
            for (const [unicode, latex] of Object.entries(unicodeToLatex)) {
                processed = processed.split(unicode).join(latex);
            }
            
            // Fix common issues with evaluation bars
            // Convert |_a^b to proper LaTeX \Big|_{a}^{b} or |_{a}^{b}
            processed = processed.replace(/\|_{([^}]+)}\^{([^}]+)}/g, '\\Big|_{$1}^{$2}');
            processed = processed.replace(/\|_([a-zA-Z0-9]+)\^([a-zA-Z0-9]+)/g, '\\Big|_{$1}^{$2}');
            
            return processed;
        }

        mermaid.initialize({ 
            startOnLoad: false, 
            theme: 'dark',
            securityLevel: 'strict'
        });
        
        marked.setOptions({
            highlight: function(code, lang) {
                if (lang && hljs.getLanguage(lang)) {
                    return hljs.highlight(code, { language: lang }).value;
                }
                return hljs.highlightAuto(code).value;
            },
            breaks: true,
            gfm: true
        });

        window.onload = () => {
            loadConfig();
            fetchModels();
        };

        function loadConfig() {
            const saved = localStorage.getItem('localAiConfig');
            if (saved) {
                state.config = { ...state.config, ...JSON.parse(saved) };
            }
            updateSettingsUI();
        }

        function updateSettingsUI() {
            els.settings.provider.value = state.config.provider;
            els.settings.url.value = state.config.baseUrl;
            els.settings.key.value = state.config.apiKey;
            els.settings.sysPrompt.value = state.config.systemPrompt;
            updateSettingsDefaults();
        }

        function updateSettingsDefaults() {
            const p = els.settings.provider.value;
            if (p === 'ollama') {
                state.config.baseUrl = 'http://localhost:11434';
                state.config.modelsPath = '/v1/models';
                els.settings.keyGroup.style.display = 'none'; 
            } else if (p === 'lmstudio') {
                state.config.baseUrl = 'http://localhost:1234';
                state.config.modelsPath = '/api/v1/models';
                els.settings.keyGroup.style.display = 'none'; 
            } else if (p === 'custom') {
                els.settings.keyGroup.style.display = 'block';
            }
            if (p !== 'custom') {
                els.settings.url.value = state.config.baseUrl;
            }
        }

        function saveSettings() {
            state.config.provider = els.settings.provider.value;
            state.config.baseUrl = els.settings.url.value.replace(/\/$/, '');
            state.config.apiKey = els.settings.key.value;
            state.config.systemPrompt = els.settings.sysPrompt.value;
            
            updateSettingsDefaults(); 
            localStorage.setItem('localAiConfig', JSON.stringify(state.config));
            closeSettings();
            fetchModels();
            showToast('Settings Saved');
        }

        function switchToChat() {
            els.landingPage.style.opacity = '0';
            els.landingPage.style.visibility = 'hidden';
            els.appInterface.style.display = 'flex';
            setTimeout(() => els.appInterface.style.opacity = '1', 10);
            els.chatInput.focus();
        }

        function resetChat() {
            state.messages = [];
            els.chatStream.innerHTML = '';
            els.appInterface.style.opacity = '0';
            setTimeout(() => {
                els.appInterface.style.display = 'none';
                els.landingPage.style.visibility = 'visible';
                els.landingPage.style.opacity = '1';
                els.landingInput.value = '';
                els.landingInput.focus();
            }, 500);
        }

        function toggleSidebar(show) {
            if (show) {
                els.sidebar.classList.add('open');
                els.sidebarOverlay.classList.add('active');
            } else {
                els.sidebar.classList.remove('open');
                els.sidebarOverlay.classList.remove('active');
            }
        }

        async function fetchModels() {
            const base = state.config.baseUrl;
            const path = state.config.modelsPath;
            const url = `${base}${path}`;
            
            els.modelSelect.innerHTML = '<option value="fetch">Fetching...</option>';
            
            const headers = { 'Content-Type': 'application/json' };
            if(state.config.apiKey) headers['Authorization'] = `Bearer ${state.config.apiKey}`;

            try {
                const res = await fetch(url, { headers });
                if (!res.ok) throw new Error(`Connection Failed: ${res.status}`);
                
                const data = await res.json();
                els.modelSelect.innerHTML = '';

                if (state.config.provider === 'lmstudio' && Array.isArray(data.models)) {
                    data.models.forEach(m => {
                        const id = m.key || m.id;
                        const name = m.display_name || m.key;
                        const loaded = m.loaded_instances && m.loaded_instances.length > 0;
                        const label = loaded ? `● ${name}` : name;
                        addModelOption(id, label, loaded);
                    });
                } else if (data.object === 'list' && Array.isArray(data.data)) {
                    data.data.forEach(m => addModelOption(m.id, m.id));
                }

                if (state.config.model) {
                    els.modelSelect.value = state.config.model;
                } else if (els.modelSelect.options.length > 0) {
                    els.modelSelect.selectedIndex = 0;
                    state.config.model = els.modelSelect.value;
                }
                
                updateSidebarModel();

            } catch (e) {
                els.modelSelect.innerHTML = '<option value="fetch">Error: Check Settings</option>';
                showToast(e.message);
            }
        }

        function addModelOption(val, text, isLoaded) {
            const opt = document.createElement('option');
            opt.value = val;
            opt.textContent = text;
            if (isLoaded) opt.style.color = 'var(--accent-color)';
            els.modelSelect.appendChild(opt);
        }

        els.modelSelect.addEventListener('change', (e) => {
            state.config.model = e.target.value;
            updateSidebarModel();
        });

        function updateSidebarModel() {
            els.sidebarModel.textContent = `Model: ${state.config.model || 'None'}`;
        }

        function handleLandingEnter(e) {
            if (e.key === 'Enter') startChatFromLanding();
        }

        function startChatFromLanding() {
            const text = els.landingInput.value.trim();
            if (!state.config.model) {
                showToast('Please select a model first');
                return;
            }
            if (text) {
                switchToChat();
                sendMessage(text);
            }
        }

        function resizeChatInput(el) {
            el.style.height = 'auto';
            el.style.height = (el.scrollHeight) + 'px';
            if(el.value.trim()) els.chatSendBtn.classList.add('active');
            else els.chatSendBtn.classList.remove('active');
        }

        function handleChatEnter(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                const text = els.chatInput.value.trim();
                if (text) sendMessage(text);
            }
        }

        els.chatSendBtn.addEventListener('click', () => {
            const text = els.chatInput.value.trim();
            if (text) sendMessage(text);
        });

        // Better math renderer with error recovery
        function renderMathInElement(element) {
            if (!element) return;
            
            // Helper to safely render a math expression
            function safeRender(tex, displayMode) {
                try {
                    tex = preProcessMath(tex);
                    return katex.renderToString(tex, {
                        displayMode: displayMode,
                        throwOnError: false,
                        strict: false
                    });
                } catch(e) {
                    console.warn('Math render error:', e);
                    return displayMode ? `\$\$${tex}\$\$` : `\$${tex}\$`;
                }
            }

            let html = element.innerHTML;
            
            // Protect code blocks
            const codeBlocks = [];
            html = html.replace(/<pre[\s\S]*?<\/pre>/g, match => {
                codeBlocks.push(match);
                return `###CODEBLOCK${codeBlocks.length-1}###`;
            });

            // Handle display math ($$...$$)
            html = html.replace(/\$\$([\s\S]*?)\$\$/g, (match, tex) => {
                return safeRender(tex.trim(), true);
            });

            // Handle inline math ($...$) but not $$
            html = html.replace(/\$([^\$]+?)\$/g, (match, tex) => {
                // Skip if it looks like a currency or time
                if (/^\d+\.\d{2}$/.test(tex.trim())) return match; // Price like $10.00
                if (/^\d+:\d{2}$/.test(tex.trim())) return match; // Time like $10:30
                return safeRender(tex.trim(), false);
            });

            // Restore code blocks
            codeBlocks.forEach((block, i) => {
                html = html.replace(`###CODEBLOCK${i}###`, block);
            });

            element.innerHTML = html;
        }

        function appendMessage(role, text) {
            const row = document.createElement('div');
            row.className = 'message-row';
            const seed = role === 'user' ? 'u' : 'a';
            
            row.innerHTML = `
                <div class="message-bubble">
                    <div class="avatar" style="background-image: url('https://picsum.photos/seed/${seed}/40/40')"></div>
                    <div class="text-content"></div>
                </div>
            `;
            
            const contentDiv = row.querySelector('.text-content');
            els.chatStream.appendChild(row);
            
            if (role === 'ai') {
                renderMarkdown(contentDiv, text);
            } else {
                contentDiv.textContent = text;
            }
            
            els.chatStream.scrollTop = els.chatStream.scrollHeight;
            return contentDiv;
        }

        function renderMarkdown(element, markdownText) {
            const html = marked.parse(markdownText);
            element.innerHTML = html;
            
            element.querySelectorAll('pre').forEach(pre => {
                const btn = document.createElement('button');
                btn.className = 'copy-code-btn';
                btn.textContent = 'Copy';
                btn.onclick = () => {
                    const code = pre.querySelector('code')?.textContent || pre.textContent;
                    navigator.clipboard.writeText(code);
                    btn.textContent = 'Copied!';
                    setTimeout(() => btn.textContent = 'Copy', 2000);
                };
                pre.appendChild(btn);
            });
            
            renderMathInElement(element);
            mermaid.init(undefined, element.querySelectorAll('.language-mermaid'));
        }

        async function sendMessage(text) {
            els.chatInput.value = '';
            els.chatInput.style.height = 'auto';
            els.chatSendBtn.classList.remove('active');

            state.messages.push({ role: 'user', content: text });
            appendMessage('user', text);

            const aiDiv = appendMessage('ai', 'Thinking...');
            let fullResponse = "";
            let lastRender = 0;

            const payload = {
                model: state.config.model,
                messages: [
                    { role: 'system', content: state.config.systemPrompt },
                    ...state.messages
                ],
                stream: true
            };

            const endpoint = `${state.config.baseUrl}/v1/chat/completions`;
            state.controller = new AbortController();

            try {
                const res = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': state.config.apiKey ? `Bearer ${state.config.apiKey}` : undefined
                    },
                    body: JSON.stringify(payload),
                    signal: state.controller.signal
                });

                if (!res.ok) throw new Error(`Server Error: ${res.status}`);

                const reader = res.body.getReader();
                const decoder = new TextDecoder();
                let isFirstChunk = true;
                let buffer = "";

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    
                    const chunk = decoder.decode(value);
                    const lines = chunk.split('\n');
                    
                    for (const line of lines) {
                        if (line.startsWith('data: ') && line !== 'data: [DONE]') {
                            try {
                                const json = JSON.parse(line.slice(6));
                                const content = json.choices[0]?.delta?.content || "";
                                fullResponse += content;
                                buffer += content;
                                
                                if (isFirstChunk) {
                                    aiDiv.textContent = '';
                                    isFirstChunk = false;
                                }
                                
                                // Render every 100ms or on complete sentences
                                const now = Date.now();
                                if (now - lastRender > 100 || /[.!?\n]$/.test(content)) {
                                    renderMarkdown(aiDiv, fullResponse);
                                    lastRender = now;
                                    buffer = "";
                                }
                                
                                els.chatStream.scrollTop = els.chatStream.scrollHeight;
                            } catch(e){}
                        }
                    }
                }
                state.messages.push({ role: 'assistant', content: fullResponse });
                renderMarkdown(aiDiv, fullResponse);
                
            } catch (err) {
                aiDiv.innerHTML = `<span style="color:#ff6b6b">Error: ${err.message}</span>`;
            }
        }

        function openSettings() { els.settings.modal.style.display = 'flex'; }
        function closeSettings() { els.settings.modal.style.display = 'none'; }
        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 3000);
        }
    </script>
</body>
