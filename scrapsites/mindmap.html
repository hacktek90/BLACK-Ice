<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Modern Mind Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <style>
    :root {
      --primary: #4f46e5;
      --primary-soft: rgba(79, 70, 229, 0.12);
      --primary-strong: #3730a3;
      --accent: #ec4899;
      --bg: #f4f5fb;
      --surface: #ffffff;
      --text: #0f172a;
      --text-subtle: #64748b;
      --border: #e2e8f0;
      --radius-lg: 18px;
      --radius-md: 12px;
      --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.07);
      --shadow-md: 0 8px 22px rgba(15, 23, 42, 0.14);
      --shadow-soft: 0 12px 40px rgba(79, 70, 229, 0.18);
      --safe-bottom: env(safe-area-inset-bottom, 16px);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif;
      background: radial-gradient(circle at top, #e0e7ff 0, #f9fafb 45%, #eef2ff 100%);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
      touch-action: none;
    }

    .top-bar {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(16px);
      box-shadow: var(--shadow-sm);
      z-index: 50;
    }

    .top-bar-title {
      font-weight: 600;
      font-size: 14px;
      letter-spacing: 0.02em;
      padding-right: 10px;
      border-right: 1px solid rgba(148, 163, 184, 0.4);
    }

    .chip {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 999px;
      background: #eef2ff;
      color: #4f46e5;
      font-weight: 500;
    }

    .icon-btn {
      border: none;
      background: transparent;
      width: 28px;
      height: 28px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      color: var(--text-subtle);
      cursor: pointer;
    }

    .icon-btn:hover {
      background: rgba(148, 163, 184, 0.16);
      color: var(--text);
    }

    #canvas-container {
      position: absolute;
      inset: 0;
      overflow: hidden;
      cursor: grab;
      touch-action: none;
    }

    #canvas-container.grabbing {
      cursor: grabbing;
    }

    #canvas {
      position: absolute;
      width: 5000px;
      height: 5000px;
      transform-origin: 0 0;
      will-change: transform;
    }

    #svg-layer,
    #nodes-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    #svg-layer {
      pointer-events: none;
    }

    .node {
      position: absolute;
      min-width: 130px;
      max-width: 280px;
      padding: 12px 18px;
      background: var(--surface);
      border-radius: 999px;
      border: 1.5px solid #e5e7eb;
      box-shadow: var(--shadow-sm);
      cursor: pointer;
      user-select: none;
      transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease, background 0.15s ease;
      font-size: 14px;
      text-align: center;
    }

    .node:hover {
      box-shadow: var(--shadow-md);
      border-color: #cbd5f5;
      transform: translateY(-1px);
    }

    .node.selected {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.14), var(--shadow-md);
      background: #ffffff;
    }

    .node.root {
      background: linear-gradient(135deg, #4f46e5, #6366f1);
      color: #ffffff;
      font-weight: 600;
      font-size: 15px;
      padding: 14px 24px;
      border-color: transparent;
      box-shadow: var(--shadow-soft);
    }

    .node-content {
      outline: none;
      min-height: 1em;
      line-height: 1.4;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .node.root .node-content {
      color: #ffffff;
    }

    .node-actions {
      position: absolute;
      top: -40px;
      left: 50%;
      transform: translateX(-50%) scale(0.95);
      background: #020617;
      color: #e5e7eb;
      border-radius: 999px;
      padding: 4px 6px;
      display: flex;
      gap: 4px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.18s ease, transform 0.18s ease;
      box-shadow: var(--shadow-md);
      z-index: 20;
    }

    .node.selected .node-actions {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(-50%) scale(1);
    }

    .node-btn {
      border: none;
      background: transparent;
      color: inherit;
      width: 26px;
      height: 26px;
      border-radius: 999px;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .node-btn:hover {
      background: rgba(148, 163, 184, 0.25);
    }

    .connection {
      stroke: #cbd5e1;
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
    }

    .connection.root-connection {
      stroke: rgba(79, 70, 229, 0.9);
      stroke-width: 2.8;
    }

    .connection.selected {
      stroke: var(--accent);
      stroke-width: 3;
    }

    .bottom-bar {
      position: absolute;
      left: 50%;
      bottom: 16px;
      transform: translateX(-50%);
      padding: 8px 10px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.92);
      color: #e5e7eb;
      box-shadow: var(--shadow-md);
      display: flex;
      gap: 6px;
      z-index: 60;
      align-items: center;
      max-width: 95%;
      overflow-x: auto;
      padding-bottom: calc(8px + var(--safe-bottom));
    }

    .action-pill {
      border: none;
      background: transparent;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 8px 10px;
      min-width: 58px;
      border-radius: 999px;
      cursor: pointer;
      color: #e5e7eb;
      font-size: 11px;
    }

    .action-pill-icon {
      width: 26px;
      height: 26px;
      border-radius: 999px;
      background: rgba(148, 163, 184, 0.16);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
    }

    .action-pill.primary .action-pill-icon {
      background: rgba(79, 70, 229, 0.28);
      color: #e0e7ff;
    }

    .action-pill:active {
      background: rgba(15, 23, 42, 0.85);
      transform: translateY(1px);
    }

    .minimap {
      position: absolute;
      right: 16px;
      bottom: 100px;
      width: 160px;
      height: 100px;
      border-radius: 14px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(16px);
      box-shadow: var(--shadow-md);
      overflow: hidden;
      padding: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 40;
    }

    .minimap canvas {
      width: 100%;
      height: 100%;
      border-radius: 10px;
      background: #020617;
    }

    @media (max-width: 640px) {
      .minimap {
        display: none;
      }
    }

    .zoom-controls {
      position: absolute;
      right: 16px;
      bottom: 16px;
      padding: 6px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.9);
      color: #e5e7eb;
      display: flex;
      gap: 4px;
      align-items: center;
      z-index: 45;
    }

    .zoom-btn {
      border: none;
      background: transparent;
      width: 28px;
      height: 28px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: inherit;
      cursor: pointer;
      font-size: 16px;
    }

    .zoom-btn:hover {
      background: rgba(148, 163, 184, 0.25);
    }

    .zoom-level {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.8);
    }

    @media (max-width: 640px) {
      .zoom-controls {
        display: none;
      }
    }

    .sheet-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.45);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      z-index: 80;
    }

    .sheet-overlay.show {
      opacity: 1;
      pointer-events: auto;
    }

    .sheet {
      position: fixed;
      left: 0;
      bottom: 0;
      width: 100%;
      background: #0f172a;
      color: #e5e7eb;
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      padding: 14px 18px calc(14px + var(--safe-bottom));
      transform: translateY(100%);
      transition: transform 0.25s cubic-bezier(0.19, 1, 0.22, 1);
      z-index: 90;
      box-shadow: 0 -18px 40px rgba(15, 23, 42, 0.8);
    }

    .sheet.show {
      transform: translateY(0);
    }

    .sheet-handle {
      width: 40px;
      height: 4px;
      border-radius: 999px;
      margin: 0 auto 14px;
      background: rgba(148, 163, 184, 0.65);
    }

    .sheet-title {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 10px;
    }

    .sheet-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      font-size: 11px;
    }

    .sheet-item {
      border: none;
      background: transparent;
      color: inherit;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    .sheet-icon {
      width: 40px;
      height: 40px;
      border-radius: 16px;
      background: rgba(15, 23, 42, 0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .sheet-item:active .sheet-icon {
      background: rgba(148, 163, 184, 0.4);
    }

    .toast {
      position: fixed;
      top: 14px;
      right: 14px;
      padding: 8px 12px;
      border-radius: 999px;
      background: #020617;
      color: #e5e7eb;
      font-size: 11px;
      opacity: 0;
      pointer-events: none;
      transform: translateY(-10px);
      transition: opacity 0.2s ease, transform 0.2s ease;
      z-index: 100;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <div class="top-bar-title">MindMap</div>
    <span class="chip">Live canvas</span>
    <button class="icon-btn" id="fitBtn" title="Fit to view">🎯</button>
    <button class="icon-btn" id="exportBtn" title="Export JSON">💾</button>
    <button class="icon-btn" id="importBtn" title="Import JSON">📂</button>
  </div>

  <div id="canvas-container">
    <div id="canvas">
      <svg id="svg-layer"></svg>
      <div id="nodes-layer"></div>
    </div>
  </div>

  <div class="bottom-bar">
    <button class="action-pill primary" id="addChildBtn">
      <div class="action-pill-icon">＋</div>
      <span>Child</span>
    </button>
    <button class="action-pill" id="addSiblingBtn">
      <div class="action-pill-icon">⊕</div>
      <span>Sibling</span>
    </button>
    <button class="action-pill" id="undoBtn">
      <div class="action-pill-icon">↺</div>
      <span>Undo</span>
    </button>
    <button class="action-pill" id="redoBtn">
      <div class="action-pill-icon">↻</div>
      <span>Redo</span>
    </button>
    <button class="action-pill" id="moreBtn">
      <div class="action-pill-icon">⋯</div>
      <span>More</span>
    </button>
  </div>

  <div class="zoom-controls">
    <button class="zoom-btn" id="zoomOutBtn">−</button>
    <div class="zoom-level" id="zoomLevel">100%</div>
    <button class="zoom-btn" id="zoomInBtn">＋</button>
  </div>

  <div class="minimap">
    <canvas id="minimapCanvas" width="160" height="100"></canvas>
  </div>

  <div class="sheet-overlay" id="sheetOverlay"></div>
  <div class="sheet" id="bottomSheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title">Node & map actions</div>
    <div class="sheet-grid">
      <button class="sheet-item" data-action="color" data-color="#fee2e2">
        <div class="sheet-icon" style="color:#ef4444">●</div>
        <span>Red</span>
      </button>
      <button class="sheet-item" data-action="color" data-color="#dcfce7">
        <div class="sheet-icon" style="color:#22c55e">●</div>
        <span>Green</span>
      </button>
      <button class="sheet-item" data-action="color" data-color="#dbeafe">
        <div class="sheet-icon" style="color:#3b82f6">●</div>
        <span>Blue</span>
      </button>
      <button class="sheet-item" data-action="color" data-color="#fef9c3">
        <div class="sheet-icon" style="color:#eab308">●</div>
        <span>Yellow</span>
      </button>
      <button class="sheet-item" data-action="collapse">
        <div class="sheet-icon">📁</div>
        <span>Collapse</span>
      </button>
      <button class="sheet-item" data-action="expand">
        <div class="sheet-icon">📂</div>
        <span>Expand all</span>
      </button>
      <button class="sheet-item" data-action="delete">
        <div class="sheet-icon">🗑️</div>
        <span>Delete</span>
      </button>
      <button class="sheet-item" data-action="import">
        <div class="sheet-icon">📂</div>
        <span>Import</span>
      </button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <input type="file" id="fileInput" accept=".json" style="display:none" />

  <script>
    const state = {
      nodes: [],
      nextId: 1,
      selectedId: null,
      collapsed: new Set(),
      zoom: 1,
      panX: 0,
      panY: 0,
      isDraggingNode: false,
      dragNodeId: null,
      dragOffsetX: 0,
      dragOffsetY: 0,
      isPanning: false,
      panLastX: 0,
      panLastY: 0,
      pinchLastDist: 0,
      history: [],
      historyIndex: -1
    };

    const canvasContainer = document.getElementById('canvas-container');
    const canvas = document.getElementById('canvas');
    const svgLayer = document.getElementById('svg-layer');
    const nodesLayer = document.getElementById('nodes-layer');
    const zoomLevelEl = document.getElementById('zoomLevel');
    const minimapCanvas = document.getElementById('minimapCanvas');
    const toastEl = document.getElementById('toast');
    const sheetOverlay = document.getElementById('sheetOverlay');
    const bottomSheet = document.getElementById('bottomSheet');
    const fileInput = document.getElementById('fileInput');

    function showToast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add('show');
      setTimeout(() => toastEl.classList.remove('show'), 1800);
    }

    function snapshot() {
      const snap = JSON.stringify({
        nodes: state.nodes,
        nextId: state.nextId,
        collapsed: Array.from(state.collapsed)
      });
      state.history = state.history.slice(0, state.historyIndex + 1);
      state.history.push(snap);
      state.historyIndex = state.history.length - 1;
    }

    function restoreFromSnapshot(index) {
      if (index < 0 || index >= state.history.length) return;
      const data = JSON.parse(state.history[index]);
      state.nodes = data.nodes;
      state.nextId = data.nextId;
      state.collapsed = new Set(data.collapsed);
      state.historyIndex = index;
      state.selectedId = null;
      render();
    }

    function undo() {
      if (state.historyIndex > 0) {
        restoreFromSnapshot(state.historyIndex - 1);
        showToast('Undo');
      }
    }

    function redo() {
      if (state.historyIndex < state.history.length - 1) {
        restoreFromSnapshot(state.historyIndex + 1);
        showToast('Redo');
      }
    }

    const getNode = (id) => state.nodes.find(n => n.id === id);
    const getChildren = (parentId) => state.nodes.filter(n => n.parentId === parentId);

    function isNodeVisible(node) {
      let current = node;
      while (current && current.parentId) {
        if (state.collapsed.has(current.parentId)) return false;
        current = getNode(current.parentId);
      }
      return true;
    }

    function createNode({ label, x, y, parentId = null, isRoot = false, color = '#ffffff' }) {
      const node = {
        id: state.nextId++,
        label: label || 'New idea',
        x,
        y,
        parentId,
        isRoot,
        color
      };
      state.nodes.push(node);
      snapshot();
      return node.id;
    }

    function deleteSubtree(id) {
      const toDelete = new Set();
      (function dfs(nodeId) {
        toDelete.add(nodeId);
        getChildren(nodeId).forEach(c => dfs(c.id));
      })(id);
      state.nodes = state.nodes.filter(n => !toDelete.has(n.id));
      state.collapsed = new Set([...state.collapsed].filter(cid => !toDelete.has(cid)));
      if (toDelete.has(state.selectedId)) state.selectedId = null;
      snapshot();
      render();
    }

    function toggleCollapse(id) {
      if (state.collapsed.has(id)) state.collapsed.delete(id);
      else state.collapsed.add(id);
      snapshot();
      render();
    }

    function applyTransform() {
      canvas.style.transform = `translate(${state.panX}px, ${state.panY}px) scale(${state.zoom})`;
      zoomLevelEl.textContent = Math.round(state.zoom * 100) + '%';
      drawMinimap();
    }

    function render() {
      nodesLayer.innerHTML = '';
      svgLayer.innerHTML = '';

      state.nodes.forEach(child => {
        if (!child.parentId) return;
        const parent = getNode(child.parentId);
        if (!parent) return;
        if (!isNodeVisible(child) || !isNodeVisible(parent)) return;

        const x1 = parent.x + 65;
        const y1 = parent.y + 22;
        const x2 = child.x + 65;
        const y2 = child.y + 22;

        const midX = (x1 + x2) / 2;
        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('d', `M ${x1} ${y1} C ${midX} ${y1}, ${midX} ${y2}, ${x2} ${y2}`);
        path.setAttribute(
          'class',
          'connection' +
            (parent.isRoot ? ' root-connection' : '') +
            ((child.id === state.selectedId || parent.id === state.selectedId) ? ' selected' : '')
        );
        svgLayer.appendChild(path);
      });

      state.nodes.forEach(node => {
        if (!isNodeVisible(node)) return;
        const el = document.createElement('div');
        el.className = 'node' + (node.isRoot ? ' root' : '') + (node.id === state.selectedId ? ' selected' : '');
        el.style.left = node.x + 'px';
        el.style.top = node.y + 'px';
        if (!node.isRoot && node.color && node.color !== '#ffffff') {
          el.style.background = node.color;
        }

        const actions = document.createElement('div');
        actions.className = 'node-actions';

        const addBtn = document.createElement('button');
        addBtn.className = 'node-btn';
        addBtn.textContent = '+';
        addBtn.title = 'Add child';
        addBtn.dataset.action = 'add-child';
        addBtn.dataset.id = node.id;

        const delBtn = document.createElement('button');
        delBtn.className = 'node-btn';
        delBtn.textContent = '🗑';
        delBtn.title = 'Delete subtree';
        delBtn.dataset.action = 'delete-node';
        delBtn.dataset.id = node.id;

        actions.appendChild(addBtn);
        if (!node.isRoot) actions.appendChild(delBtn);
        el.appendChild(actions);

        const content = document.createElement('div');
        content.className = 'node-content';
        content.contentEditable = true;
        content.textContent = node.label;
        content.addEventListener('focus', () => {
          state.isDraggingNode = false;
        });
        content.addEventListener('input', (e) => {
          node.label = e.target.textContent.trim() || 'Untitled';
        });
        content.addEventListener('blur', () => {
          snapshot();
        });
        content.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            addSibling(node.id);
          } else if (e.key === 'Tab') {
            e.preventDefault();
            addChild(node.id);
          }
        });

        el.appendChild(content);

        el.addEventListener('mousedown', (e) => {
          if (e.target === content || e.target.closest('.node-btn')) return;
          e.preventDefault();
          selectNode(node.id);
          startNodeDrag(node.id, e.clientX, e.clientY);
        });

        el.addEventListener('touchstart', (e) => {
          if (e.target === content || e.target.closest('.node-btn')) return;
          const t = e.touches[0];
          selectNode(node.id);
          startNodeDrag(node.id, t.clientX, t.clientY);
        }, { passive: false });

        nodesLayer.appendChild(el);
      });

      drawMinimap();
    }

    function drawMinimap() {
      const ctx = minimapCanvas.getContext('2d');
      const width = minimapCanvas.width;
      const height = minimapCanvas.height;
      ctx.clearRect(0, 0, width, height);
      ctx.fillStyle = '#020617';
      ctx.fillRect(0, 0, width, height);

      if (!state.nodes.length) return;
      const scale = 0.03;

      state.nodes.forEach(node => {
        if (!isNodeVisible(node)) return;
        ctx.fillStyle = node.isRoot ? '#4f46e5' : '#9ca3af';
        const x = node.x * scale;
        const y = node.y * scale;
        ctx.fillRect(x, y, 3, 3);
      });

      ctx.strokeStyle = '#a855f7';
      ctx.lineWidth = 1;
      const vx = (-state.panX / state.zoom) * scale;
      const vy = (-state.panY / state.zoom) * scale;
      const vw = (canvasContainer.clientWidth / state.zoom) * scale;
      const vh = (canvasContainer.clientHeight / state.zoom) * scale;
      ctx.strokeRect(vx, vy, vw, vh);
    }

    function selectNode(id) {
      state.selectedId = id;
      render();
    }

    function addChild(parentId) {
      const parent = getNode(parentId);
      if (!parent) return;
      const siblings = getChildren(parentId);
      const angleStep = 40;
      const baseAngle = parent.isRoot ? (siblings.length * angleStep - (siblings.length * angleStep) / 2) : siblings.length * angleStep;
      const angleRad = (baseAngle * Math.PI) / 180;
      const dist = 220;
      const x = parent.x + Math.cos(angleRad) * dist;
      const y = parent.y + Math.sin(angleRad) * dist;
      const id = createNode({ label: 'New idea', x, y, parentId: parent.id });
      state.selectedId = id;
      render();
    }

    function addSibling(nodeId) {
      const node = getNode(nodeId);
      if (!node || node.isRoot || !node.parentId) return;
      const siblings = getChildren(node.parentId);
      const offset = siblings.length * 18;
      const id = createNode({
        label: 'New idea',
        x: node.x + 20,
        y: node.y + 70 + offset,
        parentId: node.parentId
      });
      state.selectedId = id;
      render();
    }

    function startNodeDrag(id, clientX, clientY) {
      state.isDraggingNode = true;
      state.dragNodeId = id;
      const node = getNode(id);
      state.dragOffsetX = (clientX - state.panX) / state.zoom - node.x;
      state.dragOffsetY = (clientY - state.panY) / state.zoom - node.y;
    }

    function handlePointerMove(clientX, clientY) {
      if (state.isDraggingNode && state.dragNodeId != null) {
        const node = getNode(state.dragNodeId);
        if (!node) return;
        node.x = (clientX - state.panX) / state.zoom - state.dragOffsetX;
        node.y = (clientY - state.panY) / state.zoom - state.dragOffsetY;
        render();
        return;
      }
      if (state.isPanning) {
        const dx = clientX - state.panLastX;
        const dy = clientY - state.panLastY;
        state.panX += dx;
        state.panY += dy;
        state.panLastX = clientX;
        state.panLastY = clientY;
        applyTransform();
      }
    }

    canvasContainer.addEventListener('mousedown', (e) => {
      if (e.button !== 0) return;
      if (e.target !== canvasContainer && e.target !== svgLayer) return;
      state.isPanning = true;
      state.isDraggingNode = false;
      state.panLastX = e.clientX;
      state.panLastY = e.clientY;
      canvasContainer.classList.add('grabbing');
      state.selectedId = null;
      render();
    });

    canvasContainer.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) {
        const t = e.touches[0];
        state.isPanning = true;
        state.panLastX = t.clientX;
        state.panLastY = t.clientY;
        canvasContainer.classList.add('grabbing');
      } else if (e.touches.length === 2) {
        const [t1, t2] = e.touches;
        state.pinchLastDist = Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
      }
    }, { passive: false });

    window.addEventListener('mousemove', (e) => {
      handlePointerMove(e.clientX, e.clientY);
    });

    window.addEventListener('touchmove', (e) => {
      if (e.touches.length === 2) {
        e.preventDefault();
        const [t1, t2] = e.touches;
        const dist = Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
        if (state.pinchLastDist) {
          const delta = dist - state.pinchLastDist;
          const zoomDelta = delta * 0.002;
          applyZoom(zoomDelta, (t1.clientX + t2.clientX) / 2, (t1.clientY + t2.clientY) / 2);
        }
        state.pinchLastDist = dist;
        return;
      }
      const t = e.touches[0];
      handlePointerMove(t.clientX, t.clientY);
    }, { passive: false });

    window.addEventListener('mouseup', () => {
      if (state.isDraggingNode) snapshot();
      state.isDraggingNode = false;
      state.dragNodeId = null;
      state.isPanning = false;
      state.pinchLastDist = 0;
      canvasContainer.classList.remove('grabbing');
    });

    window.addEventListener('touchend', () => {
      if (state.isDraggingNode) snapshot();
      state.isDraggingNode = false;
      state.dragNodeId = null;
      state.isPanning = false;
      state.pinchLastDist = 0;
      canvasContainer.classList.remove('grabbing');
    });

    function applyZoom(delta, centerX, centerY) {
      const oldZoom = state.zoom;
      let newZoom = oldZoom + delta;
      newZoom = Math.min(3, Math.max(0.2, newZoom));
      const scale = newZoom / oldZoom;
      const rect = canvasContainer.getBoundingClientRect();
      const cx = centerX ?? rect.width / 2;
      const cy = centerY ?? rect.height / 2;
      state.panX = cx - (cx - state.panX) * scale;
      state.panY = cy - (cy - state.panY) * scale;
      state.zoom = newZoom;
      applyTransform();
    }

    canvasContainer.addEventListener('wheel', (e) => {
      e.preventDefault();
      const delta = e.deltaY > 0 ? -0.08 : 0.08;
      applyZoom(delta, e.clientX, e.clientY);
    }, { passive: false });

    document.getElementById('zoomInBtn').onclick = () => applyZoom(0.12);
    document.getElementById('zoomOutBtn').onclick = () => applyZoom(-0.12);

    function fitToView() {
      if (!state.nodes.length) return;
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      state.nodes.forEach(n => {
        minX = Math.min(minX, n.x);
        minY = Math.min(minY, n.y);
        maxX = Math.max(maxX, n.x + 140);
        maxY = Math.max(maxY, n.y + 40);
      });
      const width = maxX - minX;
      const height = maxY - minY;
      const cw = canvasContainer.clientWidth;
      const ch = canvasContainer.clientHeight;
      const scaleX = cw * 0.7 / width;
      const scaleY = ch * 0.7 / height;
      state.zoom = Math.min(1.4, Math.max(0.2, Math.min(scaleX, scaleY)));
      const centerX = (minX + maxX) / 2;
      const centerY = (minY + maxY) / 2;
      state.panX = cw / 2 - centerX * state.zoom;
      state.panY = ch / 2 - centerY * state.zoom;
      applyTransform();
      showToast('Fit to view');
    }

    document.getElementById('fitBtn').onclick = fitToView;

    document.getElementById('addChildBtn').onclick = () => {
      if (!state.selectedId) return;
      addChild(state.selectedId);
    };
    document.getElementById('addSiblingBtn').onclick = () => {
      if (!state.selectedId) return;
      addSibling(state.selectedId);
    };
    document.getElementById('undoBtn').onclick = undo;
    document.getElementById('redoBtn').onclick = redo;

    document.getElementById('moreBtn').onclick = () => {
      sheetOverlay.classList.add('show');
      bottomSheet.classList.add('show');
    };
    sheetOverlay.onclick = () => {
      sheetOverlay.classList.remove('show');
      bottomSheet.classList.remove('show');
    };

    bottomSheet.addEventListener('click', (e) => {
      const btn = e.target.closest('.sheet-item');
      if (!btn) return;
      const action = btn.dataset.action;
      const selected = state.selectedId ? getNode(state.selectedId) : null;

      if (action === 'color' && selected && !selected.isRoot) {
        selected.color = btn.dataset.color;
        snapshot();
        render();
      } else if (action === 'collapse' && selected) {
        toggleCollapse(selected.id);
      } else if (action === 'expand') {
        state.collapsed.clear();
        snapshot();
        render();
      } else if (action === 'delete' && selected && !selected.isRoot) {
        deleteSubtree(selected.id);
      } else if (action === 'import') {
        fileInput.click();
      }
      sheetOverlay.classList.remove('show');
      bottomSheet.classList.remove('show');
    });

    document.getElementById('exportBtn').onclick = () => {
      const data = JSON.stringify({
        nodes: state.nodes,
        nextId: state.nextId,
        collapsed: Array.from(state.collapsed)
      }, null, 2);
      const blob = new Blob([data], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'mindmap.json';
      a.click();
      URL.revokeObjectURL(url);
      showToast('Exported map');
    };

    document.getElementById('importBtn').onclick = () => fileInput.click();
    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          const data = JSON.parse(ev.target.result);
          state.nodes = data.nodes || [];
          state.nextId = data.nextId || (state.nodes.reduce((m, n) => Math.max(m, n.id), 0) + 1);
          state.collapsed = new Set(data.collapsed || []);
          state.selectedId = null;
          snapshot();
          render();
          fitToView();
          showToast('Imported map');
        } catch {
          showToast('Invalid file');
        }
      };
      reader.readAsText(file);
      e.target.value = '';
    });

    window.addEventListener('keydown', (e) => {
      if (e.target.isContentEditable) return;
      if (e.ctrlKey || e.metaKey) {
        if (e.key === 'z') { e.preventDefault(); undo(); }
        else if (e.key === 'y' || (e.shiftKey && e.key === 'Z')) { e.preventDefault(); redo(); }
      } else {
        if (e.key === 'Delete' && state.selectedId) {
          const n = getNode(state.selectedId);
          if (n && !n.isRoot) deleteSubtree(n.id);
        } else if (e.key === 'f') {
          fitToView();
        } else if (e.key === '+') {
          applyZoom(0.12);
        } else if (e.key === '-') {
          applyZoom(-0.12);
        }
      }
    });

    // Delegated handler for plus and trash icons on nodes
    nodesLayer.addEventListener('click', (e) => {
      const btn = e.target.closest('.node-btn');
      if (!btn) return;
      const action = btn.dataset.action;
      const id = Number(btn.dataset.id);
      if (!id) return;
      e.stopPropagation();
      if (action === 'add-child') {
        addChild(id);
      } else if (action === 'delete-node') {
        const n = getNode(id);
        if (n && !n.isRoot) deleteSubtree(id);
      }
    });

    function init() {
      const centerX = 2500;
      const centerY = 2500;
      const rootId = createNode({
        label: 'Central idea',
        x: centerX,
        y: centerY,
        isRoot: true,
        color: '#ffffff'
      });
      state.selectedId = rootId;

      const cw = canvasContainer.clientWidth;
      const ch = canvasContainer.clientHeight;
      state.zoom = 0.9;
      state.panX = cw / 2 - centerX * state.zoom;
      state.panY = ch / 2 - centerY * state.zoom;
      snapshot();
      render();
      applyTransform();
      showToast('Tap nodes to edit · drag to move · pinch/scroll to zoom');
    }

    window.addEventListener('load', init);
  </script>
</body>
</html>
