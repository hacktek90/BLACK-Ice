<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Interface | BLACK-Ice</title>
    <style>
        :root {
            /* Color Palette */
            --bg-dark: #0a0a0a;
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --text-sub: #888888;
            --accent-glow: rgba(255, 255, 255, 0.15);
            --font-main: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at 50% 0%, #1a1a1a 0%, var(--bg-dark) 70%);
            color: var(--text-main);
            font-family: var(--font-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* --- Main Layout --- */
        .container {
            width: 100%;
            max-width: 900px;
            padding: 20px;
            text-align: center;
            animation: fadeIn 0.8s ease-out;
        }

        header {
            margin-bottom: 3rem;
        }

        h1 {
            font-size: 2rem;
            font-weight: 200;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            opacity: 0.9;
        }

        .subtitle {
            margin-top: 10px;
            color: var(--text-sub);
            font-size: 0.9rem;
            letter-spacing: 0.05em;
        }

        /* --- Selection Grid --- */
        .mode-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            width: 100%;
        }

        /* --- Card Styles --- */
        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 40px 20px;
            text-decoration: none;
            color: white;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
        }

        .card:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.07);
            border-color: rgba(255, 255, 255, 0.3);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        .card:active {
            transform: scale(0.98);
        }

        /* --- Icons --- */
        .icon-box {
            width: 64px;
            height: 64px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: rgba(255,255,255,0.05);
            transition: background 0.3s;
        }

        .card:hover .icon-box {
            background: rgba(255,255,255,0.1);
        }

        .card svg {
            width: 32px;
            height: 32px;
            stroke: currentColor;
            stroke-width: 1.5;
        }

        .card h2 {
            font-size: 1.25rem;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .card p {
            color: var(--text-sub);
            font-size: 0.85rem;
            line-height: 1.4;
            max-width: 200px;
        }

        /* --- Mobile Responsive --- */
        @media (max-width: 768px) {
            .mode-grid {
                grid-template-columns: 1fr;
                max-width: 400px;
                margin: 0 auto;
            }
            
            h1 { font-size: 1.5rem; }
            .card { padding: 30px 20px; }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Select Interface</h1>
            <div class="subtitle">Choose your preferred access method</div>
        </header>

        <div class="mode-grid">
           

            <!-- Option 2: APK Download -->
            <a href="https://blackice-ac.vercel.app/app-release(1).apk" class="card">
                <div class="icon-box">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="7 10 12 15 17 10"></polyline>
                        <line x1="12" y1="15" x2="12" y2="3"></line>
                    </svg>
                </div>
                <h2>Download App</h2>
                <p>Get the latest .apk release for your Android device.</p>
            </a>
        </div>
    </div>

</body>
</html>
