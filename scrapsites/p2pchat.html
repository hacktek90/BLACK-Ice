<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>P2P // SWISS</title>
<meta name="keywords" content="P2P chat, peer to peer chat, online chat platform, private chat, secure messaging, instant messaging, real-time chat, anonymous chat, encrypted chat, chat without server, decentralized chat, direct messaging, online communication">
<meta name="description" content="Experience secure and private peer-to-peer (P2P) chat online. Connect instantly with others through fast, encrypted, and decentralized messaging without relying on central servers.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<link rel="stylesheet" href="https://unpkg.com/viewerjs@1.11.7/dist/viewer.min.css">
<script src="https://unpkg.com/viewerjs@1.11.7/dist/viewer.min.js"></script>

<style>
:root {
    --bg: #ffffff;
    --fg: #000000;
    --accent: #ff3300;
    --border: 2px solid #000000;
    --thin-border: 1px solid #000000;
    --font: 'Inter Tight', sans-serif;
}

*, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }

html, body { height: 100%; overflow: hidden; }

body {
    background: #d4d4d4;
    color: var(--fg);
    font-family: var(--font);
    display: flex;
    justify-content: center;
    align-items: center;
}

.app-container {
    width: 100%; height: 100%;
    max-width: 1400px;
    display: flex; flex-direction: column;
    background: var(--bg);
    position: relative; overflow: hidden;
}

@media (min-width: 1401px) {
    .app-container {
        border: var(--border);
        box-shadow: 20px 20px 0px rgba(0,0,0,0.12);
        height: 96vh;
    }
}

header {
    padding: 14px 20px;
    border-bottom: var(--border);
    display: flex; justify-content: space-between; align-items: center;
    background: #fff; flex-shrink: 0;
}

.brand { font-weight: 800; font-size: 20px; letter-spacing: -0.05em; text-transform: uppercase; }
.brand span { color: var(--accent); }

.status {
    font-size: 10px; font-weight: 700; text-transform: uppercase;
    display: flex; align-items: center; gap: 6px;
    padding: 4px 10px; border: 1px solid #000;
}
.dot { width: 8px; height: 8px; background: #ccc; border-radius: 50%; flex-shrink: 0; }
.dot.active { background: #00cc66; }

.id-panel { border-bottom: var(--border); padding: 14px 20px; background: #f4f4f4; flex-shrink: 0; }
.id-label { font-size: 10px; font-weight: 700; text-transform: uppercase; color: #666; margin-bottom: 4px; }
.id-display { display: flex; gap: 10px; }
.my-id {
    flex: 1; font-family: 'Courier New', monospace; font-weight: 700;
    font-size: 14px; border-bottom: 2px solid #000; padding: 4px 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0;
}
.copy-btn {
    background: #000; color: #fff; border: none; padding: 6px 14px;
    font-weight: 700; font-size: 10px; text-transform: uppercase;
    cursor: pointer; transition: background 0.2s; font-family: var(--font); flex-shrink: 0;
}
.copy-btn:hover { background: var(--accent); }

#chatLog {
    flex: 1; padding: 20px; overflow-y: auto;
    display: flex; flex-direction: column; gap: 12px; background: #fff;
    background-image: radial-gradient(#ddd 1px, transparent 1px);
    background-size: 20px 20px; min-height: 0;
}
#chatLog::-webkit-scrollbar { width: 4px; }
#chatLog::-webkit-scrollbar-track { background: transparent; }
#chatLog::-webkit-scrollbar-thumb { background: #000; }

.msg {
    max-width: 75%; padding: 12px 16px; font-size: 14px; line-height: 1.5;
    position: relative; word-break: break-word;
    animation: slideIn 0.2s ease-out;
}
@media (max-width: 600px) { .msg { max-width: 88%; } }

@keyframes slideIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

.sys {
    align-self: center; font-size: 11px; font-weight: 700;
    text-transform: uppercase; color: #666; background: #f4f4f4;
    padding: 5px 14px; border: 1px solid #ddd; max-width: 100%;
}

.peer { align-self: flex-start; background: #fff; border: 1px solid #000; border-left: 4px solid var(--accent); color: #000; }
.self { align-self: flex-end; background: #000; color: #fff; border: 1px solid #000; }

.timestamp { display: block; font-size: 9px; opacity: 0.6; margin-top: 4px; text-align: right; font-family: monospace; }
.peer .timestamp { text-align: left; }

.msg-image {
    max-width: 100%; max-height: 300px; object-fit: contain;
    border-radius: 2px; margin-bottom: 4px; cursor: zoom-in;
    display: block;
}
.peer .msg-image { border: 1px solid #000; }
.self .msg-image { border: 1px solid rgba(255,255,255,0.15); }
.msg-image:hover { opacity: 0.88; }

.msg-text { margin-top: 2px; }
.msg-text:empty { display: none; }

.img-size { display: inline-block; font-size: 9px; font-family: monospace; opacity: 0.5; margin-top: 2px; }

.controls-area { border-top: var(--border); display: flex; flex-direction: column; flex-shrink: 0; }

.connect-row { display: flex; border-bottom: var(--thin-border); }
.connect-row input {
    flex: 1; padding: 12px 16px; border: none;
    font-family: inherit; font-size: 13px; outline: none; background: #fcfcfc; min-width: 0;
}
.connect-row button {
    border: none; border-left: var(--thin-border); background: #fff;
    padding: 0 18px; cursor: pointer; font-weight: 700;
    text-transform: uppercase; font-size: 11px; font-family: var(--font);
    transition: background 0.15s; flex-shrink: 0;
}
.connect-row button:hover { background: #f0f0f0; }

.chat-row { display: flex; min-height: 56px; }
.chat-row input {
    flex: 1; padding: 14px 20px; border: none;
    font-family: inherit; font-size: 15px; outline: none; min-width: 0;
}
.chat-actions { display: flex; flex-shrink: 0; }

.attach-btn {
    width: 48px; border: none; border-left: var(--thin-border);
    background: #fff; cursor: pointer; display: flex;
    align-items: center; justify-content: center; transition: background 0.15s; color: #000;
}
.attach-btn:hover { background: #f0f0f0; }

.send-btn {
    width: 60px; border: none; border-left: var(--border);
    background: var(--accent); color: #fff; cursor: pointer;
    display: flex; align-items: center; justify-content: center; transition: background 0.15s;
}
.send-btn:hover { background: #000; }
.send-btn:disabled { background: #ccc; cursor: not-allowed; }

/* ── Preview Overlay ── */
.preview-overlay {
    position: absolute; inset: 0; background: rgba(0,0,0,0.88);
    display: none; flex-direction: column; z-index: 100; animation: fadeIn 0.15s ease-out;
}
.preview-overlay.active { display: flex; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.preview-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 16px 20px; color: #fff; flex-shrink: 0;
}
.preview-header h3 { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }
.preview-close {
    background: none; border: 1px solid rgba(255,255,255,0.3);
    color: #fff; width: 36px; height: 36px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font); font-size: 18px; font-weight: 700;
    transition: background 0.2s; flex-shrink: 0;
}
.preview-close:hover { background: rgba(255,255,255,0.1); }

.preview-body {
    flex: 1; display: flex; align-items: center; justify-content: center;
    padding: 0 20px; overflow: hidden; min-height: 0;
}
.preview-body img { max-width: 100%; max-height: 100%; object-fit: contain; border: 2px solid rgba(255,255,255,0.15); }

.preview-footer { padding: 16px 20px; display: flex; gap: 10px; flex-shrink: 0; }
.preview-footer input {
    flex: 1; padding: 12px 16px; border: 1px solid rgba(255,255,255,0.3);
    background: rgba(255,255,255,0.08); color: #fff; font-family: inherit;
    font-size: 14px; outline: none; min-width: 0;
}
.preview-footer input::placeholder { color: rgba(255,255,255,0.35); }
.preview-footer input:focus { border-color: var(--accent); }

.send-image-btn {
    background: var(--accent); color: #fff; border: none;
    padding: 0 20px; font-weight: 700; font-size: 11px;
    text-transform: uppercase; cursor: pointer; font-family: var(--font);
    transition: background 0.2s; flex-shrink: 0;
}
.send-image-btn:hover { background: #fff; color: #000; }

.cancel-image-btn {
    background: transparent; color: #fff; border: 1px solid rgba(255,255,255,0.3);
    padding: 0 14px; font-weight: 700; font-size: 11px;
    text-transform: uppercase; cursor: pointer; font-family: var(--font);
    transition: background 0.2s; flex-shrink: 0;
}
.cancel-image-btn:hover { background: rgba(255,255,255,0.1); }

/* ── Sending indicator ── */
.sending-bar { height: 3px; background: var(--accent); width: 0; flex-shrink: 0; display: none; }
.sending-bar.active { display: block; width: 100%; animation: sendPulse 0.6s ease; }
@keyframes sendPulse { 0% { width: 0; } 50% { width: 70%; } 100% { width: 100%; } }

/* ═══════════════════════════════════════════
   Viewer.js — Brutalist Override
   ═══════════════════════════════════════════ */
.viewer-container {
    background: rgba(0,0,0,0.94) !important;
    font-family: var(--font) !important;
}

/* Backdrop */
.viewer-backdrop { background: rgba(0,0,0,0.94) !important; }

/* Canvas / image area */
.viewer-canvas { background: transparent !important; }
.viewer-canvas img { border-radius: 0 !important; }

/* Toolbar — top bar */
.viewer-toolbar {
    background: rgba(0,0,0,0.92) !important;
    border-bottom: 2px solid rgba(255,255,255,0.1) !important;
    height: 52px !important;
}
.viewer-toolbar > ul { height: 52px !important; }
.viewer-toolbar > ul > li { margin: 0 1px !important; }

/* Toolbar buttons */
.viewer-toolbar > ul > li > .viewer-btn {
    color: rgba(255,255,255,0.7) !important;
    width: 44px !important; height: 52px !important;
    font-size: 18px !important;
    border-radius: 0 !important;
    transition: background 0.15s, color 0.15s !important;
}
.viewer-toolbar > ul > li > .viewer-btn:hover,
.viewer-toolbar > ul > li > .viewer-btn:focus {
    background: rgba(255,255,255,0.08) !important;
    color: #fff !important;
}
.viewer-toolbar > ul > li > .viewer-btn:active {
    background: var(--accent) !important;
    color: #fff !important;
}

/* Close button */
.viewer-toolbar > ul > li:last-child > .viewer-btn:hover {
    background: var(--accent) !important;
    color: #fff !important;
}

/* Navbar (thumbnail strip) — hide */
.viewer-navbar { display: none !important; }

/* Title bar — hide default, we don't need it */
.viewer-title { display: none !important; }

/* Tooltip */
.viewer-tooltip {
    background: #000 !important;
    color: #fff !important;
    border: 1px solid rgba(255,255,255,0.2) !important;
    border-radius: 0 !important;
    font-family: var(--font) !important;
    font-size: 11px !important;
    font-weight: 700 !important;
    text-transform: uppercase !important;
    letter-spacing: 0.04em !important;
    padding: 6px 10px !important;
    margin-top: 6px !important;
}

/* Footer info bar */
.viewer-footer {
    background: rgba(0,0,0,0.9) !important;
    border-top: 1px solid rgba(255,255,255,0.08) !important;
    height: 40px !important;
    color: rgba(255,255,255,0.4) !important;
    font-family: 'Courier New', monospace !important;
    font-size: 11px !important;
}

/* Button list — flexbox override */
.viewer-toolbar > ul {
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
}

/* Separator line in toolbar */
.viewer-toolbar > ul > li + li {
    border-left: 1px solid rgba(255,255,255,0.08) !important;
}

/* Loading spinner */
.viewer-loading {
    border-top-color: var(--accent) !important;
    border-right-color: var(--accent) !important;
    border-bottom-color: var(--accent) !important;
}

/* Fix button svg fill */
.viewer-toolbar svg { fill: currentColor !important; }

/* Mobile adjustments for toolbar */
@media (max-width: 600px) {
    .viewer-toolbar { height: 48px !important; }
    .viewer-toolbar > ul { height: 48px !important; }
    .viewer-toolbar > ul > li > .viewer-btn {
        width: 40px !important; height: 48px !important;
        font-size: 16px !important;
    }
    .viewer-footer { height: 34px !important; font-size: 10px !important; }
}

@media (max-width: 500px) {
    .brand { font-size: 16px; }
    .msg { font-size: 13px; padding: 10px 14px; }
    header { padding: 12px 16px; }
    .id-panel { padding: 12px 16px; }
    .my-id { font-size: 12px; }
    #chatLog { padding: 14px; }
    .connect-row input { padding: 10px 14px; font-size: 12px; }
    .connect-row button { padding: 0 14px; font-size: 10px; }
    .chat-row input { padding: 12px 16px; font-size: 14px; }
    .msg-image { max-height: 220px; }
}

@media (max-width: 360px) {
    .status { padding: 3px 6px; font-size: 9px; }
    .copy-btn { padding: 5px 10px; font-size: 9px; }
    .send-image-btn, .cancel-image-btn { font-size: 10px; padding: 0 10px; }
}
</style>
</head>
<body>

<div class="app-container">
    <header>
        <div class="brand">P2P <span>//</span> CHAT</div>
        <div class="status">
            <div id="statusDot" class="dot"></div>
            <span id="statusText">OFFLINE</span>
        </div>
    </header>

    <div class="id-panel">
        <div class="id-label">Your Session ID</div>
        <div class="id-display">
            <div class="my-id" id="myId">Generating...</div>
            <button class="copy-btn" id="copyBtn">Copy</button>
        </div>
    </div>

    <div id="chatLog">
        <div class="sys">Waiting for connection...</div>
    </div>

    <div class="sending-bar" id="sendingBar"></div>

    <div class="controls-area">
        <div class="connect-row">
            <input id="peerInput" placeholder="Enter Peer ID to connect..." autocomplete="off" spellcheck="false">
            <button id="connectBtn">Connect</button>
        </div>
        <div class="chat-row">
            <input id="msgInput" placeholder="Type a message..." autocomplete="off">
            <div class="chat-actions">
                <button class="attach-btn" id="attachBtn" title="Send Image">
                    <i data-lucide="image-plus" width="20"></i>
                </button>
                <button class="send-btn" id="sendBtn" disabled title="Send">
                    <i data-lucide="send-horizontal" width="20"></i>
                </button>
            </div>
        </div>
    </div>

    <input type="file" id="fileInput" accept="image/*" style="display:none;">

    <div class="preview-overlay" id="previewOverlay">
        <div class="preview-header">
            <h3>Send Image</h3>
            <button class="preview-close" id="previewClose">&times;</button>
        </div>
        <div class="preview-body">
            <img id="previewImg" src="" alt="Preview">
        </div>
        <div class="preview-footer">
            <input id="captionInput" placeholder="Add a caption..." autocomplete="off">
            <button class="cancel-image-btn" id="cancelImageBtn">Cancel</button>
            <button class="send-image-btn" id="sendImageBtn">Send</button>
        </div>
    </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const getTime = () => new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

let myPeerId = null;
let conn = null;
let pendingImageData = null;

// ── Viewer.js Instance ──
const chatViewer = new Viewer($('chatLog'), {
    inline: false,
    button: false,
    navbar: false,
    title: false,
    toolbar: {
        zoomIn: 1,
        zoomOut: 1,
        oneToOne: 1,
        reset: 1,
        prev: 0,
        play: 0,
        next: 0,
        rotateLeft: 1,
        rotateRight: 1,
        flipHorizontal: 1,
        flipVertical: 1,
        close: 1
    },
    tooltip: true,
    movable: true,
    zoomable: true,
    rotatable: true,
    scalable: true,
    transition: true,
    fullscreen: false,
    keyboard: true,
    url: 'src',
    zoomRatio: 0.2,
    minZoomRatio: 0.1,
    maxZoomRatio: 12,
    toggleOnDblclick: true,
    backdrop: true,
    className: 'viewer-container'
});

// ── ID Generator ──
const adj = ["Neon", "Cyber", "Swiss", "Dark", "Bold", "Raw", "Pure", "Hyper", "Mono", "Flux"];
const noun = ["Link", "Node", "Grid", "Core", "Base", "Cell", "Sync", "Pulse", "Data", "Warp"];
const genID = () => `${adj[Math.floor(Math.random() * adj.length)]}-${noun[Math.floor(Math.random() * noun.length)]}-${Math.floor(Math.random() * 999)}`;

// ── Init Peer ──
const peer = new Peer(genID());

peer.on('open', (id) => {
    myPeerId = id;
    $('myId').textContent = id;
    sysLog("Session ready. Share your ID to start.");
});

peer.on('connection', (c) => {
    if (conn) conn.close();
    setupConnection(c);
});

peer.on('error', (err) => sysLog(`Error: ${err.type}`));

// ── Connection ──
function setupConnection(c) {
    conn = c;
    conn.on('open', () => {
        setStatus(true);
        sysLog(`Connected to ${conn.peer}`);
        $('peerInput').value = conn.peer;
        $('peerInput').disabled = true;
        $('connectBtn').textContent = "LINKED";
        $('sendBtn').disabled = false;
        $('msgInput').focus();
    });
    conn.on('data', (data) => {
        if (data && data.type === 'image') {
            addImageMsg(data.data, data.caption || '', 'peer', data.size || '');
        } else if (data && data.type === 'text') {
            addTextMsg(data.text, 'peer');
        } else {
            addTextMsg(String(data), 'peer');
        }
    });
    conn.on('close', () => {
        setStatus(false);
        sysLog("Connection lost.");
        $('peerInput').disabled = false;
        $('connectBtn').textContent = "Connect";
        $('sendBtn').disabled = true;
        conn = null;
    });
}

 $('connectBtn').onclick = () => {
    const pid = $('peerInput').value.trim();
    if (!pid) return;
    if (pid === myPeerId) return sysLog("Cannot connect to yourself.");
    sysLog(`Connecting to ${pid}...`);
    setupConnection(peer.connect(pid));
};

// ── Text Messaging ──
function sendText() {
    if (!conn || !conn.open) return;
    const txt = $('msgInput').value.trim();
    if (!txt) return;
    conn.send({ type: 'text', text: txt });
    addTextMsg(txt, 'self');
    $('msgInput').value = '';
}

 $('sendBtn').onclick = sendText;
 $('msgInput').addEventListener('keydown', (e) => { if (e.key === "Enter") sendText(); });

// ── Image Handling ──
 $('attachBtn').onclick = () => $('fileInput').click();

 $('fileInput').onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    if (!file.type.startsWith('image/')) { sysLog("Only images supported."); $('fileInput').value = ''; return; }
    compressImage(file, 1200, 0.82, (b64) => {
        pendingImageData = b64;
        $('previewImg').src = b64;
        $('captionInput').value = '';
        $('previewOverlay').classList.add('active');
        $('captionInput').focus();
    });
    $('fileInput').value = '';
};

function compressImage(file, maxDim, quality, cb) {
    const reader = new FileReader();
    reader.onload = (ev) => {
        const img = new Image();
        img.onload = () => {
            let w = img.width, h = img.height;
            if (w > maxDim || h > maxDim) {
                if (w > h) { h = Math.round(h * maxDim / w); w = maxDim; }
                else { w = Math.round(w * maxDim / h); h = maxDim; }
            }
            const c = document.createElement('canvas');
            c.width = w; c.height = h;
            c.getContext('2d').drawImage(img, 0, 0, w, h);
            cb(c.toDataURL('image/jpeg', quality));
        };
        img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
}

function closePreview() {
    $('previewOverlay').classList.remove('active');
    pendingImageData = null;
}
 $('previewClose').onclick = closePreview;
 $('cancelImageBtn').onclick = closePreview;

 $('sendImageBtn').onclick = () => {
    if (!pendingImageData || !conn || !conn.open) return;
    const caption = $('captionInput').value.trim();
    const sizeKB = Math.round((pendingImageData.length * 3 / 4) / 1024);
    const sizeStr = sizeKB > 1024 ? `${(sizeKB / 1024).toFixed(1)} MB` : `${sizeKB} KB`;

    $('sendingBar').classList.add('active');
    conn.send({ type: 'image', data: pendingImageData, caption, size: sizeStr });
    addImageMsg(pendingImageData, caption, 'self', sizeStr);
    closePreview();
    setTimeout(() => $('sendingBar').classList.remove('active'), 600);
};

 $('captionInput').addEventListener('keydown', (e) => { if (e.key === "Enter") $('sendImageBtn').click(); });

// ── Paste Image ──
 $('msgInput').addEventListener('paste', (e) => {
    const items = e.clipboardData?.items;
    if (!items) return;
    for (const item of items) {
        if (item.type.startsWith('image/')) {
            e.preventDefault();
            const file = item.getAsFile();
            if (!file) continue;
            compressImage(file, 1200, 0.82, (b64) => {
                pendingImageData = b64;
                $('previewImg').src = b64;
                $('captionInput').value = '';
                $('previewOverlay').classList.add('active');
                $('captionInput').focus();
            });
            break;
        }
    }
});

// ── Drag & Drop ──
const chatLog = $('chatLog');
chatLog.addEventListener('dragover', (e) => { e.preventDefault(); chatLog.style.outline = '2px solid var(--accent)'; });
chatLog.addEventListener('dragleave', () => { chatLog.style.outline = 'none'; });
chatLog.addEventListener('drop', (e) => {
    e.preventDefault();
    chatLog.style.outline = 'none';
    const file = e.dataTransfer?.files[0];
    if (!file || !file.type.startsWith('image/')) { if (file) sysLog("Only images supported."); return; }
    compressImage(file, 1200, 0.82, (b64) => {
        pendingImageData = b64;
        $('previewImg').src = b64;
        $('captionInput').value = '';
        $('previewOverlay').classList.add('active');
        $('captionInput').focus();
    });
});

// ── Message Rendering ──
function addTextMsg(text, type) {
    const d = document.createElement('div');
    d.className = `msg ${type}`;
    d.innerHTML = `<div class="msg-text">${esc(text)}</div><span class="timestamp">${getTime()}</span>`;
    $('chatLog').appendChild(d);
    scrollDown();
}

function addImageMsg(src, caption, type, sizeStr) {
    const d = document.createElement('div');
    d.className = `msg ${type}`;
    d.innerHTML = `
        <img class="msg-image" src="${src}" alt="Image" loading="lazy">
        ${sizeStr ? `<span class="img-size">${sizeStr}</span>` : ''}
        <div class="msg-text">${esc(caption)}</div>
        <span class="timestamp">${getTime()}</span>
    `;
    $('chatLog').appendChild(d);
    // Tell Viewer.js about the new image
    chatViewer.update();
    scrollDown();
}

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

// ── Utility ──
function sysLog(text) {
    const d = document.createElement('div');
    d.className = 'sys';
    d.textContent = text;
    $('chatLog').appendChild(d);
    scrollDown();
}

function scrollDown() { const l = $('chatLog'); l.scrollTop = l.scrollHeight; }

function setStatus(on) {
    $('statusDot').classList.toggle('active', on);
    $('statusText').textContent = on ? "ONLINE" : "OFFLINE";
    $('statusText').style.color = on ? "#000" : "#999";
}

// ── Copy ID ──
 $('copyBtn').onclick = () => {
    navigator.clipboard.writeText(myPeerId).then(() => {
        const b = $('copyBtn');
        b.textContent = "COPIED";
        b.style.background = "var(--accent)";
        setTimeout(() => { b.textContent = "COPY"; b.style.background = "#000"; }, 1500);
    });
};

// ── Init Icons ──
lucide.createIcons();
</script>
</body>
</html>
