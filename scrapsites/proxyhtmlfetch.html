<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Proxy Fetcher</title>
    <style>
        :root {
            --bg: #f9fafb;
            --text-primary: #111827;
            --text-secondary: #6b7280;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --border-radius: 12px;
        }

        body {
            background: var(--bg);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding: 40px 20px;
            max-width: 700px;
            margin: 0 auto;
        }

        h1 {
            font-weight: 700;
            font-size: 24px;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }

        p.subtitle {
            color: var(--text-secondary);
            font-size: 15px;
            margin-bottom: 30px;
            line-height: 1.4;
        }

        /* --- INPUT GROUP --- */
        .search-box {
            background: white;
            padding: 8px;
            border-radius: var(--border-radius);
            box-shadow: 0 4px 20px rgba(0,0,0,0.03);
            border: 1px solid #e5e7eb;
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .search-box:focus-within {
            border-color: var(--accent);
            box-shadow: 0 8px 30px rgba(99, 102, 241, 0.15);
        }

        input {
            border: none;
            outline: none;
            flex-grow: 1;
            padding: 12px 16px;
            font-size: 16px;
            border-radius: 8px;
            color: var(--text-primary);
            background: transparent;
            min-width: 0;
        }

        /* Main Action Buttons */
        button.main-btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
            white-space: nowrap;
            height: 44px;
        }
        button.main-btn:hover { background: var(--accent-hover); }
        
        button.secondary {
            background: transparent;
            color: var(--text-secondary);
            box-shadow: inset 0 0 0 1px #e5e7eb;
        }
        button.secondary:hover { background: #f3f4f6; color: var(--text-primary); }

        /* --- CARDS --- */
        .card {
            background: white;
            border-radius: var(--border-radius);
            border: 1px solid #f3f4f6;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .card-header {
            padding: 10px 20px;
            border-bottom: 1px solid #f3f4f6;
            background: #fafafa;
            display: flex;
            justify-content: space-between; /* Pushes toolbar to right */
            align-items: center;
            min-height: 50px;
        }

        .header-title {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--text-secondary);
            letter-spacing: 0.5px;
        }

        /* --- TOOLBAR BUTTONS (Copy/Download) --- */
        .toolbar {
            display: flex;
            gap: 8px;
        }

        .tool-btn {
            background: white;
            border: 1px solid #e5e7eb;
            color: var(--text-secondary);
            font-size: 12px;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
        }

        .tool-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: #fefeff;
        }

        .tool-btn:active {
            transform: scale(0.96);
        }

        #output {
            padding: 20px;
            font-family: 'Menlo', 'Monaco', monospace;
            font-size: 13px;
            color: #374151;
            white-space: pre-wrap;
            height: 300px;
            overflow: auto;
            line-height: 1.5;
            -webkit-overflow-scrolling: touch;
        }

        iframe {
            width: 100%;
            height: 400px;
            border: none;
        }

        /* --- COPY PROXY LINK SECTION --- */
        .copy-section {
            display: none;
            background: #eef2ff;
            border: 1px solid #e0e7ff;
            border-radius: var(--border-radius);
            padding: 12px 16px;
            margin-bottom: 30px;
            align-items: center;
            gap: 10px;
            animation: fadeIn 0.3s ease;
        }
        .url-display {
            flex-grow: 1;
            font-family: 'Menlo', monospace;
            font-size: 13px;
            color: var(--accent);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* --- TOAST --- */
        #toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: #111827;
            color: white;
            padding: 12px 24px;
            border-radius: 50px;
            font-size: 14px;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            z-index: 100;
            white-space: nowrap;
        }
        #toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* --- MOBILE --- */
        @media (max-width: 600px) {
            body { padding: 20px 16px; }
            h1 { font-size: 22px; }
            
            .search-box { padding: 12px; gap: 12px; }
            input { width: 100%; padding: 8px 4px; margin-bottom: 4px; border-bottom: 1px solid #f3f4f6; border-radius: 0; }
            .search-box button { flex: 1; height: 48px; }

            .copy-section { flex-direction: column; text-align: center; padding: 16px; }
            .copy-section button { width: 100%; margin-top: 8px; }
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <h1>Fetcher</h1>
    <p class="subtitle">Generate proxy links, fetch source code, or preview sites.</p>

    <div class="search-box">
        <input id="urlInput" placeholder="Enter URL (e.g. google.com)" type="url" autocomplete="off">
        <button class="main-btn secondary" onclick="preview()">Preview</button>
        <button class="main-btn" onclick="fetchHTML()">Fetch Code</button>
    </div>

    <!-- Proxy Link Result -->
    <div id="copySection" class="copy-section">
        <div id="generatedUrl" class="url-display"></div>
        <button class="tool-btn" onclick="copyProxyLink()">Copy URL</button>
    </div>

    <!-- Source Code Card -->
    <div class="card">
        <div class="card-header">
            <span class="header-title">Source Code</span>
            <div class="toolbar">
                <button class="tool-btn" onclick="copySourceCode()">Copy</button>
                <button class="tool-btn" onclick="downloadSourceCode()">Download</button>
            </div>
        </div>
        <div id="output">Waiting for input...</div>
    </div>

    <!-- Preview Card -->
    <div class="card">
        <div class="card-header">
            <span class="header-title">Preview</span>
        </div>
        <iframe id="viewFrame"></iframe>
    </div>

    <div id="toast">Notification</div>

    <script>
        // --- URL LOGIC ---
        function normalize(url) {
            url = url.trim();
            if (!url) return null;
            if (!url.startsWith("http")) url = "https://" + url;
            try { new URL(url); return url; } catch { return null; }
        }

        function buildProxyUrl() {
            document.getElementById("urlInput").blur(); // Hide keyboard
            const url = normalize(document.getElementById("urlInput").value);
            
            if (!url) {
                showToast("⚠️ Please enter a valid URL");
                return null;
            }
            
            const proxyUrl = "https://bosbrowse.onrender.com/proxy?url=" + encodeURIComponent(url);
            
            const copySection = document.getElementById("copySection");
            document.getElementById("generatedUrl").innerText = proxyUrl;
            copySection.style.display = (window.innerWidth <= 600) ? "flex" : "flex";
            
            return proxyUrl;
        }

        // --- FETCHING ---
        async function fetchHTML() {
            const url = buildProxyUrl();
            if (!url) return;

            const out = document.getElementById("output");
            out.innerText = "Fetching data...";
            
            try {
                const res = await fetch(url);
                const txt = await res.text();
                out.innerText = txt;
            } catch (e) {
                out.innerText = "Error: " + e;
            }
        }

        function preview() {
            const url = buildProxyUrl();
            if (url) document.getElementById("viewFrame").src = url;
        }

        // --- ACTION BUTTONS ---

        function copyProxyLink() {
            const url = document.getElementById("generatedUrl").innerText;
            if (!url) return;
            copyText(url, "✅ Proxy link copied!");
        }

        function copySourceCode() {
            const code = document.getElementById("output").innerText;
            if (code === "Waiting for input..." || code.startsWith("Fetching")) {
                showToast("⚠️ No code to copy yet");
                return;
            }
            copyText(code, "✅ Source code copied!");
        }

        function downloadSourceCode() {
            const code = document.getElementById("output").innerText;
            if (code === "Waiting for input..." || code.startsWith("Fetching")) {
                showToast("⚠️ No code to download yet");
                return;
            }
            
            const blob = new Blob([code], { type: "text/html" });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = "fetched_source.html";
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            showToast("⬇️ Downloading HTML...");
        }

        // --- UTILS ---
        function copyText(text, successMsg) {
            navigator.clipboard.writeText(text).then(() => {
                showToast(successMsg);
            }).catch(() => {
                showToast("❌ Failed to copy");
            });
        }

        function showToast(msg) {
            const toast = document.getElementById("toast");
            toast.innerText = msg;
            toast.classList.add("show");
            setTimeout(() => toast.classList.remove("show"), 2500);
        }
    </script>
</body>
</html>
