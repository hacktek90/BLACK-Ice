<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />
<title>Swiss QR // Mobile Pro</title>
<!-- Inter Tight Font -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;600;800&display=swap" rel="stylesheet">

<style>
/* 
    SWISS MINIMALISM 2025 // MOBILE OPTIMIZED
    Strict Grid | Monochrome + Orange | Inter Tight 
*/
:root {
    --bg-color: #ffffff;
    --text-color: #000000;
    --border-color: #000000;
    --accent-color: #ff3300; /* International Orange */
    --grid-line: 2px solid var(--border-color);
    --thin-line: 1px solid var(--border-color);
    --font-main: 'Inter Tight', sans-serif;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

body {
    margin: 0;
    font-family: var(--font-main);
    background: var(--bg-color);
    color: var(--text-color);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
}

/* --- LAYOUT GRID --- */
.main-grid {
    display: grid;
    grid-template-columns: 1fr 1fr; /* Default Desktop Split */
    width: 100%;
    border-top: var(--grid-line);
}

section {
    display: flex;
    flex-direction: column;
    height: auto; 
}

/* Left Panel: Generator */
.panel-gen {
    border-right: var(--grid-line);
}

/* Right Panel: Scanner */
.panel-scan {
    background: #f4f4f4; 
    border-left: none;
}

/* --- TYPOGRAPHY & HEADERS --- */
h2 {
    margin: 0;
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    padding: 20px;
    border-bottom: var(--grid-line);
    background: var(--bg-color);
    font-weight: 800;
    position: sticky;
    top: 0;
    z-index: 100;
}

label {
    display: block;
    font-size: 11px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 8px;
    color: var(--text-color);
}

/* --- FORMS & INPUTS --- */
.input-group {
    padding: 20px;
    border-bottom: var(--thin-line);
}

input[type=text], input[type=number], select {
    width: 100%;
    padding: 0;
    border: none;
    border-bottom: 2px solid transparent;
    background: transparent;
    font-family: var(--font-main);
    font-size: 16px;
    color: var(--text-color);
    height: 48px;
    border-radius: 0;
    outline: none;
    appearance: none;
    transition: border 0.2s;
}

input[type=text]:focus, input[type=number]:focus, select:focus {
    border-bottom: 2px solid var(--accent-color);
}

select {
    background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
    background-repeat: no-repeat;
    background-position: right 0 center;
    background-size: 16px;
}

/* Color pickers grid */
.color-row {
    display: flex;
    gap: 0;
    border-bottom: var(--thin-line);
    flex-wrap: wrap;
}
.color-item {
    flex: 1;
    min-width: 100px;
    padding: 20px;
    border-right: var(--thin-line);
    display: flex;
    flex-direction: column;
}
.color-item:last-child { border-right: none; }

input[type=color] {
    width: 100%;
    height: 48px;
    border: 1px solid #000;
    padding: 0;
    background: transparent;
    cursor: pointer;
    border-radius: 0; 
}

/* File Input Wrapper */
.file-upload-wrapper {
    position: relative;
    padding: 20px;
    border-bottom: var(--thin-line);
}
.file-upload-wrapper input[type=file] {
    font-size: 14px;
    padding-top: 10px;
}

/* --- BUTTONS --- */
button {
    background: transparent;
    color: var(--text-color);
    border: 1px solid var(--text-color);
    padding: 0 24px;
    height: 56px;
    font-family: var(--font-main);
    font-weight: 800;
    text-transform: uppercase;
    font-size: 12px;
    cursor: pointer;
    border-radius: 0;
    transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    display: inline-flex;
    align-items: center; justify-content: center;
    white-space: nowrap;
}

button:active {
    background: #000;
    color: #fff;
    transform: translateY(1px);
}

/* Primary Action Buttons */
.btn-primary {
    background: var(--accent-color);
    color: white;
    border-color: var(--accent-color);
    width: 100%;
    height: 64px;
    font-size: 14px;
}
.btn-primary:active, .btn-primary:hover {
    background: #000;
    border-color: #000;
    color: white;
}

.actions-row {
    display: flex;
    border-bottom: var(--thin-line);
    flex-wrap: wrap;
}
.actions-row button {
    flex: 1;
    border: none;
    border-right: var(--thin-line);
    border-bottom: var(--thin-line);
    min-width: 80px;
}
.actions-row button:last-child { border-right: none; }

/* --- VISUAL OUTPUTS --- */
.canvas-wrapper {
    padding: 30px;
    display: flex;
    justify-content: center;
    background: #fff;
    border-bottom: var(--thin-line);
}
.canvas-wrapper img {
    max-width: 100%;
    height: auto;
    display: block;
}

canvas {
    max-width: 100%;
    height: auto;
    box-shadow: 0 0 0 1px #eee;
}

/* Video Feed */
.video-wrapper {
    position: relative;
    width: 100%;
    border-bottom: var(--thin-line);
    background: #000;
    min-height: 60vh; 
    overflow: hidden;
}
video {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
}

.scan-overlay {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 240px; height: 240px;
    border: 2px solid var(--accent-color);
    z-index: 5;
    pointer-events: none;
    box-shadow: 0 0 0 2000px rgba(0,0,0,0.5); 
}
.scan-overlay::before { content: "TARGET"; position: absolute; top: -25px; left: 0; color: var(--accent-color); font-size: 12px; font-weight: 800; letter-spacing: 0.1em; }

/* Result Display */
.result-box {
    padding: 24px;
    background: var(--accent-color);
    color: white;
    font-size: 18px;
    word-break: break-all;
    font-weight: 600;
    line-height: 1.4;
    display: none;
    border-bottom: 4px solid black;
}
.result-label {
    font-size: 10px; text-transform: uppercase; margin-bottom: 8px; opacity: 0.8;
}

/* --- IMAGE UPLOAD SECTION (Scanner) --- */
.scan-file-row {
    display: flex;
    background: white;
    border-bottom: var(--thin-line);
}
.scan-file-btn {
    flex: 1;
    border: none;
    border-right: var(--thin-line);
    background: white;
    font-size: 11px;
    justify-content: center;
    text-transform: uppercase;
}
.scan-file-btn:last-child { border-right: none; }
.scan-file-btn:hover { background: #f0f0f0; }

/* Hide actual file input */
#scanFileInput {
    position: absolute;
    opacity: 0;
    width: 0.1px;
    height: 0.1px;
}

/* Image Preview Container */
#imagePreviewContainer {
    background: #fff;
    padding: 20px;
    display: none; /* Hidden by default */
    border-bottom: var(--thin-line);
    align-items: center;
    justify-content: center;
    min-height: 100px;
}
#imagePreviewContainer img {
    max-width: 100%;
    max-height: 300px;
    border: 1px solid #000;
}

/* --- MOBILE RESPONSIVE LOGIC --- */
@media (max-width: 900px) {
    .main-grid { 
        grid-template-columns: 1fr; 
        grid-template-rows: auto;
        border-top: none; 
    }
    
    .panel-gen { 
        border-right: none; 
        border-bottom: 4px solid black;
        order: 2; 
    }
    
    .panel-scan {
        order: 1; 
    }
    
    .actions-row button {
        padding: 0 16px;
        font-size: 11px;
    }
    
    h2 { font-size: 12px; padding: 16px; }
}
</style>
</head>
<body>

<div class="main-grid">
    
    <!-- PANEL 1: SCANNER (Priority on Mobile) -->
    <section class="panel-scan">
        <h2>01 // Scanner</h2>
        
        <!-- Video Area -->
        <div class="video-wrapper">
            <video id="scanVideo" playsinline muted autoplay></video>
            <div class="scan-overlay"></div>
            <canvas id="scanCanvas" style="display:none"></canvas>
            
            <!-- Error / Status Message Overlay -->
            <div id="camStatus" style="position:absolute; bottom:20px; left:0; width:100%; text-align:center; color:white; font-size:11px; font-weight:600; text-shadow:0 1px 2px black;">
                CAMERA INACTIVE
            </div>
        </div>

        <!-- NEW: Image Upload Section -->
        <div class="scan-file-row">
            <button class="scan-file-btn" onclick="document.getElementById('scanFileInput').click()">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:8px;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                Upload Image
            </button>
            <input type="file" id="scanFileInput" accept="image/*" />
            <button class="scan-file-btn" id="pasteBtn">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:8px;"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path><rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect></svg>
                Paste Image
            </button>
        </div>

        <!-- Image Preview Area -->
        <div id="imagePreviewContainer">
            <img id="uploadedImagePreview" alt="Uploaded preview" />
        </div>

        <!-- Result Area -->
        <div id="scanResult" class="result-box">
            <div class="result-label">Decoded Content</div>
            <span id="resText"></span>
        </div>

        <!-- Result Actions -->
        <div class="actions-row" id="resultActions" style="display:none; background:white;">
            <button id="copyResult">Copy</button>
            <button id="openResult">Open URL</button>
            <button id="shareResult" style="display:none">Share</button>
            <button id="clearResult">Clear</button>
        </div>

        <!-- Scanner Controls -->
        <div class="actions-row" style="background:white;">
            <button id="startCamera" style="flex:2; background:black; color:white;">Start Cam</button>
            <button id="toggleTorch">Torch</button>
            <button id="stopScan">Stop</button>
        </div>
        
        <div class="input-group" style="background:white;">
            <label>Select Camera</label>
            <select id="cameraSelect"><option value="">Default (Rear)</option></select>
        </div>
        
        <div class="actions-row" style="background:white; border-top:var(--thin-line)">
             <button id="startScreen">Scan Screen (Desktop)</button>
        </div>
    </section>

    <!-- PANEL 2: GENERATOR -->
    <section class="panel-gen">
        <h2>02 // Generator</h2>
        
        <div class="input-group">
            <label>Content / URL</label>
            <input id="text" type="text" placeholder="https://example.com" value="https://example.com">
        </div>

        <div class="color-row">
            <div class="color-item">
                <label>Color (FG)</label>
                <input id="fg" type="color" value="#000000">
            </div>
            <div class="color-item">
                <label>Background</label>
                <input id="bg" type="color" value="#ffffff">
            </div>
        </div>
        
        <div class="color-row">
            <div class="color-item">
                <label>Size (px)</label>
                <input id="size" type="number" min="200" max="2048" value="1024">
            </div>
             <div class="color-item">
                <label>Correction</label>
                <select id="ec">
                    <option value="L">L (7%)</option>
                    <option value="M" selected>M (15%)</option>
                    <option value="Q">Q (25%)</option>
                    <option value="H">H (30%)</option>
                </select>
            </div>
        </div>

        <div class="file-upload-wrapper">
            <label>Logo Overlay (Optional)</label>
            <input id="logoFile" type="file" accept="image/*">
            <div style="margin-top:10px; display:flex; align-items:center; gap:10px;">
                <label style="margin:0; width:auto;">Scale:</label>
                <input id="logoSize" type="number" min="10" max="40" value="20" style="width:60px; height:30px; border-bottom:1px solid black;">
                <span style="font-size:12px;">%</span>
            </div>
        </div>

        <div style="padding:20px; border-bottom:var(--thin-line);">
            <button id="generate" class="btn-primary">CREATE CODE</button>
        </div>

        <div class="canvas-wrapper">
            <canvas id="qrCanvas" width="512" height="512"></canvas>
        </div>

        <div class="actions-row">
            <button id="downloadPng">PNG</button>
            <button id="downloadSvg">SVG</button>
            <button id="copyData">Copy Text</button>
        </div>
    </section>

</div>

<!-- Libraries -->
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

<script>
/* =========================================
   1. QR GENERATOR LOGIC
   ========================================= */

const textEl = document.getElementById('text');
const sizeEl = document.getElementById('size');
const ecEl = document.getElementById('ec');
const fgEl = document.getElementById('fg');
const bgEl = document.getElementById('bg');
const logoFileEl = document.getElementById('logoFile');
const logoSizeEl = document.getElementById('logoSize');
const genBtn = document.getElementById('generate');
const canvas = document.getElementById('qrCanvas');
const ctx = canvas.getContext('2d');
let logoImage = null;

logoFileEl.addEventListener('change', (e) => {
    const f = e.target.files?.[0];
    if (!f) { logoImage = null; return; }
    const r = new FileReader();
    r.onload = (ev) => {
        const img = new Image();
        img.onload = () => logoImage = img;
        img.src = ev.target.result;
    };
    r.readAsDataURL(f);
});

async function renderQR() {
    const value = textEl.value.trim();
    const size = Math.max(128, Math.min(2048, Number(sizeEl.value)||512));
    const ec = ecEl.value;
    const fg = fgEl.value;
    const bg = bgEl.value;
    
    canvas.width = size;
    canvas.height = size;
    
    if (!value) {
        ctx.fillStyle = bg;
        ctx.fillRect(0,0,size,size);
        return;
    }
    
    ctx.fillStyle = bg;
    ctx.fillRect(0,0,size,size);
    
    const opts = { errorCorrectionLevel: ec, margin: 1, width: size, color: { dark: fg, light: bg } };
    try {
        const dataUrl = await QRCode.toDataURL(value, opts);
        const img = new Image();
        await new Promise(res => { img.onload = res; img.src = dataUrl; });
        ctx.drawImage(img, 0, 0, size, size);
        
        if (logoImage) {
            const s = Math.max(10, Math.min(50, Number(logoSizeEl.value)||20)) / 100;
            const w = size * s, h = size * s, x = (size - w) / 2, y = (size - h) / 2;
            ctx.fillStyle = bg;
            ctx.drawImage(logoImage, x, y, w, h);
        }
    } catch(e) {
        console.error("QR Gen Error", e);
    }
}

genBtn.addEventListener('click', renderQR);

let debounceTimer;
['input','change'].forEach(ev =>
    [textEl,sizeEl,ecEl,fgEl,bgEl,logoSizeEl].forEach(el =>
        el.addEventListener(ev, () => { 
            clearTimeout(debounceTimer); 
            debounceTimer = setTimeout(renderQR, 300); 
        })
    )
);

document.getElementById('downloadPng').addEventListener('click', () => {
    const link = document.createElement('a');
    link.download = `qr_${Date.now()}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
});

document.getElementById('downloadSvg').addEventListener('click', async () => {
    const value = textEl.value.trim();
    if (!value) return;
    const ec = ecEl.value, fg = fgEl.value, bg = bgEl.value;
    const svg = await QRCode.toString(value, { type:'svg', errorCorrectionLevel: ec, color: { dark: fg, light: bg } });
    const blob = new Blob([svg], { type:'image/svg+xml' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.download = `qr_${Date.now()}.svg`;
    link.href = url;
    link.click();
});

document.getElementById('copyData').addEventListener('click', async () => {
    try {
        await navigator.clipboard.writeText(textEl.value||'');
        alert("COPIED");
    } catch(err) {
        prompt("Copy this:", textEl.value);
    }
});

renderQR();

/* =========================================
   2. MOBILE SCANNER LOGIC
   ========================================= */

const startScreenBtn = document.getElementById('startScreen');
const startCameraBtn = document.getElementById('startCamera');
const stopBtn = document.getElementById('stopScan');
const torchBtn = document.getElementById('toggleTorch');
const camSelect = document.getElementById('cameraSelect');
const videoEl = document.getElementById('scanVideo');
const scanCanvas = document.getElementById('scanCanvas');
const scanCtx = scanCanvas.getContext('2d');
const camStatus = document.getElementById('camStatus');

const resultBox = document.getElementById('scanResult');
const resText = document.getElementById('resText');
const actionsEl = document.getElementById('resultActions');
const shareBtn = document.getElementById('shareResult');

/* New Elements for Image Upload */
const scanFileInput = document.getElementById('scanFileInput');
const pasteBtn = document.getElementById('pasteBtn');
const imagePreviewContainer = document.getElementById('imagePreviewContainer');
const uploadedImagePreview = document.getElementById('uploadedImagePreview');

let scanStream = null;
let rafId = 0;
let detector = null;
let useNativeDetector = false;
let currentVideoTrack = null;
let torchOn = false;

// Check for Web Share API
if(navigator.share) {
    shareBtn.style.display = 'block';
    shareBtn.onclick = () => {
        navigator.share({
            title: 'Scanned QR',
            text: resText.textContent
        }).catch(console.error);
    }
}

function updateStatus(msg) {
    camStatus.textContent = msg;
}

function showResult(text){
    if(text) {
        if(navigator.vibrate) navigator.vibrate(200);
        resText.textContent = text;
        resultBox.style.display = 'block';
        actionsEl.style.display = 'flex';
        updateStatus("SCAN COMPLETE");
        resultBox.scrollIntoView({behavior: "smooth", block: "center"});
    } else {
        resText.textContent = '';
        resultBox.style.display = 'none';
        actionsEl.style.display = 'none';
        imagePreviewContainer.style.display = 'none';
    }
}

function stopScan(){
    cancelAnimationFrame(rafId);
    if (scanStream) {
        scanStream.getTracks().forEach(t=>t.stop());
        scanStream = null;
    }
    currentVideoTrack = null;
    videoEl.srcObject = null;
    updateStatus("CAMERA INACTIVE");
}

async function ensureDetector(){
    if ('BarcodeDetector' in window) {
        try {
            const formats = await BarcodeDetector.getSupportedFormats();
            if (formats.includes('qr_code')) {
                detector = new BarcodeDetector({ formats: ['qr_code'] });
                useNativeDetector = true;
                return;
            }
        } catch(e) {}
    }
    useNativeDetector = false;
}

/* =========================================
   3. IMAGE UPLOAD & DECODING LOGIC (UPDATED)
   ========================================= */

function decodeImage(imgElement) {
    uploadedImagePreview.src = imgElement.src;
    imagePreviewContainer.style.display = 'flex';
    stopScan();
    updateStatus("ANALYZING IMAGE...");

    scanCanvas.width = imgElement.naturalWidth || imgElement.width;
    scanCanvas.height = imgElement.naturalHeight || imgElement.height;
    
    scanCtx.drawImage(imgElement, 0, 0, scanCanvas.width, scanCanvas.height);
    
    const imageData = scanCtx.getImageData(0, 0, scanCanvas.width, scanCanvas.height);
    
    const code = jsQR(imageData.data, imageData.width, imageData.height, {
        inversionAttempts: "dontInvert",
    });
    
    if (code) {
        showResult(code.data);
    } else {
        updateStatus("NO QR CODE FOUND");
        uploadedImagePreview.style.opacity = "0.5";
        setTimeout(() => uploadedImagePreview.style.opacity = "1", 1000);
    }
}

// Handle File Selection
scanFileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (event) => {
        const img = new Image();
        img.onload = () => decodeImage(img);
        img.src = event.target.result;
    };
    reader.readAsDataURL(file);
    e.target.value = '';
});

// Handle Paste Button Click (Mobile API)
pasteBtn.addEventListener('click', async () => {
    if (!navigator.clipboard) {
        alert("Clipboard API not supported in this browser.");
        return;
    }

    try {
        updateStatus("Reading clipboard...");
        const clipboardItems = await navigator.clipboard.read();
        
        for (const item of clipboardItems) {
            // Look for image types
            for (const type of item.types) {
                if (type.startsWith('image/')) {
                    const blob = await item.getType(type);
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        const img = new Image();
                        img.onload = () => decodeImage(img);
                        img.src = event.target.result;
                    };
                    reader.readAsDataURL(blob);
                    return; // Stop after finding first image
                }
            }
        }
        updateStatus("No image found in clipboard.");
    } catch (err) {
        console.error(err);
        // Handle permission denial or empty clipboard
        if(err.name === 'NotAllowedError') {
            alert("Clipboard permission denied. Please allow access to paste images.");
        } else {
            alert("Failed to read clipboard. Make sure you copied an image.");
        }
        updateStatus("READY");
    }
});

// Handle Keyboard Paste (Desktop/Physical Keyboard)
window.addEventListener('paste', (e) => {
    const items = (e.clipboardData || e.originalEvent.clipboardData).items;
    let blob = null;
    
    for (let i = 0; i < items.length; i++) {
        if (items[i].type.indexOf('image') !== -1) {
            blob = items[i].getAsFile();
            break;
        }
    }

    if (blob !== null) {
        const reader = new FileReader();
        reader.onload = (event) => {
            const img = new Image();
            img.onload = () => decodeImage(img);
            img.src = event.target.result;
        };
        reader.readAsDataURL(blob);
    }
});

/* =========================================
   4. CAMERA SCANNING LOGIC
   ========================================= */

async function scanLoop(){
    if (!videoEl.videoWidth || !videoEl.videoHeight) {
        rafId = requestAnimationFrame(scanLoop);
        return;
    }
    
    if(!scanStream || !scanStream.active) {
        stopScan();
        return;
    }

    try {
        if (useNativeDetector && detector) {
            const barcodes = await detector.detect(videoEl);
            if (barcodes.length > 0) {
                showResult(barcodes[0].rawValue);
                stopScan();
                return;
            }
        } else {
            scanCanvas.width = videoEl.videoWidth; 
            scanCanvas.height = videoEl.videoHeight;
            scanCtx.drawImage(videoEl, 0, 0, scanCanvas.width, scanCanvas.height);
            const imgData = scanCtx.getImageData(0, 0, scanCanvas.width, scanCanvas.height);
            const code = jsQR(imgData.data, imgData.width, imgData.height, {
                inversionAttempts: "dontInvert",
            });
            if (code && code.data) {
                showResult(code.data);
                stopScan();
                return;
            }
        }
    } catch (e) {
        console.warn("Scan frame error", e);
    }
    rafId = requestAnimationFrame(scanLoop);
}

async function populateCameras(){
    camSelect.innerHTML = '<option value="">Default (Rear)</option>';
    try {
        const devices = await navigator.mediaDevices.enumerateDevices();
        const videoDevices = devices.filter(d => d.kind === 'videoinput');
        
        if(videoDevices.length > 0) {
            camSelect.innerHTML = '';
            videoDevices.forEach(d => {
                const opt = document.createElement('option');
                opt.value = d.deviceId;
                opt.text = d.label || `Camera ${videoDevices.indexOf(d) + 1}`;
                camSelect.appendChild(opt);
            });
        }
    } catch(e) {
        console.warn("Camera enum error", e);
    }
}

async function startCameraScan(){
    showResult('');
    imagePreviewContainer.style.display = 'none';
    stopScan();
    updateStatus("INITIALIZING...");
    
    try {
        await ensureDetector();
        
        const selectedId = camSelect.value;
        const constraints = {
            video: {
                deviceId: selectedId ? { exact: selectedId } : undefined,
                facingMode: selectedId ? undefined : { ideal: 'environment' },
                width: { ideal: 1280 },
                height: { ideal: 720 },
                focusMode: 'continuous'
            }
        };

        scanStream = await navigator.mediaDevices.getUserMedia(constraints);
        videoEl.srcObject = scanStream;
        await videoEl.play();
        
        currentVideoTrack = scanStream.getVideoTracks()[0];
        updateStatus("SCANNING...");
        populateCameras(); 
        rafId = requestAnimationFrame(scanLoop);
        
    } catch (err) {
        console.error(err);
        updateStatus("ERROR: " + err.name);
        if(err.name === 'NotAllowedError') alert("Camera permission denied. Please allow access in settings.");
        else if(err.name === 'NotFoundError') alert("No camera found.");
    }
}

async function startScreenScan(){
    showResult('');
    imagePreviewContainer.style.display = 'none';
    stopScan();
    try {
        await ensureDetector();
        scanStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
        videoEl.srcObject = scanStream;
        await videoEl.play();
        updateStatus("SCREEN SCAN ACTIVE");
        rafId = requestAnimationFrame(scanLoop);
    } catch (err) {
        updateStatus("CANCELLED");
    }
}

async function toggleTorch(){
    if(!currentVideoTrack) return;
    try {
        torchOn = !torchOn;
        await currentVideoTrack.applyConstraints({
            advanced: [{ torch: torchOn }]
        });
    } catch(e) {
        alert("Torch not supported on this device/browser");
    }
}

// BINDINGS
startCameraBtn.addEventListener('click', startCameraScan);
stopBtn.addEventListener('click', stopScan);
torchBtn.addEventListener('click', toggleTorch);
camSelect.addEventListener('change', () => { if(scanStream) startCameraScan(); });
startScreenBtn.addEventListener('click', startScreenScan);

document.getElementById('copyResult').addEventListener('click', async () => {
    try {
        await navigator.clipboard.writeText(resText.textContent);
        alert("COPIED");
    } catch(e) {
        prompt("Copy result:", resText.textContent);
    }
});

document.getElementById('openResult').addEventListener('click', () => {
    let url = resText.textContent;
    if(!url.match(/^https?:\/\//i)) url = 'http://' + url;
    window.open(url, '_blank', 'noopener');
});

document.getElementById('clearResult').addEventListener('click', () => {
    showResult('');
    updateStatus("READY");
});

populateCameras();

</script>
</body>
