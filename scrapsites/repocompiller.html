<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>GH Explorer → Minimalist Code View</title>
<style>
  :root {
    --bg-primary: #0a0a0f;
    --bg-secondary: #13131a;
    --bg-tertiary: #1a1a24;
    --surface: #1e1e2e;
    --surface-hover: #252535;
    --border: #2a2a3c;
    --border-accent: #3a3a4c;
    --text-primary: #e4e4e7;
    --text-secondary: #a1a1aa;
    --text-muted: #71717a;
    --accent-purple: #a78bfa;
    --accent-violet: #8b5cf6;
    --accent-fuchsia: #d946ef;
    --accent-glow: rgba(167, 139, 250, 0.15);
    --success: #10b981;
    --error: #ef4444;
    --warning: #f59e0b;
    --font-mono: "JetBrains Mono", "Fira Code", "SF Mono", Monaco, "Cascadia Code", "Roboto Mono", Consolas, "Courier New", monospace;
    --font-sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html, body {
    height: 100%;
    background: var(--bg-primary);
    color: var(--text-primary);
    font-family: var(--font-sans);
    font-size: 14px;
    line-height: 1.5;
    overflow: hidden;
  }

  body {
    display: flex;
    flex-direction: column;
  }

  /* Top Bar */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 10px 14px;
    background: var(--bg-secondary);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: -0.02em;
  }

  .logo-icon {
    width: 28px;
    height: 28px;
    background: linear-gradient(135deg, var(--accent-violet), var(--accent-fuchsia));
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    font-weight: 900;
  }

  .logo-text {
    color: var(--text-primary);
  }

  .logo-text span {
    color: var(--accent-purple);
  }

  .topbar-controls {
    display: flex;
    align-items: center;
    gap: 8px;
    flex: 1;
    justify-content: flex-end;
  }

  .input-group {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  input[type="text"] {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-primary);
    padding: 6px 10px;
    border-radius: 4px;
    font-size: 12px;
    font-family: var(--font-mono);
    outline: none;
    min-width: 180px;
    transition: all 0.2s;
  }

  input[type="text"]:focus {
    border-color: var(--accent-purple);
    box-shadow: 0 0 0 2px var(--accent-glow);
  }

  input[type="text"]::placeholder {
    color: var(--text-muted);
  }

  button {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-secondary);
    padding: 6px 12px;
    border-radius: 4px;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
    font-family: var(--font-sans);
  }

  button:hover {
    background: var(--surface-hover);
    color: var(--text-primary);
    border-color: var(--border-accent);
  }

  button.primary {
    background: var(--accent-violet);
    border-color: var(--accent-violet);
    color: white;
  }

  button.primary:hover {
    background: var(--accent-purple);
    border-color: var(--accent-purple);
  }

  /* Main Layout */
  .main-container {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* Sidebar */
  .sidebar {
    width: 280px;
    background: var(--bg-secondary);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .sidebar-header {
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }

  .sidebar-title {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-muted);
  }

  .path-display {
    font-size: 10px;
    color: var(--text-muted);
    font-family: var(--font-mono);
  }

  .tree-view {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
    font-family: var(--font-mono);
    font-size: 12px;
  }

  .tree-view::-webkit-scrollbar {
    width: 8px;
  }

  .tree-view::-webkit-scrollbar-thumb {
    background: var(--border);
    border-radius: 4px;
  }

  .tree-item {
    padding: 5px 8px;
    margin: 1px 0;
    border-radius: 3px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--text-secondary);
    transition: all 0.12s;
  }

  .tree-item:hover {
    background: var(--surface);
    color: var(--text-primary);
  }

  .tree-item.repo {
    color: var(--accent-purple);
  }

  .tree-item.folder {
    color: var(--text-primary);
  }

  .tree-item.file {
    color: var(--text-secondary);
  }

  .tree-item.file:hover {
    color: var(--accent-purple);
  }

  .tree-children {
    margin-left: 16px;
  }

  /* Content Area */
  .content-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Editor Tabs */
  .editor-tabs {
    display: flex;
    align-items: center;
    gap: 1px;
    background: var(--bg-secondary);
    border-bottom: 1px solid var(--border);
    padding: 0 8px;
    flex-shrink: 0;
  }

  .tab {
    padding: 8px 14px;
    font-size: 12px;
    background: transparent;
    border: none;
    border-bottom: 2px solid transparent;
    color: var(--text-muted);
    cursor: pointer;
    transition: all 0.15s;
    font-family: var(--font-mono);
  }

  .tab:hover {
    color: var(--text-secondary);
    background: var(--surface);
  }

  .tab.active {
    color: var(--accent-purple);
    border-bottom-color: var(--accent-purple);
  }

  .file-info {
    margin-left: auto;
    padding: 8px 12px;
    font-size: 10px;
    color: var(--text-muted);
    font-family: var(--font-mono);
  }

  /* Editor Panes */
  .editor-panes {
    flex: 1;
    display: flex;
    overflow: hidden;
  }

  .editor-pane {
    display: none;
    flex: 1;
    flex-direction: column;
    overflow: hidden;
  }

  .editor-pane.active {
    display: flex;
  }

  .code-editor {
    flex: 1;
    background: var(--bg-primary);
    border: none;
    outline: none;
    color: var(--text-primary);
    font-family: var(--font-mono);
    font-size: 13px;
    line-height: 1.6;
    padding: 16px;
    resize: none;
    tab-size: 2;
    overflow: auto;
  }

  .code-editor::-webkit-scrollbar {
    width: 10px;
    height: 10px;
  }

  .code-editor::-webkit-scrollbar-track {
    background: var(--bg-primary);
  }

  .code-editor::-webkit-scrollbar-thumb {
    background: var(--border);
    border-radius: 5px;
  }

  .code-editor::-webkit-scrollbar-thumb:hover {
    background: var(--border-accent);
  }

  /* Preview Panel */
  .preview-panel {
    flex: 0.85;
    display: flex;
    flex-direction: column;
    border-left: 1px solid var(--border);
    background: var(--bg-secondary);
  }

  .preview-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .preview-title {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-muted);
  }

  .status-indicator {
    padding: 4px 8px;
    border-radius: 3px;
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .status-indicator.idle {
    background: var(--surface);
    color: var(--text-muted);
  }

  .status-indicator.loading {
    background: rgba(245, 158, 11, 0.15);
    color: var(--warning);
  }

  .status-indicator.success {
    background: rgba(16, 185, 129, 0.15);
    color: var(--success);
  }

  .status-indicator.error {
    background: rgba(239, 68, 68, 0.15);
    color: var(--error);
  }

  .preview-actions {
    display: flex;
    gap: 6px;
  }

  .icon-btn {
    padding: 4px 8px;
    font-size: 11px;
  }

  .preview-frame {
    flex: 1;
    border: none;
    background: white;
  }

  /* Bottom Bar */
  .bottom-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 12px;
    background: var(--bg-secondary);
    border-top: 1px solid var(--border);
    font-size: 11px;
    color: var(--text-muted);
    flex-shrink: 0;
  }

  .bottom-left {
    display: flex;
    gap: 12px;
  }

  .bottom-right {
    display: flex;
    gap: 8px;
  }

  .toggle-btn {
    padding: 4px 8px;
    font-size: 11px;
    background: transparent;
    border: 1px solid var(--border);
  }

  .toggle-btn.active {
    background: var(--accent-glow);
    border-color: var(--accent-purple);
    color: var(--accent-purple);
  }

  /* Responsive */
  @media (max-width: 960px) {
    .sidebar {
      width: 240px;
    }

    .preview-panel {
      display: none;
    }
  }

  @media (max-width: 640px) {
    .sidebar {
      position: absolute;
      z-index: 100;
      height: 100%;
      transform: translateX(-100%);
      transition: transform 0.3s;
    }

    .sidebar.open {
      transform: translateX(0);
    }

    .topbar-controls {
      flex-wrap: wrap;
    }

    input[type="text"] {
      min-width: 140px;
    }
  }

  /* Helper classes */
  .hidden {
    display: none !important;
  }

  .muted-text {
    color: var(--text-muted);
    font-style: italic;
  }
</style>
</head>
<body>
  <!-- Top Bar -->
  <div class="topbar">
    <div class="logo">
      <div class="logo-icon">⚡</div>
      <div class="logo-text">GH<span>/</span>Explorer</div>
    </div>
    <div class="topbar-controls">
      <div class="input-group">
        <input type="text" id="ownerInput" placeholder="username" />
        <button id="loadBtn" class="primary">Load</button>
        <button id="clearBtn">Clear</button>
      </div>
    </div>
  </div>

  <!-- Main Container -->
  <div class="main-container">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-title">Files</div>
        <div class="path-display" id="pathDisplay">/</div>
      </div>
      <div class="tree-view" id="treeView">
        <div class="muted-text">Load a GitHub user to begin</div>
      </div>
    </aside>

    <!-- Content Area -->
    <div class="content-area">
      <!-- Editor Tabs -->
      <div class="editor-tabs">
        <button class="tab active" data-lang="html">index.html</button>
        <button class="tab" data-lang="css">style.css</button>
        <button class="tab" data-lang="js">script.js</button>
        <div class="file-info" id="fileInfo">No file selected</div>
      </div>

      <!-- Editor Panes -->
      <div class="editor-panes">
        <div class="editor-pane active" data-lang="html">
          <textarea class="code-editor" id="htmlEditor" placeholder="// HTML code here" spellcheck="false"></textarea>
        </div>
        <div class="editor-pane" data-lang="css">
          <textarea class="code-editor" id="cssEditor" placeholder="/* CSS styles here */" spellcheck="false"></textarea>
        </div>
        <div class="editor-pane" data-lang="js">
          <textarea class="code-editor" id="jsEditor" placeholder="// JavaScript code here" spellcheck="false"></textarea>
        </div>
      </div>
    </div>

    <!-- Preview Panel -->
    <div class="preview-panel">
      <div class="preview-header">
        <div class="preview-title">Live Preview</div>
        <div style="display:flex;align-items:center;gap:8px;">
          <div class="status-indicator idle" id="statusBadge">Idle</div>
          <div class="preview-actions">
            <button class="icon-btn" id="downloadBtn">⬇ Save</button>
            <button class="icon-btn" id="fullscreenBtn">⛶ Full</button>
          </div>
        </div>
      </div>
      <iframe class="preview-frame" id="previewFrame" sandbox="allow-scripts allow-same-origin"></iframe>
    </div>
  </div>

  <!-- Bottom Bar -->
  <div class="bottom-bar">
    <div class="bottom-left">
      <span id="statusText">Ready</span>
    </div>
    <div class="bottom-right">
      <button class="toggle-btn active" id="autoPreviewBtn">Auto-preview</button>
      <button class="icon-btn" id="applyBtn">▶ Run</button>
    </div>
  </div>

<script>
// State
const state = {
  owner: '',
  repo: '',
  branch: 'main',
  autoPreview: true,
  files: { html: '', css: '', js: '' }
};

// Elements
const $ = id => document.getElementById(id);
const ownerInput = $('ownerInput');
const loadBtn = $('loadBtn');
const clearBtn = $('clearBtn');
const treeView = $('treeView');
const pathDisplay = $('pathDisplay');
const htmlEditor = $('htmlEditor');
const cssEditor = $('cssEditor');
const jsEditor = $('jsEditor');
const previewFrame = $('previewFrame');
const statusBadge = $('statusBadge');
const statusText = $('statusText');
const fileInfo = $('fileInfo');
const autoPreviewBtn = $('autoPreviewBtn');
const applyBtn = $('applyBtn');
const downloadBtn = $('downloadBtn');
const fullscreenBtn = $('fullscreenBtn');

// Tabs
const tabs = document.querySelectorAll('.tab');
const panes = document.querySelectorAll('.editor-pane');

tabs.forEach(tab => {
  tab.addEventListener('click', () => {
    const lang = tab.dataset.lang;
    tabs.forEach(t => t.classList.toggle('active', t === tab));
    panes.forEach(p => p.classList.toggle('active', p.dataset.lang === lang));
  });
});

// Debounce
const debounce = (fn, delay = 300) => {
  let timer;
  return (...args) => {
    clearTimeout(timer);
    timer = setTimeout(() => fn(...args), delay);
  };
};

// Status
function setStatus(text, type = 'idle') {
  statusText.textContent = text;
  statusBadge.className = `status-indicator ${type}`;
  statusBadge.textContent = type;
}

// GitHub API
async function fetchRepos(owner) {
  const res = await fetch(`https://api.github.com/users/${owner}/repos?per_page=100&sort=updated`);
  if (!res.ok) throw new Error(`API Error: ${res.status}`);
  return await res.json();
}

async function fetchContents(owner, repo, path = '') {
  const url = `https://api.github.com/repos/${owner}/${repo}/contents/${path}?ref=${state.branch}`;
  const res = await fetch(url);
  if (!res.ok) throw new Error(`API Error: ${res.status}`);
  return await res.json();
}

// Load repos
async function loadRepos() {
  const owner = ownerInput.value.trim();
  if (!owner) {
    setStatus('Enter username', 'error');
    return;
  }

  state.owner = owner;
  state.repo = '';
  pathDisplay.textContent = `/${owner}`;
  treeView.innerHTML = '<div class="muted-text">Loading...</div>';
  setStatus('Loading repos...', 'loading');

  try {
    const repos = await fetchRepos(owner);
    if (!repos.length) {
      treeView.innerHTML = '<div class="muted-text">No repositories found</div>';
      setStatus('No repos found', 'idle');
      return;
    }

    treeView.innerHTML = '';
    repos.sort((a, b) => a.name.localeCompare(b.name)).forEach(repo => {
      const item = document.createElement('div');
      item.className = 'tree-item repo';
      item.textContent = `📦 ${repo.name}`;
      item.onclick = () => loadRepo(repo.name, repo.default_branch || 'main');
      treeView.appendChild(item);
    });

    setStatus(`Loaded ${repos.length} repos`, 'success');
  } catch (err) {
    treeView.innerHTML = `<div class="muted-text">Error: ${err.message}</div>`;
    setStatus(err.message, 'error');
  }
}

// Load repo contents
async function loadRepo(repo, branch = 'main') {
  state.repo = repo;
  state.branch = branch;
  pathDisplay.textContent = `/${state.owner}/${repo}`;
  treeView.innerHTML = '<div class="muted-text">Loading...</div>';
  setStatus('Loading files...', 'loading');

  try {
    const items = await fetchContents(state.owner, repo);
    renderTree(items, state.owner, repo);
    setStatus(`Loaded ${items.length} items`, 'success');
  } catch (err) {
    treeView.innerHTML = `<div class="muted-text">Error: ${err.message}</div>`;
    setStatus(err.message, 'error');
  }
}

// Render tree
function renderTree(items, owner, repo, container = treeView) {
  container.innerHTML = '';
  items.sort((a, b) => {
    if (a.type === b.type) return a.name.localeCompare(b.name);
    return a.type === 'dir' ? -1 : 1;
  });

  items.forEach(item => {
    const el = document.createElement('div');
    el.className = `tree-item ${item.type === 'dir' ? 'folder' : 'file'}`;
    el.textContent = `${item.type === 'dir' ? '📁' : '📄'} ${item.name}`;

    if (item.type === 'dir') {
      el.onclick = async () => {
        if (el.dataset.expanded === '1') {
          el.dataset.expanded = '0';
          if (el.nextSibling?.classList?.contains('tree-children')) {
            el.nextSibling.remove();
          }
          return;
        }
        el.dataset.expanded = '1';
        const childContainer = document.createElement('div');
        childContainer.className = 'tree-children';
        childContainer.innerHTML = '<div class="muted-text">Loading...</div>';
        el.after(childContainer);

        try {
          const children = await fetchContents(owner, repo, item.path);
          renderTree(children, owner, repo, childContainer);
        } catch (err) {
          childContainer.innerHTML = `<div class="muted-text">Error: ${err.message}</div>`;
        }
      };
    } else {
      el.onclick = () => loadFile(item);
    }

    container.appendChild(el);
  });
}

// Load file
async function loadFile(item) {
  setStatus(`Loading ${item.name}...`, 'loading');
  fileInfo.textContent = `${item.name} • ${(item.size / 1024).toFixed(1)}KB`;

  try {
    let content = '';
    if (item.download_url) {
      const res = await fetch(item.download_url);
      content = await res.text();
    } else {
      const res = await fetch(item.url);
      const json = await res.json();
      content = atob(json.content.replace(/\n/g, ''));
    }

    const ext = item.name.split('.').pop().toLowerCase();
    if (ext === 'html' || ext === 'htm') {
      htmlEditor.value = content;
      state.files.html = content;
      tabs[0].click();
    } else if (ext === 'css') {
      cssEditor.value = content;
      state.files.css = content;
      tabs[1].click();
    } else if (ext === 'js' || ext === 'mjs') {
      jsEditor.value = content;
      state.files.js = content;
      tabs[2].click();
    } else {
      htmlEditor.value = content;
      state.files.html = content;
      tabs[0].click();
    }

    setStatus(`Loaded ${item.name}`, 'success');
    if (state.autoPreview) updatePreview();
  } catch (err) {
    setStatus(err.message, 'error');
  }
}

// Update preview
function updatePreview() {
  setStatus('Rendering...', 'loading');
  let html = htmlEditor.value.trim() || '<!doctype html><html><head><meta charset="utf-8"></head><body><main style="display:flex;align-items:center;justify-content:center;height:100vh;font-family:system-ui;color:#71717a;background:#fafafa;"><div>No HTML loaded</div></main></body></html>';
  const css = cssEditor.value;
  const js = jsEditor.value;

  if (css) {
    const style = `<style>${css}</style>`;
    html = html.replace(/<\/head>/i, `${style}</head>`) || `${style}${html}`;
  }

  if (js) {
    const script = `<script>${js}<\/script>`;
    html = html.replace(/<\/body>/i, `${script}</body>`) || `${html}${script}`;
  }

  previewFrame.srcdoc = html;
  setTimeout(() => setStatus('Preview updated', 'success'), 300);
}

const debouncedPreview = debounce(updatePreview, 400);

// Editor listeners
htmlEditor.addEventListener('input', () => {
  state.files.html = htmlEditor.value;
  if (state.autoPreview) debouncedPreview();
});

cssEditor.addEventListener('input', () => {
  state.files.css = cssEditor.value;
  if (state.autoPreview) debouncedPreview();
});

jsEditor.addEventListener('input', () => {
  state.files.js = jsEditor.value;
  if (state.autoPreview) debouncedPreview();
});

// Buttons
loadBtn.addEventListener('click', loadRepos);
clearBtn.addEventListener('click', () => {
  ownerInput.value = '';
  state.owner = '';
  state.repo = '';
  pathDisplay.textContent = '/';
  treeView.innerHTML = '<div class="muted-text">Load a GitHub user to begin</div>';
  setStatus('Cleared', 'idle');
});

applyBtn.addEventListener('click', updatePreview);

autoPreviewBtn.addEventListener('click', () => {
  state.autoPreview = !state.autoPreview;
  autoPreviewBtn.classList.toggle('active', state.autoPreview);
  autoPreviewBtn.textContent = state.autoPreview ? 'Auto-preview' : 'Manual';
});

downloadBtn.addEventListener('click', () => {
  let count = 0;
  if (htmlEditor.value) {
    download(htmlEditor.value, 'index.html', 'text/html');
    count++;
  }
  if (cssEditor.value) {
    download(cssEditor.value, 'style.css', 'text/css');
    count++;
  }
  if (jsEditor.value) {
    download(jsEditor.value, 'script.js', 'text/javascript');
    count++;
  }
  setStatus(count ? `Downloaded ${count} file(s)` : 'No files', count ? 'success' : 'error');
});

fullscreenBtn.addEventListener('click', () => {
  if (document.fullscreenElement) {
    document.exitFullscreen();
  } else {
    previewFrame.requestFullscreen?.();
  }
});

function download(content, filename, mime) {
  const blob = new Blob([content], { type: mime });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  URL.revokeObjectURL(a.href);
}

// Initialize
ownerInput.value = 'usernamegit';
setStatus('Ready', 'idle');
</script>
</body>
</html>
