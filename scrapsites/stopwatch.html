<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chronometer .02</title>
<!-- Typography: Inter Tight for that Swiss "Typography as UI" feel -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">

<style>
    :root {
        /* Palette: Swiss International Style */
        --c-white: #ffffff;
        --c-black: #000000;
        --c-gray-100: #f0f0f0;
        --c-gray-300: #cccccc;
        
        /* New Colors */
        --c-accent: #0055FF; /* Royal Blue (International Style) */
        --c-error: #D00000;   /* Deep Swiss Red */

        /* Spacing & Grid */
        --grid-gap: 1px;
        --sp-xs: 0.5rem;
        --sp-sm: 1rem;
        --sp-md: 2rem;
        --sp-lg: 4rem;
        
        /* Type */
        --font-main: "Inter Tight", sans-serif;
    }

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        background-color: var(--c-gray-300); /* Defines the grid lines */
        font-family: var(--font-main);
        color: var(--c-black);
        display: flex;
        justify-content: center;
        min-height: 100vh;
        overflow-x: hidden;
    }

    /* Main Grid Layout */
    .swiss-grid {
        display: grid;
        grid-template-columns: 1fr;
        width: 100%;
        max-width: 1400px;
        background-color: var(--c-black); /* Grid line color */
        gap: 1px; 
        border-left: 1px solid var(--c-black);
        border-right: 1px solid var(--c-black);
    }

    @media (min-width: 768px) {
        .swiss-grid {
            grid-template-columns: repeat(12, 1fr);
            min-height: 100vh;
        }
    }

    /* Generic Cell Styles */
    .cell {
        background-color: var(--c-white);
        padding: var(--sp-sm);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
    }

    /* Typography Utilities */
    .label {
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        font-weight: 600;
        color: var(--c-black);
        opacity: 0.5;
        margin-bottom: var(--sp-xs);
    }

    h1 {
        font-size: 1.5rem;
        font-weight: 800;
        margin: 0;
        letter-spacing: -0.02em;
    }

    /* HEADER SECTION */
    .header {
        grid-column: 1 / -1;
        padding: var(--sp-sm) var(--sp-md);
        display: flex;
        align-items: center;
        justify-content: space-between;
    }

    .status-badge {
        font-size: 0.7rem;
        font-weight: 700;
        text-transform: uppercase;
        display: flex;
        align-items: center;
        gap: 8px;
    }
    .status-dot {
        width: 8px;
        height: 8px;
        background-color: var(--c-accent);
        border-radius: 50%;
        animation: pulse 2s infinite;
    }

    /* STOPWATCH SECTION */
    .section-stopwatch {
        grid-column: 1 / -1;
        padding: var(--sp-lg) var(--sp-md);
        align-items: center;
        justify-content: center;
        min-height: 40vh;
        position: relative;
    }
    
    @media (min-width: 768px) {
        .section-stopwatch {
            grid-column: 1 / 9;
        }
    }

    #display {
        font-size: 12vw; 
        line-height: 0.9;
        font-weight: 700;
        letter-spacing: -0.04em;
        font-variant-numeric: tabular-nums;
        text-align: center;
        color: var(--c-black);
    }

    @media (min-width: 768px) {
        #display { font-size: 8rem; }
    }

    /* CONTROLS SECTION (Right Side) */
    .section-controls {
        grid-column: 1 / -1;
        display: flex;
        flex-direction: column;
        gap: 1px;
        background-color: var(--c-black);
    }

    @media (min-width: 768px) {
        .section-controls {
            grid-column: 9 / -1;
            display: grid;
            grid-template-rows: 1fr 1fr;
        }
    }

    /* BUTTONS */
    .btn {
        appearance: none;
        border: none;
        background: var(--c-white);
        font-family: var(--font-main);
        font-size: 1.25rem;
        font-weight: 600;
        padding: var(--sp-md);
        cursor: pointer;
        transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        text-align: left;
        position: relative;
        overflow: hidden;
    }

    .btn:hover {
        background-color: var(--c-gray-100);
        padding-left: calc(var(--sp-md) + 4px);
    }

    .btn:active {
        background-color: var(--c-gray-300);
    }
    
    /* Primary Action Styles */
    .btn-primary {
        color: var(--c-accent);
    }
    
    .btn-primary:hover {
        background-color: var(--c-accent);
        color: var(--c-white);
    }

    .btn-stop {
        color: var(--c-error);
    }

    .btn-stop:hover {
        background-color: var(--c-error);
        color: var(--c-white);
    }

    /* TIMER SECTION (Bottom) */
    .section-timer {
        grid-column: 1 / -1;
        display: grid;
        grid-template-columns: 1fr;
        gap: 1px;
        background-color: var(--c-black);
    }

    @media (min-width: 768px) {
        .section-timer {
            grid-template-columns: 1fr 1fr 1fr;
        }
    }

    .timer-display-container {
        grid-column: 1 / -1;
        background: var(--c-white);
        padding: var(--sp-md);
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
    }
    
    @media (min-width: 768px) {
        .timer-display-container {
            grid-column: 1 / 2;
            flex-direction: column;
            justify-content: space-between;
            align-items: flex-start;
        }
    }

    #timerDisplay {
        font-size: 4rem;
        font-weight: 700;
        letter-spacing: -0.03em;
        line-height: 1;
        font-variant-numeric: tabular-nums;
    }

    .timer-inputs {
        background: var(--c-white);
        padding: var(--sp-md);
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: var(--sp-sm);
    }

    .input-group {
        display: flex;
        gap: var(--sp-sm);
    }

    input[type="number"] {
        width: 100%;
        border: none;
        border-bottom: 2px solid var(--c-gray-300);
        font-family: var(--font-main);
        font-size: 1.5rem;
        font-weight: 600;
        padding: var(--sp-xs) 0;
        border-radius: 0;
        outline: none;
        transition: border-color 0.2s;
        background: transparent;
    }

    input[type="number"]:focus {
        border-color: var(--c-accent);
    }

    input[type="number"]::placeholder {
        color: var(--c-gray-300);
    }

    .timer-controls {
        background: var(--c-white);
        display: flex;
        flex-direction: column;
    }

    .timer-controls .btn {
        flex: 1;
        border-bottom: 1px solid var(--c-gray-100);
    }

    /* Animations */
    @keyframes pulse {
        0% { transform: scale(0.95); opacity: 0.5; }
        50% { transform: scale(1.1); opacity: 1; }
        100% { transform: scale(0.95); opacity: 0.5; }
    }

</style>
</head>
<body>

    <div class="swiss-grid">
        <!-- Header -->
        <header class="cell header">
            <h1>CHRONO .02</h1>
            <div class="status-badge">
                <div class="status-dot"></div>
                <span>Active</span>
            </div>
        </header>

        <!-- Main Stopwatch Display -->
        <section class="cell section-stopwatch">
            <div class="label">Total Elapsed Time</div>
            <div id="display">00:00:00.0</div>
        </section>

        <!-- Stopwatch Controls -->
        <section class="section-controls">
            <button id="startStopBtn" class="btn btn-primary">Start</button>
            <button id="resetBtn" class="btn">Reset</button>
        </section>

        <!-- Timer Section -->
        <div class="section-timer">
            <!-- Timer Display -->
            <div class="timer-display-container">
                <div class="label">Timer Countdown</div>
                <div id="timerDisplay">00:00</div>
            </div>

            <!-- Timer Inputs -->
            <div class="timer-inputs">
                <div class="label">Set Duration</div>
                <div class="input-group">
                    <input id="timerMinutes" type="number" min="0" max="999" placeholder="00m" />
                    <input id="timerSeconds" type="number" min="0" max="59" placeholder="00s" />
                </div>
            </div>

            <!-- Timer Controls -->
            <div class="timer-controls">
                <button id="timerStartStopBtn" class="btn btn-primary">Start Timer</button>
                <button id="timerResetBtn" class="btn">Reset Timer</button>
            </div>
        </div>
        
        <!-- Footer Removed as requested -->
    </div>

<script>
    // ====== Stopwatch Logic ======
    const display = document.getElementById('display');
    const startStopBtn = document.getElementById('startStopBtn');
    const resetBtn = document.getElementById('resetBtn');
    
    let startTime;
    let elapsedTime = 0;
    let timerInterval;
    let running = false;

    function formatTime(ms) {
        const totalSeconds = Math.floor(ms / 1000);
        const hours = Math.floor(totalSeconds / 3600);
        const minutes = Math.floor((totalSeconds % 3600) / 60);
        const seconds = totalSeconds % 60;
        const tenths = Math.floor((ms % 1000) / 100);
        
        return [
            hours.toString().padStart(2, '0'),
            minutes.toString().padStart(2, '0'),
            seconds.toString().padStart(2, '0')
        ].join(':') + '.' + tenths;
    }

    function updateDisplay() {
        const currentTime = Date.now();
        elapsedTime = currentTime - startTime;
        display.textContent = formatTime(elapsedTime);
        document.title = formatTime(elapsedTime) + " - Chrono";
    }

    function start() {
        startTime = Date.now() - elapsedTime;
        localStorage.setItem('stopwatchStartTime', startTime);
        localStorage.setItem('stopwatchRunning', 'true');
        
        timerInterval = setInterval(updateDisplay, 100);
        
        startStopBtn.textContent = 'Stop';
        startStopBtn.classList.add('btn-stop');
        startStopBtn.classList.remove('btn-primary');
        running = true;
    }

    function stop() {
        clearInterval(timerInterval);
        localStorage.removeItem('stopwatchStartTime');
        localStorage.setItem('stopwatchElapsedTime', elapsedTime);
        localStorage.setItem('stopwatchRunning', 'false');
        
        startStopBtn.textContent = 'Start';
        startStopBtn.classList.remove('btn-stop');
        startStopBtn.classList.add('btn-primary');
        document.title = "Chronometer .02";
        running = false;
    }

    function reset() {
        stop();
        localStorage.removeItem('stopwatchElapsedTime');
        elapsedTime = 0;
        display.textContent = formatTime(0);
        startStopBtn.textContent = 'Start';
        startStopBtn.classList.remove('btn-stop');
        startStopBtn.classList.add('btn-primary');
    }

    function loadState() {
        const isRunning = localStorage.getItem('stopwatchRunning') === 'true';
        if (isRunning) {
            const storedStartTime = parseInt(localStorage.getItem('stopwatchStartTime'), 10);
            if (!isNaN(storedStartTime)) {
                elapsedTime = Date.now() - storedStartTime;
                start();
            }
        } else {
            const storedElapsedTime = parseInt(localStorage.getItem('stopwatchElapsedTime'), 10);
            if (!isNaN(storedElapsedTime)) {
                elapsedTime = storedElapsedTime;
                display.textContent = formatTime(elapsedTime);
            }
        }
    }

    startStopBtn.addEventListener('click', () => { if (running) { stop(); } else { start(); } });
    resetBtn.addEventListener('click', reset);
    window.addEventListener('load', loadState);


    // ====== Timer Logic ======
    const timerDisplay = document.getElementById('timerDisplay');
    const timerStartStopBtn = document.getElementById('timerStartStopBtn');
    const timerResetBtn = document.getElementById('timerResetBtn');
    const timerMinutes = document.getElementById('timerMinutes');
    const timerSeconds = document.getElementById('timerSeconds');

    let countdownInterval = null;
    let countdownRunning = false;
    let countdownEndTime = null;
    let countdownFired = false;
    let audioCtx = null;

    function ensureAudioContext() {
        if (!audioCtx) {
            const Ctx = window.AudioContext || window.webkitAudioContext;
            if (Ctx) audioCtx = new Ctx();
        }
        if (audioCtx && audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    }

    function playBeep(duration = 250, frequency = 880, volume = 0.2) {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.value = frequency;
        gain.gain.value = volume;
        osc.connect(gain).connect(audioCtx.destination);
        const now = audioCtx.currentTime;
        osc.start(now);
        osc.stop(now + duration / 1000);
    }

    function triggerAlarm() {
        playBeep(4000, 660, 0.2); 
        if ('vibrate' in navigator) {
            navigator.vibrate([300, 150, 300, 150, 500]);
        }
    }

    function formatMMSS(ms) {
        const total = Math.max(0, Math.floor(ms / 1000));
        const mm = Math.floor(total / 60).toString().padStart(2, '0');
        const ss = (total % 60).toString().padStart(2, '0');
        return `${mm}:${ss}`;
    }

    function updateTimerTick() {
        const remaining = countdownEndTime - Date.now();
        timerDisplay.textContent = formatMMSS(remaining);
        if (remaining <= 0) {
            stopTimerInternal(true);
        }
    }

    function startTimer() {
        ensureAudioContext();
        const m = parseInt(timerMinutes.value || '0', 10);
        const s = parseInt(timerSeconds.value || '0', 10);
        const totalMs = (isNaN(m) ? 0 : m) * 60000 + (isNaN(s) ? 0 : Math.min(59, s)) * 1000;
        
        if (totalMs <= 0) return;

        countdownEndTime = Date.now() + totalMs;
        countdownFired = false;
        
        localStorage.setItem('countdownEndTime', String(countdownEndTime));
        localStorage.setItem('countdownRunning', 'true');
        localStorage.setItem('countdownFired', 'false');
        
        timerDisplay.textContent = formatMMSS(totalMs);
        if (countdownInterval) clearInterval(countdownInterval);
        countdownInterval = setInterval(updateTimerTick, 200);
        
        timerStartStopBtn.textContent = 'Stop Timer';
        timerStartStopBtn.classList.add('btn-stop');
        timerStartStopBtn.classList.remove('btn-primary');
        countdownRunning = true;
    }

    function stopTimerInternal(fireAlert) {
        if (countdownInterval) clearInterval(countdownInterval);
        countdownInterval = null;
        
        timerStartStopBtn.textContent = 'Start Timer';
        timerStartStopBtn.classList.remove('btn-stop');
        timerStartStopBtn.classList.add('btn-primary');
        countdownRunning = false;
        
        localStorage.setItem('countdownRunning', 'false');
        
        if (fireAlert && !countdownFired) {
            countdownFired = true;
            localStorage.setItem('countdownFired', 'true');
            triggerAlarm();
            timerDisplay.textContent = '00:00';
        }
    }

    function stopTimer() {
        stopTimerInternal(false);
    }

    function resetTimer() {
        stopTimerInternal(false);
        countdownEndTime = null;
        countdownFired = false;
        timerDisplay.textContent = '00:00';
        timerMinutes.value = '';
        timerSeconds.value = '';
        
        localStorage.removeItem('countdownEndTime');
        localStorage.removeItem('countdownRunning');
        localStorage.removeItem('countdownFired');
    }

    function loadTimerState() {
        const running = localStorage.getItem('countdownRunning') === 'true';
        const fired = localStorage.getItem('countdownFired') === 'true';
        const end = parseInt(localStorage.getItem('countdownEndTime') || 'NaN', 10);

        if (!isNaN(end)) {
            countdownEndTime = end;
            const remaining = end - Date.now();
            
            if (running && remaining > 0) {
                timerDisplay.textContent = formatMMSS(remaining);
                if (countdownInterval) clearInterval(countdownInterval);
                countdownInterval = setInterval(updateTimerTick, 200);
                timerStartStopBtn.textContent = 'Stop Timer';
                timerStartStopBtn.classList.add('btn-stop');
                timerStartStopBtn.classList.remove('btn-primary');
                countdownRunning = true;
            } else if (running && remaining <= 0 && !fired) {
                countdownRunning = false;
                countdownFired = true;
                localStorage.setItem('countdownRunning', 'false');
                localStorage.setItem('countdownFired', 'true');
                triggerAlarm(); 
                timerDisplay.textContent = '00:00';
            } else {
                timerDisplay.textContent = remaining > 0 ? formatMMSS(remaining) : '00:00';
                countdownRunning = false;
            }
        }
    }

    timerStartStopBtn.addEventListener('click', () => {
        ensureAudioContext();
        if (countdownRunning) stopTimer(); else startTimer();
    });
    timerResetBtn.addEventListener('click', resetTimer);
    window.addEventListener('load', loadTimerState);
</script>
</body>
</html>
