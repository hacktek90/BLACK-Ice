        function randomFrom(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

        function generateUsername() {
            const adj = ['swift','bold','calm','dark','fair','keen','rare','warm','cool','neat','pure','fast','safe','wise','tiny','wild','soft','lite','nova','flux','echo','haze','mist','dusk','glow','fern','opal','jade','rust','sage'];
            const noun = ['wolf','hawk','bear','lion','lynx','deer','crow','fox','owl','hare','seal','ram','moth','wren','dove','pike','frog','puma','ibis','orca','yak','colt','bass','newt','crab','fawn','gear','iris'];
            const n = Math.floor(Math.random() * 9999);
            return `${randomFrom(adj)}${randomFrom(noun)}${n}`;
        }

        function generatePassword() {
            const c = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz23456789!@#$%&*';
            let p = '';
            for (let i = 0; i < 18; i++) p += c[Math.floor(Math.random() * c.length)];
            return p;
        }

        function relativeTime(dateStr) {
            const d = new Date(dateStr);
            const s = Math.floor((Date.now() - d) / 1000);
            if (s < 5) return 'just now';
            if (s < 60) return `${s}s ago`;
            const m = Math.floor(s / 60);
            if (m < 60) return `${m}m ago`;
            const h = Math.floor(m / 60);
            if (h < 24) return `${h}h ago`;
            return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
        }

        function getInitial(name) {
            if (!name) return '?';
            return name.trim().charAt(0).toUpperCase();
        }

        function sanitizeHtml(html) {
            if (!html) return '';
            return html
                .replace(/<script[\s\S]*?<\/script>/gi, '')
                .replace(/<iframe[\s\S]*?<\/iframe>/gi, '')
                .replace(/<form[\s\S]*?<\/form>/gi, '')
                .replace(/on\w+\s*=\s*"[^"]*"/gi, '')
                .replace(/on\w+\s*=\s*'[^']*'/gi, '')
                .replace(/javascript\s*:/gi, '');
        }

        function showToast(message, type = 'info') {
            const icons = { success: 'fa-circle-check', error: 'fa-circle-xmark', info: 'fa-circle-info' };
            const el = document.createElement('div');
            el.className = `toast toast-${type}`;
            el.innerHTML = `
                <i class="fa-solid ${icons[type] || icons.info} toast-icon"></i>
                <span>${message}</span>
                <button class="toast-close" aria-label="Close"><i class="fa-solid fa-xmark"></i></button>
            `;
            el.querySelector('.toast-close').onclick = () => removeToast(el);
            $toastContainer.appendChild(el);
            setTimeout(() => removeToast(el), 3500);
        }

        function removeToast(el) {
            if (!el || el.classList.contains('removing')) return;
            el.classList.add('removing');
            setTimeout(() => el.remove(), 200);
        }

        async function fetchDomains() {
            const res = await fetch(`${API}/domains`);
            if (!res.ok) throw new Error('Failed to fetch domains');
            const data = await res.json();
            const members = data['hydra:member'] || [];
            if (!members.length) throw new Error('No domains available');
            return members[0].domain;
        }

        async function createAccount(retries = 2) {
            const domain = await fetchDomains();
            for (let i = 0; i <= retries; i++) {
                const username = generateUsername();
                const password = generatePassword();
                const address = `${username}@${domain}`;
                const res = await fetch(`${API}/accounts`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ address, password })
                });
                if (res.ok) {
                    const account = await res.json();
                    return { id: account.id, address, password };
                }
                if (res.status === 422 && i < retries) continue;
                const err = await res.json().catch(() => ({}));
                throw new Error(err.detail || err.message || `Failed to create account (${res.status})`);
            }
        }

        async function getToken(address, password) {
            const res = await fetch(`${API}/token`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ address, password })
            });
            if (!res.ok) throw new Error('Failed to authenticate');
            const data = await res.json();
            return data.token;
        }

        async function fetchMessages() {
            if (!state.token || state.fetching) return;
            state.fetching = true;
            try {
                const res = await fetch(`${API}/messages`, {
                    headers: { 'Authorization': `Bearer ${state.token}` }
                });
                if (res.status === 401) { await reLogin(); return; }
                if (!res.ok) return;
                const data = await res.json();
                const msgs = data['hydra:member'] || [];
                const newIds = new Set(msgs.map(m => m.id));
                const freshIds = msgs.filter(m => !state.knownIds.has(m.id)).map(m => m.id);
                state.knownIds = newIds;
                state.messages = msgs;
                state.lastChecked = Date.now();
                renderInbox(freshIds);
                if (freshIds.length && state.messages.length) {
                    showToast(`${freshIds.length} new message${freshIds.length > 1 ? 's' : ''} received`, 'success');
                }
            } catch (e) {
                console.error('Fetch messages error:', e);
            } finally {
                state.fetching = false;
            }
        }

        async function fetchMessage(id) {
            if (!state.token) return null;
            const res = await fetch(`${API}/messages/${id}`, {
                headers: { 'Authorization': `Bearer ${state.token}` }
            });
            if (!res.ok) return null;
            return res.json();
        }

        async function deleteMessage(id) {
            if (!state.token) return;
            const res = await fetch(`${API}/messages/${id}`, {
                method: 'DELETE',
                headers: { 'Authorization': `Bearer ${state.token}` }
            });
            if (res.ok) {
                state.messages = state.messages.filter(m => m.id !== id);
                state.knownIds.delete(id);
                if (state.selectedId === id) {
                    state.selectedId = null;
                    state.selectedMsg = null;
                }
                renderInbox();
                renderDetail();
                closeMobileDetail();
                showToast('Message deleted', 'info');
                fetchMessages();
            }
        }

        async function markSeen(id) {
            if (!state.token) return;
            try {
                await fetch(`${API}/messages/${id}`, {
                    method: 'PATCH',
                    headers: {
                        'Authorization': `Bearer ${state.token}`,
                        'Content-Type': 'application/merge-patch+json'
                    },
                    body: JSON.stringify({ seen: true })
                });
                const msg = state.messages.find(m => m.id === id);
                if (msg) msg.seen = true;
            } catch (e) { /* silent */ }
        }

        async function reLogin() {
            if (!state.email || !state.password) return;
            try {
                state.token = await getToken(state.email, state.password);
            } catch (e) {
                showToast('Session expired. Please generate a new email.', 'error');
                stopPolling();
                resetState();
                renderEmailSection();
                renderInbox();
            }
        }

        function startPolling() {
            stopPolling();
            fetchMessages();
            pollTimer = setInterval(fetchMessages, POLL_INTERVAL);
            startStatusTimer();
        }

        function stopPolling() {
            clearInterval(pollTimer);
            clearInterval(statusTimer);
            pollTimer = null;
            statusTimer = null;
        }

        function startStatusTimer() {
            clearInterval(statusTimer);
            renderStatus();
            statusTimer = setInterval(renderStatus, 1000);
        }

        async function generateEmail() {
            if (state.loading) return;
            state.loading = true;
            state.selectedId = null;
            state.selectedMsg = null;
            state.messages = [];
            state.knownIds.clear();
            renderEmailSection();
            renderInbox();
            renderDetail();
            try {
                const account = await createAccount();
                const token = await getToken(account.address, account.password);
                state.email = account.address;
                state.password = account.password;
                state.accountId = account.id;
                state.token = token;
                showToast('Email address created', 'success');
                startPolling();
            } catch (e) {
                showToast(e.message || 'Failed to create email', 'error');
            } finally {
                state.loading = false;
                renderEmailSection();
            }
        }

        async function copyEmail() {
            if (!state.email) return;
            try {
                await navigator.clipboard.writeText(state.email);
                showToast('Copied to clipboard', 'success');
            } catch {
                const ta = document.createElement('textarea');
                ta.value = state.email;
                ta.style.position = 'fixed';
                ta.style.opacity = '0';
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                showToast('Copied to clipboard', 'success');
            }
        }

        async function selectMessage(id) {
            state.selectedId = id;
            renderInbox();
            markSeen(id);
            const msg = await fetchMessage(id);
            if (!msg) { showToast('Failed to load message', 'error'); return; }
            state.selectedMsg = msg;
            renderDetail();
            if (window.innerWidth < 768) {
                $mobileOverlay.classList.add('open');
                $mobilePanel.style.display = 'flex';
                renderMobileDetail(msg);
            }
        }

        function closeMobileDetail() {
            $mobileOverlay.classList.remove('open');
            $mobilePanel.style.display = 'none';
            $mobileDetail.innerHTML = '';
        }

        function resetState() {
            state.email = null;
            state.password = null;
            state.token = null;
            state.accountId = null;
            state.messages = [];
            state.knownIds.clear();
            state.selectedId = null;
            state.selectedMsg = null;
            state.loading = false;
            state.fetching = false;
            state.lastChecked = null;
        }

        function renderEmailSection() {
            if (state.loading) {
                $emailSection.innerHTML = `
                    <div class="loading-state">
                        <div class="spinner"></div>
                        <span>Creating your temporary email address...</span>
                    </div>`;
                return;
            }
            if (!state.email) {
                $emailSection.innerHTML = `
                    <div class="welcome-state">
                        <div class="welcome-icon"><i class="fa-regular fa-envelope"></i></div>
                        <h2>Create a Temporary Email</h2>
                        <p>Generate a disposable email address instantly. No sign-up required.</p>
                        <button class="btn btn-primary btn-lg" onclick="generateEmail()">
                            <i class="fa-solid fa-bolt"></i>
                            Generate Email
                        </button>
                    </div>`;
                return;
            }
            $emailSection.innerHTML = `
                <label class="email-label">Your Temporary Email Address</label>
                <div class="email-row">
                    <span class="email-text">${state.email}</span>
                    <button class="btn btn-primary btn-sm" onclick="copyEmail()">
                        <i class="fa-regular fa-copy"></i>
                        Copy
                    </button>
                </div>
                <div class="email-actions">
                    <button class="btn btn-ghost btn-sm" onclick="generateEmail()">
                        <i class="fa-solid fa-arrows-rotate"></i>
                        Generate New
                    </button>
                </div>
                <div class="email-meta">
                    <i class="fa-solid fa-clock" style="font-size:0.6875rem;"></i>
                    <span>Auto-refreshes every ${POLL_INTERVAL / 1000}s &middot; Messages are temporary and will be deleted</span>
                </div>`;
        }

        function renderInbox(freshIds = []) {
            const unread = state.messages.filter(m => !m.seen).length;
            const total = state.messages.length;
            if (total > 0) {
                $msgBadge.innerHTML = unread > 0
                    ? `<span class="badge">${unread} new</span>`
                    : `<span class="badge badge-muted">${total}</span>`;
            } else {
                $msgBadge.innerHTML = '';
            }
            if (!state.email) {
                $inboxMessages.innerHTML = `
                    <div class="inbox-empty">
                        <i class="fa-regular fa-envelope"></i>
                        <p>Generate an email first</p>
                    </div>`;
                return;
            }
            if (!state.messages.length) {
                $inboxMessages.innerHTML = `
                    <div class="inbox-empty">
                        <i class="fa-regular fa-bell"></i>
                        <p>Waiting for messages</p>
                        <p class="sub">Send an email to your temporary address above</p>
                    </div>`;
                return;
            }
            $inboxMessages.innerHTML = state.messages.map(m => {
                const senderName = m.from?.name || m.from?.address || 'Unknown';
                const senderAddr = m.from?.address || '';
                const isActive = m.id === state.selectedId;
                const isNew = freshIds.includes(m.id);
                let cls = 'msg-item';
                if (!m.seen) cls += ' unread';
                if (isActive) cls += ' active';
                if (isNew) cls += ' new-msg';
                return `
                    <div class="${cls}" onclick="selectMessage('${m.id}')" role="listitem" tabindex="0"
                         onkeydown="if(event.key==='Enter')selectMessage('${m.id}')">
                        <div class="msg-avatar">${getInitial(senderName)}</div>
                        <div class="msg-content">
                            <div class="msg-top">
                                <span class="msg-sender truncate" title="${senderAddr}">${senderName}</span>
                                <span class="msg-time">${relativeTime(m.createdAt)}</span>
                            </div>
                            <div class="msg-subject truncate">${m.subject || '(No subject)'}</div>
                            <div class="msg-intro truncate">${m.intro || ''}</div>
                        </div>
                    </div>`;
            }).join('');
        }

        function renderDetail() {
            const msg = state.selectedMsg;
            if (!msg) {
                $detailEmpty.style.display = 'flex';
                $detailContent.style.display = 'none';
                return;
            }
            $detailEmpty.style.display = 'none';
            $detailContent.style.display = 'flex';
            $detailContent.innerHTML = buildDetailHtml(msg, false);
            injectIframe($detailContent.querySelector('.detail-body'), msg);
        }

        function renderMobileDetail(msg) {
            $mobileDetail.innerHTML = buildDetailHtml(msg, true);
            injectIframe($mobileDetail.querySelector('.detail-body'), msg);
        }

        function buildDetailHtml(msg, isMobile) {
            const senderName = msg.from?.name || '';
            const senderAddr = msg.from?.address || '';
            const closeBtn = isMobile
                ? `<button class="btn btn-ghost btn-sm" onclick="closeMobileDetail()"><i class="fa-solid fa-xmark"></i> Close</button>`
                : '';
            const htmlContent = Array.isArray(msg.html) ? msg.html.join('') : (msg.html || '');
            const textContent = Array.isArray(msg.text) ? msg.text.join('\n') : (msg.text || '');
            const hasContent = htmlContent || textContent;
            return `
                <div class="detail-header">
                    ${closeBtn}
                    <div style="flex:1;"></div>
                    <button class="btn btn-ghost btn-icon btn-sm" title="Delete" onclick="deleteMessage('${msg.id}')">
                        <i class="fa-regular fa-trash-can"></i>
                    </button>
                </div>
                <div class="detail-subject">${msg.subject || '(No subject)'}</div>
                <div class="detail-meta">
                    <span><i class="fa-regular fa-user" style="font-size:0.75rem;"></i> <span class="meta-value">${senderName}</span> ${senderAddr ? `<span style="opacity:0.5;">&lt;${senderAddr}&gt;</span>` : ''}</span>
                    <span><i class="fa-regular fa-clock" style="font-size:0.75rem;"></i> <span class="meta-value">${new Date(msg.createdAt).toLocaleString()}</span></span>
                </div>
                <div class="detail-body">
                    ${hasContent ? '' : '<div style="padding:2rem;text-align:center;color:var(--muted-foreground);">No content</div>'}
                </div>
                <div class="detail-footer">
                    <button class="btn btn-destructive btn-sm" onclick="deleteMessage('${msg.id}')">
                        <i class="fa-regular fa-trash-can"></i> Delete
                    </button>
                </div>`;
        }

        function injectIframe(container, msg) {
            if (!container) return;
            const htmlContent = Array.isArray(msg.html) ? msg.html.join('') : (msg.html || '');
            const textContent = Array.isArray(msg.text) ? msg.text.join('\n') : (msg.text || '');
            const iframe = document.createElement('iframe');
            iframe.sandbox = 'allow-same-origin';
            iframe.title = 'Email content';
            container.appendChild(iframe);
            const doc = iframe.contentDocument || iframe.contentWindow.document;
            doc.open();
            if (htmlContent) {
                doc.write(`<!DOCTYPE html><html><head><style>
                    body { font-family:'DM Sans',system-ui,sans-serif; color:#d4d4d8; background:#18181b; padding:1.25rem; line-height:1.65; font-size:0.9rem; margin:0; }
                    img { max-width:100%; height:auto; }
                    a { color:#34d399; }
                    table { max-width:100%; }
                    pre,code { background:#27272a; padding:0.125rem 0.375rem; border-radius:0.25rem; font-size:0.85em; }
                    blockquote { border-left:3px solid #3f3f46; padding-left:1rem; margin-left:0; color:#a1a1aa; }
                </style></head><body>${sanitizeHtml(htmlContent)}</body></html>`);
            } else {
                doc.write(`<!DOCTYPE html><html><head><style>
                    body { font-family:'DM Sans',system-ui,sans-serif; color:#d4d4d8; background:#18181b; padding:1.25rem; line-height:1.65; font-size:0.9rem; margin:0; white-space:pre-wrap; word-wrap:break-word; }
                </style></head><body>${textContent.replace(/</g, '&lt;').replace(/>/g, '&gt;')}</body></html>`);
            }
            doc.close();
        }

        function renderStatus() {
            if (!state.token) { $statusBar.innerHTML = ''; return; }
            const secs = state.lastChecked ? Math.floor((Date.now() - state.lastChecked) / 1000) : '—';
            $statusBar.innerHTML = `
                <span class="listening-dot"></span>
                <span>Listening &middot; checked ${secs}s ago</span>`;
        }

        $refreshBtn.addEventListener('click', () => {
            fetchMessages();
            const icon = $refreshBtn.querySelector('i');
            icon.style.transition = 'transform 0.5s';
            icon.style.transform = 'rotate(360deg)';
            setTimeout(() => {
                icon.style.transition = 'none';
                icon.style.transform = '';
            }, 500);
        });

        $mobileOverlay.addEventListener('click', closeMobileDetail);
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeMobileDetail(); });

        renderEmailSection();
        renderInbox();
        renderStatus();
    </script>
</body>
</html>
