<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swiss Text To Hand | Pro</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- HTML2Canvas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;800&family=Indie+Flower&family=Caveat&family=Shadows+Into+Light&family=Architects+Daughter&family=Patrick+Hand&family=Gochi+Hand&family=Just+Another+Hand&family=Reenie+Beanie&display=swap" rel="stylesheet">

    <style>
        :root {
            --accent: #FF4F00;
            
            /* Default Dynamic Values */
            --hand-size: 24px;
            --hand-spacing: 0px;
            --word-spacing: 0px;
            --line-height: 40px; /* Important for lined paper sync */
            --paper-pt: 48px;
            --paper-px: 48px;
            --ink-opacity: 1;
        }
        
        body { font-family: 'Inter Tight', sans-serif; }
        
        /* Font Classes */
        .font-hand-1 { font-family: 'Indie Flower', cursive; }
        .font-hand-2 { font-family: 'Caveat', cursive; }
        .font-hand-3 { font-family: 'Shadows Into Light', cursive; }
        .font-hand-4 { font-family: 'Architects Daughter', cursive; }
        .font-hand-5 { font-family: 'Patrick Hand', cursive; }
        .font-hand-6 { font-family: 'Gochi Hand', cursive; }
        .font-hand-7 { font-family: 'Just Another Hand', cursive; }
        .font-hand-8 { font-family: 'Reenie Beanie', cursive; }

        /* Dynamic Output Styles */
        #output {
            font-size: var(--hand-size);
            letter-spacing: var(--hand-spacing);
            word-spacing: var(--word-spacing);
            line-height: var(--line-height);
            opacity: var(--ink-opacity);
            padding-top: var(--paper-pt);
            padding-left: var(--paper-px);
            padding-right: var(--paper-px);
            padding-bottom: 48px;
        }

        /* Smart Paper Styles */
        .paper-plain { background: white; }
        .paper-lined {
            /* The background size now listens to the line-height variable */
            background-image: linear-gradient(#999 1px, transparent 1px);
            background-size: 100% var(--line-height);
            background-position: 0 var(--paper-pt); /* Aligns lines with top padding */
        }
        .paper-grid {
            background-image: linear-gradient(#ddd 1px, transparent 1px), linear-gradient(90deg, #ddd 1px, transparent 1px);
            background-size: 20px 20px;
        }

        /* Custom Range Slider - Swiss Style */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            background: black;
            border: 2px solid white;
            cursor: pointer;
            margin-top: -7px;
            box-shadow: 0 0 0 1px black; /* Double border effect */
        }
        input[type=range]:hover::-webkit-slider-thumb {
            background: var(--accent);
            box-shadow: 0 0 0 1px var(--accent);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 2px;
            background: #e5e5e5;
        }
        input[type=range]:focus::-webkit-slider-runnable-track {
            background: #ccc;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #000; }
    </style>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'swiss-accent': '#FF4F00',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-white text-black min-h-screen flex flex-col selection:bg-swiss-accent selection:text-white">

    <!-- Header -->
    <header class="w-full border-b-2 border-black p-4 md:p-6 shrink-0 bg-white z-20">
        <div class="max-w-[1800px] mx-auto flex justify-between items-end">
            <h1 class="text-3xl md:text-6xl font-extrabold tracking-tighter uppercase leading-[0.9]">
                Text To<br>
                <span class="text-swiss-accent">Handwriting</span>
            </h1>
            <div class="hidden md:block text-xs font-bold uppercase tracking-widest opacity-40 text-right">
                
            </div>
        </div>
    </header>

    <!-- Main Grid -->
    <main class="flex-1 grid grid-cols-1 lg:grid-cols-12 min-h-0">
        
        <!-- COLUMN 1: CONTROLS (Scrollable) -->
        <section class="lg:col-span-4 xl:col-span-3 border-b-2 lg:border-b-0 lg:border-r-2 border-black flex flex-col bg-white order-2 lg:order-1 h-full lg:h-[calc(100vh-140px)] lg:overflow-y-auto">
            
            <div class="p-6 md:p-8 space-y-10">
                
                <!-- 1. Typography Selection -->
                <div>
                    <h2 class="text-xs font-bold uppercase tracking-widest mb-4 opacity-60 border-b border-gray-200 pb-2">1. Typeface</h2>
                    <div class="grid grid-cols-2 gap-2">
                        <button onclick="setFont('font-hand-1')" class="border border-black p-2 hover:bg-black hover:text-white transition-colors text-sm font-hand-1 truncate">Indie Flower</button>
                        <button onclick="setFont('font-hand-2')" class="border border-black p-2 hover:bg-black hover:text-white transition-colors text-sm font-hand-2 truncate">Caveat</button>
                        <button onclick="setFont('font-hand-3')" class="border border-black p-2 hover:bg-black hover:text-white transition-colors text-sm font-hand-3 truncate">Shadows</button>
                        <button onclick="setFont('font-hand-4')" class="border border-black p-2 hover:bg-black hover:text-white transition-colors text-sm font-hand-4 truncate">Architects</button>
                        <button onclick="setFont('font-hand-5')" class="border border-black p-2 hover:bg-black hover:text-white transition-colors text-sm font-hand-5 truncate">Patrick</button>
                        <button onclick="setFont('font-hand-6')" class="border border-black p-2 hover:bg-black hover:text-white transition-colors text-sm font-hand-6 truncate">Gochi</button>
                        <button onclick="setFont('font-hand-7')" class="border border-black p-2 hover:bg-black hover:text-white transition-colors text-sm font-hand-7 truncate">Marker</button>
                        <button onclick="setFont('font-hand-8')" class="border border-black p-2 hover:bg-black hover:text-white transition-colors text-sm font-hand-8 truncate">Reenie</button>
                    </div>
                </div>

                <!-- 2. Fine Tuning (New Features) -->
                <div>
                    <h2 class="text-xs font-bold uppercase tracking-widest mb-6 opacity-60 border-b border-gray-200 pb-2">2. Adjustments</h2>
                    
                    <div class="space-y-6">
                        <!-- Font Size -->
                        <div>
                            <div class="flex justify-between mb-2">
                                <label class="text-xs font-bold uppercase">Size</label>
                                <span id="val-size" class="text-xs font-mono opacity-50">24px</span>
                            </div>
                            <input type="range" min="12" max="64" value="24" oninput="updateVar('--hand-size', this.value + 'px', 'val-size')">
                        </div>

                        <!-- Letter Spacing -->
                        <div>
                            <div class="flex justify-between mb-2">
                                <label class="text-xs font-bold uppercase">Letter Spacing</label>
                                <span id="val-space" class="text-xs font-mono opacity-50">0px</span>
                            </div>
                            <input type="range" min="-2" max="10" step="0.5" value="0" oninput="updateVar('--hand-spacing', this.value + 'px', 'val-space')">
                        </div>

                        <!-- Word Spacing -->
                        <div>
                            <div class="flex justify-between mb-2">
                                <label class="text-xs font-bold uppercase">Word Spacing</label>
                                <span id="val-wspace" class="text-xs font-mono opacity-50">0px</span>
                            </div>
                            <input type="range" min="-5" max="30" step="1" value="0" oninput="updateVar('--word-spacing', this.value + 'px', 'val-wspace')">
                        </div>

                        <!-- Line Height (Synced with Lines) -->
                        <div>
                            <div class="flex justify-between mb-2">
                                <label class="text-xs font-bold uppercase text-swiss-accent">Line Height</label>
                                <span id="val-line" class="text-xs font-mono opacity-50">40px</span>
                            </div>
                            <input type="range" min="20" max="100" value="40" oninput="updateVar('--line-height', this.value + 'px', 'val-line')">
                            <p class="text-[10px] mt-1 text-gray-400">*Syncs with paper lines</p>
                        </div>

                         <!-- Ink Opacity -->
                         <div>
                            <div class="flex justify-between mb-2">
                                <label class="text-xs font-bold uppercase">Ink Flow</label>
                                <span id="val-flow" class="text-xs font-mono opacity-50">100%</span>
                            </div>
                            <input type="range" min="0.3" max="1" step="0.1" value="1" oninput="updateVar('--ink-opacity', this.value, 'val-flow', '%')">
                        </div>
                    </div>
                </div>

                <!-- 3. Paper Settings -->
                <div>
                    <h2 class="text-xs font-bold uppercase tracking-widest mb-4 opacity-60 border-b border-gray-200 pb-2">3. Surface</h2>
                    
                    <div class="flex gap-4 mb-6">
                        <button onclick="setPaper('paper-plain')" class="w-8 h-8 border border-black hover:bg-swiss-accent focus:ring-2 ring-swiss-accent ring-offset-2"></button>
                        <button onclick="setPaper('paper-lined')" class="w-8 h-8 border border-black bg-[linear-gradient(black_1px,transparent_1px)] bg-[length:100%_4px] hover:bg-swiss-accent focus:ring-2 ring-swiss-accent ring-offset-2"></button>
                        <button onclick="setPaper('paper-grid')" class="w-8 h-8 border border-black bg-[url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0IiBoZWlnaHQ9IjQiPjxyZWN0IHdpZHRoPSI0IiBoZWlnaHQ9IjQiIGZpbGw9IiNmZmYiLz48cmVjdCB3aWR0aD0iMSIgaGVpZ2h0PSIxIiBmaWxsPSIjMDAwIi8+PC9zdmc+')] hover:bg-swiss-accent focus:ring-2 ring-swiss-accent ring-offset-2"></button>
                    </div>

                    <!-- Margins -->
                    <div class="space-y-4">
                        <div>
                            <div class="flex justify-between mb-2">
                                <label class="text-xs font-bold uppercase">Top Margin</label>
                                <span id="val-mt" class="text-xs font-mono opacity-50">48px</span>
                            </div>
                            <input type="range" min="0" max="200" value="48" oninput="updateVar('--paper-pt', this.value + 'px', 'val-mt')">
                        </div>
                        <div>
                            <div class="flex justify-between mb-2">
                                <label class="text-xs font-bold uppercase">Side Margin</label>
                                <span id="val-mx" class="text-xs font-mono opacity-50">48px</span>
                            </div>
                            <input type="range" min="10" max="150" value="48" oninput="updateVar('--paper-px', this.value + 'px', 'val-mx')">
                        </div>
                    </div>
                </div>

                 <!-- 4. Ink Color -->
                 <div>
                    <h2 class="text-xs font-bold uppercase tracking-widest mb-4 opacity-60 border-b border-gray-200 pb-2">4. Ink Color</h2>
                    <div class="flex gap-3">
                        <button onclick="setInk('text-black')" class="w-6 h-6 rounded-full bg-black border border-gray-300 hover:scale-125 transition-transform"></button>
                        <button onclick="setInk('text-blue-800')" class="w-6 h-6 rounded-full bg-blue-800 border border-gray-300 hover:scale-125 transition-transform"></button>
                        <button onclick="setInk('text-red-700')" class="w-6 h-6 rounded-full bg-red-700 border border-gray-300 hover:scale-125 transition-transform"></button>
                        <button onclick="setInk('text-green-700')" class="w-6 h-6 rounded-full bg-green-700 border border-gray-300 hover:scale-125 transition-transform"></button>
                        <button onclick="setInk('text-gray-500')" class="w-6 h-6 rounded-full bg-gray-500 border border-gray-300 hover:scale-125 transition-transform"></button>
                    </div>
                </div>

            </div>
        </section>


        <!-- COLUMN 2: INPUT & PREVIEW AREA -->
        <section class="lg:col-span-8 xl:col-span-9 bg-gray-50 flex flex-col items-center order-1 lg:order-2 lg:h-[calc(100vh-140px)] lg:overflow-y-auto relative">
            
            <div class="w-full max-w-[900px] p-4 md:p-8 flex flex-col gap-8">
                
                <!-- Input Box (Minimal) -->
                <div class="w-full">
                    <textarea 
                        id="textInput" 
                        placeholder="Type your notes here..." 
                        class="w-full p-4 bg-white border border-gray-300 focus:border-swiss-accent focus:ring-1 focus:ring-swiss-accent outline-none min-h-[100px] font-sans text-sm resize-y"
                        oninput="updatePreview()"
                    ></textarea>
                </div>

                <!-- Preview Stage -->
                <div class="w-full flex justify-center pb-20"> <!-- pb-20 for button space -->
                    <div id="captureArea" class="bg-white shadow-2xl w-full max-w-[800px] min-h-[1000px] paper-plain transition-all duration-100 ease-linear">
                        <div id="output" class="font-hand-1 text-black whitespace-pre-wrap break-words w-full h-full"></div>
                    </div>
                </div>
            </div>

            <!-- Floating Download Button -->
            <div class="fixed bottom-6 right-6 md:bottom-10 md:right-10 z-50">
                <button onclick="downloadImage()" class="bg-swiss-accent text-white px-8 py-4 text-sm md:text-base font-bold uppercase tracking-widest hover:bg-black transition-colors shadow-xl flex items-center gap-3">
                    Download
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                    </svg>
                </button>
            </div>

        </section>

    </main>

    <!-- JS Logic -->
    <script>
        const input = document.getElementById('textInput');
        const output = document.getElementById('output');
        const captureArea = document.getElementById('captureArea');
        const root = document.documentElement;

        // Update Text
        function updatePreview() {
            if(input.value.trim() === "") {
                output.textContent = "Start typing to visualize text...";
                output.style.opacity = "0.5";
            } else {
                output.textContent = input.value;
                output.style.opacity = getComputedStyle(root).getPropertyValue('--ink-opacity');
            }
        }

        // Update CSS Variable (Sliders)
        function updateVar(variable, value, displayId, suffix = '') {
            root.style.setProperty(variable, value);
            if(displayId) {
                // Formatting for display (e.g., converting 0.5 to 50%)
                let displayVal = value;
                if(suffix === '%') {
                    displayVal = Math.round(parseFloat(value) * 100) + '%';
                }
                document.getElementById(displayId).textContent = displayVal;
            }
            // Re-trigger opacity check if needed
            if(variable === '--ink-opacity' && input.value.trim() !== "") {
                output.style.opacity = value;
            }
        }

        // Set Font Family
        function setFont(fontClass) {
            output.className = output.className.replace(/font-hand-\d/g, '');
            output.classList.add(fontClass);
        }

        // Set Paper Type
        function setPaper(paperClass) {
            captureArea.className = captureArea.className.replace(/paper-\w+/g, '');
            captureArea.classList.add(paperClass);
        }

        // Set Ink Color
        function setInk(colorClass) {
            output.className = output.className.replace(/text-\w+(-\d+)?/g, '');
            output.classList.remove('text-black');
            output.classList.add(colorClass);
        }

        // Download
        function downloadImage() {
            window.scrollTo(0,0);
            html2canvas(captureArea, {
                scale: 2,
                useCORS: true,
                backgroundColor: null 
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'swiss-note-' + Date.now() + '.png';
                link.href = canvas.toDataURL();
                link.click();
            });
        }

        // Initialize
        updatePreview();
    </script>
</body>
</html>
