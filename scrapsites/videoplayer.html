<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swiss Player Overlay 2025</title>
    
    <!-- Fonts: Inter Tight -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Inter Tight"', 'sans-serif'],
                    },
                    colors: {
                        'swiss-red': '#FF2400',
                        'swiss-offwhite': '#F5F5F5'
                    },
                    screens: { 'md': '850px' }
                }
            }
        }
    </script>
    
    <!-- YouTube API -->
    <script src="https://www.youtube.com/iframe_api"></script>
    
    <style>
        video::-webkit-media-controls { display: none !important; }
        .vol-bar.active { background-color: #FF2400; }
        .vol-bar.inactive { background-color: #E5E5E5; }
        input[type="text"] { outline: none; background: transparent; }
        button { -webkit-tap-highlight-color: transparent; }
        
        /* Fullscreen Logic: Overlay Controls */
        #playerContainer:fullscreen {
            border: none;
            width: 100vw;
            height: 100vh;
            max-width: none;
            position: relative; /* Anchor for absolute controls */
        }

        /* In fullscreen, controls float at bottom */
        #playerContainer:fullscreen #controlsGrid {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            border-top: none; /* Remove border for cleaner look */
            background: rgba(0,0,0,0.6); /* Semi-transparent background */
            backdrop-filter: blur(10px); /* Frosted glass effect */
            color: white; /* Force white text */
            z-index: 50;
        }

        /* Adjust button hover states in fullscreen for visibility */
        #playerContainer:fullscreen #controlsGrid button:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        
        /* Force white text in fullscreen controls */
        #playerContainer:fullscreen #controlsGrid button, 
        #playerContainer:fullscreen #controlsGrid div {
            color: white;
            border-color: rgba(255,255,255,0.2);
        }
        
        /* Hide layout border lines in fullscreen */
        #playerContainer:fullscreen #controlsGrid > * {
            border-color: rgba(255,255,255,0.1);
        }
    </style>
</head>
<body class="bg-white text-black font-sans antialiased min-h-screen flex flex-col items-center justify-center p-2 md:p-8">

    <!-- Player Wrapper -->
    <div id="playerContainer" class="w-full max-w-6xl border-2 border-black bg-black shadow-none md:shadow-[12px_12px_0px_0px_rgba(0,0,0,1)] transition-all flex flex-col group/container relative">
        
        <!-- 1. Video Stage -->
        <!-- In fullscreen, this is absolute and covers everything -->
        <div class="relative w-full aspect-video bg-neutral-900 overflow-hidden cursor-pointer group flex items-center justify-center transition-all duration-300" id="videoWrapper">
            
            <video id="mainVideo" class="w-full h-full object-contain absolute inset-0 z-0" playsinline>
                <source src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4" type="video/mp4">
            </video>

            <div id="ytPlayerContainer" class="absolute inset-0 z-0 hidden w-full h-full bg-black">
                <div id="ytPlayer"></div>
            </div>

            <div id="overlayText" class="absolute inset-0 flex items-center justify-center pointer-events-none mix-blend-difference z-10 transition-opacity duration-300">
                <h1 class="text-[15vw] md:text-[12vw] leading-none font-black tracking-tighter text-white">WATCH</h1>
            </div>

            <div class="absolute top-4 right-4 z-20">
                <div id="sourceLabel" class="bg-swiss-red text-white text-[10px] font-bold uppercase tracking-widest px-2 py-1">
                    Standard Feed
                </div>
            </div>
            
            <div id="clickLayer" class="absolute inset-0 z-20 bg-transparent"></div>
        </div>

        <!-- 2. Controls Grid -->
        <!-- Stays static normally, becomes absolute bottom-0 in fullscreen via CSS -->
        <div id="controlsGrid" class="bg-white w-full border-t-2 border-black grid grid-cols-4 md:grid-cols-12 divide-y-2 md:divide-y-0 md:divide-x-2 divide-black border-collapse relative z-30 shrink-0 transition-colors duration-300">
            
            <!-- Scrubber -->
            <div class="order-1 md:order-3 col-span-4 md:col-span-4 flex items-center px-0 md:px-6 relative h-12 md:h-16 group/scrubber bg-transparent">
                <div id="progressBarContainer" class="w-full h-full flex items-center cursor-pointer relative">
                    <div class="w-full h-2 md:h-1 bg-neutral-200/50 md:bg-neutral-200 relative pointer-events-none">
                        <div id="progressFill" class="absolute top-0 left-0 h-full w-0 bg-swiss-red z-10"></div>
                        <div id="scrubThumb" class="absolute top-0 w-2 h-full md:w-4 md:h-4 md:-mt-1.5 bg-black opacity-100 md:opacity-0 group-hover/scrubber:opacity-100 transition-opacity" style="left: 0;"></div>
                    </div>
                </div>
            </div>

            <!-- Transport -->
            <button id="skipBackBtn" class="order-2 md:order-1 col-span-1 md:col-span-1 flex items-center justify-center hover:bg-black hover:text-white transition-colors h-16 md:h-16 border-r-2 md:border-r-0 border-black md:border-none">
                <span class="font-bold text-xs tracking-tighter">-10s</span>
            </button>
            <button id="playBtn" class="order-2 md:order-1 col-span-1 md:col-span-1 flex items-center justify-center hover:bg-swiss-red hover:text-white transition-colors h-16 md:h-16 border-r-2 md:border-r-0 border-black md:border-none">
                <span id="playText" class="font-black text-sm md:text-base tracking-tighter">PLAY</span>
            </button>
            <button id="skipFwdBtn" class="order-2 md:order-1 col-span-1 md:col-span-1 flex items-center justify-center hover:bg-black hover:text-white transition-colors h-16 md:h-16">
                <span class="font-bold text-xs tracking-tighter">+10s</span>
            </button>

            <!-- Time -->
            <div class="order-3 md:order-2 col-span-2 md:col-span-2 flex items-center justify-center font-mono text-xs md:text-sm tracking-tight font-medium h-16 md:h-16 border-r-2 md:border-r-0 border-black md:border-none border-t-2 md:border-t-0 bg-transparent">
                <span id="currentTime">00:00</span> <span class="text-neutral-400 mx-1">/</span> <span id="duration">00:00</span>
            </div>

            <!-- Speed -->
            <button id="speedBtn" class="order-2 md:order-4 col-span-1 md:col-span-1 flex items-center justify-center hover:bg-black hover:text-white transition-colors h-16 md:h-16 border-l-2 border-black md:border-none">
                <span class="font-bold text-xs tracking-tight">1.0X</span>
            </button>

            <!-- PiP -->
            <button id="pipBtn" class="order-3 md:order-4 col-span-1 md:col-span-1 flex items-center justify-center hover:bg-black hover:text-white transition-colors h-16 md:h-16 border-t-2 md:border-t-0 border-black md:border-none">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
                    <path stroke-linecap="square" stroke-linejoin="miter" d="M13.5 4.5h6m0 0v6m0-6-9 9" />
                    <path stroke-linecap="square" stroke-linejoin="miter" d="M18 13.5v6a1.5 1.5 0 0 1-1.5 1.5h-12A1.5 1.5 0 0 1 3 19.5v-12A1.5 1.5 0 0 1 4.5 6h6" />
                </svg>
            </button>

            <!-- Fullscreen -->
            <button id="fsBtn" class="order-3 md:order-4 col-span-1 md:col-span-1 flex items-center justify-center hover:bg-swiss-red hover:text-white transition-colors h-16 md:h-16 border-t-2 md:border-t-0 border-l-2 border-black">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
                    <path stroke-linecap="square" d="M3.75 3.75v4.5m0-4.5h4.5m-4.5 0L9 9M3.75 20.25v-4.5m0 4.5h4.5m-4.5 0L9 15M20.25 3.75h-4.5m4.5 0v4.5m0-4.5L15 9m5.25 11.25h-4.5m4.5 0v-4.5m0 4.5L15 15" />
                </svg>
            </button>
        </div>

        <!-- 3. Source Loader -->
        <div id="inputSection" class="bg-swiss-offwhite w-full border-t-2 border-black grid grid-cols-1 md:grid-cols-12 divide-y-2 md:divide-y-0 md:divide-x-2 divide-black shrink-0 transition-all">
            <div class="col-span-1 md:col-span-8 flex items-center relative h-14 md:h-16 bg-white">
                <div class="absolute left-0 top-0 h-full w-12 flex items-center justify-center border-r-2 border-neutral-100">
                    <span class="font-bold text-xs text-neutral-400">URL</span>
                </div>
                <input type="text" id="urlInput" placeholder="PASTE LINK (YOUTUBE OR MP4)..." class="w-full h-full pl-16 pr-4 text-xs md:text-sm font-mono font-medium tracking-tight placeholder-neutral-400 text-black uppercase">
            </div>
            <div class="col-span-1 md:col-span-4 grid grid-cols-2 divide-x-2 divide-black">
                <button id="loadUrlBtn" class="h-14 md:h-16 bg-white hover:bg-black hover:text-white transition-colors font-bold text-xs tracking-widest uppercase">
                    Load Link
                </button>
                <div class="relative h-14 md:h-16 bg-swiss-red hover:bg-red-700 transition-colors">
                    <input type="file" id="fileInput" accept="video/*" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-20">
                    <div class="absolute inset-0 flex items-center justify-center text-white z-10 pointer-events-none">
                        <span class="font-bold text-xs tracking-widest uppercase flex items-center gap-2">Upload File</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Logic Script -->
    <script>
        let playerMode = 'native';
        let ytPlayer = null;
        let ytTimer = null;

        function getYoutubeId(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|&v=)([^#&?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        function onYouTubeIframeAPIReady() {}

        function createYTPlayer(videoId) {
            if (ytPlayer) { ytPlayer.loadVideoById(videoId); } 
            else {
                ytPlayer = new YT.Player('ytPlayer', {
                    height: '100%', width: '100%', videoId: videoId,
                    playerVars: { 'playsinline': 1, 'controls': 0, 'modestbranding': 1, 'rel': 0, 'showinfo': 0 },
                    events: { 'onStateChange': onPlayerStateChange, 'onReady': onPlayerReady }
                });
            }
        }
        function onPlayerReady(event) { event.target.playVideo(); }
        function onPlayerStateChange(event) {
            const playText = document.getElementById('playText');
            const overlayText = document.getElementById('overlayText');
            if (event.data === YT.PlayerState.PLAYING) {
                playText.textContent = "PAUSE";
                overlayText.classList.add('opacity-0');
                startYTTimer();
            } else {
                playText.textContent = "PLAY";
                overlayText.classList.remove('opacity-0');
                stopYTTimer();
            }
        }
        function startYTTimer() { stopYTTimer(); ytTimer = setInterval(updateYTTime, 500); }
        function stopYTTimer() { if (ytTimer) clearInterval(ytTimer); }

        document.addEventListener('DOMContentLoaded', () => {
            const video = document.getElementById('mainVideo');
            const ytContainer = document.getElementById('ytPlayerContainer');
            const overlayText = document.getElementById('overlayText');
            const sourceLabel = document.getElementById('sourceLabel');
            const clickLayer = document.getElementById('clickLayer');
            const playerContainer = document.getElementById('playerContainer');
            const videoWrapper = document.getElementById('videoWrapper');
            const inputSection = document.getElementById('inputSection');
            const controlsGrid = document.getElementById('controlsGrid');

            // Fullscreen Logic
            document.addEventListener('fullscreenchange', () => {
                if (document.fullscreenElement) {
                    // ENTER FULLSCREEN
                    inputSection.classList.add('hidden');
                    videoWrapper.classList.remove('aspect-video');
                    videoWrapper.classList.add('h-full', 'w-full'); // Use full size
                    // Controls are handled by CSS absolute positioning
                    
                    // Force Scrub Thumb to be white in fullscreen for better contrast
                    document.getElementById('scrubThumb').style.backgroundColor = "white";
                } else {
                    // EXIT FULLSCREEN
                    inputSection.classList.remove('hidden');
                    videoWrapper.classList.add('aspect-video');
                    videoWrapper.classList.remove('h-full', 'w-full');
                    
                    // Revert scrub thumb
                    document.getElementById('scrubThumb').style.backgroundColor = "black";
                }
            });

            // Standard Controls
            const playBtn = document.getElementById('playBtn');
            const playText = document.getElementById('playText');
            const timeDisplay = document.getElementById('currentTime');
            const durationDisplay = document.getElementById('duration');
            const progressBarContainer = document.getElementById('progressBarContainer');
            const progressFill = document.getElementById('progressFill');
            const scrubThumb = document.getElementById('scrubThumb');

            function formatTime(seconds) {
                if(isNaN(seconds)) return "00:00";
                const m = Math.floor(seconds / 60);
                const s = Math.floor(seconds % 60);
                return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
            }

            function switchMode(mode) {
                playerMode = mode;
                video.pause();
                stopYTTimer();
                if (mode === 'youtube') {
                    video.classList.add('hidden');
                    ytContainer.classList.remove('hidden');
                    sourceLabel.textContent = "YOUTUBE";
                    document.getElementById('pipBtn').style.opacity = '0.3'; 
                } else {
                    if (ytPlayer && ytPlayer.pauseVideo) ytPlayer.pauseVideo();
                    video.classList.remove('hidden');
                    ytContainer.classList.add('hidden');
                    sourceLabel.textContent = "LOCAL/WEB";
                    document.getElementById('pipBtn').style.opacity = '1';
                }
                sourceLabel.classList.remove('bg-swiss-red');
                sourceLabel.classList.add('bg-black');
            }

            function togglePlay() {
                if (playerMode === 'native') {
                    if (video.paused) {
                        video.play();
                        playText.textContent = "PAUSE";
                        overlayText.classList.add('opacity-0');
                    } else {
                        video.pause();
                        playText.textContent = "PLAY";
                        overlayText.classList.remove('opacity-0');
                    }
                } else if (playerMode === 'youtube' && ytPlayer) {
                    const state = ytPlayer.getPlayerState();
                    if (state === 1) ytPlayer.pauseVideo();
                    else ytPlayer.playVideo();
                }
            }
            playBtn.addEventListener('click', togglePlay);
            clickLayer.addEventListener('click', togglePlay);

            document.getElementById('skipBackBtn').addEventListener('click', () => {
                if(playerMode === 'native') video.currentTime = Math.max(0, video.currentTime - 10);
                else if(ytPlayer) ytPlayer.seekTo(ytPlayer.getCurrentTime() - 10, true);
            });
            document.getElementById('skipFwdBtn').addEventListener('click', () => {
                if(playerMode === 'native') video.currentTime = Math.min(video.duration, video.currentTime + 10);
                else if(ytPlayer) ytPlayer.seekTo(ytPlayer.getCurrentTime() + 10, true);
            });

            const speeds = [1.0, 1.5, 2.0];
            let speedIndex = 0;
            document.getElementById('speedBtn').addEventListener('click', function() {
                speedIndex = (speedIndex + 1) % speeds.length;
                const spd = speeds[speedIndex];
                this.querySelector('span').textContent = spd.toFixed(1) + "X";
                if(playerMode === 'native') video.playbackRate = spd;
                else if(ytPlayer) ytPlayer.setPlaybackRate(spd);
            });

            progressBarContainer.addEventListener('click', (e) => {
                e.stopPropagation();
                const rect = progressBarContainer.getBoundingClientRect();
                const pos = (e.clientX - rect.left) / rect.width;
                if(playerMode === 'native' && video.duration) {
                    video.currentTime = pos * video.duration;
                } else if(playerMode === 'youtube' && ytPlayer) {
                    const dur = ytPlayer.getDuration();
                    ytPlayer.seekTo(pos * dur, true);
                }
            });

            video.addEventListener('timeupdate', () => {
                if(playerMode !== 'native') return;
                const percent = (video.currentTime / video.duration) * 100;
                updateUI(video.currentTime, video.duration, percent);
            });
            video.addEventListener('loadedmetadata', () => {
                if(playerMode === 'native') durationDisplay.textContent = formatTime(video.duration);
            });

            window.updateYTTime = function() {
                if(!ytPlayer || !ytPlayer.getCurrentTime) return;
                const curr = ytPlayer.getCurrentTime();
                const dur = ytPlayer.getDuration();
                if(dur) {
                    const percent = (curr / dur) * 100;
                    updateUI(curr, dur, percent);
                }
            };

            function updateUI(curr, dur, percent) {
                progressFill.style.width = `${percent}%`;
                scrubThumb.style.left = `${percent}%`;
                timeDisplay.textContent = formatTime(curr);
                durationDisplay.textContent = formatTime(dur);
            }

            const urlInput = document.getElementById('urlInput');
            document.getElementById('loadUrlBtn').addEventListener('click', () => {
                const val = urlInput.value.trim();
                if(!val) return;
                const ytId = getYoutubeId(val);
                if (ytId) {
                    switchMode('youtube');
                    createYTPlayer(ytId);
                } else {
                    switchMode('native');
                    video.src = val;
                    video.load();
                    video.play();
                }
            });

            document.getElementById('fileInput').addEventListener('change', (e) => {
                const file = e.target.files[0];
                if(file) {
                    switchMode('native');
                    video.src = URL.createObjectURL(file);
                    video.load();
                    video.play();
                }
            });

            document.getElementById('fsBtn').addEventListener('click', () => {
                if(!document.fullscreenElement) playerContainer.requestFullscreen();
                else document.exitFullscreen();
            });
            
            document.getElementById('pipBtn').addEventListener('click', async () => {
                if(playerMode === 'native') {
                   if (video !== document.pictureInPictureElement) await video.requestPictureInPicture();
                   else await document.exitPictureInPicture(); 
                }
            });
        });
    </script>
</body>
</html>
