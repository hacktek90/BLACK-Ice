<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swiss Player Ultimate 2025</title>
    
    <!-- Fonts: Inter Tight -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Inter Tight"', 'sans-serif'],
                    },
                    colors: {
                        'swiss-red': '#FF2400',
                        'swiss-offwhite': '#F5F5F5'
                    },
                    screens: {
                        'md': '850px' 
                    }
                }
            }
        }
    </script>
    
    <style>
        video::-webkit-media-controls { display: none !important; }
        .vol-bar.active { background-color: #FF2400; }
        .vol-bar.inactive { background-color: #E5E5E5; }
        input[type="text"] { outline: none; background: transparent; }
        button { -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body class="bg-white text-black font-sans antialiased min-h-screen flex flex-col items-center justify-center p-2 md:p-8">

    <!-- Player Wrapper -->
    <div id="playerContainer" class="w-full max-w-6xl border-2 border-black bg-black shadow-none md:shadow-[12px_12px_0px_0px_rgba(0,0,0,1)] transition-all flex flex-col">
        
        <!-- 1. Video Stage -->
        <div class="relative w-full aspect-video bg-neutral-900 overflow-hidden cursor-pointer group flex items-center justify-center" id="videoWrapper">
            <video id="mainVideo" class="w-full h-full object-contain" playsinline>
                <source src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4" type="video/mp4">
            </video>

            <!-- Overlay -->
            <div id="overlayText" class="absolute inset-0 flex items-center justify-center pointer-events-none mix-blend-difference z-10 transition-opacity duration-300">
                <h1 class="text-[15vw] md:text-[12vw] leading-none font-black tracking-tighter text-white">WATCH</h1>
            </div>

            <!-- Status Badge -->
            <div class="absolute top-4 right-4 z-20">
                <div id="sourceLabel" class="bg-swiss-red text-white text-[10px] font-bold uppercase tracking-widest px-2 py-1">
                    Standard Feed
                </div>
            </div>
        </div>

        <!-- 2. Controls Grid -->
        <div class="bg-white w-full border-t-2 border-black grid grid-cols-4 md:grid-cols-12 divide-y-2 md:divide-y-0 md:divide-x-2 divide-black border-collapse">
            
            <!-- Scrubber -->
            <div class="order-1 md:order-3 col-span-4 md:col-span-4 flex items-center px-0 md:px-6 relative h-12 md:h-16 bg-white group/scrubber">
                <div id="progressBarContainer" class="w-full h-full flex items-center cursor-pointer relative">
                    <div class="w-full h-2 md:h-1 bg-neutral-200 relative pointer-events-none">
                        <div id="progressFill" class="absolute top-0 left-0 h-full w-0 bg-swiss-red z-10"></div>
                        <div id="scrubThumb" class="absolute top-0 w-2 h-full md:w-4 md:h-4 md:-mt-1.5 bg-black opacity-100 md:opacity-0 group-hover/scrubber:opacity-100 transition-opacity" style="left: 0;"></div>
                    </div>
                </div>
            </div>

            <!-- Transport Controls -->
            <button id="skipBackBtn" class="order-2 md:order-1 col-span-1 md:col-span-1 flex items-center justify-center hover:bg-black hover:text-white transition-colors h-16 md:h-16 border-r-2 md:border-r-0 border-black md:border-none">
                <span class="font-bold text-xs tracking-tighter">-10s</span>
            </button>

            <button id="playBtn" class="order-2 md:order-1 col-span-1 md:col-span-1 flex items-center justify-center hover:bg-swiss-red hover:text-white transition-colors h-16 md:h-16 border-r-2 md:border-r-0 border-black md:border-none">
                <span id="playText" class="font-black text-sm md:text-base tracking-tighter">PLAY</span>
            </button>

            <button id="skipFwdBtn" class="order-2 md:order-1 col-span-1 md:col-span-1 flex items-center justify-center hover:bg-black hover:text-white transition-colors h-16 md:h-16">
                <span class="font-bold text-xs tracking-tighter">+10s</span>
            </button>

            <!-- Time -->
            <div class="order-3 md:order-2 col-span-2 md:col-span-2 flex items-center justify-center font-mono text-xs md:text-sm tracking-tight font-medium h-16 md:h-16 border-r-2 md:border-r-0 border-black md:border-none border-t-2 md:border-t-0 bg-white">
                <span id="currentTime">00:00</span> 
                <span class="text-neutral-400 mx-1">/</span> 
                <span id="duration">00:00</span>
            </div>

            <!-- Speed -->
            <button id="speedBtn" class="order-2 md:order-4 col-span-1 md:col-span-1 flex items-center justify-center hover:bg-black hover:text-white transition-colors h-16 md:h-16 border-l-2 border-black md:border-none">
                <span class="font-bold text-xs tracking-tight">1.0X</span>
            </button>

            <!-- PiP Button (Updated Icon) -->
            <button id="pipBtn" class="order-3 md:order-4 col-span-1 md:col-span-1 flex items-center justify-center hover:bg-black hover:text-white transition-colors h-16 md:h-16 border-t-2 md:border-t-0 border-black md:border-none" title="Picture in Picture">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
                    <!-- Standard "Pop Out" Icon: Rectangle with Arrow leaving -->
                    <path stroke-linecap="square" stroke-linejoin="miter" d="M13.5 4.5h6m0 0v6m0-6-9 9" />
                    <path stroke-linecap="square" stroke-linejoin="miter" d="M18 13.5v6a1.5 1.5 0 0 1-1.5 1.5h-12A1.5 1.5 0 0 1 3 19.5v-12A1.5 1.5 0 0 1 4.5 6h6" />
                </svg>
            </button>

            <!-- Fullscreen -->
            <button id="fsBtn" class="order-3 md:order-4 col-span-1 md:col-span-1 flex items-center justify-center hover:bg-swiss-red hover:text-white transition-colors h-16 md:h-16 border-t-2 md:border-t-0 border-l-2 border-black">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
                    <path stroke-linecap="square" d="M3.75 3.75v4.5m0-4.5h4.5m-4.5 0L9 9M3.75 20.25v-4.5m0 4.5h4.5m-4.5 0L9 15M20.25 3.75h-4.5m4.5 0v4.5m0-4.5L15 9m5.25 11.25h-4.5m4.5 0v-4.5m0 4.5L15 15" />
                </svg>
            </button>
        </div>

        <!-- 3. Source Loader -->
        <div class="bg-swiss-offwhite w-full border-t-2 border-black grid grid-cols-1 md:grid-cols-12 divide-y-2 md:divide-y-0 md:divide-x-2 divide-black">
            <!-- URL Input -->
            <div class="col-span-1 md:col-span-8 flex items-center relative h-14 md:h-16 bg-white">
                <div class="absolute left-0 top-0 h-full w-12 flex items-center justify-center border-r-2 border-neutral-100">
                    <span class="font-bold text-xs text-neutral-400">URL</span>
                </div>
                <input type="text" id="urlInput" placeholder="PASTE LINK..." class="w-full h-full pl-16 pr-4 text-xs md:text-sm font-mono font-medium tracking-tight placeholder-neutral-400 text-black uppercase">
            </div>

            <!-- Buttons -->
            <div class="col-span-1 md:col-span-4 grid grid-cols-2 divide-x-2 divide-black">
                <button id="loadUrlBtn" class="h-14 md:h-16 bg-white hover:bg-black hover:text-white transition-colors font-bold text-xs tracking-widest uppercase">
                    Load Link
                </button>
                <div class="relative h-14 md:h-16 bg-swiss-red hover:bg-red-700 transition-colors">
                    <input type="file" id="fileInput" accept="video/*" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-20">
                    <div class="absolute inset-0 flex items-center justify-center text-white z-10 pointer-events-none">
                        <span class="font-bold text-xs tracking-widest uppercase flex items-center gap-2">
                            Upload File
                        </span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Logic Script -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const video = document.getElementById('mainVideo');
            const playBtn = document.getElementById('playBtn');
            const playText = document.getElementById('playText');
            const overlayText = document.getElementById('overlayText');
            const sourceLabel = document.getElementById('sourceLabel');
            const skipBackBtn = document.getElementById('skipBackBtn');
            const skipFwdBtn = document.getElementById('skipFwdBtn');
            const speedBtn = document.getElementById('speedBtn');
            const pipBtn = document.getElementById('pipBtn');
            const urlInput = document.getElementById('urlInput');
            const loadUrlBtn = document.getElementById('loadUrlBtn');
            const fileInput = document.getElementById('fileInput');

            // --- 1. Navigation & Speed ---
            skipBackBtn.addEventListener('click', () => {
                video.currentTime = Math.max(0, video.currentTime - 10);
            });

            skipFwdBtn.addEventListener('click', () => {
                video.currentTime = Math.min(video.duration, video.currentTime + 10);
            });

            const speeds = [1.0, 1.5, 2.0];
            let speedIndex = 0;
            speedBtn.addEventListener('click', () => {
                speedIndex = (speedIndex + 1) % speeds.length;
                video.playbackRate = speeds[speedIndex];
                speedBtn.querySelector('span').textContent = speeds[speedIndex].toFixed(1) + "X";
            });

            // --- 2. PiP Logic ---
            pipBtn.addEventListener('click', async () => {
                try {
                    if (video !== document.pictureInPictureElement) {
                        await video.requestPictureInPicture();
                    } else {
                        await document.exitPictureInPicture();
                    }
                } catch (error) {
                    // Fallback visual feedback if PiP fails
                    pipBtn.style.color = '#FF2400';
                    setTimeout(() => pipBtn.style.color = '', 500);
                }
            });

            // --- 3. Play/Pause ---
            function togglePlay() {
                if (video.paused) {
                    video.play();
                    playText.textContent = "PAUSE";
                    overlayText.classList.add('opacity-0');
                } else {
                    video.pause();
                    playText.textContent = "PLAY";
                    overlayText.classList.remove('opacity-0');
                }
            }
            playBtn.addEventListener('click', togglePlay);
            document.getElementById('videoWrapper').addEventListener('click', togglePlay);

            // --- 4. Scrubbing ---
            const timeDisplay = document.getElementById('currentTime');
            const durationDisplay = document.getElementById('duration');
            const progressBarContainer = document.getElementById('progressBarContainer');
            const progressFill = document.getElementById('progressFill');
            const scrubThumb = document.getElementById('scrubThumb');

            function formatTime(seconds) {
                if(isNaN(seconds)) return "00:00";
                const m = Math.floor(seconds / 60);
                const s = Math.floor(seconds % 60);
                return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
            }

            video.addEventListener('loadedmetadata', () => {
                durationDisplay.textContent = formatTime(video.duration);
            });

            video.addEventListener('timeupdate', () => {
                if(!video.duration) return;
                const percent = (video.currentTime / video.duration) * 100;
                progressFill.style.width = `${percent}%`;
                scrubThumb.style.left = `${percent}%`;
                timeDisplay.textContent = formatTime(video.currentTime);
            });

            progressBarContainer.addEventListener('click', (e) => {
                e.stopPropagation();
                if(!video.duration) return;
                const rect = progressBarContainer.getBoundingClientRect();
                const pos = (e.clientX - rect.left) / rect.width;
                video.currentTime = pos * video.duration;
            });

            // --- 5. Sources ---
            loadUrlBtn.addEventListener('click', () => {
                if(urlInput.value.trim()) {
                    loadSource(urlInput.value.trim(), "WEB LINK");
                }
            });

            fileInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if(file) {
                    loadSource(URL.createObjectURL(file), "LOCAL FILE");
                }
            });

            function loadSource(src, label) {
                video.pause();
                video.src = src;
                video.load();
                sourceLabel.textContent = label;
                sourceLabel.classList.remove('bg-swiss-red');
                sourceLabel.classList.add('bg-black');
                playText.textContent = "PLAY";
                overlayText.classList.remove('opacity-0');
            }

            // --- 6. Fullscreen ---
            document.getElementById('fsBtn').addEventListener('click', () => {
                const el = document.getElementById('playerContainer');
                if(!document.fullscreenElement) el.requestFullscreen();
                else document.exitFullscreen();
            });
        });
    </script>
</body>
</html>
