<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pro Dual-Mode Video Player</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Plyr CSS CDN -->
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <!-- Feather Icons -->
    <script src="https://unpkg.com/feather-icons"></script>

    <style>
        /* --- GLOBAL VARIABLES & RESET --- */
        :root {
            --bg-app: #050505;
            --bg-panel: rgba(20, 20, 20, 0.65);
            --bg-glass: rgba(255, 255, 255, 0.03);
            --accent-1: #06b6d4;
            /* Cyan */
            --accent-2: #8b5cf6;
            /* Violet */
            --accent-grad: linear-gradient(135deg, var(--accent-1), var(--accent-2));
            --text-main: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.5);
            --border: rgba(255, 255, 255, 0.08);
            --radius-lg: 16px;
            --radius-md: 10px;
            --radius-sm: 6px;
            --blur: 24px;
            --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            outline: none;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-app);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* --- LAYOUT & MODE SWITCHER --- */
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            border-bottom: 1px solid var(--border);
            background: rgba(5, 5, 5, 0.8);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-weight: 700;
            font-size: 16px;
            letter-spacing: -0.02em;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo i {
            color: var(--accent-1);
        }

        .mode-switcher {
            background: var(--bg-glass);
            border: 1px solid var(--border);
            padding: 4px;
            border-radius: var(--radius-md);
            display: flex;
            position: relative;
        }

        .mode-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 6px 16px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            z-index: 2;
            transition: color 0.3s;
        }

        .mode-btn.active {
            color: #fff;
        }

        .mode-slider {
            position: absolute;
            top: 4px;
            left: 4px;
            width: calc(50% - 4px);
            height: calc(100% - 8px);
            background: var(--bg-panel);
            border-radius: 8px;
            border: 1px solid var(--border);
            transition: transform 0.3s var(--ease);
            z-index: 1;
        }

        /* Slider positions based on active class index */
        .mode-switcher[data-active="1"] .mode-slider {
            transform: translateX(0);
        }

        .mode-switcher[data-active="2"] .mode-slider {
            transform: translateX(100%);
        }

        /* --- MAIN CONTENT AREA --- */
        .main-stage {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            position: relative;
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
        }

        .player-container {
            width: 100%;
            max-width: 1200px;
            display: none;
            animation: fadeIn 0.4s var(--ease);
        }

        .player-container.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* --- GLOBAL FOOTER / UPLOAD --- */
        .global-footer {
            background: #0a0a0a;
            border-top: 1px solid var(--border);
            padding: 20px 24px;
            z-index: 90;
        }

        .upload-row {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
            flex-wrap: wrap;
            max-width: 1200px;
            margin: 0 auto 16px auto;
        }

        .url-input {
            flex: 1;
            min-width: 200px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            color: white;
            padding: 12px 16px;
            border-radius: var(--radius-md);
            font-size: 14px;
            transition: 0.2s;
        }

        .url-input:focus {
            border-color: var(--accent-1);
            background: rgba(255, 255, 255, 0.08);
        }

        .btn-global {
            background: var(--bg-glass);
            color: white;
            border: 1px solid var(--border);
            padding: 0 20px;
            height: 44px;
            border-radius: var(--radius-md);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-global:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .btn-primary {
            background: var(--accent-grad);
            border: none;
            color: white;
        }

        .btn-primary:hover {
            opacity: 0.9;
        }

        .playlist {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 8px;
            max-width: 1200px;
            margin: 0 auto;
            mask-image: linear-gradient(to right, black 90%, transparent 100%);
            -webkit-mask-image: linear-gradient(to right, black 90%, transparent 100%);
        }

        .playlist::-webkit-scrollbar {
            display: none;
        }

        .playlist-item {
            min-width: 180px;
            max-width: 180px;
            background: #111;
            border: 1px solid var(--border);
            padding: 10px 14px;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-size: 13px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: all 0.2s;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .playlist-item:hover {
            color: #fff;
            border-color: rgba(255, 255, 255, 0.3);
        }

        .playlist-item.active {
            border-color: var(--accent-1);
            background: rgba(6, 182, 212, 0.05);
            color: var(--accent-1);
        }

        .playlist-item-remove {
            opacity: 0;
            transition: 0.2s;
        }

        .playlist-item:hover .playlist-item-remove {
            opacity: 1;
        }

        /* --- TOAST NOTIFICATIONS --- */
        .toast-container {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2000;
            pointer-events: none;
        }

        .toast {
            background: rgba(10, 10, 10, 0.9);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            color: white;
            padding: 10px 20px;
            border-radius: 50px;
            margin-top: 10px;
            font-size: 13px;
            font-weight: 500;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.3s var(--ease);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        .toast.success i {
            color: var(--accent-1);
        }

        .toast.error i {
            color: #ef4444;
        }

        /* ========================================================
       MODE 1: CUSTOM PLAYER STYLES (From your request)
       ======================================================== */
        .player-wrapper {
            position: relative;
            background: #000;
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: 0 40px 80px -20px rgba(0, 0, 0, 0.8);
            border: 1px solid var(--border);
        }

        .video-stage {
            position: relative;
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            user-select: none;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        #ytPlayerRef {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            z-index: 2;
        }

        .click-layer {
            position: absolute;
            inset: 0;
            z-index: 5;
            cursor: pointer;
        }

        /* CROP LAYER */
        .crop-layer {
            position: absolute;
            inset: 0;
            z-index: 50;
            background: rgba(0, 0, 0, 0.6);
            display: none;
            opacity: 0;
            transition: opacity 0.3s var(--ease);
        }

        .crop-layer.active {
            display: block;
            opacity: 1;
        }

        .crop-box {
            position: absolute;
            border: 2px solid var(--accent-1);
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.5);
            cursor: move;
            top: 20%;
            left: 20%;
            width: 60%;
            height: 60%;
        }

        .crop-box::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, transparent 32%, rgba(255, 255, 255, 0.3) 33%, transparent 34%, transparent 65%, rgba(255, 255, 255, 0.3) 66%, transparent 67%);
            pointer-events: none;
        }

        .crop-box::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to right, transparent 32%, rgba(255, 255, 255, 0.3) 33%, transparent 34%, transparent 65%, rgba(255, 255, 255, 0.3) 66%, transparent 67%);
            pointer-events: none;
            z-index: 1;
        }

        .crop-handle {
            position: absolute;
            width: 12px;
            height: 12px;
            background: #fff;
            border-radius: 50%;
            border: 2px solid var(--accent-1);
            z-index: 10;
        }

        .handle-nw {
            top: -6px;
            left: -6px;
            cursor: nw-resize;
        }

        .handle-ne {
            top: -6px;
            right: -6px;
            cursor: ne-resize;
        }

        .handle-sw {
            bottom: -6px;
            left: -6px;
            cursor: sw-resize;
        }

        .handle-se {
            bottom: -6px;
            right: -6px;
            cursor: se-resize;
        }

        .crop-actions {
            position: absolute;
            bottom: -60px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            background: var(--bg-panel);
            padding: 8px 12px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border);
            white-space: nowrap;
            pointer-events: auto;
        }

        .btn-crop-action {
            background: transparent;
            border: none;
            color: #fff;
            cursor: pointer;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }

        .btn-crop-action:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .btn-crop-confirm {
            color: #4ade80;
            background: rgba(74, 222, 128, 0.1);
        }

        .btn-crop-confirm:hover {
            background: rgba(74, 222, 128, 0.25);
        }

        .btn-crop-cancel {
            color: #f87171;
        }

        /* CONTROLS */
        .controls-layer {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 30;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.9) 0%, rgba(0, 0, 0, 0.6) 40%, transparent 100%);
            padding: 60px 24px 24px;
            opacity: 1;
            transform: translateY(0);
            transition: 0.3s ease;
        }

        .controls-layer.hidden {
            opacity: 0;
            transform: translateY(10px);
            pointer-events: none;
        }

        .progress-track {
            position: relative;
            height: 4px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 4px;
            cursor: pointer;
            margin-bottom: 20px;
            transition: height 0.2s var(--ease);
        }

        .progress-track:hover {
            height: 6px;
        }

        .progress-fill {
            position: absolute;
            height: 100%;
            background: var(--accent-grad);
            width: 0%;
            border-radius: 4px;
        }

        .progress-thumb {
            position: absolute;
            top: 50%;
            left: 0%;
            width: 14px;
            height: 14px;
            background: #fff;
            border-radius: 50%;
            transform: translate(-50%, -50%) scale(0);
            transition: transform 0.2s;
        }

        .progress-track:hover .progress-thumb {
            transform: translate(-50%, -50%) scale(1);
        }

        .ctrl-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .ctrl-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn {
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.85);
            width: 40px;
            height: 40px;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        .btn.active {
            color: var(--accent-1);
            background: rgba(6, 182, 212, 0.1);
        }

        .skip-badge {
            position: absolute;
            font-size: 8px;
            font-weight: 700;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            margin-top: 1px;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
        }

        .time-display {
            font-size: 13px;
            font-weight: 500;
            font-variant-numeric: tabular-nums;
            color: var(--text-muted);
            min-width: 90px;
            text-align: center;
        }

        .time-display span {
            color: #fff;
        }

        .volume-group {
            display: flex;
            align-items: center;
        }

        .volume-slider-wrap {
            width: 0;
            overflow: hidden;
            transition: width 0.3s var(--ease);
            display: flex;
            align-items: center;
        }

        .volume-group:hover .volume-slider-wrap {
            width: 80px;
            margin-left: 12px;
        }

        input[type=range] {
            -webkit-appearance: none;
            background: rgba(255, 255, 255, 0.2);
            height: 4px;
            border-radius: 2px;
            width: 100%;
            outline: none;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            background: #fff;
            border-radius: 50%;
            cursor: pointer;
        }

        .settings-popover {
            position: absolute;
            bottom: 80px;
            right: 24px;
            width: 220px;
            background: var(--bg-panel);
            backdrop-filter: blur(var(--blur));
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 16px;
            display: none;
            flex-direction: column;
            gap: 12px;
            transform-origin: bottom right;
            animation: scaleIn 0.2s var(--ease);
        }

        .settings-popover.active {
            display: flex;
        }

        @keyframes scaleIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .setting-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .setting-label {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 500;
            text-transform: uppercase;
        }

        .setting-val {
            font-size: 13px;
            font-weight: 700;
            color: var(--accent-1);
        }

        .snapshot-notification {
            position: absolute;
            top: 24px;
            right: 24px;
            background: rgba(10, 10, 10, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            color: var(--accent-1);
            padding: 10px 16px;
            border-radius: var(--radius-md);
            font-size: 13px;
            font-weight: 500;
            z-index: 100;
            opacity: 0;
            transform: translateY(-10px);
            pointer-events: none;
            transition: all 0.4s var(--ease);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .snapshot-notification.show {
            opacity: 1;
            transform: translateY(0);
        }

        .big-play-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.95);
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            z-index: 20;
            opacity: 0;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s var(--ease);
        }

        .big-play-btn.visible {
            opacity: 1;
            pointer-events: auto;
            transform: translate(-50%, -50%) scale(1);
        }

        /* SIDEBAR (Drawer) */
        .drawer {
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            width: 340px;
            background: rgba(10, 10, 10, 0.95);
            backdrop-filter: blur(40px);
            border-left: 1px solid var(--border);
            z-index: 60;
            transform: translateX(100%);
            transition: transform 0.4s var(--ease);
            display: flex;
            flex-direction: column;
        }

        .drawer.open {
            transform: translateX(0);
        }

        .drawer-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .drawer-title {
            font-weight: 600;
            font-size: 16px;
            letter-spacing: -0.02em;
        }

        .drawer-tabs {
            display: flex;
            padding: 0 20px;
            margin-top: 12px;
            gap: 16px;
            border-bottom: 1px solid var(--border);
        }

        .drawer-tab {
            padding-bottom: 8px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-muted);
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: 0.2s;
        }

        .drawer-tab.active {
            color: #fff;
            border-color: var(--accent-1);
        }

        .drawer-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: none;
        }

        .drawer-content.active {
            display: block;
        }

        .note-input-area {
            background: var(--bg-glass);
            border: 1px solid var(--border);
            padding: 16px;
            border-radius: var(--radius-md);
            margin-bottom: 24px;
        }

        .note-textarea {
            width: 100%;
            background: transparent;
            border: none;
            color: #fff;
            resize: vertical;
            min-height: 70px;
            font-size: 14px;
            margin-bottom: 12px;
            font-family: inherit;
        }

        .note-actions {
            display: flex;
            justify-content: flex-end;
            align-items: center;
        }

        .btn-drawer-primary {
            background: var(--accent-grad);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: var(--radius-sm);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(139, 92, 246, 0.25);
            transition: transform 0.2s;
        }

        .btn-drawer-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(139, 92, 246, 0.35);
        }

        .note-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .note-card {
            background: var(--bg-glass);
            border: 1px solid transparent;
            padding: 14px;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }

        .note-card:hover {
            border-color: var(--accent-2);
            background: rgba(139, 92, 246, 0.05);
        }

        .note-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 6px;
        }

        .note-time {
            color: var(--accent-1);
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .note-delete-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 4px;
            cursor: pointer;
            border-radius: 4px;
            margin-top: -4px;
            margin-right: -4px;
        }

        .note-delete-btn:hover {
            color: #ef4444;
            background: rgba(239, 68, 68, 0.15);
        }

        .snapshot-list {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .snapshot-card {
            background: var(--bg-glass);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            overflow: hidden;
            position: relative;
            transition: all 0.2s;
        }

        .snapshot-card:hover {
            border-color: var(--accent-1);
        }

        .snapshot-img {
            width: 100%;
            aspect-ratio: 16/9;
            object-fit: cover;
            display: block;
        }

        .snapshot-meta {
            padding: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #111;
        }

        .snapshot-time {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
        }

        .snapshot-dl-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #fff;
            width: 24px;
            height: 24px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.2s;
        }

        .snapshot-dl-btn:hover {
            background: var(--accent-1);
        }

        /* ========================================================
       MODE 2: PLYR STYLES
       ======================================================== */
        #plyr-wrapper {
            width: 100%;
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border);
            aspect-ratio: 16/9;
            background: #000;
        }

        /* Dark theme overrides for Plyr to match our app */
        .plyr {
            --plyr-color-main: var(--accent-1);
            --plyr-video-background: #000;
            --plyr-menu-background: #111;
            --plyr-menu-color: #fff;
        }

        @media (max-width: 768px) {
            .app-header {
                padding: 12px 16px;
            }

            .mode-btn {
                padding: 6px 12px;
                font-size: 12px;
            }

            .main-stage {
                padding: 0;
            }

            .player-container {
                max-width: 100%;
                border-radius: 0;
            }

            .player-wrapper,
            #plyr-wrapper {
                border-radius: 0;
                border: none;
            }

            }

            .upload-row {

                width: 100%;
                justify-content: center;

            .snapshot-list {
                grid-template-columns: 1fr 1fr 1fr;
            }
        }
    </style>
</head>

<body>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- YouTube Iframe API -->
    <script src="https://www.youtube.com/iframe_api"></script>
    <!-- Plyr JS CDN -->
    <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>

    <script>
        /**
 * GLOBAL APP MANAGER
 * Handles playlist, mode switching, and cross-player communication.
 */
const appManager = {
    mode: 1, // 1 = Custom, 2 = Plyr
    playlist: [],
    players: {},

    init() {
        // Setup Listeners for Global Upload
        document.getElementById('loadUrlBtn').onclick = () => this.handleLoadUrl();
        document.getElementById('fileInput').onchange = (e) => this.handleFileUpload(e);

        // Initialize Custom Player
        this.players.custom = new AdvancedPlayer();
        
        // Initialize Plyr Player
        this.players.plyr = new PlyrPlayer();

        // Add default video
        this.addToPlaylist("Demo Video", "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4", false);
    },

    switchMode(mode) {
        if (this.mode === mode) return;
        
        // Pause current player
        if (this.mode === 1) this.players.custom.pause();
        if (this.mode === 2) this.players.plyr.pause();

        // Update UI State
        this.mode = mode;
        document.getElementById('modeSwitcher').setAttribute('data-active', mode);
        document.querySelectorAll('.mode-btn').forEach((btn, idx) => {
            btn.classList.toggle('active', (idx + 1) === mode);
        });

        // Toggle Containers
        document.getElementById('mode-custom').classList.toggle('active', mode === 1);
        document.getElementById('mode-plyr').classList.toggle('active', mode === 2);

        // Sync Video Source
        const current = this.playlist[this.playlist.length - 1]; // Play last added for simplicity
        if (current) {
            if (mode === 1) this.players.custom.loadSource(current);
            if (mode === 2) this.players.plyr.loadSource(current);
        }
    },

    addToPlaylist(name, src, isYT) {
        const item = { name, src, isYT, id: Date.now() };
        this.playlist.push(item);
        this.renderPlaylist();
        
        // Load immediately into active player
        if (this.mode === 1) this.players.custom.loadSource(item);
        if (this.mode === 2) this.players.plyr.loadSource(item);
    },

    removeFromPlaylist(index) {
        this.playlist.splice(index, 1);
        this.renderPlaylist();
    },

    playIndex(index) {
        const item = this.playlist[index];
        if (this.mode === 1) this.players.custom.loadSource(item);
        if (this.mode === 2) this.players.plyr.loadSource(item);
        this.renderPlaylist();
    },

    handleLoadUrl() {
        const url = document.getElementById('urlInput').value.trim();
        if (!url) return showToast('Please enter a URL', 'error');
        
        const ytId = this.extractYtId(url);
        if (ytId) {
            this.addToPlaylist(`YouTube: ${ytId}`, ytId, true);
            showToast(`Added YouTube Video`, 'success');
        } else if (url) {
            this.addToPlaylist('Web Video', url, false);
            showToast(`Added Video URL`, 'success');
        }
        document.getElementById('urlInput').value = '';
    },

    handleFileUpload(e) {
        Array.from(e.target.files).forEach(f => {
            this.addToPlaylist(f.name, URL.createObjectURL(f), false);
        });
        showToast(`${e.target.files.length} file(s) added`, 'success');
    },

    extractYtId(url) {
        const patterns = [ /(?:youtube\.com\/watch\?v=)([^&]+)/, /(?:youtu\.be\/)([^?]+)/, /(?:youtube\.com\/embed\/)([^?]+)/, /(?:youtube\.com\/shorts\/)([^?]+)/ ];
        for (let pattern of patterns) { const match = url.match(pattern); if (match) return match[1]; }
        return null;
    },

    renderPlaylist() {
        const list = document.getElementById('playlist');
        list.innerHTML = this.playlist.map((item, i) => `
            <div class="playlist-item ${i === this.playlist.length - 1 ? 'active' : ''}" onclick="appManager.playIndex(${i})">
                <span>${item.name}</span>
                <i data-feather="x" class="playlist-item-remove" onclick="event.stopPropagation(); appManager.removeFromPlaylist(${i})"></i>
            </div>
        `).join('');
        feather.replace();
    }
};

/* =========================================
   MODE 1: CUSTOM PLAYER IMPLEMENTATION
   ========================================= */
class AdvancedPlayer {
    constructor() {
        this.state = { playing: false, isYT: false, volume: 1, cropping: false };
        this.dom = {
            video: document.getElementById('mainVideo'),
            playBtn: document.getElementById('playPauseBtn'),
            bigPlayBtn: document.getElementById('bigPlayBtn'),
            progress: document.getElementById('progressBar'),
            fill: document.getElementById('progressFill'),
            thumb: document.getElementById('progressThumb'),
            controls: document.getElementById('controlsLayer'),
            cropLayer: document.getElementById('cropLayer'),
            cropBox: document.getElementById('cropBox')
        };
        this.ytPlayer = null;
        this.idleTimer = null;
        this.ytUpdateInterval = null;

        this.setupListeners();
        this.setupCrop();
        feather.replace();
        this.loadNotesAndSnaps();
    }

    loadSource(item) {
        if (this.state.cropping) this.endCrop(false);
        if (this.ytUpdateInterval) clearInterval(this.ytUpdateInterval);

        if (item.isYT) {
            this.state.isYT = true;
            this.dom.video.style.display = 'none';
            this.dom.video.pause();
            document.getElementById('ytPlayerRef').style.display = 'block';
            
            if (this.ytPlayer) {
                this.ytPlayer.loadVideoById(item.src);
            } else {
                this.ytPlayer = new YT.Player('ytPlayerRef', {
                    height: '100%', width: '100%', videoId: item.src,
                    playerVars: { 'playsinline': 1, 'controls': 0, 'modestbranding': 1 },
                    events: {
                        'onReady': (e) => { e.target.playVideo(); this.startYTUpdateLoop(); },
                        'onStateChange': (e) => {
                            this.state.playing = (e.data === YT.PlayerState.PLAYING);
                            this.updatePlayBtn();
                            this.dom.bigPlayBtn.classList.toggle('visible', !this.state.playing);
                        }
                    }
                });
            }
        } else {
            this.state.isYT = false;
            document.getElementById('ytPlayerRef').style.display = 'none';
            if (this.ytPlayer) this.ytPlayer.stopVideo();
            this.dom.video.style.display = 'block';
            this.dom.video.src = item.src;
            this.dom.video.load();
            this.dom.video.play().catch(()=>{}); // Auto-play attempt
            this.state.playing = true;
            this.updatePlayBtn();
        }
    }

    pause() {
        if(this.state.isYT && this.ytPlayer) this.ytPlayer.pauseVideo();
        else this.dom.video.pause();
        this.state.playing = false;
    }

    setupListeners() {
        const togglePlay = () => this.togglePlay();
        this.dom.playBtn.onclick = togglePlay;
        this.dom.bigPlayBtn.onclick = togglePlay;
        document.getElementById('clickLayer').onclick = togglePlay;

        this.dom.video.ontimeupdate = () => this.updateProgress();
        let dragging = false;
        this.dom.progress.onmousedown = (e) => { dragging = true; this.seek(e); };
        document.onmousemove = (e) => dragging && this.seek(e);
        document.onmouseup = () => dragging = false;

        document.getElementById('skipBackBtn').onclick = () => this.skip(-10);
        document.getElementById('skipForwardBtn').onclick = () => this.skip(10);
        document.getElementById('snapshotBtn').onclick = () => this.startCrop();
        
        const resetIdle = () => {
            if(this.state.cropping) return;
            this.dom.controls.classList.remove('hidden');
            clearTimeout(this.idleTimer);
            if(this.state.playing) this.idleTimer = setTimeout(() => this.dom.controls.classList.add('hidden'), 2500);
        };
        document.onmousemove = resetIdle;
        document.ontouchstart = resetIdle;

        // Drawer Logic
        document.getElementById('notesToggleBtn').onclick = () => document.getElementById('notesDrawer').classList.toggle('open');
        document.getElementById('closeDrawerBtn').onclick = () => document.getElementById('notesDrawer').classList.remove('open');
        
        document.querySelectorAll('.drawer-tab').forEach(t => {
            t.onclick = (e) => {
                document.querySelectorAll('.drawer-tab').forEach(x => x.classList.remove('active'));
                document.querySelectorAll('.drawer-content').forEach(x => x.classList.remove('active'));
                e.target.classList.add('active');
                document.getElementById(`tab-${e.target.dataset.tab}`).classList.add('active');
            };
        });

        document.getElementById('addNoteBtn').onclick = () => this.addNote();
        document.getElementById('muteBtn').onclick = () => this.toggleMute();
        document.getElementById('volSlider').oninput = (e) => this.setVolume(e.target.value);
        document.getElementById('fsBtn').onclick = () => this.toggleFs();

        document.getElementById('settingsToggleBtn').onclick = () => document.getElementById('settingsMenu').classList.toggle('active');
        document.getElementById('speedSlider').oninput = (e) => {
            const val = parseFloat(e.target.value);
            this.setSpeed(val);
            document.getElementById('speedValue').textContent = val.toFixed(2) + 'x';
        };
    }

    /* --- CROP & SNAPSHOT LOGIC --- */
    setupCrop() {
        let isDragging = false, isResizing = false, handle = null;
        let startX, startY, startLeft, startTop, startW, startH;
        const box = this.dom.cropBox;
        const layer = this.dom.cropLayer;

        box.onmousedown = (e) => {
            if (e.target.closest('.crop-actions')) return;
            e.stopPropagation();
            startX = e.clientX; startY = e.clientY;
            const r = box.getBoundingClientRect();
            const pr = layer.getBoundingClientRect();
            startLeft = r.left - pr.left; startTop = r.top - pr.top;
            startW = r.width; startH = r.height;
            if (e.target.classList.contains('crop-handle')) { isResizing = true; handle = e.target.getAttribute('data-handle'); }
            else isDragging = true;
        };

        document.addEventListener('mousemove', (e) => {
            if (!this.state.cropping) return;
            const dx = e.clientX - startX, dy = e.clientY - startY;
            const pr = layer.getBoundingClientRect();
            if (isDragging) {
                let nl = Math.max(0, Math.min(startLeft + dx, pr.width - startW));
                let nt = Math.max(0, Math.min(startTop + dy, pr.height - startH));
                box.style.left = nl + 'px'; box.style.top = nt + 'px';
            } 
            else if (isResizing) {
                let nw = startW, nh = startH, nl = startLeft, nt = startTop;
                if (handle.includes('e')) nw = startW + dx;
                if (handle.includes('w')) { nw = startW - dx; nl = startLeft + dx; }
                if (handle.includes('s')) nh = startH + dy;
                if (handle.includes('n')) { nh = startH - dy; nt = startTop + dy; }
                if (nw > 50 && nl >= 0 && (nl+nw) <= pr.width) { box.style.width = nw + 'px'; if(handle.includes('w')) box.style.left = nl + 'px'; }
                if (nh > 50 && nt >= 0 && (nt+nh) <= pr.height) { box.style.height = nh + 'px'; if(handle.includes('n')) box.style.top = nt + 'px'; }
            }
        });

        document.addEventListener('mouseup', () => { isDragging = false; isResizing = false; });
        document.getElementById('cancelCropBtn').onclick = () => this.endCrop(false);
        document.getElementById('confirmCropBtn').onclick = () => this.endCrop(true);
    }

    startCrop() {
        if (this.state.playing) this.togglePlay();
        this.state.cropping = true;
        this.dom.cropLayer.classList.add('active');
        this.dom.controls.classList.add('hidden');
    }

    endCrop(save) {
        if (save) this.captureCrop();
        this.state.cropping = false;
        this.dom.cropLayer.classList.remove('active');
        this.dom.controls.classList.remove('hidden');
    }

    captureCrop() {
        if (this.state.isYT) {
            // Simplified YT Capture
            try {
                let id = null;
                if (this.ytPlayer && this.ytPlayer.getVideoData) {
                    const data = this.ytPlayer.getVideoData();
                    if(data) id = data.video_id;
                }
                if (id) {
                    const thumbUrl = `https://img.youtube.com/vi/${id}/hqdefault.jpg`;
                    this.addSnapshot(thumbUrl);
                    this.openDrawerSnaps();
                } else {
                    showToast('Could not capture YouTube frame', 'error');
                }
            } catch(e) { showToast('Snapshot failed', 'error'); }
            return;
        }
        
        // Local Video Capture
        const cropRect = this.dom.cropBox.getBoundingClientRect();
        const stageRect = document.querySelector('.video-stage').getBoundingClientRect();
        
        const cropX = cropRect.left - stageRect.left;
        const cropY = cropRect.top - stageRect.top;
        const cropW = cropRect.width;
        const cropH = cropRect.height;

        const canvas = document.createElement('canvas');
        canvas.width = cropW;
        canvas.height = cropH;
        const ctx = canvas.getContext('2d');

        const video = this.dom.video;
        const vRatio = (video.videoWidth||1280)/(video.videoHeight||720);
        const cRatio = video.clientWidth/video.clientHeight;
        let vw, vh, vx, vy;
        
        if (cRatio > vRatio) { vh = video.clientHeight; vw = vh * vRatio; vy = 0; vx = (video.clientWidth - vw)/2; }
        else { vw = video.clientWidth; vh = vw / vRatio; vx = 0; vy = (video.clientHeight - vh)/2; }

        const relX = (cropX - vx) / vw;
        const relY = (cropY - vy) / vh;
        const relW = cropW / vw;
        const relH = cropH / vh;

        ctx.drawImage(video, relX*video.videoWidth, relY*video.videoHeight, relW*video.videoWidth, relH*video.videoHeight, 0, 0, cropW, cropH);

        try {
            const dataUrl = canvas.toDataURL('image/png');
            this.addSnapshot(dataUrl);
            this.openDrawerSnaps();
        } catch(e) {
            showToast('Storage full or CORS error', 'error');
        }
    }

    openDrawerSnaps() {
        const notify = document.getElementById('snapshotNotify');
        notify.classList.add('show');
        setTimeout(() => notify.classList.remove('show'), 2000);
        document.getElementById('notesDrawer').classList.add('open');
        setTimeout(() => { const tab = document.querySelector('[data-tab="snaps"]'); if(tab) tab.click(); }, 100);
    }

    addSnapshot(dataUrl) {
        const snap = { id: Date.now(), time: this.state.isYT ? this.ytPlayer.getCurrentTime() : this.dom.video.currentTime, img: dataUrl };
        this.state.snaps = this.state.snaps || [];
        this.state.snaps.unshift(snap);
        if(this.state.snaps.length > 20) this.state.snaps.pop(); 
        this.renderSnaps();
        this.saveNotesAndSnaps();
    }

    renderSnaps() {
        const list = document.getElementById('snapList');
        this.state.snaps = this.state.snaps || [];
        if (this.state.snaps.length === 0) { list.innerHTML = '<div style="grid-column:1/-1;text-align:center;color:var(--text-muted);font-size:12px;padding:20px;">No snapshots yet</div>'; return; }
        
        list.innerHTML = this.state.snaps.map(s => `
            <div class="snapshot-card">
                <img src="${s.img}" class="snapshot-img" />
                <div class="snapshot-meta">
                    <span class="snapshot-time">${this.fmt(s.time)}</span>
                    <div style="display:flex; gap:6px;">
                        <button class="snapshot-dl-btn" onclick="appManager.players.custom.downloadSnap(${s.id})" title="Download">
                            <i data-feather="download" style="width:14px;"></i>
                        </button>
                        <button class="snapshot-dl-btn" onclick="appManager.players.custom.deleteSnap(${s.id})" title="Delete" style="color:#ef4444; border-color: rgba(239, 68, 68, 0.3);">
                            <i data-feather="trash-2" style="width:14px;"></i>
                        </button>
                    </div>
                </div>
            </div>
        `).join('');
        feather.replace();
    }

    deleteSnap(id) {
        if(!confirm('Delete this snapshot?')) return;
        this.state.snaps = this.state.snaps.filter(s => s.id !== id);
        this.renderSnaps();
        this.saveNotesAndSnaps();
    }

    downloadSnap(id) {
        const s = this.state.snaps.find(x => x.id === id);
        if(!s) return;
        const link = document.createElement('a');
        link.download = `snap-${s.id}.png`;
        link.href = s.img;
        link.click();
    }

    /* --- NOTES --- */
    saveNotesAndSnaps() {
        localStorage.setItem('customNotes', JSON.stringify(this.state.notes || []));
        try { localStorage.setItem('customSnaps', JSON.stringify(this.state.snaps || [])); } catch(e) {}
    }
    loadNotesAndSnaps() {
        try {
            const n = localStorage.getItem('customNotes'); if(n) this.state.notes = JSON.parse(n);
            const s = localStorage.getItem('customSnaps'); if(s) this.state.snaps = JSON.parse(s);
            this.renderNotes();
            this.renderSnaps();
        } catch(e) {}
    }
    addNote() {
        const text = document.getElementById('noteText').value;
        if(!text) return;
        const time = (this.state.isYT) ? this.ytPlayer.getCurrentTime() : this.dom.video.currentTime;
        this.state.notes = this.state.notes || [];
        this.state.notes.push({ time, text });
        this.state.notes.sort((a,b) => a.time - b.time);
        this.renderNotes();
        this.saveNotesAndSnaps();
        document.getElementById('noteText').value = '';
    }
    deleteNote(index) { if(confirm('Delete?')) { this.state.notes.splice(index, 1); this.renderNotes(); this.saveNotesAndSnaps(); } }
    renderNotes() {
        const list = document.getElementById('noteList');
        this.state.notes = this.state.notes || [];
        if (this.state.notes.length === 0) { list.innerHTML = '<div style="text-align:center;color:var(--text-muted);font-size:13px;padding:20px;">No notes yet</div>'; return; }
        list.innerHTML = this.state.notes.map((n, i) => `
            <div class="note-card" onclick="appManager.players.custom.jumpToNote(${i})">
                <div class="note-header">
                    <span class="note-time">${this.fmt(n.time)}</span>
                    <button class="note-delete-btn" onclick="event.stopPropagation(); appManager.players.custom.deleteNote(${i})"><i data-feather="trash-2"></i></button>
                </div>
                <div style="font-size:13px;color:rgba(255,255,255,0.9);">${this.escapeHtml(n.text)}</div>
            </div>`).join('');
        feather.replace();
    }
    jumpToNote(i) {
        const n = this.state.notes[i];
        if(this.state.isYT) this.ytPlayer.seekTo(n.time); else this.dom.video.currentTime = n.time;
    }
    escapeHtml(text) { const div = document.createElement('div'); div.textContent = text; return div.innerHTML; }

    /* --- PLAYER UTILS --- */
    togglePlay() {
        this.state.playing = !this.state.playing;
        if(this.state.isYT) this.state.playing ? this.ytPlayer.playVideo() : this.ytPlayer.pauseVideo();
        else this.state.playing ? this.dom.video.play() : this.dom.video.pause();
        this.updatePlayBtn();
    }
    updatePlayBtn() {
        const i = this.state.playing ? 'pause' : 'play';
        this.dom.playBtn.innerHTML = `<i data-feather="${i}"></i>`;
        this.dom.bigPlayBtn.innerHTML = `<i data-feather="${i}" style="width:32px;height:32px;fill:white"></i>`;
        this.dom.bigPlayBtn.classList.toggle('visible', !this.state.playing);
        feather.replace();
    }
    updateProgress() {
        if(this.state.cropping) return;
        let c = this.state.isYT ? this.ytPlayer.getCurrentTime() : this.dom.video.currentTime;
        let d = this.state.isYT ? this.ytPlayer.getDuration() : this.dom.video.duration;
        if(!d) return;
        this.dom.fill.style.width = (c/d*100)+'%';
        this.dom.thumb.style.left = (c/d*100)+'%';
        this.dom.currTime.innerText = this.fmt(c);
        this.dom.durTime.innerText = this.fmt(d);
    }
    seek(e) {
        const r = this.dom.progress.getBoundingClientRect();
        const p = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
        if(this.state.isYT) this.ytPlayer.seekTo(p * this.ytPlayer.getDuration());
        else this.dom.video.currentTime = p * this.dom.video.duration;
        this.updateProgress();
    }
    skip(s) {
        if(this.state.isYT) this.ytPlayer.seekTo(this.ytPlayer.getCurrentTime()+s, true);
        else this.dom.video.currentTime += s;
        this.updateProgress();
    }
    toggleMute() {
        if(this.state.isYT) this.ytPlayer.isMuted() ? this.ytPlayer.unMute() : this.ytPlayer.mute();
        else this.dom.video.muted = !this.dom.video.muted;
    }
    setVolume(v) { this.dom.video.volume = v; if(this.ytPlayer) this.ytPlayer.setVolume(v*100); }
    setSpeed(v) { this.dom.video.playbackRate = v; if(this.ytPlayer) this.ytPlayer.setPlaybackRate(v); }
    toggleFs() { document.fullscreenElement ? document.exitFullscreen() : document.getElementById('playerRef').requestFullscreen(); }
    fmt(s) { if(!s) return '0:00'; const m=Math.floor(s/60), sec=Math.floor(s%60); return `${m}:${sec.toString().padStart(2,'0')}`; }
    startYTUpdateLoop() { this.ytUpdateInterval = setInterval(() => { if (this.state.isYT && this.ytPlayer) this.updateProgress(); }, 100); }
}

/* =========================================
   MODE 2: PLYR PLAYER IMPLEMENTATION
   ========================================= */
class PlyrPlayer {
    constructor() {
        this.player = new Plyr('#plyr-element', {
            controls: ['play-large', 'play', 'progress', 'current-time', 'mute', 'volume', 'captions', 'settings', 'pip', 'airplay', 'fullscreen']
        });
        
        // Event listeners for UI feedback if needed
        this.player.on('play', () => console.log('Plyr playing'));
        this.player.on('pause', () => console.log('Plyr paused'));
    }

    loadSource(item) {
        if (item.isYT) {
            this.player.source = {
                type: 'video',
                sources: [{ src: item.src, provider: 'youtube' }],
            };
        } else {
            this.player.source = {
                type: 'video',
                sources: [{ src: item.src, type: 'video/mp4' }],
            };
        }
        this.player.play();
    }

    pause() {
        this.player.pause();
    }
}

/* =========================================
   UTILITIES
   ========================================= */
function showToast(message, type = 'success') {
    const container = document.getElementById('toastContainer');
    const toast = document.createElement('div');
    toast.className = `toast ${type}`;
    
    let icon = type === 'success' ? 'check-circle' : 'alert-circle';
    
    toast.innerHTML = `<i data-feather="${icon}"></i> <span>${message}</span>`;
    container.appendChild(toast);
    feather.replace();

    // Animate in
    requestAnimationFrame(() => toast.classList.add('show'));

    // Remove after 3s
    setTimeout(() => {
        toast.classList.remove('show');
        setTimeout(() => toast.remove(), 300);
    }, 3000);
}

// Initialize Everything
window.onload = () => {
    feather.replace();
    appManager.init();
};
