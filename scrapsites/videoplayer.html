<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pro Video Player | Minimal Modern</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/feather-icons"></script>

<style>
/* --- 2025 MODERN VARIABLES --- */
:root {
  /* Core Palette */
  --bg-app: #050505;
  --bg-panel: rgba(20, 20, 20, 0.65);
  --bg-glass: rgba(255, 255, 255, 0.03);
  
  /* Accents - Cyber Gradient */
  --accent-1: #06b6d4; /* Cyan */
  --accent-2: #8b5cf6; /* Violet */
  --accent-grad: linear-gradient(135deg, var(--accent-1), var(--accent-2));
  
  /* Text */
  --text-main: #ffffff;
  --text-muted: rgba(255, 255, 255, 0.5);
  
  /* UI Elements */
  --border: rgba(255, 255, 255, 0.08);
  --radius-lg: 16px;
  --radius-md: 10px;
  --radius-sm: 6px;
  --blur: 24px;
  
  /* Transitions */
  --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
}

/* --- RESET & BASE --- */
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; margin: 0; padding: 0; }
body { 
  font-family: 'Inter', sans-serif; 
  background: var(--bg-app); 
  color: var(--text-main); 
  min-height: 100vh; 
  display: flex; 
  align-items: center; 
  justify-content: center;
  overflow-x: hidden;
}

/* --- LAYOUT CONTAINER --- */
.container { width: 100%; max-width: 1200px; padding: 24px; }
.player-wrapper { 
  position: relative; 
  background: #000; 
  border-radius: var(--radius-lg); 
  overflow: hidden; 
  box-shadow: 0 40px 80px -20px rgba(0,0,0,0.8);
  border: 1px solid var(--border);
}

/* --- VIDEO STAGE --- */
.video-stage { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; }
video { width: 100%; height: 100%; object-fit: contain; }
#ytPlayerRef { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; z-index: 2; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
canvas.drawing { pointer-events: auto; cursor: crosshair; }

/* --- OVERLAYS --- */
.click-layer { position: absolute; inset: 0; z-index: 5; cursor: pointer; }

/* Big Play Button (Minimal Glass) */
.big-play-btn {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.95);
  width: 80px; height: 80px; border-radius: 50%;
  background: rgba(255, 255, 255, 0.05);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.1);
  color: white; z-index: 20; opacity: 0; pointer-events: none;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.3s var(--ease);
}
.big-play-btn.visible { opacity: 1; pointer-events: auto; transform: translate(-50%, -50%) scale(1); }
.big-play-btn:hover { background: rgba(255, 255, 255, 0.1); transform: translate(-50%, -50%) scale(1.05); }

/* Notifications */
.snapshot-notification {
  position: absolute; top: 24px; right: 24px;
  background: rgba(10, 10, 10, 0.8);
  backdrop-filter: blur(12px);
  border: 1px solid var(--border);
  color: var(--accent-1);
  padding: 10px 16px; border-radius: var(--radius-md);
  font-size: 13px; font-weight: 500; z-index: 100;
  opacity: 0; transform: translateY(-10px); pointer-events: none;
  transition: all 0.4s var(--ease);
  display: flex; align-items: center; gap: 8px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}
.snapshot-notification.show { opacity: 1; transform: translateY(0); }

/* --- MODERN CONTROLS --- */
.controls-layer {
  position: absolute; bottom: 0; left: 0; right: 0; z-index: 30;
  background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.6) 40%, transparent 100%);
  padding: 60px 24px 24px;
  opacity: 1; transform: translateY(0); transition: 0.3s ease;
}
.controls-layer.hidden { opacity: 0; transform: translateY(10px); pointer-events: none; }

/* Progress Bar (Neon Glow) */
.progress-track {
  position: relative; height: 4px; background: rgba(255,255,255,0.15);
  border-radius: 4px; cursor: pointer; margin-bottom: 20px;
  transition: height 0.2s var(--ease);
}
.progress-track:hover { height: 6px; }
.progress-fill {
  position: absolute; height: 100%;
  background: var(--accent-grad);
  width: 0%; border-radius: 4px;
  box-shadow: 0 0 12px rgba(6, 182, 212, 0.4);
}
.progress-thumb {
  position: absolute; top: 50%; left: 0%; width: 14px; height: 14px;
  background: #fff; border-radius: 50%; transform: translate(-50%, -50%) scale(0);
  transition: transform 0.2s var(--ease);
  box-shadow: 0 0 0 4px rgba(255,255,255,0.1);
}
.progress-track:hover .progress-thumb { transform: translate(-50%, -50%) scale(1); }

/* Control Buttons */
.ctrl-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.ctrl-group { display: flex; align-items: center; gap: 8px; }

.btn {
  background: transparent; border: none; color: rgba(255,255,255,0.85); 
  width: 40px; height: 40px; border-radius: var(--radius-sm);
  display: flex; align-items: center; justify-content: center; cursor: pointer;
  transition: all 0.2s ease; position: relative;
}
.btn:hover { background: rgba(255,255,255,0.1); color: #fff; }
.btn svg { width: 20px; height: 20px; stroke-width: 2; }

/* Active State for Tools */
.btn.active { color: var(--accent-1); background: rgba(6, 182, 212, 0.1); }
.btn.active::after {
  content: ''; position: absolute; bottom: -4px; width: 4px; height: 4px;
  background: var(--accent-1); border-radius: 50%;
}

.time-display { 
  font-size: 13px; font-weight: 500; font-variant-numeric: tabular-nums; 
  color: var(--text-muted); min-width: 90px; text-align: center; 
  letter-spacing: 0.5px;
}
.time-display span { color: #fff; }

/* Volume Slider */
.volume-group { display: flex; align-items: center; }
.volume-slider-wrap {
  width: 0; overflow: hidden; transition: width 0.3s var(--ease);
  display: flex; align-items: center;
}
.volume-group:hover .volume-slider-wrap { width: 80px; margin-left: 12px; }
input[type=range] {
  -webkit-appearance: none; background: rgba(255,255,255,0.2); height: 4px; border-radius: 2px; width: 100%;
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 12px; height: 12px; background: #fff; border-radius: 50%; cursor: pointer;
}

/* Settings Menu (Glass Popover) */
.settings-popover {
  position: absolute; bottom: 80px; right: 24px; width: 180px;
  background: var(--bg-panel); backdrop-filter: blur(var(--blur));
  border: 1px solid var(--border); border-radius: var(--radius-md);
  padding: 8px; display: none; flex-direction: column; gap: 4px;
  transform-origin: bottom right; animation: scaleIn 0.2s var(--ease);
}
.settings-popover.active { display: flex; }
@keyframes scaleIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }

.setting-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; border-radius: var(--radius-sm); }
.setting-row:hover { background: rgba(255,255,255,0.05); }
.setting-label { font-size: 13px; color: var(--text-muted); }

select.setting-select {
  background: transparent; border: none; color: #fff; 
  font-size: 13px; font-weight: 600; cursor: pointer; text-align: right;
}
select.setting-select option { background: #111; color: #fff; }

/* --- DRAWING TOOLS (Floating Pill) --- */
.draw-tools {
  position: absolute; top: 24px; left: 24px; z-index: 40;
  background: rgba(15, 15, 15, 0.85); backdrop-filter: blur(16px);
  border: 1px solid var(--border); border-radius: 100px;
  padding: 6px 16px; display: flex; align-items: center; gap: 16px;
  transform: translateY(-20px); opacity: 0; pointer-events: none; 
  transition: all 0.3s var(--ease);
  box-shadow: 0 10px 40px rgba(0,0,0,0.3);
}
.draw-tools.active { transform: translateY(0); opacity: 1; pointer-events: auto; }

.tool-select { 
  background: transparent; color: #fff; border: none; 
  font-size: 13px; font-weight: 500; cursor: pointer;
}
.tool-select option { background: #111; }
.color-picker { width: 20px; height: 20px; border: 2px solid rgba(255,255,255,0.2); border-radius: 50%; cursor: pointer; padding: 0; background: none; overflow: hidden; }

/* --- NOTES DRAWER (Side Panel) --- */
.drawer {
  position: absolute; top: 0; right: 0; bottom: 0; width: 340px;
  background: rgba(10, 10, 10, 0.95); backdrop-filter: blur(40px);
  border-left: 1px solid var(--border); z-index: 50;
  transform: translateX(100%); transition: transform 0.4s var(--ease);
  display: flex; flex-direction: column;
}
.drawer.open { transform: translateX(0); }

.drawer-header { 
  padding: 20px; border-bottom: 1px solid var(--border); 
  display: flex; justify-content: space-between; align-items: center;
}
.drawer-title { font-weight: 600; font-size: 16px; letter-spacing: -0.02em; }

.drawer-content { flex: 1; overflow-y: auto; padding: 20px; }

.note-input-area { 
  background: var(--bg-glass); border: 1px solid var(--border);
  padding: 16px; border-radius: var(--radius-md); margin-bottom: 24px; 
}
.note-textarea {
  width: 100%; background: transparent; border: none; color: #fff; resize: vertical; 
  min-height: 70px; font-size: 14px; margin-bottom: 12px; font-family: inherit;
}
.note-actions { display: flex; justify-content: space-between; align-items: center; }

.btn-primary {
  background: var(--accent-grad); color: white; border: none; 
  padding: 8px 16px; border-radius: var(--radius-sm); 
  font-size: 12px; font-weight: 600; cursor: pointer;
  box-shadow: 0 4px 12px rgba(139, 92, 246, 0.25);
  transition: transform 0.2s;
}
.btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(139, 92, 246, 0.35); }

.note-list { display: flex; flex-direction: column; gap: 12px; }
.note-card {
  background: var(--bg-glass); border: 1px solid transparent; 
  padding: 14px; border-radius: var(--radius-md); cursor: pointer; 
  transition: all 0.2s; position: relative;
}
.note-card:hover { 
  border-color: var(--accent-2); 
  background: rgba(139, 92, 246, 0.05);
}

.note-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; }
.note-time { 
  color: var(--accent-1); font-size: 11px; font-weight: 600; 
  text-transform: uppercase; letter-spacing: 0.5px; 
}

/* Delete Button */
.note-delete-btn {
  background: transparent; border: none; color: var(--text-muted);
  padding: 4px; cursor: pointer; border-radius: 4px; 
  transition: all 0.2s; display: flex; align-items: center; justify-content: center;
  margin-top: -4px; margin-right: -4px;
}
.note-delete-btn:hover { color: #ef4444; background: rgba(239, 68, 68, 0.15); }
.note-delete-btn svg { width: 14px; height: 14px; }


/* --- UPLOAD SECTION --- */
.upload-section { 
  background: #0a0a0a; padding: 20px 24px; border-top: 1px solid var(--border);
}
.upload-row { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }

.url-input {
  flex: 1; min-width: 240px; 
  background: rgba(255,255,255,0.05); border: 1px solid var(--border); 
  color: white; padding: 12px 16px; border-radius: var(--radius-md); 
  font-size: 14px; transition: 0.2s;
}
.url-input:focus { border-color: var(--accent-1); background: rgba(255,255,255,0.08); }

.upload-btn-group { display: flex; gap: 8px; }
.btn-secondary {
  background: rgba(255,255,255,0.08); color: white; border: none; 
  padding: 0 20px; height: 44px; border-radius: var(--radius-md); 
  font-size: 13px; font-weight: 600; cursor: pointer; 
  display: flex; align-items: center; gap: 8px; transition: 0.2s;
}
.btn-secondary:hover { background: rgba(255,255,255,0.15); }

/* Modern Playlist */
.playlist { 
  display: flex; gap: 10px; overflow-x: auto; padding-bottom: 8px;
  mask-image: linear-gradient(to right, black 90%, transparent 100%);
  -webkit-mask-image: linear-gradient(to right, black 90%, transparent 100%);
}
.playlist::-webkit-scrollbar { display: none; }
.playlist-item {
  min-width: 180px; max-width: 180px; 
  background: #111; border: 1px solid var(--border); 
  padding: 10px 14px; border-radius: var(--radius-md); 
  cursor: pointer; font-size: 13px; white-space: nowrap; 
  overflow: hidden; text-overflow: ellipsis; transition: all 0.2s;
  color: var(--text-muted);
}
.playlist-item:hover { color: #fff; border-color: rgba(255,255,255,0.3); }
.playlist-item.active { 
  border-color: var(--accent-1); 
  background: rgba(6, 182, 212, 0.05); 
  color: var(--accent-1);
}

/* --- RESPONSIVE --- */
@media (max-width: 768px) {
  .container { padding: 0; max-width: 100%; }
  .player-wrapper { border-radius: 0; border: none; min-height: 100vh; display: flex; flex-direction: column; }
  .video-stage { flex: 1; }
  .controls-layer { padding: 20px 16px; background: linear-gradient(to top, rgba(0,0,0,1), transparent); }
  .volume-group { display: none; }
  .drawer { width: 100%; }
  .upload-row { flex-direction: column; }
  .btn-secondary { width: 100%; justify-content: center; }
  .draw-tools { top: 16px; left: 50%; transform: translateX(-50%) translateY(-20px); width: auto; }
  .draw-tools.active { transform: translateX(-50%) translateY(0); }
}
</style>
</head>
<body>

<div class="container">
  <div class="player-wrapper" id="playerRef">
    
    <!-- Video Content -->
    <div class="video-stage">
      <video id="mainVideo" playsinline preload="metadata" crossorigin="anonymous">
        <source src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4" type="video/mp4">
      </video>
      
      <div id="ytPlayerRef"></div>
      <canvas id="drawCanvas"></canvas>
      <div class="click-layer" id="clickLayer"></div>
      
      <button class="big-play-btn" id="bigPlayBtn">
        <i data-feather="play" style="width: 32px; height: 32px; fill: white;"></i>
      </button>

      <div class="snapshot-notification" id="snapshotNotify">
        <i data-feather="check" style="width: 16px; height: 16px;"></i>
        <span>Snapshot Saved</span>
      </div>

      <!-- Floating Draw Tools -->
      <div class="draw-tools" id="drawTools">
        <select id="toolType" class="tool-select">
          <option value="pen">Pen</option>
          <option value="marker">Marker</option>
          <option value="eraser">Eraser</option>
        </select>
        <input type="color" id="drawColor" value="#06b6d4" class="color-picker">
        <input type="range" id="drawSize" min="2" max="20" value="4" style="width: 60px; height: 2px;">
        <button id="clearDrawBtn" class="btn" style="width: 24px; height: 24px;">
          <i data-feather="rotate-ccw" style="width: 14px;"></i>
        </button>
      </div>

      <!-- Controls -->
      <div class="controls-layer" id="controlsLayer">
        <div class="progress-track" id="progressBar">
          <div class="progress-fill" id="progressFill"></div>
          <div class="progress-thumb" id="progressThumb"></div>
        </div>

        <div class="ctrl-row">
          <div class="ctrl-group">
            <button class="btn" id="playPauseBtn"><i data-feather="play"></i></button>
            
            <div class="volume-group">
              <button class="btn" id="muteBtn"><i data-feather="volume-2"></i></button>
              <div class="volume-slider-wrap">
                <input type="range" id="volSlider" min="0" max="1" step="0.05" value="1">
              </div>
            </div>
            
            <div class="time-display">
              <span id="currTime">0:00</span> <span style="opacity: 0.5; margin: 0 4px;">/</span> <span id="durTime">0:00</span>
            </div>
          </div>

          <div class="ctrl-group">
            <button class="btn" id="snapshotBtn" title="Snapshot"><i data-feather="camera"></i></button>
            <button class="btn" id="drawToggleBtn" title="Draw"><i data-feather="edit-2"></i></button>
            <button class="btn" id="notesToggleBtn" title="Notes"><i data-feather="file-text"></i></button>
            <button class="btn" id="settingsToggleBtn" title="Settings"><i data-feather="sliders"></i></button>
            <button class="btn" id="fsBtn" title="Fullscreen"><i data-feather="maximize"></i></button>
          </div>
        </div>
        
        <!-- Settings Popover -->
        <div class="settings-popover" id="settingsMenu">
          <div class="setting-row">
            <span class="setting-label">Playback Speed</span>
            <select id="speedSelect" class="setting-select">
              <option value="0.5">0.5x</option>
              <option value="1" selected>1x</option>
              <option value="1.5">1.5x</option>
              <option value="2">2x</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Notes Panel -->
      <div class="drawer" id="notesDrawer">
        <div class="drawer-header">
          <span class="drawer-title">Session Notes</span>
          <button class="btn" id="closeDrawerBtn"><i data-feather="x"></i></button>
        </div>
        <div class="drawer-content">
          <div class="note-input-area">
            <textarea id="noteText" class="note-textarea" placeholder="Write a note at current timestamp..."></textarea>
            <div class="note-actions">
              <label style="font-size: 12px; display: flex; align-items: center; gap: 6px; color: var(--text-muted); cursor: pointer;">
                <input type="checkbox" id="saveDrawCheck" style="accent-color: var(--accent-1);"> Include Drawing
              </label>
              <button class="btn-primary" id="addNoteBtn">Save Note</button>
            </div>
          </div>
          <div class="note-list" id="noteList">
            <!-- Notes injected here -->
          </div>
        </div>
      </div>
    </div>

    <!-- Upload Area -->
    <div class="upload-section">
      <div class="upload-row">
        <input type="text" id="urlInput" class="url-input" placeholder="Paste YouTube or Video URL">
        <div class="upload-btn-group">
          <button class="btn-secondary" id="loadUrlBtn">Load</button>
          <label class="btn-secondary">
            Upload File
            <input type="file" id="fileInput" multiple accept="video/*" style="display: none;">
          </label>
        </div>
      </div>
      <div class="playlist" id="playlist"></div>
    </div>

  </div>
</div>

<script>
var ytApiReady = false;
var app = null;

window.onYouTubeIframeAPIReady = function() {
  console.log('YouTube API Ready');
  ytApiReady = true;
  if (app) app.onYTApiReady();
};

var tag = document.createElement('script');
tag.src = "https://www.youtube.com/iframe_api";
var firstScriptTag = document.getElementsByTagName('script')[0];
firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
</script>

<script src="https://unpkg.com/feather-icons"></script>
<script>
class AdvancedPlayer {
  constructor() {
    this.state = {
      playing: false, drawing: false, drawMode: false, isYT: false,
      volume: 1, playlist: [], notes: [], ytReady: false
    };
    
    this.dom = {
      video: document.getElementById('mainVideo'),
      playBtn: document.getElementById('playPauseBtn'),
      bigPlayBtn: document.getElementById('bigPlayBtn'),
      progress: document.getElementById('progressBar'),
      fill: document.getElementById('progressFill'),
      thumb: document.getElementById('progressThumb'),
      canvas: document.getElementById('drawCanvas'),
      controls: document.getElementById('controlsLayer'),
      drawer: document.getElementById('notesDrawer'),
      playlist: document.getElementById('playlist'),
      currTime: document.getElementById('currTime'),
      durTime: document.getElementById('durTime'),
      drawTools: document.getElementById('drawTools'),
      ctx: document.getElementById('drawCanvas').getContext('2d')
    };

    this.ytPlayer = null;
    this.idleTimer = null;
    this.ytUpdateInterval = null;
    
    this.setupListeners();
    this.setupCanvas();
    this.loadNotes();
    feather.replace();
    
    this.addToPlaylist("Demo Video", this.dom.video.querySelector('source').src, false);
    if (ytApiReady) this.onYTApiReady();
  }

  onYTApiReady() {
    console.log('YouTube API is ready');
    this.state.ytReady = true;
  }

  setupListeners() {
    const togglePlay = () => this.togglePlay();
    this.dom.playBtn.onclick = togglePlay;
    this.dom.bigPlayBtn.onclick = togglePlay;
    document.getElementById('clickLayer').onclick = togglePlay;

    this.dom.video.ontimeupdate = () => this.updateProgress();
    
    let dragging = false;
    this.dom.progress.onmousedown = (e) => { dragging = true; this.seek(e); };
    document.onmousemove = (e) => dragging && this.seek(e);
    document.onmouseup = () => dragging = false;

    document.getElementById('snapshotBtn').onclick = () => this.takeSnapshot();
    document.getElementById('drawToggleBtn').onclick = () => this.toggleDrawMode();
    document.getElementById('clearDrawBtn').onclick = () => this.clearCanvas();
    this.dom.canvas.onmousedown = (e) => this.startDraw(e);
    this.dom.canvas.onmousemove = (e) => this.draw(e);
    window.onmouseup = () => this.state.drawing = false;
    
    const resetIdle = () => {
      this.dom.controls.classList.remove('hidden');
      clearTimeout(this.idleTimer);
      if(this.state.playing) this.idleTimer = setTimeout(() => this.dom.controls.classList.add('hidden'), 2500);
    };
    document.onmousemove = resetIdle;
    document.ontouchstart = resetIdle;

    document.getElementById('notesToggleBtn').onclick = () => this.dom.drawer.classList.toggle('open');
    document.getElementById('closeDrawerBtn').onclick = () => this.dom.drawer.classList.remove('open');
    document.getElementById('addNoteBtn').onclick = () => this.addNote();

    document.getElementById('loadUrlBtn').onclick = () => this.loadUrl();
    document.getElementById('fileInput').onchange = (e) => this.handleFiles(e);
    
    document.getElementById('muteBtn').onclick = () => this.toggleMute();
    document.getElementById('volSlider').oninput = (e) => this.setVolume(e.target.value);
    document.getElementById('settingsToggleBtn').onclick = () => document.getElementById('settingsMenu').classList.toggle('active');
    document.getElementById('speedSelect').onchange = (e) => this.setSpeed(e.target.value);
    document.getElementById('fsBtn').onclick = () => this.toggleFs();
  }

  setupCanvas() {
    const resize = () => {
      this.dom.canvas.width = this.dom.video.clientWidth;
      this.dom.canvas.height = this.dom.video.clientHeight;
    };
    new ResizeObserver(resize).observe(this.dom.video);
  }

  /* --- REVISED SNAPSHOT LOGIC --- */
  takeSnapshot() {
    const snapshotCanvas = document.createElement('canvas');
    const ctx = snapshotCanvas.getContext('2d');
    
    // 1. Determine Dimensions
    let width, height;
    if (this.state.isYT && this.ytPlayer) {
      width = 1280; height = 720; // Standard HD for YT
    } else {
      width = this.dom.video.videoWidth || this.dom.video.clientWidth;
      height = this.dom.video.videoHeight || this.dom.video.clientHeight;
    }
    
    snapshotCanvas.width = width;
    snapshotCanvas.height = height;

    // 2. Define the save logic (called after image load)
    const saveImage = () => {
      // Overlay Drawings
      if (this.dom.canvas.width > 0) {
        ctx.drawImage(this.dom.canvas, 0, 0, width, height);
      }
      
      // Overlay Timestamp
      const time = this.state.isYT ? this.ytPlayer.getCurrentTime() : this.dom.video.currentTime;
      const text = `⏱ ${this.fmtTime(time)}`;
      
      ctx.font = 'bold 16px Inter, sans-serif';
      const textWidth = ctx.measureText(text).width;
      
      // Timestamp Pill
      ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
      if (ctx.roundRect) ctx.roundRect(20, height - 50, textWidth + 30, 36, 8);
      else ctx.fillRect(20, height - 50, textWidth + 30, 36);
      ctx.fill();
      
      ctx.fillStyle = '#fff';
      ctx.fillText(text, 35, height - 26);

      // Download
      try {
        const dataURL = snapshotCanvas.toDataURL('image/png');
        const link = document.createElement('a');
        const timestamp = new Date().toISOString().replace(/[:.]/g, '-').slice(0, -5);
        link.download = `snapshot-${timestamp}.png`;
        link.href = dataURL;
        link.click();
        this.showNotification();
      } catch (e) {
        console.error("CORS Error:", e);
        alert("Snapshot failed. YouTube host restrictions prevented image capture.");
      }
    };

    // 3. Draw Background
    if (this.state.isYT && this.ytPlayer) {
      // Fetch YouTube Thumbnail (HD)
      const currentItem = this.state.playlist[this.state.playlistIdx];
      const videoId = currentItem.src;
      
      const img = new Image();
      img.crossOrigin = "Anonymous"; // Crucial for toDataURL
      
      // Try HD first
      img.src = `https://i.ytimg.com/vi/${videoId}/maxresdefault.jpg`;
      
      img.onload = () => {
        ctx.drawImage(img, 0, 0, width, height);
        saveImage();
      };
      
      img.onerror = () => {
        // Fallback to SD if HD missing
        img.src = `https://i.ytimg.com/vi/${videoId}/hqdefault.jpg`;
        img.onload = () => {
          ctx.drawImage(img, 0, 0, width, height);
          saveImage();
        };
        img.onerror = () => {
           // Fallback to black screen if all fails
          ctx.fillStyle = '#000';
          ctx.fillRect(0, 0, width, height);
          ctx.fillStyle = '#fff';
          ctx.textAlign = 'center';
          ctx.fillText('Thumbnail Unavailable', width/2, height/2);
          saveImage();
        };
      };
      
    } else {
      // Standard Video Frame
      ctx.drawImage(this.dom.video, 0, 0, width, height);
      saveImage();
    }
  }

  showNotification() {
    const notify = document.getElementById('snapshotNotify');
    notify.classList.add('show');
    feather.replace();
    setTimeout(() => notify.classList.remove('show'), 2000);
  }

  togglePlay() {
    this.state.playing = !this.state.playing;
    if (this.state.isYT && this.ytPlayer) {
      this.state.playing ? this.ytPlayer.playVideo() : this.ytPlayer.pauseVideo();
    } else {
      this.state.playing ? this.dom.video.play() : this.dom.video.pause();
    }
    this.updatePlayBtn();
    this.dom.bigPlayBtn.classList.toggle('visible', !this.state.playing);
  }

  updatePlayBtn() {
    const icon = this.state.playing ? 'pause' : 'play';
    this.dom.playBtn.innerHTML = `<i data-feather="${icon}"></i>`;
    this.dom.bigPlayBtn.innerHTML = `<i data-feather="${icon}" style="width:32px;height:32px;fill:white"></i>`;
    feather.replace();
  }

  updateProgress() {
    let curr, dur;
    if (this.state.isYT && this.ytPlayer && this.ytPlayer.getCurrentTime) {
      curr = this.ytPlayer.getCurrentTime();
      dur = this.ytPlayer.getDuration();
    } else {
      curr = this.dom.video.currentTime;
      dur = this.dom.video.duration || 1;
    }
    const pct = (curr / dur) * 100;
    this.dom.fill.style.width = `${pct}%`;
    this.dom.thumb.style.left = `${pct}%`;
    this.dom.currTime.innerText = this.fmtTime(curr);
    this.dom.durTime.innerText = this.fmtTime(dur);
  }

  seek(e) {
    const rect = this.dom.progress.getBoundingClientRect();
    const pos = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
    if (this.state.isYT && this.ytPlayer && this.ytPlayer.seekTo) {
      this.ytPlayer.seekTo(pos * this.ytPlayer.getDuration());
    } else {
      this.dom.video.currentTime = pos * this.dom.video.duration;
    }
    this.updateProgress();
  }

  toggleDrawMode() {
    this.state.drawMode = !this.state.drawMode;
    this.dom.drawTools.classList.toggle('active', this.state.drawMode);
    this.dom.canvas.classList.toggle('drawing', this.state.drawMode);
    document.getElementById('drawToggleBtn').classList.toggle('active', this.state.drawMode);
  }

  startDraw(e) {
    if (!this.state.drawMode) return;
    this.state.drawing = true;
    this.dom.ctx.beginPath();
    this.dom.ctx.moveTo(e.offsetX, e.offsetY);
    this.dom.ctx.strokeStyle = document.getElementById('drawColor').value;
    this.dom.ctx.lineWidth = document.getElementById('drawSize').value;
    const tool = document.getElementById('toolType').value;
    if(tool === 'eraser') this.dom.ctx.globalCompositeOperation = 'destination-out';
    else if(tool === 'marker') { this.dom.ctx.globalAlpha = 0.5; this.dom.ctx.globalCompositeOperation = 'source-over'; }
    else { this.dom.ctx.globalAlpha = 1; this.dom.ctx.globalCompositeOperation = 'source-over'; }
  }

  draw(e) {
    if (!this.state.drawing) return;
    this.dom.ctx.lineTo(e.offsetX, e.offsetY);
    this.dom.ctx.stroke();
  }

  clearCanvas() {
    this.dom.ctx.clearRect(0, 0, this.dom.canvas.width, this.dom.canvas.height);
  }

  toggleMute() {
    if (this.state.isYT && this.ytPlayer) {
      this.ytPlayer.isMuted() ? this.ytPlayer.unMute() : this.ytPlayer.mute();
    } else {
      this.dom.video.muted = !this.dom.video.muted;
    }
  }

  addNote() {
    const text = document.getElementById('noteText').value;
    if(!text) return;
    const time = (this.state.isYT && this.ytPlayer) ? this.ytPlayer.getCurrentTime() : this.dom.video.currentTime;
    const note = { time, text, img: document.getElementById('saveDrawCheck').checked ? this.dom.canvas.toDataURL() : null };
    this.state.notes.push(note);
    this.state.notes.sort((a,b) => a.time - b.time);
    this.renderNotes();
    this.saveNotes();
    document.getElementById('noteText').value = '';
  }

  deleteNote(index) {
    if(confirm('Delete this note?')) {
      this.state.notes.splice(index, 1);
      this.renderNotes();
      this.saveNotes();
    }
  }

  renderNotes() {
    const list = document.getElementById('noteList');
    if (this.state.notes.length === 0) {
      list.innerHTML = '<div style="text-align:center; color:var(--text-muted); font-size:13px; padding:20px;">No notes yet</div>';
      return;
    }

    list.innerHTML = this.state.notes.map((n, i) => `
      <div class="note-card" onclick="app.jumpToNote(${i})">
        <div class="note-header">
          <span class="note-time">${this.fmtTime(n.time)} ${n.img ? '• Drawing' : ''}</span>
          <button class="note-delete-btn" onclick="event.stopPropagation(); app.deleteNote(${i})">
            <i data-feather="trash-2"></i>
          </button>
        </div>
        <div style="font-size: 13px; line-height: 1.4; color: rgba(255,255,255,0.9);">${this.escapeHtml(n.text)}</div>
      </div>
    `).join('');
    feather.replace();
  }

  jumpToNote(i) {
    const n = this.state.notes[i];
    if(this.state.isYT && this.ytPlayer) this.ytPlayer.seekTo(n.time);
    else this.dom.video.currentTime = n.time;
    if(n.img) {
      const img = new Image();
      img.onload = () => this.dom.ctx.drawImage(img, 0, 0, this.dom.canvas.width, this.dom.canvas.height);
      img.src = n.img;
    }
  }

  escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  saveNotes() { localStorage.setItem('videoNotes', JSON.stringify(this.state.notes)); }
  loadNotes() {
    const saved = localStorage.getItem('videoNotes');
    if(saved) { 
      this.state.notes = JSON.parse(saved); 
      this.state.notes.sort((a,b) => a.time - b.time);
      this.renderNotes(); 
    }
  }

  handleFiles(e) {
    Array.from(e.target.files).forEach(f => {
      this.addToPlaylist(f.name, URL.createObjectURL(f), false);
    });
  }

  loadUrl() {
    const url = document.getElementById('urlInput').value.trim();
    if (!url) return;
    const ytId = this.extractYtId(url);
    if(ytId) this.addToPlaylist(`YouTube: ${ytId}`, ytId, true);
    else if(url) this.addToPlaylist('Web Video', url, false);
    document.getElementById('urlInput').value = '';
  }

  addToPlaylist(name, src, isYT) {
    this.state.playlist.push({ name, src, isYT });
    this.renderPlaylist();
    if(this.state.playlist.length === 1) this.playTrack(0);
  }

  renderPlaylist() {
    this.dom.playlist.innerHTML = this.state.playlist.map((item, i) => `
      <div class="playlist-item ${i === this.state.playlistIdx ? 'active' : ''}" onclick="app.playTrack(${i})">
        ${this.escapeHtml(item.name)}
      </div>
    `).join('');
  }

  playTrack(i) {
    this.state.playlistIdx = i;
    const item = this.state.playlist[i];
    this.state.isYT = item.isYT;
    this.renderPlaylist();

    if (this.ytUpdateInterval) {
      clearInterval(this.ytUpdateInterval);
      this.ytUpdateInterval = null;
    }

    if (item.isYT) {
      if (!this.state.ytReady) {
        alert('YouTube API is still loading. Please wait.');
        return;
      }
      this.dom.video.style.display = 'none';
      this.dom.video.pause();
      const ytContainer = document.getElementById('ytPlayerRef');
      ytContainer.style.display = 'block';
      
      if (!this.ytPlayer) {
        this.ytPlayer = new YT.Player('ytPlayerRef', {
          height: '100%', width: '100%', videoId: item.src,
          playerVars: { 'playsinline': 1, 'controls': 0, 'rel': 0, 'modestbranding': 1 },
          events: {
            'onReady': (e) => {
              e.target.playVideo();
              this.state.playing = true;
              this.updatePlayBtn();
              this.startYTUpdateLoop();
            },
            'onStateChange': (e) => {
              this.state.playing = (e.data === YT.PlayerState.PLAYING);
              this.updatePlayBtn();
              this.dom.bigPlayBtn.classList.toggle('visible', !this.state.playing);
            }
          }
        });
      } else {
        this.ytPlayer.loadVideoById(item.src);
        this.ytPlayer.playVideo();
        this.state.playing = true;
        this.updatePlayBtn();
        this.startYTUpdateLoop();
      }
    } else {
      this.state.isYT = false;
      document.getElementById('ytPlayerRef').style.display = 'none';
      if (this.ytPlayer) this.ytPlayer.stopVideo();
      this.dom.video.style.display = 'block';
      this.dom.video.src = item.src;
      this.dom.video.load();
      this.dom.video.play();
      this.state.playing = true;
      this.updatePlayBtn();
    }
  }

  startYTUpdateLoop() {
    if (this.ytUpdateInterval) clearInterval(this.ytUpdateInterval);
    this.ytUpdateInterval = setInterval(() => {
      if (this.state.isYT && this.ytPlayer && this.ytPlayer.getCurrentTime) {
        this.updateProgress();
      }
    }, 100);
  }

  extractYtId(url) {
    const patterns = [
      /(?:youtube\.com\/watch\?v=)([^&]+)/,
      /(?:youtu\.be\/)([^?]+)/,
      /(?:youtube\.com\/embed\/)([^?]+)/
    ];
    for (let pattern of patterns) {
      const match = url.match(pattern);
      if (match) return match[1];
    }
    return null;
  }

  fmtTime(s) {
    if (!s || !isFinite(s)) return '0:00';
    const m = Math.floor(s / 60);
    const sec = Math.floor(s % 60);
    return `${m}:${sec.toString().padStart(2, '0')}`;
  }

  setVolume(val) { 
    this.dom.video.volume = val; 
    if(this.ytPlayer && this.ytPlayer.setVolume) this.ytPlayer.setVolume(val * 100); 
  }

  setSpeed(val) { 
    this.dom.video.playbackRate = val; 
    if(this.ytPlayer && this.ytPlayer.setPlaybackRate) this.ytPlayer.setPlaybackRate(parseFloat(val)); 
  }

  toggleFs() { 
    document.fullscreenElement ? document.exitFullscreen() : document.getElementById('playerRef').requestFullscreen(); 
  }
}

app = new AdvancedPlayer();
</script>
