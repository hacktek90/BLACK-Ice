<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atmosphere Pro | Ultimate Weather</title>
    
    <!-- Fonts: Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- Leaflet CSS (Map) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        :root {
            /* --- DARK MODE DEFAULTS --- */
            --bg-sunny: linear-gradient(135deg, #fce38a 0%, #f38181 100%); 
            --bg-cloudy: linear-gradient(135deg, #89f7fe 0%, #66a6ff 100%);
            --bg-rainy: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%); 
            --bg-night: linear-gradient(135deg, #000000 0%, #434343 100%); 
            --bg-default: linear-gradient(135deg, #667eea 0%, #764ba2 100%);

            --glass-bg: rgba(255, 255, 255, 0.15);
            --glass-border: rgba(255, 255, 255, 0.2);
            --glass-highlight: rgba(255, 255, 255, 0.05);
            
            --text-main: #ffffff;
            --text-muted: rgba(255,255,255, 0.8);
            
            --radius-lg: 32px;
            --radius-md: 20px;
            --radius-sm: 12px;
        }

        /* --- LIGHT MODE OVERRIDES --- */
        [data-theme="light"] {
            /* Lighter, Pastel Gradients */
            --bg-sunny: linear-gradient(135deg, #f6d365 0%, #fda085 100%); 
            --bg-cloudy: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
            --bg-rainy: linear-gradient(135deg, #cfd9df 0%, #e2ebf0 100%); 
            --bg-night: linear-gradient(135deg, #141e30 0%, #243b55 100%); 
            --bg-default: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%);

            /* Solid UI Elements */
            --glass-bg: rgba(255, 255, 255, 0.6);
            --glass-border: rgba(255, 255, 255, 0.8);
            --glass-highlight: rgba(255, 255, 255, 0.4);
            
            --text-main: #2d3436;
            --text-muted: #636e72;
        }

        [data-theme="light"] .icon-btn { color: #333; background: rgba(255,255,255,0.5); }
        [data-theme="light"] .icon-btn:hover { background: white; }
        [data-theme="light"] .search-bar { background: rgba(255,255,255,0.7); }
        [data-theme="light"] .search-bar input { color: #333; }
        [data-theme="light"] .search-bar input::placeholder { color: #888; }
        [data-theme="light"] .geo-btn { color: #555; }
        [data-theme="light"] .geo-btn:hover { background: rgba(0,0,0,0.1); color: #000; }
        [data-theme="light"] .modal { background: rgba(255, 255, 255, 0.95); color: #333; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        [data-theme="light"] .close-btn { color: #333; }
        [data-theme="light"] .fav-item { background: rgba(0,0,0,0.03); color: #333; }
        [data-theme="light"] .fav-item:hover { background: rgba(0,0,0,0.08); }
        [data-theme="light"] .toast { color: #333; }

        /* --- Base Styles --- */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; -webkit-tap-highlight-color: transparent; }

        body {
            background: var(--bg-default);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-main);
            transition: background 1.5s ease; 
            padding: 20px;
        }

        /* --- Main App Container --- */
        .weather-app {
            width: 100%;
            max-width: 480px;
            height: 90vh;
            max-height: 900px;
            background: rgba(30, 30, 30, 0.4);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
            transition: background 0.5s ease, border-color 0.5s ease, box-shadow 0.5s ease;
        }

        [data-theme="light"] .weather-app {
            background: rgba(255, 255, 255, 0.4);
            box-shadow: 0 20px 50px rgba(0,0,0,0.1);
        }

        /* --- Header --- */
        header {
            padding: 20px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .app-title { font-size: 1.2rem; font-weight: 700; display: flex; align-items: center; gap: 8px; }
        .header-actions { display: flex; gap: 12px; }

        .icon-btn {
            background: rgba(255,255,255,0.1);
            border: none;
            width: 40px; height: 40px;
            border-radius: 50%;
            color: white;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.2rem;
            transition: 0.3s;
        }
        .icon-btn:hover { transform: scale(1.1); }
        .icon-btn.active { color: #ffd700; background: rgba(255,215,0,0.2); }
        
        /* Theme Toggle Specific */
        #themeToggle.active { color: #333; background: white; } 
        [data-theme="light"] #themeToggle { color: #333; background: rgba(0,0,0,0.05); }
        [data-theme="light"] #themeToggle:hover { background: white; }

        /* --- Search --- */
        .search-container { padding: 0 24px 16px; }
        .search-bar {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 50px;
            padding: 12px 20px;
            display: flex; align-items: center;
            transition: 0.3s;
        }
        .search-bar input { 
            background: transparent; border: none; color: white; 
            width: 100%; margin: 0 10px; outline: none; font-size: 1rem; 
        }
        .search-bar input::placeholder { color: var(--text-muted); }

        .geo-btn {
            background: transparent; border: none; color: var(--text-muted);
            cursor: pointer; font-size: 1.2rem; padding: 8px;
            border-radius: 50%; transition: 0.2s; display: flex; align-items: center;
        }
        .geo-btn:hover { background: rgba(255,255,255,0.2); color: white; }

        /* --- Scrollable Content Area --- */
        .content-area {
            flex: 1; overflow-y: auto; padding: 0 24px 24px;
            scrollbar-width: none; -ms-overflow-style: none;
        }
        .content-area::-webkit-scrollbar { display: none; }

        /* --- Main Weather --- */
        .main-weather { text-align: center; margin-bottom: 24px; }
        .city-name { font-size: 2rem; font-weight: 700; margin-bottom: 4px; }
        .date-text { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 16px; }
        
        .weather-icon-lg {
            font-size: 6rem; margin: 10px 0;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.2));
            animation: float 6s ease-in-out infinite;
        }
        
        .temperature { font-size: 5rem; font-weight: 700; line-height: 1; letter-spacing: -2px; text-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .condition { font-size: 1.2rem; text-transform: capitalize; margin-bottom: 8px; opacity: 0.9; }

        /* --- Details Grid --- */
        .details-grid {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 24px;
        }

        .detail-card {
            background: var(--glass-bg);
            padding: 16px; border-radius: var(--radius-md);
            border: 1px solid var(--glass-border);
            display: flex; flex-direction: column; justify-content: center; gap: 6px;
            transition: 0.2s;
        }
        .detail-card:hover { background: rgba(255,255,255,0.25); transform: translateY(-2px); }
        
        .detail-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
        .detail-icon { font-size: 1.4rem; opacity: 0.8; }
        .detail-label { font-size: 0.75rem; color: var(--text-muted); font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; }
        .detail-value { font-size: 1.1rem; font-weight: 600; }

        /* AQI */
        .aqi-indicator { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }

        /* --- Forecast Slider --- */
        .forecast-section { margin-bottom: 20px; }
        .forecast-title { font-size: 1rem; margin-bottom: 12px; opacity: 0.9; font-weight: 600; }
        
        .slider-wrapper { position: relative; width: 100%; display: flex; align-items: center; }
        .forecast-list {
            display: flex; gap: 12px; overflow-x: auto;
            padding: 10px 4px; scroll-behavior: smooth; scroll-snap-type: x mandatory;
            scrollbar-width: none;
        }
        .forecast-list::-webkit-scrollbar { display: none; }
        
        .forecast-item {
            flex: 0 0 auto; width: 80px; background: var(--glass-bg);
            padding: 16px 8px; border-radius: var(--radius-md);
            display: flex; flex-direction: column; align-items: center; gap: 8px;
            border: 1px solid var(--glass-border); scroll-snap-align: center;
            transition: 0.3s;
        }
        .forecast-item:hover { background: rgba(255,255,255,0.25); }
        .f-day { font-size: 0.85rem; font-weight: 600; }
        .f-icon { font-size: 1.8rem; }
        .f-temp { font-size: 0.95rem; font-weight: 600; }

        /* --- Modals --- */
        .modal-overlay {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6); backdrop-filter: blur(5px);
            z-index: 100; opacity: 0; pointer-events: none; transition: 0.3s;
            display: flex; align-items: center; justify-content: center;
        }
        .modal-overlay.active { opacity: 1; pointer-events: all; }

        .modal {
            background: #2d3436; width: 90%; max-width: 400px;
            border-radius: 24px; padding: 24px; color: white;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            transform: scale(0.9); transition: 0.3s; max-height: 80vh; display: flex; flex-direction: column;
        }
        .modal-overlay.active .modal { transform: scale(1); }

        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .modal-title { font-size: 1.2rem; font-weight: 700; }
        .close-btn { background: none; border: none; color: #b2bec3; font-size: 1.5rem; cursor: pointer; }

        /* Favorites List */
        .fav-list { overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 10px; }
        .fav-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 16px; background: rgba(255,255,255,0.05);
            border-radius: 12px; cursor: pointer; transition: 0.2s;
        }
        .fav-item:hover { background: rgba(255,255,255,0.1); }
        .fav-delete { color: #ff7675; background: none; border: none; font-size: 1.2rem; padding: 4px; }

        /* Map Container */
        #mapContainer { height: 400px; width: 100%; border-radius: 12px; z-index: 1; }

        /* --- Utilities --- */
        .toast {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(20px);
            background: rgba(255,255,255,0.95); color: #333; padding: 12px 24px;
            border-radius: 50px; font-size: 0.9rem; font-weight: 600; box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            opacity: 0; pointer-events: none; transition: 0.4s; z-index: 200; white-space: nowrap;
        }
        .toast.visible { transform: translateX(-50%) translateY(0); opacity: 1; }
        
        .loader {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5); backdrop-filter: blur(10px);
            display: flex; justify-content: center; align-items: center; z-index: 150;
            opacity: 0; pointer-events: none; transition: 0.3s;
        }
        .loader.active { opacity: 1; pointer-events: all; }
        .spinner { width: 40px; height: 40px; border: 4px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 1s linear infinite; }

        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

        /* Mobile tweaks */
        @media (max-width: 500px) {
            body { padding: 0; align-items: flex-start; background: var(--bg-default); }
            .weather-app { height: 100vh; max-width: 100%; border-radius: 0; border: none; }
        }
    </style>
</head>
<body data-theme="dark">

    <div class="weather-app">
        <!-- Toast -->
        <div id="toast" class="toast">City added to favorites</div>
        <div class="loader" id="loader"><div class="spinner"></div></div>

        <!-- Header -->
        <header>
            <div class="app-title"><i class="ph ph-cloud-sun"></i> SkyCast</div>
            <div class="header-actions">
                <button class="icon-btn" id="themeToggle" title="Toggle Theme"><i class="ph ph-moon"></i></button>
                <button class="icon-btn" id="mapBtn" title="Weather Map"><i class="ph ph-map-trifold"></i></button>
                <button class="icon-btn" id="favBtn" title="Favorites"><i class="ph ph-star"></i></button>
            </div>
        </header>

        <!-- Search -->
        <div class="search-container">
            <div class="search-bar">
                <i class="ph ph-magnifying-glass" style="color:var(--text-muted)"></i>
                <input type="text" id="cityInput" placeholder="Search city..." autocomplete="off">
                <button class="geo-btn" id="geoBtn" title="Get My Location">
                    <i class="ph ph-crosshair"></i>
                </button>
            </div>
        </div>

        <!-- Scrollable Content -->
        <div class="content-area">
            <!-- Main Weather -->
            <div class="main-weather">
                <h2 class="city-name" id="cityName">New York, US</h2>
                <p class="date-text" id="currentDate">Monday, 14 Oct</p>
                
                <i id="weatherIcon" class="ph ph-sun weather-icon-lg"></i>
                
                <div class="temperature"><span id="temp">22</span>°</div>
                <div class="condition" id="condition">Clear Sky</div>
            </div>

            <!-- Details Grid -->
            <div class="details-grid">
                <div class="detail-card">
                    <div class="detail-top"><i class="ph ph-drop detail-icon"></i> <span class="detail-label">Humidity</span></div>
                    <div class="detail-value" id="humidity">45%</div>
                </div>
                <div class="detail-card">
                    <div class="detail-top"><i class="ph ph-wind detail-icon"></i> <span class="detail-label">Wind</span></div>
                    <div class="detail-value" id="wind">12 km/h</div>
                </div>
                <div class="detail-card">
                    <div class="detail-top"><i class="ph ph-leaf detail-icon"></i> <span class="detail-label">Air Quality</span></div>
                    <div class="detail-value">
                        <span id="aqiDot" class="aqi-indicator"></span>
                        <span id="aqiText">Good</span>
                    </div>
                </div>
                <div class="detail-card">
                    <div class="detail-top"><i class="ph ph-thermometer detail-icon"></i> <span class="detail-label">Feels Like</span></div>
                    <div class="detail-value" id="feelsLike">24°</div>
                </div>
                <div class="detail-card">
                    <div class="detail-top"><i class="ph ph-sun-horizon detail-icon"></i> <span class="detail-label">Sunrise</span></div>
                    <div class="detail-value" id="sunrise">06:20 AM</div>
                </div>
                <div class="detail-card">
                    <div class="detail-top"><i class="ph ph-moon-stars detail-icon"></i> <span class="detail-label">Sunset</span></div>
                    <div class="detail-value" id="sunset">07:45 PM</div>
                </div>
            </div>

            <!-- Forecast Slider -->
            <div class="forecast-section">
                <div class="forecast-title">5-Day Forecast</div>
                <div class="slider-wrapper">
                    <div class="forecast-list" id="forecastList">
                        <!-- JS Injected -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Favorites Modal -->
    <div class="modal-overlay" id="favModal">
        <div class="modal">
            <div class="modal-header">
                <div class="modal-title">Favorite Cities</div>
                <button class="close-btn" onclick="toggleModal('favModal', false)"><i class="ph ph-x"></i></button>
            </div>
            <div class="fav-list" id="favListContainer">
                <p style="text-align:center; opacity: 0.6; margin-top:20px;">No favorites yet.</p>
            </div>
        </div>
    </div>

    <!-- Map Modal -->
    <div class="modal-overlay" id="mapModal">
        <div class="modal">
            <div class="modal-header">
                <div class="modal-title">Live Weather Map</div>
                <button class="close-btn" onclick="toggleModal('mapModal', false)"><i class="ph ph-x"></i></button>
            </div>
            <div id="mapContainer"></div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // --- Configuration ---
        const API_KEY = "0f0ad62d37143feb09141d39995dcb8f";
        const BASE_URL = "https://api.openweathermap.org/data/2.5/";

        // --- State ---
        let currentCity = { name: "New York", lat: 40.7128, lon: -74.0060 };
        let map = null;
        let mapLayer = null;
        let favorites = JSON.parse(localStorage.getItem('weatherFavs')) || [];
        let currentTheme = localStorage.getItem('theme') || 'dark';

        // --- DOM ---
        const ui = {
            body: document.body,
            cityInput: document.getElementById('cityInput'),
            cityName: document.getElementById('cityName'),
            date: document.getElementById('currentDate'),
            icon: document.getElementById('weatherIcon'),
            temp: document.getElementById('temp'),
            condition: document.getElementById('condition'),
            humidity: document.getElementById('humidity'),
            wind: document.getElementById('wind'),
            aqiDot: document.getElementById('aqiDot'),
            aqiText: document.getElementById('aqiText'),
            feelsLike: document.getElementById('feelsLike'),
            sunrise: document.getElementById('sunrise'),
            sunset: document.getElementById('sunset'),
            forecast: document.getElementById('forecastList'),
            loader: document.getElementById('loader'),
            toast: document.getElementById('toast'),
            favBtn: document.getElementById('favBtn'),
            mapBtn: document.getElementById('mapBtn'),
            themeBtn: document.getElementById('themeToggle'),
            geoBtn: document.getElementById('geoBtn'),
            favList: document.getElementById('favListContainer')
        };

        // --- Initialization ---
        
        // Set initial theme
        setTheme(currentTheme);

        ui.cityInput.addEventListener('keypress', (e) => {
            if(e.key === 'Enter') fetchWeather(ui.cityInput.value);
        });

        ui.favBtn.addEventListener('click', () => {
            const exists = favorites.find(f => f.name.toLowerCase() === currentCity.name.toLowerCase());
            if(exists) openFavoritesModal();
            else addFavorite();
        });

        ui.themeBtn.addEventListener('click', () => {
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            setTheme(newTheme);
        });

        ui.mapBtn.addEventListener('click', () => {
            toggleModal('mapModal', true);
            setTimeout(() => {
                initMap(currentCity.lat, currentCity.lon);
            }, 300);
        });

        ui.geoBtn.addEventListener('click', () => {
            if (navigator.geolocation) {
                showLoader(true);
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const { latitude, longitude } = position.coords;
                        fetchWeatherByCoords(latitude, longitude);
                    },
                    (error) => {
                        showLoader(false);
                        showToast("Unable to retrieve location", true);
                    }
                );
            } else {
                showToast("Geolocation not supported", true);
            }
        });

        // Fetch initial data
        fetchWeather("New York");

        // --- Core Logic ---

        async function fetchWeather(city) {
            if(!city) return;
            showLoader(true);
            try {
                const res = await fetch(`${BASE_URL}weather?q=${city}&units=metric&appid=${API_KEY}`);
                if(!res.ok) throw new Error("City not found");
                const data = await res.json();
                
                currentCity = { name: data.name, lat: data.coord.lat, lon: data.coord.lon };

                const foreRes = await fetch(`${BASE_URL}forecast?q=${city}&units=metric&appid=${API_KEY}`);
                const foreData = await foreRes.json();

                const aqiRes = await fetch(`${BASE_URL}air_pollution?lat=${currentCity.lat}&lon=${currentCity.lon}&appid=${API_KEY}`);
                const aqiData = await aqiRes.json();

                updateUI(data, foreData, aqiData);
                updateFavButtonState();
            } catch (err) {
                showToast(err.message, true);
            } finally {
                showLoader(false);
            }
        }

        async function fetchWeatherByCoords(lat, lon) {
            try {
                const res = await fetch(`${BASE_URL}weather?lat=${lat}&lon=${lon}&units=metric&appid=${API_KEY}`);
                if(!res.ok) throw new Error("Unable to fetch weather");
                const data = await res.json();
                
                currentCity = { name: data.name, lat: data.coord.lat, lon: data.coord.lon };

                const foreRes = await fetch(`${BASE_URL}forecast?lat=${lat}&lon=${lon}&units=metric&appid=${API_KEY}`);
                const foreData = await foreRes.json();

                const aqiRes = await fetch(`${BASE_URL}air_pollution?lat=${lat}&lon=${lon}&appid=${API_KEY}`);
                const aqiData = await aqiRes.json();

                updateUI(data, foreData, aqiData);
                updateFavButtonState();
            } catch (err) {
                showToast(err.message, true);
            } finally {
                showLoader(false);
            }
        }

        function updateUI(current, forecast, aqi) {
            ui.cityName.textContent = `${current.name}, ${current.sys.country}`;
            ui.date.textContent = new Date().toLocaleDateString('en-US', { weekday: 'long', day: 'numeric', month: 'short' });
            ui.temp.textContent = Math.round(current.main.temp);
            ui.condition.textContent = current.weather[0].description;
            ui.humidity.textContent = `${current.main.humidity}%`;
            ui.wind.textContent = `${current.wind.speed} m/s`;
            ui.feelsLike.textContent = `${Math.round(current.main.feels_like)}°`;

            const rise = new Date(current.sys.sunrise * 1000).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            const set = new Date(current.sys.sunset * 1000).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            ui.sunrise.textContent = rise;
            ui.sunset.textContent = set;

            const aqiIndex = aqi.list[0].main.aqi;
            updateAQI(aqiIndex);

            updateVisuals(current.weather[0].main, current.weather[0].icon);
            renderForecast(forecast);
        }

        function updateAQI(index) {
            let color = '#00e400'; let text = 'Good';
            if (index === 2) { color = '#ffff00'; text = 'Fair'; }
            else if (index === 3) { color = '#ff7e00'; text = 'Moderate'; }
            else if (index === 4) { color = '#ff0000'; text = 'Poor'; }
            else if (index === 5) { color = '#99004c'; text = 'Very Poor'; }
            ui.aqiDot.style.backgroundColor = color;
            ui.aqiText.textContent = text;
        }

        function updateVisuals(condition, iconCode) {
            ui.icon.className = `ph ${getIconClass(iconCode)} weather-icon-lg`;

            let bgVar = '--bg-default';
            const cond = condition.toLowerCase();
            const isNight = iconCode.includes('n');

            if (cond.includes('clear') && !isNight) bgVar = '--bg-sunny';
            else if (cond.includes('rain') || cond.includes('drizzle') || cond.includes('thunderstorm')) bgVar = '--bg-rainy';
            else if (isNight) bgVar = '--bg-night';
            else if (cond.includes('clouds')) bgVar = '--bg-cloudy';
            
            ui.body.style.background = `var(${bgVar})`;
        }

        function renderForecast(data) {
            ui.forecast.innerHTML = '';
            const days = data.list.filter((r, i) => i % 8 === 0).slice(0, 5);
            
            days.forEach(day => {
                const dayName = new Date(day.dt * 1000).toLocaleDateString('en-US', { weekday: 'short' });
                const icon = getIconClass(day.weather[0].icon);
                const temp = Math.round(day.main.temp);
                
                ui.forecast.innerHTML += `
                    <div class="forecast-item">
                        <span class="f-day">${dayName}</span>
                        <i class="ph ${icon} f-icon"></i>
                        <span class="f-temp">${temp}°</span>
                    </div>
                `;
            });
        }

        // --- Theme System ---
        function setTheme(theme) {
            currentTheme = theme;
            ui.body.setAttribute('data-theme', theme);
            localStorage.setItem('theme', theme);
            
            const icon = ui.themeBtn.querySelector('i');
            if(theme === 'light') {
                icon.className = 'ph ph-sun';
            } else {
                icon.className = 'ph ph-moon';
            }
        }

        // --- Favorites System ---
        function addFavorite() {
            favorites.push(currentCity);
            localStorage.setItem('weatherFavs', JSON.stringify(favorites));
            showToast("City added to favorites");
            updateFavButtonState();
        }

        function removeFavorite(index) {
            favorites.splice(index, 1);
            localStorage.setItem('weatherFavs', JSON.stringify(favorites));
            renderFavoritesList();
            updateFavButtonState();
        }

        function updateFavButtonState() {
            const isFav = favorites.find(f => f.name.toLowerCase() === currentCity.name.toLowerCase());
            if(isFav) ui.favBtn.classList.add('active');
            else ui.favBtn.classList.remove('active');
        }

        function openFavoritesModal() {
            renderFavoritesList();
            toggleModal('favModal', true);
        }

        function renderFavoritesList() {
            ui.favList.innerHTML = '';
            if(favorites.length === 0) {
                ui.favList.innerHTML = '<p style="text-align:center; opacity:0.6; margin-top:20px;">No favorites yet.</p>';
                return;
            }
            favorites.forEach((city, index) => {
                ui.favList.innerHTML += `
                    <div class="fav-item" onclick="loadFavorite(${index})">
                        <span>${city.name}</span>
                        <button class="fav-delete" onclick="event.stopPropagation(); removeFavorite(${index})">
                            <i class="ph ph-trash"></i>
                        </button>
                    </div>
                `;
            });
        }

        window.loadFavorite = function(index) {
            fetchWeather(favorites[index].name);
            toggleModal('favModal', false);
        }

        // --- Map System ---
        function initMap(lat, lon) {
            if (!map) {
                map = L.map('mapContainer').setView([lat, lon], 10);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '&copy; OpenStreetMap'
                }).addTo(map);
            } else {
                map.setView([lat, lon], 10);
            }

            if(mapLayer) map.removeLayer(mapLayer);
            mapLayer = L.tileLayer(`https://tile.openweathermap.org/map/clouds_new/{z}/{x}/{y}.png?appid=${API_KEY}`, {
                opacity: 0.6
            }).addTo(map);
            
            setTimeout(() => { map.invalidateSize(); }, 100);
        }

        // --- Helpers ---
        function getIconClass(code) {
            if(code.includes('01')) return code.includes('n') ? 'ph-moon' : 'ph-sun';
            if(code.includes('02')) return code.includes('n') ? 'ph-cloud-moon' : 'ph-cloud-sun';
            if(code.includes('03') || code.includes('04')) return 'ph-cloud';
            if(code.includes('09') || code.includes('10')) return 'ph-cloud-rain';
            if(code.includes('11')) return 'ph-cloud-lightning';
            if(code.includes('13')) return 'ph-snowflake';
            return 'ph-cloud';
        }

        window.toggleModal = function(id, show) {
            const el = document.getElementById(id);
            if(show) el.classList.add('active');
            else el.classList.remove('active');
        }

        function showLoader(show) {
            if(show) ui.loader.classList.add('active');
            else ui.loader.classList.remove('active');
        }

        function showToast(msg, isError = false) {
            ui.toast.textContent = msg;
            ui.toast.style.background = isError ? '#ff7675' : 'rgba(255,255,255,0.95)';
            ui.toast.classList.add('visible');
            setTimeout(() => ui.toast.classList.remove('visible'), 3000);
        }

        // --- Right Click Block (New Feature) ---
        document.addEventListener('contextmenu', (e) => {
            e.preventDefault();
        });
    </script>
</body>
</html>
