<!DOCTYPE html>
<html lang="en" data-theme="light" data-unit="c">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Atmosphere Pro | Swiss Weather</title>
    
    <!-- Fonts: Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- Leaflet CSS (Map) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        :root {
            /* --- SWISS PALETTE --- */
            --font-main: 'Outfit', sans-serif;
            
            /* Structural */
            --app-width: 480px;
            --app-radius: 28px;
            --border-thin: 1px solid rgba(0, 0, 0, 0.06);
            --shadow-soft: 0 25px 50px -12px rgba(0,0,0,0.15);
            
            /* Colors - Light */
            --bg-body: #F3F4F6;
            --bg-card: rgba(255, 255, 255, 0.65);
            --bg-card-hover: rgba(255, 255, 255, 0.85);
            --text-primary: #111827;
            --text-secondary: #6B7280;
            --accent-color: #EB5757; /* Swiss Red */
            --accent-light: #FFF1F1;
            
            /* Weather Gradients - Light */
            --grad-sunny: linear-gradient(135deg, #FFF7ED 0%, #FFEDD5 100%);
            --grad-cloudy: linear-gradient(135deg, #F3F4F6 0%, #E5E7EB 100%);
            --grad-rainy: linear-gradient(135deg, #E0F2FE 0%, #BAE6FD 100%);
            --grad-night: linear-gradient(135deg, #111827 0%, #1F2937 100%);
            --grad-default: linear-gradient(135deg, #FFFFFF 0%, #F9FAFB 100%);
        }

        /* --- DARK MODE --- */
        [data-theme="dark"] {
            --bg-body: #050505;
            --bg-card: rgba(25, 25, 25, 0.6);
            --bg-card-hover: rgba(40, 40, 40, 0.8);
            --text-primary: #F9FAFB;
            --text-secondary: #9CA3AF;
            --accent-color: #FF6B6B;
            --border-thin: 1px solid rgba(255, 255, 255, 0.08);
            --shadow-soft: 0 25px 50px -12px rgba(0,0,0,0.6);

            /* Weather Gradients - Dark */
            --grad-sunny: linear-gradient(135deg, #374151 0%, #4B5563 100%);
            --grad-cloudy: linear-gradient(135deg, #1F2937 0%, #111827 100%);
            --grad-rainy: linear-gradient(135deg, #0C4A6E 0%, #075985 100%);
            --grad-night: linear-gradient(135deg, #000000 0%, #111827 100%);
            --grad-default: linear-gradient(135deg, #111827 0%, #1F2937 100%);
        }

        /* --- RESET & BASE --- */
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
        
        body {
            font-family: var(--font-main);
            background: var(--bg-body);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            transition: background 0.6s ease;
            position: relative;
        }

        /* Dynamic Backgrounds */
        body.weather-sunny { background: var(--grad-sunny); }
        body.weather-cloudy { background: var(--grad-cloudy); }
        body.weather-rainy { background: var(--grad-rainy); }
        body.weather-night { background: var(--grad-night); }

        /* --- NOISE TEXTURE --- */
        .noise-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 1;
            opacity: 0.04;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* --- APP CONTAINER --- */
        .app-container {
            width: var(--app-width);
            height: 92vh;
            max-height: 880px;
            background: var(--bg-card);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: var(--app-radius);
            border: var(--border-thin);
            box-shadow: var(--shadow-soft);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            z-index: 2;
            transition: all 0.4s ease;
        }

        @media (max-width: 500px) {
            .app-container { width: 100%; height: 100vh; max-height: none; border-radius: 0; border: none; }
        }

        /* --- HEADER --- */
        header {
            padding: 28px 28px 16px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .header-left h1 {
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: -0.04em;
            margin-bottom: 4px;
        }
        .greeting {
            font-size: 0.85rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .header-controls { 
            display: flex; 
            gap: 8px; 
            background: rgba(128,128,128,0.08); 
            padding: 4px; 
            border-radius: 12px; 
        }

        .icon-btn {
            background: transparent;
            border: none;
            width: 36px; height: 36px;
            border-radius: 8px;
            color: var(--text-primary);
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.1rem;
            transition: all 0.2s ease;
        }
        .icon-btn:hover { background: rgba(128,128,128,0.1); transform: translateY(-1px); }
        .icon-btn.active { color: var(--accent-color); background: var(--accent-light); }
        [data-theme="dark"] .icon-btn.active { background: rgba(255, 107, 107, 0.15); }

        .unit-toggle {
            display: flex; align-items: center; gap: 4px;
            font-size: 0.8rem; font-weight: 600; color: var(--text-secondary);
            padding: 0 8px;
            border-right: 1px solid rgba(128,128,128,0.2);
            margin-right: 4px;
            cursor: pointer;
            user-select: none;
        }

        /* --- SEARCH --- */
        .search-section { padding: 0 28px 20px; }
        .search-wrapper { position: relative; display: flex; align-items: center; }
        
        .search-input {
            width: 100%;
            background: rgba(128,128,128,0.04);
            border: 1px solid transparent;
            padding: 14px 16px 14px 44px;
            border-radius: 14px;
            font-family: var(--font-main);
            font-size: 0.95rem;
            color: var(--text-primary);
            outline: none;
            transition: 0.3s;
            font-variant-numeric: tabular-nums;
        }
        .search-input:focus {
            background: var(--bg-card-hover);
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(235, 87, 87, 0.1);
        }
        .search-icon { position: absolute; left: 14px; color: var(--text-secondary); font-size: 1.1rem; }

        /* --- SCROLLABLE CONTENT --- */
        .content-scroll {
            flex: 1; overflow-y: auto; overflow-x: hidden;
            padding: 0 28px 28px;
            scrollbar-width: none;
        }
        .content-scroll::-webkit-scrollbar { display: none; }

        /* --- HERO --- */
        .hero { text-align: center; margin-bottom: 32px; padding-top: 10px; position: relative; }
        .city-h1 { font-size: 2rem; font-weight: 600; letter-spacing: -0.04em; margin-bottom: 4px; }
        .date-p { font-size: 0.9rem; color: var(--text-secondary); font-weight: 400; margin-bottom: 24px; }
        
        .weather-display { display: flex; flex-direction: column; align-items: center; gap: 8px; }
        .weather-icon-main { font-size: 5.5rem; color: var(--text-primary); filter: drop-shadow(0 10px 20px rgba(0,0,0,0.15)); }
        
        .temp-huge { 
            font-size: 6.5rem; 
            font-weight: 300; 
            line-height: 0.85; 
            letter-spacing: -4px; 
            font-variant-numeric: tabular-nums;
            position: relative;
            display: inline-block;
        }
        .temp-huge sup {
            font-size: 2rem; 
            position: absolute; 
            top: 10px; 
            right: -25px; 
            color: var(--text-secondary);
            font-weight: 500;
        }
        .condition-text { font-size: 1.2rem; font-weight: 500; text-transform: capitalize; color: var(--text-secondary); margin-top: -5px; }

        /* --- CHART SECTION --- */
        .chart-container {
            background: rgba(128,128,128,0.03);
            border: 1px solid rgba(128,128,128,0.06);
            border-radius: 20px;
            padding: 20px 16px 10px;
            margin-bottom: 24px;
        }
        .chart-header { display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 0.85rem; font-weight: 600; color: var(--text-secondary); }
        
        /* SVG Chart Styles */
        svg.temp-chart { width: 100%; height: 80px; overflow: visible; }
        .chart-line { fill: none; stroke: var(--accent-color); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
        .chart-area { fill: var(--accent-color); opacity: 0.1; }
        .chart-point { fill: var(--bg-card); stroke: var(--accent-color); stroke-width: 2; r: 4; cursor: pointer; transition: r 0.2s; }
        .chart-point:hover { r: 6; }
        .chart-label { font-size: 0.7rem; fill: var(--text-secondary); text-anchor: middle; font-weight: 500; }

        /* --- GRID SYSTEM --- */
        .grid-container { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 24px; }
        .card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(128,128,128,0.05);
            border-radius: 18px;
            padding: 18px;
            display: flex; flex-direction: column; justify-content: space-between;
            transition: 0.3s;
        }
        .card:hover { background: var(--bg-card-hover); transform: translateY(-2px); border-color: rgba(128,128,128,0.1); }
        .card-full { grid-column: span 2; }
        
        .card-label { font-size: 0.75rem; color: var(--text-secondary); font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; display: flex; align-items: center; gap: 6px; margin-bottom: 12px; }
        .card-value { font-size: 1.35rem; font-weight: 600; font-variant-numeric: tabular-nums; }
        .card-sub { font-size: 0.8rem; color: var(--text-secondary); margin-top: 4px; display: flex; align-items: center; gap: 4px;}

        /* --- FORECAST --- */
        .section-title { font-size: 1rem; font-weight: 600; margin-bottom: 14px; padding-left: 2px; display: flex; align-items: center; gap: 8px; }
        .section-title::before { content:''; width: 4px; height: 16px; background: var(--accent-color); border-radius: 2px; }
        
        .forecast-scroller { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 16px; scroll-snap-type: x mandatory; scrollbar-width: none; }
        .forecast-scroller::-webkit-scrollbar { display: none; }

        .f-item {
            flex: 0 0 auto; width: 76px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(128,128,128,0.05);
            border-radius: 20px;
            padding: 16px 0;
            display: flex; flex-direction: column; align-items: center; gap: 8px;
            scroll-snap-align: start; transition: 0.2s;
        }
        .f-item:hover { background: var(--bg-card-hover); border-color: rgba(128,128,128,0.15); }
        .f-day { font-size: 0.8rem; color: var(--text-secondary); font-weight: 500; }
        .f-icon { font-size: 1.8rem; margin: 4px 0; color: var(--text-primary); }
        .f-temp { font-size: 1rem; font-weight: 600; font-variant-numeric: tabular-nums; }
        .f-low { font-size: 0.8rem; color: var(--text-secondary); }

        /* --- MODALS --- */
        .modal-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); backdrop-filter: blur(8px);
            z-index: 100; opacity: 0; pointer-events: none; transition: 0.3s;
            display: flex; align-items: center; justify-content: center; padding: 28px;
        }
        .modal-overlay.open { opacity: 1; pointer-events: auto; }
        .modal {
            background: var(--bg-body);
            width: 100%; max-width: 420px;
            border-radius: 24px; padding: 24px;
            box-shadow: var(--shadow-soft);
            border: var(--border-thin);
            transform: scale(0.95); transition: 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: flex; flex-direction: column; max-height: 80vh;
        }
        .modal-overlay.open .modal { transform: scale(1); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .modal-title { font-size: 1.2rem; font-weight: 700; }
        .close-modal { background: none; border: none; font-size: 1.5rem; color: var(--text-secondary); cursor: pointer; }
        
        /* Map */
        #map { width: 100%; height: 320px; border-radius: 16px; z-index: 1; }

        /* --- TOAST --- */
        .toast {
            position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%) translateY(20px);
            background: var(--text-primary); color: var(--bg-body);
            padding: 12px 24px; border-radius: 50px; font-size: 0.9rem; font-weight: 600;
            opacity: 0; pointer-events: none; transition: 0.4s; z-index: 200; white-space: nowrap;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        /* --- LOADER --- */
        .loader {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.2); backdrop-filter: blur(4px);
            z-index: 150; display: flex; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none; transition: 0.3s;
        }
        .loader.active { opacity: 1; pointer-events: auto; }
        .spinner { width: 32px; height: 32px; border: 3px solid var(--text-primary); border-bottom-color: transparent; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

    </style>
</head>
<body>
    <div class="noise-overlay"></div>

    <div class="app-container">
        
        <!-- Header -->
        <header>
            <div class="header-left">
                <h1>Atmosphere</h1>
                <p class="greeting" id="greeting">Good Morning</p>
            </div>
            <div class="header-controls">
                <div class="unit-toggle" id="unitToggle">
                    <span id="unitC" style="color:var(--text-primary)">°C</span> / <span id="unitF">°F</span>
                </div>
                <button class="icon-btn" id="btnGeo" title="Location"><i class="ph ph-crosshair"></i></button>
                <button class="icon-btn" id="btnTheme" title="Theme"><i class="ph ph-moon"></i></button>
                <button class="icon-btn" id="btnFav" title="Favorites"><i class="ph ph-heart"></i></button>
                <button class="icon-btn" id="btnMap" title="Map"><i class="ph ph-map-trifold"></i></button>
            </div>
        </header>

        <!-- Search -->
        <section class="search-section">
            <div class="search-wrapper">
                <i class="ph ph-magnifying-glass search-icon"></i>
                <input type="text" class="search-input" id="cityInput" placeholder="Search city..." autocomplete="off">
            </div>
        </section>

        <!-- Main Content -->
        <div class="content-scroll">
            
            <!-- Hero -->
            <section class="hero">
                <h2 class="city-h1" id="cityName">New York</h2>
                <p class="date-p" id="currentDate">Mon, 14 Oct</p>
                
                <div class="weather-display">
                    <i id="weatherIcon" class="ph ph-sun weather-icon-main"></i>
                    <h2 class="temp-huge"><span id="temp">22</span><sup id="tempUnit">°C</sup></h2>
                    <p class="condition-text" id="condition">Clear Sky</p>
                </div>
            </section>

            <!-- Hourly Chart -->
            <div class="chart-container">
                <div class="chart-header">
                    <span>24h Trend</span>
                    <span id="chartLabelHigh" style="color:var(--text-primary)">22°</span>
                </div>
                <svg class="temp-chart" id="hourlyChart" preserveAspectRatio="none">
                    <!-- Dynamic SVG Content -->
                </svg>
            </div>

            <!-- Grid Details -->
            <div class="grid-container">
                <!-- Humidity -->
                <div class="card">
                    <div class="card-label"><i class="ph ph-drop"></i> Humidity</div>
                    <div class="card-value" id="humidity">45%</div>
                    <div class="card-sub">Dew Point: <span id="dewPoint">12°</span></div>
                </div>
                <!-- Wind -->
                <div class="card">
                    <div class="card-label"><i class="ph ph-wind"></i> Wind</div>
                    <div class="card-value" id="wind">12 <span class="speedUnit">km/h</span></div>
                    <div class="card-sub">Direction: <span id="windDir">NW</span></div>
                </div>
                <!-- Visibility -->
                <div class="card">
                    <div class="card-label"><i class="ph ph-eye"></i> Visibility</div>
                    <div class="card-value" id="visibility">10 <span class="visUnit">km</span></div>
                </div>
                <!-- Pressure -->
                <div class="card">
                    <div class="card-label"><i class="ph ph-gauge"></i> Pressure</div>
                    <div class="card-value" id="pressure">1012 <span class="presUnit">hPa</span></div>
                </div>
                <!-- Sunrise/Sunset -->
                <div class="card">
                    <div class="card-label"><i class="ph ph-sun-horizon"></i> Sunrise</div>
                    <div class="card-value" id="sunrise">06:20</div>
                </div>
                <div class="card">
                    <div class="card-label"><i class="ph ph-moon"></i> Sunset</div>
                    <div class="card-value" id="sunset">19:45</div>
                </div>
            </div>

            <!-- Forecast -->
            <div class="section-title">5-Day Forecast</div>
            <div class="forecast-scroller" id="forecastList"></div>
        </div>

        <!-- Modals -->
        <div class="modal-overlay" id="modalMap">
            <div class="modal">
                <div class="modal-header">
                    <div class="modal-title">Live Map</div>
                    <button class="close-modal" onclick="closeModal('modalMap')"><i class="ph ph-x"></i></button>
                </div>
                <div id="map"></div>
            </div>
        </div>

        <div class="loader" id="loader"><div class="spinner"></div></div>
        <div class="toast" id="toast">Message</div>

    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // --- CONFIGURATION ---
        const API_KEY = "0f0ad62d37143feb09141d39995dcb8f";
        const BASE_URL = "https://api.openweathermap.org/data/2.5/";

        // --- STATE ---
        let currentCity = { name: "New York", lat: 40.7128, lon: -74.0060 };
        let currentUnit = 'c'; // 'c' or 'f'
        let hourlyDataCache = []; // Store raw metric data for chart
        let map = null;
        let mapLayer = null;

        // --- DOM HELPERS ---
        const $ = (id) => document.getElementById(id);
        const ui = {
            body: document.body,
            input: $('cityInput'),
            city: $('cityName'),
            date: $('currentDate'),
            greeting: $('greeting'),
            icon: $('weatherIcon'),
            temp: $('temp'),
            tempUnit: $('tempUnit'),
            cond: $('condition'),
            humidity: $('humidity'),
            dewPoint: $('dewPoint'),
            wind: $('wind'),
            windDir: $('windDir'),
            visibility: $('visibility'),
            pressure: $('pressure'),
            sunrise: $('sunrise'),
            sunset: $('sunset'),
            chart: $('hourlyChart'),
            chartHigh: $('chartLabelHigh'),
            forecast: $('forecastList'),
            loader: $('loader'),
            toast: $('toast'),
            favBtn: $('btnFav'),
            unitToggle: $('unitToggle'),
            unitC: $('unitC'),
            unitF: $('unitF')
        };

        // --- INITIALIZATION ---
        window.addEventListener('DOMContentLoaded', () => {
            loadTheme();
            setGreeting();
            fetchWeather("New York");
        });

        ui.input.addEventListener('keypress', (e) => { if(e.key === 'Enter') fetchWeather(ui.input.value); });
        $('btnTheme').addEventListener('click', toggleTheme);
        $('btnGeo').addEventListener('click', getLocation);
        $('btnFav').addEventListener('click', toggleFavoriteUI);
        $('btnMap').addEventListener('click', () => {
            openModal('modalMap');
            setTimeout(() => initMap(currentCity.lat, currentCity.lon), 300);
        });
        
        // --- UNIT TOGGLE LOGIC ---
        ui.unitToggle.addEventListener('click', () => {
            currentUnit = currentUnit === 'c' ? 'f' : 'c';
            ui.unitC.style.color = currentUnit === 'c' ? 'var(--text-primary)' : 'var(--text-secondary)';
            ui.unitF.style.color = currentUnit === 'f' ? 'var(--text-primary)' : 'var(--text-secondary)';
            ui.tempUnit.textContent = `°${currentUnit.toUpperCase()}`;
            
            // Re-render data without API call
            if(hourlyDataCache.length > 0) updateUIUnits();
        });

        function toFahrenheit(c) { return Math.round((c * 9/5) + 32); }
        function toKmh(ms) { return Math.round(ms * 3.6); }
        function toMiles(km) { return Math.round(km * 0.621371); }

        function getVal(celsius) {
            return currentUnit === 'c' ? Math.round(celsius) : toFahrenheit(celsius);
        }

        function updateUIUnits() {
            // Update Main Temp
            if(hourlyDataCache.length > 0) {
                ui.temp.textContent = getVal(hourlyDataCache[0].main.temp);
                
                // Update Chart
                drawChart(hourlyDataCache);
                
                // Update Grid
                ui.humidity.textContent = `${hourlyDataCache[0].main.humidity}%`;
                ui.wind.innerHTML = `${currentUnit === 'c' ? toKmh(hourlyDataCache[0].wind.speed) : Math.round(hourlyDataCache[0].wind.speed)} <span class="speedUnit">${currentUnit === 'c' ? 'km/h' : 'mph'}</span>`;
                ui.visibility.innerHTML = `${currentUnit === 'c' ? (hourlyDataCache[0].visibility/1000).toFixed(1) : ((hourlyDataCache[0].visibility/1000)*0.62).toFixed(1)} <span class="visUnit">${currentUnit === 'c' ? 'km' : 'mi'}</span>`;
                ui.pressure.innerHTML = `${hourlyDataCache[0].main.pressure} <span class="presUnit">hPa</span>`;
                
                // Dew point calc approximation
                const T = hourlyDataCache[0].main.temp;
                const RH = hourlyDataCache[0].main.humidity;
                const dewPoint = T - ((100 - RH) / 5);
                ui.dewPoint.textContent = `${getVal(dewPoint)}°`;
            }
        }

        // --- CORE LOGIC ---
        async function fetchWeather(query) {
            showLoader(true);
            try {
                const res = await fetch(`${BASE_URL}weather?q=${query}&units=metric&appid=${API_KEY}`);
                if(!res.ok) throw new Error("City not found");
                const data = await res.json();
                
                currentCity = { name: data.name, lat: data.coord.lat, lon: data.coord.lon };

                const foreRes = await fetch(`${BASE_URL}forecast?q=${query}&units=metric&appid=${API_KEY}`);
                const foreData = await foreRes.json();

                updateDOM(data, foreData);
                updateFavIconState();
                ui.input.value = '';
            } catch (err) {
                showToast(err.message);
            } finally {
                showLoader(false);
            }
        }

        function updateDOM(current, forecast) {
            // Cache raw metric data (next 8 items = 24 hours)
            hourlyDataCache = forecast.list.slice(0, 8);

            ui.city.textContent = `${current.name}, ${current.sys.country}`;
            ui.date.textContent = new Date().toLocaleDateString('en-US', { weekday: 'short', day: 'numeric', month: 'short' });
            
            ui.icon.className = `ph ${getIconClass(current.weather[0].icon)} weather-icon-main`;
            ui.cond.textContent = current.weather[0].description;
            
            ui.sunrise.textContent = formatTime(current.sys.sunrise);
            ui.sunset.textContent = formatTime(current.sys.sunset);
            
            // Wind Direction
            const deg = current.wind.deg;
            const directions = ['N','NE','E','SE','S','SW','W','NW'];
            ui.windDir.textContent = directions[Math.round(deg / 45) % 8];

            applyTheme(current.weather[0].main, current.weather[0].icon);
            updateUIUnits(); // Triggers render of all numbers based on unit state
            renderForecast(forecast.list);
        }

        // --- CHART RENDERING (SVG) ---
        function drawChart(dataPoints) {
            const width = ui.chart.clientWidth || 400;
            const height = 80;
            const padding = 10;
            
            // Get min/max for scaling
            const temps = dataPoints.map(d => getVal(d.main.temp));
            const min = Math.min(...temps) - 2;
            const max = Math.max(...temps) + 2;
            const range = max - min;

            // Generate Points
            const points = temps.map((temp, i) => {
                const x = (i / (temps.length - 1)) * width;
                const y = height - padding - ((temp - min) / range) * (height - (padding * 2));
                return { x, y, temp, time: formatTime(dataPoints[i].dt, true) };
            });

            // Build Path D attribute
            const pathD = points.map((p, i) => (i === 0 ? `M ${p.x} ${p.y}` : `L ${p.x} ${p.y}`)).join(' ');
            
            // Build Area D attribute (for fill)
            const areaD = `${pathD} L ${width} ${height} L 0 ${height} Z`;

            // Generate Circles and Labels
            let circlesAndLabels = '';
            points.forEach((p, i) => {
                // Show every other label to save space, or first and last
                if(i % 2 === 0 || i === points.length -1) {
                    circlesAndLabels += `<text x="${p.x}" y="95" class="chart-label">${p.time}</text>`;
                }
                circlesAndLabels += `<circle cx="${p.x}" cy="${p.y}" class="chart-point"><title>${p.temp}°</title></circle>`;
            });

            ui.chart.innerHTML = `
                <path d="${areaD}" class="chart-area" />
                <path d="${pathD}" class="chart-line" />
                ${circlesAndLabels}
            `;
            
            ui.chartHigh.textContent = `${Math.max(...temps)}°`;
        }

        function renderForecast(list) {
            ui.forecast.innerHTML = '';
            // Filter for one reading per day
            const daily = list.filter((_, i) => i % 8 === 0).slice(0, 5);
            
            daily.forEach(d => {
                const dayName = new Date(d.dt * 1000).toLocaleDateString('en-US', { weekday: 'short' });
                const iconClass = getIconClass(d.weather[0].icon);
                const high = getVal(d.main.temp_max);
                const low = getVal(d.main.temp_min);
                
                const html = `
                    <div class="f-item">
                        <span class="f-day">${dayName}</span>
                        <i class="ph ${iconClass} f-icon"></i>
                        <span class="f-temp">${high}°</span>
                        <span class="f-low">${low}°</span>
                    </div>
                `;
                ui.forecast.insertAdjacentHTML('beforeend', html);
            });
        }

        // --- HELPERS ---
        function getIconClass(code) {
            if(code.includes('01')) return code.includes('n') ? 'ph-moon-stars' : 'ph-sun';
            if(code.includes('02')) return code.includes('n') ? 'ph-cloud-moon' : 'ph-cloud-sun';
            if(code.includes('03') || code.includes('04')) return 'ph-cloud';
            if(code.includes('09') || code.includes('10')) return 'ph-cloud-rain';
            if(code.includes('11')) return 'ph-cloud-lightning';
            if(code.includes('13')) return 'ph-snowflake';
            return 'ph-cloud';
        }

        function formatTime(unix, short = false) {
            const opts = { hour: '2-digit', minute: '2-digit' };
            if(short) opts.hour12 = false;
            return new Date(unix * 1000).toLocaleTimeString('en-US', opts);
        }

        function setGreeting() {
            const hour = new Date().getHours();
            let text = "Good Morning";
            if(hour >= 12 && hour < 17) text = "Good Afternoon";
            else if(hour >= 17) text = "Good Evening";
            ui.greeting.textContent = text;
        }

        function applyTheme(condition, iconCode) {
            const isNight = iconCode.includes('n');
            let className = 'weather-default';
            if (condition.toLowerCase() === 'clear' && !isNight) className = 'weather-sunny';
            else if (condition.toLowerCase().includes('rain')) className = 'weather-rainy';
            else if (condition.toLowerCase().includes('cloud')) className = 'weather-cloudy';
            else if (isNight) className = 'weather-night';
            ui.body.className = `${className} ${ui.body.classList.contains('dark-mode') ? 'dark-mode' : ''}`; // Preserve dark mode if added
            ui.body.classList.remove('weather-sunny', 'weather-cloudy', 'weather-rainy', 'weather-night');
            ui.body.classList.add(className);
        }

        // --- THEME SYSTEM ---
        function toggleTheme() {
            const current = ui.body.getAttribute('data-theme');
            const next = current === 'light' ? 'dark' : 'light';
            ui.body.setAttribute('data-theme', next);
            localStorage.setItem('swissWeatherTheme', next);
            const icon = $('btnTheme').querySelector('i');
            icon.className = next === 'light' ? 'ph ph-moon' : 'ph ph-sun';
        }

        function loadTheme() {
            const saved = localStorage.getItem('swissWeatherTheme') || 'light';
            ui.body.setAttribute('data-theme', saved);
            const icon = $('btnTheme').querySelector('i');
            icon.className = saved === 'light' ? 'ph ph-moon' : 'ph ph-sun';
        }

        // --- GEOLOCATION ---
        function getLocation() {
            if (navigator.geolocation) {
                showLoader(true);
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        fetchWeatherByCoords(pos.coords.latitude, pos.coords.longitude);
                    },
                    () => { showLoader(false); showToast("Location access denied"); }
                );
            } else { showToast("Geolocation not supported"); }
        }

        async function fetchWeatherByCoords(lat, lon) {
            showLoader(true);
            try {
                const res = await fetch(`${BASE_URL}weather?lat=${lat}&lon=${lon}&units=metric&appid=${API_KEY}`);
                const data = await res.json();
                currentCity = { name: data.name, lat: data.coord.lat, lon: data.coord.lon };
                fetchWeather(currentCity.name); 
            } catch(e) { showToast("Error"); showLoader(false); }
        }

        // --- FAVORITES ---
        let favorites = JSON.parse(localStorage.getItem('swissWeatherFavs')) || [];
        function toggleFavoriteUI() {
            const exists = favorites.find(f => f.name.toLowerCase() === currentCity.name.toLowerCase());
            if(exists) { showToast("Already saved"); }
            else {
                favorites.push(currentCity);
                localStorage.setItem('swissWeatherFavs', JSON.stringify(favorites));
                updateFavIconState();
                showToast("Added to favorites");
            }
        }
        function updateFavIconState() {
            const exists = favorites.find(f => f.name.toLowerCase() === currentCity.name.toLowerCase());
            if(exists) ui.favBtn.classList.add('active'); else ui.favBtn.classList.remove('active');
        }

        // --- MAP ---
        function initMap(lat, lon) {
            if (!map) {
                map = L.map('map', { zoomControl: false }).setView([lat, lon], 10);
                L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
                    attribution: '&copy; OpenStreetMap &copy; CARTO'
                }).addTo(map);
            } else { map.setView([lat, lon], 10); }
            if(mapLayer) map.removeLayer(mapLayer);
            mapLayer = L.tileLayer(`https://tile.openweathermap.org/map/clouds_new/{z}/{x}/{y}.png?appid=${API_KEY}`, { opacity: 0.5 }).addTo(map);
            setTimeout(() => map.invalidateSize(), 100);
        }

        // --- UI UTILS ---
        window.openModal = (id) => $(id).classList.add('open');
        window.closeModal = (id) => $(id).classList.remove('open');
        function showLoader(show) { if(show) ui.loader.classList.add('active'); else ui.loader.classList.remove('active'); }
        function showToast(msg) { ui.toast.textContent = msg; ui.toast.classList.add('show'); setTimeout(() => ui.toast.classList.remove('show'), 3000); }
    </script>
</body>
</html>
