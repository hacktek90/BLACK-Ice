<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>WHITEBOARD // MULTI-BOARD SYSTEM</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
/* --- CORE STYLES (NEO-BRUTALIST / BLUE THEME) --- */
:root {
    --bg: #F0F4F8; /* Light blue-grey background */
    --fg: #0F172A; /* Deep slate text */
    --accent: #2563EB; /* Electric Blue */
    --grid-color: rgba(15, 23, 42, 0.08);
    --border-width: 2px;
}

* { box-sizing: border-box; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }

body {
    margin: 0;
    background-color: var(--bg);
    color: var(--fg);
    height: 100vh;
    overflow: hidden;
    /* Brutalist Grid Background */
    background-image: 
        linear-gradient(var(--grid-color) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
    background-size: 60px 60px;
}

/* --- BENTO MODE SELECTOR UI (BRUTALIST) --- */
.modal {
    position: fixed;
    inset: 0;
    background: rgba(240, 244, 248, 0.95); /* Solid-ish background */
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
}

.card-container {
    width: 90%;
    max-width: 800px;
    border: var(--border-width) solid var(--fg);
    background: var(--bg);
    box-shadow: 15px 15px 0px var(--fg); /* Hard shadow */
    padding: 0; /* Reset padding for grid layout */
    text-align: left;
}

.modal-header {
    padding: 2rem;
    border-bottom: var(--border-width) solid var(--fg);
    background: var(--fg);
    color: var(--bg);
}

.modal-title {
    font-size: 3rem;
    font-weight: 900;
    margin: 0;
    line-height: 0.9;
    text-transform: uppercase;
    letter-spacing: -0.03em;
}

.modal-subtitle {
    font-family: 'Courier New', Courier, monospace;
    color: var(--accent);
    margin-top: 1rem;
    font-size: 0.9rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
}

.bento-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    /* Removed gap to use borders for separation */
}

/* Interactive Cards */
.bento-card {
    background: var(--bg);
    padding: 3rem 2rem;
    cursor: pointer;
    transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    height: 300px;
    border-right: var(--border-width) solid var(--fg); /* Vertical divider */
}

.bento-card:last-child {
    border-right: none;
}

.bento-card:hover {
    background: var(--accent);
    color: white;
}

.bento-card:hover .card-desc { color: rgba(255,255,255,0.8); }
.bento-card:hover .arrow-icon { filter: invert(1); transform: rotate(0deg); }

/* Typography inside cards */
.card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
}

.card-icon { 
    font-size: 2rem; 
    margin-bottom: 1rem;
    filter: grayscale(100%);
}

.card-name { 
    font-size: 2rem; 
    font-weight: 800; 
    text-transform: uppercase;
    line-height: 0.9;
    margin-bottom: 1rem;
}

.card-desc { 
    font-size: 0.9rem; 
    color: rgba(15, 23, 42, 0.6); 
    line-height: 1.4; 
    font-weight: 500;
    max-width: 80%;
}

.arrow-icon {
    width: 40px; height: 40px;
    border: 2px solid currentColor;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.2rem;
    transform: rotate(-45deg);
    transition: transform 0.2s;
    align-self: flex-end;
}

.footer-text {
    border-top: var(--border-width) solid var(--fg);
    padding: 1rem 2rem;
    font-size: 0.75rem;
    color: var(--fg);
    font-family: 'Courier New', Courier, monospace;
    text-transform: uppercase;
    opacity: 0.7;
    background: var(--bg);
}

/* --- VISIBILITY FIX: SMOKED GLASS BUTTON (Retained logic, updated style) --- */
.close-btn-smoked {
    position: fixed;
    top: 24px; left: 24px; z-index: 2000;
    width: 60px; height: 60px;
    display: none; align-items: center; justify-content: center;
    font-size: 1.6rem;
    
    /* Updated Style: Hard Square, High Contrast */
    background: var(--fg);
    color: var(--bg);
    border: 2px solid var(--bg);
    box-shadow: 6px 6px 0px var(--accent);
    
    cursor: grab;
    transition: transform 0.1s;
    font-weight: 900;
    user-select: none;
}

.close-btn-smoked:hover {
    transform: translate(-2px, -2px);
    box-shadow: 8px 8px 0px var(--accent);
}

.close-btn-smoked:active { 
    transform: translate(2px, 2px);
    box-shadow: 2px 2px 0px var(--accent);
}

/* Utility */
.grabbing { cursor: grabbing !important; }

.frame, .preload { position: fixed; inset: 0; width: 100%; height: 100%; border: none; }
.frame { display: none; z-index: 10; }
.preload { opacity: 0; pointer-events: none; z-index: -1; }

@media (max-width: 768px) {
    .bento-grid { grid-template-columns: 1fr; }
    .bento-card { height: auto; padding: 2rem; border-right: none; border-bottom: var(--border-width) solid var(--fg); }
    .bento-card:last-child { border-bottom: none; }
    .modal-title { font-size: 2rem; }
    .card-container { width: 95%; box-shadow: 8px 8px 0px var(--fg); }
}
</style>
</head>
<body>

<!-- High Contrast 'Close/Menu' Button -->
<div class="close-btn-smoked" id="closeBtn">✕</div>

<!-- IFrames -->
<iframe class="preload" src="https://excalidraw.com"></iframe>
<iframe class="preload" src="https://www.tldraw.com"></iframe>
<iframe class="frame" id="excalidrawFrame" src="https://excalidraw.com"></iframe>
<iframe class="frame" id="tldrawFrame" src="https://www.tldraw.com"></iframe>

<!-- Brutalist Modal -->
<div class="modal" id="modeModal">
    <div class="card-container">
        <div class="modal-header">
            <h1 class="modal-title">System<br>Select</h1>
            <p class="modal-subtitle">/// Choose Drawing Engine</p>
        </div>
        
        <div class="bento-grid">
            <!-- Excalidraw Card -->
            <div class="bento-card excalidraw" onclick="showBoard('excalidraw')">
                <div class="card-top">
                    <div class="card-icon">✏️</div>
                    <div class="arrow-icon">→</div>
                </div>
                <div>
                    <div class="card-name">Excalidraw</div>
                    <div class="card-desc">Hand-drawn style for rapid brainstorming & sketching.</div>
                </div>
            </div>

            <!-- Tldraw Card -->
            <div class="bento-card tldraw" onclick="showBoard('tldraw')">
                <div class="card-top">
                    <div class="card-icon">📐</div>
                    <div class="arrow-icon">→</div>
                </div>
                <div>
                    <div class="card-name">tldraw</div>
                    <div class="card-desc">Infinite vector canvas with sticky notes & smart shapes.</div>
                </div>
            </div>
        </div>
        
        <div class="footer-text">
            [DRAG X BUTTON TO MOVE] • [TAP TO SWITCH ENGINE]
        </div>
    </div>
</div>

<script>
    function showBoard(type) {
        document.getElementById("modeModal").style.display = "none";
        const closeBtn = document.getElementById("closeBtn");
        closeBtn.style.display = "flex";
        
        const excal = document.getElementById("excalidrawFrame");
        const tld = document.getElementById("tldrawFrame");
        
        excal.style.display = "none";
        tld.style.display = "none";
        
        if (type === "excalidraw") excal.style.display = "block";
        if (type === "tldraw") tld.style.display = "block";
    }

    function showMenu() {
        document.getElementById("modeModal").style.display = "flex";
        document.getElementById("closeBtn").style.display = "none";
        document.getElementById("excalidrawFrame").style.display = "none";
        document.getElementById("tldrawFrame").style.display = "none";
    }

    /* DRAG LOGIC REUSED */
    const closeBtn = document.getElementById("closeBtn");
    let isDragging = false;
    let hasMoved = false;
    let startX, startY, offsetX, offsetY;
    const DRAG_THRESHOLD = 5;

    // Mouse Events
    closeBtn.addEventListener("mousedown", (e) => {
        isDragging = true; hasMoved = false;
        closeBtn.classList.add("grabbing");
        startX = e.clientX; startY = e.clientY;
        offsetX = e.clientX - closeBtn.offsetLeft;
        offsetY = e.clientY - closeBtn.offsetTop;
        e.preventDefault();
    });

    document.addEventListener("mousemove", (e) => {
        if (!isDragging) return;
        const dx = Math.abs(e.clientX - startX);
        const dy = Math.abs(e.clientY - startY);
        if (dx > DRAG_THRESHOLD || dy > DRAG_THRESHOLD) hasMoved = true;
        
        if (hasMoved) {
            closeBtn.style.left = (e.clientX - offsetX) + "px";
            closeBtn.style.top = (e.clientY - offsetY) + "px";
        }
    });

    document.addEventListener("mouseup", () => {
        if (isDragging && !hasMoved) showMenu();
        isDragging = false; hasMoved = false;
        closeBtn.classList.remove("grabbing");
    });

    // Touch Events
    closeBtn.addEventListener("touchstart", (e) => {
        isDragging = true; hasMoved = false;
        const t = e.touches[0];
        startX = t.clientX; startY = t.clientY;
        offsetX = t.clientX - closeBtn.offsetLeft;
        offsetY = t.clientY - closeBtn.offsetTop;
    }, { passive: true });

    document.addEventListener("touchmove", (e) => {
        if (!isDragging) return;
        const t = e.touches[0];
        const dx = Math.abs(t.clientX - startX);
        const dy = Math.abs(t.clientY - startY);
        if (dx > DRAG_THRESHOLD || dy > DRAG_THRESHOLD) hasMoved = true;

        if (hasMoved) {
            closeBtn.style.left = (t.clientX - offsetX) + "px";
            closeBtn.style.top = (t.clientY - offsetY) + "px";
        }
    }, { passive: true });

    document.addEventListener("touchend", () => {
        if (isDragging && !hasMoved) showMenu();
        isDragging = false; hasMoved = false;
    });
</script>
</body>
</html>
