<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />

  <title>Online Whiteboard – Instant Drawing Board</title>
  <meta name="description" content="Instant online whiteboard powered by Excalidraw and tldraw." />
  <meta name="keywords" content="online whiteboard, excalidraw, tldraw, drawing board" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }

    body {
      margin: 0;
      background: radial-gradient(circle at top, #020617, #000);
      color: white;
      height: 100vh;
      overflow: hidden;
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 23, 0.85);
      backdrop-filter: blur(16px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .card {
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid rgba(148, 163, 184, 0.15);
      padding: 26px 22px;
      width: 92%;
      max-width: 440px;
      border-radius: 24px;
      text-align: center;
      box-shadow: 0 40px 100px rgba(0,0,0,0.6);
    }

    .card h1 {
      font-size: 1.4rem;
      margin-bottom: 10px;
      letter-spacing: 0.4px;
    }

    .subtitle {
      font-size: 0.9rem;
      color: #94a3b8;
      margin-bottom: 18px;
      line-height: 1.4;
    }

    .btn {
      width: 100%;
      padding: 16px;
      margin: 10px 0;
      border: none;
      border-radius: 16px;
      font-size: 1rem;
      cursor: pointer;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      color: white;
      transition: transform 0.15s ease;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .powered {
      margin-top: 14px;
      font-size: 0.8rem;
      color: #64748b;
      line-height: 1.4;
    }

    .close-btn {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 2000;
      width: 44px;
      height: 44px;
      border-radius: 14px;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      cursor: pointer;
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid rgba(148, 163, 184, 0.18);
      backdrop-filter: blur(10px);
    }

    .frame {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100vh;
      border: none;
      display: none;
      z-index: 10;
    }

    .preload {
      position: fixed;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
      z-index: -1;
    }
  </style>
</head>
<body>

<div class="close-btn" id="closeBtn" onclick="showMenu()">✕</div>

<!-- Preload -->
<iframe class="preload" src="https://excalidraw.com"></iframe>
<iframe class="preload" src="https://www.tldraw.com"></iframe>

<iframe class="frame" id="excalidrawFrame" src="https://excalidraw.com"></iframe>
<iframe class="frame" id="tldrawFrame" src="https://www.tldraw.com"></iframe>

<!-- Mode Selector -->
<div class="modal" id="modeModal">
  <div class="card">
    <h1>Online Whiteboard</h1>
    <div class="subtitle">
      Choose your drawing engine to get started
    </div>

    <button class="btn" onclick="showBoard('excalidraw')">
      Excalidraw Board
    </button>
    <button class="btn" onclick="showBoard('tldraw')">
      tldraw Board
    </button>

    <div class="powered">
      This tool acts as a launcher interface only.<br>
      Full drawing experience is powered by Excalidraw and tldraw.
    </div>
  </div>
</div>

<script>
function showBoard(type){
  document.getElementById("modeModal").style.display = "none";
  document.getElementById("closeBtn").style.display = "flex";

  const excal = document.getElementById("excalidrawFrame");
  const tld = document.getElementById("tldrawFrame");

  excal.style.display = "none";
  tld.style.display = "none";

  if(type === "excalidraw") excal.style.display = "block";
  if(type === "tldraw") tld.style.display = "block";
}

function showMenu(){
  document.getElementById("modeModal").style.display = "flex";
  document.getElementById("closeBtn").style.display = "none";

  document.getElementById("excalidrawFrame").style.display = "none";
  document.getElementById("tldrawFrame").style.display = "none";
}
</script>

</body>
</html>
