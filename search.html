<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <!-- SEO Core -->
  <title>Search | BlackICE Academy</title>
  <meta name="description" content="Search cybersecurity labs, CTF challenges, and learning resources on BlackICE Academy.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Keep this for search pages -->
  <meta name="robots" content="noindex, follow">

  <!-- Canonical -->
  <link rel="canonical" href="https://blackice-ac.vercel.app/search">

  <!-- Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;600&display=swap" rel="stylesheet">

  <!-- Algolia -->
  <script src="https://cdn.jsdelivr.net/npm/algoliasearch@4"></script>

  <style>
    body {
      margin: 0;
      font-family: 'Inter Tight', sans-serif;
      background: #ffffff;
      color: #111;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 640px;
      margin-top: 100px;
      padding: 20px;
    }

    h1 {
      font-size: 26px;
      font-weight: 600;
      margin-bottom: 24px;
    }

    .search-bar {
      display: flex;
      border: 1px solid #e5e5e5;
      border-radius: 6px;
      overflow: hidden;
    }

    input {
      flex: 1;
      padding: 12px;
      border: none;
      outline: none;
      font-size: 14px;
    }

    button {
      padding: 0 16px;
      border: none;
      background: #111;
      color: white;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.85;
    }

    .status {
      margin-top: 12px;
      font-size: 13px;
      color: #777;
    }

    .results {
      margin-top: 24px;
    }

    .card {
      padding: 14px 0;
      border-bottom: 1px solid #f0f0f0;
    }

    .card h3 {
      margin: 0 0 4px;
      font-size: 17px;
    }

    .card p {
      margin: 0;
      font-size: 13px;
      color: #666;
    }

    .no-results {
      color: #999;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>Search</h1>

    <div class="search-bar">
      <input id="searchInput" type="text" placeholder="Search articles..." aria-label="Search">
      <button onclick="performSearch()">Search</button>
    </div>

    <div class="status" id="status"></div>
    <div class="results" id="results"></div>
  </main>

  <script>
    const client = algoliasearch('32XIY8ASEP', '9cbdb11ece674b4ff5d0b923ac738745');
    const index = client.initIndex('blacice_vercel_blog_pages');

    async function performSearch() {
      const query = document.getElementById('searchInput').value.trim();
      const resultsDiv = document.getElementById('results');
      const statusDiv = document.getElementById('status');

      if (!query) {
        resultsDiv.innerHTML = "";
        statusDiv.innerText = "Type something to search...";
        return;
      }

      statusDiv.innerText = "Searching...";
      resultsDiv.innerHTML = "";

      try {
        const { hits } = await index.search(query);

        if (hits.length === 0) {
          statusDiv.innerText = "";
          resultsDiv.innerHTML = '<p class="no-results">No results found.</p>';
          return;
        }

        statusDiv.innerText = hits.length + " result(s) found";

        resultsDiv.innerHTML = hits.map(hit => `
          <div class="card">
            <h3>${hit.title || "Untitled"}</h3>
            <p>${hit.description || ""}</p>
          </div>
        `).join('');

      } catch (error) {
        statusDiv.innerText = "Error fetching results.";
        console.error(error);
      }
    }

    // Enter key support
    document.getElementById("searchInput").addEventListener("keypress", function(e) {
      if (e.key === "Enter") {
        performSearch();
      }
    });
  </script>
</body>
</html>
