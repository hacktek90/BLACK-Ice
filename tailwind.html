<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Frontend reCAPTCHA Popup</title>

  <!-- Load reCAPTCHA v3 -->
  <script src="https://www.google.com/recaptcha/api.js?render=6LfiE74sAAAAAHKTfyy99FUIZBCjRYrOZ7gGA7AL"></script>

  <style>
    body {
      font-family: Arial;
      text-align: center;
      margin-top: 100px;
    }

    button {
      padding: 12px 24px;
      font-size: 16px;
      cursor: pointer;
    }

    .overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
    }

    .popup {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #fff;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>

  <h2>Protected Popup (Frontend Only)</h2>
  <button onclick="handleClick()">Open Popup</button>

  <div class="overlay" id="overlay"></div>

  <div class="popup" id="popup">
    <h3>Access Granted ✅</h3>
    <p>reCAPTCHA token generated successfully.</p>
    <button onclick="closePopup()">Close</button>
  </div>

  <script>
    function openPopup() {
      document.getElementById("overlay").style.display = "block";
      document.getElementById("popup").style.display = "block";
    }

    function closePopup() {
      document.getElementById("overlay").style.display = "none";
      document.getElementById("popup").style.display = "none";
    }

    function handleClick() {
      grecaptcha.ready(function() {
        grecaptcha.execute('6LfiE74sAAAAAHKTfyy99FUIZBCjRYrOZ7gGA7AL', { action: 'popup_access' })
          .then(function(token) {

            console.log("Token:", token);

            // Frontend-only check (NOT secure)
            if (token && token.length > 10) {
              openPopup();
            } else {
              alert("Verification failed ❌");
            }

          })
          .catch(() => {
            alert("reCAPTCHA error ❌");
          });
      });
    }
  </script>

</body>
</html>
