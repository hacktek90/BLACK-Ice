<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Badass Overlay 2.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #0d0d0d;
            font-family: 'Anton', sans-serif;
            overflow: hidden;
            perspective: 1000px; /* Essential for 3D effect */
        }

        .container {
            position: relative;
            max-width: 90%;
            max-height: 85vh;
            border: 4px solid #fff;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out;
            background: #000;
        }

        .container img {
            display: block;
            width: 100%;
            height: auto;
            max-height: 80vh;
            object-fit: cover;
            /* Darken image slightly to make text pop */
            filter: brightness(0.7) contrast(1.1) grayscale(0.2); 
            pointer-events: none;
        }

        /* Scanline texture */
        .scanlines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                to bottom,
                transparent 0px,
                transparent 2px,
                rgba(0, 0, 0, 0.3) 3px
            );
            pointer-events: none;
            z-index: 2;
        }

        .overlay-text {
            position: absolute;
            top: 50%;
            left: 50%;
            /* transform is handled by JS now, initial centering done via margins/position logic in JS or preserved here */
            transform: translate(-50%, -50%); 
            
            color: #ffffff;
            font-size: clamp(3rem, 10vw, 8rem);
            text-transform: uppercase;
            text-align: center;
            line-height: 0.9;
            white-space: nowrap;
            z-index: 10;
            
            /* 3D Settings */
            transform-style: preserve-3d;
            will-change: transform;
            
            /* Initial Shadow */
            text-shadow: 
                4px 4px 0px #000,
                0px 0px 20px rgba(255, 255, 255, 0.2);
            
            cursor: default;
        }

        .highlight {
            color: #ff3333;
            position: relative;
            display: inline-block;
            text-shadow: 
                3px 3px 0px #000,
                0 0 15px rgba(255, 51, 51, 0.8),
                0 0 30px rgba(255, 51, 51, 0.4);
        }

        /* Glitch Animation Keyframes */
        @keyframes glitch-skew {
            0% { transform: skew(0deg); }
            20% { transform: skew(-2deg); }
            40% { transform: skew(2deg); }
            60% { transform: skew(-1deg); }
            80% { transform: skew(1deg); }
            100% { transform: skew(0deg); }
        }

        /* Hover interaction */
        .container:hover .highlight {
            animation: glitch-skew 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94) both infinite;
            color: #ff0000;
            text-shadow: 
                4px 4px 0px #000,
                -2px -2px 0px #00ffff, /* Cyan offset */
                0 0 20px rgba(255, 0, 0, 1);
        }

        .gradient-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, transparent 0%, rgba(0,0,0,0.8) 100%);
            pointer-events: none;
            z-index: 1;
        }

    </style>
</head>
<body>

    <div class="container" id="card">
        <div class="scanlines"></div>
        <img src="http://tmpfiles.org/dl/17329839/606613145_18100826005800879_4109660569057404324_n.jpg" alt="Badass Photo">
        <div class="gradient-overlay"></div>
        
        <div class="overlay-text" id="title">
            I am<br>
            <span class="highlight">Fucking</span> Badass
        </div>
    </div>

    <script>
        const card = document.getElementById('card');
        const title = document.getElementById('title');

        // Config for sensitivity
        const limit = 20; // Max rotation degrees
        const sensitivity = 20; // Lower is more sensitive

        card.addEventListener('mousemove', (e) => {
            // Get dimensions
            const rect = card.getBoundingClientRect();
            const x = e.clientX - rect.left; // x position within the element.
            const y = e.clientY - rect.top;  // y position within the element.
            
            // Calculate center
            const centerX = rect.width / 2;
            const centerY = rect.height / 2;

            // Calculate rotation (dy controls X rotation, dx controls Y rotation)
            const rotateX = ((y - centerY) / centerY) * -limit;
            const rotateY = ((x - centerX) / centerX) * limit;

            // Apply style to Title (Text pops out more)
            title.style.transform = `translate(-50%, -50%) perspective(500px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) translateZ(50px)`;
            
            // Optional: Subtle movement for the container itself
            card.style.transform = `perspective(1000px) rotateX(${rotateX / 2}deg) rotateY(${rotateY / 2}deg)`;
        });

        // Reset on mouse leave
        card.addEventListener('mouseleave', () => {
            title.style.transform = `translate(-50%, -50%) perspective(500px) rotateX(0deg) rotateY(0deg) translateZ(0px)`;
            card.style.transform = `perspective(1000px) rotateX(0deg) rotateY(0deg)`;
        });
    </script>

</body>
</html>
